<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Data Collector</title>
<script>
  /* Apply saved/system theme before paint to avoid flash */
  (function(){
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme','dark');
      }
    } catch(e){}
  })();
</script>
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --bg-2:#f8fafc; --hover:#eef2f7;
    --text:#1a2233; --muted:#68758a; --border:#e2e8f0;
    --primary:#2563eb; --primary-2:#1d4ed8;
    --danger:#dc2626; --danger-2:#b91c1c; --warn:#d97706; --ok:#16a34a;
    --zero:#cbd5e1;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  [data-theme="dark"]{
    --bg:#0f172a; --card:#1e293b; --bg-2:#172033; --hover:#2a3648;
    --text:#e2e8f0; --muted:#94a3b8; --border:#334155;
    --primary:#3b82f6; --primary-2:#2563eb;
    --danger:#ef4444; --danger-2:#dc2626; --warn:#f59e0b; --ok:#22c55e;
    --zero:#475569;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    transition:background .2s, color .2s;}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit;color:inherit}

  .app-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
    padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);
    box-shadow:var(--shadow);}
  .app-title{font-weight:600;font-size:16px;flex:1;display:flex;align-items:center;gap:8px}
  .app-actions{display:flex;gap:6px;align-items:center}

  .btn{background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:7px 12px;border-radius:8px;transition:.15s;white-space:nowrap;}
  .btn:hover:not(:disabled){background:var(--hover)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--primary-2)}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn-danger:hover:not(:disabled){background:var(--danger-2)}
  .btn-icon{background:transparent;border:1px solid transparent;padding:6px 8px;
    border-radius:8px;font-size:16px;line-height:1}
  .btn-icon:hover{background:var(--hover)}

  .badge{background:#fff;color:var(--primary);border-radius:10px;padding:1px 7px;
    font-size:11px;font-weight:600;margin-left:4px}
  .btn-primary .badge{background:#fff;color:var(--primary)}

  main{padding:14px;max-width:1100px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:16px;box-shadow:var(--shadow);margin-bottom:14px;
    transition:background .2s, border-color .2s}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row.spread{justify-content:space-between}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  h2{margin:0 0 10px;font-size:16px}
  h3{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}

  .banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
    padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .banner.info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
  .banner.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
  [data-theme="dark"] .banner{background:#3b2818;border-color:#7c4a1e;color:#fed7aa}
  [data-theme="dark"] .banner.info{background:#1e3a5f;border-color:#2d5f8e;color:#93c5fd}
  [data-theme="dark"] .banner.ok{background:#14371f;border-color:#1e6b3a;color:#86efac}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  th{background:var(--bg-2);font-weight:600;color:var(--muted);font-size:12px;
    text-transform:uppercase;letter-spacing:.3px}
  tr.clickable{cursor:pointer}
  tr.clickable:hover{background:var(--hover)}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .dot.pending{background:#f59e0b}
  .dot.synced{background:var(--ok)}
  .dot.error{background:var(--danger)}

  form .field{margin-bottom:12px;display:flex;flex-direction:column;gap:4px}
  form label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  form select,form input{padding:9px 11px;border:1px solid var(--border);border-radius:8px;
    background:var(--card);width:100%;max-width:100%}
  form select:focus,form input:focus{outline:none;border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}

  .modal-back{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;
    align-items:center;justify-content:center;padding:16px;z-index:100;backdrop-filter:blur(2px)}
  .modal{background:var(--card);color:var(--text);border-radius:14px;max-width:640px;width:100%;
    max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
  .modal.wide{max-width:900px}
  .modal-head{padding:16px;border-bottom:1px solid var(--border);font-weight:600;font-size:16px}
  .modal-body{padding:16px;overflow:auto}
  .modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;
    justify-content:flex-end;flex-wrap:wrap}

  #toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{background:#111827;color:#fff;padding:10px 14px;border-radius:10px;
    font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:auto;
    display:flex;align-items:center;gap:12px;max-width:90vw}
  .toast.warn{background:#b45309}
  .toast.error{background:#b91c1c}
  .toast.ok{background:#166534}
  .toast button{background:transparent;border:1px solid rgba(255,255,255,.5);
    color:#fff;border-radius:6px;padding:4px 8px;font-size:12px}

  .kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
  .kv .k{color:var(--muted)}
  code,pre{font-family:ui-monospace,Menlo,Consolas,monospace}
  pre.snippet{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:10px;
    font-size:12px;overflow:auto;max-height:340px;line-height:1.5;white-space:pre}

  .stat{display:flex;flex-direction:column;padding:10px 12px;background:var(--bg-2);
    border-radius:10px;border:1px solid var(--border);flex:1;min-width:110px}
  .stat .v{font-size:20px;font-weight:600}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

  details{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;
    padding:10px 14px;margin-top:10px}
  summary{cursor:pointer;font-weight:600;font-size:13px}
  details[open] summary{margin-bottom:10px}

  .empty{text-align:center;padding:40px 20px;color:var(--muted)}

  .tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow)}
  .tab{flex:1;text-align:center;padding:9px 14px;border-radius:8px;text-decoration:none;
    color:var(--text);font-weight:500;font-size:13px;transition:.15s}
  .tab:hover{background:var(--hover)}
  .tab.active{background:var(--primary);color:#fff}
  .tab.active:hover{background:var(--primary-2)}

  .bar-row{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;
    padding:5px 0;font-size:13px}
  .bar-label{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{background:var(--bg-2);border-radius:5px;height:18px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);
    border-radius:5px;transition:width .3s}
  [data-theme="dark"] .bar-fill{background:linear-gradient(90deg,#3b82f6,#1d4ed8)}
  .bar-value{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
  @media(max-width:560px){
    .bar-row{grid-template-columns:110px 1fr 80px;font-size:12px}
  }

  .ct-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}
  .ct-table{width:100%;border-collapse:collapse;font-size:13px}
  .ct-table th,.ct-table td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
  .ct-table th:first-child,.ct-table td:first-child{text-align:left;font-weight:500;
    position:sticky;left:0;background:var(--card);z-index:1}
  .ct-table thead th{background:var(--bg-2);color:var(--muted);font-size:11px;
    text-transform:uppercase;letter-spacing:.3px;font-weight:600}
  .ct-table thead th:first-child{background:var(--bg-2)}
  .ct-table tbody tr:hover td{background:var(--hover)}
  .ct-table tbody tr:hover td:first-child{background:var(--hover)}
  .ct-table .total-col{background:var(--bg-2);font-weight:600}
  .ct-table .total-row td{background:var(--bg-2);font-weight:600}
  .ct-table .zero{color:var(--zero)}

  /* Import preview row tints adapt to dark */
  [data-theme="dark"] .row-new{background:rgba(34,197,94,.08) !important}
  [data-theme="dark"] .row-dup{background:rgba(245,158,11,.1) !important}
  [data-theme="dark"] .row-bad{background:rgba(239,68,68,.1) !important}

  /* Global error / fatal screen */
  .fatal{padding:40px 20px;text-align:center;max-width:520px;margin:60px auto}
  .fatal h2{font-size:20px;margin-bottom:12px}
  .fatal p{color:var(--muted);margin-bottom:16px}

  @media(max-width:560px){
    .app-title span.t{display:none}
    .btn{padding:7px 10px}
  }

  /* Print */
  @media print {
    .app-bar, .tabs, #toast-root, .modal-back, .no-print { display: none !important; }
    body, main { background: #fff !important; color: #000 !important; }
    .card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; page-break-inside: avoid; }
    .bar-fill { background: #2563eb !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .stat, .ct-table thead th, .ct-table .total-col, .ct-table .total-row td { background: #f5f5f5 !important; }
  }
</style>
</head>
<body>

<header class="app-bar">
  <div class="app-title">
    <span>🎓</span><span class="t">Student Data Collector</span>
  </div>
  <div class="app-actions">
    <button id="btnPush" class="btn btn-primary" title="Push local changes">Push<span class="badge" id="pushBadge" hidden>0</span></button>
    <button id="btnPull" class="btn" title="Pull from Google Sheet">Pull</button>
    <button id="btnTheme" class="btn-icon" title="Toggle theme">🌙</button>
    <button id="btnSettings" class="btn-icon" title="Settings">⚙</button>
  </div>
</header>

<main id="view"></main>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script>
/* ==================== CONSTANTS ==================== */
const GRADES = ['Nursery','KG1','KG2','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','JHS1','JHS2','JHS3','SHS1','SHS2','SHS3'];
const GENDERS = ['Male','Female'];
const RESIDENCES = ['Day','Boarder'];
const TRANSPORTS = ['Bus','Parents','Guardian'];
const REFERRALS = ['Referral','TikTok','Facebook','Instagram','YouTube','WhatsApp','Banner Ad','Radio','TV','Flyer','Church/Mosque','Family','Friend','Walk-in','Other'];
const HEADERS = ['StudentID','Grade','Gender','Residence','Transport','ReferralSource'];
const SHEETJS_CDN = 'https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js';

/* ==================== THEME ==================== */
function currentTheme(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
function applyTheme(theme){
  if(theme === 'dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('theme', theme); } catch(e){}
  const btn = document.getElementById('btnTheme');
  if(btn){ btn.textContent = theme === 'dark' ? '☀️' : '🌙'; btn.title = theme === 'dark' ? 'Switch to light' : 'Switch to dark'; }
}
function toggleTheme(){ applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'); }

/* ==================== INDEXEDDB ==================== */
const DB_NAME = 'studentapp', DB_VERSION = 1;
let db;

function openDB(){
  return new Promise((res, rej) => {
    if(!window.indexedDB){ rej(new Error('IndexedDB not available')); return; }
    let r;
    try { r = indexedDB.open(DB_NAME, DB_VERSION); }
    catch(e){ rej(e); return; }
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('students')){
        const s = d.createObjectStore('students', { keyPath:'studentId' });
        s.createIndex('by_syncStatus','syncStatus');
        s.createIndex('by_deleted','deleted');
        s.createIndex('by_grade','grade');
        s.createIndex('by_referralSource','referralSource');
      }
      if(!d.objectStoreNames.contains('students_backup')){
        d.createObjectStore('students_backup', { keyPath:'snapshotId', autoIncrement:true });
      }
      if(!d.objectStoreNames.contains('settings')){
        d.createObjectStore('settings', { keyPath:'key' });
      }
    };
    r.onsuccess = e => { db = e.target.result; res(db); };
    r.onerror = e => rej(e.target.error || new Error('DB open failed'));
    r.onblocked = () => rej(new Error('Database blocked — close other tabs of this app'));
  });
}
function store(name, mode='readonly'){ return db.transaction(name, mode).objectStore(name); }
function req(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

async function getAllStudents(){ return req(store('students').getAll()); }
async function getStudent(id){ return req(store('students').get(id)); }
async function putStudent(s){ return req(store('students','readwrite').put(s)); }
async function deleteStudent(id){ return req(store('students','readwrite').delete(id)); }
async function clearStudents(){ return req(store('students','readwrite').clear()); }
async function getAllSnapshots(){ return req(store('students_backup').getAll()); }
async function getSnapshot(id){ return req(store('students_backup').get(id)); }
async function addSnapshot(reason, records){
  return req(store('students_backup','readwrite').add({ takenAt: Date.now(), reason, records }));
}
async function deleteSnapshot(id){ return req(store('students_backup','readwrite').delete(id)); }

async function getSetting(key, def){
  try {
    const r = await req(store('settings').get(key));
    return r ? r.value : def;
  } catch(e){ return def; }
}
async function setSetting(key, value){
  return req(store('settings','readwrite').put({ key, value }));
}
async function allSettings(){
  const arr = await req(store('settings').getAll());
  return Object.fromEntries(arr.map(r => [r.key, r.value]));
}

/* ==================== UTILITIES ==================== */
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad4(n){ return String(n).padStart(4,'0'); }
function fmtTime(ms){ return ms ? new Date(ms).toLocaleString() : '—'; }
function chunk(arr, n){ const out=[]; for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; }
function download(name, blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function today(){ return new Date().toISOString().slice(0,10); }

/* Serialize ID generation to avoid races on rapid adds */
let idLock = Promise.resolve();
function nextStudentId(){
  idLock = idLock.then(async () => {
    let counter = await getSetting('idCounter', 0);
    let id;
    let guard = 0;
    do {
      counter++;
      id = 'STU-' + pad4(counter);
      guard++;
      if(guard > 100000) throw new Error('ID generation exhausted');
      const exists = await getStudent(id);
      if (!exists) break;
    } while(true);
    await setSetting('idCounter', counter);
    return id;
  });
  return idLock;
}
async function syncCounterFromStudents(){
  const all = await getAllStudents();
  let max = 0;
  for(const s of all){
    const m = /^STU-(\d+)$/.exec(s.studentId || '');
    if(m) max = Math.max(max, parseInt(m[1],10));
  }
  const cur = await getSetting('idCounter', 0);
  if(max > cur) await setSetting('idCounter', max);
}
async function pruneSnapshots(keep=5){
  const all = await getAllSnapshots();
  all.sort((a,b)=>b.takenAt - a.takenAt);
  for(let i=keep;i<all.length;i++) await deleteSnapshot(all[i].snapshotId);
}

/* ==================== TOAST / MODAL ==================== */
function toast(msg, opts={}){
  const { type='', duration=3500, action } = opts;
  const root = document.getElementById('toast-root');
  // Cap visible toasts at 3
  while(root.children.length >= 3) root.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if(action){
    const b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = () => { try { action.onClick(); } finally { el.remove(); } };
    el.appendChild(b);
  }
  root.appendChild(el);
  if(duration) setTimeout(() => el.remove(), duration);
  return el;
}

function showModal({ title, body, actions = [], wide = false }){
  hideModal();
  const root = document.getElementById('modal-root');
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.onclick = e => { if(e.target === back) hideModal(); };
  const m = document.createElement('div');
  m.className = 'modal' + (wide ? ' wide' : '');
  m.innerHTML = `
    <div class="modal-head">${esc(title)}</div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot"></div>
  `;
  const foot = m.querySelector('.modal-foot');
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = a.class || 'btn';
    b.textContent = a.label;
    b.onclick = () => a.onClick ? a.onClick() : hideModal();
    foot.appendChild(b);
  });
  back.appendChild(m);
  root.appendChild(back);
  document.addEventListener('keydown', escClose);
  return m;
}
function escClose(e){ if(e.key === 'Escape') hideModal(); }
function hideModal(){
  document.getElementById('modal-root').innerHTML = '';
  document.removeEventListener('keydown', escClose);
}

/* ==================== STATE ==================== */
const state = {
  students: [],
  settings: {},
  filters: { grade:'', gender:'', residence:'', referral:'', q:'' },
  busy: false,
};

async function loadState(){
  state.students = (await getAllStudents()).filter(s => !s.deleted)
    .sort((a,b) => (a.studentId < b.studentId ? -1 : 1));
  state.settings = await allSettings();
}
function currentFiltered(){
  const f = state.filters;
  let list = state.students;
  if(f.grade)    list = list.filter(s => s.grade === f.grade);
  if(f.gender)   list = list.filter(s => s.gender === f.gender);
  if(f.residence)list = list.filter(s => s.residence === f.residence);
  if(f.referral) list = list.filter(s => s.referralSource === f.referral);
  if(f.q){
    const q = f.q.toLowerCase();
    list = list.filter(s => Object.values(s).some(v => String(v).toLowerCase().includes(q)));
  }
  return list;
}

/* ==================== ROUTER ==================== */
function currentRoute(){
  const h = (location.hash || '').replace(/^#/, '') || '/list';
  const parts = h.split('/').filter(Boolean);
  return { name: parts[0] || 'list', param: parts[1] || '' };
}
function go(hash){ if(location.hash === hash) render(); else location.hash = hash; }
window.addEventListener('hashchange', () => { render().catch(handleFatal); });

async function render(){
  const r = currentRoute();
  const view = document.getElementById('view');
  if(r.name === 'add')      return renderAdd(view);
  if(r.name === 'edit')     return renderEdit(view, r.param);
  if(r.name === 'trash')    return renderTrash(view);
  if(r.name === 'snapshots')return renderSnapshots(view);
  if(r.name === 'settings') return renderSettings(view);
  if(r.name === 'summary')  return renderSummary(view);
  return renderList(view);
}

function handleFatal(e){
  console.error(e);
  document.getElementById('view').innerHTML = `
    <div class="card fatal">
      <h2>Something went wrong</h2>
      <p>${esc(e && e.message ? e.message : 'Unknown error')}</p>
      <button class="btn btn-primary" onclick="location.reload()">Reload</button>
    </div>
  `;
}

/* ==================== HEADER ==================== */
async function updateHeader(){
  const pending = state.students.filter(s => s.syncStatus === 'pending').length;
  const badge = document.getElementById('pushBadge');
  if(pending > 0){ badge.textContent = pending; badge.hidden = false; }
  else { badge.hidden = true; }

  const cloud = !!(state.settings.sheetUrl || '').trim();
  const pushBtn = document.getElementById('btnPush');
  const pullBtn = document.getElementById('btnPull');
  pushBtn.disabled = !cloud || state.busy;

function countBy(list, field, values){
  const out = {};
  for(const v of values) out[v] = 0;
  for(const s of list){
    if(out[s[field]] !== undefined) out[s[field]]++;
  }
  return out;
}
function crossTab(list, rowField, colField, rowValues, colValues){
  const m = {};
  for(const r of rowValues){
    m[r] = { _total: 0 };
    for(const c of colValues) m[r][c] = 0;
  }
  for(const s of list){
    const r = s[rowField], c = s[colField];
    if(m[r] && m[r][c] !== undefined){ m[r][c]++; m[r]._total++; }
  }
  return m;
}
function barCard(title, counts, total){
  const max = Math.max(1, ...Object.values(counts));
  const rows = Object.entries(counts).map(([k,v]) => {
    const pct = total ? (v/total*100).toFixed(1) : '0.0';
    const w = (v/max*100).toFixed(1);
    return `<div class="bar-row">
      <div class="bar-label" title="${esc(k)}">${esc(k)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div>
      <div class="bar-value">${v} <span class="muted small">(${pct}%)</span></div>
    </div>`;
  }).join('');
  return `<div class="card"><h3>${esc(title)}</h3>${rows}</div>`;
}
function ctCard(title, matrix, rowKeys, colKeys, rowLabel){
  const grandTotal = Object.values(matrix).reduce((a, r) => a + r._total, 0);
  const colTotals = {};
  for(const c of colKeys){
    colTotals[c] = rowKeys.reduce((a, r) => a + (matrix[r][c] || 0), 0);
  }
  const header = `<tr><th>${esc(rowLabel)}</th>${colKeys.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Total</th></tr>`;
  const body = rowKeys.map(r => {
    const row = matrix[r];
    const cells = colKeys.map(c => {
      const v = row[c];
      return `<td class="${v===0?'zero':''}">${v}</td>`;
    }).join('');
    return `<tr><td>${esc(r)}</td>${cells}<td class="total-col">${row._total}</td></tr>`;
  }).join('');
  const footer = `<tr class="total-row"><td>Total</td>${colKeys.map(c=>`<td>${colTotals[c]}</td>`).join('')}<td>${grandTotal}</td></tr>`;

  return `<div class="card">
    <h3>${esc(title)}</h3>
    <div class="ct-wrap">
      <table class="ct-table">
        <thead>${header}</thead>
        <tbody>${body}${footer}</tbody>
      </table>
    </div>
  </div>`;
}

/* ==================== EXPORT SUMMARY ==================== */
function exportSummary(list, data){
  const wb = XLSX.utils.book_new();
  const total = list.length;

  const flat = [['Category','Value','Count','Percent']];
  const addCat = (cat, counts) => {
    for(const [k,v] of Object.entries(counts)){
      flat.push([cat, k, v, total ? ((v/total)*100).toFixed(1) + '%' : '0%']);
    }
  };
  addCat('Grade', data.gradeCounts);
  addCat('Gender', data.genderCounts);
  addCat('Residence', data.residenceCounts);
  addCat('Transport', data.transportCounts);
  addCat('Referral Source', data.referralCounts);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(flat), 'Totals');

  const addCTSheet = (name, matrix, rowKeys, colKeys, rowLabel) => {
    const aoa = [[rowLabel, ...colKeys, 'Total']];
    for(const r of rowKeys){
      const row = [r];
      for(const c of colKeys) row.push(matrix[r][c]);
      row.push(matrix[r]._total);
      aoa.push(row);
    }
    const totals = ['Total'];
    let grand = 0;
    for(const c of colKeys){
      let ct = 0;
      for(const r of rowKeys) ct += matrix[r][c];
      totals.push(ct); grand += ct;
    }
    totals.push(grand);
    aoa.push(totals);
    const safe = name.replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), safe);
  };
  addCTSheet('Grade x Gender', data.ctGradeGender, GRADES, GENDERS, 'Grade');
  addCTSheet('Referral x Gender', data.ctReferralGender, REFERRALS, GENDERS, 'Referral');
  addCTSheet('Grade x Residence', data.ctGradeResidence, GRADES, RESIDENCES, 'Grade');
  addCTSheet('Referral x Residence', data.ctReferralResidence, REFERRALS, RESIDENCES, 'Referral');

  const out = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  download('summary-' + today() + '.xlsx', new Blob([out], { type:'application/octet-stream' }));
  toast('Summary exported', { type:'ok' });
}

  });

}

/* ==================== CLOUD ADAPTER ==================== */
async function cloudFetch(action, payload = {}){
  const url = await getSetting('sheetUrl', '');
  const secret = await getSetting('secret', '');
  if(!url) throw new Error('Cloud not configured');
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, secret, ...payload }),
    });
  } catch(e){
    throw new Error('Network error — check your internet connection');
  }
  if(!res.ok) throw new Error('Server returned HTTP ' + res.status);
  let data;
  try { data = await res.json(); }
  catch(e){ throw new Error('Server response was not valid JSON'); }
  if(!data.ok) throw new Error(data.error || 'Unknown error from Apps Script');
  return data;
}
async function cloudList(){ return cloudFetch('list'); }
async function cloudBatch(ops){ return cloudFetch('batch', { ops }); }

/* ==================== PUSH ==================== */
async function push(){
  if(state.busy){ toast('Please wait — operation in progress'); return; }
  const url = await getSetting('sheetUrl','');
  if(!url){ toast('Connect a Sheet first', { type:'warn' }); return; }

  const all = await getAllStudents();
  const pending = all.filter(s => s.syncStatus === 'pending' || s.deleted);
  if(pending.length === 0){ toast('Nothing to push'); return; }

  state.busy = true;
  await updateHeader();
  const ops = [];
  for(const s of pending){
    const data = toRow(s);
    if(s.deleted && s.remoteRow) ops.push({ type:'delete', studentId: s.studentId });
    else if(s.deleted) continue;
    else if(s.remoteRow) ops.push({ type:'update', data });
    else ops.push({ type:'append', data });
  }

  let added=0, updated=0, deleted=0, failed=0;
  try {
    const batches = chunk(ops, 100);
    for(const b of batches){
      try {
        const res = await cloudBatch(b);
        for(const r of res.results || []){
          if(!r.ok){ failed++; continue; }
          if(r.type === 'append' || r.type === 'update'){
            const s = await getStudent(r.studentId);
            if(s){ s.syncStatus='synced'; s.remoteRow=r.row; await putStudent(s); if(r.type==='append') added++; else updated++; }
          } else if(r.type === 'delete'){
            await deleteStudent(r.studentId); deleted++;
          }
        }
      } catch(e){
        failed += b.length;
      }
    }
    for(const s of pending){
      if(s.deleted && !s.remoteRow) await deleteStudent(s.studentId);
    }
    await setSetting('lastPush', Date.now());
    const msg = `${added} added · ${updated} updated · ${deleted} deleted${failed ? ' · ' + failed + ' failed' : ''}`;
    toast(msg, { type: failed ? 'warn' : 'ok', duration: 5000 });
  } catch(e){
    toast('Push failed: ' + (e.message || e), { type:'error', duration: 6000 });
  } finally {
    state.busy = false;
    await loadState();
    await render();
  }
}
function toRow(s){
  return { studentId: s.studentId, grade: s.grade, gender: s.gender,
           residence: s.residence, transport: s.transport, referralSource: s.referralSource };
}

/* ==================== PULL ==================== */
async function pull(){
  if(state.busy){ toast('Please wait — operation in progress'); return; }
  const url = await getSetting('sheetUrl','');
  if(!url){ toast('Connect a Sheet first', { type:'warn' }); return; }

  const all = await getAllStudents();
  const pending = all.filter(s => s.syncStatus === 'pending');

  const confirmAndPull = () => showModal({
    title: 'Replace local data?',
    body: `<p>This will replace all local data with the version from your Google Sheet. A backup will be saved and you can revert.</p>`,
    actions: [
      { label:'Cancel', class:'btn' },
      { label:'Continue', class:'btn-danger', onClick: async () => { hideModal(); await doPull(all); } }
    ]
  });

  if(pending.length > 0){
    showModal({
      title: 'Unsynced changes',
      body: `<p>You have <strong>${pending.length}</strong> unsynced change(s). Pulling will discard them.</p>`,
      actions: [
        { label:'Cancel', class:'btn' },
        { label:'Pull anyway', class:'btn-danger', onClick: () => { hideModal(); confirmAndPull(); } },
        { label:'Push then Pull', class:'btn-primary', onClick: async () => {
          hideModal(); await push();
          if(state.busy) return;
          await doPull(await getAllStudents());
        } },
      ]
    });
  } else {
    confirmAndPull();
  }
}
async function doPull(currentAll){
  state.busy = true;
  await updateHeader();
  try {
    await addSnapshot('pre-pull', currentAll);
    await pruneSnapshots(5);
    const res = await cloudList();
    const rows = res.rows || [];
    await clearStudents();
    const now = Date.now();
    for(const r of rows){
      if(!r.studentId) continue; // skip malformed
      await putStudent({
        studentId: String(r.studentId),
        grade: String(r.grade || ''),
        gender: String(r.gender || ''),
        residence: String(r.residence || ''),
        transport: String(r.transport || ''),
        referralSource: String(r.referralSource || ''),
        deleted: false, syncStatus:'synced', remoteRow: r.row,
        createdAt: now, updatedAt: now,
      });
    }
    await syncCounterFromStudents();
    await setSetting('lastPull', Date.now());
    toast(`Pulled ${rows.length} students. Backup saved.`, {
      type:'ok', duration:60000,
      action: { label:'Revert', onClick: revertLastPull }
    });
  } catch(e){
    toast('Pull failed: ' + (e.message || e), { type:'error', duration:6000 });
  } finally {
    state.busy = false;
    await loadState();
    await render();
  }
}
async function revertLastPull(){
  const snaps = (await getAllSnapshots()).sort((a,b)=>b.takenAt - a.takenAt);
  const last = snaps[0];
  if(!last){ toast('No backup found', { type:'warn' }); return; }
  try {
    await clearStudents();
    for(const r of last.records) await putStudent(r);
    await deleteSnapshot(last.snapshotId);
    await syncCounterFromStudents();
    toast('Reverted to previous data', { type:'ok' });
    await loadState();
    render().catch(handleFatal);
  } catch(e){ toast('Revert failed: ' + e.message, { type:'error' }); }
}

function doImportPick(){
  if(typeof XLSX === 'undefined'){
    toast('Excel library not loaded — check your internet connection and reload.', { type:'error', duration: 6000 });
    return;
  }
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.xlsx,.xls,.csv';
  inp.onchange = () => { if(inp.files[0]) handleImportFile(inp.files[0]); };
  inp.click();
}
async function handleImportFile(file){
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf);
    if(!wb.SheetNames || wb.SheetNames.length === 0){
      toast('That file has no sheets.', { type:'warn' }); return;
    }
    const ws = wb.Sheets[wb.SheetNames[0]];
    if(!ws){ toast('First sheet is empty.', { type:'warn' }); return; }
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'' });
    if(rows.length === 0){
      toast('No data rows found in the first sheet.', { type:'warn' }); return;
    }
    const analyzed = await analyzeImport(rows);
    if(analyzed.length === 0){
      toast('Nothing to import.', { type:'warn' }); return;
    }
    showImportPreview(analyzed);
  } catch(e){
    toast('Could not read file: ' + (e.message || e), { type:'error', duration:6000 });
  }
}
async function analyzeImport(rows){
  const existing = new Map((await getAllStudents()).map(s => [s.studentId, s]));
  const out = [];
  for(const raw of rows){
    const r = normalizeRow(raw);
    // Skip rows that are entirely empty
    const hasAny = Object.values(r).some(v => v !== '');
    if(!hasAny) continue;
    const errors = validateRow(r);
    const dup = r.studentId && existing.has(r.studentId);
    out.push({ ...r, _errors: errors, _dup: !!dup, _override: false });
  }
  return out;
}
function normalizeRow(raw){
  const map = {};
  for(const [k,v] of Object.entries(raw)){
    const key = String(k).toLowerCase().replace(/\s+/g,'').replace(/[_-]/g,'');
    if(key.startsWith('__empty')) continue;
    map[key] = String(v ?? '').trim();
  }
  const get = (...keys) => { for(const k of keys){ if(map[k] !== undefined && map[k] !== '') return map[k]; } return ''; };
  return {
    studentId: get('studentid','id','student'),
    grade: get('grade','gradelevel','class'),
    gender: get('gender','sex'),
    residence: get('residence','dayboarder','boarding'),
    transport: get('transport','transportation'),
    referralSource: get('referralsource','referral','source','howdidyouhear','heardabout'),
  };
}
function validateRow(r){
  const e = [];
  if(r.grade && !GRADES.includes(r.grade)) e.push('invalid grade: ' + r.grade);
  if(r.gender && !GENDERS.includes(r.gender)) e.push('invalid gender: ' + r.gender);
  if(r.residence && !RESIDENCES.includes(r.residence)) e.push('invalid residence: ' + r.residence);
  if(r.transport && !TRANSPORTS.includes(r.transport)) e.push('invalid transport: ' + r.transport);
  if(r.referralSource && !REFERRALS.includes(r.referralSource)) e.push('invalid referral: ' + r.referralSource);
  if(!r.grade) e.push('missing grade');
  if(!r.gender) e.push('missing gender');
  if(!r.residence) e.push('missing residence');
  if(!r.transport) e.push('missing transport');
  if(!r.referralSource) e.push('missing referral');
  return e;
}
function showImportPreview(rows){
  const newCount = rows.filter(r => !r._dup && r._errors.length === 0).length;
  const dupCount = rows.filter(r => r._dup && r._errors.length === 0).length;
  const badCount = rows.filter(r => r._errors.length > 0).length;

  const rowsHTML = rows.map((r, i) => {
    const cls = r._errors.length ? 'row-bad' : (r._dup ? 'row-dup' : 'row-new');
    const bg = r._errors.length ? '#fef2f2' : (r._dup ? '#fffbeb' : '#f0fdf4');
    const badge = r._errors.length ? 'Invalid' : (r._dup ? 'Duplicate' : 'New');
    return `<tr class="${cls}" style="background:${bg}">
      <td>${i+1}</td>
      <td>${badge}</td>
      <td>${esc(r.studentId) || '<i class="muted">auto</i>'}</td>
      <td>${esc(r.grade)}</td><td>${esc(r.gender)}</td><td>${esc(r.residence)}</td>
      <td>${esc(r.transport)}</td><td>${esc(r.referralSource)}</td>
      <td>${r._errors.length ? esc(r._errors.join('; ')) : (r._dup ? `<label><input type="checkbox" data-ovr="${i}" ${r._override?'checked':''}> override</label>` : '')}</td>
    </tr>`;
  }).join('');

  const m = showModal({
    title: 'Import preview',
    wide: true,
    body: `
      <div class="row" style="margin-bottom:10px">
        <div class="stat"><div class="v">${newCount}</div><div class="l">New</div></div>
        <div class="stat"><div class="v">${dupCount}</div><div class="l">Duplicates</div></div>
        <div class="stat"><div class="v">${badCount}</div><div class="l">Invalid</div></div>
      </div>
      <div class="table-wrap" style="max-height:50vh">
        <table><thead><tr><th>#</th><th>Status</th><th>ID</th><th>Grade</th><th>Gender</th><th>Residence</th><th>Transport</th><th>Referral</th><th>Notes</th></tr></thead>
        <tbody>${rowsHTML}</tbody></table>
      </div>
      <p class="muted small" style="margin-top:10px">Tick "override" to replace existing records on duplicates. Invalid rows are skipped.</p>
    `,
    actions: [
      { label:'Cancel', class:'btn' },
      { label:'Import valid rows', class:'btn-primary', onClick: async () => {
        const checks = m.querySelectorAll('[data-ovr]');
        checks.forEach(c => { rows[Number(c.dataset.ovr)]._override = c.checked; });
        hideModal();
        await commitImport(rows);
      }}
    ]
  });
}
async function commitImport(rows){
  let added = 0, overridden = 0, skipped = 0;
  const now = Date.now();
  try {
    for(const r of rows){
      if(r._errors.length){ skipped++; continue; }
      if(r._dup && !r._override){ skipped++; continue; }
      let id = r.studentId;
      if(!id) id = await nextStudentId();
      const rec = {
        studentId: id, grade: r.grade, gender: r.gender,
        residence: r.residence, transport: r.transport, referralSource: r.referralSource,
        deleted: false, syncStatus: 'pending', remoteRow: null,
        createdAt: now, updatedAt: now,
      };
      const existed = await getStudent(id);
      if(existed){ rec.createdAt = existed.createdAt; rec.remoteRow = existed.remoteRow; overridden++; }
      else added++;
      await putStudent(rec);
    }
    await syncCounterFromStudents();
    toast(`${added} added · ${overridden} overridden · ${skipped} skipped`, { type: added||overridden ? 'ok' : 'warn', duration: 5000 });
    await loadState();
    await render();
  } catch(e){
    toast('Import failed: ' + (e.message || e), { type:'error', duration:6000 });
  }
}

/* ==================== APPS SCRIPT SNIPPET ==================== */
function buildSnippet(secret){
  return `// === Student Data Collector — Apps Script backend ===
// Paste into Extensions → Apps Script. Deploy as Web app (Execute as: Me, Access: Anyone).

const SECRET = '${secret}';
const TAB = 'Students';
const HEADERS = ['StudentID','Grade','Gender','Residence','Transport','ReferralSource'];

function doGet(e){ return handle(e.parameter); }
function doPost(e){ return handle(JSON.parse(e.postData.contents)); }

function handle(p){
  try {
    if (p.secret !== SECRET) return json({ok:false, error:'invalid secret'});
    var sheet = getSheet();
    switch(p.action){
      case 'ping':   return json({ok:true, rows: Math.max(0, sheet.getLastRow()-1)});
      case 'list':   return json({ok:true, rows: listAll(sheet)});
      case 'append': return json({ok:true, row: appendRow(sheet, p.data)});
      case 'update': return json({ok:true, row: updateRow(sheet, p.row, p.data)});
      case 'delete': return json({ok:true, row: deleteRow(sheet, p.row)});
      case 'batch':  return json({ok:true, results: batch(sheet, p.ops || [])});
    }
    return json({ok:false, error:'unknown action'});
  } catch(err){ return json({ok:false, error:String(err)}); }
}

function json(o){
  return ContentService.createTextOutput(JSON.stringify(o))
    .setMimeType(ContentService.MimeType.JSON);
}

function getSheet(){
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(TAB);
  if (!sh){ sh = ss.insertSheet(TAB); sh.appendRow(HEADERS); }
  else if (sh.getLastRow() === 0){ sh.appendRow(HEADERS); }
  return sh;
}

function recordToRow(d){
  return [d.studentId, d.grade, d.gender, d.residence, d.transport, d.referralSource];
}

function listAll(sh){
  var last = sh.getLastRow();
  if (last < 2) return [];
  var vals = sh.getRange(2, 1, last - 1, HEADERS.length).getValues();
  var out = [];
  for (var i = 0; i < vals.length; i++){
    var r = vals[i];
    if (!r[0]) continue;
    out.push({
      row: i + 2,
      studentId: String(r[0]), grade: String(r[1]), gender: String(r[2]),
      residence: String(r[3]), transport: String(r[4]), referralSource: String(r[5])
    });
  }
  return out;
}

function findRow(sh, studentId){
  var last = sh.getLastRow();
  if (last < 2) return -1;
  var vals = sh.getRange(2, 1, last - 1, 1).getValues();
  for (var i = 0; i < vals.length; i++){
    if (String(vals[i][0]) === String(studentId)) return i + 2;
  }
  return -1;
}

function appendRow(sh, d){ sh.appendRow(recordToRow(d)); return sh.getLastRow(); }
function updateRow(sh, row, d){ sh.getRange(row, 1, 1, HEADERS.length).setValues([recordToRow(d)]); return row; }
function deleteRow(sh, row){ sh.deleteRow(row); return row; }

function batch(sh, ops){
  var out = [];
  var updates = ops.filter(function(o){return o.type==='update';});
  var appends = ops.filter(function(o){return o.type==='append';});
  var deletes = ops.filter(function(o){return o.type==='delete';});

  updates.forEach(function(op){
    try {
      var row = findRow(sh, op.data.studentId);
      if (row < 0){ var r = appendRow(sh, op.data); out.push({ok:true, type:'append', studentId: op.data.studentId, row: r}); }
      else { updateRow(sh, row, op.data); out.push({ok:true, type:'update', studentId: op.data.studentId, row: row}); }
    } catch(err){ out.push({ok:false, error:String(err), studentId: op.data.studentId}); }
  });
  appends.forEach(function(op){
    try { var r = appendRow(sh, op.data); out.push({ok:true, type:'append', studentId: op.data.studentId, row: r}); }
    catch(err){ out.push({ok:false, error:String(err), studentId: op.data.studentId}); }
  });
  deletes.forEach(function(op){
    try {
      var row = findRow(sh, op.studentId);
      if (row > 0) deleteRow(sh, row);
      out.push({ok:true, type:'delete', studentId: op.studentId});
    } catch(err){ out.push({ok:false, error:String(err), studentId: op.studentId}); }
  });
  return out;
}
`;
}

/* ==================== ONBOARDING ==================== */
async function maybeOnboard(){
  const done = await getSetting('onboarded', false);
  if(done) return;
  await setSetting('onboarded', true);
  showModal({
    title: 'Welcome 👋',
    body: `
      <p>This app stores student data <b>on your device</b> (offline-first). You can optionally connect your own Google Sheet to sync.</p>
      <ul style="padding-left:20px">
        <li>Works fully offline — nothing required to start.</li>
        <li>Your data stays on this browser unless you set up a Sheet.</li>
        <li>Import and export Excel files anytime.</li>
      </ul>
      <p class="muted small">Heads up: since data lives on this device, use <b>Export</b> regularly as a backup.</p>
    `,
    actions: [
      { label:'Start using locally', class:'btn btn-primary', onClick: () => hideModal() },
      { label:'Connect a Sheet', class:'btn', onClick: () => { hideModal(); go('/settings'); } }
    ]
  });
}

/* ==================== BOOTSTRAP ==================== */
(async function init(){
  applyTheme(currentTheme());
  try {
    await openDB();
  } catch(e){
    document.getElementById('view').innerHTML = `
      <div class="card fatal">
        <h2>Storage unavailable</h2>
        <p>This app needs IndexedDB to store your data. This can happen in private/incognito mode, or if browser storage is blocked.</p>
        <p class="muted small">Error: ${esc(e.message || e)}</p>
        <button class="btn btn-primary" onclick="location.reload()">Try again</button>
      </div>
    `;
    return;
  }
  try {
    if(!await getSetting('deviceId','')) await setSetting('deviceId', uuid());
    if(!await getSetting('secret',''))   await setSetting('secret', uuid());
    await loadState();
    if(!location.hash) location.hash = '/list';
    await render();
    await maybeOnboard();
  } catch(e){
    handleFatal(e);
  }
})();
</script>
