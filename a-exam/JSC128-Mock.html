/* Build question objects */
var Q = [], mockSet = [], view = "1", mode = "quiz", ans = {};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var uid = 0;
UNITS.forEach(function(u){
  u.sessions.forEach(function(s){
    s.items = s.qs.map(function(e){
      var q = {id:uid++, unit:u, stem:e[0], correct:e[1], exp:e[5], opts:shuffle([e[1],e[2],e[3],e[4]])};
      Q.push(q); return q;
    });
  });
});
document.getElementById("total").textContent = Q.length;
function newMock(){ mockSet = shuffle(Q).slice(0,40); mockSet.forEach(function(q){delete ans[q.id];}); }
newMock();

var $main = document.getElementById("main");
var L = ["A","B","C","D"];

function qHtml(q, num, showChip){
  var chosen = ans[q.id], study = mode==="study", revealed = study || chosen!==undefined;
  var h = '<article class="q" id="q'+q.id+'" data-id="'+q.id+'" style="--accent:'+q.unit.color+'">';
  if(showChip) h += '<div class="chip" style="margin-left:2.1rem">'+q.unit.name+'</div>';
  h += '<p class="stem"><span class="n">'+num+'.</span><span>'+q.stem+'</span></p><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls = "opt", mark = "";
    if(revealed){
      if(o===q.correct){cls+=" ok";mark="✓";}
      else if(chosen===i){cls+=" bad";mark="✗";}
      else cls+=" dim";
    }
    h += '<button class="'+cls+'" data-i="'+i+'"'+(revealed?' disabled':'')+'><span class="l">'+L[i]+'</span><span>'+o+'</span><span class="m" aria-hidden="true">'+mark+'</span></button>';
  });
  h += '</div>';
  if(revealed){
    h += '<div class="fb" aria-live="polite">';
    if(chosen!==undefined){
      var right = q.opts[chosen]===q.correct;
      h += right ? '<span class="v ok">✓ Correct.</span>' : '<span class="v bad">✗ Not quite.</span> <span class="ans">The answer is <b>'+q.correct+'</b>.</span>';
    } else {
      h += '<span class="v ok">Answer: '+q.correct+'</span>';
    }
    h += '<p>'+q.exp+'</p></div>';
  }
  return h+'</article>';
}

function currentQs(){
  if(view==="mock") return mockSet;
  var u = UNITS[parseInt(view,10)-1], out=[];
  u.sessions.forEach(function(s){out=out.concat(s.items);});
  return out;
}

function render(){
  var accent = view==="mock" ? "var(--ink)" : UNITS[parseInt(view,10)-1].color;
  document.documentElement.style.setProperty("--accent", accent);
  // tabs
  var th = "";
  UNITS.forEach(function(u){th += '<button role="tab" data-v="'+u.id+'" aria-selected="'+(view==String(u.id))+'" style="--accent:'+u.color+'">'+u.name+'</button>';});
  th += '<button role="tab" data-v="mock" aria-selected="'+(view==="mock")+'" style="--accent:var(--ink)">Mock test</button>';
  document.getElementById("tabs").innerHTML = th;
  var h = "";
  if(view==="mock"){
    h += '<p class="intro">40 random questions from all three units, like a real objective paper. Tap an answer to see if you are right.</p><div class="mockbar"><button id="newMock">New random set</button></div>';
    mockSet.forEach(function(q,i){h += qHtml(q,i+1,true);});
  } else {
    var u = UNITS[parseInt(view,10)-1], n = 0;
    u.sessions.forEach(function(s){
      h += '<h2>'+s.t+'<small>'+s.items.length+' questions</small></h2>';
      s.items.forEach(function(q){ n++; h += qHtml(q,n,false); });
    });
  }
  h += '<div class="done" id="done" hidden></div>';
  $main.innerHTML = h;
  updateScore();
}

function updateScore(){
  var qs = currentQs(), answered=0, right=0;
  qs.forEach(function(q){
    var c = ans[q.id];
    if(c!==undefined){answered++; if(q.opts[c]===q.correct) right++;}
  });
  var txt = mode==="study" ? 'Study mode: answers are shown. '+qs.length+' questions' : '<b>'+right+'</b> correct of <b>'+answered+'</b> answered · '+qs.length+' total';
  document.getElementById("scoreTxt").innerHTML = txt;
  document.getElementById("progFill").style.width = (qs.length? (answered/qs.length*100):0)+"%";
  var d = document.getElementById("done");
  if(d){
    if(mode==="quiz" && answered===qs.length && qs.length){
      var pct = Math.round(right/qs.length*100);
      d.hidden=false;
      d.innerHTML = '<b>You scored '+right+' / '+qs.length+' ('+pct+'%)</b><p style="margin:6px 0 0">'+(pct>=80?'Strong. Try the mock test next.':pct>=50?'Good start. Reset and go through the ones you missed with Study mode on.':'Read the explanations, then reset and try again. Repeating is how it sticks.')+'</p>';
    } else d.hidden=true;
  }
}

document.addEventListener("click", function(e){
  var t = e.target.closest("button"); if(!t) return;
  if(t.hasAttribute("data-v")){ view=t.getAttribute("data-v"); render(); window.scrollTo(0,0); return; }
  if(t.id==="newMock"){ newMock(); render(); window.scrollTo(0,0); return; }
  if(t.id==="reset"){ currentQs().forEach(function(q){delete ans[q.id];}); render(); window.scrollTo(0,0); return; }
  if(t.id==="mQuiz"||t.id==="mStudy"){
    mode = t.id==="mQuiz" ? "quiz":"study";
    document.getElementById("mQuiz").setAttribute("aria-pressed", mode==="quiz");
    document.getElementById("mStudy").setAttribute("aria-pressed", mode==="study");
    var y = window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if(t.classList.contains("opt") && !t.disabled){
    var art = t.closest(".q"), id = parseInt(art.getAttribute("data-id"),10);
    var q = Q[id];
    ans[id] = parseInt(t.getAttribute("data-i"),10);
    var num = art.querySelector(".n").textContent.replace(".","");
    var chip = !!art.querySelector(".chip");
    var tmp = document.createElement("div"); tmp.innerHTML = qHtml(q, num, chip);
    art.replaceWith(tmp.firstChild);
    updateScore();
  }
});
render();
</script>
</body>
</html>
