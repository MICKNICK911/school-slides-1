<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Ed Complete Exam Q&A Revision App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        /* ================= LIGHT MODE ================= */
        :root {
            --bg-color: #f7fafc;
            --header-color: #1a365d;
            --text-color: #2d3748;
            --secondary-text: #718096;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.1);
            --border-color: #e2e8f0;
            --mark-bg: #edf2f7;
            --btn-bg: #e2e8f0;
            --btn-text: #4a5568;
            --btn-active: #1a365d;
            --btn-active-text: #ffffff;
            --answer-bg: #f7fafc;
            --accent-color: #3182ce;
            --input-bg: #ffffff;
            --input-border: #cbd5e0;
        }
        /* ================= DARK MODE ================= */
        body.dark-mode {
            --bg-color: #1a202c;
            --header-color: #e2e8f0;
            --text-color: #e2e8f0;
            --secondary-text: #a0aec0;
            --card-bg: #2d3748;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.5);
            --border-color: #4a5568;
            --mark-bg: #4a5568;
            --btn-bg: #4a5568;
            --btn-text: #e2e8f0;
            --btn-active: #3182ce;
            --btn-active-text: #ffffff;
            --answer-bg: #1a202c;
            --accent-color: #63b3ed;
            --input-bg: #2d3748;
            --input-border: #4a5568;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 50px;
            transition: background-color 0.3s, color 0.3s;
        }
        .header { text-align: center; margin-bottom: 25px; position: relative; }
        .header h1 { color: var(--header-color); font-size: 1.8rem; margin-bottom: 5px; }
        .header p { color: var(--secondary-text); font-size: 1rem; margin-bottom: 10px; }
        .theme-toggle {
            position: absolute; top: 0; right: 0;
            background: var(--btn-bg); color: var(--btn-text);
            border: none; padding: 8px 12px; border-radius: 50px;
            font-size: 1.2rem; cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: var(--card-shadow);
        }
        .theme-toggle:hover { transform: scale(1.05); }

        .search-container { max-width: 800px; margin: 0 auto 20px auto; }
        .search-container input {
            width: 100%; padding: 12px 20px; border-radius: 50px;
            border: 2px solid var(--input-border);
            background: var(--input-bg); color: var(--text-color);
            font-size: 1rem; outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }
        .search-container input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
        }

        .module-tabs {
            display: flex; justify-content: center; gap: 15px;
            margin-bottom: 25px; flex-wrap: wrap;
        }
        .module-btn {
            background: var(--btn-bg); color: var(--btn-text);
            border: none; padding: 12px 25px; border-radius: 50px;
            font-weight: bold; font-size: 1rem; cursor: pointer;
            transition: 0.3s;
        }
        .module-btn:hover { opacity: 0.9; }
        .module-btn.active {
            background: var(--btn-active); color: var(--btn-active-text);
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
        }

        #question-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }

        .q-card {
            background: var(--card-bg); border-radius: 10px;
            box-shadow: var(--card-shadow); overflow: hidden;
            border-left: 5px solid #a0aec0;
            transition: background 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .q-card.module-jeb { border-color: #e53e3e; }
        .q-card.module-jed { border-color: #d69e2e; }
        .q-card.module-jen { border-color: #38a169; }
        .q-card.module-jmc { border-color: #3182ce; }
        .q-card.module-jsc { border-color: #805ad5; }

        .q-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
        .q-info { flex: 1; }
        .q-module { font-size: 0.75rem; font-weight: bold; color: var(--secondary-text); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
        .q-text { font-size: 1.05rem; font-weight: 500; line-height: 1.5; word-break: break-word; }
        .q-marks { background: var(--mark-bg); color: var(--text-color); padding: 4px 10px; border-radius: 15px; font-size: 0.85rem; font-weight: bold; white-space: nowrap; }
        .q-indicator { color: var(--secondary-text); font-size: 1.2rem; transition: transform 0.3s; }
        .q-card.open .q-indicator { transform: rotate(180deg); }

        .q-answer {
            max-height: 0; overflow: hidden;
            transition: max-height 0.4s ease-in-out, padding 0.3s, background 0.3s;
            padding: 0 20px; background: var(--answer-bg);
            border-top: 1px solid var(--border-color);
        }
        .q-card.open .q-answer {
            padding: 20px;
        }
        .q-answer h4 { color: var(--accent-color); margin: 0 0 10px 0; font-size: 1rem; }
        .q-answer p, .q-answer ul, .q-answer table { margin: 5px 0; line-height: 1.6; font-size: 0.95rem; }
        .q-answer ul { padding-left: 20px; }
        .q-answer b { color: var(--header-color); }
        .q-answer table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        .q-answer table th, .q-answer table td { border: 1px solid var(--border-color); padding: 8px; text-align: left; }
        .q-answer table th { background: var(--mark-bg); }

        .empty-state, .error-state { text-align: center; color: var(--secondary-text); padding: 40px; }
        .loading-state { text-align: center; color: var(--secondary-text); padding: 40px; font-size: 1.2rem; }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.4rem; }
            .theme-toggle { top: 5px; right: 0px; font-size: 1rem; padding: 6px 10px; }
            .module-btn { padding: 8px 18px; font-size: 0.9rem; }
            .q-text { font-size: 0.95rem; }
            .q-answer ul { padding-left: 15px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📚 B.Ed Complete Revision</h1>
        <p>Tap any question to reveal the Model Answer</p>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle Dark Mode">🌙</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search by keyword or phrase..." aria-label="Search questions">
    </div>

    <nav class="module-tabs" id="moduleTabs" role="tablist">
        <!-- Tabs will be injected dynamically -->
    </nav>

    <div id="question-container">
        <div class="loading-state">Loading modules...</div>
    </div>

    <script>
        // ==========================================
        // CONSTANTS
        // ==========================================
        const DATA_VERSION = '1.0.0';   // bump to invalidate cache
        const FETCH_TIMEOUT = 10000;    // 10 seconds
        const DB_NAME = 'BEdRevisionDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'data';

        // ==========================================
        // SAFE LOCAL STORAGE
        // ==========================================
        function storageGet(key) {
            try { return localStorage.getItem(key); } catch(e) { return null; }
        }
        function storageSet(key, value) {
            try { localStorage.setItem(key, value); } catch(e) {}
        }

        // ==========================================
        // HTML ESCAPING
        // ==========================================
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==========================================
        // MATH FORMATTER
        // ==========================================
        function migrateMath(text) {
            if (!text) return text;
            const wrap = (str) => `\\( ${str} \\)`;
            let t = text;

            // Fractions: 1/2
            t = t.replace(/(\d+)\/(\d+)/g, (m, n, d) => wrap(`\\frac{${n}}{${d}}`));
            // sqrt
            t = t.replace(/sqrt\(([^)]+)\)/g, (m, inner) => wrap(`\\sqrt{${inner}}`));
            // Power: x^2, x^{2}, 2^3
            t = t.replace(/([a-zA-Z0-9])\^(\{?[^}]+\}?)/g, (m, base, pow) => {
                const p = pow.replace(/[{}]/g, '');
                return wrap(`${base}^{${p}}`);
            });
            // Subscript: x_2
            t = t.replace(/([a-zA-Z0-9])_(\{?[^}]+\}?)/g, (m, base, sub) => {
                const s = sub.replace(/[{}]/g, '');
                return wrap(`${base}_{${s}}`);
            });
            // fog / gof
            t = t.replace(/fog(?![a-zA-Z])/g, wrap(`f \\circ g`));
            t = t.replace(/gof(?![a-zA-Z])/g, wrap(`g \\circ f`));
            // Division
            t = t.replace(/÷/g, wrap(`\\div`));
            // Degrees: 30°C, 45°F
            t = t.replace(/(\d+)°([CF])/g, (m, num, unit) => wrap(`${num}^{\\circ}\\text{${unit}}`));
            // Chemical formulas: H2O, CO2, Na2SO4, etc.
            t = t.replace(/([A-Z][a-z]?\d*)+/g, (formula) => {
                if (/\d/.test(formula) && /[A-Z]/.test(formula)) {
                    const parts = [];
                    const regex = /([A-Z][a-z]?)(\d*)/g;
                    let match;
                    while ((match = regex.exec(formula)) !== null) {
                        const el = match[1];
                        const num = match[2];
                        parts.push(`\\text{${el}}` + (num ? `_{${num}}` : ''));
                    }
                    return wrap(parts.join(''));
                }
                return formula;
            });
            // Unit superscripts: cm2, m2, kg3 etc.
            t = t.replace(/(^|\s)([a-zA-Z]{1,4})(2|3)\b/g, (m, prefix, unit, num) => {
                return `${prefix}${wrap(`\\text{${unit}}^{${num}}`)}`;
            });

            return t;
        }

        // ==========================================
        // INDEXEDDB HELPERS
        // ==========================================
        function openDB() {
            return new Promise((resolve, reject) => {
                if (!('indexedDB' in window)) {
                    reject(new Error('IndexedDB not supported'));
                    return;
                }
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = (event) => resolve(event.target.result);
                request.onerror = (event) => reject(event.target.error);
            });
        }

        async function dbGet(key) {
            try {
                const db = await openDB();
                return await new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readonly');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.get(key);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {
                return null;
            }
        }

        async function dbSet(key, value) {
            try {
                const db = await openDB();
                return await new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.put(value, key);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {
                // ignore write errors
            }
        }

        async function dbClear() {
            try {
                const db = await openDB();
                return await new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.clear();
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {
                // ignore
            }
        }

        // ==========================================
        // FETCH WITH TIMEOUT
        // ==========================================
        async function fetchWithTimeout(url, timeout = FETCH_TIMEOUT) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error(`HTTP ${response.status} for ${url}`);
                return response;
            } catch (err) {
                clearTimeout(timeoutId);
                if (err.name === 'AbortError') {
                    throw new Error(`Request timed out after ${timeout}ms: ${url}`);
                }
                throw err;
            }
        }

        // ==========================================
        // STATE
        // ==========================================
        const container = document.getElementById('question-container');
        const searchInput = document.getElementById('searchInput');
        const moduleTabsContainer = document.getElementById('moduleTabs');
        const themeToggle = document.getElementById('themeToggle');

        let modules = [];
        let questionsData = {};
        let activeModuleId = storageGet('activeModuleId') || null;
        let allDataLoaded = false;

        // ==========================================
        // LOAD DATA (with cache versioning, timeout, fallbacks)
        // ==========================================
        async function loadAllData() {
            try {
                // Try IndexedDB cache first
                const cachedManifest = await dbGet('manifest');
                if (cachedManifest && cachedManifest.version === DATA_VERSION && cachedManifest.modules) {
                    modules = cachedManifest.modules;
                    let allCached = true;
                    for (const mod of modules) {
                        const cachedData = await dbGet(`module_${mod.id}`);
                        if (cachedData) {
                            questionsData[mod.id] = cachedData.map(q => ({
                                ...q,
                                textFormatted: q.textFormatted || migrateMath(q.text),
                                answerFormatted: q.answerFormatted || migrateMath(q.answer)
                            }));
                        } else {
                            allCached = false;
                            break;
                        }
                    }
                    if (allCached) {
                        allDataLoaded = true;
                        renderTabs();
                        if (!activeModuleId || !questionsData[activeModuleId]) {
                            activeModuleId = modules[0].id;
                            storageSet('activeModuleId', activeModuleId);
                        }
                        setActiveTab(activeModuleId);
                        renderQuestions(activeModuleId, searchInput.value);
                        return;
                    }
                }

                // Cache missing/outdated, fetch from network
                if (window.location.protocol === 'file:') {
                    throw new Error('File:// protocol detected. Please run a local server (e.g., `python -m http.server`).');
                }

                const manifestRes = await fetchWithTimeout('data/th-quiz/th-manifest.json');
                const manifest = await manifestRes.json();
                modules = manifest.modules || [];
                if (modules.length === 0) throw new Error('No modules defined.');

                // Update manifest in cache with version
                const manifestToStore = { ...manifest, version: DATA_VERSION };
                await dbSet('manifest', manifestToStore);

                const fetchPromises = modules.map(async (mod) => {
                    const res = await fetchWithTimeout(mod.file);
                    const data = await res.json();
                    await dbSet(`module_${mod.id}`, data);
                    questionsData[mod.id] = data.map(q => ({
                        ...q,
                        textFormatted: migrateMath(q.text),
                        answerFormatted: migrateMath(q.answer)
                    }));
                });
                await Promise.all(fetchPromises);
                allDataLoaded = true;

                renderTabs();
                if (!activeModuleId || !questionsData[activeModuleId]) {
                    activeModuleId = modules[0].id;
                    storageSet('activeModuleId', activeModuleId);
                }
                setActiveTab(activeModuleId);
                renderQuestions(activeModuleId, searchInput.value);

            } catch (error) {
                container.innerHTML = `<div class="error-state">Error loading data: ${escapeHtml(error.message)}</div>`;
                console.error(error);
            }
        }

        // ==========================================
        // RENDER TABS
        // ==========================================
        function renderTabs() {
            moduleTabsContainer.innerHTML = '';
            modules.forEach((mod) => {
                const btn = document.createElement('button');
                btn.className = 'module-btn';
                btn.setAttribute('role', 'tab');
                btn.setAttribute('data-module-id', mod.id);
                btn.textContent = mod.code;
                if (mod.id === activeModuleId) {
                    btn.classList.add('active');
                    btn.setAttribute('aria-selected', 'true');
                } else {
                    btn.setAttribute('aria-selected', 'false');
                }
                btn.addEventListener('click', () => {
                    activeModuleId = mod.id;
                    storageSet('activeModuleId', activeModuleId);
                    setActiveTab(activeModuleId);
                    renderQuestions(activeModuleId, searchInput.value);
                });
                moduleTabsContainer.appendChild(btn);
            });
        }

        function setActiveTab(moduleId) {
            document.querySelectorAll('.module-btn').forEach(btn => {
                const id = btn.getAttribute('data-module-id');
                if (id === moduleId) {
                    btn.classList.add('active');
                    btn.setAttribute('aria-selected', 'true');
                } else {
                    btn.classList.remove('active');
                    btn.setAttribute('aria-selected', 'false');
                }
            });
        }

        // ==========================================
        // RENDER QUESTIONS (with escaping and class fallback)
        // ==========================================
        function renderQuestions(moduleId, searchTerm = '') {
            if (!allDataLoaded || !questionsData[moduleId]) {
                container.innerHTML = `<div class="loading-state">Loading questions...</div>`;
                return;
            }
            let qs = questionsData[moduleId];
            if (searchTerm.trim() !== '') {
                const lower = searchTerm.toLowerCase();
                qs = qs.filter(q => 
                    (q.text && q.text.toLowerCase().includes(lower)) ||
                    (q.module && q.module.toLowerCase().includes(lower))
                );
            }
            if (qs.length === 0) {
                container.innerHTML = `<div class="empty-state">No questions found.</div>`;
                return;
            }

            container.innerHTML = qs.map(q => {
                // Fallback for moduleClass
                const cls = q.moduleClass || 'module-' + (q.module?.split(' ')[0]?.toLowerCase() || 'default');
                return `
                <div class="q-card ${cls}" role="button" tabindex="0" aria-expanded="false">
                    <div class="q-header">
                        <div class="q-info">
                            <div class="q-module">${escapeHtml(q.module)}</div>
                            <div class="q-text">${q.textFormatted ? escapeHtml(q.textFormatted) : escapeHtml(q.text || '')}</div>
                        </div>
                        <div class="q-marks">${escapeHtml(String(q.marks))} Marks</div>
                        <div class="q-indicator">▼</div>
                    </div>
                    <div class="q-answer">${q.answerFormatted || q.answer || ''}</div>
                </div>
                `;
            }).join('');

            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            }
        }

        // ==========================================
        // CARD TOGGLE
        // ==========================================
        container.addEventListener('click', (e) => {
            const card = e.target.closest('.q-card');
            if (card) toggleCard(card);
        });
        container.addEventListener('keydown', (e) => {
            const card = e.target.closest('.q-card');
            if (card && (e.key === 'Enter' || e.key === ' ')) {
                e.preventDefault();
                toggleCard(card);
            }
        });
        function toggleCard(card) {
            const isOpen = card.classList.contains('open');
            document.querySelectorAll('.q-card').forEach(c => {
                c.classList.remove('open');
                c.setAttribute('aria-expanded', 'false');
                const ans = c.querySelector('.q-answer');
                if (ans) ans.style.maxHeight = '0px';
            });
            if (!isOpen) {
                card.classList.add('open');
                card.setAttribute('aria-expanded', 'true');
                const answer = card.querySelector('.q-answer');
                answer.style.maxHeight = answer.scrollHeight + 'px';
            }
        }

        // ==========================================
        // SEARCH
        // ==========================================
        searchInput.addEventListener('input', (e) => {
            if (activeModuleId) renderQuestions(activeModuleId, e.target.value);
        });

        // ==========================================
        // THEME
        // ==========================================
        if (storageGet('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        }
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const theme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
            storageSet('theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        });

        // ==========================================
        // START
        // ==========================================
        loadAllData();
    </script>
</body>
</html>
