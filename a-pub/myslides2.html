<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phonics Slide Studio</title>
  <style>
    /* ========== RESET & TOKENS ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #E2571C;
      --accent: #F5A623;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #6c757d;
      --border: #dee2e6;
      --header-bg: #1a1a2e;
      --success: #2d7d46;
      --danger: #dc3545;
      --shadow: 0 4px 18px rgba(0,0,0,0.08);
      --radius: 12px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --page-w: 1100px;
      --page-h: 850px;
      --card-h: 818px;   /* card height = page_h - header/footer padding (approx 32px) */
      --font-scale: 1;
    }
    .dark {
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #f0f0f0;
      --muted: #9aa0a6;
      --border: #333;
      --header-bg: #0d0d14;
      --shadow: 0 4px 18px rgba(0,0,0,0.35);
    }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: calc(15px * var(--font-scale));
      line-height: 1.45;
      overflow: hidden;
    }

    /* ========== APP SHELL ========== */
    #app { display: flex; flex-direction: column; height: 100vh; }
    .app-header {
      background: var(--header-bg);
      color: #fff;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
      z-index: 50;
    }
    .app-header .logo {
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .app-header .logo span { color: var(--accent); }
    .deck-switcher {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      max-width: 220px;
      cursor: pointer;
    }
    .deck-switcher option { color: #111; }
    .search-wrap {
      flex: 1;
      min-width: 140px;
      max-width: 320px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 8px 14px 8px 36px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
      background: rgba(255,255,255,0.95);
      color: #111;
    }
    .search-wrap::before {
      content: '🔍';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      pointer-events: none;
    }
    .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.25); }
    .icon-btn.active { background: var(--accent); color: #111; }

    /* ========== MAIN CONTENT ========== */
    .main { flex: 1; overflow: hidden; display: flex; position: relative; }

    /* ========== LIBRARY ========== */
    .library-view {
      width: 100%;
      overflow-y: auto;
      padding: 28px 24px;
    }
    .library-hero {
      text-align: center;
      max-width: 560px;
      margin: 0 auto 32px;
    }
    .library-hero h1 { font-size: 28px; margin-bottom: 8px; }
    .library-hero p { color: var(--muted); margin-bottom: 20px; }
    .library-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .deck-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .deck-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
    .deck-card h3 { font-size: 17px; margin-bottom: 6px; }
    .deck-card .meta { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .deck-card .actions { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ========== DECK VIEW ========== */
    .deck-view {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .page-list-panel {
      width: 300px;
      min-width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .page-list-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .page-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .page-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      margin-bottom: 4px;
      transition: background 0.12s, border-color 0.12s;
    }
    .page-item:hover { background: var(--bg); }
    .page-item.active {
      border-color: var(--accent);
      background: rgba(245,166,35,0.08);
    }
    .page-item .name { font-weight: 700; font-size: 14px; }
    .page-item .title { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-item .item-actions {
      display: none;
      gap: 4px;
      margin-top: 6px;
    }
    .page-item.active .item-actions,
    .page-item:hover .item-actions { display: flex; }

    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .preview-toolbar {
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .preview-toolbar .info { margin-right: auto; font-size: 13px; color: var(--muted); font-weight: 600; }
    .preview-scroll {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ========== EDITOR ========== */
    .editor-view {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .editor-form {
      width: 420px;
      min-width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
    }
    .editor-form h2 { font-size: 18px; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .form-group textarea { resize: vertical; min-height: 80px; font-family: ui-monospace, monospace; font-size: 13px; }
    .form-group textarea.code { min-height: 120px; }
    .editor-preview-wrap {
      flex: 1;
      overflow: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg);
    }
    .editor-preview-wrap .label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .editor-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    /* ========== IMAGE MANAGER ========== */
    .img-manager {
      margin-top: 8px;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--bg);
    }
    .img-manager .img-manager-title {
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .img-manager .img-slot {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .img-manager .img-slot .thumb {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 4px;
      background: #fff;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .img-manager .img-slot .info {
      flex: 1;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .img-manager .img-slot .info strong { color: var(--text); font-weight: 600; }
    .img-manager .img-slot .img-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .img-manager .img-slot .img-actions .file-input-wrap {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }
    .img-manager .img-slot .img-actions .file-input-wrap input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .img-manager .empty-img-note {
      font-size: 13px;
      color: var(--muted);
      padding: 6px 0;
      text-align: center;
    }

    /* ========== BUTTONS ========== */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #1a1a1a; }
    .btn-primary:hover:not(:disabled) { background: #e0950f; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover:not(:disabled) { background: var(--bg); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 6px; }
    .btn-icon { padding: 4px 8px; font-size: 14px; }

    /* ========== PAGE RENDERER (shared visual language) ========== */
    .page-frame {
      width: var(--page-w);
      min-width: var(--page-w);
      height: var(--page-h);
      min-height: var(--page-h);
      max-height: var(--page-h);
      padding: 16px 22px;
      background: #fff;
      border-radius: 6px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .page-frame .card {
      border: 4px solid var(--primary);
      border-radius: 12px;
      width: 100%;
      height: var(--card-h);
      min-height: var(--card-h);
      max-height: var(--card-h);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      box-sizing: border-box;
    }
    .cvc-header {
      display: flex;
      align-items: stretch;
      border-bottom: 3px solid var(--primary);
      min-height: 64px;
      flex-shrink: 0;
    }
    .cvc-header-left {
      flex: 1;
      padding: 10px 18px 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .cvc-main-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.3px;
      line-height: 1.1;
      margin: 0;
    }
    .cvc-subtitle {
      font-size: 12px;
      font-weight: 700;
      color: #c45a12;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .cvc-header-right {
      background: var(--primary);
      color: #fff;
      min-width: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
    }
    .cvc-header-right .lesson-label { font-size: 12px; font-weight: 600; opacity: 0.95; margin-right: 5px; }
    .cvc-header-right .lesson-num { font-size: 24px; font-weight: 800; line-height: 1; }
    .code-content-area {
      flex: 1 1 auto;
      overflow: hidden;
      position: relative;
      width: 100%;
      min-height: 0;
    }
    .code-content-area .code-inner {
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 16px 20px;
      box-sizing: border-box;
    }
    .cvc-page-number {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      color: #6c757d;
      z-index: 2;
      pointer-events: none;
    }

    /* Cover (print) */
    .cover-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: var(--card-h);
      border: 3px solid var(--accent);
      border-radius: 24px;
      font-family: 'Times New Roman', Times, serif;
    }
    .cover-line { width: 110px; height: 4px; background: var(--accent); margin: 26px auto; border-radius: 2px; }
    .cover-title { font-size: 56px; font-weight: 800; color: #1a1a2e; letter-spacing: 2px; }
    .cover-subtitle { font-size: 28px; font-weight: 400; color: var(--primary); margin-top: 12px; font-style: italic; }

    /* TOC */
    .toc-card {
      border: 3px solid var(--accent);
      border-radius: 24px;
      height: var(--card-h);
      padding: 26px 36px;
      position: relative;
      font-family: 'Times New Roman', Times, serif;
      overflow: hidden;
    }
    .toc-title {
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 18px;
      border-bottom: 4px solid var(--accent);
      padding-bottom: 8px;
    }
    .toc-list { list-style: none; }
    .toc-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 5px;
      border-bottom: 1px dashed #dee2e6;
      font-size: 13px;
      font-weight: 600;
    }
    .toc-item .toc-page-num { font-weight: 800; color: var(--primary); min-width: 56px; text-align: right; }

    /* Thumbnail scale */
    .thumb-box {
      width: 440px;
      height: 340px;
      border: 2px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      position: relative;
      box-shadow: var(--shadow);
    }
    .thumb-box .page-frame {
      transform: scale(0.4);
      transform-origin: top left;
      position: absolute;
      top: 0; left: 0;
      box-shadow: none;
      border-radius: 0;
    }

    /* ========== PRESENTATION ========== */
    .present-overlay {
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 9000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .present-overlay.active { display: flex; }
    .present-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 12px;
    }
    .present-stage .page-frame {
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .present-nav {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }
    .nav-cluster {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
      z-index: 6;
    }
    .nav-cluster.left { left: 14px; }
    .nav-cluster.right { right: 14px; }
    .present-nav-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .present-nav-btn:hover { background: rgba(255,255,255,0.3); }
    .present-topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 5;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .present-overlay:hover .present-topbar { opacity: 1; }
    .present-indicator {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      z-index: 5;
    }
    .present-close {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }
    .present-close:hover { background: rgba(255,255,255,0.3); }

    /* ========== SIDE PANELS ========== */
    .side-panel {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 300px;
      background: var(--surface);
      box-shadow: var(--shadow);
      z-index: 800;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .side-panel.right { left: auto; right: 0; transform: translateX(100%); }
    .side-panel.active { transform: translateX(0); }
    .side-panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
    }
    .side-panel-body { flex: 1; overflow-y: auto; padding: 12px; }
    .side-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      transition: border-color 0.12s;
    }
    .side-item:hover { border-color: var(--accent); }
    .overlay-dim {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 700;
      display: none;
    }
    .overlay-dim.active { display: block; }

    /* ========== TOAST & MODAL ========== */
    .toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 360px;
      pointer-events: none;
    }
    .toast {
      padding: 12px 16px;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      animation: slideIn 0.25s ease;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    .toast.info { background: #2c7be5; }
    .toast.warning { background: #e67e22; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9500;
    }
    .modal {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 24px 48px rgba(0,0,0,0.25);
    }
    .modal h3 { margin-bottom: 8px; }
    .modal p { color: var(--muted); margin-bottom: 18px; font-size: 14px; }
    .modal .actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* ========== EMPTY / HELPERS ========== */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .hidden { display: none !important; }

    /* ========== FLASH MODE (manager) ========== */
    .flash-view { display: flex; width: 100%; height: 100%; overflow: hidden; }
    .flash-deck-list-panel {
      width: 300px;
      min-width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .flash-deck-list { flex: 1; overflow-y: auto; padding: 8px; }
    .flash-deck-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      margin-bottom: 4px;
    }

    /* ========== PRINT ========== */

<body>

  <script>
  (function () {
    'use strict';

    // ========== CONSTANTS ==========
    const DB_NAME = 'phonics_slide_studio_v1';
    const DB_STORE = 'data';
    const MAX_HISTORY = 40;

    const PAGE_H = 850;    // now height is the smaller number
    const FLASH_COLORS = ['#1a1a1a', '#e63946', '#1d6fd6', '#2d9d4f', '#f0b800', '#ffffff'];

    // ========== STATE ==========
    let state = {

    // ========== UTIL ==========
    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

    const clone = (o) => JSON.parse(JSON.stringify(o));
    const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, m =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

    function showToast(msg, type = 'info') {
      const t = document.createElement('div');

      setTimeout(() => t.remove(), 3200);
    }

    function confirmDialog(msg, onYes) {
      const o = document.createElement('div');
      o.className = 'modal-overlay';

        <div class="modal">
          <h3>Confirm</h3>
          <p>${escapeHtml(msg)}</p>
          <div class="actions">
            <button class="btn btn-outline cancel">Cancel</button>
            <button class="btn btn-danger confirm">Yes</button>

      document.body.appendChild(o);
      o.querySelector('.cancel').onclick = () => o.remove();
      o.querySelector('.confirm').onclick = () => { o.remove(); onYes(); };
    }

    // ========== SANITIZE ==========
    function sanitizeHTML(html) {
      const d = new DOMParser().parseFromString(String(html || ''), 'text/html');
      d.querySelectorAll('script,iframe,object,embed,link,meta,base,form').forEach(n => n.remove());
      d.querySelectorAll('*').forEach(n => {
        [...n.attributes].forEach(a => {
          if (/^on/i.test(a.name) || a.name === 'srcdoc') n.removeAttribute(a.name);
        });
      });
      d.querySelectorAll('[href],[src]').forEach(n => {
        ['href', 'src'].forEach(k => {
          const v = n.getAttribute(k) || '';
          if (/^\s*(javascript:|vbscript:|data:text\/html)/i.test(v)) n.removeAttribute(k);
        });
      });
      return d.body.innerHTML;
    }

    function sanitizeCSS(css) {
      return String(css || '')
        .replace(/@import\s+[^;]+;?/gi, '')
        .replace(/expression\s*\([^)]*\)/gi, '')
        .replace(/url\s*\(\s*['"]?\s*javascript:[^)]*\)/gi, '');
    }

    function scopeCSS(css, scopeClass) {
      const raw = sanitizeCSS(css);
      let out = '';
      try {
        const chunks = raw.split('}');
        for (const chunk of chunks) {
          const t = chunk.trim();
          if (!t) continue;
          const brace = t.indexOf('{');
          if (brace === -1) {
            if (t.startsWith('@')) out += t + '}';
            continue;
          }
          const selectors = t.slice(0, brace).trim();
          const body = t.slice(brace + 1).trim();
          if (!selectors) continue;
          const scoped = selectors.split(',').map(s => {
            s = s.trim();
            if (!s) return s;
            if (s.includes('.' + scopeClass)) return s;
            return `.${scopeClass} ${s}`;
          }).filter(Boolean).join(', ');
          out += `${scoped} { ${body} }\n`;
        }
      } catch (_) {
        out = raw;
      }
      return out;
    }

    // ========== PAGE RENDERER ==========
    function renderPageElement(page, opts = {}) {
      const pageNum = (opts.pageNum == null ? 1 : opts.pageNum);
      const isThumb = !!opts.isThumbnail;

      const contentArea = document.createElement('div');
      contentArea.className = 'code-content-area';
      contentArea.style.background = page.contentBackground || '#ffffff';

      const scopeClass = 'scope-' + String(page.id || 'p').replace(/[^a-zA-Z0-9_-]/g, '');
      contentArea.classList.add(scopeClass);

      const style = document.createElement('style');
      style.textContent = scopeCSS(page.css || '', scopeClass);

      const inner = document.createElement('div');
      inner.className = 'code-inner';
      inner.innerHTML = sanitizeHTML(page.html || '');

      contentArea.append(style, inner);
      card.appendChild(contentArea);

      const pn = document.createElement('div');
      pn.className = 'cvc-page-number';
      pn.textContent = pageNum;
      card.appendChild(pn);

      frame.appendChild(card);

      if (!isThumb && typeof page.js === 'string' && page.js.trim()) {
        try {
          const fn = new Function('root', page.js);
          setTimeout(() => {
            try { fn(inner); } catch (e) { console.warn('Page JS error:', e); }
          }, 0);
        } catch (e) {
          console.warn('Page JS compile error:', e);
        }
      }

      return frame;
    }

    // ========== HARD-CODED DEFAULT DECKS ==========

item=\"toward\">toward</button></td></tr>\n        <tr><td><button class=\"tap-item word-btn\" type=\"button\" data-item=\"smart\">smart</button></td><td><button class=\"tap-item word-btn hl-btn\" type=\"button\" data-item=\"forward\">forward</button></td></tr>\n        <tr><td><button class=\"tap-item word-btn\" type=\"button\" data-item=\"chart\">chart</button></td><td><button class=\"tap-item word-btn hl-btn\" type=\"button\" data-item=\"ar(or)\">ar(or)</button></td></tr>\n      </table>\n    </div>\n    <div class=\"mini-table or-table\">\n      <table>\n        <tr class=\"hdr\"><th colspan=\"2\"><button class=\"tap-item hdr-btn or-hdr\" type=\"button\" data-item=\"or\">or</button></th></tr>\n        <tr><td><button class=\"tap-item word-btn\" type=\"button\" data-item=\"born\">born</button></td><td><button class=\"tap-item word-btn hl-btn\" type=\"button\" data-item=\"worm\">worm</button></td></tr>\n        <tr><td><button class=\"tap-item word-btn\" type=\"button\" data-item=\"fork\">fork</button></td><td><button class=\"tap-item word-btn hl-btn\" type=\"button\" data-item=\"word\">word</button></td></tr>\n        <tr><td><button class=\"tap-item word-btn\" type=\"button\" data-item=\"torn\">torn</button></td><td><button class=\"tap-item word-btn hl-btn\" type=\"button\" data-item=\"work\">work</button></td></tr>\n        <tr><td><button class=\"tap-item word-btn\" type=\"button\" data-item=\"cord\">cord</button></td><td><button class=\"tap-item word-btn hl-btn\" type=\"button\" data-item=\"world\">world</button></td></tr>\n        <tr><td><button class=\"tap-item word-btn\" type=\"button\" data-item=\"fort\">fort</button></td><td><button class=\"tap-item word-btn hl-btn\" type=\"button\" data-item=\"worse\">worse</button></td></tr>\n        <tr><td><button class=\"tap-item word-btn\" type=\"button\" data-item=\"scorn\">scorn</button></td><td><button class=\"tap-item word-btn hl-btn\" type=\"button\" data-item=\"worst\">worst</button></td></tr>\n        <tr><td><button class=\"tap-item word-btn\" type=\"button\" data-item=\"corn\">corn</button></td><td><button class=\"tap-item word-btn hl-btn\" type=\"button\" data-item=\"worth\">worth</button></td></tr>\n        <tr><td><button class=\"tap-item word-btn\" type=\"button\" data-item=\"storm\">storm</button></td><td><button class=\"tap-item word-btn hl-btn\" type=\"button\" data-item=\"worship\">worship</button></td></tr>\n        <tr><td><button class=\"tap-item word-btn\" type=\"button\" data-item=\"for\">for</button></td><td><button class=\"tap-item word-btn hl-btn\" type=\"button\" data-item=\"worsen\">worsen</button></td></tr>\n        <tr><td><button class=\"tap-item word-btn\" type=\"button\" data-item=\"worn\">worn</button></td><td><button class=\"tap-item word-btn hl-btn\" type=\"button\" data-item=\"or(er)\">or(er)</button></td></tr>\n      </table>\n    </div>\n  </div>\n</div>\n",
      "css": "\n.content-root{width:100%;height:100%;padding:10px 12px;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#fff;display:flex;flex-direction:column;}\n.page-title{font-size:26px;font-weight:800;color:#1a237e;text-align:center;margin:0 0 8px;}\n.tables-grid{flex:1;display:grid;gap:10px;min-height:0;}\n.two-col{grid-template-columns:1fr 1fr;}\n.mini-table{border-radius:10px;padding:6px;display:flex;flex-direction:column;min-height:0;overflow:hidden;}\n.ar-table{background:#fff8e1;}\n.or-table{background:#e8f5e9;}\n.mini-table table{width:100%;border-collapse:collapse;table-layout:fixed;flex:1;}\n.mini-table th,.mini-table td{padding:2px;text-align:center;vertical-align:middle;}\n.ar-hdr{width:100%;min-height:34px;border:none;border-radius:8px 8px 0 0;background:#ffcc80;color:#e65100;font-size:18px;font-weight:800;cursor:pointer;}\n.or-hdr{width:100%;min-height:34px;border:none;border-radius:8px 8px 0 0;background:#a5d6a7;color:#1b5e20;font-size:18px;font-weight:800;cursor:pointer;}\n.hdr-btn:hover{filter:brightness(0.95);}\n.word-btn{width:100%;min-height:28px;border:1.5px solid #e0e0e0;border-radius:6px;background:#fff;color:#1a1a1a;font-size:14px;font-weight:700;cursor:pointer;padding:3px 2px;}\n.hl-btn{background:#fff3e0;border-color:#ffcc80;color:#e65100;}\n.or-table .hl-btn{background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32;}\n.word-btn:hover{border-color:#F5A623;background:#fffde7;}\n",
      "js": "\nconst overlay = document.createElement('div');\noverlay.className = 'item-fullscreen';\noverlay.style.cssText = `\n  position: absolute !important;\n  top: 0 !important; left: 0 !important;\n  width: 100% !important; height: 100% !important;\n  background: #ffffff !important;\n  display: none !important;\n  align-items: center !important;\n  justify-content: center !important;\n  z-index: 10 !important;\n  padding: 40px !important;\n  box-sizing: border-box !important;\n  pointer-events: auto !important;\n`;\n\nconst closeBtn = document.createElement('button');\ncloseBtn.type = 'button';\ncloseBtn.setAttribute('aria-label', 'Close');\ncloseBtn.textContent = '\u00d7';\ncloseBtn.style.cssText = `\n  position: absolute; left: 20px; top: 20px;\n  width: 48px; height: 48px; border: 2px solid #333; border-radius: 50%;\n  background: #fff; color: #333; font-size: 28px; font-weight: 800;\n  line-height: 1; cursor: pointer; z-index: 20;\n  display: flex; align-items: center; justify-content: center;\n  box-shadow: 0 2px 6px rgba(0,0,0,0.2);\n`;\n\nconst textEl = document.createElement('div');\ntextEl.style.cssText = `\n  font-family: 'Segoe UI', system-ui, sans-serif;\n  font-size: clamp(48px, 12vw, 120px);\n  font-weight: 800;\n  line-height: 1.2;\n  text-align: center;\n  color: #1a1a1a;\n  max-width: 95%;\n  cursor: pointer;\n  user-select: none;\n`;\n\noverlay.appendChild(closeBtn);\noverlay.appendChild(textEl);\n\nconst pageFrame = root.closest('.page-frame');\nif (pageFrame) pageFrame.appendChild(overlay);\nelse root.appendChild(overlay);\n\nconst close = () => {\n  overlay.classList.remove('open');\n  overlay.style.display = 'none';\n  textEl.textContent = '';\n  textEl.style.color = '#1a1a1a';\n};\ncloseBtn.addEventListener('click', close);\noverlay.addEventListener('click', e => { if (e.target === overlay) close(); });\n\nconst COLORS = ['#1a1a1a', '#e63946', '#1d6fd6', '#E2571C', '#2a9d8f'];\nlet colorIdx = 0;\ntextEl.addEventListener('click', () => {\n  colorIdx = (colorIdx + 1) % COLORS.length;\n  textEl.style.color = COLORS[colorIdx];\n});\n\nroot.querySelectorAll('.tap-item').forEach(el => {\n  el.addEventListener('click', () => {\n    const t = el.dataset.item || el.textContent.trim();\n    textEl.textContent = t;\n    colorIdx = 0;\n    textEl.style.color = COLORS[0];\n    overlay.classList.add('open');\n    overlay.style.display = 'flex';\n  });\n});\n\nif (!window.__phonicsItemEscapeInstalled) {\n  window.__phonicsItemEscapeInstalled = true;\n  window.addEventListener('keydown', e => {\n    if (e.key === 'Escape') {\n      document.querySelectorAll('.item-fullscreen.open').forEach(o => {\n        o.classList.remove('open');\n        o.style.display = 'none';\n      });\n    }\n  });\n}\n"

      "js": "\nconst overlay = document.createElement('div');\noverlay.className = 'item-fullscreen';\noverlay.style.cssText = `\n  position: absolute !important;\n  top: 0 !important; left: 0 !important;\n  width: 100% !important; height: 100% !important;\n  background: #ffffff !important;\n  display: none !important;\n  align-items: center !important;\n  justify-content: center !important;\n  z-index: 10 !important;\n  padding: 40px !important;\n  box-sizing: border-box !important;\n  pointer-events: auto !important;\n`;\n\nconst closeBtn = document.createElement('button');\ncloseBtn.type = 'button';\ncloseBtn.setAttribute('aria-label', 'Close');\ncloseBtn.textContent = '\u00d7';\ncloseBtn.style.cssText = `\n  position: absolute; left: 20px; top: 20px;\n  width: 48px; height: 48px; border: 2px solid #333; border-radius: 50%;\n  background: #fff; color: #333; font-size: 28px; font-weight: 800;\n  line-height: 1; cursor: pointer; z-index: 20;\n  display: flex; align-items: center; justify-content: center;\n  box-shadow: 0 2px 6px rgba(0,0,0,0.2);\n`;\n\nconst textEl = document.createElement('div');\ntextEl.style.cssText = `\n  font-family: 'Segoe UI', system-ui, sans-serif;\n  font-size: clamp(48px, 12vw, 120px);\n  font-weight: 800;\n  line-height: 1.2;\n  text-align: center;\n  color: #1a1a1a;\n  max-width: 95%;\n  cursor: pointer;\n  user-select: none;\n`;\n\noverlay.appendChild(closeBtn);\noverlay.appendChild(textEl);\n\nconst pageFrame = root.closest('.page-frame');\nif (pageFrame) pageFrame.appendChild(overlay);\nelse root.appendChild(overlay);\n\nconst close = () => {\n  overlay.classList.remove('open');\n  overlay.style.display = 'none';\n  textEl.textContent = '';\n  textEl.style.color = '#1a1a1a';\n};\ncloseBtn.addEventListener('click', close);\noverlay.addEventListener('click', e => { if (e.target === overlay) close(); });\n\nconst COLORS = ['#1a1a1a', '#e63946', '#1d6fd6', '#E2571C', '#2a9d8f'];\nlet colorIdx = 0;\ntextEl.addEventListener('click', () =>       "css": "\n.content-root{width:100%;height:100%;padding:8px 10px;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#fff;display:flex;flex-direction:column;}\n.page-title{font-size:24px;font-weight:800;color:#5d4037;text-align:center;margin:0 0 6px;}\n.tables-grid{flex:1;display:grid;gap:8px;min-height:0;grid-template-columns:1fr 1fr 1fr;}\n.mini-table{border-radius:10px;padding:4px;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:#e3f2fd;}\n.mini-table table{width:100%;border-collapse:collapse;table-layout:fixed;flex:1;}\n.mini-table th,.mini-table td{padding:2px;text-align:center;vertical-align:middle;}\n.hdr-btn{width:100%;min-height:32px;border:none;border-radius:6px 6px 0 0;background:#90caf9;color:#0d47a1;font-size:13px;font-weight:800;cursor:pointer;}\n.hdr-btn:hover{filter:brightness(0.95);}\n.word-btn{width:100%;min-height:26px;border:1.5px solid #bbdefb;border-radius:5px;background:#fff;color:#1a1a1a;font-size:13px;font-weight:700;cursor:pointer;padding:2px;}\n.word-btn:hover{border-color:#F5A623;background:#fffde7;}\n",
      "js": "\nconst overlay = document.createElement('div');\noverlay.className = 'item-fullscreen';\noverlay.style.cssText = `\n  position: absolute !important;\n  top: 0 !important; left: 0 !important;\n  width: 100% !important; height: 100% !important;\n  background: #ffffff !important;\n  display: none !important;\n  align-items: center !important;\n  justify-content: center !important;\n  z-index: 10 !important;\n  padding: 40px !important;\n  box-sizing: border-box !important;\n  pointer-events: auto !important;\n`;\n\nconst closeBtn = document.createElement('button');\ncloseBtn.type = 'button';\ncloseBtn.setAttribute('aria-label', 'Close');\ncloseBtn.textContent = '\u00d7';\ncloseBtn.style.cssText = `\n  position: absolute; left: 20px; top: 20px;\n  width: 48px; height: 48px; border: 2px solid #333; border-radius: 50%;\n  background: #fff; color: #333; font-size: 28px; font-weight: 800;\n  line-height: 1; cursor: pointer; z-index: 20;\n  display: flex; align-items: center; justify-content: center;\n  box-shadow: 0 2px 6px rgba(0,0,0,0.2);\n`;\n\nconst textEl = document.createElement('div');\ntextEl.style.cssText = `\n  font-family: 'Segoe UI', system-ui, sans-serif;\n  font-size: clamp(48px, 12vw, 120px);\n  font-weight: 800;\n  line-height: 1.2;\n  text-align: center;\n  color: #1a1a1a;\n  max-width: 95%;\n  cursor: pointer;\n  user-select: none;\n`;\n\noverlay.appendChild(closeBtn);\noverlay.appendChild(textEl);\n\nconst pageFrame = root.closest('.page-frame');\nif (pageFrame) pageFrame.appendChild(overlay);\nelse root.appendChild(overlay);\n\nconst close = () => {\n  overlay.classList.remove('open');\n  overlay.style.display = 'none';\n  textEl.textContent = '';\n  textEl.style.color = '#1a1a1a';\n};\ncloseBtn.addEventListener('click', close);\noverlay.addEventListener('click', e => { if (e.target === overlay) close(); });\n\nconst COLORS = ['#1a1a1a', '#e63946', '#1d6fd6', '#E2571C', '#2a9d8f'];\nlet colorIdx = 0;\ntextEl.addEventListener('click', () => {\n  colorIdx = (colorIdx + 1) % COLORS.length;\n  textEl.style.color = COLORS[colorIdx];\n});\n\nroot.querySelectorAll('.tap-item').forEach(el => {\n  el.addEventListener('click', () => {\n    const t = el.dataset.item || el.textContent.trim();\n    textEl.textContent = t;\n    colorIdx = 0;\n    textEl.style.color = COLORS[0];\n    overlay.classList.add('open');\n    overlay.style.display = 'flex';\n  });\n});\n\nif (!window.__phonicsItemEscapeInstalled) {\n  window.__phonicsItemEscapeInstalled = true;\n  window.addEventListener('keydown', e => {\n    if (e.key === 'Escape') {\n      document.querySelectorAll('.item-fullscreen.open').forEach(o => {\n        o.classList.remove('open');\n        o.style.display = 'none';\n      });\n    }\n  });\n}\n"

      "js": "\nconst overlay = document.createElement('div');\noverlay.className = 'item-fullscreen';\noverlay.style.cssText = `\n  position: absolute !important;\n  top: 0 !important; left: 0 !important;\n  width: 100% !important; height: 100% !important;\n  background: #ffffff !important;\n  display: none !important;\n  align-items: center !important;\n  justify-content: center !important;\n  z-index: 10 !important;\n  padding: 40px !important;\n  box-sizing: border-box !important;\n  pointer-events: auto !important;\n`;\n\nconst closeBtn = document.createElement('button');\ncloseBtn.type = 'button';\ncloseBtn.setAttribute('aria-label', 'Close');\ncloseBtn.textContent = '\u00d7';\ncloseBtn.style.cssText = `\n  position: absolute; left: 20px; top: 20px;\n  width: 48px; height: 48px; border: 2px solid #333; border-radius: 50%;\n  background: #fff; color: #333; font-size: 28px; font-weight: 800;\n  line-height: 1; cursor: pointer; z-index: 20;\n  display: flex; align-items: center; justify-content: center;\n  box-shadow: 0 2px 6px rgba(0,0,0,0.2);\n`;\n\nconst textEl = document.createElement('div');\ntextEl.style.cssText = `\n  font-family: 'Segoe UI', system-ui, sans-serif;\n  font-size: clamp(48px, 12vw, 120px);\n  font-weight: 800;\n  line-height: 1.2;\n  text-align: center;\n  color: #1a1a1a;\n  max-width: 95%;\n  cursor: pointer;\n  user-select: none;\n`;\n\noverlay.appendChild(closeBtn);\noverlay.appendChild(textEl);\n\nconst pageFrame = root.closest('.page-frame');\nif (pageFrame) pageFrame.appendChild(overlay);\nelse root.appendChild(overlay);\n\nconst close = () => {\n  overlay.classList.remove('open');\n  overlay.style.display = 'none';\n  textEl.textContent = '';\n  textEl.style.color = '#1a1a1a';\n};\ncloseBtn.addEventListener('click', close);\noverlay.addEventListener('click', e => { if (e.target === overlay) close(); });\n\nconst COLORS = ['#1a1a1a', '#e63946', '#1d6fd6', '#E2571C', '#2a9d8f'];\nlet colorIdx = 0;\ntextEl.addEventListener('click', () => {\n  colorIdx = (colorIdx + 1) % COLORS.length;\n  textEl.style.color = COLORS[colorIdx];\n});\n\nroot.querySelectorAll('.tap-item').forEach(el => {\n  el.addEventListener('click', () => {\n    const t = el.dataset.item || el.textContent.trim();\n    textEl.textContent = t;\n    colorIdx = 0;\n    textEl.style.color = COLORS[0];\n    overlay.classList.add('open');\n    overlay.style.display = 'flex';\n  });\n});\n\nif (!window.__phonicsItemEscapeInstalled) {\n  window.__phonicsItemEscapeInstalled = true;\n  window.addEventListener('keydown', e => {\n    if (e.key === 'Escape') {\n      document.querySelectorAll('.item-fullscreen.open').forEach(o => {\n        o.classList.remove('open');\n        o.style.display = 'none';\n      });\n    }\n  });\n}\n"

      "css": "\n.content-root{width:100%;height:100%;padding:12px 14px;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#fff;display:flex;flex-direction:column;}\n.page-title{font-size:24px;font-weight:800;color:#2e7d32;text-align:center;margin:0 0 12px;}\n.word-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start;}\n.word-btn{min-height:42px;border:2px solid #c8e6c9;border-radius:10px;background:#e8f5e9;color:#1a1a1a;font-size:16px;font-weight:700;cursor:pointer;}\n.word-btn:hover{border-color:#F5A623;background:#fffde7;transform:scale(1.03);}\n",
      "js": "\nconst overlay = document.createElement('div');\noverlay.className = 'item-fullscreen';\noverlay.style.cssText = `\n  position: absolute !important;\n  top: 0 !important; left: 0 !important;\n  width: 100% !important; height: 100% !important;\n  background: #ffffff !important;\n  display: none !important;\n  align-items: center !important;\n  justify-content: center !important;\n  z-index: 10 !important;\n  padding: 40px !important;\n  box-sizing: border-box !important;\n  pointer-events: auto !important;\n`;\n\nconst closeBtn = document.createElement('button');\ncloseBtn.type = 'button';\ncloseBtn.setAttribute('aria-label', 'Close');\ncloseBtn.textContent = '\u00d7';\ncloseBtn.style.cssText = `\n  position: absolute; left: 20px; top: 20px;\n  width: 48px; height: 48px; border: 2px solid #333; border-radius: 50%;\n  background: #fff; color: #333; font-size: 28px; font-weight: 800;\n  line-height: 1; cursor: pointer; z-index: 20;\n  display: flex; align-items: center; justify-content: center;\n  box-shadow: 0 2px 6px rgba(0,0,0,0.2);\n`;\n\nconst textEl = document.createElement('div');\ntextEl.style.cssText = `\n  font-family: 'Segoe UI', system-ui, sans-serif;\n  font-size: clamp(48px, 12vw, 120px);\n  font-weight: 800;\n  line-height: 1.2;\n  text-align: center;\n  color: #1a1a1a;\n  max-width: 95%;\n  cursor: pointer;\n  user-select: none;\n`;\n\noverlay.appendChild(closeBtn);\noverlay.appendChild(textEl);\n\nconst pageFrame = root.closest('.page-frame');\nif (pageFrame) pageFrame.appendChild(overlay);\nelse root.appendChild(overlay);\n\nconst close = () => {\n  overlay.classList.remove('open');\n  overlay.style.display = 'none';\n  textEl.textContent = '';\n  textEl.style.color = '#1a1a1a';\n};\ncloseBtn.addEventListener('click', close);\noverlay.addEventListener('click', e => { if (e.target === overlay) close(); });\n\nconst COLORS = ['#1a1a1a', '#e63946', '#1d6fd6', '#E2571C', '#2a9d8f'];\nlet colorIdx = 0;\ntextEl.addEventListener('click', () => {\n  colorIdx = (colorIdx + 1) % COLORS.length;\n  textEl.style.color = COLORS[colorIdx];\n});\n\nroot.querySelectorAll('.tap-item').forEach(el => {\n  el.addEventListener('click', () => {\n    const t = el.dataset.item || el.textContent.trim();\n    textEl.textContent = t;\n    colorIdx = 0;\n    textEl.style.color = COLORS[0];\n    overlay.classList.add('open');\n    overlay.style.display = 'flex';\n  });\n});\n\nif (!window.__phonicsItemEscapeInstalled) {\n  window.__phonicsItemEscapeInstalled = true;\n  window.addEventListener('keydown', e => {\n    if (e.key === 'Escape') {\n      document.querySelectorAll('.item-fullscreen.open').forEach(o => {\n        o.classList.remove('open');\n        o.style.display = 'none';\n      });\n    }\n  });\n}\n"

            html: '\n<div class="content-root">\n  <div class="consonants-header">\n    <h2>21 Consonants</h2>\n    <div class="caps-toggle">\n      <button type="button" class="caps-btn active" data-case="upper">ABC</button>\n      <button type="button" class="caps-btn" data-case="lower">abc</button>\n    </div>\n  </div>\n  <div class="consonants-grid">\n    <button class="letter" type="button" data-letter="B">B</button>\n    <button class="letter" type="button" data-letter="C">C</button>\n    <button class="letter" type="button" data-letter="D">D</button>\n    <button class="letter" type="button" data-letter="F">F</button>\n    <button class="letter" type="button" data-letter="G">G</button>\n    <button class="letter" type="button" data-letter="H">H</button>\n    <button class="letter" type="button" data-letter="J">J</button>\n    <button class="letter" type="button" data-letter="K">K</button>\n    <button class="letter" type="button" data-letter="L">L</button>\n    <button class="letter" type="button" data-letter="M">M</button>\n    <button class="letter" type="button" data-letter="N">N</button>\n    <button class="letter" type="button" data-letter="P">P</button>\n    <button class="letter" type="button" data-letter="Q">Q</button>\n    <button class="letter" type="button" data-letter="R">R</button>\n    <button class="letter" type="button" data-letter="S">S</button>\n    <button class="letter" type="button" data-letter="T">T</button>\n    <button class="letter" type="button" data-letter="V">V</button>\n    <button class="letter" type="button" data-letter="W">W</button>\n    <button class="letter" type="button" data-letter="X">X</button>\n    <button class="letter" type="button" data-letter="Y">Y</button>\n    <button class="letter" type="button" data-letter="Z">Z</button>\n  </div>\n</div>',
            css: '.content-root{width:100%;height:100%;padding:18px 20px;overflow:hidden;font-family:\'Segoe UI\',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffff;}\n.consonants-header{margin-bottom:24px;text-align:center;}\n.consonants-header h2{font-size:32px;font-weight:800;color:#E2571C;text-transform:uppercase;letter-spacing:2px;margin:0 0 12px;}\n.caps-toggle{display:flex;justify-content:center;gap:0;margin-top:4px;}\n.caps-btn{padding:8px 22px;font-size:16px;font-weight:800;border:2px solid #dee2e6;background:#fff;color:#1a1a1a;cursor:pointer;transition:all .15s;border-radius:20px;}\n.caps-btn:first-child{border-radius:20px 0 0 20px;}\n.caps-btn:last-child{border-radius:0 20px 20px 0;border-left:none;}\n.caps-btn.active{background:#E2571C;border-color:#E2571C;color:#fff;}\n.caps-btn:not(.active):hover{background:#f5f7fa;}\n.consonants-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:14px;width:100%;max-width:820px;padding:10px;justify-items:center;align-items:center;}\n.letter{width:80px;height:80px;border:3px solid #dee2e6;border-radius:20px;background:#fff;font-size:38px;font-weight:800;color:#1a1a1a;cursor:pointer;transition:all .15s ease;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.08);}\n.letter:hover{border-color:#F5A623;transform:scale(1.06);box-shadow:0 6px 14px rgba(0,0,0,.12);}\n.letter:active{transform:scale(0.95);}',
            contentBackground: '#ffffff',
            js: 'const letters = document.querySelectorAll(\'.letter\');\nconst colors = [\'#1a1a1a\',\'#ff0000\',\'#ff7f00\',\'#ffff00\',\'#00ff00\',\'#0000ff\',\'#4b0082\',\'#9400d3\'];\nconst stateMap = new Map();\nletters.forEach(letter => {\n  letter.addEventListener(\'click\', () => {\n    const key = letter.dataset.letter;\n    const cur = stateMap.get(key) || 0;\n    const next = (cur + 1) % colors.length;\n    letter.style.color = colors[next];\n    stateMap.set(key, next);\n  });\n});\n\n// Caps Toggle\nconst capsBtns = document.querySelectorAll(\'.caps-btn\');\ncapsBtns.forEach(btn => {\n  btn.addEventListener(\'click\', () => {\n    capsBtns.forEach(b => b.classList.remove(\'active\'));\n    btn.classList.add(\'active\');\n    const isUpper = btn.dataset.case === \'upper\';\n    letters.forEach(letter => {\n      const orig = letter.dataset.letter;\n      letter.textContent = isUpper ? orig.toUpperCase() : orig.toLowerCase();\n    });\n  });\n});'

    // ========== PERSISTENCE ==========
    let dbPromise = null;
    function getDB() {
      if (!dbPromise) {
        dbPromise = new Promise(function (resolve, reject) {
          try {
            if (!window.indexedDB) {
              reject(new Error('IndexedDB unavailable'));
              return;
            }
            var req = window.indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = function (e) {
              var db = e.target.result;
              if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
            };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { reject(req.error || new Error('IndexedDB open failed')); };
            req.onblocked = function () { reject(new Error('IndexedDB blocked')); };
          } catch (err) {
            reject(err);
          }
        });
      }
      return dbPromise;
    }

    async function persist() {
      const payload = {
        version: 1,
        decks: state.decks,
        currentDeckId: state.currentDeckId,
        theme: state.theme,
        fontScale: state.fontScale,
        history: state.history.slice(0, MAX_HISTORY)
      };
      try {
        const db = await getDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, 'readwrite');
          tx.objectStore(DB_STORE).put(payload, 'app');
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      } catch (e) {
        try {
          localStorage.setItem(DB_NAME, JSON.stringify(payload));
        } catch (_) {
          showToast('Could not save. Storage full?', 'error');
        }
      }
    }

    async function loadPersisted() {
      let data = null;
      try {
        const db = await getDB();
        data = await new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, 'readonly');
          const req = tx.objectStore(DB_STORE).get('app');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      } catch (_) {}
      if (!data) {
        try {
          const raw = localStorage.getItem(DB_NAME);
          if (raw) data = JSON.parse(raw);
        } catch (_) {}
      }
      if (data && data.decks) {
        state.decks = data.decks;
        state.currentDeckId = data.currentDeckId || null;
        state.theme = data.theme || 'light';
        state.fontScale = data.fontScale || 1;
        state.history = Array.isArray(data.history) ? data.history : [];
      }
    }

    // ========== NORMALIZE IMPORT ==========
    function normalizeImported(raw) {
      let pages = [];
      let deckName = 'Imported Deck';
      let cover = { title: 'Crystal Phonics', subtitle: 'Grade 1' };
      let includeToc = true;

      if (Array.isArray(raw.pages)) {
        pages = raw.pages;
        if (raw.deckName) deckName = String(raw.deckName);
        else if (raw.coverData && raw.coverData.title) deckName = String(raw.coverData.title);
        if (raw.cover) cover = { title: String(raw.cover.title || cover.title), subtitle: String(raw.cover.subtitle || '') };
        else if (raw.coverData) cover = { title: String(raw.coverData.title || cover.title), subtitle: String(raw.coverData.subtitle || '') };
        if (raw.includeToc !== undefined) includeToc = !!raw.includeToc;
      } else if (Array.isArray(raw)) {
        pages = raw;
      } else {
        throw new Error('Unrecognized JSON structure');
      }

      const safePages = pages.slice(0, 200).map((p) => {
        const id = p.id && typeof p.id === 'string' ? p.id : uid('p');
        if (p.type === 'structured' && Array.isArray(p.sections)) {
          return {
            id,
            name: String(p.name || p.mainTitle || 'Structured Page'),
            mainTitle: String(p.mainTitle || 'Untitled'),
            subtitle: String(p.subtitle || ''),
            html: `<div class="content"><p><em>Imported structured page — re-create in editor or export as code page from Publisher.</em></p><pre style="font-size:12px;white-space:pre-wrap;">${escapeHtml(JSON.stringify((p.sections ? p.sections.map(s => s.type) : []), null, 0))}</pre></div>`,
            css: '.content{padding:8px}em{color:#666}',
            contentBackground: '#ffffff',
            js: ''
          };
        }
        return {
          id,
          name: String(p.name || p.mainTitle || 'Page'),
          mainTitle: String(p.mainTitle || 'Untitled'),
          subtitle: String(p.subtitle || ''),
          html: String(p.html || ''),
          css: String(p.css || ''),
          contentBackground: String(p.contentBackground || p.background || '#ffffff'),
          js: String(p.js || '')
        };
      });

      const safeFlashDecks = Array.isArray(raw.flashDecks) ? raw.flashDecks.slice(0, 100).map(fd => {
        const items = Array.isArray(fd.items) ? fd.items.slice(0, 500).map(it => ({
          id: it.id && typeof it.id === 'string' ? it.id : uid('item'),
          text: String(it.text || '').trim()
        })).filter(it => it.text) : [];
        return {
          id: fd.id && typeof fd.id === 'string' ? fd.id : uid('flash'),
          name: String(fd.name || 'Flash Deck'),
          type: fd.type === 'sentences' ? 'sentences' : 'words',
          items
        };
      }) : [];

      return {
        id: uid('deck'),
        deckName,
        cover,
        includeToc,
        pages: safePages.length ? safePages : [createEmptyPage()],
        flashDecks: safeFlashDecks,
        updatedAt: Date.now()
      };
    }

    // ========== HISTORY ==========
    function pushHistory(deckId, pageId, name) {
      state.history = state.history.filter(h => !(h.deckId === deckId && h.pageId === pageId));
      state.history.unshift({ deckId, pageId, name, ts: Date.now() });
      if (state.history.length > MAX_HISTORY) state.history.length = MAX_HISTORY;
      persist();
    }

    // ========== CURRENT HELPERS ==========
    function currentDeck() {
      return state.currentDeckId ? state.decks[state.currentDeckId] : null;
    }
    function currentPage() {
      const d = currentDeck();
      if (!d || !state.currentPageId) return null;
      return d.pages.find(p => p.id === state.currentPageId) || null;
    }
    function deckFlashDecks(deck) {
      if (!deck) return [];
      if (!Array.isArray(deck.flashDecks)) deck.flashDecks = [];
      return deck.flashDecks;
    }
    function currentFlashDeck() {
      const d = currentDeck();
      if (!d || !state.ui.currentFlashDeckId) return null;
      return deckFlashDecks(d).find(f => f.id === state.ui.currentFlashDeckId) || null;
    }
    function filteredPages() {
      const d = currentDeck();
      if (!d) return [];
      const q = (state.searchQuery || '').toLowerCase().trim();
      if (!q) return d.pages;
      return d.pages.filter(p =>
        (p.name || '').toLowerCase().includes(q) ||
        (p.mainTitle || '').toLowerCase().includes(q) ||
        (p.subtitle || '').toLowerCase().includes(q)
      );
    }

    // ========== RENDER APP ==========
    function applyTheme() {
      document.documentElement.classList.toggle('dark', state.theme === 'dark');
      document.documentElement.style.setProperty('--font-scale', state.fontScale);
    }

   function render() {
  applyTheme();

  // Capture scroll only if we are still showing the same deck (not switching decks)

  // Wire up header actions
  $('#logoBtn').onclick = () => {

    state.ui.dirty = false;
    state.ui.mode = 'library';
    state.ui.topicsOpen = false;
    state.ui.historyOpen = false;
    lastRenderedDeckId = null;
    render();
  };

  $('#deckSwitcher').onchange = (e) => {
    const id = e.target.value;
    if (!id) return;
    if (state.ui.dirty && !confirm('Discard unsaved changes?')) {
      e.target.value = state.currentDeckId || '';
      return;
    }

    // Capture the current deck's scroll BEFORE switching
    if (state.ui.mode === 'deck' && state.currentDeckId) {
      const listEl = document.querySelector('.page-list');
      if (listEl) {
        deckScrollMap[state.currentDeckId] = {
          scroll: listEl.scrollTop,
          search: state.searchQuery || ''
        };
      }
    }

    state.ui.dirty = false;
    state.currentDeckId = id;
    const d = state.decks[id];
    state.currentPageId = (d && d.pages && d.pages[0] ? d.pages[0].id : null) || null;
    state.ui.mode = 'deck';
    state.searchQuery = '';
    lastRenderedDeckId = null;
    persist();
    render();
  };

  $('#searchInput').oninput = (e) => {
    state.searchQuery = e.target.value;
    if (state.ui.mode === 'deck') render();
  };

  $('#btnLoad').onclick = () => $('#fileInput').click();
  $('#btnTopics').onclick = () => {
    state.ui.topicsOpen = !state.ui.topicsOpen;
    state.ui.historyOpen = false;
    render();
  };

    state.ui.historyOpen = !state.ui.historyOpen;
    state.ui.topicsOpen = false;

  };

    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    persist();
    render();
  };
  $('#btnFont').onclick = () => {
    const scales = [0.9, 1, 1.1, 1.2];

  const addBtn = $('#btnAddPage');

  $('#overlayDim').classList.toggle('active', state.ui.topicsOpen || state.ui.historyOpen);
  $('#overlayDim').onclick = () => {
    state.ui.topicsOpen = false;
    state.ui.historyOpen = false;
    render();
  };

  // After rendering, remember which deck is displayed
  lastRenderedDeckId = state.ui.mode === 'deck' ? state.currentDeckId : null;
}

}

    // ---------- Deck View ----------
    function renderDeckView(main) {

        pushHistory(deck.id, p.id, p.name);
        render();
      };
      item.querySelector('.edit').onclick = (e) => {
        e.stopPropagation();
        startEditPage(p.id);
      };
      item.querySelector('.dup').onclick = (e) => {
        e.stopPropagation();
        const copy = clone(p);
        copy.id = uid('p');
        copy.name = (copy.name || 'Page') + ' (copy)';
        deck.pages.push(copy);

        state.currentPageId = copy.id;

        render();

      };
      item.querySelector('.del').onclick = (e) => {

          if (state.currentPageId === p.id) {
            state.currentPageId = (deck.pages && deck.pages[0] ? deck.pages[0].id : null);
          }
          deck.updatedAt = Date.now();
          persist();
          render();
          showToast('Page deleted', 'success');
        });
      };
      list.appendChild(item);
    });
  }

  // >>> Restore scroll using requestAnimationFrame <<<
  const deckId = state.currentDeckId;
  const saved = deckScrollMap[deckId];
  const listScrollEl = view.querySelector('.page-list');
  if (listScrollEl && saved) {
    if (saved.search === state.searchQuery) {
      // Apply after the browser has laid out the new items
      requestAnimationFrame(() => {
        listScrollEl.scrollTop = saved.scroll;
      });
    } else {
      deckScrollMap[deckId] = { scroll: 0, search: state.searchQuery };
      listScrollEl.scrollTop = 0;
    }
  }
  // >>> End restore <<<

  const preview = document.createElement('div');
  preview.className = 'preview-panel';
  const page = currentPage();
  const pageNum = page ? deck.pages.findIndex(x => x.id === page.id) + 1 : 0;

  preview.innerHTML = `
    <div class="preview-toolbar">
      <span class="info">${page ? escapeHtml(page.name) + ' · ' + pageNum + ' / ' + deck.pages.length : 'No page selected'}</span>

  $('#btnPrintOne').onclick = () => page && printPages([page], deck, pageNum);
  $('#btnPrintAll').onclick = () => printAll(deck);
  $('#btnExportDeck').onclick = () => exportDeck(deck);
}
    // ---------- Editor with Image Manager ----------
    function startNewPage() {
      state.ui.editingPageId = null;
      state.ui.mode = 'edit';
      state.ui.dirty = false;
      render();
    }

    function startEditPage(pageId) {
      state.ui.editingPageId = pageId;
      state.ui.mode = 'edit';
      state.ui.dirty = false;
      render();
    }

    function renderEditor(main) {
      const deck = currentDeck();
      if (!deck) {
        state.ui.mode = 'library';
        render();
        return;
      }

      const isNew = !state.ui.editingPageId;
      let page = isNew
        ? createEmptyPage()
        : clone(deck.pages.find(p => p.id === state.ui.editingPageId) || createEmptyPage());

      const view = document.createElement('div');
      view.className = 'editor-view';

      const form = document.createElement('div');
      form.className = 'editor-form';
      form.innerHTML = `
        <h2>${isNew ? '➕ New Page' : '✏️ Edit Page'}</h2>
        <div class="form-group">
          <label>Page Name (list / search)</label>

        <div class="form-group">

          <textarea id="fHtml" class="code" rows="8">${escapeHtml(page.html)}</textarea>
        </div>
        <div class="form-group">
          <label>CSS (scoped to content)</label>

        </div>
        <div class="form-group">

          <textarea id="fJs" class="code" rows="3" placeholder="// root.querySelectorAll('span').forEach(...)">${escapeHtml(page.js || '')}</textarea>
        </div>
        <div class="form-group">

            <div class="img-manager-title">🖼️ Image Manager</div>

        </div>`;
      view.appendChild(form);

      const prevWrap = document.createElement('div');

      prevWrap.innerHTML = `<div class="label">Live Preview</div><div class="thumb-box" id="editorThumb"></div>`;
      view.appendChild(prevWrap);
      main.appendChild(view);

      function gather() {
        return {
          id: isNew ? uid('p') : page.id,
          name: ($('#fName').value || '').trim() || 'Page',
          mainTitle: ($('#fMainTitle').value || '').trim() || 'Untitled',
          subtitle: ($('#fSubtitle').value || '').trim(),
          html: $('#fHtml').value || '',
          css: $('#fCss').value || '',
          contentBackground: $('#fBg').value || '#ffffff',
          js: $('#fJs').value || ''
        };
      }

      function refreshThumb() {
        const data = gather();
        const box = $('#editorThumb');
        box.innerHTML = '';
        const el = renderPageElement(data, { pageNum: 1, isThumbnail: true });
        box.appendChild(el);
      }

      // ---- Image Manager ----
      function rebuildImageManager() {
        const slots = $('#imageManagerSlots');
        const html = $('#fHtml').value || '';
        let doc;
        try {
          doc = new DOMParser().parseFromString(html, 'text/html');
        } catch (_) {
          doc = document.implementation.createHTMLDocument('');
        }
        const imgs = doc.querySelectorAll('img');
        if (!imgs.length) {
          slots.innerHTML = `<div class="empty-img-note">No &lt;img&gt; tags found in HTML. Add one to enable image management.</div>`;
          return;
        }

        let htmlOut = '';
        imgs.forEach((img, idx) => {
          const src = img.getAttribute('src') || '';
          const alt = img.getAttribute('alt') || `Image ${idx+1}`;
          const previewSrc = src && !src.startsWith('data:') && !src.startsWith('http') && !src.startsWith('/')
            ? 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23eee"/><text x="50" y="55" text-anchor="middle" font-family="sans-serif" font-size="12" fill="%23999">No preview</text></svg>'
            : src || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23f5f5f5"/><text x="50" y="55" text-anchor="middle" font-family="sans-serif" font-size="18" fill="%23ccc">?</text></svg>';

          htmlOut += `
            <div class="img-slot" data-index="${idx}">
              <img class="thumb" src="${escapeHtml(previewSrc)}" alt="${escapeHtml(alt)}" />
              <div class="info"><strong>${escapeHtml(alt)}</strong> <span style="font-size:10px;color:var(--muted);">${src ? 'has image' : 'empty'}</span></div>
              <div class="img-actions">
                <div class="file-input-wrap">
                  <button class="btn btn-primary btn-xs">Upload</button>
                  <input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/gif" data-index="${idx}" />
                </div>
                <button class="btn btn-outline btn-xs img-clear" data-index="${idx}">✕</button>
              </div>
            </div>`;
        });
        slots.innerHTML = htmlOut;

        // Attach upload events
        slots.querySelectorAll('input[type="file"]').forEach(input => {
          const idx = parseInt(input.dataset.index, 10);
          input.addEventListener('change', function(e) {
            const file = (this.files && this.files[0]);
            if (!file) return;
            if (file.size > 3 * 1024 * 1024) {
              showToast('Image too large (max 3 MB)', 'error');
              this.value = '';
              return;
            }
            const reader = new FileReader();
            reader.onload = function(ev) {
              const dataUrl = ev.target.result;
              // Update the img src in the stored HTML
              let currentHtml = $('#fHtml').value || '';
              let doc2;
              try {
                doc2 = new DOMParser().parseFromString(currentHtml, 'text/html');
              } catch (_) {
                doc2 = document.implementation.createHTMLDocument('');
              }
              const imgs2 = doc2.querySelectorAll('img');
              if (imgs2[idx]) {
                imgs2[idx].setAttribute('src', dataUrl);
                // Also update alt if empty
                if (!imgs2[idx].getAttribute('alt') || imgs2[idx].getAttribute('alt') === '') {
                  imgs2[idx].setAttribute('alt', file.name.replace(/\.[^.]+$/, ''));
                }
                const newHtml = doc2.body.innerHTML;
                $('#fHtml').value = newHtml;
                state.ui.dirty = true;
                refreshThumb();
                rebuildImageManager();
                showToast('Image uploaded', 'success');
              }
            };
            reader.onerror = () => showToast('Failed to read image', 'error');
            reader.readAsDataURL(file);
            this.value = '';
          });
        });

        // Clear events
        slots.querySelectorAll('.img-clear').forEach(btn => {
          const idx = parseInt(btn.dataset.index, 10);
          btn.addEventListener('click', function() {
            let currentHtml = $('#fHtml').value || '';
            let doc2;
            try {
              doc2 = new DOMParser().parseFromString(currentHtml, 'text/html');
            } catch (_) {
              doc2 = document.implementation.createHTMLDocument('');
            }
            const imgs2 = doc2.querySelectorAll('img');
            if (imgs2[idx]) {
              imgs2[idx].setAttribute('src', '');
              const newHtml = doc2.body.innerHTML;
              $('#fHtml').value = newHtml;
              state.ui.dirty = true;
              refreshThumb();
              rebuildImageManager();
              showToast('Image cleared', 'info');
            }
          });
        });
      }

      // ---- Wire events ----
      ['fName', 'fMainTitle', 'fSubtitle', 'fHtml', 'fCss', 'fBg', 'fJs'].forEach(id => {
        const el = $('#' + id);
        el.addEventListener('input', () => {
          state.ui.dirty = true;
          if (id === 'fHtml') {
            rebuildImageManager();
          }
          refreshThumb();
        });
      });

      // Initial build
      refreshThumb();
      rebuildImageManager();

      $('#btnSave').onclick = () => {
        const data = gather();
        if (isNew) {
          deck.pages.push(data);
        } else {
          const idx = deck.pages.findIndex(p => p.id === data.id);
          if (idx >= 0) deck.pages[idx] = data;
        }
        deck.updatedAt = Date.now();
        state.currentPageId = data.id;
        state.ui.dirty = false;
        state.ui.mode = 'deck';
        persist();
        render();
        showToast('Page saved', 'success');
      };
      $('#btnCancel').onclick = () => {
        if (state.ui.dirty && !confirm('Discard unsaved changes?')) return;
        state.ui.dirty = false;
        state.ui.mode = 'deck';
        render();
      };
      $('#btnSavePresent').onclick = () => {
        $('#btnSave').click();
        setTimeout(() => enterPresent(), 50);
      };
    }

            chip.querySelector('.down').onclick = () => {
              if (i === fd.items.length - 1) return;
