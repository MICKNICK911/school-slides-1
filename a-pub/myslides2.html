    // ---------- Flash Presentation ----------
    function enterFlashPresent(flashDeck) {
      if (!flashDeck || !flashDeck.items.length) return;
      showFlashPresentUI(flashDeck);
    }

    function showFlashPresentUI(flashDeck) {
      const overlay = $('#flashOverlay');
      let idx = 0;
      const colorMap = {};

      function getColorIdx(itemId, tokenIdx) {
        return (colorMap[itemId] && colorMap[itemId][tokenIdx] ? colorMap[itemId][tokenIdx] : 0);
      }
      function cycleColor(itemId, tokenIdx) {
        if (!colorMap[itemId]) colorMap[itemId] = {};
        const cur = colorMap[itemId][tokenIdx] || 0;
        colorMap[itemId][tokenIdx] = (cur + 1) % FLASH_COLORS.length;
        paint();
      }
      function resetColors() {
        Object.keys(colorMap).forEach(k => delete colorMap[k]);
        paint();
      }

      function paint() {
        const item = flashDeck.items[idx];
        if (!item) return;
        overlay.innerHTML = '';
        overlay.className = 'flash-overlay active theme-' + flashDeck.type;

        const stage = document.createElement('div');
        stage.className = 'flash-card-stage';

        if (flashDeck.type === 'sentences') {
          const wrap = document.createElement('div');
          wrap.className = 'flash-sentence-display';
          const words = item.text.split(/\s+/).filter(Boolean);
          words.forEach((w, ti) => {
            const span = document.createElement('span');
            span.className = 'flash-word-token';
            span.textContent = w;
            span.style.color = FLASH_COLORS[getColorIdx(item.id, ti)];
            span.onclick = () => cycleColor(item.id, ti);
            wrap.appendChild(span);
          });
          stage.appendChild(wrap);
        } else {
          const wrap = document.createElement('div');
          wrap.className = 'flash-word-display';
          const letters = [...item.text];
          letters.forEach((ch, ti) => {
            const span = document.createElement('span');
            span.className = 'flash-letter';
            span.textContent = ch === ' ' ? '\u00A0' : ch;
            span.style.color = FLASH_COLORS[getColorIdx(item.id, ti)];
            span.onclick = () => { if (ch.trim()) cycleColor(item.id, ti); };
            wrap.appendChild(span);
          });
          stage.appendChild(wrap);
        }
        overlay.appendChild(stage);

        const nav = document.createElement('div');
        nav.className = 'flash-nav';
        const navDisabled = flashDeck.items.length < 2;
        nav.innerHTML = `
          <div class="nav-cluster left" ${navDisabled ? 'style="display:none;"' : ''}>
            <button class="flash-nav-btn" id="flashPrevL" title="Previous">‹</button>
            <button class="flash-nav-btn" id="flashNextL" title="Next">›</button>
          </div>
          <div class="nav-cluster right" ${navDisabled ? 'style="display:none;"' : ''}>
            <button class="flash-nav-btn" id="flashPrevR" title="Previous">‹</button>
            <button class="flash-nav-btn" id="flashNextR" title="Next">›</button>
          </div>`;
        overlay.appendChild(nav);
        const flashGoNext = () => { idx = (idx + 1) % flashDeck.items.length; paint(); };
        const flashGoPrev = () => { idx = (idx - 1 + flashDeck.items.length) % flashDeck.items.length; paint(); };
        $('#flashNextL').onclick = flashGoNext;
        $('#flashNextR').onclick = flashGoNext;
        $('#flashPrevL').onclick = flashGoPrev;
        $('#flashPrevR').onclick = flashGoPrev;

        const top = document.createElement('div');
        top.className = 'flash-topbar';
        top.innerHTML = `
          <span class="label">${escapeHtml(flashDeck.name)}</span>
          <div class="controls">
            <button class="flash-reset-btn" id="flashReset">↺ Reset all colors</button>
            <button class="flash-close" id="flashClose">✕</button>
          </div>`;
        overlay.appendChild(top);
        $('#flashReset').onclick = resetColors;
        $('#flashClose').onclick = exitFlashPresent;

        const ind = document.createElement('div');
        ind.className = 'flash-indicator';
        ind.textContent = `${idx + 1} / ${flashDeck.items.length}`;
        overlay.appendChild(ind);
      }

      paint();

      function onKey(e) {
        if (e.key === 'Escape') { exitFlashPresent(); return; }
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
          e.preventDefault();
          idx = (idx + 1) % flashDeck.items.length;
          paint();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          idx = (idx - 1 + flashDeck.items.length) % flashDeck.items.length;
          paint();
        } else if (e.key === 'r' || e.key === 'R') {
          resetColors();
        }
      }
      window.__flashPresentKeyHandler = onKey;
      window.addEventListener('keydown', onKey);
    }

    function exitFlashPresent() {
      const overlay = $('#flashOverlay');
      overlay.classList.remove('active');
      overlay.innerHTML = '';
      if (window.__flashPresentKeyHandler) {
        window.removeEventListener('keydown', window.__flashPresentKeyHandler);
        window.__flashPresentKeyHandler = null;
      }
    }

    // ---------- Side panels ----------
    function renderSidePanels() {
      $$('.side-panel').forEach(el => el.remove());

      const deck = currentDeck();

      const topics = document.createElement('div');
      topics.className = 'side-panel' + (state.ui.topicsOpen ? ' active' : '');
      topics.innerHTML = `
        <div class="side-panel-header">
          <span>📚 Pages</span>
          <button class="btn btn-outline btn-xs" id="closeTopics">✕</button>
        </div>
        <div class="side-panel-body" id="topicsBody"></div>`;
      document.body.appendChild(topics);
      $('#closeTopics').onclick = () => { state.ui.topicsOpen = false; render(); };

      const tBody = $('#topicsBody');
      if (!deck) {
        tBody.innerHTML = '<p style="color:var(--muted);font-size:13px;">Open a deck first.</p>';
      } else {
        deck.pages.forEach(p => {
          const item = document.createElement('div');
          item.className = 'side-item';
          item.innerHTML = `<strong>${escapeHtml(p.name)}</strong><div style="font-size:12px;color:var(--muted)">${escapeHtml(p.mainTitle)}</div>`;
          item.onclick = () => {
            state.currentPageId = p.id;
            state.ui.mode = 'deck';
            state.ui.topicsOpen = false;
            pushHistory(deck.id, p.id, p.name);
            render();
          };
          tBody.appendChild(item);
        });
      }

      const hist = document.createElement('div');
      hist.className = 'side-panel right' + (state.ui.historyOpen ? ' active' : '');
      hist.innerHTML = `
        <div class="side-panel-header">
          <span>🕒 History</span>
          <button class="btn btn-outline btn-xs" id="closeHist">✕</button>
        </div>
        <div class="side-panel-body" id="histBody"></div>`;
      document.body.appendChild(hist);
      $('#closeHist').onclick = () => { state.ui.historyOpen = false; render(); };

      const hBody = $('#histBody');
      if (!state.history.length) {
        hBody.innerHTML = '<p style="color:var(--muted);font-size:13px;">No history yet.</p>';
      } else {
        state.history.forEach(h => {
          const item = document.createElement('div');
          item.className = 'side-item';
          const d = state.decks[h.deckId];
          item.innerHTML = `<strong>${escapeHtml(h.name)}</strong><div style="font-size:12px;color:var(--muted)">${escapeHtml((d && d.deckName) || 'Deck')} · ${new Date(h.ts).toLocaleString()}</div>`;
          item.onclick = () => {
            if (!state.decks[h.deckId]) {
              showToast('Deck no longer available', 'warning');
              return;
            }
            state.currentDeckId = h.deckId;
            state.currentPageId = h.pageId;
            state.ui.mode = 'deck';
            state.ui.historyOpen = false;
            render();
          };
          hBody.appendChild(item);
        });
      }
    }

    // ---------- Presentation ----------
    function enterPresent() {
      const deck = currentDeck();
      const page = currentPage();
      if (!deck || !page) return;
      state.ui.mode = 'present';
      showPresentUI();
    }

    function showPresentUI() {
      const overlay = $('#presentOverlay');
      const deck = currentDeck();
      if (!deck) return;

      let idx = Math.max(0, deck.pages.findIndex(p => p.id === state.currentPageId));

      function paint() {
        const page = deck.pages[idx];
        if (!page) return;
        state.currentPageId = page.id;
        overlay.innerHTML = '';
        overlay.classList.add('active');

        const stage = document.createElement('div');
        stage.className = 'present-stage';
        const el = renderPageElement(page, { pageNum: idx + 1 });
        const scale = Math.min(
          (window.innerWidth - 24) / PAGE_W,
          (window.innerHeight - 24) / PAGE_H,
          1
        );
        el.style.transform = `scale(${scale})`;
        el.style.transformOrigin = 'center center';
        stage.appendChild(el);
        overlay.appendChild(stage);

        const nav = document.createElement('div');
        nav.className = 'present-nav';
        const navDisabled = deck.pages.length < 2;
        nav.innerHTML = `
          <div class="nav-cluster left" ${navDisabled ? 'style="display:none;"' : ''}>
            <button class="present-nav-btn" id="navPrevL" title="Previous">‹</button>
            <button class="present-nav-btn" id="navNextL" title="Next">›</button>
          </div>
          <div class="nav-cluster right" ${navDisabled ? 'style="display:none;"' : ''}>
            <button class="present-nav-btn" id="navPrevR" title="Previous">‹</button>
            <button class="present-nav-btn" id="navNextR" title="Next">›</button>
          </div>`;
        overlay.appendChild(nav);
        const goNext = () => { idx = (idx + 1) % deck.pages.length; paint(); };
        const goPrev = () => { idx = (idx - 1 + deck.pages.length) % deck.pages.length; paint(); };
        $('#navNextL').onclick = goNext;
        $('#navNextR').onclick = goNext;
        $('#navPrevL').onclick = goPrev;
        $('#navPrevR').onclick = goPrev;

        const top = document.createElement('div');
        top.className = 'present-topbar';
        top.innerHTML = `
          <span style="color:#fff;font-weight:700;font-size:14px;">${escapeHtml(page.name)}</span>
          <button class="present-close" id="presentClose">✕</button>`;
        overlay.appendChild(top);
        $('#presentClose').onclick = exitPresent;

        const ind = document.createElement('div');
        ind.className = 'present-indicator';
        ind.textContent = `${idx + 1} / ${deck.pages.length}`;
        overlay.appendChild(ind);
      }

      paint();

      function onKey(e) {
        if (e.key === 'Escape') { exitPresent(); return; }
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
          e.preventDefault();
          idx = (idx + 1) % deck.pages.length;
          paint();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          idx = (idx - 1 + deck.pages.length) % deck.pages.length;
          paint();
        }
      }
      window.__presentKeyHandler = onKey;
      window.addEventListener('keydown', onKey);
    }

    function exitPresent() {
      $('#presentOverlay').classList.remove('active');
      $('#presentOverlay').innerHTML = '';
      if (window.__presentKeyHandler) {
        window.removeEventListener('keydown', window.__presentKeyHandler);
        window.__presentKeyHandler = null;
      }
      state.ui.mode = 'deck';
      persist();
      render();
    }

    // ---------- Print / Export ----------
    function exportDeck(deck) {
      const payload = {
        version: 1,
        deckName: deck.deckName,
        cover: deck.cover,
        includeToc: deck.includeToc,
        pages: deck.pages,
        flashDecks: deck.flashDecks || []
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (deck.deckName || 'deck').replace(/\s+/g, '_') + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('JSON exported', 'success');
    }

    function getPrintStyles() {
      const styles = (document.querySelector('style') && document.querySelector('style').outerHTML) || '';
      return `${styles}
        <style>
          html, body {
            height: auto !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: visible !important;
            background: #ffffff !important;
            color: #1a1a1a !important;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
          }
          body * {
            visibility: visible !important;
          }
          .page-frame {
            box-shadow: none !important;
            border-radius: 0 !important;
            margin: 0 auto !important;
            page-break-after: always;
            page-break-inside: avoid;
            break-after: page;
            break-inside: avoid;
            width: ${PAGE_W}px !important;
            min-width: ${PAGE_W}px !important;
            height: ${PAGE_H}px !important;
            min-height: ${PAGE_H}px !important;
            max-height: ${PAGE_H}px !important;
            overflow: hidden !important;
            background: #fff !important;
          }
          .page-frame:last-child {
            page-break-after: auto;
            break-after: auto;
          }
          .card, .cover-card, .toc-card {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
          }
          @page {
            size: ${PAGE_W}px ${PAGE_H}px;
            margin: 0;
          }
        </style>`;
    }

    function openPrintWindow(title, htmlContent) {
      // Prefer native printing from the current document so popup blockers
      // cannot prevent printing.
      var root = $('#printRoot');
      if (root) {
        try {
          root.innerHTML = htmlContent;
          root.classList.remove('hidden');
          setTimeout(function () {
            try { window.print(); } catch (_) {}
          }, 60);
          setTimeout(function () {
            root.classList.add('hidden');
            root.innerHTML = '';
          }, 1500);
          return;
        } catch (_) {}
      }

      // Fallback for browsers that need a separate print document.
      var win = window.open('', '_blank');
      if (!win) {
        showToast('Printing is unavailable because the browser blocked the print window.', 'warning');
        return;
      }
      try {
        win.document.open();
        win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' +
          escapeHtml(title || 'Print') + '</title>' + getPrintStyles() +
          '</head><body>' + htmlContent + '</body></html>');
        win.document.close();
        setTimeout(function () {
          try { win.focus(); win.print(); } catch (_) {}
        }, 350);
      } catch (_) {
        showToast('Print failed', 'error');
      }
    }

    function printPages(pages, deck, startNum = 1) {
      const root = $('#printRoot');
      root.innerHTML = '';
      root.classList.remove('hidden');
      pages.forEach((p, i) => {
        root.appendChild(renderPageElement(p, { pageNum: startNum + i }));
      });

      const htmlContent = root.innerHTML;
      root.classList.add('hidden');
      root.innerHTML = '';

      openPrintWindow('Print Page', htmlContent);
    }

    function printAll(deck) {
      let html = '';
      const coverEl = renderCoverElement(deck.cover);
      html += coverEl.outerHTML;

      if (deck.includeToc && deck.pages.length) {
        const tocFrame = document.createElement('div');
        tocFrame.className = 'page-frame';
        const entries = deck.pages.map((p, i) =>
          `<li class="toc-item"><span>${escapeHtml(p.name)}</span><span class="toc-page-num">Page ${i + 1}</span></li>`
        ).join('');
        tocFrame.innerHTML = `<div class="toc-card"><div class="toc-title">Table of Contents</div><ul class="toc-list">${entries}</ul></div>`;
        html += tocFrame.outerHTML;
      }

      deck.pages.forEach((p, i) => {
        const el = renderPageElement(p, { pageNum: i + 1 });
        html += el.outerHTML;
      });

      openPrintWindow((deck.deckName || 'Deck') + ' — Print', html);
    }

    // ---------- File import ----------
    $('#fileInput').addEventListener('change', (e) => {
      const file = (e.target.files && e.target.files[0]);
      e.target.value = '';
      if (!file) return;
      if (file.size > 25 * 1024 * 1024) {
        showToast('File too large (max 15 MB)', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const raw = JSON.parse(reader.result);
          const deck = normalizeImported(raw);
          state.decks[deck.id] = deck;
          state.currentDeckId = deck.id;
          state.currentPageId = (deck.pages && deck.pages[0] ? deck.pages[0].id : null);
          state.ui.mode = 'deck';
          state.searchQuery = '';
          persist();
          render();
          showToast(`Loaded "${deck.deckName}" (${deck.pages.length} pages)`, 'success');
        } catch (err) {
          console.error(err);
          showToast('Invalid JSON: ' + (err.message || 'parse error'), 'error');
        }
      };
      reader.onerror = () => showToast('Could not read file', 'error');
      reader.readAsText(file);
    });

    // ========== INIT ==========
    async function init() {
      // Paint the shell first. Storage problems must never leave a blank app.
      render();

      try {
        await loadPersisted();
      } catch (_) {}

      if (!state.decks || Object.keys(state.decks).length === 0) {
        var defaults = clone(DEFAULT_DECKS);
        defaults.forEach(function (deck) {
          state.decks[deck.id] = deck;
        });
        state.currentDeckId = defaults[0].id;
        state.currentPageId = defaults[0].pages[0].id;
        state.ui.mode = 'deck';
        persist();
      } else if (state.currentDeckId && state.decks[state.currentDeckId]) {
        state.ui.mode = 'deck';
        if (!state.currentPageId && state.decks[state.currentDeckId].pages.length) {
          state.currentPageId = state.decks[state.currentDeckId].pages[0].id;
        }
      } else {
        state.ui.mode = 'library';
      }

      render();
    }

    window.addEventListener('error', function (e) {
      try { console.error(e.error || e.message); } catch (_) {}
    });
    window.addEventListener('unhandledrejection', function (e) {
      try { console.error(e.reason || e); } catch (_) {}
    });

    init().catch(err => {
      console.error(err);
      showToast('Failed to start app', 'error');
      render();
    });
  })();
  </script>
</body>
</html>
