          pageEl.style.position = 'absolute';
          pageEl.style.top = '0';
          pageEl.style.left = '0';
          pageEl.style.width = '850px';
          pageEl.style.minWidth = '850px';
          pageEl.style.minHeight = '1100px';
          pageEl.style.height = '1100px';
          pageEl.style.padding = '30px 35px';
          pageEl.style.margin = '0';
          pageEl.style.borderRadius = '0';
          pageEl.style.boxShadow = 'none';
          pageEl.style.pageBreakAfter = 'auto';
          wrapper.appendChild(pageEl);
          wrapper.appendChild(label);
          container.appendChild(wrapper);
        });
      }

      function renderQuestionList() {
        const container = document.getElementById('compQuestionsContainer');
        if (!container) return;
        if (!tempPage2 || !tempPage2.comprehension) return;
        const questions = tempPage2.comprehension.questions;
        let html = '';
        questions.forEach((q, idx) => {
          html += `<div class="question-card" data-index="${idx}">
            <div class="q-header">
              <span class="q-title">Question ${idx+1}</span>
              <div class="q-controls">
                <button class="btn btn-outline btn-xs" onclick="moveQuestion(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} title="Move up">▲</button>
                <button class="btn btn-outline btn-xs" onclick="moveQuestion(${idx}, 1)" ${idx === questions.length-1 ? 'disabled' : ''} title="Move down">▼</button>
                <button class="btn btn-danger btn-xs" onclick="deleteQuestion(${idx})" title="Delete">🗑️</button>
              </div>
            </div>
            <div class="form-group">
              <label>Type</label>
              <select onchange="changeQuestionType(${idx}, this.value)">
                <option value="objective" ${q.type === 'objective' ? 'selected' : ''}>Objective (Multiple Choice)</option>
                <option value="theory" ${q.type === 'theory' ? 'selected' : ''}>Theory (Open Ended)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Question Text</label>
              <input type="text" value="${escapeHtml(q.question)}" onchange="updateQuestionText(${idx}, this.value)">
            </div>`;
          if (q.type === 'objective') {
            html += `<div class="form-group">
              <label>Options (2-5)</label>`;
            q.options.forEach((opt, optIdx) => {
              html += `<div class="option-row">
                <input type="text" value="${escapeHtml(opt)}" placeholder="Option ${optIdx+1}" onchange="updateOption(${idx}, ${optIdx}, this.value)">
                <button class="btn btn-danger btn-xs" onclick="deleteOption(${idx}, ${optIdx})" ${q.options.length <= 2 ? 'disabled' : ''}>✕</button>
              </div>`;
            });
            html += `<button class="btn btn-outline btn-xs add-option-btn" onclick="addOption(${idx})" ${q.options.length >= MAX_OPTIONS ? 'disabled' : ''}>+ Add Option</button>
            </div>`;
          }
          html += `</div>`;
        });
        if (questions.length === 0) {
          html = '<p style="color:#94a3b8; text-align:center; padding:12px;">No questions yet. Click "Add Question" to create.</p>';
        }
        container.innerHTML = html;
      }

      // Question CRUD
      window.addQuestion = function() {
        if (!tempPage2) return;
        tempPage2.comprehension.questions.push({ id: generateQuestionId(), type: 'objective', question: '', options: ['', '', ''] });
        renderQuestionList();
        renderThumbnail();
      };
      window.deleteQuestion = function(idx) {
        if (!tempPage2) return;
        tempPage2.comprehension.questions.splice(idx, 1);
        renderQuestionList();
        renderThumbnail();
      };
      window.moveQuestion = function(idx, dir) {
        if (!tempPage2) return;
        const arr = tempPage2.comprehension.questions;
        const newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= arr.length) return;
        const temp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = temp;
        renderQuestionList();
        renderThumbnail();
      };
      window.changeQuestionType = function(idx, type) {
        if (!tempPage2) return;
        const q = tempPage2.comprehension.questions[idx];
        if (!q) return;
        q.type = type;
        if (type === 'objective' && !q.options) q.options = ['', '', ''];
        else if (type === 'theory') delete q.options;
        renderQuestionList();
        renderThumbnail();
      };
      window.updateQuestionText = function(idx, value) {
        if (!tempPage2) return;
        const q = tempPage2.comprehension.questions[idx];
        if (q) q.question = value.trim();
        renderThumbnail();
      };
      window.updateOption = function(qIdx, optIdx, value) {
        if (!tempPage2) return;
        const q = tempPage2.comprehension.questions[qIdx];
        if (q && q.options) q.options[optIdx] = value.trim();
        renderThumbnail();
      };
      window.addOption = function(qIdx) {
        if (!tempPage2) return;
        const q = tempPage2.comprehension.questions[qIdx];
        if (q && q.options && q.options.length < MAX_OPTIONS) {
          q.options.push('');
          renderQuestionList();
          renderThumbnail();
        }
      };
      window.deleteOption = function(qIdx, optIdx) {
        if (!tempPage2) return;
        const q = tempPage2.comprehension.questions[qIdx];
        if (q && q.options && q.options.length > 2) {
          q.options.splice(optIdx, 1);
          renderQuestionList();
          renderThumbnail();
        }
      };

      // Section toggles
      window.toggleSection = function(section, checked) {
        if (!tempPage2) return;
        if (section === 'comp') tempPage2.comprehension.enabled = checked;
        else if (section === 'findSound') tempPage2.findSound.enabled = checked;
        else if (section === 'sentence') tempPage2.sentenceWriting.enabled = checked;
        renderQuestionList();
        renderThumbnail();
      };
      window.updateFindSoundInstruction = function(value) {
        if (tempPage2) tempPage2.findSound.instruction = value;
        renderThumbnail();
      };
      window.updateSentenceInstruction = function(value) {
        if (tempPage2) tempPage2.sentenceWriting.instruction = value;
        renderThumbnail();
      };
      window.updateSentenceLines = function(value) {
        if (tempPage2) tempPage2.sentenceWriting.numberOfLines = parseInt(value) || 1;
        renderThumbnail();
      };
      window.toggleImagePage = function(checked) {
        tempShowImagePage = checked;
        renderThumbnail();
      };
      window.toggleReadingImage = function(checked) {
        tempShowReadingImageBox = checked;
        renderThumbnail();
      };
      window.updateImagePageWidth = function(value) {
        tempImagePageWidth = parseInt(value) || DEFAULT_IMAGE_PAGE_WIDTH;
        renderThumbnail();
      };
      window.updateImagePageHeight = function(value) {
        tempImagePageHeight = parseInt(value) || DEFAULT_IMAGE_PAGE_HEIGHT;
        renderThumbnail();
      };
      window.toggleSprite = function(checked) {
        tempUseSprite = checked;
        toggleSpriteFields();
        renderThumbnail();
      };
      window.updateSpriteSheet = function(value) {
        tempSpriteSheetId = value;
        renderThumbnail();
      };
      window.updateSpriteCropX = function(value) {
        tempSpriteCrop.x = parseInt(value) || 0;
        renderThumbnail();
      };
      window.updateSpriteCropY = function(value) {
        tempSpriteCrop.y = parseInt(value) || 0;
        renderThumbnail();
      };
      window.updateSpriteCropWidth = function(value) {
        tempSpriteCrop.width = parseInt(value) || 0;
        renderThumbnail();
      };
      window.updateSpriteCropHeight = function(value) {
        tempSpriteCrop.height = parseInt(value) || 0;
        renderThumbnail();
      };

      function toggleSpriteFields() {
        const spriteSection = document.getElementById('spriteFields');
        if (spriteSection) spriteSection.style.display = tempUseSprite ? 'block' : 'none';
      }

      // ---------- Save / Edit / Delete / Import / Export ----------
      window.handleImageUpload = function(event) {
        const file = event.target.files[0];
        if (!file) return;
        if (file.size > MAX_IMAGE_SIZE) { showToast('Image must be less than 2 MB.', 'error'); event.target.value = ''; return; }
        if (!file.type.startsWith('image/')) { showToast('Please select a valid image file.', 'error'); event.target.value = ''; return; }
        const reader = new FileReader();
        reader.onload = e => {
          const dataUrl = e.target.result;
          document.getElementById('fImageUrl').value = dataUrl;
          tempOriginalImageUrl = dataUrl;
          updateImagePreview(dataUrl);
          renderThumbnail();
          showToast('Image uploaded and embedded!', 'success');
        };
        reader.readAsDataURL(file);
      };

      window.editLesson = function(id) {
        const lesson = lessons.find(l => l.id === id);
        if (!lesson) return showToast('Lesson not found.', 'error');
        editingId = id;
        document.getElementById('formTitle').innerHTML = '<span class="dot" style="background:#2563eb;"></span> Edit Reader';
        fillForm(lesson);
        document.getElementById('saveBtn').textContent = '💾 Update Lesson';
        document.getElementById('cancelBtn').style.display = 'inline-flex';
        document.getElementById('viewLessonBtn').style.display = 'inline-flex';
        document.querySelector('.form-section').scrollIntoView({behavior:'smooth'});
        switchTab('edit');
      };
      window.cancelEdit = function() { resetForm(); showToast('Edit cancelled.', 'info'); };
      window.saveLesson = async function() {
        const data = getFormData();
        if (!data.title || !data.targetSound || data.storyLines.length < 5) {
          return showToast('Please fill all required fields (title, target sound, at least 5 story lines).', 'error');
        }
        if (data.page2.comprehension.enabled) {
          if (data.page2.comprehension.questions.length === 0) {
            return showToast('Please add at least one comprehension question or disable the section.', 'error');
          }
          for (const q of data.page2.comprehension.questions) {
            if (q.type === 'objective') {
              const validOptions = q.options.filter(o => o.trim() !== '');
              if (validOptions.length < 2) {
                return showToast('Each objective question must have at least 2 non-empty options.', 'error');
              }
            }
          }
        }

        // Validate sprite mode
        if (data.useSprite) {
          if (!data.spriteSheetId) {
            return showToast('Please select a sprite sheet when sprite mode is enabled.', 'error');
          }
          if (data.spriteCrop.width <= 0 || data.spriteCrop.height <= 0) {
            return showToast('Crop width and height must be greater than zero.', 'error');
          }
        }

        try {
          if (data.useSprite) {
            const sprite = bookMeta.spriteSheets.find(s => s.id === data.spriteSheetId);
            if (!sprite) {
              return showToast('Selected sprite sheet not found.', 'error');
            }
            const croppedUrl = await new Promise((resolve, reject) => {
              cropSpriteSheet(sprite.dataUrl, data.spriteCrop, (cropped) => {
                if (cropped) resolve(cropped);
                else reject('Failed to crop sprite sheet. Check crop coordinates and image bounds.');
              });
            });
            data.imageUrl = croppedUrl;
          } else {
            data.imageUrl = document.getElementById('fImageUrl').value.trim();
          }
        } catch (err) {
          showToast(err, 'error');
          return;
        }

        data.originalImageUrl = tempOriginalImageUrl;

        if (editingId) {
          const idx = lessons.findIndex(l => l.id === editingId);
          if (idx === -1) return showToast('Not found.', 'error');
          data.lessonNumber = idx + 1;
          lessons[idx] = { ...lessons[idx], ...data, id: editingId };
        } else {
          data.lessonNumber = lessons.length + 1;
          lessons.push({ ...data, id: generateId() });
        }
        previewLessonOverride = null;
        saveData(); resetForm(); refreshUI(); showToast('Lesson saved!', 'success');
        switchTab('edit');
      };
      window.deleteLesson = function(id) {
        const l = lessons.find(l => l.id === id);
        if (!l) return;
        confirmDialog(`Delete "<strong>${escapeHtml(l.title)}</strong>"?`, () => {
          lessons = lessons.filter(l => l.id !== id);
          if (editingId === id) resetForm();
          renumberByOrder(lessons);
          previewLessonOverride = null;
          saveData(); refreshUI();
        });
      };
      window.duplicateLesson = function(id) {
        const l = lessons.find(l => l.id === id);
        if (!l) return;
        const copy = JSON.parse(JSON.stringify(l));
        delete copy.id; copy.id = generateId();
        lessons.push(copy);
        renumberByOrder(lessons);
        previewLessonOverride = null;
        saveData(); refreshUI(); showToast('Duplicated.', 'success');
      };
      window.exportJSON = function() {
        const payload = { lessons, bookMeta };
        const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'readers.json'; a.click();
      };
      window.importJSON = function(input) {
        const file = input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
          try {
            const data = JSON.parse(e.target.result);
            if (!data || typeof data !== 'object') throw new Error('Invalid');
            const importedLessons = Array.isArray(data.lessons) ? data.lessons : [];
            const validated = importedLessons.map(l => migrateLesson({
              id: String(l.id || ''),
              lessonNumber: typeof l.lessonNumber === 'number' ? l.lessonNumber : 0,
              imageUrl: String(l.imageUrl || ''),
              title: String(l.title || 'Untitled'),
              targetSound: String(l.targetSound || ''),
              imageLabel: String(l.imageLabel ?? DEFAULT_IMAGE_LABEL),
              imagePageLabel: String(l.imagePageLabel ?? DEFAULT_IMAGE_PAGE_LABEL),
              showReadingImageBox: typeof l.showReadingImageBox === 'boolean' ? l.showReadingImageBox : false,
              imagePageWidth: typeof l.imagePageWidth === 'number' ? l.imagePageWidth : DEFAULT_IMAGE_PAGE_WIDTH,
              imagePageHeight: typeof l.imagePageHeight === 'number' ? l.imagePageHeight : DEFAULT_IMAGE_PAGE_HEIGHT,
              useSprite: typeof l.useSprite === 'boolean' ? l.useSprite : false,
              spriteSheetId: String(l.spriteSheetId || ''),
              spriteCrop: l.spriteCrop || { x: 0, y: 0, width: 0, height: 0 },
              originalImageUrl: String(l.originalImageUrl || ''),
              storyLines: (Array.isArray(l.storyLines) ? l.storyLines : []).map(sl => ({ sentence: String(sl.sentence || '') })).filter(sl => sl.sentence.trim() !== ''),
              comprehension: Array.isArray(l.comprehension) ? l.comprehension : [],
              showImagePage: typeof l.showImagePage === 'boolean' ? l.showImagePage : false,
              page2: l.page2
            })).filter(l => l.id);
            if (validated.length === 0) throw new Error('No valid lessons');
            confirmDialog('Replace all lessons with imported data?', () => {
              lessons = validated;
              bookMeta = data.bookMeta || { title: 'Decodable Readers', subtitle: 'Grade 1', grade: '1', showToc: true, readingImageDefaultOffApplied: true, sightWords: { enabled: false, title: DEFAULT_SIGHT_WORDS_TITLE, columns: DEFAULT_SIGHT_COLUMNS, rawText: '' }, spriteSheets: [] };
              if (!bookMeta.sightWords) bookMeta.sightWords = { enabled: false, title: DEFAULT_SIGHT_WORDS_TITLE, columns: DEFAULT_SIGHT_COLUMNS, rawText: '' };
              if (!Array.isArray(bookMeta.spriteSheets)) bookMeta.spriteSheets = [];
              bookMeta.grade = String(bookMeta.grade || '1');
              bookMeta.showToc = (typeof bookMeta.showToc === 'boolean') ? bookMeta.showToc : true;
              renumberByOrder(lessons);
              nextId = Math.max(...lessons.map(l => parseInt(l.id.replace('r','')) || 0), 0) + 1;
              previewLessonOverride = null;
              saveData(); resetForm(); refreshUI(); showToast('Imported successfully.', 'success');
              switchTab('book');
            });
          } catch(err) { showToast('Invalid JSON file.', 'error'); }
        };
        reader.readAsText(file);
        input.value = '';
      };

      // ---------- Sprite Sheet Management (Book Setup) ----------
      window.addSpriteSheet = function(fileInput) {
        const file = fileInput.files[0];
        if (!file) return;
        if (file.size > MAX_IMAGE_SIZE) { showToast('Sprite sheet must be less than 2 MB.', 'error'); fileInput.value = ''; return; }
        if (!file.type.startsWith('image/')) { showToast('Please select a valid image file.', 'error'); fileInput.value = ''; return; }
        const reader = new FileReader();
        reader.onload = e => {
          const dataUrl = e.target.result;
          const name = prompt('Enter a name for this sprite sheet:', 'Sprite Sheet ' + (bookMeta.spriteSheets.length + 1));
          fileInput.value = ''; // clear input regardless
          if (!name) return;
          const newSheet = { id: generateSpriteSheetId(), name: name.trim() || 'Unnamed', dataUrl };
          bookMeta.spriteSheets.push(newSheet);
          saveData();
          renderSpriteSheetsList();
          showToast('Sprite sheet added!', 'success');
        };
        reader.readAsDataURL(file);
      };

      window.deleteSpriteSheet = function(id) {
        const sheet = bookMeta.spriteSheets.find(s => s.id === id);
        if (!sheet) return;
        confirmDialog(`Delete sprite sheet "<strong>${escapeHtml(sheet.name)}</strong>"? Lessons using it may lose their cropped image.`, () => {
          bookMeta.spriteSheets = bookMeta.spriteSheets.filter(s => s.id !== id);
          lessons.forEach(l => {
            if (l.spriteSheetId === id) {
              l.useSprite = false;
              l.spriteSheetId = '';
              l.spriteCrop = { x: 0, y: 0, width: 0, height: 0 };
            }
          });
          saveData();
          renderSpriteSheetsList();
          renderEditList();
          showToast('Sprite sheet deleted.', 'info');
        });
      };

      function renderSpriteSheetsList() {
        const container = document.getElementById('spriteSheetsList');
        if (!container) return;
        if (!bookMeta.spriteSheets.length) {
          container.innerHTML = '<p style="color:#94a3b8;">No sprite sheets uploaded yet.</p>';
        } else {
          container.innerHTML = bookMeta.spriteSheets.map(s => `
            <div class="sprite-sheet-item" style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
              <img src="${escapeHtml(s.dataUrl)}" alt="${escapeHtml(s.name)}" style="max-width:80px;max-height:60px;object-fit:cover;border-radius:4px;border:1px solid #e2e8f0;">
              <span style="flex:1;font-weight:600;">${escapeHtml(s.name)}</span>
              <button class="btn btn-danger btn-xs" onclick="deleteSpriteSheet('${s.id}')">🗑️</button>
            </div>
          `).join('');
        }
      }

      function populateSpriteSheetSelect() {
        const select = document.getElementById('spriteSheetSelect');
        if (!select) return;
        select.innerHTML = '<option value="">-- Select a sprite sheet --</option>' + 
          bookMeta.spriteSheets.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
        if (tempSpriteSheetId) select.value = tempSpriteSheetId;
      }

      // ---------- View / Edit Switching ----------
      window.editLessonFromView = function(id) {
        if (editingId === id) {
          switchTab('edit');
          return;
        }
        editLesson(id);
      };

      window.viewLessonFromEdit = function() {
        if (!editingId) return;
        const data = getFormData();
        previewLessonOverride = { ...data, id: editingId };
        switchTab('view');
        setTimeout(() => {
          const targetSpread = document.querySelector(`.lesson-spread[data-lesson-id="${editingId}"]`);
          if (targetSpread) {
            targetSpread.scrollIntoView({ behavior: 'smooth', block: 'start' });
            targetSpread.style.outline = '3px solid #f59e0b';
            setTimeout(() => { targetSpread.style.outline = 'none'; }, 2000);
          }
        }, 150);
        showToast('Showing unsaved changes. Remember to save!', 'warning');
      };

      // ---------- Book Meta Save ----------
      window.saveBookMeta = function() {
        bookMeta.title = document.getElementById('coverTitleInput').value.trim() || 'Decodable Readers';
        bookMeta.subtitle = document.getElementById('coverSubtitleInput').value.trim() || 'Grade 1';
        bookMeta.grade = document.getElementById('globalGradeInput').value.trim() || '1';
        bookMeta.showToc = document.getElementById('tocToggle').checked;
        const sightEnabled = document.getElementById('sightWordsToggle').checked;
        bookMeta.sightWords.enabled = sightEnabled;
        bookMeta.sightWords.title = document.getElementById('sightWordsTitle').value.trim() || DEFAULT_SIGHT_WORDS_TITLE;
        bookMeta.sightWords.columns = parseInt(document.getElementById('sightColumns').value) || DEFAULT_SIGHT_COLUMNS;
        bookMeta.sightWords.columns = Math.min(Math.max(bookMeta.sightWords.columns, MIN_SIGHT_COLUMNS), MAX_SIGHT_COLUMNS);
        bookMeta.sightWords.rawText = document.getElementById('sightWordsText').value;

        previewLessonOverride = null;
        saveData();
        renderAllView();
        renderEditList();
        renderTocPreview();
        renderSpriteSheetsList();
        updateCounts();
        showToast('Cover, TOC & Sight Words settings saved.', 'success');
      };

      // ---------- Render list and counts ----------
      function renderEditList() {
        const container = document.getElementById('lessonList');
        if (!container) return;
        const q = (window.searchQuery||'').toLowerCase();
        const filtered = lessons.filter(l => !q || l.title.toLowerCase().includes(q) || l.targetSound.toLowerCase().includes(q) || l.storyLines.some(sl => sl.sentence.toLowerCase().includes(q)) || (l.page2?.comprehension?.questions || []).some(c => c.question.toLowerCase().includes(q) || (c.options || []).some(o => o.toLowerCase().includes(q))));
        container.innerHTML = filtered.length ? filtered.map(l => `
          <div class="lesson-item" draggable="true" data-id="${l.id}">
            <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
            <div class="info">
              <div class="title">Lesson ${l.lessonNumber} — ${escapeHtml(l.title)}</div>
              <div class="sub">🎯 ${escapeHtml(l.targetSound)} · 📝 ${l.storyLines.length} lines · 🏫 ${escapeHtml(bookMeta.grade)} · 🖼️ ${escapeHtml(l.imageLabel || DEFAULT_IMAGE_LABEL)} · 📚 ${l.page2?.comprehension?.questions?.length || 0} questions ${l.showImagePage ? '· 🖼️ Image Page' : ''} ${l.showReadingImageBox ? '· 📷 Reading Image' : ''} ${l.useSprite ? '· 🧩 Sprite' : ''}</div>
            </div>
            <div class="actions">
              <button class="btn btn-primary btn-xs" onclick="editLesson('${l.id}')" title="Edit">✏️</button>
              <button class="btn btn-warning btn-xs" onclick="duplicateLesson('${l.id}')" title="Duplicate">📋</button>
              <button class="btn btn-danger btn-xs" onclick="deleteLesson('${l.id}')" title="Delete">🗑️</button>
            </div>
          </div>`).join('') : '<div class="empty-state"><div class="icon">📭</div><h3>No lessons found</h3></div>';
        document.getElementById('listCount').textContent = filtered.length + ' / ' + lessons.length;
        updateCounts();
      }

      function updateCounts() {
        document.getElementById('lessonCount').textContent = lessons.length + ' lessons';
        const activeLessons = lessons.filter(l => l.title.trim());
        const sightPages = bookMeta.sightWords.enabled ? parseSightWords(bookMeta.sightWords.rawText).length : 0;
        const tocPages = (bookMeta.showToc && activeLessons.length) ? Math.ceil(activeLessons.length / MAX_TOC_PER_PAGE) : 0;
        let lessonPages = 0;
        activeLessons.forEach(l => { lessonPages += l.showImagePage ? 3 : 2; });
        const totalPages = 1 + sightPages + tocPages + lessonPages;
        document.getElementById('viewInfo').textContent = `📄 ${lessons.length} lessons · ${totalPages} pages (${escapeHtml(bookMeta.grade)}) · Sight Words: ${sightPages} pages`;
      }

      function refreshUI() { renderEditList(); renderAllView(); updateCounts(); renderSpriteSheetsList(); }

      // ---------- TOC Preview ----------
      function renderTocPreview() {
        const container = document.getElementById('tocPreview');
        if (!container) return;
        if (!bookMeta.showToc) {
          container.innerHTML = '<p style="color:#64748b; font-style:italic;">Table of Contents is disabled.</p>';
          return;
        }
        const activeLessons = lessons.filter(l => l.title.trim());
        if (!activeLessons.length) {
          container.innerHTML = '<p style="color:#64748b;">No active lessons.</p>';
          return;
        }
        const sightPages = bookMeta.sightWords.enabled ? parseSightWords(bookMeta.sightWords.rawText).length : 0;
        const tocPageCount = Math.ceil(activeLessons.length / MAX_TOC_PER_PAGE);
        const firstLessonPage = 1 + sightPages + tocPageCount + 1;
        let runningPage = firstLessonPage;
        let html = '<ul style="list-style:none;padding:0;margin:0;">';
        activeLessons.forEach(l => {
          html += `<li style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0;"><span>Lesson ${l.lessonNumber}: ${escapeHtml(l.title)}</span><span style="color:#b91c1c;font-weight:700;">Page ${runningPage}</span></li>`;
          runningPage += l.showImagePage ? 3 : 2;
        });
        html += '</ul>';
        container.innerHTML = html;
      }

      window.switchTab = function(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === tab+'Panel'));
        if (tab === 'edit') { renderEditList(); renderThumbnail(); populateSpriteSheetSelect(); }
        if (tab === 'view') renderAllView();
        if (tab === 'book') {
          document.getElementById('coverTitleInput').value = bookMeta.title;
          document.getElementById('coverSubtitleInput').value = bookMeta.subtitle;
          document.getElementById('globalGradeInput').value = bookMeta.grade;
          document.getElementById('tocToggle').checked = bookMeta.showToc;
          document.getElementById('sightWordsToggle').checked = bookMeta.sightWords.enabled;
          document.getElementById('sightWordsTitle').value = bookMeta.sightWords.title;
          document.getElementById('sightColumns').value = bookMeta.sightWords.columns;
          document.getElementById('sightWordsText').value = bookMeta.sightWords.rawText;
          toggleSightWordsFields();
          renderSpriteSheetsList();
          renderEditList();
          renderTocPreview();
        }
        if (tab !== 'view') previewLessonOverride = null;
        updateCounts();
      };

      window.toggleSightWordsFields = function() {
        const enabled = document.getElementById('sightWordsToggle').checked;
        document.getElementById('sightWordsFields').style.display = enabled ? 'block' : 'none';
      };

      // ---------- Initialization ----------
      async function initApp() {
        await loadData();

        document.getElementById('app').innerHTML = `
          <div class="app-header"><h1><span class="icon">📖</span> Decodable Reader Publisher</h1><span class="badge" id="lessonCount">0</span></div>
          <div class="tabs">
            <button class="tab-btn active" data-tab="edit" onclick="switchTab('edit')">✏️ Edit Readers</button>
            <button class="tab-btn" data-tab="book" onclick="switchTab('book')">📘 Book Setup</button>
            <button class="tab-btn" data-tab="view" onclick="switchTab('view')">👁️ Preview &amp; Export</button>
          </div>
          <div class="tab-panel active" id="editPanel">
            <div class="form-section">
              <h2 id="formTitle"><span class="dot"></span> Add New Reader</h2>
              <div class="thumbnail-wrapper">
                <div class="thumb-label">📄 Live Preview (All Pages)</div>
                <div class="thumbnail-container" id="thumbnailContainer"></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Title <span class="req">*</span></label><input id="fTitle" placeholder="e.g. Ben's Camping Trip" oninput="renderThumbnail()"></div>
                <div class="form-group"><label>Lesson Number (auto)</label><input id="fLessonNumber" type="number" readonly style="background:#f0f0f0;"></div>
                <div class="form-group"><label>Image</label>
                  <div class="image-upload-wrap">
                    <img id="imagePreview" class="preview" style="display:none;">
                    <div id="imagePreviewPlaceholder" class="preview-placeholder">🖼️</div>
                    <input type="file" id="imageUploadFile" accept="image/*" onchange="handleImageUpload(event)">
                    <input type="hidden" id="fImageUrl">
                  </div>
                </div>
              </div>
              <div class="form-group"><label>Image Label (overlay on image)</label><input id="fImageLabel" placeholder="e.g. Let's read together!" value="${escapeHtml(DEFAULT_IMAGE_LABEL)}" oninput="renderThumbnail()"></div>
              <div class="form-group"><label>Full-Page Image Label (overlay on image page)</label><input id="fImagePageLabel" placeholder="e.g. Picture Page" value="${escapeHtml(DEFAULT_IMAGE_PAGE_LABEL)}" oninput="renderThumbnail()"></div>
              <div class="form-group" style="display:flex;align-items:center;gap:10px;margin-top:16px;">
                <input type="checkbox" id="readingImageToggle" onchange="toggleReadingImage(this.checked)" style="width:18px;height:18px;accent-color:#f59e0b;">
                <label for="readingImageToggle" style="margin:0;font-weight:600;">Include image box on reading page</label>
              </div>
              <div class="form-group"><label>Target Sound <span class="req">*</span></label><input id="fTargetSound" placeholder="short e (/ɛ/)" oninput="renderThumbnail()"></div>
              <div class="form-group"><label>Story Text <span class="req">*</span></label><textarea id="fStory" rows="8" placeholder="One sentence per line..." oninput="renderThumbnail()"></textarea></div>
              <div class="form-group" style="display:flex;align-items:center;gap:10px;margin-top:16px;">
                <input type="checkbox" id="imagePageToggle" onchange="toggleImagePage(this.checked)" style="width:18px;height:18px;accent-color:#f59e0b;">
                <label for="imagePageToggle" style="margin:0;font-weight:600;">Include full-page image placeholder before reading page</label>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Image Page Width (px)</label>
                  <input type="number" id="imagePageWidthInput" min="50" max="800" value="${DEFAULT_IMAGE_PAGE_WIDTH}" onchange="updateImagePageWidth(this.value)">
                </div>
                <div class="form-group">
                  <label>Image Page Height (px)</label>
                  <input type="number" id="imagePageHeightInput" min="50" max="1000" value="${DEFAULT_IMAGE_PAGE_HEIGHT}" onchange="updateImagePageHeight(this.value)">
                </div>
              </div>
              <div class="form-group" style="display:flex;align-items:center;gap:10px;margin-top:16px;">
                <input type="checkbox" id="spriteToggle" onchange="toggleSprite(this.checked)" style="width:18px;height:18px;accent-color:#f59e0b;">
                <label for="spriteToggle" style="margin:0;font-weight:600;">Use sprite sheet for image</label>
              </div>
              <div id="spriteFields" style="display:none;margin-top:8px;">
                <div class="form-group">
                  <label>Sprite Sheet</label>
                  <select id="spriteSheetSelect" onchange="updateSpriteSheet(this.value)"></select>
                </div>
                <div class="form-row">
                  <div class="form-group"><label>Crop X</label><input type="number" id="spriteCropX" min="0" value="0" onchange="updateSpriteCropX(this.value)"></div>
                  <div class="form-group"><label>Crop Y</label><input type="number" id="spriteCropY" min="0" value="0" onchange="updateSpriteCropY(this.value)"></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label>Crop Width</label><input type="number" id="spriteCropWidth" min="1" value="0" onchange="updateSpriteCropWidth(this.value)"></div>
                  <div class="form-group"><label>Crop Height</label><input type="number" id="spriteCropHeight" min="1" value="0" onchange="updateSpriteCropHeight(this.value)"></div>
                </div>
              </div>
              <hr style="margin:16px 0;border-color:#e2e8f0;">
              <h4 style="margin-bottom:12px;">📋 Page 2 Activities</h4>
              <div class="form-group" style="display:flex;align-items:center;gap:10px;">
                <input type="checkbox" id="compToggle" onchange="toggleSection('comp', this.checked)" style="width:18px;height:18px;accent-color:#f59e0b;">
                <label for="compToggle" style="margin:0;font-weight:600;">Comprehension Section</label>
              </div>
              <div id="compQuestionsContainer" style="margin-bottom:16px;"></div>
              <button class="btn btn-outline btn-sm" onclick="addQuestion()">+ Add Question</button>
              <hr style="margin:16px 0;border-color:#e2e8f0;">
              <div class="form-group" style="display:flex;align-items:center;gap:10px;">
                <input type="checkbox" id="findSoundToggle" onchange="toggleSection('findSound', this.checked)" style="width:18px;height:18px;accent-color:#f59e0b;">
                <label for="findSoundToggle" style="margin:0;font-weight:600;">Find Sound Section</label>
              </div>
              <div class="form-group">
                <label>Find Sound Instruction</label>
                <textarea id="findSoundInstruction" rows="2" onchange="updateFindSoundInstruction(this.value)"></textarea>
              </div>
              <hr style="margin:16px 0;border-color:#e2e8f0;">
              <div class="form-group" style="display:flex;align-items:center;gap:10px;">
                <input type="checkbox" id="sentenceToggle" onchange="toggleSection('sentence', this.checked)" style="width:18px;height:18px;accent-color:#f59e0b;">
                <label for="sentenceToggle" style="margin:0;font-weight:600;">Sentence Writing Section</label>
              </div>
              <div class="form-group">
                <label>Sentence Writing Instruction</label>
                <textarea id="sentenceInstruction" rows="2" onchange="updateSentenceInstruction(this.value)"></textarea>
              </div>
              <div class="form-group">
                <label>Number of Lines</label>
                <input type="number" id="sentenceLines" min="1" max="10" value="1" onchange="updateSentenceLines(this.value)">
              </div>
              <div class="form-actions">
                <button class="btn btn-primary" id="saveBtn" onclick="saveLesson()">💾 Save Lesson</button>
                <button class="btn btn-outline" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
                <button class="btn btn-outline" id="viewLessonBtn" onclick="viewLessonFromEdit()" style="display:none">👁️ View Lesson</button>
              </div>
            </div>
          </div>
          <div class="tab-panel" id="bookPanel">
            <div style="max-width:900px;margin:0 auto;">
              <h2 style="margin-bottom:20px;">📘 Book Cover &amp; Setup</h2>
              <div class="form-section" style="position:static;max-height:none;margin-bottom:24px;">
                <div class="form-group"><label>Cover Title</label><input id="coverTitleInput" value="${escapeHtml(bookMeta.title)}"></div>
                <div class="form-group"><label>Cover Subtitle</label><input id="coverSubtitleInput" value="${escapeHtml(bookMeta.subtitle)}"></div>
                <div class="form-group"><label>Global Grade</label><input id="globalGradeInput" value="${escapeHtml(bookMeta.grade)}" placeholder="e.g. 1, 2, K"></div>
                <div class="form-group" style="display:flex;align-items:center;gap:12px;margin-top:16px;">
                  <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:14px;">
                    <input type="checkbox" id="tocToggle" style="width:18px;height:18px;accent-color:#f59e0b;"> Include Table of Contents
                  </label>
                </div>
                <hr style="margin:20px 0;border-color:#e2e8f0;">
                <div class="form-group" style="display:flex;align-items:center;gap:12px;">
                  <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:14px;">
                    <input type="checkbox" id="sightWordsToggle" onchange="toggleSightWordsFields()" style="width:18px;height:18px;accent-color:#f59e0b;"> Include Sight Words Pages
                  </label>
                </div>
                <div id="sightWordsFields" style="display:none;">
                  <div class="form-group">
                    <label>Sight Words Page Title</label>
                    <input id="sightWordsTitle" value="${escapeHtml(bookMeta.sightWords.title)}" placeholder="e.g. Sight Words">
                  </div>
                  <div class="form-row">
                    <div class="form-group">
                      <label>Columns (2-6)</label>
                      <input type="number" id="sightColumns" min="${MIN_SIGHT_COLUMNS}" max="${MAX_SIGHT_COLUMNS}" value="${bookMeta.sightWords.columns}" onchange="this.value = Math.min(Math.max(parseInt(this.value) || ${DEFAULT_SIGHT_COLUMNS}, ${MIN_SIGHT_COLUMNS}), ${MAX_SIGHT_COLUMNS})">
                    </div>
                  </div>
                  <div class="form-group">
                    <label>Sight Words (comma separated, line breaks create new pages)</label>
                    <textarea id="sightWordsText" rows="6" placeholder="Example:&#10;the, and, you, was&#10;for, are, with, his&#10;they, I, at, be, this">${escapeHtml(bookMeta.sightWords.rawText)}</textarea>
                  </div>
                </div>
                <hr style="margin:20px 0;border-color:#e2e8f0;">
                <h3>🧩 Sprite Sheets</h3>
                <div class="sprite-sheet-upload" style="margin-bottom:10px;">
                  <input type="file" id="spriteSheetFile" accept="image/*" onchange="addSpriteSheet(this)">
                  <label for="spriteSheetFile" class="btn btn-outline btn-sm">Upload Sprite Sheet</label>
                </div>
                <div id="spriteSheetsList" style="margin-top:10px;"></div>
                <button class="btn btn-primary" onclick="saveBookMeta()">💾 Save Cover, TOC &amp; Sprite Settings</button>
              </div>

              <div class="list-section">
                <h2>📖 All Readers</h2>
                <div class="list-toolbar">
                  <input class="search-box" id="searchInput" placeholder="🔍 Search..." oninput="window.searchQuery=this.value;renderEditList()">
                  <span class="count" id="listCount">0/0</span>
                  <button class="btn btn-success btn-sm" onclick="exportJSON()">📤 Export JSON</button>
                  <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">📥 Import</button>
                  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
                </div>
                <div class="lesson-list" id="lessonList"></div>
              </div>
            </div>
          </div>
          <div class="tab-panel" id="viewPanel">
            <div class="view-toolbar"><span class="info" id="viewInfo">0 lessons</span><button class="btn btn-success" onclick="exportAllPages()">⬇ Export All</button></div>
            <div class="view-container" id="viewContainer"></div>
          </div>`;

        // Initialize UI after DOM insertion
        populateSpriteSheetSelect();
        toggleSpriteFields();
        renderSpriteSheetsList();
        document.getElementById('sightWordsToggle').checked = bookMeta.sightWords.enabled;
        document.getElementById('sightWordsTitle').value = bookMeta.sightWords.title;
        document.getElementById('sightColumns').value = bookMeta.sightWords.columns;
        document.getElementById('sightWordsText').value = bookMeta.sightWords.rawText;
        toggleSightWordsFields();

        resetForm();
        renderEditList();
        renderAllView();
        updateCounts();
        renderTocPreview();

        const list = document.getElementById('lessonList');
        list.addEventListener('dragstart', e => {
          const item = e.target.closest('.lesson-item');
          if (item) { item.classList.add('dragging'); e.dataTransfer.setData('text/plain', item.dataset.id); }
        });
        list.addEventListener('dragend', e => {
          const item = e.target.closest('.lesson-item');
          if (item) item.classList.remove('dragging');
          list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        });
        list.addEventListener('dragover', e => {
          e.preventDefault();
          const target = e.target.closest('.lesson-item');
          list.querySelectorAll('.drag-over').forEach(el => { if (el !== target) el.classList.remove('drag-over'); });
          if (target && !target.classList.contains('dragging')) target.classList.add('drag-over');
        });
        list.addEventListener('dragleave', e => {
          const target = e.target.closest('.lesson-item');
          if (target) target.classList.remove('drag-over');
        });
        list.addEventListener('drop', e => {
          e.preventDefault();
          list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
          const id = e.dataTransfer.getData('text/plain');
          const target = e.target.closest('.lesson-item');
          if (id && target && target.dataset.id !== id) {
            const fromIdx = lessons.findIndex(l => l.id === id);
            const toIdx = lessons.findIndex(l => l.id === target.dataset.id);
            if (fromIdx !== -1 && toIdx !== -1) {
              const [moved] = lessons.splice(fromIdx, 1);
              lessons.splice(toIdx, 0, moved);
              renumberByOrder(lessons);
              saveData(); refreshUI(); showToast('Order updated.', 'info');
            }
          }
        });

        renderThumbnail();
      }

      initApp();
    })();
  </script>
</body>
</html>
