<body>
    <div id="app"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function () {
            const IDB_NAME = 'phonics_lessons_db';
            const IDB_STORE = 'app_data';
            const LEGACY_STORAGE_KEY = 'phonics_lessons_v12';
            const MAX_TOC_PER_PAGE = 20;
            const MAX_SIGHT_WORDS_PER_PAGE = 50;
            const MAX_GRID_WORDS = 24;
            const MAX_FILL_ITEMS = 18;

            let dbPromise = null;
            function getDB() {
                if (!dbPromise) {
                    dbPromise = new Promise((resolve, reject) => {
                        const request = indexedDB.open(IDB_NAME, 1);
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(IDB_STORE)) {
                                db.createObjectStore(IDB_STORE);
                            }
                        };
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => reject(request.error);
                    });
                }
                return dbPromise;
            }

            async function idbSet(data) {
                try {
                    const db = await getDB();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(IDB_STORE, 'readwrite');
                        const store = tx.objectStore(IDB_STORE);
                        store.put(data, 'appData');
                        tx.oncomplete = () => resolve();
                        tx.onerror = () => reject(tx.error);
                    });
                } catch (e) {
                    localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(data));
                }
            }

            async function idbGet() {
                try {
                    const db = await getDB();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(IDB_STORE, 'readonly');
                        const store = tx.objectStore(IDB_STORE);
                        const request = store.get('appData');
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => reject(request.error);
                    });
                } catch (e) {
                    return null;
                }
            }

            function sanitizeRichText(text) {
                if (!text) return '';
                let esc = escapeHtml(text);
                esc = esc
                    .replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>')
                    .replace(/&lt;i&gt;/g, '<i>').replace(/&lt;\/i&gt;/g, '</i>')
                    .replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>')
                    .replace(/&lt;strong&gt;/g, '<strong>').replace(/&lt;\/strong&gt;/g, '</strong>')
                    .replace(/&lt;em&gt;/g, '<em>').replace(/&lt;\/em&gt;/g, '</em>')
                    .replace(/&lt;span class=&quot;highlight&quot;&gt;/g, '<span class="highlight">')
                    .replace(/&lt;span class="highlight"&gt;/g, '<span class="highlight">')
                    .replace(/&lt;\/span&gt;/g, '</span>');
                return esc;
            }

            function formatTextWithHighlight(text) {
                const formatted = sanitizeRichText(text);
                return formatted.replace(/\b(apple|egg|igloo|octopus|umbrella)\b/gi, m => `<span class="highlight">${m}</span>`);
            }

            function flattenWords(arr) {
                if (!Array.isArray(arr)) return [];
                let r = [];
                for (let row of arr) {
                    if (Array.isArray(row)) r = r.concat(row);
                    else r.push(row);
                }
                return r;
            }
            function escapeHtml(str) {
                return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
            }
            function showToast(msg, type = 'info') {
                const t = document.createElement('div');
                t.className = 'toast ' + type;
                t.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️'}</span> ${escapeHtml(msg)}`;
                document.getElementById('toastContainer').appendChild(t);
                setTimeout(() => t.remove(), 3500);
            }
            function confirmDialog(msg, cb) {
                const o = document.createElement('div');
                o.className = 'modal-overlay';
                o.innerHTML = `<div class="modal"><h3>⚠️ Confirm</h3><p>${msg}</p><div class="actions"><button class="btn btn-outline cancel">Cancel</button><button class="btn btn-danger confirm">Yes</button></div></div>`;
                document.body.appendChild(o);
                o.querySelector('.cancel').onclick = () => o.remove();
                o.querySelector('.confirm').onclick = () => { o.remove(); cb(); };
            }

            const SECTION_TYPES = {
                tile: { label: 'Letter/Image Tile', defaultWidth: 'full', fields: ['tileMode','letterTile','letterFontSize','imagePath','imageCaption'] },
                introText: { label: 'Intro Text', defaultWidth: 'full', fields: ['text'] },
                instruction: { label: 'Instruction', defaultWidth: 'full', fields: ['text'] },
                wordGrid: { label: 'Word Grid', defaultWidth: 'full', fields: ['words','columns','rows'] },
                decodable: { label: 'Decodable Reading', defaultWidth: 'full', fields: ['instruction','sentences'] },
                fillBlanks: { label: 'Fill-in-Blanks', defaultWidth: 'full', fields: ['title','items'] },
                sentenceWriting: { label: 'Sentence Writing', defaultWidth: 'full', fields: ['title','lines'] },
                customText: { label: 'Custom Text', defaultWidth: 'full', fields: ['text'] },
                writingLines: { label: 'Writing Lines (expandable)', defaultWidth: 'full', fields: ['fillRemaining'] }
            };

            function generateSectionId() { return 'sec' + Date.now() + Math.random().toString(36).slice(2, 7); }

            function createDefaultSection(type) {
                const id = generateSectionId();
                const base = { id, type, width: SECTION_TYPES[type].defaultWidth };
                switch (type) {
                    case 'tile':
                        return { ...base, tileMode: 'letter', letterTile: 'Aa', letterFontSize: 56, imagePath: '', imageCaption: "TODAY'S SOUND" };
                    case 'introText':
                    case 'instruction':
                    case 'customText':
                        return { ...base, text: '' };
                    case 'wordGrid':
                        return { ...base, words: [], columns: 4, rows: 3 };
                    case 'decodable':
                        return { ...base, instruction: 'Read ALOUD and circle all words with the target sound', sentences: [] };
                    case 'fillBlanks':
                        return { ...base, title: 'A. Fill in the missing letters and say the word', items: [] };
                    case 'sentenceWriting':
                        return { ...base, title: 'C. Choose any word and form 2 sentences', lines: 2 };
                    case 'writingLines':
                        return { ...base, fillRemaining: true };
                    default:
                        return { ...base };
                }
            }

            function migrateToSections(lesson) {
                if (Array.isArray(lesson.sections) && lesson.sections.length > 0) return lesson;
                const sections = [];
                if (lesson.tileMode && lesson.tileMode !== 'none') {
                    sections.push({ id: generateSectionId(), type: 'tile', width: 'full', tileMode: lesson.tileMode, letterTile: lesson.letterTile || '', letterFontSize: lesson.letterFontSize || 56, imagePath: lesson.imagePath || '', imageCaption: lesson.imageCaption || "TODAY'S SOUND" });
                }
                if (lesson.showIntro !== false && lesson.introText) {
                    sections.push({ id: generateSectionId(), type: 'introText', width: 'full', text: lesson.introText });
                }
                if (lesson.showInstruction !== false && lesson.instruction) {
                    sections.push({ id: generateSectionId(), type: 'instruction', width: 'full', text: lesson.instruction });
                }
                if (lesson.showGrid !== false && lesson.words && lesson.words.length > 0) {
                    sections.push({ id: generateSectionId(), type: 'wordGrid', width: 'full', words: lesson.words, columns: 4, rows: Math.ceil(lesson.words.length / 4) || 3 });
                } else if (lesson.showGrid !== false && (!lesson.words || lesson.words.length === 0)) {
                    sections.push({ id: generateSectionId(), type: 'wordGrid', width: 'full', words: [], columns: 4, rows: 3 });
                }
                if (lesson.showDecodable === true) {
                    sections.push({ id: generateSectionId(), type: 'decodable', width: 'full', instruction: lesson.decodableInstruction || 'Read ALOUD and circle all words with the target sound', sentences: lesson.decodableSentences || [] });
                }
                if (lesson.showFillBlanks === true) {
                    sections.push({ id: generateSectionId(), type: 'fillBlanks', width: 'full', title: lesson.fillTitle || 'A. Fill in the missing letters and say the word', items: lesson.fillItems || [] });
                }
                if (lesson.showSentenceWrite === true) {
                    sections.push({ id: generateSectionId(), type: 'sentenceWriting', width: 'full', title: lesson.sentenceTitle || 'C. Choose any word and form 2 sentences', lines: lesson.sentenceLines || 2 });
                }
                if (lesson.showWritingLines !== false) {
                    sections.push({ id: generateSectionId(), type: 'writingLines', width: 'full', fillRemaining: true });
                }
                if (Array.isArray(lesson.customBoxes)) {
                    lesson.customBoxes.forEach(cb => {
                        if (cb.enabled && cb.text) sections.push({ id: generateSectionId(), type: 'customText', width: 'full', text: cb.text });
                    });
                }
                lesson.sections = sections;
                delete lesson.tileMode; delete lesson.letterTile; delete lesson.letterFontSize; delete lesson.imagePath; delete lesson.imageCaption;
                delete lesson.showIntro; delete lesson.introText; delete lesson.showInstruction; delete lesson.instruction;
                delete lesson.showGrid; delete lesson.words; delete lesson.showDecodable; delete lesson.decodableInstruction; delete lesson.decodableSentences;
                delete lesson.showFillBlanks; delete lesson.fillTitle; delete lesson.fillItems; delete lesson.showSentenceWrite; delete lesson.sentenceTitle; delete lesson.sentenceLines;
                delete lesson.showWritingLines; delete lesson.customBoxes;
                return lesson;
            }

            const DEFAULT_LESSONS = [
                (() => {
                    const l = { id: 'l1', mainTitle: 'SHORT VOWEL CVC WORDS', subtitle: 'SHORT VOWEL', lessonNumber: 1 };
                    l.sections = [
                        { id: generateSectionId(), type: 'tile', width: 'full', tileMode: 'letter', letterTile: 'Aa', letterFontSize: 56, imagePath: '', imageCaption: "TODAY'S SOUND" },
                        { id: generateSectionId(), type: 'introText', width: 'full', text: 'Short a says /a/ like in <b>apple</b> — when a single vowel is boxed in between two consonants, it usually keeps this quick, clipped sound.' },
                        { id: generateSectionId(), type: 'instruction', width: 'full', text: 'Say each picture word out loud and listen for this pattern.' },
                        { id: generateSectionId(), type: 'wordGrid', width: 'full', words: ['bag','cat','mat','hat','rat','bat','sat','pat','fat','man','van','map'], columns: 4, rows: 3 },
                        { id: generateSectionId(), type: 'decodable', width: 'full', instruction: 'Read ALOUD and circle all words with the target sound', sentences: ['I see a bag.','Look at the cat and the mat.','Is this a hat?','I like my rat.','We have a bat.'] },
                        { id: generateSectionId(), type: 'fillBlanks', width: 'full', title: 'A. Fill in the missing letters and say the word', items: ['b_g','c_t','m_t','h_t','r_t','b_t','s_t','p_t','f_t'] },
                        { id: generateSectionId(), type: 'sentenceWriting', width: 'full', title: 'C. Choose any word and form 2 sentences', lines: 2 },
                        { id: generateSectionId(), type: 'writingLines', width: 'full', fillRemaining: true }
                    ];
                    return l;
                })()
            ];
            const DEFAULT_SIGHT_WORDS = ['the','of','and','a','to','in','is','you','that','it','he','was','for','on','are','as','with','his','they','I','at','be','this','have','from','or','one','had','by','but','not','what','all','were','we','when','your','can','said','there','use','an','each','which','she','do','how','their','if','will','up','other','about','out','many','then','them','these','so','some','her','would','make','like','him','into','time','has','look','two','more','write','go','see','no','way','could','people','my','than','first','water','been','called','who','am','its','now','find','long','down','day','did','get','come','made','may','part'];
            const DEFAULT_COVER = { title: 'Crystal Phonics', subtitle: 'Grade 1' };

            let lessons = [], sightWords = [], coverData = { ...DEFAULT_COVER };
            let editingId = null, nextId = 1, tempSections = [];
            window.searchQuery = '';

            // V12 HARDENING: immutable snapshots, safe IDs, and bounded undo/redo.
            const HISTORY_LIMIT = 60;
            let undoStack = [], redoStack = [], historyBusy = false, saveBusy = Promise.resolve();
            const cloneState = state => JSON.parse(JSON.stringify(state));
            function currentState() { return { lessons: cloneState(lessons), sightWords: cloneState(sightWords), coverData: cloneState(coverData) }; }
            function stateKey(state) { try { return JSON.stringify(state); } catch(e) { return ''; } }
            function updateHistoryUI() {
                const u=document.getElementById('undoBtn'), r=document.getElementById('redoBtn');
                if(u) u.disabled = historyBusy || undoStack.length===0;
                if(r) r.disabled = historyBusy || redoStack.length===0;
                const el=document.getElementById('historyStatus');
                if(el) el.textContent = `${undoStack.length ? undoStack.length+' undo' : 'No undo'} · ${redoStack.length ? redoStack.length+' redo' : 'No redo'}`;
            }
            function recordHistory(before, after) {
                if (historyBusy || stateKey(before) === stateKey(after)) return;
                undoStack.push(cloneState(before));
                if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
                redoStack = [];
                updateHistoryUI();
            }
            async function persistState() {
                const snapshot=currentState();
                saveBusy = saveBusy.then(async()=>{
                    await saveData(snapshot);
                }).catch(err=>{
                    console.error(err);
                    showToast('Could not save changes. Your data remains in memory; export JSON as a backup.', 'error');
                });
                return saveBusy;
            }
            async function restoreState(state) {
                const normalized = normalizeImportedState(cloneState(state));
                lessons = normalized.lessons; sightWords = normalized.sightWords; coverData = normalized.coverData;
                resyncNextId();
                resetForm(); refreshUI();
                await persistState();
            }
            window.undoLast = async function() {
                if(historyBusy || !undoStack.length) return;
                historyBusy=true; updateHistoryUI();
                try {
                    const current=currentState(), previous=undoStack.pop();
                    redoStack.push(current); if(redoStack.length>HISTORY_LIMIT) redoStack.shift();
                    await restoreState(previous); showToast('Undid last change.','success');
                } finally { historyBusy=false; updateHistoryUI(); }
            };
            window.redoLast = async function() {
                if(historyBusy || !redoStack.length) return;
                historyBusy=true; updateHistoryUI();
                try {
                    const current=currentState(), next=redoStack.pop();
                    undoStack.push(current); if(undoStack.length>HISTORY_LIMIT) undoStack.shift();
                    await restoreState(next); showToast('Redid last change.','success');
                } finally { historyBusy=false; updateHistoryUI(); }
            };
            function normalizeImportedState(data) {
                const rawLessons = Array.isArray(data?.lessons) ? data.lessons : [];
                const seenIds = new Set(), seenSectionIds = new Set();
                const safeLessons = rawLessons.map((raw, idx) => {
                    const l = migrateToSections(raw && typeof raw==='object' ? raw : {});
                    let id = (typeof l.id==='string' && /^l[\w-]+$/.test(l.id)) ? l.id : '';
                    if (!id || seenIds.has(id)) id = 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
                    while(seenIds.has(id)) id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
                    seenIds.add(id); l.id=id;
                    l.mainTitle = typeof l.mainTitle==='string' ? l.mainTitle.slice(0,300) : 'Untitled Lesson';
                    l.subtitle = typeof l.subtitle==='string' ? l.subtitle.slice(0,300) : 'SHORT VOWEL';
                    l.sections = Array.isArray(l.sections) ? l.sections.filter(Boolean).map(sec=>{
                        const x={...sec};
                        let sid=(typeof x.id==='string' && x.id) ? x.id : '';
                        if(!sid || seenSectionIds.has(sid)) sid=generateSectionId();
                        while(seenSectionIds.has(sid)) sid=generateSectionId();
                        seenSectionIds.add(sid); x.id=sid;
                        if(!SECTION_TYPES[x.type]) return null;
                        if(!['full','half','quarter','threequarter'].includes(x.width)) x.width='full';
                        return x;
                    }).filter(Boolean) : [];
                    l.lessonNumber=idx+1;
                    return l;
                });
                const sw = Array.isArray(data?.sightWords) ? data.sightWords : [...DEFAULT_SIGHT_WORDS];
                const safeSW = sw.filter(x=>typeof x==='string').map(x=>x.trim().slice(0,100)).filter(Boolean).slice(0,5000);
                const cd = data?.coverData && typeof data.coverData==='object' ? data.coverData : {...DEFAULT_COVER};
                return {lessons:safeLessons, sightWords:safeSW, coverData:{title:typeof cd.title==='string'?cd.title.slice(0,200):DEFAULT_COVER.title, subtitle:typeof cd.subtitle==='string'?cd.subtitle.slice(0,200):DEFAULT_COVER.subtitle}};
            }
            window.addEventListener('keydown', e=>{
                const mod=e.ctrlKey||e.metaKey;
                if(!mod || e.altKey) return;
                const tag=(e.target?.tagName||'').toLowerCase();
                if((tag==='input'||tag==='textarea'||tag==='select') && !e.shiftKey) return;
                if(e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey ? redoLast() : undoLast(); }
                else if(e.key.toLowerCase()==='y'){ e.preventDefault(); redoLast(); }
            });

            async function loadData() {
                let data = null;
                try { data = await idbGet(); } catch (e) { data = null; }
                if (!data || !data.lessons) {
                    try {
                        const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
                        if (raw) data = JSON.parse(raw);
                    } catch (e) {}
                }
                if (data && data.lessons) {
                    const normalized = normalizeImportedState(data);
                    lessons = normalized.lessons;
                    sightWords = normalized.sightWords;
                    coverData = normalized.coverData;
                    if (lessons.length) {
                        let maxId = 0;
                        lessons.forEach(l => {
                            if (!l.id) l.id = 'l' + Date.now() + Math.random().toString(36).slice(2, 6);
                            const num = parseInt(String(l.id).replace('l', '')) || 0;
                            if (num > maxId) maxId = num;
                        });
                        nextId = maxId + 1;
                    } else {
                        lessons = JSON.parse(JSON.stringify(DEFAULT_LESSONS));
                        nextId = lessons.length + 1;
                    }
                    renumberByOrder(lessons);
                } else {
                    lessons = JSON.parse(JSON.stringify(DEFAULT_LESSONS));
                    sightWords = [...DEFAULT_SIGHT_WORDS];
                    coverData = { ...DEFAULT_COVER };
                    nextId = lessons.length + 1;
                    renumberByOrder(lessons);
                }
            }

            async function saveData(dataOverride) {
                const payload = dataOverride ? cloneState(dataOverride) : currentState();
                try { await idbSet(payload); } catch (e) {
                    try { localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(payload)); }
                    catch (fallbackErr) { throw new Error('Persistent storage unavailable'); }
                    return;
                }
                try { localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(payload)); } catch (e) { /* IndexedDB remains authoritative */ }
            }

            function generateId() { return 'l' + (nextId++); }
            function resyncNextId() {
                let maxId = 0;
                lessons.forEach(l => {
                    const num = parseInt(String(l.id).replace('l', '')) || 0;
                    if (num > maxId) maxId = num;
                });
                nextId = maxId + 1;
            }
            function renumberByOrder(arr) { arr.forEach((lesson, idx) => lesson.lessonNumber = idx + 1); }

            function renderSectionsBuilder() {
                const container = document.getElementById('sectionsContainer');
                if (!container) return;
                if (!tempSections.length) {
                    container.innerHTML = '<div style="color:#6c757d;font-size:12px;padding:8px 0;">No sections added.</div>';
                    return;
                }
                let html = '';
                tempSections.forEach((section, idx) => {
                    const typeInfo = SECTION_TYPES[section.type];
                    html += `<div class="section-builder-item" data-id="${section.id}">
                        <div class="sb-header">
                            <span class="sb-title">${typeInfo.label}</span>
                            <select onchange="updateSectionWidth('${section.id}', this.value)">
                                <option value="full" ${section.width === 'full' ? 'selected' : ''}>Full width</option>
                                <option value="half" ${section.width === 'half' ? 'selected' : ''}>Half width</option>
                                <option value="quarter" ${section.width === 'quarter' ? 'selected' : ''}>Quarter width</option>
                                <option value="threequarter" ${section.width === 'threequarter' ? 'selected' : ''}>Three-quarter width</option>
                            </select>
                            <div class="sb-actions">
                                <button class="btn btn-outline btn-xs" onclick="moveSection('${section.id}', -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
                                <button class="btn btn-outline btn-xs" onclick="moveSection('${section.id}', 1)" ${idx === tempSections.length-1 ? 'disabled' : ''}>▼</button>
                                <button class="btn btn-danger btn-xs" onclick="deleteSection('${section.id}')">🗑️</button>
                            </div>
                        </div>
                        <div class="sb-body">
                            ${renderSectionFields(section)}
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            }

            function renderSectionFields(section) {
                let html = '';
                switch (section.type) {
                    case 'tile':
                        html = `
                            <select onchange="updateSectionData('${section.id}', 'tileMode', this.value)">
                                <option value="letter" ${section.tileMode === 'letter' ? 'selected' : ''}>Letter</option>
                                <option value="image" ${section.tileMode === 'image' ? 'selected' : ''}>Image</option>
                            </select>
                            <div class="form-group">
                                <label>Letter Tile</label>
                                <input value="${escapeHtml(section.letterTile || '')}" onchange="updateSectionData('${section.id}', 'letterTile', this.value)">
                            </div>
                            <div class="form-group">
                                <label>Font size (px)</label>
                                <input type="number" value="${section.letterFontSize || 56}" min="24" max="96" onchange="updateSectionData('${section.id}', 'letterFontSize', this.value)">
                            </div>
                            <div class="form-group">
                                <label>Caption (for image mode)</label>
                                <input value="${escapeHtml(section.imageCaption || "TODAY'S SOUND")}" onchange="updateSectionData('${section.id}', 'imageCaption', this.value)">
                            </div>
                            <div class="form-group">
                                <label>Image Path</label>
                                <input value="${escapeHtml(section.imagePath || '')}" onchange="updateSectionData('${section.id}', 'imagePath', this.value)">
                            </div>`;
                        break;
                    case 'introText':
                    case 'instruction':
                    case 'customText':
                        html = `<textarea rows="3" oninput="updateSectionData('${section.id}', 'text', this.value)">${escapeHtml(section.text || '')}</textarea>`;
                        break;
                    case 'wordGrid':
                        html = `
                            <div class="form-row" style="display:flex; gap:10px;">
                                <div class="form-group" style="flex:1;">
                                    <label>Columns</label>
                                    <input type="number" value="${section.columns || 4}" min="1" max="8" onchange="updateSectionData('${section.id}', 'columns', parseInt(this.value))">
                                </div>
                                <div class="form-group" style="flex:1;">
                                    <label>Rows</label>
                                    <input type="number" value="${section.rows || 3}" min="1" max="12" onchange="updateSectionData('${section.id}', 'rows', parseInt(this.value))">
                                </div>
                            </div>
                            <textarea rows="3" placeholder="Comma separated words (optional)" oninput="updateSectionData('${section.id}', 'words', this.value.split(',').map(s=>s.trim()).filter(Boolean))">${(section.words || []).join(', ')}</textarea>`;
                        break;
                    case 'decodable':
                        html = `
                            <input value="${escapeHtml(section.instruction || '')}" onchange="updateSectionData('${section.id}', 'instruction', this.value)">
                            <textarea rows="3" placeholder="Sentences, comma separated" oninput="updateSectionData('${section.id}', 'sentences', this.value.split(',').map(s=>s.trim()).filter(Boolean))">${(section.sentences || []).join(', ')}</textarea>`;
                        break;
                    case 'fillBlanks':
                        html = `
                            <input value="${escapeHtml(section.title || '')}" onchange="updateSectionData('${section.id}', 'title', this.value)">
                            <textarea rows="3" placeholder="Items, comma separated (use _ for blank)" oninput="updateSectionData('${section.id}', 'items', this.value.split(',').map(s=>s.trim()).filter(Boolean))">${(section.items || []).join(', ')}</textarea>`;
                        break;
                    case 'sentenceWriting':
                        html = `
                            <input value="${escapeHtml(section.title || '')}" onchange="updateSectionData('${section.id}', 'title', this.value)">
                            <input type="number" value="${section.lines || 2}" min="1" max="8" onchange="updateSectionData('${section.id}', 'lines', parseInt(this.value))">`;
                        break;
                    case 'writingLines':
                        html = `<label><input type="checkbox" ${section.fillRemaining ? 'checked' : ''} onchange="updateSectionData('${section.id}', 'fillRemaining', this.checked)"> Fill remaining height</label>`;
                        break;
                    default:
                        html = '';
                }
                return html;
            }

            window.addSection = function(type) {
                const newSection = createDefaultSection(type);
                tempSections.push(newSection);
                renderSectionsBuilder();
                renderThumbnail();
            };
            window.deleteSection = function(id) {
                tempSections = tempSections.filter(s => s.id !== id);
                renderSectionsBuilder();
                renderThumbnail();
            };
            window.moveSection = function(id, dir) {
                const idx = tempSections.findIndex(s => s.id === id);
                if (idx === -1) return;
                const newIdx = idx + dir;
                if (newIdx < 0 || newIdx >= tempSections.length) return;
                const temp = tempSections[idx];
                tempSections[idx] = tempSections[newIdx];
                tempSections[newIdx] = temp;
                renderSectionsBuilder();
                renderThumbnail();
            };
            window.updateSectionWidth = function(id, width) {
                const section = tempSections.find(s => s.id === id);
                if (section) section.width = width;
                renderThumbnail();
            };
            window.updateSectionData = function(id, field, value) {
                const section = tempSections.find(s => s.id === id);
                if (!section) return;
                section[field] = value;
                if (field === 'lines') section.lines = parseInt(value) || 2;
                if (field === 'columns') section.columns = parseInt(value) || 4;
                if (field === 'rows') section.rows = parseInt(value) || 3;
                renderThumbnail();
            };

            function renderThumbnail() {
                const container = document.getElementById('thumbnailContainer');
                if (!container) return;

                const mainTitle = document.getElementById('fMainTitle')?.value || 'Untitled';
                const subtitle = document.getElementById('fSubtitle')?.value || 'SHORT VOWEL';
                const lessonNumber = parseInt(document.getElementById('fLessonNumber')?.value) || 1;

                const tempLesson = {
                    mainTitle,
                    subtitle,
                    lessonNumber,
                    sections: JSON.parse(JSON.stringify(tempSections))
                };

                const pageEl = buildLessonPage(tempLesson, 1);
                pageEl.querySelector('.page-actions')?.remove();

                pageEl.style.transform = 'scale(0.3)';
                pageEl.style.transformOrigin = 'top left';
                pageEl.style.position = 'absolute';
                pageEl.style.top = '0';
                pageEl.style.left = '0';
                pageEl.style.width = '850px';
                pageEl.style.minWidth = '850px';
                pageEl.style.minHeight = '1080px';
                pageEl.style.padding = '24px 32px';
                pageEl.style.margin = '0';
                pageEl.style.borderRadius = '0';
                pageEl.style.boxShadow = 'none';
                pageEl.style.pageBreakAfter = 'auto';

                container.innerHTML = '';
                container.appendChild(pageEl);
                container.style.height = '324px';
            }

            function buildLessonPage(lesson, pageNum) {
                const page = document.createElement('div');
                page.className = 'page';
                page.innerHTML = `<div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div>`;
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <div class="cvc-header">
                        <div class="cvc-header-left">
                            <h1 class="cvc-main-title">${escapeHtml(lesson.mainTitle || 'CVC WORDS')}</h1>
                            <div class="cvc-subtitle">${escapeHtml(lesson.subtitle || 'SHORT VOWEL')}</div>
                        </div>
                        <div class="cvc-header-right">
                            <span class="lesson-label">LESSON</span>

                const sectionsContainer = document.createElement('div');

                (lesson.sections || []).forEach(section => {
                    const sectionEl = document.createElement('div');
                    sectionEl.className = `section-item w-${section.width}`;
                    sectionEl.innerHTML = renderSectionContent(section);
                    sectionsContainer.appendChild(sectionEl);
                });

                card.appendChild(sectionsContainer);
                page.appendChild(card);

                const pn = document.createElement('div');

            function renderSectionContent(section) {
                switch (section.type) {
                    case 'tile': {
                        const tileMode = section.tileMode || 'letter';
                        if (tileMode === 'letter') {
                            return `<div class="todays-sound-card">
                                <div class="todays-sound-header">TODAY'S SOUND</div>
                                <div class="todays-sound-body">
                                    <div class="todays-sound-stars">★ ★ ★</div>
                                    <div class="todays-sound-letter" style="font-size:${section.letterFontSize || 56}px">${escapeHtml(section.letterTile || 'Aa')}</div>
                                </div>
                            </div>`;
                        } else if (tileMode === 'image') {
                            const img = section.imagePath ? `<img class="todays-sound-img" src="${escapeHtml(section.imagePath)}" />` : `<div style="font-size:32px;opacity:0.4">🖼️</div>`;
                            return `<div class="todays-sound-card">
                                <div class="todays-sound-header">${escapeHtml(section.imageCaption || "TODAY'S SOUND")}</div>
                                <div class="todays-sound-body">${img}</div>
                            </div>`;
                        }
                        return '';
                    }
                    case 'introText':
                        return `<div class="cvc-intro-box"><p>${formatTextWithHighlight(section.text || '')}</p></div>`;
                    case 'instruction':
                        return `<div class="cvc-instruction-box"><p>${escapeHtml(section.text || '')}</p></div>`;
                    case 'customText':
                        return `<div class="custom-text-box"><p>${formatTextWithHighlight(section.text || '')}</p></div>`;
                    case 'wordGrid': {
                        const columns = Math.max(1, Math.min(8, Number(section.columns) || 4));
                        const rows = Math.max(1, Math.min(8, Number(section.rows) || 3));
                        const words = (Array.isArray(section.words) ? section.words : []).filter(w => typeof w === 'string').slice(0, Math.min(MAX_GRID_WORDS, columns * rows));
                        const totalCells = Math.min(MAX_GRID_WORDS, columns * rows);
                        let cellsHtml = '';
                        for (let i = 0; i < totalCells; i++) {
                            const word = words[i] || '';
                            const isLastCol = (i % columns) === columns - 1;
                            const isLastRow = i >= totalCells - columns;
                            let cellStyle = '';
                            if (!isLastCol) cellStyle += 'border-right:1px solid #f0c9a8;';
                            else cellStyle += 'border-right:none;';
                            if (!isLastRow) cellStyle += 'border-bottom:1px solid #f0c9a8;';
                            else cellStyle += 'border-bottom:none;';
                            cellsHtml += `<div class="word-cell${word ? '' : ' empty'}" style="${cellStyle}">${escapeHtml(word || '')}</div>`;
                        }
                        return `<div class="word-grid" style="grid-template-columns:repeat(${columns},1fr);">${cellsHtml}</div>`;
                    }
                    case 'decodable': {
                        const sents = (section.sentences || []).filter(Boolean);
                        if (!sents.length) return '';
                        const lines = sents.map((s, i) => `<div class="sentence">${i + 1}. ${escapeHtml(s)}</div>`).join('');
                        return `<div class="act-box"><div class="act-title">${escapeHtml(section.instruction || '')}</div>${lines}</div>`;
                    }
                    case 'fillBlanks': {
                        const items = (section.items || []).filter(Boolean).slice(0, MAX_FILL_ITEMS);
                        if (!items.length) return '';
                        const cells = items.map(item => {
                            let html = '';
                            for (const ch of String(item)) {
                                if (ch === '_') html += '<span class="blank-sq"></span>';
                                else html += `<span>${escapeHtml(ch)}</span>`;
                            }
                            return `<div class="fill-item">${html}</div>`;
                        }).join('');
                        return `<div class="act-box"><div class="act-title">${escapeHtml(section.title || '')}</div><div class="fill-grid">${cells}</div></div>`;
                    }
                    case 'sentenceWriting': {
                        const n = Math.max(1, Math.min(8, section.lines || 2));
                        let lines = '';
                        for (let i = 0; i < n; i++) lines += `<div class="sent-line">${i + 1}.</div>`;
                        return `<div class="act-box"><div class="act-title">${escapeHtml(section.title || '')}</div><div class="sent-lines">${lines}</div></div>`;
                    }
                    case 'writingLines': {
                        const count = 3;
                        let lines = '';
                        for (let i = 0; i < count; i++) {
                            lines += `<div class="writing-set"><div class="line l1"></div><div class="line l2"></div><div class="line l3"></div><div class="line l4"></div></div>`;
                        }
                        return `<div class="writing-lines-area">${lines}</div>`;
                    }
                    default:
                        return '';
                }
            }

            window.exportSinglePage = function(pageEl) {

            window.exportAllPages = function() {

                win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>All Pages</title>${styles}</head><body style="padding:0;background:#fff;margin:0;"><div class="view-container" style="overflow:visible;display:block;">${container.innerHTML}</div></body></html>`);

            function renderAllView() {
                const container = document.getElementById('viewContainer');
                container.innerHTML = '';

                if (!lessons.length && !sightWords.length) return;
                const swPages = Math.ceil(sightWords.length / MAX_SIGHT_WORDS_PER_PAGE) || 0;
                const tocPages = lessons.length ? Math.ceil(lessons.length / MAX_TOC_PER_PAGE) : 0;
                const lessonStart = tocPages + swPages + 2; // page 1 is the cover
                let running = lessonStart;
                const tocEntries = lessons.map(l => {
                    const e = { lessonNumber: l.lessonNumber, mainTitle: l.mainTitle, firstPage: running };
                    running += 1; return e;
                });
                for (let p = 0; p < tocPages; p++) container.appendChild(buildTocPage(p + 1, tocEntries.slice(p * MAX_TOC_PER_PAGE, (p + 1) * MAX_TOC_PER_PAGE)));
                let pageNum = tocPages + 2; // cover occupies page 1

                    container.appendChild(buildSightWordsPage(pageNum++, sightWords.slice(p * MAX_SIGHT_WORDS_PER_PAGE, (p + 1) * MAX_SIGHT_WORDS_PER_PAGE)));

                if (!mainTitle) return showToast('Main Title is required.', 'error');

                if (editingId) {
                    const idx = lessons.findIndex(l => l.id === editingId);

            window.importJSON = function(input) {
                const file = input?.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onerror = () => showToast('Could not read the JSON file.', 'error');
                reader.onload = e => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data || typeof data !== 'object' || !Array.isArray(data.lessons)) throw new Error('Invalid structure');
                        const normalized = normalizeImportedState(data);
                        confirmDialog(`Replace all data with ${normalized.lessons.length} imported lesson(s)?`, async () => {
                            const before=currentState();
                            lessons=normalized.lessons; sightWords=normalized.sightWords; coverData=normalized.coverData;
                            resyncNextId(); renumberByOrder(lessons);
                            await persistState();
                            recordHistory(before,currentState());
                            resetForm(); refreshUI(); showToast('Data imported and validated.', 'success');
                        });
                    } catch (err) { console.error(err); showToast('Invalid or unsupported JSON file.', 'error'); }
                };
                reader.readAsText(file);
                input.value = '';
            };

            function wrapMutator(name) {
                const original=window[name]; if(typeof original!=='function') return;
                window[name]=async function(...args){
                    const before=currentState();
                    const result=await original.apply(this,args);
                    const after=currentState();
                    recordHistory(before,after);
                    return result;
                };
            }

function sanitizeRichHTML(html){
 try{
  const doc=new DOMParser().parseFromString(String(html||''),'text/html');
  doc.body.querySelectorAll('FONT').forEach(n=>{
   const span=doc.createElement('span');
   const face=n.getAttribute('face'), size=n.getAttribute('size'), color=n.getAttribute('color');

function studioDelete(){const before=studioSnapshot();page().elements=page().elements.filter(e=>!selected.has(e.id));selected.clear();saveStudio();renderStudio()}
function studioGroup(){const es=selectedEls();if(es.length<2)return;const before=studioSnapshot();const left=Math.min(...es.map(e=>e.x)),top=Math.min(...es.map(e=>e.y)),right=Math.max(...es.map(e=>e.x+e.w)),bottom=Math.max(...es.map(e=>e.y+e.h));const g={id:uid('g'),type:'group',x:left,y:top,w:Math.max(1,right-left),h:Math.max(1,bottom-top),rotation:0,opacity:1,visible:true,name:'Group',locked:false,children:clone(es)};page().elements=page().elements.filter(e=>!selected.has(e.id));page().elements.push(g);selected=new Set([g.id]);saveStudio();renderStudio()}
function studioUngroup(){const g=selectedEls().find(e=>e.type==='group');if(!g)return;const before=studioSnapshot();page().elements=page().elements.filter(e=>e.id!==g.id);page().elements.push(...g.children);selected=new Set(g.children.map(e=>e.id));saveStudio();renderStudio()}
function studioBring(dir){const es=selectedEls();if(!es.length)return;const before=studioSnapshot();es.forEach(e=>{const i=page().elements.indexOf(e),j=dir>0?page().elements.length-1:0;if(i!==j){page().elements.splice(i,1);page().elements.splice(j,0,e)}});saveStudio();studioCommit(before);renderStudio()}
function studioAlign(mode){const es=selectedEls();if(!es.length)return;const before=studioSnapshot();const p=page();if(es.length===1){const e=es[0];if(mode==='left')e.x=studio.margins.left;if(mode==='right')e.x=p.width-studio.margins.right-e.w;if(mode==='center')e.x=(p.width-e.w)/2;if(mode==='top')e.y=studio.margins.top;if(mode==='bottom')e.y=p.height-studio.margins.bottom-e.h;if(mode==='middle')e.y=(p.height-e.h)/2}else{if(mode==='left'){const x=Math.min(...es.map(e=>e.x));es.forEach(e=>e.x=x)}if(mode==='right'){const r=Math.max(...es.map(e=>e.x+e.w));es.forEach(e=>e.x=r-e.w)}if(mode==='top'){const y=Math.min(...es.map(e=>e.y));es.forEach(e=>e.y=y)}if(mode==='bottom'){const b=Math.max(...es.map(e=>e.y+e.h));es.forEach(e=>e.y=b-e.h)}if(mode==='center'){const l=Math.min(...es.map(e=>e.x)),r=Math.max(...es.map(e=>e.x+e.w)),cx=(l+r)/2;es.forEach(e=>e.x=cx-e.w/2)}if(mode==='middle'){const t=Math.min(...es.map(e=>e.y)),b=Math.max(...es.map(e=>e.y+e.h)),cy=(t+b)/2;es.forEach(e=>e.y=cy-e.h/2)}if(mode==='distributeX'&&es.length>2){const a=[...es].sort((a,b)=>a.x-b.x),left=a[0].x,right=a.at(-1).x+a.at(-1).w,total=a.reduce((s,e)=>s+e.w,0),gap=(right-left-total)/(a.length-1);let x=left;a.forEach(e=>{e.x=x;x+=e.w+gap})}if(mode==='distributeY'&&es.length>2){const a=[...es].sort((a,b)=>a.y-b.y),top=a[0].y,bottom=a.at(-1).y+a.at(-1).h,total=a.reduce((s,e)=>s+e.h,0),gap=(bottom-top-total)/(a.length-1);let y=top;a.forEach(e=>{e.y=y;y+=e.h+gap})}}saveStudio();studioCommit(before);renderStudio()}
function studioZoom(d){studio.zoom=Math.max(.25,Math.min(1.5,studio.zoom+d));renderStudio()}
function studioGoPage(i){studio.current=i;selected.clear();renderStudio()}
function studioAddPage(){const p=defaultPage();p.name='Page '+(studio.pages.length+1);studio.pages.push(p);studio.current=studio.pages.length-1;selected.clear();saveStudio();renderStudio()}
function remapElementIds(e){e.id=uid();if(e.children)e.children.forEach(remapElementIds)}
function studioDuplicatePage(){const p=clone(page());p.id=uid('pg');p.name='Page '+(studio.pages.length+1);p.elements.forEach(remapElementIds);studio.pages.push(p);studio.current=studio.pages.length-1;selected.clear();saveStudio();renderStudio()}

function snap(v){return studio.grid?Math.round(v/Math.max(1,studio.gridSize))*Math.max(1,studio.gridSize):v}
function snapPoint(x,y,ignoreIds=[]){
 if(studio.grid){x=snap(x);y=snap(y)}
 if(!studio.elementSnap)return {x,y};
 const ignore=new Set(ignoreIds), threshold=6/Math.max(.25,studio.zoom);
 for(const o of page().elements){
  if(ignore.has(o.id)||o.visible===false)continue;
  for(const q of [o.x,o.x+o.w/2,o.x+o.w])if(Math.abs(x-q)<=threshold)x=q;
  for(const q of [o.y,o.y+o.h/2,o.y+o.h])if(Math.abs(y-q)<=threshold)y=q;
 }
 return {x,y}
}
function pointerPos(ev){const r=document.getElementById('studioCanvas').getBoundingClientRect();return {x:(ev.clientX-r.left)/studio.zoom,y:(ev.clientY-r.top)/studio.zoom}}
document.addEventListener('pointerdown',ev=>{
 const handle=ev.target.closest?.('.studio-resize-handle');
 if(handle){const node=handle.closest('.studio-el'),id=node?.dataset.id,e=page().elements.find(x=>x.id===id);if(!e||e.locked)return;const p=pointerPos(ev);resize={id,handle:handle.dataset.resize,x:p.x,y:p.y,ox:e.x,oy:e.y,ow:e.w,oh:e.h,before:studioSnapshot()};ev.preventDefault();return}
 const node=ev.target.closest?.('.studio-el');
 if(!node){if(ev.target.id==='studioCanvas'){selected.clear();renderStudio()}return}
 if(node.dataset.groupChild==='true')return;
 const id=node.dataset.id,e=page().elements.find(x=>x.id===id);if(!e||e.locked)return;
 if(ev.target.closest('.studio-text')&&ev.detail>=2){node.contentEditable='true';node.focus();return}
 if(ev.shiftKey||ev.ctrlKey||ev.metaKey){selected.has(id)?selected.delete(id):selected.add(id)}else if(!selected.has(id)){selected.clear();selected.add(id)}
 const pos=pointerPos(ev);const ids=Array.from(selected).map(s=>page().elements.find(x=>x.id===s)).filter(x=>x&&!x.locked);drag={x:pos.x,y:pos.y,items:ids.map(x=>({id:x.id,ox:x.x,oy:x.y})),before:studioSnapshot()};node.setPointerCapture?.(ev.pointerId);renderStudio();ev.preventDefault()
});
document.addEventListener('pointermove',ev=>{
 if(resize){const e=page().elements.find(x=>x.id===resize.id);if(!e)return;const p=pointerPos(ev),dx=p.x-resize.x,dy=p.y-resize.y;let nx=resize.ox,ny=resize.oy,nw=resize.ow,nh=resize.oh;if(resize.handle.includes('e'))nw=Math.max(1,resize.ow+dx);if(resize.handle.includes('s'))nh=Math.max(1,resize.oh+dy);if(resize.handle.includes('w')){nw=Math.max(1,resize.ow-dx);nx=resize.ox+dx}if(resize.handle.includes('n')){nh=Math.max(1,resize.oh-dy);ny=resize.oy+dy}const sp=snapPoint(nx,ny,[e.id]);e.x=sp.x;e.y=sp.y;e.w=Math.max(1,snap(nw));e.h=Math.max(1,snap(nh));renderStudio();return}
 if(drag){const p=pointerPos(ev),dx=p.x-drag.x,dy=p.y-drag.y;drag.items.forEach(it=>{const e=page().elements.find(x=>x.id===it.id);if(e){const sp=snapPoint(it.ox+dx,it.oy+dy,drag.items.map(z=>z.id));e.x=sp.x;e.y=sp.y}});renderStudio()}
});
document.addEventListener('pointerup',()=>{if(resize){const before=resize.before;resize=null;saveStudio();studioCommit(before);renderProps()}if(drag){const before=drag.before;drag=null;saveStudio();studioCommit(before);renderProps()}})
document.addEventListener('keydown',ev=>{
 const tag=(ev.target?.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||ev.target?.isContentEditable)return;
 if(document.getElementById('studioPanel')?.classList.contains('active')){
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='c'){ev.preventDefault();studioCopy()}
  else if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='v'){ev.preventDefault();studioPaste()}
  else if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='d'){ev.preventDefault();studioDuplicate()}
  else if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();studioDelete()}
  else if(ev.key.startsWith('Arrow')){const n=ev.shiftKey?10:1;const dx=ev.key==='ArrowLeft'?-n:ev.key==='ArrowRight'?n:0,dy=ev.key==='ArrowUp'?-n:ev.key==='ArrowDown'?n:0;studioNudgeAll(dx,dy)}
 }
});
document.addEventListener('input',ev=>{
 if(ev.target.id==='richEditor'){const e=selectedEls()[0];if(e){e.html=ev.target.innerHTML;saveStudio()}}
});

function applyReference(){const r=document.getElementById('studioRef');if(!r)return;r.style.opacity=clampNum(studio.refOpacity,0,1,0.35);r.style.backgroundImage='none';if(studio.reference?.image){r.style.backgroundImage=`url(\"${studio.reference.image.replace(/\"/g,'%22')}\")`}r.style.display=studio.reference?.image?'block':'none'}
function studioLoadImageRef(inp){const f=inp.files?.[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>3*1024*1024){showToast('Reference image must be an image under 3MB.','error');inp.value='';return}const rd=new FileReader();rd.onload=e=>{studio.reference={type:'image',image:e.target.result,pages:1};saveStudio();renderStudio()};rd.readAsDataURL(f);inp.value=''}
function studioClearReference(){studio.reference=null;saveStudio();renderStudio()}
function studioToggleCompare(){
 const c=document.getElementById('studioCanvas');let x=c.querySelector('.studio-compare');if(!x){x=document.createElement('div');x.className='studio-compare';x.innerHTML='<div class="cmp-label">Reference comparison — toggle with Compare</div><div class="cmp-ref"></div><div class="cmp-live"></div>';c.appendChild(x)}
 x.classList.toggle('show');if(x.classList.contains('show')){const ref=x.querySelector('.cmp-ref');ref.style.backgroundImage='none';if(studio.reference?.image)ref.style.backgroundImage=`url(\"${studio.reference.image.replace(/\"/g,'%22')}\")`;ref.style.opacity=studio.refOpacity;const live=x.querySelector('.cmp-live');live.innerHTML='';const clone=c.cloneNode(true);clone.querySelectorAll('.studio-ref,.studio-compare,.studio-resize-handle,.studio-rotate').forEach(q=>q.remove());clone.querySelectorAll('.selected,.multi-selected').forEach(q=>q.classList.remove('selected','multi-selected'));clone.removeAttribute('id');clone.style.transform='none';clone.style.position='absolute';clone.style.inset='0';live.appendChild(clone);live.style.opacity='.5'}}
function studioPrint(){
 const p=page(),c=document.getElementById('studioCanvas').cloneNode(true);c.querySelectorAll('.studio-ref,.studio-compare,.studio-handle,.studio-resize-handle,.studio-rotate').forEach(x=>x.remove());c.querySelectorAll('.selected,.multi-selected').forEach(x=>x.classList.remove('selected','multi-selected'));c.style.transform='none';
 const w=window.open('','_blank');if(!w)return;w.document.write(`<html><head><title>${esc(p.name)}</title><style>@page{size:${p.width}px ${p.height}px;margin:0}html,body{margin:0!important;padding:0!important;width:${p.width}px;height:${p.height}px;overflow:hidden}body{overflow:hidden}.studio-el{position:absolute;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}.studio-text{overflow:hidden;white-space:pre-wrap;word-break:break-word}.studio-image{overflow:hidden}.studio-image img{width:100%;height:100%;display:block}.studio-shape{width:100%;height:100%}.studio-table{display:grid;width:100%;height:100%;overflow:hidden}.studio-cell{display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px}.studio-line{position:absolute;height:0;transform-origin:0 0}</style></head><body>${c.outerHTML}</body></html>`);w.document.close();setTimeout(()=>{w.focus();w.print()},350)
}
function studioExportJSON(){const blob=new Blob([JSON.stringify(studio,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='page-authoring-v13.json';a.click();const href=a.href;setTimeout(()=>URL.revokeObjectURL(href),1000)}
function studioImportJSON(inp){const f=inp.files?.[0];if(!f)return;const rd=new FileReader();rd.onerror=()=>showToast('Could not read design JSON.','error');rd.onload=e=>{try{const x=JSON.parse(e.target.result);if(!x||!Array.isArray(x.pages)||!x.pages.length)throw 0;x.pages=x.pages.slice(0,200).map((p,i)=>{p=p&&typeof p==='object'?p:{};p.id=typeof p.id==='string'&&p.id? p.id:uid('pg');p.name=String(p.name||('Page '+(i+1))).slice(0,100);p.width=clampNum(p.width,100,10000,W);p.height=clampNum(p.height,100,10000,H);p.background=String(p.background||'#fff').slice(0,500);p.backgroundGradient=String(p.backgroundGradient||'').slice(0,1000);p.backgroundImage=typeof p.backgroundImage==='string'?p.backgroundImage:'';p.elements=Array.isArray(p.elements)?p.elements.filter(Boolean):[];return p});studio={...studio,...x,current:clampNum(x.current,0,x.pages.length-1,0),zoom:clampNum(x.zoom,.25,1.5,.72),grid:!!x.grid,snap:!!x.snap,gridSize:clampNum(x.gridSize,1,100,10),refOpacity:clampNum(x.refOpacity,0,1,.35),refPage:Math.max(1,Number(x.refPage)||1),margins:{...studio.margins,...(x.margins||{})}};selected.clear();saveStudio();renderStudio();showToast('Design imported.','success')}catch(_){showToast('Invalid design JSON.','error')}};rd.readAsText(f);inp.value=''}
function studioReplaceImage(inp){const f=inp.files?.[0],e=selectedEls()[0];if(!f||!e)return;if(!f.type.startsWith('image/')||f.size>3*1024*1024){showToast('Image must be an image under 3MB.','error');inp.value='';return}const rd=new FileReader();rd.onload=x=>{e.src=x.target.result;saveStudio();renderStudio()};rd.readAsDataURL(f)}
function studioUndo(){if(!studioUndoStack.length)return;studioRedoStack.push(studioSnapshot());studio=studioUndoStack.pop();selected.clear();saveStudio();renderStudio()}
function studioRedo(){if(!studioRedoStack.length)return;studioUndoStack.push(studioSnapshot());studio=studioRedoStack.pop();selected.clear();saveStudio();renderStudio()}
window.studioSetPage=studioSetPage;window.studioSetPageImage=studioSetPageImage;window.studioAdd=studioAdd;
;['studioSetPage','studioSetPageImage','studioAdd','studioDuplicate','studioGroup','studioUngroup','studioCopy','studioPaste','studioDelete','studioAlign','studioSet','studioBorder','studioTableSize','studioTableText','richCmd','studioToggleVis','studioNudgeAll','studioSetLocked','studioBring','studioAddPage','studioDuplicatePage','studioReplaceImage'].forEach(name=>{const raw=window[name];if(typeof raw!=='function')return;window[name]=function(...args){const before=studioSnapshot();const r=raw.apply(this,args);studioCommit(before);return r}});window.studioDuplicate=studioDuplicate;window.studioGroup=studioGroup;window.studioUngroup=studioUngroup;window.studioCopy=studioCopy;window.studioPaste=studioPaste;window.studioDelete=studioDelete;window.studioAlign=studioAlign;window.studioSet=studioSet;window.studioBorder=studioBorder;window.studioTableSize=studioTableSize;window.studioTableText=studioTableText;window.richCmd=richCmd;window.studioToggleVis=studioToggleVis;window.studioNudgeAll=studioNudgeAll;window.studioSetLocked=studioSetLocked;window.studioBring=studioBring;window.studioZoom=studioZoom;window.studioGoPage=studioGoPage;window.studioAddPage=studioAddPage;window.studioDuplicatePage=studioDuplicatePage;window.studioPrint=studioPrint;window.studioExportJSON=studioExportJSON;window.studioImportJSON=studioImportJSON;window.studioLoadImageRef=studioLoadImageRef;window.studioClearReference=studioClearReference;window.studioToggleCompare=studioToggleCompare;window.studioReplaceImage=studioReplaceImage;window.studioUndo=studioUndo;window.studioRedo=studioRedo;
function bootStudioWhenReady(){
 if(document.getElementById('viewPanel')) { initStudio(); return; }
 let tries=0;
 const timer=setInterval(()=>{
   tries++;
   if(document.getElementById('viewPanel')){ clearInterval(timer); initStudio(); }
   else if(tries>=100){ clearInterval(timer); console.warn('Studio initialization timed out: base app UI was not created.'); }
 },50);
}
window.addEventListener('load',bootStudioWhenReady);
})();
