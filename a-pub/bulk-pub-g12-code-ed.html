    ];

    let codeInsertMenuEl = null;
    let codeInsertCtx = null; // { inner, page, clientX, clientY }

    function closeCodeInsertMenu() {
      if (codeInsertMenuEl) {
        codeInsertMenuEl.remove();
        codeInsertMenuEl = null;
      }
      codeInsertCtx = null;
    }

    function isCodePageEmptyClick(target, inner, clientX, clientY) {
      if (!inner || !target) return false;
      // Never treat interactive controls as empty space
      if (target.closest && target.closest('button, a, input, textarea, select, .page-actions, .view-img-box, [data-view-img]')) {
        return false;
      }
      // Click directly on the editable surface (padding / empty area)
      if (target === inner) return true;
      // Click on content-area chrome around inner (not header/actions)
      if (target.classList && target.classList.contains('code-content-area')) return true;
      if (!inner.contains(target) && !(target.classList && target.classList.contains('code-content-area'))) {
        return false;
      }
      // Fully empty body
      const text = (inner.textContent || '').replace(/\u00a0/g, ' ').trim();
      const meaningful = inner.querySelector('img, table, ul, ol, h1, h2, h3, h4, p, li, .word-grid, .act-box, .cvc-intro-box, .cvc-instruction-box, .custom-text-box, .writing-lines-area, .view-img-box');
      if (!text && !meaningful) return true;
      // Click landed in the inner's box but not inside any child's bounding box
      // (true empty gap between/below blocks)
      if (typeof clientX === 'number' && typeof clientY === 'number') {
        const children = [...inner.children];
        const overChild = children.some(ch => {
          const r = ch.getBoundingClientRect();
          return clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom;
        });
        if (!overChild && (target === inner || inner.contains(target))) return true;
      }
      // Empty placeholder paragraph / div
      if ((target.tagName === 'P' || target.tagName === 'DIV') && target !== inner) {
        const t = (target.textContent || '').replace(/\u00a0/g, ' ').trim();
        const hasKids = target.querySelector('img, table, ul, ol, .word-grid, .act-box, .view-img-box');
        if (!t && !hasKids) return true;
      }
      return false;
    }

    function placeCaretInElement(el) {
      if (!el) return;
      try {
        const range = document.createRange();
        const sel = window.getSelection();
        // Prefer first text-ish child
        const focus =
          el.querySelector('p, h1, h2, h3, h4, li, .act-title, .sentence') || el;
        if (focus.childNodes.length) {
          range.selectNodeContents(focus);
          range.collapse(true);
        } else {
          range.setStart(focus, 0);
          range.collapse(true);
        }
        sel.removeAllRanges();
        sel.addRange(range);
        focus.focus?.();
      } catch (_) {}
    }

    function insertHtmlIntoCodeInner(inner, html) {
      if (!inner || !html) return null;
      inner.focus();
      let inserted = null;
      try {
        const sel = window.getSelection();
        if (sel && sel.rangeCount > 0) {
          const range = sel.getRangeAt(0);
          if (inner.contains(range.commonAncestorContainer) || range.commonAncestorContainer === inner) {
            range.collapse(false);
            const temp = document.createElement('div');
            temp.innerHTML = html;
            const frag = document.createDocumentFragment();
            let node;
            let last = null;
            while ((node = temp.firstChild)) {
              last = frag.appendChild(node);
            }
            range.insertNode(frag);
            inserted = last;
            if (last) {
              range.setStartAfter(last);
              range.collapse(true);
              sel.removeAllRanges();
              sel.addRange(range);
            }
          }
        }
      } catch (_) {}
      if (!inserted) {
        const temp = document.createElement('div');
        temp.innerHTML = html;
        while (temp.firstChild) {
          inserted = inner.appendChild(temp.firstChild);
        }
      }
      return inserted;
    }

    function openCodeInsertMenu(ctx) {
      closeCodeInsertMenu();
      if (!viewTextEditing || !ctx || !ctx.inner) return;
      codeInsertCtx = ctx;

      const menu = document.createElement('div');
      menu.className = 'code-insert-menu no-print';
      menu.setAttribute('role', 'menu');
      let html = '<div class="cim-title">Insert element</div>';
      CODE_INSERT_BLOCKS.forEach(item => {
        if (item.sep) {
          html += '<div class="cim-sep"></div>';
          return;
        }
        html += `<button type="button" class="cim-item" role="menuitem" data-insert-id="${item.id}"><span class="cim-ico">${item.icon}</span><span>${item.label}</span></button>`;
      });
      menu.innerHTML = html;
      document.body.appendChild(menu);
      codeInsertMenuEl = menu;

      // Position near click, keep on-screen
      const pad = 8;
      const rect = menu.getBoundingClientRect();
      let left = ctx.clientX;
      let top = ctx.clientY;
      if (left + rect.width > window.innerWidth - pad) left = window.innerWidth - rect.width - pad;
      if (top + rect.height > window.innerHeight - pad) top = window.innerHeight - rect.height - pad;
      if (left < pad) left = pad;
      if (top < pad) top = pad;
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';

      menu.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-insert-id]');
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        applyCodeInsert(btn.getAttribute('data-insert-id'));
      });

      // Close on outside click / escape (next tick so this opening click doesn't close it)
      setTimeout(() => {
        const onDoc = (ev) => {
          if (codeInsertMenuEl && !codeInsertMenuEl.contains(ev.target)) {
            closeCodeInsertMenu();
            document.removeEventListener('mousedown', onDoc, true);
            document.removeEventListener('keydown', onKey, true);
          }
        };
        const onKey = (ev) => {
          if (ev.key === 'Escape') {
            closeCodeInsertMenu();
            document.removeEventListener('mousedown', onDoc, true);
            document.removeEventListener('keydown', onKey, true);
          }
        };
        document.addEventListener('mousedown', onDoc, true);
        document.addEventListener('keydown', onKey, true);
      }, 0);
    }

    function applyCodeInsert(insertId) {
      const ctx = codeInsertCtx;
      closeCodeInsertMenu();
      if (!ctx || !ctx.inner) return;
      const block = CODE_INSERT_BLOCKS.find(b => b.id === insertId);
      if (!block) return;

      if (block.id === 'image') {
        // Reuse image insert dialog; ensure selection is in this code-inner
        try {
          ctx.inner.focus();
          const sel = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(ctx.inner);
          range.collapse(false);
          sel.removeAllRanges();
          sel.addRange(range);
        } catch (_) {}
        openViewImageDialog({ mode: 'insert' });
        return;
      }

      const before = currentState();
      const inserted = insertHtmlIntoCodeInner(ctx.inner, block.html);
      commitViewEdit(ctx.inner);
      // commitViewEdit already records history when content changes; avoid double if unchanged
      if (inserted) placeCaretInElement(inserted);
      showToast(`Inserted ${block.label}.`, 'success');
      // Soft re-render not required — DOM already updated; page.html synced via commitViewEdit
      void before;
    }

    const IMAGE_BORDER_PRESETS = {
      none: { label: 'No border', css: 'border:none;border-radius:0;' },
      thin: { label: 'Thin solid', css: 'border:2px solid #1a1a1a;border-radius:0;' },
      thick: { label: 'Thick solid', css: 'border:4px solid #1a1a1a;border-radius:0;' },
      dashed: { label: 'Dashed', css: 'border:2px dashed #E2571C;border-radius:0;' },
      rounded: { label: 'Rounded frame', css: 'border:3px solid #F5A623;border-radius:12px;' }
    };

    function imageBorderCss(key) {
      return (IMAGE_BORDER_PRESETS[key] || IMAGE_BORDER_PRESETS.none).css;
    }

    let imageDialogCtx = null;
    let savedImageRange = null;

    function saveSelectionRange() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        const r = sel.getRangeAt(0);
        const node = r.commonAncestorContainer;
        const el = node.nodeType === 1 ? node : node.parentElement;
        if (el && el.closest && el.closest('#viewContainer [contenteditable="true"]')) {
          savedImageRange = r.cloneRange();
          return;
        }
      }
      savedImageRange = null;
    }

    function buildViewImgHtml(src, width, height, borderKey, fit) {
      const w = Math.max(40, Math.min(800, Number(width) || 200));
      const h = Math.max(40, Math.min(800, Number(height) || 150));
      const border = imageBorderCss(borderKey || 'none');
      const objFit = fit === 'cover' ? 'cover' : 'contain';
      const inner = src
        ? `<img src="${src}" alt="" style="width:100%;height:100%;object-fit:${objFit};display:block;" />`
        : `<span class="view-img-ph">🖼️</span>`;
      return `<span class="view-img-box" contenteditable="false" style="width:${w}px;height:${h}px;${border}">${inner}</span>`;
    }

    function closeImageDialog() {
      document.querySelectorAll('.img-dialog-overlay').forEach(el => el.remove());
      imageDialogCtx = null;
    }

    function openViewImageDialog(ctx) {
      if (!viewTextEditing) {
        showToast('Turn on Edit text first.', 'warning');
        return;
      }
      closeImageDialog();
      imageDialogCtx = ctx || { mode: 'insert' };
      if (imageDialogCtx.mode === 'insert') saveSelectionRange();

      const defaults = {
        width: imageDialogCtx.width || 200,
        height: imageDialogCtx.height || 150,
        border: imageDialogCtx.border || 'none',
        fit: imageDialogCtx.fit || 'contain',
        src: imageDialogCtx.src || ''
      };

      const borderOpts = Object.keys(IMAGE_BORDER_PRESETS).map(k =>
        `<option value="${k}" ${defaults.border === k ? 'selected' : ''}>${IMAGE_BORDER_PRESETS[k].label}</option>`
      ).join('');

      const overlay = document.createElement('div');
      overlay.className = 'img-dialog-overlay';
      overlay.innerHTML = `
        <div class="img-dialog">
          <h3>🖼️ ${imageDialogCtx.mode === 'insert' ? 'Insert image' : 'Edit image'}</h3>
          <div class="preview" id="imgDlgPreview">${defaults.src ? `<img src="${defaults.src}" alt="">` : '<span style="color:#6c757d">No image yet</span>'}</div>
          <div class="row">
            <label>Width (px)<input type="number" id="imgDlgW" min="40" max="800" value="${defaults.width}"></label>
            <label>Height (px)<input type="number" id="imgDlgH" min="40" max="800" value="${defaults.height}"></label>
          </div>
          <div class="row">
            <label>Border
              <select id="imgDlgBorder">${borderOpts}</select>
            </label>
            <label>Fit
              <select id="imgDlgFit">
                <option value="contain" ${defaults.fit === 'contain' ? 'selected' : ''}>Contain</option>
                <option value="cover" ${defaults.fit === 'cover' ? 'selected' : ''}>Cover</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label style="flex:1 1 100%">Image file
              <input type="file" id="imgDlgFile" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml">
            </label>
          </div>
          <div class="actions">
            ${imageDialogCtx.mode !== 'insert' ? '<button type="button" class="btn btn-danger btn-sm" id="imgDlgRemove">Remove</button>' : ''}
            <button type="button" class="btn btn-outline btn-sm" id="imgDlgCancel">Cancel</button>
            <button type="button" class="btn btn-primary btn-sm" id="imgDlgApply">Apply</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      let pendingSrc = defaults.src || '';
      const preview = overlay.querySelector('#imgDlgPreview');
      const fileInput = overlay.querySelector('#imgDlgFile');
      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          showToast('Please choose an image file.', 'error');
          fileInput.value = '';
          return;
        }
        if (file.size > 2 * 1024 * 1024) {
          showToast('Image must be under 2 MB.', 'error');
          fileInput.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          pendingSrc = ev.target.result;
          preview.innerHTML = `<img src="${pendingSrc}" alt="">`;
        };
        reader.onerror = () => showToast('Could not read image.', 'error');
        reader.readAsDataURL(file);
      });

      overlay.querySelector('#imgDlgCancel').onclick = () => closeImageDialog();
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeImageDialog(); });
      const removeBtn = overlay.querySelector('#imgDlgRemove');
      if (removeBtn) {
        removeBtn.onclick = () => {
          applyImageDialog({ remove: true, src: '' });
        };
      }
      overlay.querySelector('#imgDlgApply').onclick = () => {
        const width = parseInt(overlay.querySelector('#imgDlgW').value, 10) || 200;
        const height = parseInt(overlay.querySelector('#imgDlgH').value, 10) || 150;
        const border = overlay.querySelector('#imgDlgBorder').value || 'none';
        const fit = overlay.querySelector('#imgDlgFit').value || 'contain';
        if (!pendingSrc && imageDialogCtx.mode === 'insert') {
          showToast('Upload an image first.', 'warning');
          return;
        }
        applyImageDialog({ src: pendingSrc, width, height, border, fit, remove: false });
      };
    }

    function applyImageDialog(opts) {
      const ctx = imageDialogCtx;
      if (!ctx) return;
      const before = currentState();

      if (ctx.mode === 'tile') {
        const { page, section } = ctx;
        if (!page || !section) { closeImageDialog(); return; }
        if (opts.remove) {
          section.imagePath = '';
          section.tileMode = 'letter';
        } else {
          section.tileMode = 'image';
          if (opts.src) section.imagePath = opts.src;
          section.imageWidth = opts.width;
          section.imageHeight = opts.height;
          section.imageBorder = opts.border;
          section.imageFit = opts.fit;
        }
        recordHistory(before, currentState());
        persistState();
        closeImageDialog();
        renderAllView();
        showToast(opts.remove ? 'Tile image removed.' : 'Tile image updated.', 'success');
        return;
      }

      function commitHostFromEl(startEl) {
        if (!startEl) return false;
        const host = startEl.closest ? (startEl.closest('[data-edit]') || startEl.closest('.code-inner')) : null;
        if (!host) return false;
        commitViewEdit(host);
        return true;
      }

      // inline edit existing box in rich text / code HTML
      if (ctx.mode === 'edit-inline' && ctx.boxEl) {
        const box = ctx.boxEl;
        const hostHint = ctx.editableEl || box.parentElement;
        if (opts.remove) {
          box.remove();
        } else {
          const html = buildViewImgHtml(opts.src || ctx.src || '', opts.width, opts.height, opts.border, opts.fit);
          const tmp = document.createElement('div');
          tmp.innerHTML = html;
          const next = tmp.firstChild;
          box.replaceWith(next);
        }
        commitHostFromEl(hostHint);
        closeImageDialog();
        renderAllView();
        showToast(opts.remove ? 'Image removed.' : 'Image updated.', 'success');
        return;
      }

      // insert new into rich text or code body
      const html = buildViewImgHtml(opts.src, opts.width, opts.height, opts.border, opts.fit);
      let host = null;
      let inserted = false;
      if (savedImageRange) {
        try {
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(savedImageRange);
          const node = savedImageRange.commonAncestorContainer;
          host = (node.nodeType === 1 ? node : node.parentElement);
          document.execCommand('insertHTML', false, html);
          inserted = true;
        } catch (_) {}
      }
      if (!inserted) {
        const active = document.activeElement && document.activeElement.closest
          ? document.activeElement.closest('#viewContainer [contenteditable="true"]')
          : null;
        const candidates = active ? [active] : [...document.querySelectorAll('#viewContainer [data-edit="rich"], #viewContainer [data-edit="html"], #viewContainer .code-inner[contenteditable="true"]')];
        for (const el of candidates) {
          if (!el) continue;
          if (!(el.getAttribute('data-edit') === 'rich' || el.getAttribute('data-edit') === 'html' || el.classList.contains('code-inner'))) continue;
          el.focus();
          host = el;
          try {
            document.execCommand('insertHTML', false, html);
            inserted = true;
          } catch (_) {
            el.insertAdjacentHTML('beforeend', html);
            inserted = true;
          }
          if (inserted) break;
        }
      }
      if (!inserted) {
        showToast('Click inside intro/custom text or a code page body first, then insert image.', 'warning');
        closeImageDialog();
        return;
      }
      commitHostFromEl(host || document.activeElement);
      closeImageDialog();
      renderAllView();
      showToast('Image inserted.', 'success');
    }

    window.openImageInsertDialog = function () {
      if (!viewTextEditing) {
        showToast('Turn on Edit text first.', 'warning');
        return;
      }
      openViewImageDialog({ mode: 'insert' });
    };

    window.rteCommand = function (cmd) {
      if (!viewTextEditing) return;
      if (cmd === 'image') {
        openImageInsertDialog();
        return;
      }
      if (cmd === 'highlight') {
        document.execCommand('hiliteColor', false, '#fff3bf');
        document.execCommand('foreColor', false, '#E2571C');
      } else {
        document.execCommand(cmd, false, null);
      }
    };

    function buildCodePage(page, pageNum) {
      const div = document.createElement('div');
      div.className = 'page';
      if (page && page.id) div.setAttribute('data-page-id', page.id);
      const editBtn = page && page.id
        ? `<button class="edit-page-btn" onclick="editPage('${page.id}')">✏️ Edit</button>`
        : '';
      div.innerHTML = `<div class="page-actions no-print">${editBtn}<button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div>`;

      const card = document.createElement('div');
      card.className = 'card';

      // Same header as structured pages
      card.innerHTML = `
        <div class="cvc-header">
          <div class="cvc-header-left">
            <h1 class="cvc-main-title" data-edit="plain" data-field="mainTitle">${escapeHtml(page.mainTitle || 'CVC WORDS')}</h1>
            <div class="cvc-subtitle" data-edit="plain" data-field="subtitle">${escapeHtml(page.subtitle || 'SHORT VOWEL')}</div>
          </div>
          <div class="cvc-header-right">
            <span class="lesson-label">LESSON</span>
            <span class="lesson-num">${pageNum}</span>
          </div>
        </div>`;

      // Content area with user background — fills remaining card below header
      const contentArea = document.createElement('div');
      contentArea.className = 'code-content-area';
      contentArea.style.background = page.contentBackground || '#ffffff';

      const scopeClass = 'scope-' + String(page.id || 'preview').replace(/[^a-zA-Z0-9]/g, '');
      contentArea.classList.add(scopeClass);

      // More robust CSS scoping (handles basic rules; ignores @rules that break simple split)
      const rawCSS = sanitizeCSS(page.css || '');
      let scopedCSS = '';
      try {
        // Split on } but keep simple rules intact
        const chunks = rawCSS.split('}');
        for (let i = 0; i < chunks.length; i++) {
          const chunk = chunks[i].trim();
          if (!chunk) continue;
          const brace = chunk.indexOf('{');
          if (brace === -1) {
            // leftover or @rule without block — skip dangerous, keep safe at-rules lightly
            if (chunk.startsWith('@')) scopedCSS += chunk + '}';
            continue;
          }
          const selectors = chunk.slice(0, brace).trim();
          const body = chunk.slice(brace + 1).trim();
          if (!selectors) continue;
          const scopedSelectors = selectors.split(',').map(s => {
            s = s.trim();
            if (!s) return s;
            // Don't double-scope if already has the class
            if (s.includes('.' + scopeClass)) return s;
            return `.${scopeClass} ${s}`;
          }).filter(Boolean).join(', ');
          scopedCSS += `${scopedSelectors} { ${body} }\n`;
        }
      } catch (e) {
        scopedCSS = rawCSS;
      }

      const style = document.createElement('style');
      style.textContent = scopedCSS;

      const inner = document.createElement('div');
      inner.className = 'code-inner';
      inner.setAttribute('data-edit', 'html');
      inner.setAttribute('data-field', 'html');
      inner.innerHTML = sanitizeHTML(page.html || '');

      contentArea.append(style, inner);
      card.appendChild(contentArea);

      const pn = document.createElement('div');
      pn.className = 'cvc-page-number';
      pn.textContent = pageNum;
      card.appendChild(pn);

      div.appendChild(card);
      return div;
    }

    // ========== EXPORT ==========
    window.exportSinglePage = function (pageEl) {
      const cloneEl = pageEl.cloneNode(true);
      cloneEl.querySelector('.page-actions')?.remove();
      cloneEl.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
      // Ensure no trailing break on a single page
      cloneEl.style.pageBreakAfter = 'auto';
      const win = window.open('', '_blank');
      if (!win) return showToast('Popup blocked. Allow pop-ups to export/print.', 'warning');
      const styleEl = document.querySelector('style');
      if (!styleEl) return showToast('Export styles unavailable.', 'error');
      const extra = `<style>
        html, body { margin:0; padding:0; background:#fff; }
        .view-container .page { page-break-after: auto !important; margin: 0 auto !important; }
        .page-actions { display: none !important; }
      </style>`;
      win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Export</title>${styleEl.outerHTML}${extra}</head>
        <body style="padding:0;background:#fff;margin:0;display:flex;justify-content:center;">
          <div class="view-container" style="overflow:visible;display:flex;flex-direction:column;align-items:center;">
            ${cloneEl.outerHTML}
          </div>
        </body></html>`);
      win.document.close();
      const doPrint = () => { try { win.focus(); win.print(); } catch (_) {} };
      win.onload = doPrint;
      setTimeout(doPrint, 450);
    };

    window.exportAllPages = function () {
      if (!pages.length && !sightWords.length) return showToast('No pages to print.', 'warning');
      const container = document.querySelector('.view-container');
      if (!container) return;
      const cloneEl = container.cloneNode(true);
      cloneEl.querySelectorAll('.page-actions').forEach(el => el.remove());
      cloneEl.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
      cloneEl.querySelectorAll('.rte-bar').forEach(el => el.remove());
      // Last page must not force a break
      const pageNodes = cloneEl.querySelectorAll('.page');
      if (pageNodes.length) {
        pageNodes[pageNodes.length - 1].style.pageBreakAfter = 'auto';
      }
      const win = window.open('', '_blank');
      if (!win) return showToast('Popup blocked. Allow pop-ups to print.', 'warning');
      const styleEl = document.querySelector('style');
      if (!styleEl) return showToast('Export styles unavailable.', 'error');
      const extra = `<style>
        html, body { margin:0; padding:0; background:#fff; }
        .view-container .page:last-child { page-break-after: auto !important; }
        .page-actions { display: none !important; }
      </style>`;
      win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>All Pages</title>${styleEl.outerHTML}${extra}</head>
        <body style="padding:0;background:#fff;margin:0;">
          <div class="view-container" style="overflow:visible;display:block;">${cloneEl.innerHTML}</div>
        </body></html>`);
      win.document.close();
      const doPrint = () => { try { win.focus(); win.print(); } catch (_) {} };
      win.onload = doPrint;
      setTimeout(doPrint, 450);
    };

    // ========== VIEW ==========
    function renderAllView() {
      closeCodeInsertMenu();
      const container = document.getElementById('viewContainer');
      if (!container) return;
      container.innerHTML = '';
      container.appendChild(buildCoverPage());

      if (!pages.length && !sightWords.length) return;

      const swPages = Math.ceil(sightWords.length / MAX_SIGHT_WORDS_PER_PAGE) || 0;
      const tocPages = (includeToc && pages.length) ? Math.ceil(pages.length / MAX_TOC_PER_PAGE) : 0;
      const lessonStart = tocPages + swPages + 2;
      let running = lessonStart;

      const tocEntries = pages.map((p, idx) => {
        const e = {
          order: idx + 1,
          name: p.name || p.mainTitle || (p.type === 'structured' ? 'Untitled' : 'Code Page'),
          firstPage: running
        };
        running += 1;
        return e;
      });

      if (includeToc) {
        for (let p = 0; p < tocPages; p++) {
          container.appendChild(buildTocPage(p + 1, tocEntries.slice(p * MAX_TOC_PER_PAGE, (p + 1) * MAX_TOC_PER_PAGE)));
        }
      }

      let pageNum = tocPages + 2;
      for (let p = 0; p < swPages; p++) {
        container.appendChild(buildSightWordsPage(pageNum++, sightWords.slice(p * MAX_SIGHT_WORDS_PER_PAGE, (p + 1) * MAX_SIGHT_WORDS_PER_PAGE)));
      }

      pageNum = lessonStart;
      pages.forEach(p => {
        if (p.type === 'structured') container.appendChild(buildStructuredPage(p, pageNum));
        else container.appendChild(buildCodePage(p, pageNum));
        pageNum++;
      });
      applyViewEditing();
    }

    // ========== EDIT FORM ==========
    function markDirty() { formDirty = true; }
    function clearDirty() { formDirty = false; }

    window.addEventListener('beforeunload', (e) => {
      if (formDirty) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    document.addEventListener('input', (e) => {
      if (e.target.closest('#editPanel')) markDirty();
    });

    function renderSectionsBuilder() {
      const container = document.getElementById('sectionsContainer');
      if (!container) return;
      if (!tempSections.length) {
        container.innerHTML = '<div style="color:#6c757d;font-size:12px;padding:8px 0;">No sections added.</div>';
        return;
      }
      let html = '';
      tempSections.forEach((section, idx) => {
        const typeInfo = SECTION_TYPES[section.type] || { label: section.type };
        html += `
          <div class="section-builder-item" data-id="${section.id}">
            <div class="sb-header">
              <span class="sb-title">${escapeHtml(typeInfo.label)}</span>
              <select onchange="updateSectionWidth('${section.id}', this.value)">
                <option value="full" ${section.width === 'full' ? 'selected' : ''}>Full</option>
                <option value="half" ${section.width === 'half' ? 'selected' : ''}>Half</option>
                <option value="quarter" ${section.width === 'quarter' ? 'selected' : ''}>Quarter</option>
                <option value="threequarter" ${section.width === 'threequarter' ? 'selected' : ''}>3/4</option>
              </select>
              <div class="sb-actions">
                <button class="btn btn-outline btn-xs" onclick="moveSection('${section.id}', -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
                <button class="btn btn-outline btn-xs" onclick="moveSection('${section.id}', 1)" ${idx === tempSections.length - 1 ? 'disabled' : ''}>▼</button>
                <button class="btn btn-danger btn-xs" onclick="deleteSection('${section.id}')">🗑️</button>
              </div>
            </div>
            <div class="sb-body">${renderSectionFields(section)}</div>
          </div>`;
      });
      container.innerHTML = html;
    }

    function renderSectionFields(section) {
      switch (section.type) {
        case 'tile':
          return `
            <select onchange="updateSectionData('${section.id}', 'tileMode', this.value)">
              <option value="letter" ${section.tileMode === 'letter' ? 'selected' : ''}>Letter</option>
              <option value="image" ${section.tileMode === 'image' ? 'selected' : ''}>Image</option>
            </select>
            <div class="form-group"><label>Letter Tile</label>
              <input value="${escapeHtml(section.letterTile || '')}" onchange="updateSectionData('${section.id}', 'letterTile', this.value)">
            </div>
            <div class="form-group"><label>Font size (px)</label>
              <input type="number" value="${section.letterFontSize || 56}" min="24" max="96"
                onchange="updateSectionData('${section.id}', 'letterFontSize', this.value)">
            </div>
            <div class="form-group"><label>Caption (image mode)</label>
              <input value="${escapeHtml(section.imageCaption || "TODAY'S SOUND")}"
                onchange="updateSectionData('${section.id}', 'imageCaption', this.value)">
            </div>
            <div class="form-group"><label>Image Path / URL</label>
              <input value="${escapeHtml(section.imagePath || '')}"
                onchange="updateSectionData('${section.id}', 'imagePath', this.value)">
            </div>
            <div class="form-group"><label>Upload Image</label>
              <input type="file" accept="image/*" onchange="handleTileImageUpload(this, '${section.id}')">
            </div>`;
        case 'introText':
        case 'instruction':
        case 'customText':
          return `<textarea rows="3" oninput="updateSectionData('${section.id}', 'text', this.value)">${escapeHtml(section.text || '')}</textarea>`;
        case 'wordGrid':
          return `
            <div style="display:flex;gap:10px;">
              <div class="form-group" style="flex:1"><label>Columns</label>
                <input type="number" value="${section.columns || 4}" min="1" max="8"
                  onchange="updateSectionData('${section.id}', 'columns', parseInt(this.value,10)||4)">
              </div>
              <div class="form-group" style="flex:1"><label>Rows</label>
                <input type="number" value="${section.rows || 3}" min="1" max="12"
                  onchange="updateSectionData('${section.id}', 'rows', parseInt(this.value,10)||3)">
              </div>
            </div>
            <textarea rows="3" placeholder="Comma-separated words"
              oninput="updateSectionData('${section.id}', 'words', this.value.split(',').map(s=>s.trim()).filter(Boolean))">${(section.words || []).join(', ')}</textarea>`;
        case 'decodable':
          return `
            <input value="${escapeHtml(section.instruction || '')}"
              onchange="updateSectionData('${section.id}', 'instruction', this.value)">
            <textarea rows="3" placeholder="Sentences, comma-separated"
              oninput="updateSectionData('${section.id}', 'sentences', this.value.split(',').map(s=>s.trim()).filter(Boolean))">${(section.sentences || []).join(', ')}</textarea>`;
        case 'fillBlanks':
          return `
            <input value="${escapeHtml(section.title || '')}"
              onchange="updateSectionData('${section.id}', 'title', this.value)">
            <textarea rows="3" placeholder="Items, comma-separated (use _ for blank)"
              oninput="updateSectionData('${section.id}', 'items', this.value.split(',').map(s=>s.trim()).filter(Boolean))">${(section.items || []).join(', ')}</textarea>`;
        case 'sentenceWriting':
          return `
            <input value="${escapeHtml(section.title || '')}"
              onchange="updateSectionData('${section.id}', 'title', this.value)">
            <input type="number" value="${section.lines || 2}" min="1" max="8"
              onchange="updateSectionData('${section.id}', 'lines', parseInt(this.value,10)||2)">`;
        case 'writingLines':
          return `<label><input type="checkbox" ${section.fillRemaining ? 'checked' : ''}
            onchange="updateSectionData('${section.id}', 'fillRemaining', this.checked)"> Fill remaining height</label>`;
        default:
          return '';
      }
    }

    window.handleTileImageUpload = function (input, sectionId) {
      const file = input.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Please select an image file.', 'error');
        return;
      }
      if (file.size > 2 * 1024 * 1024) {
        showToast('Image must be under 2 MB.', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        const section = tempSections.find(s => s.id === sectionId);
        if (section) {
          section.tileMode = 'image';
          section.imagePath = ev.target.result;
          renderSectionsBuilder();
          renderThumbnail();
          showToast('Image uploaded.', 'success');
        }
      };
      reader.readAsDataURL(file);
      input.value = '';
    };

    window.addSection = function (type) {
      if (tempSections.length >= MAX_SECTIONS) {
        showToast(`Maximum ${MAX_SECTIONS} sections per page.`, 'warning');
        return;
      }
      tempSections.push(createDefaultSection(type));
      renderSectionsBuilder();
      renderThumbnail();
      markDirty();
    };

    window.deleteSection = function (id) {
      tempSections = tempSections.filter(s => s.id !== id);
      renderSectionsBuilder();
      renderThumbnail();
      markDirty();
    };

    window.moveSection = function (id, dir) {
      const idx = tempSections.findIndex(s => s.id === id);
      if (idx < 0) return;
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= tempSections.length) return;
      const tmp = tempSections[idx];
      tempSections[idx] = tempSections[newIdx];
      tempSections[newIdx] = tmp;
      renderSectionsBuilder();
      renderThumbnail();
      markDirty();
    };

    window.updateSectionWidth = function (id, width) {
      const section = tempSections.find(s => s.id === id);
      if (section) {
        section.width = width;
        renderThumbnail();
        markDirty();
      }
    };

    window.updateSectionData = function (id, field, value) {
      const section = tempSections.find(s => s.id === id);
      if (!section) return;
      section[field] = value;
      if (field === 'lines' || field === 'columns' || field === 'rows' || field === 'letterFontSize') {
        section[field] = Number(value) || section[field];
      }
      renderThumbnail();
      markDirty();
    };

    function renderThumbnail() {
      const container = document.getElementById('thumbnailContainer');
      if (!container) return;

      const pageType = document.getElementById('pageTypeSelect')?.value || tempPageType || 'structured';
      let pageEl;

      try {
        if (pageType === 'structured') {
          const tempPage = {
            type: 'structured',
            mainTitle: document.getElementById('fMainTitle')?.value || 'Untitled',
            subtitle: document.getElementById('fSubtitle')?.value || 'SHORT VOWEL',
            sections: clone(tempSections)
          };
          pageEl = buildStructuredPage(tempPage, 1);
        } else {
          const tempPage = {
            type: 'code',
            id: 'preview',
            mainTitle: document.getElementById('fMainTitle')?.value || 'Untitled',
            subtitle: document.getElementById('fSubtitle')?.value || 'SHORT VOWEL',
            html: document.getElementById('codeHTML')?.value || '',
            css: document.getElementById('codeCSS')?.value || '',
            contentBackground: document.getElementById('codeBg')?.value || '#ffffff'
          };
          pageEl = buildCodePage(tempPage, 1);
        }
      } catch (err) {
        console.error('Thumbnail build error:', err);
        container.innerHTML = '<div style="padding:20px;color:#dc3545;font-size:13px;">Preview error</div>';
        return;
      }

      pageEl.querySelector('.page-actions')?.remove();
      // Apply thumbnail transform styles
      Object.assign(pageEl.style, {
        transform: 'scale(0.4)',
        transformOrigin: 'top left',
        position: 'absolute',
        top: '0',
        left: '0',
        width: PAGE_W + 'px',
        minWidth: PAGE_W + 'px',
        minHeight: PAGE_H + 'px',
        height: PAGE_H + 'px',
        maxHeight: PAGE_H + 'px',
        padding: '16px 22px',
        margin: '0',
        borderRadius: '0',
        boxShadow: 'none',
        pageBreakAfter: 'auto',
        overflow: 'hidden'
      });

      // Clear and append (forces fresh DOM + styles)
      container.innerHTML = '';
      container.appendChild(pageEl);

      // Force a reflow so scoped <style> tags inside code pages apply immediately
      void container.offsetHeight;
    }

    // Expose for inline oninput / onchange handlers in the form HTML
    window.renderThumbnail = renderThumbnail;

    function fillForm(page) {
      document.getElementById('pageTypeSelect').value = page.type;
      tempPageType = page.type;
      toggleEditorFields();
      document.getElementById('fPageName').value = page.name || '';
      document.getElementById('fMainTitle').value = page.mainTitle || 'SHORT VOWEL CVC WORDS';
      document.getElementById('fSubtitle').value = page.subtitle || 'SHORT VOWEL';

        tempSections = clone(page.sections || []);

        document.getElementById('codeHTML').value = page.html || '';
        document.getElementById('codeCSS').value = page.css || '';
        document.getElementById('codeBg').value = page.contentBackground || '#ffffff';

      toggleEditorFields();

      renderThumbnail();
      document.getElementById('saveBtn').textContent = '💾 Save Page';
      document.getElementById('cancelBtn').style.display = 'none';
      clearDirty();
    }

    function toggleEditorFields() {
      const structured = document.getElementById('structuredFields');
      const code = document.getElementById('codeFields');
      if (tempPageType === 'structured') {
        structured.style.display = 'block';
        code.style.display = 'none';
      } else {
        structured.style.display = 'none';
        code.style.display = 'block';
      }
    }

    window.setPageType = function (val) {
      tempPageType = val;
      toggleEditorFields();
      renderThumbnail();
      markDirty();
    };

    window.editPage = function (id) {
      if (formDirty && !confirm('You have unsaved changes. Discard them?')) return;
      const page = pages.find(p => p.id === id);
      if (!page) return showToast('Page not found.', 'error');
      editingPageId = id;
      document.getElementById('formTitle').textContent = '✏️ Edit Page';
      fillForm(page);
      document.getElementById('saveBtn').textContent = '💾 Update Page';
      document.getElementById('cancelBtn').style.display = 'inline-block';
      clearDirty();
      switchTab('edit');
      updateHistoryUI();
    };

    window.cancelEdit = function () {
      if (formDirty && !confirm('Discard unsaved changes?')) return;
      resetForm();
      switchTab('view');
      showToast('Edit cancelled.', 'info');
    };

    /** Build a page object from the current Edit form fields (does not mutate state). */
    function buildPageFromForm() {
      const pageType = document.getElementById('pageTypeSelect')?.value || tempPageType || 'structured';
      const name = (document.getElementById('fPageName')?.value || '').trim() || 'Page';
      if (pageType === 'structured') {
        return {
          id: editingPageId || generateId('p'),
          type: 'structured',
          name,
          mainTitle: (document.getElementById('fMainTitle')?.value || '').trim() || 'Untitled',
          subtitle: (document.getElementById('fSubtitle')?.value || '').trim() || 'SHORT VOWEL',
          sections: clone(tempSections)
        };
      }
      return {
        id: editingPageId || generateId('p'),
        type: 'code',
        name,
        mainTitle: (document.getElementById('fMainTitle')?.value || '').trim() || 'Untitled',
        subtitle: (document.getElementById('fSubtitle')?.value || '').trim() || 'SHORT VOWEL',
        html: document.getElementById('codeHTML')?.value || '',
        css: document.getElementById('codeCSS')?.value || '',
        contentBackground: document.getElementById('codeBg')?.value || '#ffffff'
      };
    }

    /**
     * Apply current form into the pages array (update existing or insert new).
     * Returns { pageId, didChange, isNew } or null on hard failure (e.g. max pages).
     */
    function applyFormToPages() {
      if (pages.length >= MAX_PAGES && !editingPageId) {
        showToast(`Maximum ${MAX_PAGES} pages reached.`, 'error');
        return null;
      }
      const newPage = buildPageFromForm();
      const before = currentState();
      let isNew = false;
      if (editingPageId) {
        const idx = pages.findIndex(p => p.id === editingPageId);
        if (idx !== -1) {
          // Keep stable id
          newPage.id = editingPageId;
          pages[idx] = newPage;
        } else {
          // Editing id vanished (deleted elsewhere) — treat as new insert
          newPage.id = generateId('p');
          pages.push(newPage);
          isNew = true;
          editingPageId = newPage.id;
        }
      } else {
        pages.push(newPage);
        isNew = true;
        editingPageId = newPage.id;
      }
      // Keep form linked to the saved page
      const nameInput = document.getElementById('fPageName');
      if (nameInput && !(nameInput.value || '').trim()) nameInput.value = newPage.name || '';
      const after = currentState();
      const didChange = stateKey(before) !== stateKey(after);
      if (didChange) {
        recordHistory(before, after);
        persistState();
      }
      clearDirty();
      return { pageId: newPage.id, didChange, isNew };
    }

    function scrollViewToPage(pageId) {
      if (!pageId) return;
      const tryScroll = () => {
        const el = document.querySelector(`#viewContainer [data-page-id="${pageId}"]`);
        if (!el) return false;
        const sticky = document.querySelector('.view-sticky-chrome');
        const offset = (sticky ? sticky.getBoundingClientRect().height : 0) + 16;
        const top = el.getBoundingClientRect().top + window.scrollY - offset;
        window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
        el.classList.add('view-page-flash');
        setTimeout(() => el.classList.remove('view-page-flash'), 1400);
        return true;
      };
      // View DOM may need a frame after renderAllView
      requestAnimationFrame(() => {
        if (!tryScroll()) {
          setTimeout(tryScroll, 80);
        }
      });
    }

    /** Thumbnail / preview → apply form edits, open View, scroll to that page. */
    window.previewPageFromThumbnail = function () {
      const result = applyFormToPages();
      if (!result) return;

      // Bypass dirty discard; form was just applied
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'view'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'viewPanel'));
      renderPageList();
      renderAllView();
      updateCounts();
      updateHistoryUI();

      // Keep Edit form in sync with applied page (still editable if user returns)
      const page = pages.find(p => p.id === result.pageId);
      if (page) {
        editingPageId = page.id;
        const ft = document.getElementById('formTitle');
        if (ft) ft.textContent = '✏️ Edit Page';
        const sb = document.getElementById('saveBtn');
        if (sb) sb.textContent = '💾 Update Page';
        const cb = document.getElementById('cancelBtn');
        if (cb) cb.style.display = 'inline-block';
        // Refresh form from applied page so ids/sections stay consistent
        fillForm(page);
        clearDirty();
      }

      scrollViewToPage(result.pageId);
      if (result.didChange) {
        showToast(result.isNew ? 'Page added — showing in View.' : 'Edits applied — showing in View.', 'success');
      } else {
        showToast('Showing page in View.', 'info');
      }
    };

    window.savePage = function () {
      const result = applyFormToPages();
      if (!result) return;
      resetForm();
      refreshUI();
      // Direct tab switch (dirty already cleared)
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'view'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'viewPanel'));
      renderAllView();
      updateCounts();
      if (result.pageId) scrollViewToPage(result.pageId);
      showToast('Page saved.', 'success');
    };

    // ========== PAGES LIST ==========
    window.deletePage = function (id) {
      const page = pages.find(p => p.id === id);
      if (!page) return;
      confirmDialog(`Delete page "${page.name}"?`, () => {
        const before = currentState();
        pages = pages.filter(p => p.id !== id);
        if (editingPageId === id) resetForm();
        recordHistory(before, currentState());
        persistState();
        refreshUI();
        showToast('Page deleted.', 'success');
      });
    };

    window.duplicatePage = function (id) {
      if (pages.length >= MAX_PAGES) {
        showToast(`Maximum ${MAX_PAGES} pages reached.`, 'error');
        return;
      }
      const page = pages.find(p => p.id === id);
      if (!page) return;
      const before = currentState();
      const copy = clone(page);
      copy.id = generateId('p');
      copy.name = (copy.name || 'Page') + ' (copy)';
      if (copy.type === 'structured') {
        copy.sections = (copy.sections || []).map(s => ({ ...s, id: generateId('sec') }));
      }
      pages.push(copy);
      recordHistory(before, currentState());
      persistState();
      refreshUI();
      showToast('Page duplicated.', 'success');
    };

    window.movePage = function (id, dir) {
      const idx = pages.findIndex(p => p.id === id);
      if (idx < 0) return;
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= pages.length) return;
      const before = currentState();
      const tmp = pages[idx];
      pages[idx] = pages[newIdx];
      pages[newIdx] = tmp;
      recordHistory(before, currentState());
      persistState();
      refreshUI();
    };

    window.exportJSON = function () {
      const payload = { version: 3, pages, sightWords, coverData, includeToc: !!includeToc };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'phonics_pages_v14.json';
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('JSON exported.', 'success');
    };

    window.importJSON = function (input) {
      const file = input?.files?.[0];
      if (!file) return;
      if (file.size > MAX_FILE_SIZE) {
        showToast('File too large (max 10 MB).', 'error');
        input.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onerror = () => showToast('Could not read the file.', 'error');
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (!data || typeof data !== 'object' || !Array.isArray(data.pages)) {
            throw new Error('Invalid structure');
          }
          const normalized = normalizeImportedState(data);
          confirmDialog(`Replace all data with ${normalized.pages.length} page(s)?`, async () => {
            const before = currentState();
            pages = normalized.pages;
            sightWords = normalized.sightWords;
            coverData = normalized.coverData;
            includeToc = normalized.includeToc !== false;
            await persistState();
            recordHistory(before, currentState());
            resetForm();
            refreshUI();
            const tocToggle = document.getElementById('includeTocToggle');
            if (tocToggle) tocToggle.checked = includeToc;
            showToast('Data imported successfully.', 'success');
          });
        } catch (err) {
          console.error(err);
          showToast('Invalid or unsupported JSON file.', 'error');
        }
      };
      reader.readAsText(file);
      input.value = '';
    };

    window.saveSightWords = function () {
      const before = currentState();
      sightWords = (document.getElementById('fSightWords').value || '')
        .split(',')
        .map(s => s.trim())
        .filter(Boolean);
      recordHistory(before, currentState());
      persistState();
      refreshUI();
      showToast('Sight words saved.', 'success');
    };

    window.saveCover = function () {
      const before = currentState();
      coverData = {
        title: (document.getElementById('coverTitleInput').value || '').trim() || 'Crystal Phonics',
        subtitle: (document.getElementById('coverSubtitleInput').value || '').trim() || 'Grade 1'
      };
      recordHistory(before, currentState());
      persistState();
      renderAllView();
      showToast('Cover updated.', 'success');
    };

    window.setIncludeToc = function (on) {
      const before = currentState();
      includeToc = !!on;
      recordHistory(before, currentState());
      persistState();
      renderAllView();
      updateCounts();
      showToast(includeToc ? 'TOC pages enabled.' : 'TOC pages disabled.', 'success');
    };

    function refreshUI() {
      renderPageList();
      renderAllView();
      updateCounts();
    }

    function renderPageList() {
      const container = document.getElementById('pageList');
      if (!container) return;
      const q = (window.searchQuery || '').toLowerCase();
      const filtered = pages.filter(p => {
        if (!q) return true;
        return (p.name || '').toLowerCase().includes(q) ||
          (p.mainTitle || '').toLowerCase().includes(q);
      });

      container.innerHTML = filtered.length
        ? filtered.map(p => {
            const label = p.mainTitle || (p.type === 'structured' ? 'Untitled' : 'Code Page');
            const icon = p.type === 'structured' ? '📄' : '💻';
            return `
              <div class="lesson-item" data-id="${p.id}">
                <div class="thumb">${icon}</div>
                <div class="info">
                  <div class="title">${escapeHtml(p.name || label)}</div>
                  <div class="sub">${p.type === 'structured' ? (p.sections?.length || 0) + ' sections' : 'HTML/CSS page · ' + escapeHtml(p.mainTitle || '')}</div>
                </div>
                <div class="actions">
                  <button class="btn btn-outline btn-xs" onclick="movePage('${p.id}', -1)">▲</button>
                  <button class="btn btn-outline btn-xs" onclick="movePage('${p.id}', 1)">▼</button>
                  <button class="btn btn-primary btn-xs" onclick="editPage('${p.id}')">✏️</button>
                  <button class="btn btn-warning btn-xs" onclick="duplicatePage('${p.id}')">📋</button>
                  <button class="btn btn-danger btn-xs" onclick="deletePage('${p.id}')">🗑️</button>
                </div>
              </div>`;
          }).join('')
        : '<div style="text-align:center;padding:36px;color:#6c757d;">No pages found.</div>';

      const listCount = document.getElementById('listCount');
      if (listCount) listCount.textContent = filtered.length + ' / ' + pages.length;

      const sp = document.getElementById('sightWordsPreview');
      if (sp) {
        sp.innerHTML = sightWords.length
          ? sightWords.map(w => `<span style="display:inline-block;margin:3px;padding:4px 9px;background:#E2571C;color:#fff;border-radius:7px;font-weight:600;font-size:12px;">${escapeHtml(w)}</span>`).join('')
          : '<span style="color:#6c757d;">No sight words yet.</span>';
      }
    }

    function updateCounts() {
      const badge = document.getElementById('pageCount');
      if (badge) badge.textContent = pages.length + ' pages · ' + sightWords.length + ' sight words';

      const tocPages = (includeToc && pages.length) ? Math.ceil(pages.length / MAX_TOC_PER_PAGE) : 0;
      const swPages = Math.ceil(sightWords.length / MAX_SIGHT_WORDS_PER_PAGE) || 0;
      const viewInfo = document.getElementById('viewInfo');
      if (viewInfo) {
        viewInfo.textContent = `📄 ${pages.length} lesson pages · ${1 + tocPages + swPages + pages.length} total pages`;
      }
    }

    window.switchTab = function (tab) {
      if (formDirty && tab !== 'edit') {
        if (!confirm('You have unsaved changes. Discard them?')) return;
        clearDirty();
        resetForm();
      }
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === tab + 'Panel'));
      if (tab === 'edit') {
        toggleEditorFields();
        renderThumbnail();
      }
      if (tab === 'pages') renderPageList();
      if (tab === 'view') renderAllView();
      updateCounts();
    };

    window.renderPageList = renderPageList;

    // ========== INIT ==========
    async function initApp() {
      await loadData();
      undoStack = [];
      redoStack = [];

      document.getElementById('app').innerHTML = `
        <div class="app-header">
          <h1>📚 Phonics Lesson Publisher v14 — Robust Unified Pages</h1>
          <span class="badge" id="pageCount">0</span>
        </div>
        <div class="tabs">
          <button class="tab-btn active" data-tab="edit" onclick="switchTab('edit')">✏️ Edit</button>
          <button class="btn btn-outline btn-sm" id="undoBtn" onclick="undoLast()" title="Undo (Ctrl+Z)">↶ Undo</button>
          <button class="btn btn-outline btn-sm" id="redoBtn" onclick="redoLast()" title="Redo (Ctrl+Y)">↷ Redo</button>
          <span class="history-status" id="historyStatus">No undo · No redo</span>
          <button class="tab-btn" data-tab="pages" onclick="switchTab('pages')">📖 Pages</button>
          <button class="tab-btn" data-tab="view" onclick="switchTab('view')">👁️ View</button>
        </div>

        <div class="tab-panel active" id="editPanel">
          <div class="form-section">
            <!-- THUMBNAIL AT THE TOP — tap to open this page in View -->
            <div class="thumbnail-wrapper">
              <div class="thumb-label">📄 Live Page Preview</div>
              <div class="thumbnail-container" id="thumbnailContainer" role="button" tabindex="0" title="Open this page in View" aria-label="Open this page in the View tab"></div>
              <div class="thumb-hint">Tap preview to open in View (applies edits)</div>
            </div>

            <h2 id="formTitle">➕ Add New Page</h2>

            <div class="form-group">
              <label>Page Type</label>
              <select id="pageTypeSelect" onchange="setPageType(this.value)">
                <option value="structured">Structured (Sections)</option>
                <option value="code">HTML / CSS Code</option>
              </select>
            </div>

            <div class="form-group">
              <label>Page Name</label>
              <input id="fPageName" value="">
            </div>

            <div class="form-group">
              <label>Main Title (shared header)</label>
              <input id="fMainTitle" value="SHORT VOWEL CVC WORDS" oninput="renderThumbnail()">
            </div>
            <div class="form-group">
              <label>Subtitle (shared header)</label>
              <input id="fSubtitle" value="SHORT VOWEL" oninput="renderThumbnail()">
            </div>

            <div id="structuredFields">
              <div class="section-card">
                <h4>Page Sections</h4>
                <p style="font-size:12px;color:#6c757d;margin-bottom:8px;">Add sections and choose their width.</p>
                <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
                  ${Object.keys(SECTION_TYPES).map(type =>
                    `<button class="btn btn-outline btn-sm" onclick="addSection('${type}')">+ ${SECTION_TYPES[type].label}</button>`
                  ).join('')}
                </div>
                <div id="sectionsContainer"></div>
              </div>
            </div>

            <div id="codeFields" style="display:none;">
              <div class="form-group">
                <label>HTML (page body only)</label>
                <textarea id="codeHTML" rows="9" oninput="renderThumbnail()"></textarea>
              </div>
              <div class="form-group">
                <label>CSS (scoped to body content)</label>
                <textarea id="codeCSS" rows="5" oninput="renderThumbnail()"></textarea>
              </div>
              <div class="form-group">
                <label>Content Background Color</label>
                <input id="codeBg" type="color" value="#ffffff" oninput="renderThumbnail()" style="width:80px;height:36px;padding:2px;">
              </div>
              <p style="font-size:12px;color:#6c757d;margin-top:4px;">
                Header (title + subtitle + lesson number) matches Structured pages. Only the body content below the header is produced by your HTML/CSS.
              </p>
            </div>

            <div class="form-actions">
              <button class="btn btn-primary" id="saveBtn" onclick="savePage()">💾 Save Page</button>
              <button class="btn btn-outline" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="pagesPanel">
          <div class="list-section">
            <div style="margin-bottom:18px;border-bottom:2px solid #e9ecef;padding-bottom:18px;">
              <h3>📘 Cover Page</h3>
              <div class="form-group"><label>Cover Title</label>
                <input id="coverTitleInput" value="${escapeHtml(coverData.title)}">
              </div>
              <div class="form-group"><label>Cover Subtitle</label>
                <input id="coverSubtitleInput" value="${escapeHtml(coverData.subtitle)}">
              </div>
              <button class="btn btn-success btn-sm" onclick="saveCover()">💾 Save Cover</button>
              <div class="form-group" style="margin-top:14px;margin-bottom:0;">
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;">
                  <input type="checkbox" id="includeTocToggle" ${includeToc ? 'checked' : ''} onchange="setIncludeToc(this.checked)" style="width:18px;height:18px;accent-color:#F5A623;">
                  Auto-generate Table of Contents pages
                </label>
                <p style="font-size:12px;color:#6c757d;margin-top:4px;margin-bottom:0;">When off, View/Export skips TOC pages. Cover, sight words, and lesson pages are unchanged.</p>
              </div>
            </div>

            <h2>📖 All Pages</h2>
            <div class="list-toolbar">
              <input class="search-box" placeholder="🔍 Search..." oninput="window.searchQuery=this.value;window.renderPageList()">
              <span class="count" id="listCount">0/0</span>
              <button class="btn btn-success btn-sm" onclick="exportJSON()">📤 Export</button>
              <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">📥 Import</button>
              <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
            </div>
            <div class="lesson-list" id="pageList"></div>

            <div style="margin-top:24px;border-top:2px solid #e9ecef;padding-top:18px;">
              <h3>📝 Sight Words</h3>
              <div class="form-group">
                <textarea id="fSightWords" rows="3" placeholder="the, of, and, a, to, ..."></textarea>
              </div>
              <button class="btn btn-success btn-sm" onclick="saveSightWords()">💾 Save Sight Words</button>
              <div style="margin-top:10px;"><strong>Preview:</strong>
                <div id="sightWordsPreview" style="margin-top:6px;"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="viewPanel">
          <div class="view-sticky-chrome no-print">
            <div class="view-toolbar">
              <span class="info" id="viewInfo">0 pages · 0 total pages</span>
              <button class="btn btn-primary btn-sm" id="viewEditToggle" onclick="toggleViewTextEditing()">✏️ Editing on</button>
              <button class="btn btn-success" onclick="exportAllPages()">⬇ Export All</button>
            </div>
            <div class="rte-bar visible" id="rteBar">
              <span class="rte-label">Format</span>
              <button class="btn btn-outline btn-xs" data-cmd="bold" onmousedown="event.preventDefault()" onclick="rteCommand('bold')" title="Bold"><b>B</b></button>
              <button class="btn btn-outline btn-xs" data-cmd="italic" onmousedown="event.preventDefault()" onclick="rteCommand('italic')" title="Italic"><i>I</i></button>
              <button class="btn btn-outline btn-xs" data-cmd="underline" onmousedown="event.preventDefault()" onclick="rteCommand('underline')" title="Underline"><u>U</u></button>
              <button class="btn btn-outline btn-xs" onmousedown="event.preventDefault()" onclick="rteCommand('highlight')" title="Highlight">A</button>
              <button class="btn btn-outline btn-xs" onmousedown="event.preventDefault()" onclick="rteCommand('image')" title="Insert image">🖼️</button>
              <button class="btn btn-outline btn-xs" onmousedown="event.preventDefault()" onclick="rteCommand('removeFormat')" title="Clear format">Clear</button>
              <span style="font-size:12px;color:#6c757d;">Click text to edit · tap image to change · 🖼️ to insert</span>
            </div>
          </div>
          <div class="view-container editing-on" id="viewContainer"></div>
        </div>
      `;

      document.getElementById('fSightWords').value = sightWords.join(', ');
      resetForm();
      renderPageList();
      renderAllView();
      updateCounts();
      updateHistoryUI();

      // Thumbnail → View (apply form edits, scroll to page)
      const thumb = document.getElementById('thumbnailContainer');
      if (thumb && !thumb.dataset.previewBound) {
        thumb.dataset.previewBound = '1';
        thumb.addEventListener('click', (e) => {
          // Ignore pure accidental drags; always treat as intentional open
          e.preventDefault();
          window.previewPageFromThumbnail();
        });
        thumb.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            window.previewPageFromThumbnail();
          }
        });
      }

      switchTab('edit');
    }

    initApp().catch(err => {
      console.error(err);
      showToast('Failed to initialize app.', 'error');
    });
  })();
  </script>
</body>
</html>
