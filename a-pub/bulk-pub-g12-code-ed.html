<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚 Phonics Lesson Publisher v14 — Robust Unified Pages</title>
  <style>
    @page { size: 850px 1100px; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
      background: #f5f7fa;
      color: #1a1a1a;
      padding: 16px;
      line-height: 1.45;
    }
    .app {
      max-width: 1500px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .app-header {
      background: #1a1a2e;
      color: #fff;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .app-header h1 { font-size: 22px; font-weight: 800; }
    .app-header .badge {
      background: #F5A623;
      color: #1a1a1a;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }
    .tabs {
      display: flex;
      border-bottom: 2px solid #e9ecef;
      background: #fafbfc;
      padding: 0 24px;
      gap: 4px;
      flex-wrap: wrap;
      align-items: center;
    }
    .tab-btn {
      padding: 14px 22px;
      border: none;
      background: transparent;
      font-size: 16px;
      font-weight: 700;
      color: #6c757d;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      font-family: inherit;
      touch-action: manipulation;
    }
    .tab-btn.active { color: #1a1a2e; border-bottom-color: #F5A623; }
    .history-status {
      font-size: 12px;
      color: #6c757d;
      margin-left: 8px;
      white-space: nowrap;
    }
    .tab-panel { display: none; padding: 20px 28px 28px; }
    .tab-panel.active { display: block; }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 400px;
      width: 100%;
      pointer-events: none;
    }
    .toast {
      padding: 12px 18px;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.15);
      animation: slideIn 0.28s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }
    .toast.success { background: #2d7d46; }
    .toast.error { background: #dc3545; }
    .toast.warning { background: #e67e22; }
    .toast.info { background: #2c7be5; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Forms */
    .form-section {
      background: #f8f9fa;
      border-radius: 14px;
      padding: 20px;
      border: 2px solid #e9ecef;
    }
    .form-section h2 { font-size: 20px; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 13px;
      color: #495057;
      margin-bottom: 4px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 9px 12px;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      transition: border 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #F5A623;
      box-shadow: 0 0 0 3px rgba(245,166,35,0.15);
    }
    .form-group textarea { resize: vertical; min-height: 48px; }
    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    /* Buttons */
    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn-primary { background: #F5A623; color: #1a1a1a; }
    .btn-success { background: #2d7d46; color: #fff; }
    .btn-danger { background: #dc3545; color: #fff; }
    .btn-outline { background: transparent; border: 2px solid #dee2e6; color: #495057; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-xs { padding: 4px 9px; font-size: 11px; border-radius: 6px; }
    .btn-warning { background: #e67e22; color: #fff; }

    /* List */
    .list-section { min-height: 360px; }
    .list-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 2px solid #e9ecef;
    }
    .search-box {
      flex: 1;
      min-width: 160px;
      padding: 9px 14px;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    .search-box:focus { outline: none; border-color: #F5A623; }
    .list-toolbar .count {
      font-weight: 700;
      color: #6c757d;
      font-size: 13px;
      white-space: nowrap;
    }
    .lesson-list { display: flex; flex-direction: column; gap: 8px; }
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      background: #f8f9fa;
      border-radius: 10px;
      border: 2px solid transparent;
      transition: background 0.2s, border-color 0.2s;
    }
    .lesson-item:active { border-color: #F5A623; background: #fff; }
    .lesson-item .thumb {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: #e9ecef;
      border: 1px solid #dee2e6;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .lesson-item .info { flex: 1; min-width: 0; }
    .lesson-item .info .title { font-weight: 700; font-size: 16px; }
    .lesson-item .info .sub {
      font-size: 12px;
      color: #6c757d;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lesson-item .actions { display: flex; gap: 4px; flex-shrink: 0; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
    }
    .modal-overlay .modal {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 24px 48px rgba(0,0,0,0.2);
    }
    .modal-overlay .modal h3 { margin-bottom: 8px; }
    .modal-overlay .modal p { color: #6c757d; margin-bottom: 18px; font-size: 15px; }
    .modal-overlay .modal .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* Section builder */
    .section-card {
      background: #fff;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .section-card h4 { font-size: 14px; margin-bottom: 8px; color: #E2571C; }
    .section-builder-item {
      background: #fff;
      border: 2px solid #dee2e6;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .section-builder-item .sb-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .section-builder-item .sb-header .sb-title {
      font-weight: 700;
      font-size: 13px;
      flex: 1;
    }
    .section-builder-item .sb-header select {
      width: auto;
      padding: 3px 7px;
      border-radius: 6px;
      border: 2px solid #dee2e6;
      font-size: 12px;
    }
    .section-builder-item .sb-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .section-builder-item .sb-body textarea,
    .section-builder-item .sb-body input,
    .section-builder-item .sb-body select {
      width: 100%;
      padding: 6px 9px;
      border: 2px solid #dee2e6;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }
    .section-builder-item .sb-actions {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
    }

    @media (hover: hover) {
      .tab-btn:hover { color: #1a1a2e; }
      .btn-primary:hover:not(:disabled) { background: #e0950f; transform: translateY(-1px); }
      .btn-success:hover:not(:disabled) { background: #1f5f34; }
      .btn-danger:hover:not(:disabled) { background: #b02a37; }
      .btn-outline:hover:not(:disabled) { background: #f1f3f5; }
      .btn-warning:hover:not(:disabled) { background: #d35400; }
      .lesson-item:hover { border-color: #F5A623; background: #fff; }
    }

    /* ========== VIEW / PAGE STYLES (shared by Structured + Code) ========== */
    .view-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 8px;
    }
    .view-container .page {
      width: 850px;
      min-width: 850px;
      min-height: 1100px;
      height: 1100px;
      max-height: 1100px;
      padding: 16px 22px;
      position: relative;
      page-break-after: always;
      page-break-inside: avoid;
      margin: 0 auto 28px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      overflow: hidden;
      box-sizing: border-box;
    }
    .view-container .page:last-child {
      margin-bottom: 0;
      page-break-after: auto;
    }

    /* Unified card chrome — same for Structured and Code */
    .view-container .card {
      border: 4px solid #E2571C;
      border-radius: 12px;
      width: 100%;
      height: 1068px;
      min-height: 1068px;
      max-height: 1068px;
      padding: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      box-sizing: border-box;
    }

    /* Structured header */
    .cvc-header {
      display: flex;
      align-items: stretch;
      border-bottom: 3px solid #E2571C;
      min-height: 64px;
      flex-shrink: 0;
    }
    .cvc-header-left {
      flex: 1;
      padding: 10px 18px 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .cvc-main-title {
      font-size: 26px;
      font-weight: 800;
      color: #E2571C;
      letter-spacing: 0.3px;
      line-height: 1.1;
      margin: 0;
    }
    .cvc-subtitle {
      font-size: 12px;
      font-weight: 700;
      color: #c45a12;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .cvc-header-right {
      background: #E2571C;
      color: #fff;
      min-width: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .cvc-header-right .lesson-label {
      font-size: 12px;
      font-weight: 600;
      opacity: 0.95;
      margin-right: 5px;
    }
    .cvc-header-right .lesson-num {
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
    }

    .lesson-sections-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 18px 6px;
      flex: 1;
      align-content: flex-start;
      min-height: 0;
      overflow: hidden;
    }
    .section-item { flex: 0 0 auto; }
    .w-full { width: 100%; }
    .w-half { width: calc(50% - 5px); }
    .w-quarter { width: calc(25% - 7.5px); }
    .w-threequarter { width: calc(75% - 2.5px); }

    .todays-sound-card {
      background: #fff;
      border: 2px solid #F5A623;
      border-radius: 10px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(226,87,28,0.1);
      display: flex;
      flex-direction: column;
    }
    .todays-sound-header {
      background: #E2571C;
      color: #fff;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 4px 4px;
      text-transform: uppercase;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .todays-sound-body {
      padding: 6px 6px 10px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .todays-sound-stars {
      color: #F5A623;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 2px;
    }
    .todays-sound-letter {
      font-weight: 800;
      color: #E2571C;
      line-height: 1;
      letter-spacing: -1px;
    }
    .todays-sound-img {
      max-width: 90%;
      max-height: 80px;
      object-fit: contain;
      border-radius: 5px;
    }

    .cvc-intro-box {
      border: 2px dashed #E2571C;
      border-radius: 8px;
      padding: 8px 12px;
      background: #fff8f3;
    }
    .cvc-intro-box p {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      color: #1a1a1a;
      font-weight: 500;
    }
    .cvc-intro-box .highlight { color: #E2571C; font-weight: 700; }

    .cvc-instruction-box {
      border: 2px solid #F5A623;
      border-radius: 8px;
      padding: 8px 12px;
      background: #fffaf0;
    }
    .cvc-instruction-box p {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.35;
    }

    .custom-text-box {
      border: 2px dashed #E2571C;
      border-radius: 8px;
      padding: 8px 12px;
      background: #fff8f3;
    }
    .custom-text-box p {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      color: #1a1a1a;
      font-weight: 500;
    }
    .custom-text-box .highlight { color: #E2571C; font-weight: 700; }

    .word-grid {
      display: grid;
      border: 2px solid #E2571C;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .word-cell {
      border-right: 1px solid #f0c9a8;
      border-bottom: 1px solid #f0c9a8;
      padding: 8px 3px;
      text-align: center;
      font-size: 21px;
      font-weight: 600;
      color: #1a1a1a;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    .word-cell.empty { background: #faf7f4; color: transparent; }
    .word-cell.empty:focus, .view-container.editing-on .word-cell.empty:focus {
      color: #1a1a1a;
      min-width: 24px;
    }

    .act-box {
      border: 2px solid #E2571C;
      border-radius: 10px;
      padding: 10px 14px;
      background: #fff;
    }
    .act-box .act-title {
      font-size: 13px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }
    .act-box .sentence {
      font-size: 16px;
      font-weight: 600;
      color: #E2571C;
      margin: 2px 0;
      line-height: 1.35;
    }

    .fill-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    .fill-item {
      border: 2px solid #F5A623;
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #E2571C;
      background: #fffaf0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: 44px;
      overflow: hidden;
      word-break: break-word;
    }
    .fill-item .blank-sq {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 2px solid #1a1a1a;
      border-radius: 4px;
      background: #fff;
      vertical-align: middle;
    }

    .sent-lines { margin-top: 4px; }
    .sent-line {
      border-bottom: 1.5px solid #999;
      padding: 10px 0 3px;
      font-size: 13px;
      color: #666;
      font-weight: 600;
    }

    .writing-lines-area {
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      min-height: 110px;
      padding-bottom: 22px;
      flex: 1;
    }
    .writing-set {
      position: relative;
      height: 42px;
      width: 100%;
      flex: 0 0 auto;
    }
    .writing-set .line {
      position: absolute;
      left: 0;
      right: 0;
      height: 0;
      border-top-width: 1.7px;
      border-top-style: solid;
    }
    .writing-set .line.l1 { top: 0; border-top-color: #E2571C; }
    .writing-set .line.l2 { top: 14px; border-top-color: #2c7be5; }
    .writing-set .line.l3 { top: 28px; border-top-color: #2c7be5; }
    .writing-set .line.l4 { top: 42px; border-top-color: #E2571C; }

    .cvc-page-number {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      color: #6c757d;
      z-index: 2;
      pointer-events: none;
    }

    /* Cover */
    .cover-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Times New Roman', Times, serif;
      height: 1068px;
      min-height: 1068px;
      max-height: 1068px;
      border: 3px solid #F5A623;
      border-radius: 24px;
    }
    .cover-text-block { text-align: center; padding: 0 36px; }
    .cover-line {
      width: 110px;
      height: 4px;
      background-color: #F5A623;
      margin: 26px auto;
      border-radius: 2px;
    }
    .cover-title {
      font-size: 56px;
      font-weight: 800;
      color: #1a1a2e;
      letter-spacing: 2px;
      margin: 0;
    }
    .cover-subtitle {
      font-size: 28px;
      font-weight: 400;
      color: #E2571C;
      margin-top: 12px;
      letter-spacing: 1px;
      font-style: italic;
    }

    /* TOC */
    .toc-card {
      border: 3px solid #F5A623;
      border-radius: 24px;
      height: 1068px;
      min-height: 1068px;
      max-height: 1068px;
      padding: 26px 36px;
      position: relative;
      font-family: 'Times New Roman', Times, serif;
      overflow: hidden;
      box-sizing: border-box;
    }
    .toc-title {
      font-size: 26px;
      font-weight: 800;
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 18px;
      border-bottom: 4px solid #F5A623;
      padding-bottom: 8px;
    }
    .toc-list { list-style: none; padding: 0; margin: 0; }
    .toc-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 6px 5px;
      border-bottom: 1px dashed #dee2e6;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
    }
    .toc-item .toc-page-num {
      font-weight: 800;
      color: #E2571C;
      min-width: 56px;
      text-align: right;
    }
    .toc-card .page-number {
      position: absolute;
      bottom: 14px;
      right: 22px;
      font-weight: 800;
      font-size: 13px;
      font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    }

    /* Sight words */
    .sight-words-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 8px;
      padding: 0 10px;
    }
    .sight-word-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #E2571C;
      background: #fff;
      border: 3px solid #F5A623;
      border-radius: 12px;
      padding: 14px 5px;
      min-height: 68px;
      text-align: center;
      word-break: break-word;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .view-container .card.sight-card {
      border: 3px solid #F5A623;
      border-radius: 24px;
      height: 1068px;
      min-height: 1068px;
      max-height: 1068px;
      padding: 20px 28px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .view-container .title {
      font-size: 26px;
      font-weight: 800;
      color: #1a1a1a;
      letter-spacing: 0.4px;
      margin: 4px 0 14px 0;
    }
    .view-container .section-header {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      margin-top: 8px;
    }
    .view-container .section-header .circle {
      background: #F5A623;
      color: #fff;

<body>
  <div id="app"></div>
  <div class="toast-container" id="toastContainer"></div>

  <script>
  (function () {
    'use strict';

    // ========== CONSTANTS ==========
    const IDB_NAME = 'phonics_lessons_db_v14';
    const IDB_STORE = 'app_data';
    const LEGACY_KEYS = ['phonics_lessons_v13', 'phonics_lessons_v12', 'phonics_html_css_pages_v1'];
    const MAX_TOC_PER_PAGE = 20;
    const MAX_SIGHT_WORDS_PER_PAGE = 50;
    const MAX_GRID_WORDS = 24;
    const MAX_FILL_ITEMS = 18;
    const MAX_PAGES = 200;
    const MAX_SECTIONS = 20;
    const MAX_FILE_SIZE = 10 * 1024 * 1024;
    const HISTORY_LIMIT = 60;
    const PAGE_W = 850;
    const PAGE_H = 1100;
    const CARD_H = 1068;

    // ========== STORAGE ==========
    let dbPromise = null;

    function getDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) {
              db.createObjectStore(IDB_STORE);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      return dbPromise;
    }

    async function idbSet(data) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(data, 'appData');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbGet() {
      try {
        const db = await getDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get('appData');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        return null;
      }
    }

    // ========== UTILITIES ==========
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, m =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])
      );
    }

    function showToast(msg, type = 'info') {
      const t = document.createElement('div');
      t.className = 'toast ' + type;
      const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
      t.innerHTML = `<span>${icon}</span> ${escapeHtml(msg)}`;
      document.getElementById('toastContainer').appendChild(t);
      setTimeout(() => t.remove(), 3400);
    }

    function confirmDialog(msg, onYes) {
      const o = document.createElement('div');
      o.className = 'modal-overlay';
      o.innerHTML = `
        <div class="modal">
          <h3>⚠️ Confirm</h3>
          <p>${escapeHtml(msg)}</p>
          <div class="actions">
            <button class="btn btn-outline cancel">Cancel</button>
            <button class="btn btn-danger confirm">Yes</button>
          </div>
        </div>`;
      document.body.appendChild(o);
      o.querySelector('.cancel').onclick = () => o.remove();
      o.querySelector('.confirm').onclick = () => { o.remove(); onYes(); };
    }

    function generateId(prefix) {
      return prefix + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    }

    // ========== SECTION TYPES ==========
    const SECTION_TYPES = {
      tile: { label: 'Letter/Image Tile', defaultWidth: 'full' },
      introText: { label: 'Intro Text', defaultWidth: 'full' },
      instruction: { label: 'Instruction', defaultWidth: 'full' },
      wordGrid: { label: 'Word Grid', defaultWidth: 'full' },
      decodable: { label: 'Decodable Reading', defaultWidth: 'full' },
      fillBlanks: { label: 'Fill-in-Blanks', defaultWidth: 'full' },
      sentenceWriting: { label: 'Sentence Writing', defaultWidth: 'full' },
      customText: { label: 'Custom Text', defaultWidth: 'full' },
      writingLines: { label: 'Writing Lines (expandable)', defaultWidth: 'full' }
    };

    function createDefaultSection(type) {
      const id = generateId('sec');
      const base = { id, type, width: SECTION_TYPES[type]?.defaultWidth || 'full' };
      switch (type) {
        case 'tile':
          return { ...base, tileMode: 'letter', letterTile: 'Aa', letterFontSize: 56, imagePath: '', imageCaption: "TODAY'S SOUND", imageWidth: 160, imageHeight: 120, imageBorder: 'none', imageFit: 'contain' };
        case 'introText':
        case 'instruction':
        case 'customText':
          return { ...base, text: '' };
        case 'wordGrid':
          return { ...base, words: [], columns: 4, rows: 3 };
        case 'decodable':
          return { ...base, instruction: 'Read ALOUD and circle all words with the target sound', sentences: [] };
        case 'fillBlanks':
          return { ...base, title: 'A. Fill in the missing letters and say the word', items: [] };
        case 'sentenceWriting':
          return { ...base, title: 'C. Choose any word and form 2 sentences', lines: 2 };
        case 'writingLines':
          return { ...base, fillRemaining: true };
        default:
          return base;
      }
    }

    function createDefaultStructuredPage() {
      return {
        id: generateId('p'),
        type: 'structured',
        name: 'Lesson Page',
        mainTitle: 'SHORT VOWEL CVC WORDS',
        subtitle: 'SHORT VOWEL',
        sections: [
          { ...createDefaultSection('tile'), letterTile: 'Aa' },
          { ...createDefaultSection('introText'), text: 'Short a says /a/ like in <b>apple</b> — when a single vowel is boxed in between two consonants, it usually keeps this quick, clipped sound.' },
          { ...createDefaultSection('instruction'), text: 'Say each picture word out loud and listen for this pattern.' },
          { ...createDefaultSection('wordGrid'), words: ['bag','cat','mat','hat','rat','bat','sat','pat','fat','man','van','map'], columns: 4, rows: 3 },
          { ...createDefaultSection('decodable'), sentences: ['I see a bag.','Look at the cat and the mat.','Is this a hat?','I like my rat.','We have a bat.'] },
          { ...createDefaultSection('fillBlanks'), items: ['b_g','c_t','m_t','h_t','r_t','b_t','s_t','p_t','f_t'] },
          { ...createDefaultSection('sentenceWriting') },
          { ...createDefaultSection('writingLines') }
        ]
      };
    }

    function createDefaultCodePage() {
      return {
        id: generateId('p'),
        type: 'code',
        name: 'Code Page',
        mainTitle: 'SHORT VOWEL CVC WORDS',
        subtitle: 'SHORT VOWEL',
        html: '<div class="content"><h1>Your Page</h1><p>Write HTML and CSS directly here.</p></div>',
        css: '.content{padding:24px;font-family:Arial,sans-serif}h1{margin:0 0 12px;color:#E2571C}p{font-size:16px}',
        contentBackground: '#ffffff'
      };
    }

    /** Hard-coded starter pack — always used on init (unless user imports). */
    function createHardcodedDefaultPages() {
      const shortA = {
        id: generateId('p'),
        type: 'structured',
        name: 'Short A — CVC',
        mainTitle: 'SHORT VOWEL CVC WORDS',
        subtitle: 'SHORT A',
        sections: [
          { ...createDefaultSection('tile'), letterTile: 'Aa' },
          { ...createDefaultSection('introText'), text: 'Short <b>a</b> says /a/ like in <b>apple</b> — when a single vowel is boxed in between two consonants, it usually keeps this quick, clipped sound.' },
          { ...createDefaultSection('instruction'), text: 'Say each picture word out loud and listen for the short a sound.' },
          { ...createDefaultSection('wordGrid'), words: ['bag', 'cat', 'mat', 'hat', 'rat', 'bat', 'sat', 'pat', 'fat', 'man', 'van', 'map'], columns: 4, rows: 3 },
          { ...createDefaultSection('decodable'), sentences: ['I see a bag.', 'Look at the cat and the mat.', 'Is this a hat?', 'I like my rat.', 'We have a bat.'] },
          { ...createDefaultSection('fillBlanks'), items: ['b_g', 'c_t', 'm_t', 'h_t', 'r_t', 'b_t', 's_t', 'p_t', 'f_t'] },
          { ...createDefaultSection('sentenceWriting') },
          { ...createDefaultSection('writingLines') }
        ]
      };

      const shortE = {
        id: generateId('p'),
        type: 'structured',
        name: 'Short E — CVC',
        mainTitle: 'SHORT VOWEL CVC WORDS',
        subtitle: 'SHORT E',
        sections: [
          { ...createDefaultSection('tile'), letterTile: 'Ee' },
          { ...createDefaultSection('introText'), text: 'Short <b>e</b> says /e/ like in <b>egg</b> — listen for the quick middle sound in each word.' },
          { ...createDefaultSection('instruction'), text: 'Read each word and tap the short e sound.' },
          { ...createDefaultSection('wordGrid'), words: ['bed', 'red', 'pen', 'hen', 'ten', 'net', 'pet', 'wet', 'jet', 'leg', 'beg', 'men'], columns: 4, rows: 3 },
          { ...createDefaultSection('decodable'), sentences: ['The hen is red.', 'I see a pen on the bed.', 'Ten pets ran.', 'Get the net.', 'Ben has a jet.'] },
          { ...createDefaultSection('fillBlanks'), items: ['b_d', 'r_d', 'p_n', 'h_n', 't_n', 'n_t', 'p_t', 'w_t', 'j_t'] },
          { ...createDefaultSection('sentenceWriting'), title: 'C. Choose any word and form 2 sentences' },
          { ...createDefaultSection('writingLines') }
        ]
      };

      const codeSample = {
        id: generateId('p'),
        type: 'code',
        name: 'Code sample page',
        mainTitle: 'BUILD YOUR OWN PAGE',
        subtitle: 'HTML / CSS',
        html: [
          '<div class="content">',
          '  <h2>Welcome</h2>',
          '  <p>This is a <b>code page</b>. Click empty space to insert headings, grids, lists, and more.</p>',
          '  <div class="cvc-instruction-box"><p>Try editing this text, or tap blank area to add blocks.</p></div>',
          '</div>'
        ].join('\n'),
        css: [
          '.content{padding:20px;font-family:Arial,sans-serif;line-height:1.45;}',
          'h2{margin:0 0 12px;color:#E2571C;font-size:28px;}',
          'p{font-size:16px;margin:0 0 12px;}'
        ].join(''),
        contentBackground: '#ffffff'
      };

      return [shortA, shortE, codeSample];
    }

    function getHardcodedDefaultState() {
      return {
        version: 3,
        pages: createHardcodedDefaultPages(),
        sightWords: ['the', 'of', 'and', 'a', 'to', 'in', 'is', 'you', 'that', 'it'],
        coverData: { title: 'Crystal Phonics', subtitle: 'Grade 1' },
        includeToc: true
      };
    }

    // ========== STATE ==========
    let pages = [];
    let sightWords = [];
    let coverData = { title: 'Crystal Phonics', subtitle: 'Grade 1' };
    let includeToc = true; // auto-generate Table of Contents pages (togglable)
    let viewTextEditing = true; // inline rich-text editing on View tab
    let editingPageId = null;
    let tempSections = [];
    let tempPageType = 'structured';
    let formDirty = false;
    window.searchQuery = '';

    // History
    let undoStack = [];
    let redoStack = [];
    let historyBusy = false;
    let saveBusy = Promise.resolve();

    const clone = (obj) => JSON.parse(JSON.stringify(obj));
    function currentState() {
      return { pages: clone(pages), sightWords: clone(sightWords), coverData: clone(coverData), includeToc: !!includeToc };
    }
    function stateKey(s) {
      try { return JSON.stringify(s); } catch (e) { return ''; }
    }

    function updateHistoryUI() {
      const u = document.getElementById('undoBtn');
      const r = document.getElementById('redoBtn');
      if (u) u.disabled = historyBusy || undoStack.length === 0;
      if (r) r.disabled = historyBusy || redoStack.length === 0;
      const el = document.getElementById('historyStatus');
      if (el) {
        el.textContent = `${undoStack.length ? undoStack.length + ' undo' : 'No undo'} · ${redoStack.length ? redoStack.length + ' redo' : 'No redo'}`;
      }
    }

    function recordHistory(before, after) {
      if (historyBusy || stateKey(before) === stateKey(after)) return;
      undoStack.push(clone(before));
      if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
      redoStack = [];
      updateHistoryUI();
    }

    async function persistState(override) {
      const snapshot = override ? clone(override) : currentState();
      snapshot.version = 3;
      saveBusy = saveBusy.then(async () => {
        try {
          await idbSet(snapshot);
          try { localStorage.setItem('phonics_lessons_v14', JSON.stringify(snapshot)); } catch (_) {}
        } catch (err) {
          console.error(err);
          try {
            localStorage.setItem('phonics_lessons_v14', JSON.stringify(snapshot));
          } catch (e2) {
            showToast('Could not save. Export JSON as backup.', 'error');
            throw e2;
          }
        }
      }).catch(() => {});
      return saveBusy;
    }

    async function restoreState(state) {
      const normalized = normalizeImportedState(clone(state));
      pages = normalized.pages;
      sightWords = normalized.sightWords;
      coverData = normalized.coverData;
      includeToc = normalized.includeToc !== false;
      resetForm();
      refreshUI();
      await persistState();
    }

    window.undoLast = async function () {
      if (historyBusy || !undoStack.length) return;
      historyBusy = true;
      updateHistoryUI();
      try {
        const current = currentState();
        const previous = undoStack.pop();
        redoStack.push(current);
        if (redoStack.length > HISTORY_LIMIT) redoStack.shift();
        await restoreState(previous);
        showToast('Undid last change.', 'success');
      } finally {
        historyBusy = false;
        updateHistoryUI();
      }
    };

    window.redoLast = async function () {
      if (historyBusy || !redoStack.length) return;
      historyBusy = true;
      updateHistoryUI();
      try {
        const current = currentState();
        const next = redoStack.pop();
        undoStack.push(current);
        if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
        await restoreState(next);
        showToast('Redid last change.', 'success');
      } finally {
        historyBusy = false;
        updateHistoryUI();
      }
    };

    window.addEventListener('keydown', (e) => {
      const mod = e.ctrlKey || e.metaKey;
      if (!mod || e.altKey) return;
      const tag = (e.target?.tagName || '').toLowerCase();
      const inEdit = !!(e.target && e.target.closest && e.target.closest('[contenteditable="true"]'));
      if ((tag === 'input' || tag === 'textarea' || tag === 'select' || inEdit) && !e.shiftKey) return;
      const k = e.key.toLowerCase();
      if (k === 'z') {
        e.preventDefault();
        e.shiftKey ? redoLast() : undoLast();
      } else if (k === 'y') {
        e.preventDefault();
        redoLast();
      }
    });

    // ========== NORMALIZE / MIGRATE ==========
    function normalizeImportedState(data) {
      const rawPages = Array.isArray(data?.pages) ? data.pages : [];
      const seenPageIds = new Set();
      const seenSectionIds = new Set();

      const safePages = rawPages.map((p) => {
        let newId = p.id;
        if (!newId || seenPageIds.has(newId)) newId = generateId('p');
        seenPageIds.add(newId);

        if (p.type === 'code') {
          return {
            ...createDefaultCodePage(),
            ...p,
            id: newId,
            type: 'code',
            mainTitle: String(p.mainTitle || 'SHORT VOWEL CVC WORDS'),
            subtitle: String(p.subtitle || 'SHORT VOWEL'),
            html: String(p.html || ''),
            css: String(p.css || ''),
            contentBackground: String(p.contentBackground || p.background || '#ffffff')
          };
        }

        // Structured
        let sections = Array.isArray(p.sections) ? p.sections : [];
        const rebuilt = [];
        for (const sec of sections) {
          if (!sec || !SECTION_TYPES[sec.type]) continue;
          let secId = sec.id;
          if (!secId || seenSectionIds.has(secId)) secId = generateId('sec');
          seenSectionIds.add(secId);
          rebuilt.push({ ...sec, id: secId });
        }
        return {
          ...createDefaultStructuredPage(),
          ...p,
          id: newId,
          type: 'structured',
          mainTitle: String(p.mainTitle || 'Untitled'),
          subtitle: String(p.subtitle || 'SHORT VOWEL'),
          sections: rebuilt.slice(0, MAX_SECTIONS)
        };
      }).slice(0, MAX_PAGES);

      const sw = Array.isArray(data?.sightWords) ? data.sightWords.map(String).filter(Boolean) : [];
      const cd = data?.coverData || {};
      // Default true for backward compatibility when key is missing
      const tocFlag = data?.includeToc;
      return {
        pages: safePages,
        sightWords: sw,
        coverData: {
          title: String(cd.title || 'Crystal Phonics'),
          subtitle: String(cd.subtitle || 'Grade 1')
        },
        includeToc: tocFlag === undefined || tocFlag === null ? true : !!tocFlag
      };
    }

    function migrateLegacy() {
      for (const key of LEGACY_KEYS) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) continue;
          const old = JSON.parse(raw);
          if (old && Array.isArray(old.pages)) return old;
          if (old && Array.isArray(old.lessons)) {
            // v12 style
            const migratedPages = old.lessons.map(l => ({
              id: l.id || generateId('p'),
              type: 'structured',
              name: l.mainTitle || 'Lesson Page',
              mainTitle: l.mainTitle,
              subtitle: l.subtitle,
              sections: l.sections || []
            }));
            try {
              const codeRaw = localStorage.getItem('phonics_html_css_pages_v1');
              if (codeRaw) {
                const codeData = JSON.parse(codeRaw);
                if (codeData && Array.isArray(codeData.pages)) {
                  codeData.pages.forEach(p => {
                    migratedPages.push({
                      id: p.id || generateId('p'),
                      type: 'code',
                      name: p.name || 'Code Page',
                      html: p.html || '',
                      css: p.css || '',
                      contentBackground: p.background || '#ffffff'
                    });
                  });
                }
              }
            } catch (_) {}
            return {
              pages: migratedPages,
              sightWords: old.sightWords || [],
              coverData: old.coverData || { title: 'Crystal Phonics', subtitle: 'Grade 1' }
            };
          }
        } catch (_) {}
      }
      return null;
    }

    async function loadData() {
      // Always start from hard-coded defaults on initialization.
      // Saved IDB / localStorage data is ignored so reloads reset to defaults.
      // User import (JSON) is the only way to load external data (session only until next reload).
      const defaults = getHardcodedDefaultState();
      const normalized = normalizeImportedState(defaults);
      pages = normalized.pages;
      sightWords = normalized.sightWords;
      coverData = normalized.coverData;
      includeToc = normalized.includeToc !== false;
      // Do not hydrate from IDB/localStorage. Optional: keep session writes via persistState
      // so in-tab undo/export still work, but next cold start uses defaults again.
    }

    // ========== SANITIZATION ==========
    function sanitizeHTML(html) {
      const d = new DOMParser().parseFromString(String(html || ''), 'text/html');
      d.querySelectorAll('script,iframe,object,embed,link,meta,base,form').forEach(n => n.remove());
      d.querySelectorAll('*').forEach(n => {
        [...n.attributes].forEach(a => {
          if (/^on/i.test(a.name) || a.name === 'srcdoc') n.removeAttribute(a.name);
        });
      });
      d.querySelectorAll('[href],[src]').forEach(n => {
        ['href', 'src'].forEach(k => {
          const v = n.getAttribute(k) || '';
          if (/^\s*(javascript:|vbscript:|data:text\/html)/i.test(v)) n.removeAttribute(k);
          // allow data:image/* for embedded lesson images
          if (k === 'src' && /^\s*data:/i.test(v) && !/^\s*data:image\//i.test(v)) n.removeAttribute(k);
        });
      });
      return d.body.innerHTML;
    }

    function sanitizeCSS(css) {
      return String(css || '')
        .replace(/@import\s+[^;]+;?/gi, '')
        .replace(/expression\s*\([^)]*\)/gi, '')
        .replace(/url\s*\(\s*['"]?\s*javascript:[^)]*\)/gi, '');
    }

    function formatTextWithHighlight(text) {
      return formatStoredRich(text || '');
    }

    function applyKeywordHighlight(html) {
      return String(html || '').replace(/\b(apple|egg|igloo|octopus|umbrella)\b/gi, m =>
        `<span class="highlight">${m}</span>`
      );
    }

    function formatStoredRich(text) {
      const raw = String(text || '');
      const looksHtml = /<\/?[a-z][\s\S]*>/i.test(raw);
      let html;
      if (looksHtml) {
        html = richTextToStored(raw);
      } else {
        html = escapeHtml(raw)
          .replace(/&lt;b&gt;/gi, '<b>').replace(/&lt;\/b&gt;/gi, '</b>')
          .replace(/&lt;i&gt;/gi, '<i>').replace(/&lt;\/i&gt;/gi, '</i>')
          .replace(/&lt;u&gt;/gi, '<u>').replace(/&lt;\/u&gt;/gi, '</u>')
          .replace(/&lt;strong&gt;/gi, '<strong>').replace(/&lt;\/strong&gt;/gi, '</strong>')
          .replace(/&lt;em&gt;/gi, '<em>').replace(/&lt;\/em&gt;/gi, '</em>');
      }
      return applyKeywordHighlight(html);
    }

    // ========== RENDER SECTION CONTENT ==========
    function renderSectionContent(section) {
      switch (section.type) {
        case 'tile': {
          const borderCss = imageBorderCss(section.imageBorder || 'none');
          const fit = section.imageFit === 'cover' ? 'cover' : 'contain';
          const iw = Math.max(40, Math.min(600, Number(section.imageWidth) || 160));
          const ih = Math.max(40, Math.min(600, Number(section.imageHeight) || 120));
          if ((section.tileMode || 'letter') === 'letter') {
            return `<div class="todays-sound-card">
              <div class="todays-sound-header">TODAY'S SOUND</div>
              <div class="todays-sound-body" data-view-img="tile" title="Tap to set image">
                <div class="todays-sound-stars">★ ★ ★</div>
                <div class="todays-sound-letter" style="font-size:${Math.min(96, Math.max(24, Number(section.letterFontSize) || 56))}px">${escapeHtml(section.letterTile || 'Aa')}</div>
              </div>
            </div>`;
          }
          const img = section.imagePath
            ? `<img class="todays-sound-img" src="${escapeHtml(section.imagePath)}" alt="" style="width:${iw}px;height:${ih}px;object-fit:${fit};${borderCss}" />`
            : `<div class="view-img-ph" style="width:${iw}px;height:${ih}px;${borderCss}">🖼️</div>`;
          return `<div class="todays-sound-card">
            <div class="todays-sound-header">${escapeHtml(section.imageCaption || "TODAY'S SOUND")}</div>
            <div class="todays-sound-body" data-view-img="tile" title="Tap to change image">${img}</div>
          </div>`;
        }
        case 'introText':
          return `<div class="cvc-intro-box"><p>${formatStoredRich(section.text || '')}</p></div>`;
        case 'instruction':
          return `<div class="cvc-instruction-box"><p>${formatStoredRich(section.text || '')}</p></div>`;
        case 'customText':
          return `<div class="custom-text-box"><p>${formatStoredRich(section.text || '')}</p></div>`;
        case 'wordGrid': {
          const columns = Math.max(1, Math.min(8, Number(section.columns) || 4));
          const rows = Math.max(1, Math.min(8, Number(section.rows) || 3));
          const words = (Array.isArray(section.words) ? section.words : []).slice(0, Math.min(MAX_GRID_WORDS, columns * rows));
          const total = Math.min(MAX_GRID_WORDS, columns * rows);
          let cells = '';
          for (let i = 0; i < total; i++) {
            const word = words[i] || '';
            const isLastCol = (i % columns) === columns - 1;
            const isLastRow = i >= total - columns;
            let style = '';
            if (!isLastCol) style += 'border-right:1px solid #f0c9a8;';
            else style += 'border-right:none;';
            if (!isLastRow) style += 'border-bottom:1px solid #f0c9a8;';
            else style += 'border-bottom:none;';
            cells += `<div class="word-cell${word ? '' : ' empty'}" style="${style}">${escapeHtml(word)}</div>`;
          }
          return `<div class="word-grid" style="grid-template-columns:repeat(${columns},1fr)">${cells}</div>`;
        }
        case 'decodable': {
          const sents = (section.sentences || []).filter(Boolean);
          if (!sents.length) return '';
          const lines = sents.map((s, i) => `<div class="sentence">${i + 1}. ${escapeHtml(s)}</div>`).join('');
          return `<div class="act-box"><div class="act-title">${escapeHtml(section.instruction || '')}</div>${lines}</div>`;
        }
        case 'fillBlanks': {
          const items = (section.items || []).filter(Boolean).slice(0, MAX_FILL_ITEMS);
          if (!items.length) return '';
          const cells = items.map(item => {
            let html = '';
            for (const ch of String(item)) {
              if (ch === '_') html += '<span class="blank-sq"></span>';
              else html += `<span>${escapeHtml(ch)}</span>`;
            }
            return `<div class="fill-item">${html}</div>`;
          }).join('');
          return `<div class="act-box"><div class="act-title">${escapeHtml(section.title || '')}</div><div class="fill-grid">${cells}</div></div>`;
        }
        case 'sentenceWriting': {
          const n = Math.max(1, Math.min(8, Number(section.lines) || 2));
          let lines = '';
          for (let i = 0; i < n; i++) lines += `<div class="sent-line">${i + 1}.</div>`;
          return `<div class="act-box"><div class="act-title">${escapeHtml(section.title || '')}</div><div class="sent-lines">${lines}</div></div>`;
        }
        case 'writingLines': {
          let lines = '';
          for (let i = 0; i < 3; i++) {
            lines += `<div class="writing-set">
              <div class="line l1"></div><div class="line l2"></div>
              <div class="line l3"></div><div class="line l4"></div>
            </div>`;
          }
          return `<div class="writing-lines-area">${lines}</div>`;
        }
        default:
          return '';
      }
    }

    function richTextToStored(html) {
      const d = new DOMParser().parseFromString(String(html || ''), 'text/html');
      const root = d.body || d;
      root.querySelectorAll('script,iframe,object,embed,link,meta,base,form').forEach(n => n.remove());
      // Only walk body descendants — never unwrap html/head/body (causes HierarchyRequestError)
      root.querySelectorAll('span.highlight').forEach(n => {
        const parent = n.parentNode;
        if (!parent || parent === d) return;
        while (n.firstChild) parent.insertBefore(n.firstChild, n);
        parent.removeChild(n);
      });
      // Snapshot list first; unwrap non-allowed tags inside body only
      const nodes = Array.from(root.querySelectorAll('*'));
      nodes.forEach(n => {
        if (!root.contains(n)) return;
        const tag = n.tagName.toLowerCase();
        if (tag === 'html' || tag === 'head' || tag === 'body') return;
        const keep = ['b','i','u','strong','em','br','span','img'];
        if (tag === 'img') {
          const src = n.getAttribute('src') || '';
          const alt = n.getAttribute('alt') || '';
          const style = n.getAttribute('style') || '';
          [...n.attributes].forEach(a => n.removeAttribute(a.name));
          if (src) n.setAttribute('src', src);
          if (alt) n.setAttribute('alt', alt);
          if (style) n.setAttribute('style', style);
          return;
        }
        if (tag === 'span') {
          const cls = n.getAttribute('class') || '';
          const style = n.getAttribute('style') || '';
          const isBox = cls.includes('view-img-box');
          [...n.attributes].forEach(a => n.removeAttribute(a.name));
          if (isBox) {
            n.setAttribute('class', 'view-img-box');
            if (style) n.setAttribute('style', style);
          }
          return;
        }
        [...n.attributes].forEach(a => {
          n.removeAttribute(a.name);
        });
        if (!keep.includes(tag)) {
          const parent = n.parentNode;
          if (!parent || parent === d) return;
          while (n.firstChild) parent.insertBefore(n.firstChild, n);
          parent.removeChild(n);
        }
      });
      return root.innerHTML
        .replace(/<div>/gi, '')
        .replace(/<\/div>/gi, '')
        .replace(/<p>/gi, '')
        .replace(/<\/p>/gi, '')
        .replace(/<br\s*\/?>/gi, '<br>')
        .trim();
    }

    function markSectionEditTargets(wrap, section) {
      const type = section && section.type;
      if (type === 'tile') {
        const letter = wrap.querySelector('.todays-sound-letter');
        if (letter) {
          letter.setAttribute('data-edit', 'plain');
          letter.setAttribute('data-field', 'letterTile');
        }
        const cap = wrap.querySelector('.todays-sound-header');
        if (cap && (section.tileMode || 'letter') === 'image') {
          cap.setAttribute('data-edit', 'plain');
          cap.setAttribute('data-field', 'imageCaption');
        }
      } else if (type === 'introText' || type === 'customText') {
        const p = wrap.querySelector('p');
        if (p) {
          p.setAttribute('data-edit', 'rich');
          p.setAttribute('data-field', 'text');
        }
      } else if (type === 'instruction') {
        const p = wrap.querySelector('p');
        if (p) {
          p.setAttribute('data-edit', 'rich');
          p.setAttribute('data-field', 'text');
        }
      } else if (type === 'wordGrid') {
        wrap.querySelectorAll('.word-cell').forEach((cell, i) => {
          cell.setAttribute('data-edit', 'plain');
          cell.setAttribute('data-field', 'word');
          cell.setAttribute('data-index', String(i));
        });
      } else if (type === 'decodable') {
        const title = wrap.querySelector('.act-title');
        if (title) {
          title.setAttribute('data-edit', 'plain');
          title.setAttribute('data-field', 'instruction');
        }
        wrap.querySelectorAll('.sentence').forEach((s, i) => {
          s.setAttribute('data-edit', 'plain');
          s.setAttribute('data-field', 'sentence');
          s.setAttribute('data-index', String(i));
        });
      } else if (type === 'fillBlanks' || type === 'sentenceWriting') {
        const title = wrap.querySelector('.act-title');
        if (title) {
          title.setAttribute('data-edit', 'plain');
          title.setAttribute('data-field', 'title');
        }
      }
    }

    function findPageFromEl(el) {
      const pageEl = el.closest('[data-page-id]');
      if (!pageEl) return null;
      return pages.find(p => p.id === pageEl.getAttribute('data-page-id')) || null;
    }

    function findSectionFromEl(el) {
      const page = findPageFromEl(el);
      if (!page || page.type !== 'structured') return { page: page, section: null };
      const secEl = el.closest('[data-section-id]');
      if (!secEl) return { page, section: null };
      const section = (page.sections || []).find(s => s.id === secEl.getAttribute('data-section-id')) || null;
      return { page, section };
    }

    function commitViewEdit(el) {
      if (!el || !el.hasAttribute('data-edit')) return;
      const field = el.getAttribute('data-field');
      const mode = el.getAttribute('data-edit');
      const plain = (el.textContent || '').replace(/\u00a0/g, ' ').trim();
      const rich = mode === 'html' ? sanitizeHTML(el.innerHTML) : richTextToStored(el.innerHTML);

      if (field === 'coverTitle') {
        const before = currentState();
        coverData.title = plain || coverData.title;
        const coverInput = document.getElementById('coverTitleInput');
        if (coverInput) coverInput.value = coverData.title;
        recordHistory(before, currentState());
        persistState();
        return;
      }
      if (field === 'coverSubtitle') {
        const before = currentState();
        coverData.subtitle = plain || coverData.subtitle;
        const coverInput = document.getElementById('coverSubtitleInput');
        if (coverInput) coverInput.value = coverData.subtitle;
        recordHistory(before, currentState());
        persistState();
        return;
      }
      if (field === 'sightWord') {
        const idx = Number(el.getAttribute('data-index'));
        const pageEl = el.closest('.page');
        const pills = pageEl ? [...pageEl.querySelectorAll('[data-field="sightWord"]')] : [];
        // Map this pill back to global sightWords by matching nearby group is hard;
        // store by scanning all view pills in order.
        const allPills = [...document.querySelectorAll('#viewContainer [data-field="sightWord"]')];
        const next = allPills.map(p => (p.textContent || '').replace(/\u00a0/g, ' ').trim()).filter(Boolean);
        const before = currentState();
        sightWords = next;
        const ta = document.getElementById('fSightWords');
        if (ta) ta.value = sightWords.join(', ');
        recordHistory(before, currentState());
        persistState();
        updateCounts();
        return;
      }

      const { page, section } = findSectionFromEl(el);
      if (!page) return;
      const before = currentState();

      if (field === 'mainTitle') {
        page.mainTitle = plain || page.mainTitle;
        if (page.name === 'Lesson Page' || page.name === 'Code Page') page.name = page.mainTitle;
      } else if (field === 'subtitle') {
        page.subtitle = plain;
      } else if (field === 'html' && page.type === 'code') {
        page.html = rich;
      } else if (section) {
        if (field === 'letterTile') section.letterTile = plain;
        else if (field === 'imageCaption') section.imageCaption = plain;
        else if (field === 'text') section.text = rich;
        else if (field === 'instruction') section.instruction = plain;
        else if (field === 'title') section.title = plain;
        else if (field === 'word') {
          const i = Number(el.getAttribute('data-index'));
          if (!Array.isArray(section.words)) section.words = [];
          while (section.words.length <= i) section.words.push('');
          section.words[i] = plain;
          el.classList.toggle('empty', !plain);
        } else if (field === 'sentence') {
          const i = Number(el.getAttribute('data-index'));
          if (!Array.isArray(section.sentences)) section.sentences = [];
          let val = plain.replace(/^\d+\.\s*/, '');
          while (section.sentences.length <= i) section.sentences.push('');
          section.sentences[i] = val;
        }
      }

      recordHistory(before, currentState());
      persistState();
      renderPageList();
      updateCounts();
    }

    function setViewEditingEnabled(on) {
      viewTextEditing = !!on;
      const container = document.getElementById('viewContainer');
      const bar = document.getElementById('rteBar');
      const toggle = document.getElementById('viewEditToggle');
      if (container) container.classList.toggle('editing-on', viewTextEditing);
      if (bar) bar.classList.toggle('visible', viewTextEditing);
      if (toggle) {
        toggle.className = viewTextEditing ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
        toggle.textContent = viewTextEditing ? '✏️ Editing on' : '✏️ Edit text';
      }
      document.querySelectorAll('#viewContainer [data-edit]').forEach(el => {
        el.contentEditable = viewTextEditing ? 'true' : 'false';
        el.spellcheck = true;
      });
    }

    function applyViewEditing() {
      const container = document.getElementById('viewContainer');
      if (!container || container.dataset.rteBound === '1') {
        setViewEditingEnabled(viewTextEditing);
        return;
      }
      container.dataset.rteBound = '1';
      container.addEventListener('focusin', (e) => {
        const t = e.target.closest && e.target.closest('[data-edit]');
        if (t) t.dataset.rteBefore = t.innerHTML;
      });
      container.addEventListener('focusout', (e) => {
        const t = e.target.closest && e.target.closest('[data-edit]');
        if (!t) return;
        if (t.dataset.rteBefore === t.innerHTML) return;
        commitViewEdit(t);
      });
      container.addEventListener('input', (e) => {
        const t = e.target.closest && e.target.closest('[data-edit]');
        if (!t) return;
        if (t.classList.contains('word-cell')) {
          const has = (t.textContent || '').replace(/\u00a0/g, ' ').trim();
          t.classList.toggle('empty', !has);
        }
      });
      container.addEventListener('keydown', (e) => {
        const t = e.target.closest && e.target.closest('[data-edit]');
        if (!t || !viewTextEditing) return;
        if (e.key === 'Enter' && t.getAttribute('data-edit') === 'plain') {
          e.preventDefault();
          t.blur();
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          if (t.dataset.rteBefore != null) t.innerHTML = t.dataset.rteBefore;
          t.blur();
          return;
        }
        const mod = e.ctrlKey || e.metaKey;
        if (mod && t.getAttribute('data-edit') !== 'plain') {
          const k = e.key.toLowerCase();
          if (k === 'b' || k === 'i' || k === 'u') {
            e.preventDefault();
            document.execCommand(k === 'b' ? 'bold' : k === 'i' ? 'italic' : 'underline');
          }
        }
      });
      container.addEventListener('click', (e) => {
        if (!viewTextEditing) return;
        const tileBody = e.target.closest && e.target.closest('[data-view-img="tile"]');
        if (tileBody) {
          e.preventDefault();
          e.stopPropagation();
          const { page, section } = findSectionFromEl(tileBody);
          if (!section) return;
          const img = tileBody.querySelector('img');
          openViewImageDialog({
            mode: 'tile',
            page,
            section,
            src: (img && img.getAttribute('src')) || section.imagePath || '',
            width: section.imageWidth || 160,
            height: section.imageHeight || 120,
            border: section.imageBorder || 'none',
            fit: section.imageFit || 'contain'
          });
          return;
        }
        const box = e.target.closest && e.target.closest('.view-img-box');
        if (box) {
          e.preventDefault();
          e.stopPropagation();
          const img = box.querySelector('img');
          const style = box.getAttribute('style') || '';
          const widthMatch = style.match(/width\s*:\s*(\d+)px/i);
          const heightMatch = style.match(/height\s*:\s*(\d+)px/i);
          let border = 'none';
          if (/dashed/i.test(style)) border = 'dashed';
          else if (/border-radius\s*:\s*12px/i.test(style)) border = 'rounded';
          else if (/border\s*:\s*4px/i.test(style)) border = 'thick';
          else if (/border\s*:\s*2px\s+solid/i.test(style)) border = 'thin';
          const fit = /object-fit\s*:\s*cover/i.test((img && img.getAttribute('style')) || '') ? 'cover' : 'contain';
          const editableEl = box.closest('[data-edit], .code-inner');
          openViewImageDialog({
            mode: 'edit-inline',
            boxEl: box,
            editableEl,
            src: (img && img.getAttribute('src')) || '',
            width: widthMatch ? parseInt(widthMatch[1], 10) : 200,
            height: heightMatch ? parseInt(heightMatch[1], 10) : 150,
            border,
            fit
          });
          return;
        }

        // Code pages only: click empty body space → insert element menu
        // (structured pages intentionally ignored)
        if (codeInsertMenuEl && codeInsertMenuEl.contains(e.target)) return;
        const codeInner = e.target.closest && e.target.closest('.code-inner');
        const codeArea = e.target.closest && e.target.closest('.code-content-area');
        if (codeInner || codeArea) {
          const inner = codeInner || (codeArea && codeArea.querySelector('.code-inner'));
          if (inner && isCodePageEmptyClick(e.target, inner, e.clientX, e.clientY)) {
            // Don't steal clicks when user is selecting text
            const sel = window.getSelection();
            if (sel && !sel.isCollapsed && inner.contains(sel.anchorNode)) return;
            e.preventDefault();
            const pageEl = inner.closest('[data-page-id]');
            const pageId = pageEl ? pageEl.getAttribute('data-page-id') : null;
            const page = pageId ? pages.find(p => p.id === pageId) : null;
            openCodeInsertMenu({
              inner,
              page,
              clientX: e.clientX,
              clientY: e.clientY
            });
          }
        }
      });
      setViewEditingEnabled(viewTextEditing);
    }

    window.toggleViewTextEditing = function () {

      showToast(viewTextEditing ? 'Click any text on a page to edit. Use B / I / U for rich text.' : 'View editing off.', 'info');

    // ========== CODE PAGE: empty-space insert menu ==========

      { id: 'h3', label: 'Heading 3', icon: 'H3', html: '<h3>Heading</h3>' },

      { id: 'fill', label: 'Fill-in-blanks', icon: '⬜', html: '<div class="act-box"><div class="act-title">Fill in the missing letters</div><div class="fill-grid"><div class="fill-item">c<span class="blank-sq"></span>t</div><div class="fill-item">m<span class="blank-sq"></span>t</div><div class="fill-item">h<span class="blank-sq"></span>t</div></div></div>' },

      { id: 'sep3', sep: true },

      { id: 'ol', label: 'Numbered list', icon: '1.', html: '<ol><li>First</li><li>Second</li><li>Third</li></ol>' },
      { id: 'hr', label: 'Divider line', icon: '—', html: '<hr style="border:none;border-top:2px solid #F5A623;margin:16px 0;">' },
