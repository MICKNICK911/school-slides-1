<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📚 Phonics Grid Publisher — Word‑Like Formatting (Fixed)</title>
<style>
@page { size: 850px 1100px; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #f0f2f5; color: #1a1a1a; padding: 16px; }
.app { max-width: 1600px; margin: 0 auto; background: #fff; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); overflow: hidden; }
.app-header { background: #1a1a2e; color: #fff; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.app-header h1 { font-size: 22px; font-weight: 800; }
.badge { background: #F5A623; color: #1a1a1a; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: 700; }
.tabs { display: flex; border-bottom: 2px solid #e9ecef; background: #fafbfc; padding: 0 24px; }
.tab-btn { padding: 14px 24px; border: none; background: transparent; font-size: 14px; font-weight: 700; color: #6c757d; cursor: pointer; border-bottom: 3px solid transparent; font-family: inherit; }
.tab-btn.active { color: #1a1a2e; border-bottom-color: #F5A623; }
.tab-panel { display: none; padding: 20px 24px 28px; }
.tab-panel.active { display: block; }

.toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: 380px; pointer-events: none; }
.toast { padding: 12px 18px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 8px; pointer-events: auto; animation: slideIn 0.25s ease; }
.toast.success { background: #2d7d46; } .toast.error { background: #dc3545; } .toast.warning { background: #e67e22; } .toast.info { background: #2c7be5; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

.btn { padding: 9px 18px; border: none; border-radius: 9px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: #F5A623; color: #1a1a1a; }
.btn-success { background: #2d7d46; color: #fff; }
.btn-danger { background: #dc3545; color: #fff; }
.btn-outline { background: transparent; border: 2px solid #dee2e6; color: #495057; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-xs { padding: 4px 9px; font-size: 11px; border-radius: 6px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.editor-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 2px solid #e9ecef; }
.editor-toolbar .info { font-weight: 700; color: #6c757d; font-size: 13px; margin-right: auto; }

/* ===== Accordion Styles ===== */
.accordion-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
    padding: 12px 16px;
    background: #f8f9fa;
    border-radius: 10px;
    border: 2px solid #e9ecef;
    transition: background 0.2s;
    user-select: none;
    margin-bottom: 4px;
}
.accordion-header:hover { background: #f1f3f5; }
.accordion-header .block-summary {
    flex: 1;
    font-weight: 600;
    font-size: 13px;
    color: #333;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.accordion-header .block-type-badge {
    background: #E2571C;
    color: #fff;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
}
.accordion-content {
    padding: 16px;
    background: #fff;
    border: 2px solid #e9ecef;
    border-top: none;
    border-radius: 0 0 10px 10px;
    margin-bottom: 14px;
    display: none;
}
.accordion-content.visible { display: block; }
.block-card { margin-bottom: 12px; }
.block-card.expanded .accordion-header {
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    border-color: #F5A623;
}

/* ===== Two-Step Active Card ===== */
.active-step { display: none; }
.active-step.visible { display: block; }
.step-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 13px;
    font-weight: 700;
    color: #6c757d;
}
.step-indicator .step-number {
    background: #F5A623;
    color: #1a1a1a;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
}

/* ===== Dropdown Selects ===== */
.select-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-right: 8px;
}
.select-group label {
    font-size: 11px;
    font-weight: 700;
    color: #6c757d;
    white-space: nowrap;
}
.select-group select {
    padding: 6px 8px;
    border: 1px solid #ced4da;
    border-radius: 6px;
    font-size: 12px;
    background: #fff;
    font-family: inherit;
    cursor: pointer;
    min-width: 90px;
}

/* ===== Thumbnail ===== */
.thumbnail-wrapper {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fff;
    padding: 10px 0;
    border-bottom: 2px solid #e9ecef;
    margin-bottom: 16px;
}
.thumbnail-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}
.thumbnail-label { font-size: 13px; font-weight: 700; color: #E2571C; }
.thumbnail-page-num { font-size: 12px; color: #6c757d; }
.thumbnail-container {
    width: 220px;
    height: 285px;
    overflow: hidden;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    background: #fff;
    position: relative;
    cursor: pointer;
}
.thumbnail-inner {
    position: absolute;
    top: 0;
    left: 0;
    width: 850px;
    height: 1100px;
    transform-origin: top left;
}

/* ===== Existing Block / Grid / View Styles ===== */
.block-card .grid-label { font-size: 12px; font-weight: 700; color: #6c757d; margin-bottom: 4px; }
.radio-grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px;
    background: #fff; padding: 6px; border-radius: 10px; border: 2px solid #dee2e6;
    max-width: 360px; margin: 0 auto;
}
.radio-grid .cell {
    aspect-ratio: 1; border: 1px solid #ced4da; border-radius: 3px; background: #f1f3f5;
    cursor: pointer; transition: background 0.15s, border-color 0.15s; position: relative;
}
.radio-grid .cell:hover:not(.used):not(.invalid) { background: #ffe8a3; border-color: #F5A623; }
.radio-grid .cell.selected { background: #F5A623; border-color: #E2571C; }
.radio-grid .cell.used { background: #ffc9c9; border-color: #e03131; cursor: not-allowed; }
.radio-grid .cell.invalid { background: #ffc9c9; border-color: #fa5252; }
.validation-msg { font-size: 12px; font-weight: 600; color: #e03131; min-height: 18px; }

.fmt-toolbar {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 8px; background: #fff; border: 2px solid #dee2e6; border-radius: 8px;
}
.fmt-toolbar .sep { width: 1px; height: 22px; background: #dee2e6; margin: 0 2px; }
.fmt-toolbar input[type="color"] { width: 32px; height: 32px; border: 1px solid #ced4da; border-radius: 6px; padding: 2px; cursor: pointer; }
.fmt-btn {
    width: 32px; height: 32px; border: 1px solid #ced4da; border-radius: 6px;
    background: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; font-family: inherit;
}
.fmt-btn:hover { border-color: #F5A623; }
.align-group { display: flex; gap: 4px; flex-wrap: wrap; }

.edit-panel { grid-column: 1 / -1; background: #fff; border: 2px solid #F5A623; border-radius: 10px; padding: 14px; margin-top: 6px; }
.summary-text { font-size: 13px; font-weight: 600; color: #333; white-space: pre-wrap; max-height: 60px; overflow: hidden; }
.rich-editor {
    min-height: 180px; padding: 8px 12px; border: 2px solid #dee2e6; border-radius: 8px;
    font-size: 13px; line-height: 1.4; background: #fff; overflow-y: auto; word-break: break-word;
}
.rich-editor:focus { outline: none; border-color: #F5A623; }
.preview-box {
    border: 2px dashed #dee2e6;
    border-radius: 8px;
    padding: 8px;
    background: #f8f9fa;
    min-height: 60px;
    margin-top: 6px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

/* ===== View / Print Styles (print-ready) ===== */
.view-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #e9ecef; }
.view-toolbar .info { font-weight: 700; color: #6c757d; font-size: 13px; margin-right: auto; }
.view-container { overflow-x: auto; }
.view-container .page {
    width: 850px;
    height: 1100px;
    min-width: 850px;
    min-height: 1100px;
    padding: 0;
    margin: 0 auto 24px;
    background: #fff;
    border-radius: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    position: relative;
    box-sizing: border-box;
    page-break-after: always;
}
.view-container .page:last-child { page-break-after: auto; }
.page-card {
    border: 4px solid #E2571C;
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: #fff;
    box-sizing: border-box;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}
.page-card {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
.page-header { display: flex; align-items: stretch; border-bottom: 3px solid #E2571C; height: 64px; box-sizing: border-box; }
.page-header-left { flex: 1; padding: 10px 20px; display: flex; flex-direction: column; justify-content: center; }
.page-header-left h1 { font-size: 26px; font-weight: 800; color: #E2571C; margin: 0; line-height: 1.1; }
.page-header-left .sub { font-size: 12px; font-weight: 700; color: #c45a12; letter-spacing: 1px; text-transform: uppercase; }
.page-header-right {
    background: #E2571C; color: #fff; min-width: 140px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.page-header-right .lbl { font-size: 12px; font-weight: 600; }
.page-header-right .num { font-size: 24px; font-weight: 800; }
.grid-stage {
    position: absolute; top: 64px; left: 0; right: 0; bottom: 36px;
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(12, 1fr);
    gap: 0; padding: 12px 16px; box-sizing: border-box;
}
.block { position: relative; overflow: hidden; display: flex; padding: 6px; background: #fff; }
.block.has-border { border: 2px solid #E2571C; border-radius: 8px; margin: 2px; }
.block .block-text { width: 100%; height: 100%; line-height: 1.35; word-break: break-word; color: #1a1a1a; font-weight: 400; }
.block .block-text p { margin: 0 0 0.4em 0; }
.block .block-text p:last-child { margin-bottom: 0; }
.block .block-text ul, .block .block-text ol { margin: 0.2em 0 0.4em 0; padding-left: 1.4em; }
.block .block-text li { margin-bottom: 0.15em; }
.block .block-img { max-width: 100%; max-height: 100%; border-radius: 4px; }
.block .block-img-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; gap: 4px; overflow: hidden;
}
.block .block-img-label { font-size: 13px; font-weight: 700; color: #1a1a1a; text-align: center; line-height: 1.2; max-width: 100%; word-break: break-word; }
.block .trace-wrap { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-evenly; padding: 2px 4px; box-sizing: border-box; }
.block .trace-set { position: relative; width: 100%; flex: 1; min-height: 0; margin: 2px 0; }
.block .trace-set .tline { position: absolute; left: 0; right: 0; height: 0; border-top-width: 1.5px; border-top-style: solid; }
.block .trace-set .tline.red { border-top-color: #e03131; }
.block .trace-set .tline.blue { border-top-color: #1c7ed6; }
.block .trace-set .trace-letters {
    position: absolute; left: 0; right: 0; top: 33.333%; bottom: 33.333%;
    display: flex; align-items: flex-end; justify-content: center; gap: 12px;
    pointer-events: none; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 400; line-height: 1; color: #868e96; font-size: 36px;
}
.block .trace-set .trace-letters.outlined { color: transparent; -webkit-text-stroke: 1.3px #868e96; }
.block .inner-table { width: 100%; height: 100%; display: grid; gap: 0; box-sizing: border-box; }
.block .inner-table .it-cell {
    display: flex; align-items: center; justify-content: center; text-align: center;
    overflow: hidden; padding: 2px; font-family: inherit; line-height: 1.2; word-break: break-word; box-sizing: border-box;
}
.block .inner-table.has-borders .it-cell { border: 1px solid #adb5bd; }
.mini-table { display: grid; gap: 2px; background: #dee2e6; border: 2px solid #dee2e6; border-radius: 8px; overflow: hidden; max-width: 100%; }
.mini-table .mt-cell {
    background: #f1f3f5; min-height: 28px; padding: 4px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; cursor: pointer; text-align: center; word-break: break-word; line-height: 1.15;
    border: 2px solid transparent; user-select: none;
}
.mini-table .mt-cell.selected { border-color: #F5A623; background: #fff3bf; }
.page-number { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 13px; color: #6c757d; }
.worksheet-lines { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 1; }
.worksheet-lines .red-margin { position: absolute; left: 40px; top: 0; bottom: 0; width: 2px; background: #e03131; }
.worksheet-lines .blue-line {
    position: absolute; left: 0; right: 0; height: 0;
    border-top: 1px solid #74c0fc; border-bottom: 1px solid #74c0fc; background: #74c0fc; opacity: 0.5;
}
.page-actions { text-align: right; margin-bottom: 6px; }
.export-btn { background: #E2571C; color: #fff; border: none; border-radius: 7px; padding: 7px 14px; font-weight: 700; font-size: 12px; cursor: pointer; font-family: inherit; }

/* ===== Print Media ===== */
@media print {
    body { padding: 0; background: #fff; }
    .app, .app-header, .tabs, .tab-panel, .view-toolbar, .no-print { display: none !important; }
    .view-container { overflow: visible !important; margin: 0; padding: 0; }
    .view-container .page {
        box-shadow: none !important; border-radius: 0 !important; margin: 0 !important; padding: 0 !important;
        page-break-after: always; width: 850px; height: 1100px;
    }
    .view-container .page:last-child { page-break-after: auto; }
    .view-container .page .page-actions { display: none !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .block .trace-set .trace-letters.outlined { -webkit-text-stroke: 1.1px #495057; }
    .block .trace-set .tline { border-top-width: 1.25px; }
    .worksheet-lines { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
    .thumbnail-container { width: 160px; height: 207px; }
    .thumbnail-inner { transform: scale(0.1882); } /* 160/850 */
    .accordion-header { padding: 10px 12px; }
    .accordion-content { padding: 12px; }
    .block-card .grid-preview, .block-card .block-left, .block-card .block-right {
        grid-column: 1 / -1; width: 100%;
    }
    .radio-grid { grid-template-columns: repeat(8, 1fr); gap: 2px; max-width: 100%; }
    .select-group { width: 100%; }
    .select-group select { flex: 1; }
    .app-header h1 { font-size: 18px; }
    .tab-btn { padding: 10px 12px; font-size: 12px; }
    .tab-panel { padding: 14px 12px 20px; }
}
</style>

<body>
<div id="app"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
(function () {
    // ========== INDEXEDDB ==========
    const DB_NAME = 'phonics_grid_db';
    const DB_VERSION = 1;
    const STORE_NAME = 'lessons';
    let db = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = (e) => {
                const database = e.target.result;
                if (!database.objectStoreNames.contains(STORE_NAME)) {
                    database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                }
            };
            request.onsuccess = (e) => resolve(e.target.result);
            request.onerror = (e) => reject(e.target.error);
        });
    }

    async function saveToDB(data) {
        if (!db) db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.put({ id: 'app_data', nextId: data.nextId, lessons: data.lessons });
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e.target.error);
        });
    }

    async function loadFromDB() {
        if (!db) db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const request = store.get('app_data');
            request.onsuccess = () => resolve(request.result || null);
            request.onerror = (e) => reject(e.target.error);
        });
    }

    // ========== UTILITIES ==========
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function escapeStyle(s) {
        return String(s).replace(/[&<>"'\\\n\r]/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '\\"', "'": "\\'",
            '\\': '\\\\', '\n': '\\A ', '\r': '\\D '
        }[ch] || ''));
    }
    function showToast(msg, type = 'info') {
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        t.innerHTML = `<span>${type==='success'?'✅':type==='error'?'❌':type==='warning'?'⚠️':'ℹ️'}</span> ${escapeHtml(msg)}`;
        document.getElementById('toastContainer').appendChild(t);
        setTimeout(() => t.remove(), 3200);
    }

    function sanitizeHTML(html) {
        const template = document.createElement('template');
        template.innerHTML = html;
        function clean(node) {
            if (node.nodeType === Node.ELEMENT_NODE) {
                if (node.tagName === 'SCRIPT') { node.remove(); return; }
                for (const attr of [...node.attributes]) {
                    const name = attr.name.toLowerCase();
                    const val = (attr.value || '').toLowerCase();
                    if (name.startsWith('on') || (name === 'href' && val.startsWith('javascript:'))) {
                        node.removeAttribute(attr.name);
                    } else if (name === 'style') {
                        const allowed = ['color','background-color','background','font-weight','font-style','text-decoration','font-size','font-family','line-height'];
                        const cleanStyle = attr.value.split(';').filter(decl => {
                            const prop = decl.split(':')[0].trim().toLowerCase();
                            return allowed.includes(prop);
                        }).join(';');
                        node.setAttribute('style', cleanStyle);
                    }
                }
                [...node.childNodes].forEach(clean);
            }
        }
        clean(template.content);
        return template.innerHTML;
    }
    window.sanitizeHTML = sanitizeHTML;

    // ========== DATA ==========
    const COLS = 8;
    const ROWS = 12;
    const TOTAL = COLS * ROWS;

    let lessons = [];
    let currentLessonId = null;
    let currentPageIndex = 0;
    let history = [];
    let historyIndex = -1;
    let nextId = 1;
    let expandedBlockIdx = null;
    let blockConfigStep = 1;
    let tableSel = new Set();
    let _editTextHistoryTimer = null;
    let _thumbnailTimer = null;
    let savedRange = null; // For Word‑like formatting

    function generateUniqueId() {
        let id;
        do { id = 'l' + (nextId++); } while (lessons.some(l => l.id === id));
        return id;
    }

    function defaultPage() {
        return {
            title: 'SHORT VOWEL CVC WORDS', subtitle: 'SHORT VOWEL', lessonNumber: 1,
            blocks: [], usedCells: new Set(), locked: false,
            worksheetEnabled: false, worksheetCount: 1
        };
    }
    function defaultLesson() {
        return { id: generateUniqueId(), title: 'SHORT VOWEL CVC WORDS', subtitle: 'SHORT VOWEL', pages: [defaultPage()] };
    }

    // ========== GRID / TABLE HELPERS ==========
    function cellKey(r, c) { return r + ',' + c; }
    function parseKey(k) { const [r, c] = k.split(',').map(Number); return { r, c }; }
    function isRectangle(selectedKeys) {
        if (!selectedKeys.size) return false;
        const cells = Array.from(selectedKeys).map(parseKey);
        const rows = cells.map(c => c.r), cols = cells.map(c => c.c);
        const minR = Math.min(...rows), maxR = Math.max(...rows);
        const minC = Math.min(...cols), maxC = Math.max(...cols);
        const expected = (maxR - minR + 1) * (maxC - minC + 1);
        if (selectedKeys.size !== expected) return false;
        for (let r = minR; r <= maxR; r++) for (let c = minC; c <= maxC; c++) if (!selectedKeys.has(cellKey(r, c))) return false;
        return { minR, maxR, minC, maxC, rowSpan: maxR - minR + 1, colSpan: maxC - minC + 1 };
    }

    function tKey(r, c) { return r + ',' + c; }
    function parseTKey(k) { const [r, c] = k.split(',').map(Number); return { r, c }; }
    function initTableCells(tableRows, tableCols) {
        const cells = [];
        for (let r = 0; r < tableRows; r++) for (let c = 0; c < tableCols; c++) {
            cells.push({ r, c, rowSpan:1, colSpan:1, text:'', bg:'#f1f3f5', fontSize:14, bold:false, italic:false });
        }
        return cells;
    }
    function findTableCellAt(cells, r, c) {
        for (const cell of cells) if (r >= cell.r && r < cell.r + cell.rowSpan && c >= cell.c && c < cell.c + cell.colSpan) return cell;
        return null;
    }
    function coveredKeys(cell) {
        const keys = [];
        for (let r = cell.r; r < cell.r + cell.rowSpan; r++) for (let c = cell.c; c < cell.c + cell.colSpan; c++) keys.push(tKey(r, c));
        return keys;
    }
    function isTableRect(selectedKeys) { return isRectangle(selectedKeys); }

    // ========== STORAGE ==========
    function rebuildUsedCells(page) {
        const used = new Set();
        (page.blocks || []).forEach(b => {
            for (let r = b.row; r < b.row + b.rowSpan; r++) for (let c = b.col; c < b.col + b.colSpan; c++) used.add(cellKey(r, c));
        });
        page.usedCells = used;
    }

    function validateAndNormalizeLesson(src) {
        const lesson = { id: src.id ? String(src.id) : generateUniqueId(), title: (src.title || 'Untitled') + '', subtitle: (src.subtitle || '') + '', pages: [] };
        const pagesIn = Array.isArray(src.pages) ? src.pages : [];
        pagesIn.forEach((p, i) => {
            const page = {
                title: p.title || 'UNTITLED', subtitle: p.subtitle || '',
                lessonNumber: (Number.isFinite(parseInt(p.lessonNumber)) && parseInt(p.lessonNumber) > 0) ? parseInt(p.lessonNumber) : (i + 1),
                locked: !!p.locked, blocks: [], usedCells: new Set(),
                worksheetEnabled: !!p.worksheetEnabled, worksheetCount: Math.max(1, parseInt(p.worksheetCount) || 1)
            };
            if (Array.isArray(p.blocks)) {
                p.blocks.forEach(b => {
                    const nb = JSON.parse(JSON.stringify(b));
                    nb.row = Math.max(0, parseInt(nb.row) || 0);
                    nb.col = Math.max(0, parseInt(nb.col) || 0);
                    nb.rowSpan = Math.max(1, parseInt(nb.rowSpan) || 1);
                    nb.colSpan = Math.max(1, parseInt(nb.colSpan) || 1);
                    if (!['text','image','trace','table'].includes(nb.type)) { nb.type = 'text'; nb.text = nb.text || ''; }
                    if (nb.type === 'table') {
                        nb.tableRows = Math.max(1, parseInt(nb.tableRows) || (nb.rowSpan * 2));
                        nb.tableCols = Math.max(1, parseInt(nb.tableCols) || nb.colSpan);
                        nb.tableShowBorders = nb.tableShowBorders !== false;
                        if (!Array.isArray(nb.cells) || nb.cells.length === 0) nb.cells = initTableCells(nb.tableRows, nb.tableCols);
                        else {
                            const covered = new Set(); const cleanedCells = [];
                            nb.cells.forEach(cell => {
                                cell.r = Math.max(0, parseInt(cell.r) || 0); cell.c = Math.max(0, parseInt(cell.c) || 0);
                                cell.rowSpan = Math.max(1, parseInt(cell.rowSpan) || 1); cell.colSpan = Math.max(1, parseInt(cell.colSpan) || 1);
                                cell.rowSpan = Math.min(cell.rowSpan, nb.tableRows - cell.r);
                                cell.colSpan = Math.min(cell.colSpan, nb.tableCols - cell.c);
                                if (cell.rowSpan < 1 || cell.colSpan < 1) return;
                                cell.text = cell.text || ''; cell.bg = cell.bg || '#f1f3f5';
                                cell.fontSize = Math.min(22, Math.max(10, parseInt(cell.fontSize) || 14));
                                cell.bold = !!cell.bold; cell.italic = !!cell.italic;
                                let overlap = false;
                                for (let r = cell.r; r < cell.r + cell.rowSpan; r++) {
                                    for (let c = cell.c; c < cell.c + cell.colSpan; c++) {
                                        const key = tKey(r, c);
                                        if (covered.has(key)) { overlap = true; break; }
                                        covered.add(key);
                                    }
                                    if (overlap) break;
                                }
                                if (!overlap) cleanedCells.push(cell);
                            });
                            for (let r = 0; r < nb.tableRows; r++) for (let c = 0; c < nb.tableCols; c++) {
                                if (!covered.has(tKey(r, c))) cleanedCells.push({ r, c, rowSpan:1, colSpan:1, text:'', bg:'#f1f3f5', fontSize:14, bold:false, italic:false });
                            }
                            nb.cells = cleanedCells;
                        }
                    }
                    if (nb.type === 'text') {
                        nb.fontSize = Math.max(1, parseInt(nb.fontSize) || 18);
                        nb.color = nb.color || '#1a1a1a';
                        nb.textAlign = nb.textAlign || 'center';
                        nb.verticalAlign = nb.verticalAlign || 'center';
                        nb.bold = !!nb.bold; nb.italic = !!nb.italic; nb.underline = !!nb.underline;
                        nb.richText = !!nb.richText || /<[a-z][\s\S]*>/i.test(nb.text || '');
                        if (nb.richText) nb.text = sanitizeHTML(nb.text || '');
                        nb.lineHeight = Math.min(3, Math.max(0.5, parseFloat(nb.lineHeight) || 1.35));
                        nb.fontFamily = nb.fontFamily || '';
                    } else if (nb.type === 'image') {
                        nb.imageAlign = nb.imageAlign || 'center';
                        nb.imageVerticalAlign = nb.imageVerticalAlign || 'center';
                        nb.imageFit = nb.imageFit || 'contain';
                        nb.imageScale = Math.min(200, Math.max(10, parseInt(nb.imageScale) || 100));
                        nb.imageLabelOn = !!nb.imageLabelOn;
                        nb.imageLabel = nb.imageLabel || '';
                    } else if (nb.type === 'trace') {
                        nb.traceTarget = nb.traceTarget || '';
                        nb.traceStyle = nb.traceStyle === 'solid' ? 'solid' : 'outlined';
                        nb.traceClones = Math.min(20, Math.max(1, parseInt(nb.traceClones) || 5));
                        nb.traceRepeatAll = nb.traceRepeatAll !== false;
                    }
                    page.blocks.push(nb);
                });
            }
            rebuildUsedCells(page);
            lesson.pages.push(page);
        });
        if (!lesson.pages.length) lesson.pages = [defaultPage()];
        return lesson;
    }

    async function load() {
        try {
            const stored = await loadFromDB();
            if (stored && Array.isArray(stored.lessons) && stored.lessons.length > 0) {
                nextId = Number(stored.nextId) || 1;
                lessons = stored.lessons.map(src => validateAndNormalizeLesson(src));
                const seenIds = new Set();
                lessons.forEach(l => { while (seenIds.has(l.id)) l.id = generateUniqueId(); seenIds.add(l.id); });
                currentLessonId = lessons[0].id;
                currentPageIndex = 0;
                return;
            }
        } catch (e) { console.warn('IndexedDB load failed', e); }
        nextId = 1;
        const l = defaultLesson();
        lessons = [l];
        currentLessonId = l.id;
        currentPageIndex = 0;
        await save();
    }

    async function save() {
        try {
            const toSave = {
                nextId,
                lessons: lessons.map(l => ({
                    ...l,
                    pages: l.pages.map(p => ({
                        ...p,
                        usedCells: Array.from(p.usedCells || []),
                        worksheetEnabled: p.worksheetEnabled || false,
                        worksheetCount: p.worksheetCount || 1
                    }))
                }))
            };
            await saveToDB(toSave);
        } catch (e) {
            console.error('Save failed:', e);
            showToast('Storage error: could not save data', 'error');
        }
    }

    function pushHistory() {

        if (_thumbnailTimer) { clearTimeout(_thumbnailTimer); _thumbnailTimer = null; }
        const snapshot = JSON.parse(JSON.stringify({
            title: page.title, subtitle: page.subtitle, lessonNumber: page.lessonNumber,
            locked: page.locked, blocks: page.blocks, usedCells: Array.from(page.usedCells),
            worksheetEnabled: page.worksheetEnabled, worksheetCount: page.worksheetCount
        }));
        history = history.slice(0, historyIndex + 1);

        applySnapshot(history[historyIndex]);
        expandedBlockIdx = null;

        if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }

    window.redo = function () {

        if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }
        if (_thumbnailTimer) { clearTimeout(_thumbnailTimer); _thumbnailTimer = null; }

    function applySnapshot(snap) {

    // ========== TEXT HELPERS ==========
    function textToHtml(text) {
        if (!text) return '';
        const lines = String(text).split('\n');
        let html = '';
        let i = 0;
        while (i < lines.length) {
            const line = lines[i];
            const bulletMatch = line.match(/^\s*[-*]\s+(.*)$/);
            const numMatch = line.match(/^\s*\d+\.\s+(.*)$/);
            if (bulletMatch) {
                html += '<ul>';
                while (i < lines.length) {
                    const m = lines[i].match(/^\s*[-*]\s+(.*)$/);
                    if (!m) break;
                    html += '<li>' + escapeHtml(m[1]) + '</li>';
                    i++;
                }
                html += '</ul>';
            } else if (numMatch) {
                html += '<ol>';
                while (i < lines.length) {
                    const m = lines[i].match(/^\s*\d+\.\s+(.*)$/);
                    if (!m) break;
                    html += '<li>' + escapeHtml(m[1]) + '</li>';
                    i++;
                }
                html += '</ol>';
            } else {
                let para = [];
                while (i < lines.length) {
                    if (/^\s*[-*]\s+/.test(lines[i]) || /^\s*\d+\.\s+/.test(lines[i])) break;
                    para.push(escapeHtml(lines[i]));
                    i++;
                }
                const joined = para.join('<br>');
                if (joined.trim() !== '') html += '<p>' + joined + '</p>';
                else if (para.length) html += '<p><br></p>';
            }
        }
        return html || '<p></p>';
    }

    // ========== SELECTION SAVING ==========
    window.saveSelectionFromEditor = function(editor) {
        const selection = window.getSelection();
        if (selection.rangeCount > 0 && !selection.isCollapsed) {
            const range = selection.getRangeAt(0);
            if (editor.contains(range.commonAncestorContainer)) {
                savedRange = range.cloneRange();
            }
        }
    };

    function selectionHandler(e) {
        const editor = e.currentTarget;
        window.saveSelectionFromEditor(editor);
    }

    function attachSelectionListeners() {
        const editors = document.querySelectorAll('.rich-editor');
        editors.forEach(editor => {
            editor.removeEventListener('mouseup', selectionHandler);
            editor.removeEventListener('keyup', selectionHandler);
            editor.addEventListener('mouseup', selectionHandler);
            editor.addEventListener('keyup', selectionHandler);
        });
    }

    function restoreSelection(editor) {
        if (savedRange && editor.contains(savedRange.commonAncestorContainer)) {
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(savedRange.cloneRange());
            return true;
        }
        return false;
    }

    // ========== FORMATTING FUNCTIONS (Word‑like) ==========
    window.execInline = function (prefix, command, value = null) {
        let editor;
        if (prefix === 'active') editor = document.getElementById('activeText');
        else if (prefix === 'edit') editor = document.getElementById('editText');
        if (!editor) return;

        const restored = restoreSelection(editor);
        if (!restored) {
            editor.focus();
        }
        document.execCommand(command, false, value);

        if (prefix === 'active') {
            window.activeText = sanitizeHTML(editor.innerHTML);
            window.activeRichText = true;
            updatePreview('active');
        } else if (prefix === 'edit' && expandedBlockIdx !== null) {
            const page = getCurrentPage();
            if (!page) return;
            const b = page.blocks[expandedBlockIdx];
            if (!b || b.type !== 'text') return;
            pushHistory();
            b.text = sanitizeHTML(editor.innerHTML);
            b.richText = true;
            save();
            updatePreview('edit');
            updateThumbnail();
            renderView();
        }
    };

    window.applyInlineSizePreset = function(prefix, size) {
        const editor = (prefix === 'active') ? document.getElementById('activeText') : document.getElementById('editText');
        if (!editor) return;
        const restored = restoreSelection(editor);
        if (!restored) {
            editor.focus();
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) {
                showToast('Select text first', 'warning');
                return;
            }
        }
        const selection = window.getSelection();
        if (selection.rangeCount && !selection.isCollapsed) {
            const range = selection.getRangeAt(0);
            if (!editor.contains(range.commonAncestorContainer)) return;
            const span = document.createElement('span');
            span.style.fontSize = size + 'px';
            try {
                range.surroundContents(span);
            } catch (e) {
                const fragment = range.extractContents();
                span.appendChild(fragment);
                range.insertNode(span);
            }
            selection.removeAllRanges();
            editor.focus();

            if (prefix === 'active') {
                window.activeText = sanitizeHTML(editor.innerHTML);
                window.activeRichText = true;
                updatePreview('active');
            } else if (prefix === 'edit' && expandedBlockIdx !== null) {
                const page = getCurrentPage();
                if (page && page.blocks[expandedBlockIdx]) {
                    pushHistory();
                    page.blocks[expandedBlockIdx].text = sanitizeHTML(editor.innerHTML);
                    page.blocks[expandedBlockIdx].richText = true;
                    save();
                    updatePreview('edit');
                    updateThumbnail();
                    renderView();
                }
            }
        }
    };

                        <option value="24">M</option>

            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;">
                <div>
                    <label>Horizontal</label>

                        <select onchange="setAlign('${prefix}','textAlign',this.value)">
                            <option value="left" ${state.textAlign==='left'?'selected':''}>Left</option>
                            <option value="center" ${state.textAlign==='center'?'selected':''}>Center</option>
                            <option value="right" ${state.textAlign==='right'?'selected':''}>Right</option>
                            <option value="justify" ${state.textAlign==='justify'?'selected':''}>Justify</option>

                        </select>
                    </div>
                </div>
            </div>
        `;
    }

    function imageControlsHtml(prefix, state) {
        return `
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;">
                <div>
                    <label>Horizontal</label>
                    <div class="align-group">
                        <select onchange="setImgAlign('${prefix}','imageAlign',this.value)">

                    <label>Vertical</label>

                        <select onchange="setImgAlign('${prefix}','imageVerticalAlign',this.value)">

                <div>

                </div>` : ''}
            </div>
        `;
    }

    // ========== IMAGE / TRACE / TABLE HANDLERS ==========
    window.setImgAlign = function (prefix, prop, value) {
        if (prefix === 'active') {
            if (prop === 'imageAlign') window.activeImageAlign = value;
            else if (prop === 'imageVerticalAlign') window.activeImageVerticalAlign = value;
            else if (prop === 'imageFit') window.activeImageFit = value;
            renderEditor();
        } else if (prefix === 'edit' && expandedBlockIdx !== null) {
            const page = getCurrentPage();
            if (!page) return;
            const b = page.blocks[expandedBlockIdx];
            if (!b || b.type !== 'image') return;
            pushHistory();
            b[prop] = value;
            save();
            renderEditor();
            renderView();
        }
    };
    window.updateImgScale = function (prefix, value) {
        const v = Math.min(200, Math.max(10, parseInt(value) || 100));
        if (prefix === 'active') window.activeImageScale = v;
        else if (prefix === 'edit' && expandedBlockIdx !== null) {
            const page = getCurrentPage();
            if (!page) return;
            const b = page.blocks[expandedBlockIdx];
            if (!b || b.type !== 'image') return;
            pushHistory();
            b.imageScale = v;
            save();
            renderView();
        }
    };
    window.handleActiveImage = function (e) {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type || !file.type.startsWith('image/')) return showToast('Please select an image file', 'error');
        if (file.size > 2 * 1024 * 1024) return showToast('Image must be < 2MB', 'error');
        const reader = new FileReader();
        reader.onload = ev => {
            window.activeImagePath = ev.target.result;
            renderEditor();
            showToast('Image loaded', 'success');
        };
        reader.onerror = () => showToast('Failed to read image', 'error');
        reader.readAsDataURL(file);
    };
    window.handleEditImage = function (e, idx) {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type || !file.type.startsWith('image/')) return showToast('Please select an image file', 'error');
        if (file.size > 2 * 1024 * 1024) return showToast('Image must be < 2MB', 'error');
        const reader = new FileReader();
        reader.onload = ev => {
            const page = getCurrentPage();
            if (!page || !page.blocks[idx]) return;
            pushHistory();
            page.blocks[idx].imagePath = ev.target.result;
            save();
            renderEditor();
            renderView();
            showToast('Image updated', 'success');
        };
        reader.onerror = () => showToast('Failed to read image', 'error');
        reader.readAsDataURL(file);
    };
    window.updateImageLabelOn = function (idx, val) {
        const page = getCurrentPage();
        if (!page || !page.blocks[idx]) return;
        pushHistory();
        page.blocks[idx].imageLabelOn = !!val;
        save();
        renderEditor();
        renderView();
    };
    window.updateImageLabel = function (idx, val) {
        const page = getCurrentPage();
        if (!page || !page.blocks[idx]) return;
        if (!_editTextHistoryTimer) pushHistory();
        clearTimeout(_editTextHistoryTimer);
        _editTextHistoryTimer = setTimeout(() => { _editTextHistoryTimer = null; }, 800);
        page.blocks[idx].imageLabel = val;
        save();
        renderView();
    };
    window.updateTraceField = function (idx, prop, val) {
        const page = getCurrentPage();
        if (!page || !page.blocks[idx] || page.blocks[idx].type !== 'trace') return;
        if (prop === 'traceTarget') {
            if (!_editTextHistoryTimer) pushHistory();
            clearTimeout(_editTextHistoryTimer);
            _editTextHistoryTimer = setTimeout(() => { _editTextHistoryTimer = null; }, 800);
            page.blocks[idx][prop] = val;
            save();
            updateThumbnail();
            renderView();
            return;
        }
        pushHistory();
        page.blocks[idx][prop] = val;
        save();
        renderEditor();
        renderView();
    };

    // Table handlers
    window.clearTableSel = function () { tableSel = new Set(); renderEditor(); };
    window.toggleTableCell = function (blockIdx, r, c) {
        const page = getCurrentPage();
        if (!page || !page.blocks[blockIdx] || page.blocks[blockIdx].type !== 'table') return;
        const b = page.blocks[blockIdx];
        const owner = findTableCellAt(b.cells || [], r, c);
        if (!owner) return;
        const keys = coveredKeys(owner);
        const allOn = keys.every(k => tableSel.has(k));
        if (allOn) keys.forEach(k => tableSel.delete(k));
        else keys.forEach(k => tableSel.add(k));
        renderEditor();
    };
    window.mergeTableCells = function (blockIdx) {
        const page = getCurrentPage();
        if (!page || !page.blocks[blockIdx] || page.blocks[blockIdx].type !== 'table') return;
        const b = page.blocks[blockIdx];
        const rect = isTableRect(tableSel);
        if (!rect || tableSel.size < 2) return showToast('Select a solid rectangle of 2+ cells to merge', 'warning');
        const cells = b.cells || [];
        const ownersHit = new Set();
        for (const cell of cells) {
            const keys = coveredKeys(cell);
            const hit = keys.some(k => tableSel.has(k));
            const all = keys.every(k => tableSel.has(k));
            if (hit && !all) return showToast('Selection cuts through a merged cell', 'error');
            if (hit) ownersHit.add(tKey(cell.r, cell.c));
        }
        if (ownersHit.size < 2) return showToast('Select at least two separate cells/regions', 'warning');
        pushHistory();
        const remaining = cells.filter(cell => !coveredKeys(cell).some(k => tableSel.has(k)));
        const topLeft = findTableCellAt(cells, rect.minR, rect.minC);
        remaining.push({
            r: rect.minR, c: rect.minC, rowSpan: rect.rowSpan, colSpan: rect.colSpan,
            text: topLeft ? (topLeft.text || '') : '', bg: topLeft ? (topLeft.bg || '#f1f3f5') : '#f1f3f5',
            fontSize: topLeft ? (topLeft.fontSize || 14) : 14, bold: topLeft ? !!topLeft.bold : false, italic: topLeft ? !!topLeft.italic : false
        });
        b.cells = remaining;
        tableSel = new Set();
        for (let r = rect.minR; r <= rect.maxR; r++) for (let c = rect.minC; c <= rect.maxC; c++) tableSel.add(tKey(r, c));
        save();
        renderEditor();
        renderView();
        showToast('Cells merged', 'success');
    };
    window.unmergeTableCells = function (blockIdx) {
        const page = getCurrentPage();
        if (!page || !page.blocks[blockIdx] || page.blocks[blockIdx].type !== 'table') return;
        const b = page.blocks[blockIdx];
        if (!tableSel.size) return showToast('Select a merged cell first', 'warning');
        const first = parseTKey(Array.from(tableSel)[0]);
        const owner = findTableCellAt(b.cells || [], first.r, first.c);
        if (!owner || (owner.rowSpan === 1 && owner.colSpan === 1)) return showToast('Selection is not a merged cell', 'warning');
        pushHistory();
        const cells = (b.cells || []).filter(cell => !(cell.r === owner.r && cell.c === owner.c));
        for (let r = owner.r; r < owner.r + owner.rowSpan; r++) {
            for (let c = owner.c; c < owner.c + owner.colSpan; c++) {
                cells.push({
                    r, c, rowSpan: 1, colSpan: 1,
                    text: (r === owner.r && c === owner.c) ? (owner.text || '') : '',
                    bg: owner.bg || '#f1f3f5', fontSize: owner.fontSize || 14, bold: !!owner.bold, italic: !!owner.italic
                });
            }
        }
        b.cells = cells;
        tableSel = new Set();
        save();
        renderEditor();
        renderView();
        showToast('Cell unmerged', 'info');
    };
    window.applyTableCellProp = function (blockIdx, prop, value) {
        const page = getCurrentPage();
        if (!page || !page.blocks[blockIdx] || page.blocks[blockIdx].type !== 'table') return;
        const b = page.blocks[blockIdx];
        if (!tableSel.size) return;
        const owners = new Map();
        for (const k of tableSel) {
            const { r, c } = parseTKey(k);
            const owner = findTableCellAt(b.cells || [], r, c);
            if (owner) owners.set(tKey(owner.r, owner.c), owner);
        }
        if (!owners.size) return;
        if (prop === 'text') {
            if (!_editTextHistoryTimer) pushHistory();
            clearTimeout(_editTextHistoryTimer);
            _editTextHistoryTimer = setTimeout(() => { _editTextHistoryTimer = null; }, 800);
        } else pushHistory();
        owners.forEach(owner => {
            if (prop === 'fontSize') owner.fontSize = Math.min(22, Math.max(10, parseInt(value) || 14));
            else if (prop === 'bold' || prop === 'italic') owner[prop] = value === true || value === 'true';
            else owner[prop] = value;
        });
        save();
        if (prop !== 'text') { renderEditor(); renderView(); }
        else renderView();
    };
    window.toggleTableBorders = function (idx, val) {
        const page = getCurrentPage();
        if (!page || !page.blocks[idx]) return;
        pushHistory();
        page.blocks[idx].tableShowBorders = !!val;
        save();
        renderView();
    };

    // ========== RENDER ==========
    function getCurrentLesson() { return lessons.find(l => l.id === currentLessonId); }
    function getCurrentPage() {
        const l = getCurrentLesson();
        return l ? l.pages[currentPageIndex] : null;
    }

    function updateThumbnail() {
        const container = document.getElementById('thumbnailContainer');
        const inner = document.getElementById('thumbnailInner');
        const page = getCurrentPage();
        if (!container || !inner || !page) return;
        inner.innerHTML = '';
        const pageEl = buildPageElement(page, currentPageIndex + 1, 0.2588); // 220/850
        inner.appendChild(pageEl);
    }

    function buildPageElement(page, pageNumber, scale = 1) {
        const pageEl = document.createElement('div');
        pageEl.className = 'page';
        pageEl.innerHTML = `<div class="page-actions no-print"><button type="button" class="export-btn" onclick="exportPage(this.closest('.page'))">📄 Export</button></div>`;
        const card = document.createElement('div');
        card.className = 'page-card';
        card.innerHTML = `
            <div class="page-header">
                <div class="page-header-left">
                    <h1>${escapeHtml(page.title)}</h1>
                    <div class="sub">${escapeHtml(page.subtitle)}</div>
                </div>
                <div class="page-header-right">
                    <span class="lbl">LESSON</span>
                    <span class="num">${page.lessonNumber}</span>
                </div>
            </div>
            <div class="grid-stage" id="stage-${pageNumber}"></div>
            <div class="page-number">${pageNumber}</div>
        `;
        pageEl.appendChild(card);
        const stage = card.querySelector('.grid-stage');
        page.blocks.forEach(b => {
            const el = document.createElement('div');
            el.className = 'block' + (b.showBorder !== false ? ' has-border' : '');
            el.style.gridRow = `${b.row + 1} / span ${b.rowSpan}`;
            el.style.gridColumn = `${b.col + 1} / span ${b.colSpan}`;

            if (b.type === 'text') {
                const vAlign = b.verticalAlign || 'center';
                el.style.display = 'flex';
                el.style.flexDirection = 'column';
                el.style.justifyContent = vAlign === 'top' ? 'flex-start' : vAlign === 'bottom' ? 'flex-end' : 'center';
                el.style.alignItems = 'stretch';
                const style = [
                    `font-size:${b.fontSize || 18}px`,
                    `color:${escapeStyle(b.color || '#1a1a1a')}`,
                    `text-align:${b.textAlign || 'center'}`,
                    b.bold ? 'font-weight:700' : 'font-weight:400',
                    b.italic ? 'font-style:italic' : '',
                    b.underline ? 'text-decoration:underline' : '',
                    `line-height:${b.lineHeight || 1.35}`,
                    b.fontFamily ? `font-family:${escapeStyle(b.fontFamily)}` : '',
                    'width:100%', 'height:auto'
                ].filter(Boolean).join(';');
                const content = b.richText ? (b.text || '') : textToHtml(b.text || '');
                el.innerHTML = `<div class="block-text" style="${style}">${content}</div>`;
            } else if (b.type === 'image' && b.imagePath) {
                const vAlign = b.imageVerticalAlign || 'center';
                const hAlign = b.imageAlign || 'center';
                el.style.alignItems = vAlign === 'top' ? 'flex-start' : vAlign === 'bottom' ? 'flex-end' : 'center';
                el.style.justifyContent = hAlign === 'left' ? 'flex-start' : hAlign === 'right' ? 'flex-end' : 'center';
                const fit = b.imageFit || 'contain';
                let imgStyle = 'border-radius:4px;';
                if (fit === 'contain') imgStyle += 'max-width:100%;max-height:100%;object-fit:contain;';
                else if (fit === 'cover') imgStyle += 'width:100%;height:100%;object-fit:cover;';
                else if (fit === 'scale') {
                    const sc = (b.imageScale ?? 100) / 100;
                    imgStyle += `max-width:${100 * sc}%;max-height:${100 * sc}%;object-fit:contain;`;
                }
                if (b.imageLabelOn && b.imageLabel) {
                    let wrapperStyle = 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:100%;';
                    if (fit === 'contain') imgStyle = imgStyle.replace(/max-height:100%/, 'max-height:calc(100% - 1.6em)');
                    else if (fit === 'scale') imgStyle = imgStyle.replace(/max-height:\d+%/, 'max-height:calc(100% - 1.6em)');
                    else if (fit === 'cover') imgStyle = imgStyle.replace(/height:100%/, 'height:calc(100% - 1.6em)');
                    el.innerHTML = `<div class="block-img-wrap" style="${wrapperStyle}">
                        <img class="block-img" src="${escapeHtml(b.imagePath)}" style="${imgStyle}">
                        <div class="block-img-label">${escapeHtml(b.imageLabel)}</div>
                    </div>`;
                } else {
                    el.innerHTML = `<img class="block-img" src="${escapeHtml(b.imagePath)}" style="${imgStyle}">`;
                }
            } else if (b.type === 'trace') {
                el.style.alignItems = 'stretch';
                el.style.justifyContent = 'stretch';
                el.innerHTML = buildTraceHtml(b);
            } else if (b.type === 'table') {
                el.style.alignItems = 'stretch';
                el.style.justifyContent = 'stretch';
                el.innerHTML = buildTableHtml(b);
            }
            stage.appendChild(el);
        });

        if (scale !== 1) {
            pageEl.style.transform = `scale(${scale})`;
            pageEl.style.transformOrigin = 'top left';
            pageEl.style.width = '850px';
            pageEl.style.height = '1100px';
            pageEl.style.margin = '0';
            pageEl.style.position = 'absolute';
            pageEl.style.top = '0';
            pageEl.style.left = '0';
        }
        return pageEl;
    }

    function renderView() {
        const container = document.getElementById('viewContainer');
        if (!container) return;
        container.innerHTML = '';
        const lesson = getCurrentLesson();
        if (!lesson) return;

        let globalPageNumber = 1;

        lesson.pages.forEach((page, pIdx) => {
            const pageEl = buildPageElement(page, globalPageNumber, 1);
            container.appendChild(pageEl);
            globalPageNumber++;

            if (page.worksheetEnabled && page.worksheetCount > 0) {
                for (let w = 0; w < page.worksheetCount; w++) {
                    container.appendChild(renderWorksheetPage(globalPageNumber));
                    globalPageNumber++;
                }
            }
        });

        const viewInfo = document.getElementById('viewInfo');
        if (viewInfo) viewInfo.textContent = `${lessons.length} lesson(s) · Page ${currentPageIndex + 1} of ${lesson.pages.length}`;
    }

    function renderWorksheetPage(pageNumber) {
        const pageEl = document.createElement('div');
        pageEl.className = 'page';
        pageEl.innerHTML = `<div class="page-actions no-print"><button type="button" class="export-btn" onclick="exportPage(this.closest('.page'))">📄 Export</button></div>`;
        const card = document.createElement('div');
        card.className = 'page-card';
        card.style.position = 'relative';
        const stage = document.createElement('div');
        stage.className = 'grid-stage';
        stage.style.cssText = 'position:absolute;top:64px;left:0;right:0;bottom:36px;padding:0;background:#fff;';
        const linesContainer = document.createElement('div');
        linesContainer.className = 'worksheet-lines';
        const redMargin = document.createElement('div');
        redMargin.className = 'red-margin';
        linesContainer.appendChild(redMargin);
        const lineCount = 20;
        const spacing = 100 / (lineCount + 1);
        for (let i = 1; i <= lineCount; i++) {
            const line = document.createElement('div');
            line.className = 'blue-line';
            line.style.top = `${i * spacing}%`;
            linesContainer.appendChild(line);
        }
        stage.appendChild(linesContainer);
        card.appendChild(stage);
        const pageNumberDiv = document.createElement('div');
        pageNumberDiv.className = 'page-number';
        pageNumberDiv.textContent = pageNumber;
        card.appendChild(pageNumberDiv);
        pageEl.appendChild(card);
        return pageEl;
    }

    function buildTableHtml(b) {
        const rows = b.tableRows || (b.rowSpan * 2) || 1;
        const cols = b.tableCols || b.colSpan || 1;
        const cells = b.cells || [];
        const showBorders = b.tableShowBorders !== false;
        let html = `<div class="inner-table ${showBorders ? 'has-borders' : ''}" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr);">`;
        cells.forEach(cell => {
            const style = [
                `grid-row:${cell.r + 1} / span ${cell.rowSpan}`,
                `grid-column:${cell.c + 1} / span ${cell.colSpan}`,
                `background:${escapeStyle(cell.bg || '#f1f3f5')}`,
                `font-size:${Math.min(22, cell.fontSize || 14)}px`,
                cell.bold ? 'font-weight:700' : 'font-weight:400',
                cell.italic ? 'font-style:italic' : '',
                'color:#1a1a1a'
            ].filter(Boolean).join(';');
            html += `<div class="it-cell" style="${style}">${escapeHtml(cell.text || '')}</div>`;
        });
        html += '</div>';
        return html;
    }

    function buildTraceHtml(b) {
        const sets = Math.max(1, b.rowSpan || 1);
        const target = String(b.traceTarget || '').trim();
        const clones = Math.min(20, Math.max(1, parseInt(b.traceClones) || 5));
        const style = b.traceStyle === 'solid' ? 'solid' : 'outlined';
        const repeatAll = b.traceRepeatAll !== false;
        let html = '<div class="trace-wrap">';
        for (let s = 0; s < sets; s++) {
            const showLetters = target && (repeatAll || s === 0);
            html += '<div class="trace-set">';
            html += '<div class="tline red" style="top:0;"></div>';
            html += '<div class="tline blue" style="top:33.333%;"></div>';
            html += '<div class="tline blue" style="top:66.667%;"></div>';
            html += '<div class="tline red" style="top:100%;"></div>';
            if (showLetters) {
                let spans = '';
                for (let c = 0; c < clones; c++) spans += `<span>${escapeHtml(target)}</span>`;
                html += `<div class="trace-letters ${style === 'outlined' ? 'outlined' : ''}">${spans}</div>`;
            }
            html += '</div>';
        }
        html += '</div>';
        return html;
    }

    window.exportPage = function (pageEl) {
        const clone = pageEl.cloneNode(true);
        clone.querySelector('.page-actions')?.remove();
        const win = window.open('', '_blank');
        const styles = document.querySelector('style').outerHTML;
        win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Export</title>${styles}</head><body style="padding:0;margin:0;background:#fff;"><div class="view-container">${clone.outerHTML}</div></body></html>`);
        win.document.close();
        win.focus();
        setTimeout(() => win.print(), 400);
    };

    // ========== LESSON MANAGEMENT ==========
    function renderLessonList() {
        const list = document.getElementById('lessonList');
        if (!list) return;
        list.innerHTML = lessons.map(l => `
            <div class="lesson-item" style="${l.id === currentLessonId ? 'border-color:#F5A623;background:#fff;' : ''}">
                <div class="info">
                    <div class="title">${escapeHtml(l.title)}</div>
                    <div class="sub">${l.pages.length} page(s)</div>
                </div>
                <div class="actions">
                    <button type="button" class="btn btn-primary btn-xs" onclick="selectLesson('${l.id}')">Open</button>
                    <button type="button" class="btn btn-danger btn-xs" onclick="deleteLesson('${l.id}')">🗑</button>
                </div>
            </div>
        `).join('');
    }

    window.selectLesson = function (id) {
        currentLessonId = id;
        currentPageIndex = 0;
        history = []; historyIndex = -1;
        expandedBlockIdx = null;
        tableSel = new Set();
        if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }
        if (_thumbnailTimer) { clearTimeout(_thumbnailTimer); _thumbnailTimer = null; }
        resetActive();
        pushHistory();
        renderAll();
        switchTab('edit');
        showToast('Lesson opened', 'info');
    };
    window.addLesson = function () {
        const l = defaultLesson();
        lessons.push(l);
        currentLessonId = l.id;
        currentPageIndex = 0;
        history = []; historyIndex = -1;
        expandedBlockIdx = null;
        tableSel = new Set();
        if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }
        if (_thumbnailTimer) { clearTimeout(_thumbnailTimer); _thumbnailTimer = null; }
        resetActive();
        save().then(() => {
            pushHistory();
            renderAll();
            switchTab('edit');
            showToast('Lesson added', 'success');
        });
    };
    window.exportLessonsJson = async function () {
        try {
            const payload = {
                app: 'phonics-grid-publisher', version: 2,
                exportedAt: new Date().toISOString(), nextId,
                lessons: lessons.map(l => ({
                    id: l.id, title: l.title, subtitle: l.subtitle,
                    pages: l.pages.map(p => ({
                        title: p.title, subtitle: p.subtitle, lessonNumber: p.lessonNumber,
                        locked: !!p.locked, blocks: p.blocks || [],
                        usedCells: Array.from(p.usedCells || []),
                        worksheetEnabled: !!p.worksheetEnabled, worksheetCount: p.worksheetCount || 1
                    }))
                }))
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'phonics-lessons-' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast('Exported ' + lessons.length + ' lesson(s)', 'success');
        } catch (e) {
            showToast('Export failed', 'error');
        }
    };
    window.importLessonsJson = function (event) {
        const file = event.target.files && event.target.files[0];
        event.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function () {
            try {
                const data = JSON.parse(String(reader.result || ''));
                if (!data || !Array.isArray(data.lessons)) return showToast('Invalid file: missing lessons array', 'error');
                let added = 0;
                data.lessons.forEach(src => {
                    if (!src || typeof src !== 'object') return;
                    const lesson = validateAndNormalizeLesson(src);
                    lessons.push(lesson);
                    added++;
                });
                if (!added) return showToast('No valid lessons found', 'warning');
                const seenIds = new Set();
                lessons.forEach(l => {
                    while (seenIds.has(l.id)) l.id = generateUniqueId();
                    seenIds.add(l.id);
                });
                save().then(() => {
                    renderAll();
                    showToast('Imported ' + added + ' lesson(s)', 'success');
                });
            } catch (e) {
                console.error(e);
                showToast('Import failed: invalid JSON', 'error');
            }
        };
        reader.onerror = () => showToast('Could not read file', 'error');
        reader.readAsText(file);
    };
    window.deleteLesson = function (id) {
        if (lessons.length <= 1) return showToast('Need at least one lesson', 'warning');

        lessons = lessons.filter(l => l.id !== id);
        if (currentLessonId === id) {
            currentLessonId = lessons[0].id;
            currentPageIndex = 0;
        }
        history = []; historyIndex = -1;
        expandedBlockIdx = null;
        tableSel = new Set();
        if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }
        if (_thumbnailTimer) { clearTimeout(_thumbnailTimer); _thumbnailTimer = null; }
        resetActive();
        save().then(() => {
            pushHistory();
            renderAll();
            showToast('Lesson deleted', 'info');
        });
    };
    window.addPage = function () {
        const lesson = getCurrentLesson();
        if (!lesson) return;
        if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }
        if (_thumbnailTimer) { clearTimeout(_thumbnailTimer); _thumbnailTimer = null; }
        const p = defaultPage();
        p.lessonNumber = lesson.pages.length + 1;
        lesson.pages.push(p);
        currentPageIndex = lesson.pages.length - 1;
        history = []; historyIndex = -1;
        expandedBlockIdx = null;
        tableSel = new Set();
        resetActive();
        save().then(() => {
            pushHistory();
            renderAll();
            showToast('Page added', 'success');
        });
    };
    window.duplicatePage = function () {
        const lesson = getCurrentLesson();
        if (!lesson) return;
        const currentPage = lesson.pages[currentPageIndex];
        if (!currentPage) return;
        const newPage = JSON.parse(JSON.stringify({
            title: currentPage.title,
            subtitle: currentPage.subtitle,
            lessonNumber: currentPage.lessonNumber + 1,
            locked: false,
            blocks: currentPage.blocks,
            usedCells: [],
            worksheetEnabled: currentPage.worksheetEnabled,
            worksheetCount: currentPage.worksheetCount
        }));
        rebuildUsedCells(newPage);
        lesson.pages.splice(currentPageIndex + 1, 0, newPage);
        currentPageIndex = currentPageIndex + 1;
        history = []; historyIndex = -1;
        expandedBlockIdx = null;
        tableSel = new Set();
        if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }
        if (_thumbnailTimer) { clearTimeout(_thumbnailTimer); _thumbnailTimer = null; }
        resetActive();
        save().then(() => {
            pushHistory();
            renderAll();
            switchTab('edit');
            showToast('Page duplicated', 'success');
        });
    };
    window.deletePage = function () {
        const lesson = getCurrentLesson();
        if (!lesson) return;
        if (lesson.pages.length <= 1) {
            showToast('Cannot delete the only page', 'warning');
            return;
        }
        if (!confirm('Delete current page? This cannot be undone.')) return;
        if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }
        if (_thumbnailTimer) { clearTimeout(_thumbnailTimer); _thumbnailTimer = null; }
        lesson.pages.splice(currentPageIndex, 1);
        if (currentPageIndex >= lesson.pages.length) {
            currentPageIndex = lesson.pages.length - 1;
        }
        history = []; historyIndex = -1;
        expandedBlockIdx = null;
        tableSel = new Set();
        resetActive();
        save().then(() => {
            pushHistory();
            renderAll();
            showToast('Page deleted', 'info');
        });
    };

    // ========== TABS & INIT ==========
    window.switchTab = function (tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === tab + 'Panel'));
        if (tab === 'view') renderView();
        if (tab === 'edit') { renderEditor(); }
    };

    function renderAll() {
        renderLessonList();
        renderEditor();
        renderView();
        const lesson = getCurrentLesson();
        document.getElementById('lessonCount').textContent = lessons.length + ' lessons';
        document.getElementById('pageSelect').innerHTML = (lesson ? lesson.pages : []).map((p, i) =>
            `<option value="${i}" ${i === currentPageIndex ? 'selected' : ''}>Page ${i + 1}</option>`
        ).join('');

        if (viewInfo) viewInfo.textContent = `${lessons.length} lesson(s) · Page ${currentPageIndex + 1} of ${lesson?.pages.length || 0}`;

    window.changePage = function (idx) {
        currentPageIndex = parseInt(idx);

        expandedBlockIdx = null;
        tableSel = new Set();
        if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }
        if (_thumbnailTimer) { clearTimeout(_thumbnailTimer); _thumbnailTimer = null; }
        resetActive();
        pushHistory();
        renderEditor();
        renderView();
    };

    // ========== ACTIVE SELECTION ==========
    function syncActiveFromDom() {
        const editor = document.getElementById('activeText');
        if (editor) {
            window.activeText = sanitizeHTML(editor.innerHTML);
            window.activeRichText = true;
        }
        const fs = document.getElementById('activeFontSize');
        if (fs) window.activeFontSize = Math.max(1, parseInt(fs.value) || 18);
        const col = document.getElementById('activeColor');
        if (col) window.activeColor = col.value;
        const lh = document.getElementById('activeLineHeight');
        if (lh) window.activeLineHeight = Math.min(3, Math.max(0.5, parseFloat(lh.value) || 1.35));
        const ff = document.getElementById('activeFontFamily');
        if (ff) window.activeFontFamily = ff.value;
        const br = document.getElementById('activeBorder');
        if (br) window.activeShowBorder = !!br.checked;
        const sc = document.getElementById('activeImageScale');
        if (sc) window.activeImageScale = Math.min(200, Math.max(10, parseInt(sc.value) || 100));
        const labOn = document.getElementById('activeImageLabelOn');
        if (labOn) window.activeImageLabelOn = !!labOn.checked;
        const lab = document.getElementById('activeImageLabel');
        if (lab) window.activeImageLabel = lab.value;
        const tt = document.getElementById('activeTraceTarget');
        if (tt) window.activeTraceTarget = tt.value;
        const tc = document.getElementById('activeTraceClones');
        if (tc) window.activeTraceClones = Math.min(20, Math.max(1, parseInt(tc.value) || 5));
        const tsb = document.getElementById('activeTableShowBorders');
        if (tsb) window.activeTableShowBorders = !!tsb.checked;
    }

    window.toggleCell = function (r, c) {
        const page = getCurrentPage();
        if (!page || page.locked) return;
        const key = cellKey(r, c);
        if (page.usedCells.has(key)) return;
        syncActiveFromDom();
        if (window.activeSelection.has(key)) window.activeSelection.delete(key);
        else window.activeSelection.add(key);
        renderEditor();
    };
    window.clearSelection = function () {
        syncActiveFromDom();
        window.activeSelection = new Set();
        blockConfigStep = 1;
        renderEditor();
    };
    function validateSelection() {
        const msg = document.getElementById('validationMsg');
        const btn = document.getElementById('btnNextStep');
        if (!msg || !btn) return;
        if (window.activeSelection.size === 0) {
            msg.textContent = '';
            btn.disabled = true;
            return;
        }
        const rect = isRectangle(window.activeSelection);
        if (!rect) {
            msg.textContent = '⚠ Selection must be a solid rectangle or square';
            msg.style.color = '#e03131';
            btn.disabled = true;
        } else {
            msg.textContent = '✓ Valid ' + rect.rowSpan + '×' + rect.colSpan + ' rectangle';
            msg.style.color = '#2d7d46';
            btn.disabled = false;
        }
    }
    window.goToStep2 = function () {
        syncActiveFromDom();
        if (isRectangle(window.activeSelection)) {
            blockConfigStep = 2;
            renderEditor();
        } else {
            showToast('Select a valid rectangle first', 'warning');
        }
    };
    window.goToStep1 = function () {
        blockConfigStep = 1;
        renderEditor();
    };
    window.setMode = function (mode) {
        syncActiveFromDom();
        window.activeMode = mode;
        renderEditor();
    };

    window.setBlock = function () {
        const page = getCurrentPage();
        if (!page || page.locked) return;
        syncActiveFromDom();
        if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }
        if (_thumbnailTimer) { clearTimeout(_thumbnailTimer); _thumbnailTimer = null; }
        const rect = isRectangle(window.activeSelection);
        if (!rect) return showToast('Invalid rectangle', 'error');

        if (window.activeMode === 'text') {
            const plain = String(window.activeText || '').replace(/<[^>]+>/g, '').trim();
            if (!plain) return showToast('Please enter some text', 'error');
        } else if (window.activeMode === 'image') {
            if (!window.activeImagePath) return showToast('Please upload an image', 'error');
        }

        for (const k of window.activeSelection) {
            if (page.usedCells.has(k)) return showToast('Selection overlaps used cells', 'error');
        }

        pushHistory();

        const block = {
            id: 'b' + Date.now() + Math.random().toString(36).slice(2, 6),
            row: rect.minR, col: rect.minC, rowSpan: rect.rowSpan, colSpan: rect.colSpan,
            type: window.activeMode, showBorder: window.activeShowBorder !== false
        };

        if (window.activeMode === 'text') {
            Object.assign(block, {
                text: String(window.activeText || ''),
                fontSize: window.activeFontSize || 18,
                bold: !!window.activeBold, italic: !!window.activeItalic, underline: !!window.activeUnderline,
                color: window.activeColor || '#1a1a1a',
                textAlign: window.activeTextAlign || 'center',
                verticalAlign: window.activeVerticalAlign || 'center',
                lineHeight: window.activeLineHeight || 1.35,
                fontFamily: window.activeFontFamily || '',
                richText: true
            });
        } else if (window.activeMode === 'image') {
            Object.assign(block, {
                imagePath: window.activeImagePath || '',
                imageAlign: window.activeImageAlign || 'center',
                imageVerticalAlign: window.activeImageVerticalAlign || 'center',
                imageFit: window.activeImageFit || 'contain',
                imageScale: window.activeImageScale ?? 100,
                imageLabelOn: !!window.activeImageLabelOn,
                imageLabel: String(window.activeImageLabel || '')
            });
        } else if (window.activeMode === 'trace') {
            Object.assign(block, {
                traceTarget: String(window.activeTraceTarget || ''),
                traceStyle: window.activeTraceStyle === 'solid' ? 'solid' : 'outlined',
                traceClones: Math.min(20, Math.max(1, parseInt(window.activeTraceClones) || 5)),
                traceRepeatAll: window.activeTraceRepeatAll !== false
            });
        } else if (window.activeMode === 'table') {
            const tableRows = rect.rowSpan * 2;
            const tableCols = rect.colSpan;
            Object.assign(block, {
                tableRows, tableCols,
                tableShowBorders: window.activeTableShowBorders !== false,
                cells: initTableCells(tableRows, tableCols)
            });
        }

        page.blocks.push(block);
        window.activeSelection.forEach(k => page.usedCells.add(k));
        resetActive();
        expandedBlockIdx = null;
        blockConfigStep = 1;
        save();
        renderEditor();
        renderView();
        showToast('Block set', 'success');
    };

    window.deleteBlock = function (idx) {
        const page = getCurrentPage();
        if (!page || page.locked) return;
        if (idx < 0 || idx >= page.blocks.length) return;
        if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }
        if (_thumbnailTimer) { clearTimeout(_thumbnailTimer); _thumbnailTimer = null; }
        pushHistory();
        page.blocks.splice(idx, 1);
        if (expandedBlockIdx === idx) { expandedBlockIdx = null; tableSel = new Set(); }
        else if (expandedBlockIdx > idx) expandedBlockIdx--;
        rebuildUsedCells(page);
        save();
        renderEditor();
        renderView();
        showToast('Block removed', 'info');
    };

    window.toggleBlockBorder = function (idx, val) {
        const page = getCurrentPage();
        if (!page || !page.blocks[idx]) return;
        if (page.blocks[idx].showBorder === val) return;
        pushHistory();
        page.blocks[idx].showBorder = val;
        save();
        renderView();
        updateThumbnail();
    };

    window.toggleBlockAccordion = function (idx) {
        if (expandedBlockIdx === idx) {
            expandedBlockIdx = null;
        } else {
            expandedBlockIdx = idx;
            tableSel = new Set();
        }
        renderEditor();
        if (expandedBlockIdx !== null) {
            const editor = document.getElementById('editText');
            if (editor) editor.focus();
        }
    };

        if (content) content.style.display = content.style.display === 'none' ? 'block' : 'none';
    };

        if (!page) return;
        const t = document.getElementById('pageTitle');
        const s = document.getElementById('pageSubtitle');
        const n = document.getElementById('pageLessonNum');
        if (t) page.title = t.value.trim() || 'UNTITLED';
        if (s) page.subtitle = s.value.trim() || '';
        if (n) {
            const num = parseInt(n.value, 10);
            page.lessonNumber = Number.isFinite(num) && num > 0 ? num : 1;
        }
        pushHistory();
        save();
        renderView();
        updateThumbnail();
    };

        const enabled = document.getElementById('worksheetToggle').checked;
        page.worksheetEnabled = enabled;
        if (enabled) page.worksheetCount = Math.max(1, page.worksheetCount || 1);
        pushHistory();
        save();
        renderEditor();
        renderView();
        showToast(enabled ? 'Worksheet pages enabled' : 'Worksheet pages disabled', 'info');
    };
