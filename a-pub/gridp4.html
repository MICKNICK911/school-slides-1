        const page = getCurrentPage();
        if (!page) return;
        const count = Math.min(10, Math.max(1, parseInt(value) || 1));
        page.worksheetCount = count;
        pushHistory();
        save();
        renderView();
        updateThumbnail();
        showToast('Worksheet count updated to ' + count, 'info');

        pushHistory();
        page.locked = true;
        expandedBlockIdx = null;
        tableSel = new Set();
        save();
        renderEditor();
        renderView();
        showToast('Layout locked — content still editable', 'success');

    window.unlockPage = function () {

        pushHistory();
        page.locked = false;
        save();
        renderEditor();
        renderView();
        showToast('Layout unlocked', 'info');

                                <div id="activeText" class="rich-editor" contenteditable="true"
                                     oninput="window.activeText=window.sanitizeHTML(this.innerHTML);window.activeRichText=true;updatePreview('active')">${window.activeText || ''}</div>
                                ${fmtToolbarHtml('active', activeState)}
                                <div class="preview-box" id="activePreview"></div>
                            </div>
                        ` : window.activeMode === 'image' ? `
                            <div id="imageFields">
                                <label>Image</label>
                                <div class="img-preview-wrap">
                                    <img id="activeImgPreview" style="display:${window.activeImagePath?'block':'none'}" src="${escapeHtml(window.activeImagePath||'')}">
                                    <div id="activeImgPh" class="ph" style="display:${window.activeImagePath?'none':'flex'}">🖼️</div>
                                    <input type="file" accept="image/*" onchange="handleActiveImage(event)">
                                </div>
                                ${imageControlsHtml('active', imgState)}
                                <label class="border-toggle" style="margin-top:8px;">
                                    <input type="checkbox" id="activeImageLabelOn" ${window.activeImageLabelOn?'checked':''} onchange="window.activeImageLabelOn=this.checked;renderEditor()">
                                    Show label under image
                                </label>
                                <div style="display:${window.activeImageLabelOn?'block':'none'};margin-top:6px;">
                                    <label>Label text</label>
                                    <input id="activeImageLabel" value="${escapeHtml(window.activeImageLabel)}" oninput="window.activeImageLabel=this.value" placeholder="e.g. cat" style="width:100%;padding:8px 12px;border:2px solid #dee2e6;border-radius:8px;font-size:13px;">
                                </div>
                            </div>
                        ` : window.activeMode === 'trace' ? `
                            <div id="traceFields">
                                <label>Target letter / word <span style="font-weight:400;color:#6c757d;">(empty = blank lines)</span></label>
                                <input id="activeTraceTarget" value="${escapeHtml(window.activeTraceTarget)}" oninput="window.activeTraceTarget=this.value" placeholder="e.g. a  or  cat" style="width:100%;padding:8px 12px;border:2px solid #dee2e6;border-radius:8px;font-size:13px;">
                                <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;">
                                    <div class="select-group">
                                        <label>Style</label>
                                        <select onchange="window.activeTraceStyle=this.value;renderEditor()">
                                            <option value="outlined" ${window.activeTraceStyle==='outlined'?'selected':''}>Outlined</option>
                                            <option value="solid" ${window.activeTraceStyle==='solid'?'selected':''}>Solid</option>
                                        </select>
                                    </div>
                                    <div class="select-group">
                                        <label>Clones</label>
                                        <input type="number" id="activeTraceClones" value="${window.activeTraceClones}" min="1" max="20" style="width:64px;padding:4px 6px;border:1px solid #ced4da;border-radius:6px;font-size:12px;" onchange="window.activeTraceClones=Math.min(20,Math.max(1,parseInt(this.value)||5))">
                                    </div>
                                    <div class="select-group">
                                        <label>Repeat</label>
                                        <select onchange="window.activeTraceRepeatAll=this.value==='true';renderEditor()">
                                            <option value="true" ${window.activeTraceRepeatAll?'selected':''}>All sets</option>
                                            <option value="false" ${!window.activeTraceRepeatAll?'selected':''}>First only</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        ` : window.activeMode === 'table' ? `
                            <div id="tableFields">
                                <div style="font-size:12px;color:#495057;line-height:1.4;margin-bottom:8px;">
                                    Table size is derived from your selection:<br>
                                    <strong>cols</strong> = block width · <strong>rows</strong> = block height × 2<br>
                                    After placing, open <em>Edit content</em> to fill cells, merge, and style.
                                </div>
                                <label class="border-toggle">
                                    <input type="checkbox" id="activeTableShowBorders" ${window.activeTableShowBorders?'checked':''} onchange="window.activeTableShowBorders=this.checked">
                                    Show cell borders
                                </label>
                            </div>
                        ` : ''}
                        <label class="border-toggle" style="margin-top:8px;">
                            <input type="checkbox" id="activeBorder" ${window.activeShowBorder?'checked':''} onchange="window.activeShowBorder=this.checked">
                            Show border on page
                        </label>
                        <div class="block-actions" style="margin-top:10px;">
                            <button type="button" class="btn btn-primary" id="btnSet" onclick="setBlock()">✔ Set Block</button>
                        </div>
                    </div>
                </div>
            `;
        } else if (!locked && freeCount === 0) {
            html += `<div style="padding:20px;text-align:center;color:#2d7d46;font-weight:700;">All space allocated. Press Done to lock the layout.</div>`;
        } else if (locked) {
            html += `<div style="padding:16px;text-align:center;color:#6c757d;font-weight:600;">Layout is locked. You can still edit content of any block. Unlock to change structure.</div>`;
        }

        html += `
            <div class="editor-toolbar" style="margin-top:16px;">
                <span class="info">Page ${currentPageIndex + 1} · ${page.blocks.length} block(s) · ${freeCount} free cells ${locked ? '· 🔒 Layout locked' : ''}</span>
                <button type="button" class="btn btn-outline btn-sm" id="btnUndo" onclick="undo()" ${historyIndex <= 0 ? 'disabled' : ''}>↩ Undo</button>
                <button type="button" class="btn btn-outline btn-sm" id="btnRedo" onclick="redo()" ${historyIndex >= history.length - 1 ? 'disabled' : ''}>↪ Redo</button>
                ${!locked ? `<button type="button" class="btn btn-outline btn-sm" onclick="resetPage()">🗑 Reset Page</button>` : ''}
                ${locked
                    ? `<button type="button" class="btn btn-primary btn-sm" onclick="unlockPage()">🔓 Unlock Layout</button>`
                    : `<button type="button" class="btn btn-success btn-sm" onclick="lockPage()" ${page.blocks.length === 0 ? 'disabled' : ''}>✅ Done (Lock Layout)</button>`
                }
            </div>
        `;

        container.innerHTML = html;

        attachSelectionListeners();

        const activeGrid = document.getElementById('activeGrid');
        if (activeGrid) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const key = cellKey(r, c);
                    if (page.usedCells.has(key)) cell.classList.add('used');
                    else if (window.activeSelection.has(key)) cell.classList.add('selected');
                    cell.onclick = () => toggleCell(r, c);
                    activeGrid.appendChild(cell);
                }
            }
            validateSelection();
        }

        updateUndoRedoButtons();
        updatePreview('active');
        if (expandedBlockIdx !== null) updatePreview('edit');
        updateThumbnail();
    }

    // ========== RENDER EDIT PANEL ==========
    function renderEditPanel(b, idx) {
        if (b.type === 'text') {
            const state = {
                fontSize: b.fontSize || 18, color: b.color || '#1a1a1a',
                textAlign: b.textAlign || 'center', verticalAlign: b.verticalAlign || 'center',
                bold: b.bold || false, italic: b.italic || false, underline: b.underline || false,
                lineHeight: b.lineHeight || 1.35, fontFamily: b.fontFamily || ''
            };
            return `
                <div class="edit-panel">
                    <label style="font-weight:700;font-size:12px;">Text content (rich)</label>
                    <div id="editText" class="rich-editor" contenteditable="true"
                         oninput="updateEditText(${idx}, this.innerHTML)">${b.text || ''}</div>
                    ${fmtToolbarHtml('edit', state)}
                    <div class="preview-box" id="editPreview"></div>
                    <label class="border-toggle" style="margin-top:10px;">
                        <input type="checkbox" ${b.showBorder !== false ? 'checked' : ''} onchange="toggleBlockBorder(${idx}, this.checked)">
                        Show border on page
                    </label>
                    <div style="margin-top:10px;">
                        <button type="button" class="btn btn-success btn-sm" onclick="toggleBlockAccordion(${idx})">✓ Done editing</button>
                    </div>
                </div>`;
        } else if (b.type === 'image') {
            const imgState = {
                imageAlign: b.imageAlign || 'center',
                imageVerticalAlign: b.imageVerticalAlign || 'center',
                imageFit: b.imageFit || 'contain',
                imageScale: b.imageScale ?? 100
            };
            return `
                <div class="edit-panel">
                    <label style="font-weight:700;font-size:12px;">Image</label>
                    <div class="img-preview-wrap" style="margin-bottom:8px;">
                        ${b.imagePath ? `<img src="${escapeHtml(b.imagePath)}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid #dee2e6;">` : '<div class="ph">🖼️</div>'}
                        <input type="file" accept="image/*" onchange="handleEditImage(event, ${idx})">
                    </div>
                    ${imageControlsHtml('edit', imgState)}
                    <label class="border-toggle" style="margin-top:8px;">
                        <input type="checkbox" ${b.imageLabelOn ? 'checked' : ''} onchange="updateImageLabelOn(${idx}, this.checked)">
                        Show label under image
                    </label>
                    <div style="display:${b.imageLabelOn ? 'block' : 'none'};margin-top:6px;">
                        <label style="font-weight:700;font-size:12px;">Label text</label>
                        <input value="${escapeHtml(b.imageLabel || '')}" oninput="updateImageLabel(${idx}, this.value)" placeholder="e.g. cat" style="width:100%;padding:8px 12px;border:2px solid #dee2e6;border-radius:8px;font-size:13px;">
                    </div>
                    <label class="border-toggle" style="margin-top:10px;">
                        <input type="checkbox" ${b.showBorder !== false ? 'checked' : ''} onchange="toggleBlockBorder(${idx}, this.checked)">
                        Show border on page
                    </label>
                    <div style="margin-top:10px;">
                        <button type="button" class="btn btn-success btn-sm" onclick="toggleBlockAccordion(${idx})">✓ Done editing</button>
                    </div>
                </div>`;
        } else if (b.type === 'trace') {
            return `
                <div class="edit-panel">
                    <label style="font-weight:700;font-size:12px;">Target letter / word <span style="font-weight:400;color:#6c757d;">(empty = blank lines)</span></label>
                    <input value="${escapeHtml(b.traceTarget || '')}" oninput="updateTraceField(${idx},'traceTarget',this.value)" placeholder="e.g. a  or  cat" style="width:100%;padding:8px 12px;border:2px solid #dee2e6;border-radius:8px;font-size:13px;">
                    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;">
                        <div class="select-group">
                            <label>Style</label>
                            <select onchange="updateTraceField(${idx},'traceStyle',this.value)">
                                <option value="outlined" ${b.traceStyle !== 'solid' ? 'selected' : ''}>Outlined</option>
                                <option value="solid" ${b.traceStyle === 'solid' ? 'selected' : ''}>Solid</option>
                            </select>
                        </div>
                        <div class="select-group">
                            <label>Clones</label>
                            <input type="number" value="${b.traceClones || 5}" min="1" max="20" style="width:64px;padding:4px 6px;border:1px solid #ced4da;border-radius:6px;font-size:12px;" onchange="updateTraceField(${idx},'traceClones',Math.min(20,Math.max(1,parseInt(this.value)||5)))">
                        </div>
                        <div class="select-group">
                            <label>Repeat</label>
                            <select onchange="updateTraceField(${idx},'traceRepeatAll',this.value==='true')">
                                <option value="true" ${b.traceRepeatAll !== false ? 'selected' : ''}>All sets</option>
                                <option value="false" ${b.traceRepeatAll === false ? 'selected' : ''}>First only</option>
                            </select>
                        </div>
                    </div>
                    <label class="border-toggle" style="margin-top:10px;">
                        <input type="checkbox" ${b.showBorder !== false ? 'checked' : ''} onchange="toggleBlockBorder(${idx}, this.checked)">
                        Show border on page
                    </label>
                    <div style="margin-top:10px;">
                        <button type="button" class="btn btn-success btn-sm" onclick="toggleBlockAccordion(${idx})">✓ Done editing</button>
                    </div>
                </div>`;
        } else if (b.type === 'table') {
            return renderTableEditPanel(b, idx);
        }
        return '';
    }

    // ========== TABLE EDIT PANEL ==========
    function renderTableEditPanel(b, idx) {
        const rows = b.tableRows || (b.rowSpan * 2);
        const cols = b.tableCols || b.colSpan;
        const cells = b.cells || [];
        const rect = isTableRect(tableSel);
        let primary = null;
        if (tableSel.size) {
            const first = parseTKey(Array.from(tableSel)[0]);
            primary = findTableCellAt(cells, first.r, first.c);
        }

        let mini = `<div class="mini-table" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},minmax(28px,auto));">`;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const owner = findTableCellAt(cells, r, c);
                if (!owner || owner.r !== r || owner.c !== c) continue;
                const selected = coveredKeys(owner).some(ck => tableSel.has(ck));
                const style = [
                    `grid-row:${owner.r + 1}/span ${owner.rowSpan}`,
                    `grid-column:${owner.c + 1}/span ${owner.colSpan}`,
                    `background:${escapeStyle(owner.bg || '#f1f3f5')}`,
                    owner.bold ? 'font-weight:700' : 'font-weight:400',
                    owner.italic ? 'font-style:italic' : '',
                    `font-size:${Math.min(18, owner.fontSize || 14)}px`
                ].filter(Boolean).join(';');
                mini += `<div class="mt-cell ${selected ? 'selected' : ''}" style="${style}" onclick="toggleTableCell(${idx},${r},${c})" title="${owner.rowSpan}×${owner.colSpan}">${escapeHtml(owner.text || '')}</div>`;
            }
        }
        mini += '</div>';

        let ownerCount = 0;
        if (rect && tableSel.size > 1) {
            const seen = new Set();
            for (const k of tableSel) {
                const { r, c } = parseTKey(k);
                const o = findTableCellAt(cells, r, c);
                if (o) seen.add(tKey(o.r, o.c));
            }
            ownerCount = seen.size;
        }
        const canMerge = rect && ownerCount >= 2;
        const canUnmerge = primary && (primary.rowSpan > 1 || primary.colSpan > 1);

        return `
            <div class="edit-panel">
                <div style="font-size:12px;font-weight:700;color:#6c757d;margin-bottom:6px;">Click cells to select a rectangle · ${rows}×${cols} table</div>
                ${mini}
                <div class="block-actions" style="margin-top:8px;">
                    <button type="button" class="btn btn-primary btn-xs" onclick="mergeTableCells(${idx})" ${canMerge ? '' : 'disabled'}>Merge</button>
                    <button type="button" class="btn btn-outline btn-xs" onclick="unmergeTableCells(${idx})" ${canUnmerge ? '' : 'disabled'}>Unmerge</button>
                    <button type="button" class="btn btn-outline btn-xs" onclick="clearTableSel()">Clear selection</button>
                </div>
                <div style="margin-top:10px;display:${tableSel.size ? 'block' : 'none'};">
                    <label style="font-weight:700;font-size:12px;">Cell text</label>
                    <input value="${escapeHtml(primary ? (primary.text || '') : '')}" oninput="applyTableCellProp(${idx},'text',this.value)" placeholder="Centered text" style="width:100%;padding:8px 12px;border:2px solid #dee2e6;border-radius:8px;font-size:13px;">
                    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;align-items:flex-end;">
                        <div class="select-group">
                            <label>Background</label>
                            <input type="color" value="${escapeStyle(primary ? (primary.bg || '#f1f3f5') : '#f1f3f5')}" onchange="applyTableCellProp(${idx},'bg',this.value)" style="width:42px;height:32px;border:1px solid #ced4da;border-radius:6px;padding:2px;cursor:pointer;">
                        </div>
                        <div class="select-group">
                            <label>Size</label>
                            <input type="number" value="${primary ? (primary.fontSize || 14) : 14}" min="10" max="22" style="width:56px;padding:4px 6px;border:1px solid #ced4da;border-radius:6px;font-size:12px;" onchange="applyTableCellProp(${idx},'fontSize',Math.min(22,Math.max(10,parseInt(this.value)||14)))">
                        </div>
                        <div class="select-group">
                            <label>Bold</label>
                            <select onchange="applyTableCellProp(${idx},'bold',this.value==='true')">
                                <option value="false" ${primary && !primary.bold ? 'selected' : ''}>Off</option>
                                <option value="true" ${primary && primary.bold ? 'selected' : ''}>On</option>
                            </select>
                        </div>
                        <div class="select-group">
                            <label>Italic</label>
                            <select onchange="applyTableCellProp(${idx},'italic',this.value==='true')">
                                <option value="false" ${primary && !primary.italic ? 'selected' : ''}>Off</option>
                                <option value="true" ${primary && primary.italic ? 'selected' : ''}>On</option>
                            </select>
                        </div>
                    </div>
                </div>
                <label class="border-toggle" style="margin-top:10px;">
                    <input type="checkbox" ${b.tableShowBorders !== false ? 'checked' : ''} onchange="toggleTableBorders(${idx}, this.checked)">
                    Show cell borders
                </label>
                <label class="border-toggle" style="margin-top:6px;">
                    <input type="checkbox" ${b.showBorder !== false ? 'checked' : ''} onchange="toggleBlockBorder(${idx}, this.checked)">
                    Show border on page
                </label>
                <div style="margin-top:10px;">
                    <button type="button" class="btn btn-success btn-sm" onclick="toggleBlockAccordion(${idx})">✓ Done editing</button>
                </div>
            </div>`;
    }

    // ========== INIT ==========
    async function init() {
        await load();
        document.getElementById('app').innerHTML = `
            <div class="app-header">
                <h1>📚 Phonics Grid Publisher</h1>
                <span class="badge" id="lessonCount">0</span>
            </div>
            <div class="tabs">
                <button type="button" class="tab-btn active" data-tab="edit" onclick="switchTab('edit')">✏️ Build Pages</button>
                <button type="button" class="tab-btn" data-tab="view" onclick="switchTab('view')">👁️ View / Print</button>
                <button type="button" class="tab-btn" data-tab="lessons" onclick="switchTab('lessons')">📖 Lessons</button>
            </div>
            <div class="tab-panel active" id="editPanel">
                <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap;">
                    <label style="font-weight:700;font-size:13px;">Current page:</label>
                    <select id="pageSelect" onchange="changePage(this.value)" style="padding:7px 12px;border:2px solid #dee2e6;border-radius:8px;font-size:13px;"></select>
                    <button type="button" class="btn btn-outline btn-sm" onclick="addPage()">＋ Add Page</button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="duplicatePage()">⧉ Duplicate Page</button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="deletePage()" id="btnDeletePage">🗑 Delete Page</button>
                </div>
                <div id="editorArea"></div>
            </div>
            <div class="tab-panel" id="viewPanel">
                <div class="view-toolbar">
                    <span class="info" id="viewInfo">Ready</span>
                    <button type="button" class="btn btn-primary" onclick="window.print()">🖨 Print All Pages</button>
                </div>
                <div class="view-container" id="viewContainer"></div>
            </div>
            <div class="tab-panel" id="lessonsPanel">
                <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px;">
                    <button type="button" class="btn btn-primary" onclick="addLesson()">＋ New Lesson</button>
                    <button type="button" class="btn btn-outline" onclick="exportLessonsJson()">⬇ Export JSON</button>
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('importJsonInput').click()">⬆ Import JSON</button>
                    <input type="file" id="importJsonInput" accept="application/json,.json" style="display:none" onchange="importLessonsJson(event)">
                </div>
                <div class="lesson-list" id="lessonList"></div>
            </div>
        `;
        pushHistory();
        renderAll();
    }

    init().catch(err => {
        console.error('Initialization failed:', err);
        showToast('Failed to initialize app', 'error');
    });
})();
</script>
</body>
</html>
