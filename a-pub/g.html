<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phonics Lessons</title>
<style>
  @page { size: 850px 1100px; margin: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    background: #fff;
  }

  /* --- Global Controls (Export All) --- */
  .global-controls {
    padding: 12px 40px;
    background: #f8f9fa;
    border-bottom: 3px solid #F5A623;
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: flex-end;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .global-controls .label {
    font-weight: 700;
    color: #1a1a1a;
    margin-right: auto;
    font-size: 18px;
  }
  .export-all-btn {
    background: #2d7d46;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-weight: 700;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .export-all-btn:hover { background: #1f5f34; }

  /* --- Page & Card Styles --- */
  .page {
    width: 850px;
    min-height: 1080px;
    padding: 30px 40px;
    position: relative;
    page-break-after: always;
  }
  .page:last-child { page-break-after: auto; }

  .card {
    border: 3px solid #F5A623;
    border-radius: 28px;
    min-height: 1000px;
    padding: 24px 32px;
    position: relative;
  }

  .title {
    font-size: 30px;
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: 0.5px;
    margin: 4px 0 18px 0;
  }

  .header-row {
    display: flex;
    align-items: stretch;
    gap: 0;
    margin-bottom: 22px;
  }

  .lesson-badge {
    background: #F5A623;
    border-radius: 16px;
    color: #fff;
    width: 130px;
    min-width: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 6px;
    position: relative;
    margin-right: 18px;
  }
  .lesson-badge .arrow {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 26px solid #F5A623;
  }
  .lesson-badge .label { font-size: 13px; font-weight: 600; opacity: 0.95; }
  .lesson-badge .num { font-size: 34px; font-weight: 800; line-height: 1.1; }

  .intro-box {
    flex: 1;
    border: 3px dashed #E2571C;
    border-radius: 16px;
    display: flex;
    align-items: center;
    padding: 14px 20px;
  }
  .intro-box p {
    margin: 0;
    color: #E2571C;
    font-weight: 700;
    font-size: 14px;
    line-height: 1.5;
  }

  .hero-row {
    display: flex;
    border-radius: 20px;
    overflow: hidden;
    border: 3px solid #F5A623;
    height: 280px;
    margin-bottom: 22px;
  }
  .hero-image {
    flex: 1;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .hero-image img { max-height: 200px; max-width: 80%; object-fit: contain; }
  .hero-image .placeholder {
    width: 200px; height: 2cqw;
    border: 2px dashed #ccc;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #999; font-size: 12px;
  }
  .hero-image .caption { font-weight: 800; font-size: 18px; color: #1a1a1a; }
  .hero-letter {
    flex: 1;
    background: #F5A623;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 90px;
    font-weight: 800;
    font-style: italic;
  }

  .section-header {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    margin-top: 12px;
  }
  .section-header .circle {
    background: #F5A623;
    color: #fff;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px;
    margin-right: 14px;
    flex-shrink: 0;
  }
  .section-header .label-box {
    flex: 1;
    border: 3px dashed #E2571C;
    border-radius: 14px;
    padding: 8px 18px;
    font-weight: 800;
    font-size: 19px;
    color: #1a1a1a;
  }

  .word-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .word-grid .pill {
    background: #E2571C;
    color: #fff;
    border-radius: 14px;
    text-align: center;
    padding: 8px 6px;
    font-weight: 600;
    font-size: 28px;
    min-height: 60px;
  }
  .word-grid.blanks .pill {
    background: #fff;
    color: #E2571C;
    border: 2px solid #F5A623;
    min-height: 60px;
  }
  .word-grid.empty .pill {
    background: #fff;
    border: 2px solid #F5A623;
    min-height: 60px;
  }

  .instructions {
    font-weight: 700;
    font-size: 13px;
    margin: 8px 0 10px 0;
    color: #1a1a1a;
  }

  .reading-box {
    border: 2px solid #F5A623;
    border-radius: 16px;
    padding: 12px 22px;
  }
  .reading-box p {
    margin: 0 0 5px 0;
    color: #E2571C;
    font-weight: 700;
    font-size: 18px;
  }
  .reading-box p:last-child { margin-bottom: 0; }

  .activity-label { font-weight: 700; font-size: 13px; margin: 10px 0 6px 0; }

  .sentence-line {
    border-bottom: 1px solid #999;
    padding: 6px 0 14px 0;
    font-size: 16px;
    color: #E2571C;
    font-weight: 800;
  }

  /* Page number fixed at bottom right */
  .card {
    position: relative;  
  }

  .page-number {
    position: absolute;
    bottom: 20px;
    right: 30px;
    margin: 0;
    font-weight: 800;
    font-size: 16px;
    color: #1a1a1a;
  }

  .page-actions {
    text-align: right;
    margin-bottom: 8px;
  }
  .export-btn {
    background: #E2571C;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 700;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .export-btn:hover { background: #c8481a; }

  /* --- Table of Contents Styles --- */
  .toc-card {
    border: 3px solid #F5A623;
    border-radius: 28px;
    min-height: 1000px;
    padding: 40px 48px;
    position: relative;
  }
  .toc-title {
    font-size: 36px;
    font-weight: 800;
    color: #1a1a2e;
    text-align: center;
    margin-bottom: 30px;
    border-bottom: 4px solid #F5A623;
    padding-bottom: 16px;
  }
  .toc-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .toc-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 8px;
    border-bottom: 1px dashed #dee2e6;
    font-size: 18px;
    font-weight: 600;
    color: #1a1a1a;
  }
  .toc-item .toc-lesson-title {
    flex: 1;
    text-align: left;
    padding-right: 20px;
  }
  .toc-item .toc-page-num {
    font-weight: 800;
    color: #E2571C;
    min-width: 80px;
    text-align: right;
  }

  /* keep colors/borders in print + PDF export */
  .card, .lesson-badge, .hero-letter, .word-grid .pill,
  .intro-box, .section-header .circle, .reading-box,
  .toc-card {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Print overrides */
  @media print {
    .no-print { display: none !important; }
    body.print-single .page { display: none; }
    body.print-single .page.print-target {
      display: block;
      page-break-after: auto !important;
    }
  }
</style>

// ==================== RENDER ENGINE (with TOC) ====================
const MAX_TOC_ENTRIES_PER_PAGE = 18; // Safe number of lessons per Table of Contents page

function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (typeof html !== 'undefined') e.innerHTML = html;
  return e;
}

function wordGrid(words, extraClass) {
  var grid = el('div', 'word-grid ' + (extraClass || ''));
  for (var i = 0; i < words.length; i++) {
    grid.appendChild(el('div', 'pill', words[i]));
  }
  return grid;
}

function exportButton(pageId) {
  var wrap = el('div', 'page-actions no-print');
  var btn = el('button', 'export-btn', 'Export this page to PDF');
  btn.type = 'button';
  btn.onclick = function () { exportSinglePage(pageId); };
  wrap.appendChild(btn);
  return wrap;
}

function exportSinglePage(pageId) {
  var target = document.getElementById(pageId);
  if (!target) return;
  target.classList.add('print-target');
  document.body.classList.add('print-single');
  window.print();
}

window.addEventListener('afterprint', function () {
  document.body.classList.remove('print-single');
  var targets = document.querySelectorAll('.print-target');
  for (var i = 0; i < targets.length; i++) targets[i].classList.remove('print-target');
});

function buildGlobalControls(lessons) {
  var wrap = el('div', 'global-controls no-print');
  var mainTitle = (lessons && lessons.length > 0 && lessons[0].mainTitle) 
                    ? lessons[0].mainTitle 
                    : '📚 Phonics Lessons';
  var label = el('span', 'label', '📚 ' + mainTitle + ' — ' + lessons.length + ' Lessons');
  var btn = el('button', 'export-all-btn', '⬇ Export ALL pages as PDF');
  btn.type = 'button';
  btn.onclick = function () { window.print(); };
  wrap.appendChild(label);
  wrap.appendChild(btn);
  return wrap;
}

function buildTocPage(pageId, pageNumber, entries) {
  var page = el('div', 'page');
  page.id = pageId;
  page.appendChild(exportButton(pageId));

  var card = el('div', 'toc-card');
  page.appendChild(card);

  var title = el('div', 'toc-title', 'Table of Contents');
  card.appendChild(title);

  var list = el('ul', 'toc-list');
  entries.forEach(function(entry) {
    var item = el('li', 'toc-item');
    var lessonDesc = el('span', 'toc-lesson-title');
    lessonDesc.textContent = 'Lesson ' + entry.lessonNumber + ': ' + entry.mainTitle +
        (entry.imageCaption ? ' — ' + entry.imageCaption : '');
    item.appendChild(lessonDesc);
    var pageNum = el('span', 'toc-page-num', 'Page ' + entry.firstPage);
    item.appendChild(pageNum);
    list.appendChild(item);
  });
  card.appendChild(list);

  card.appendChild(el('div', 'page-number', pageNumber));
  return page;
}

function buildPageOne(lesson, pageId, pageNumber) {
  var page = el('div', 'page');
  page.id = pageId;
  page.appendChild(exportButton(pageId));

  var card = el('div', 'card');
  page.appendChild(card);

  var titleText = lesson.mainTitle || 'SHORT VOWEL CVC WORDS';
  card.appendChild(el('div', 'title', titleText));

  var headerRow = el('div', 'header-row');
  var badge = el('div', 'lesson-badge');
  badge.appendChild(el('div', 'arrow'));
  badge.appendChild(el('div', 'label', 'Lesson'));
  badge.appendChild(el('div', 'num', lesson.lessonNumber));
  headerRow.appendChild(badge);

  var introBox = el('div', 'intro-box');
  introBox.appendChild(el('p', null, lesson.introText));
  headerRow.appendChild(introBox);
  card.appendChild(headerRow);

  var heroRow = el('div', 'hero-row');
  var heroImage = el('div', 'hero-image');
  if (lesson.imagePath) {
    var img = el('img');
    img.src = lesson.imagePath;
    img.alt = lesson.imageCaption;
    heroImage.appendChild(img);
  } else {
    heroImage.appendChild(el('div', 'placeholder', 'image'));
  }
  heroImage.appendChild(el('div', 'caption', lesson.imageCaption));
  heroRow.appendChild(heroImage);
  heroRow.appendChild(el('div', 'hero-letter', lesson.letterTile));
  card.appendChild(heroRow);

  var sec1 = el('div', 'section-header');
  sec1.appendChild(el('div', 'circle', '1'));
  sec1.appendChild(el('div', 'label-box', 'Look and say aloud'));
  card.appendChild(sec1);
  var allWords = [];
  for (var r = 0; r < lesson.words.length; r++) {
    allWords = allWords.concat(lesson.words[r]);
  }
  card.appendChild(wordGrid(allWords));

  card.appendChild(el('div', 'page-number', pageNumber));

  return page;
}

function buildPageTwo(lesson, pageId, pageNumber) {

  card.appendChild(sec2);
  card.appendChild(el('div', 'instructions', 'Read ALOUD and circle all words with the short vowel sound'));
  var readingBox = el('div', 'reading-box');
  for (var s = 0; s < lesson.sentences.length; s++) {
    readingBox.appendChild(el('p', null, (s + 1) + '. ' + lesson.sentences[s]));
  }
  card.appendChild(readingBox);

  var sec3 = el('div', 'section-header');
  sec3.appendChild(el('div', 'circle', '3'));
  sec3.appendChild(el('div', 'label-box', 'Activities'));
  card.appendChild(sec3);

  card.appendChild(el('div', 'activity-label', 'A. Fill in the missing letters and say word'));
  card.appendChild(wordGrid(lesson.fillBlanks, 'blanks'));

  var emptySlots = [];
  for (var b = 0; b < lesson.fillBlanks.length; b++) emptySlots.push('&nbsp;');
  card.appendChild(el('div', 'activity-label', 'B. Copy each word from above'));
  card.appendChild(wordGrid(emptySlots, 'empty'));

  card.appendChild(el('div', 'activity-label', 'C. Choose any word from above and form 2 sentences'));
  card.appendChild(el('div', 'sentence-line', '1.'));
  card.appendChild(el('div', 'sentence-line', '2.'));

  card.appendChild(el('div', 'page-number', pageNumber));

  return page;
}

function render(lessons) {
  var root = document.getElementById('root');
  root.innerHTML = '';

  // Add global "Export All" control (unchanged)
  root.appendChild(buildGlobalControls(lessons));

  if (lessons.length === 0) return;

  // Calculate TOC pages
  const totalTocPages = Math.ceil(lessons.length / MAX_TOC_ENTRIES_PER_PAGE);
  const lessonStartPage = totalTocPages + 1; // first lesson page number

  // Build TOC entries with correct starting page numbers
  const tocEntries = lessons.map((lesson, index) => ({
    lessonNumber: lesson.lessonNumber,
    mainTitle: lesson.mainTitle,
    imageCaption: lesson.imageCaption,
    firstPage: lessonStartPage + index * 2
  }));

  // Create TOC pages
  for (let p = 0; p < totalTocPages; p++) {
    const start = p * MAX_TOC_ENTRIES_PER_PAGE;
    const end = start + MAX_TOC_ENTRIES_PER_PAGE;
    const pageEntries = tocEntries.slice(start, end);
    const tocId = 'toc-page-' + (p + 1);
    root.appendChild(buildTocPage(tocId, p + 1, pageEntries));
  }

  // Create lesson pages
  let pageCounter = lessonStartPage;
  for (var i = 0; i < lessons.length; i++) {
    var lesson = lessons[i];
    var idOne = 'lesson-' + (i + 1) + '-page-1';
    var idTwo = 'lesson-' + (i + 1) + '-page-2';
    root.appendChild(buildPageOne(lesson, idOne, pageCounter++));
    root.appendChild(buildPageTwo(lesson, idTwo, pageCounter++));
  }
}

render(window.LESSONS);
</script>
