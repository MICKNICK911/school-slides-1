<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📚 Phonics Grid Publisher — Spatial Layout</title>
<style>
@page { size: 850px 1100px; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #1a1a1a; padding: 16px; }
.app { max-width: 1600px; margin: 0 auto; background: #fff; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); overflow: hidden; }
.app-header { background: #1a1a2e; color: #fff; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.app-header h1 { font-size: 22px; font-weight: 800; }
.badge { background: #F5A623; color: #1a1a1a; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: 700; }
.tabs { display: flex; border-bottom: 2px solid #e9ecef; background: #fafbfc; padding: 0 24px; }
.tab-btn { padding: 14px 24px; border: none; background: transparent; font-size: 14px; font-weight: 700; color: #6c757d; cursor: pointer; border-bottom: 3px solid transparent; font-family: inherit; }
.tab-btn.active { color: #1a1a2e; border-bottom-color: #F5A623; }
.tab-panel { display: none; padding: 20px 24px 28px; }
.tab-panel.active { display: block; }

.toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: 380px; pointer-events: none; }
.toast { padding: 12px 18px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 8px; pointer-events: auto; animation: slideIn 0.25s ease; }
.toast.success { background: #2d7d46; } .toast.error { background: #dc3545; } .toast.warning { background: #e67e22; } .toast.info { background: #2c7be5; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

.btn { padding: 9px 18px; border: none; border-radius: 9px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: #F5A623; color: #1a1a1a; }
.btn-success { background: #2d7d46; color: #fff; }
.btn-danger { background: #dc3545; color: #fff; }
.btn-outline { background: transparent; border: 2px solid #dee2e6; color: #495057; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-xs { padding: 4px 9px; font-size: 11px; border-radius: 6px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ===== EDITOR ===== */
.editor-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 2px solid #e9ecef; }
.editor-toolbar .info { font-weight: 700; color: #6c757d; font-size: 13px; margin-right: auto; }

.block-card {
    background: #f8f9fa;
    border: 2px solid #e9ecef;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 18px;
}
.block-card.locked { border-color: #F5A623; }
.block-card h3 { font-size: 14px; font-weight: 800; color: #E2571C; margin-bottom: 10px; grid-column: 1 / -1; }

.block-left { display: flex; flex-direction: column; gap: 10px; }
.block-left label { font-weight: 700; font-size: 12px; color: #495057; display: block; margin-bottom: 3px; }
.block-left input, .block-left textarea, .block-left select {
    width: 100%; padding: 8px 12px; border: 2px solid #dee2e6; border-radius: 8px; font-size: 13px; font-family: inherit;
}
.block-left textarea { min-height: 90px; resize: vertical; font-family: inherit; line-height: 1.4; }
.mode-toggle { display: flex; gap: 8px; margin-bottom: 6px; }
.mode-toggle button {
    flex: 1; padding: 8px; border: 2px solid #dee2e6; border-radius: 8px; background: #fff;
    font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit;
}
.mode-toggle button.active { border-color: #F5A623; background: #fff8e6; color: #E2571C; }

.img-preview-wrap { display: flex; align-items: center; gap: 10px; }
.img-preview-wrap img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 2px solid #dee2e6; }
.img-preview-wrap .ph { width: 64px; height: 64px; border: 2px dashed #dee2e6; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #adb5bd; background: #fff; }

.border-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.border-toggle input { width: 16px; height: 16px; accent-color: #F5A623; }

.block-right { display: flex; flex-direction: column; gap: 8px; }
.grid-label { font-size: 12px; font-weight: 700; color: #6c757d; }
.radio-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 3px;
    background: #fff;
    padding: 6px;
    border-radius: 10px;
    border: 2px solid #dee2e6;
}
.radio-grid .cell {
    aspect-ratio: 1;
    border: 1px solid #ced4da;
    border-radius: 3px;
    background: #f1f3f5;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    position: relative;
}
.radio-grid .cell:hover:not(.used):not(.invalid) { background: #ffe8a3; border-color: #F5A623; }
.radio-grid .cell.selected { background: #F5A623; border-color: #E2571C; }
.radio-grid .cell.used { background: #ffc9c9; border-color: #e03131; cursor: not-allowed; }
.radio-grid .cell.preview { background: #ffd8a8; border-color: #f08c00; }
.radio-grid .cell.invalid { background: #ffc9c9; border-color: #fa5252; }

.block-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.validation-msg { font-size: 12px; font-weight: 600; color: #e03131; min-height: 18px; }

/* Formatting toolbar */
.fmt-toolbar {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 8px; background: #fff; border: 2px solid #dee2e6; border-radius: 8px;
}
.fmt-toolbar .fmt-btn {
    width: 32px; height: 32px; border: 1px solid #ced4da; border-radius: 6px;
    background: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-family: inherit;
}
.fmt-toolbar .fmt-btn.active { background: #fff8e6; border-color: #F5A623; color: #E2571C; }
.fmt-toolbar .fmt-btn:hover { border-color: #F5A623; }
.fmt-toolbar .sep { width: 1px; height: 22px; background: #dee2e6; margin: 0 2px; }
.fmt-toolbar label { font-size: 11px; font-weight: 600; color: #6c757d; margin-right: 2px; }
.fmt-toolbar input[type="color"] { width: 32px; height: 32px; border: 1px solid #ced4da; border-radius: 6px; padding: 2px; cursor: pointer; }
.fmt-toolbar select { padding: 4px 6px; border: 1px solid #ced4da; border-radius: 6px; font-size: 12px; font-family: inherit; }

.align-group { display: flex; gap: 4px; flex-wrap: wrap; }
.align-group button {
    padding: 5px 10px; border: 1px solid #ced4da; border-radius: 6px; background: #fff;
    font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.align-group button.active { background: #fff8e6; border-color: #F5A623; color: #E2571C; }

.edit-panel { grid-column: 1 / -1; background: #fff; border: 2px solid #F5A623; border-radius: 10px; padding: 14px; margin-top: 6px; }
.summary-text { font-size: 13px; font-weight: 600; color: #333; white-space: pre-wrap; max-height: 60px; overflow: hidden; }

/* ===== VIEW ===== */
.view-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #e9ecef; }
.view-toolbar .info { font-weight: 700; color: #6c757d; font-size: 13px; margin-right: auto; }
.view-container { overflow-x: auto; }
.view-container .page {
    width: 850px; min-width: 850px; min-height: 1100px;
    padding: 28px 32px; margin: 0 auto 24px; background: #fff;
    border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    position: relative; page-break-after: always;
}
.page-card {
    border: 4px solid #E2571C; border-radius: 12px;
    width: 100%; height: 1040px; position: relative; overflow: hidden;
    background: #fff;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.page-header {
    display: flex; align-items: stretch; border-bottom: 3px solid #E2571C; height: 64px;
}
.page-header-left { flex: 1; padding: 10px 20px; display: flex; flex-direction: column; justify-content: center; }
.page-header-left h1 { font-size: 26px; font-weight: 800; color: #E2571C; margin: 0; line-height: 1.1; }
.page-header-left .sub { font-size: 12px; font-weight: 700; color: #c45a12; letter-spacing: 1px; text-transform: uppercase; }
.page-header-right {
    background: #E2571C; color: #fff; min-width: 140px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.page-header-right .lbl { font-size: 12px; font-weight: 600; }
.page-header-right .num { font-size: 24px; font-weight: 800; }

.grid-stage {
    position: absolute;
    top: 64px; left: 0; right: 0; bottom: 36px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(12, 1fr);
    gap: 0;
    padding: 12px 16px;
}
.block {
    position: relative;
    overflow: hidden;
    display: flex;
    padding: 6px;
    background: #fff;
}
.block.has-border {
    border: 2px solid #E2571C;
    border-radius: 8px;
    margin: 2px;
}
.block .block-text {
    width: 100%; height: 100%;
    line-height: 1.35; word-break: break-word;
    color: #1a1a1a;
}
.block .block-text p { margin: 0 0 0.4em 0; }
.block .block-text p:last-child { margin-bottom: 0; }
.block .block-text ul, .block .block-text ol {
    margin: 0.2em 0 0.4em 0; padding-left: 1.4em;
}
.block .block-text li { margin-bottom: 0.15em; }
.block .block-img {
    max-width: 100%; max-height: 100%; border-radius: 4px;
}
.block .block-img-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; gap: 4px; overflow: hidden;
}
.block .block-img-label {
    font-size: 13px; font-weight: 700; color: #1a1a1a; text-align: center;
    line-height: 1.2; max-width: 100%; word-break: break-word;
}
/* Trace guidelines */
.block .trace-wrap {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: space-evenly;
    padding: 2px 4px; box-sizing: border-box;
}
.block .trace-set {
    position: relative; width: 100%; flex: 1; min-height: 0;
    margin: 2px 0;
}
.block .trace-set .tline {
    position: absolute; left: 0; right: 0; height: 0;
    border-top-width: 1.5px; border-top-style: solid;
}
.block .trace-set .tline.red { border-top-color: #e03131; }
.block .trace-set .tline.blue { border-top-color: #1c7ed6; }
.block .trace-set .trace-letters {
    position: absolute; left: 0; right: 0;
    display: flex; justify-content: space-evenly; align-items: center;
    pointer-events: none;
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', 'Segoe UI', Arial, sans-serif;
    font-weight: 400; line-height: 1;
    color: #868e96; /* solid = soft gray model letters */
}
.block .trace-set .trace-letters.outlined {
    color: transparent;
    -webkit-text-stroke: 1.3px #868e96;
}
@media print {
    .block .trace-set .trace-letters.outlined {
        color: transparent;
        -webkit-text-stroke: 1.1px #495057;
    }
    .block .trace-set .tline { border-top-width: 1.25px; }
}
/* Inner table block */
.block .inner-table {
    width: 100%; height: 100%;
    display: grid;
    gap: 0;
    box-sizing: border-box;
}
.block .inner-table .it-cell {
    display: flex; align-items: center; justify-content: center;
    text-align: center; overflow: hidden; padding: 2px;
    font-family: inherit; line-height: 1.2; word-break: break-word;
    box-sizing: border-box;
}
.block .inner-table.has-borders .it-cell {
    border: 1px solid #adb5bd;
}
/* Editor mini-table */
.mini-table {
    display: grid; gap: 2px; background: #dee2e6; border: 2px solid #dee2e6;
    border-radius: 8px; overflow: hidden; max-width: 100%;
}
.mini-table .mt-cell {
    background: #f1f3f5; min-height: 28px; padding: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; cursor: pointer; text-align: center;
    word-break: break-word; line-height: 1.15;
    border: 2px solid transparent; user-select: none;
}
.mini-table .mt-cell.selected { border-color: #F5A623; background: #fff3bf; }
.mini-table .mt-cell.covered { opacity: 0.35; pointer-events: none; }
.page-number {
    position: absolute; bottom: 10px; left: 0; right: 0;
    text-align: center; font-weight: 700; font-size: 13px; color: #6c757d;
}

.page-actions { text-align: right; margin-bottom: 6px; }
.export-btn { background: #E2571C; color: #fff; border: none; border-radius: 7px; padding: 7px 14px; font-weight: 700; font-size: 12px; cursor: pointer; font-family: inherit; }

@media print {
    body { padding: 0; background: #fff; }
    .app, .app-header, .tabs, .tab-panel, .view-toolbar, .no-print { display: none !important; }
    .view-container { overflow: visible !important; }
    .view-container .page { box-shadow: none !important; border-radius: 0 !important; margin: 0 !important; padding: 16px !important; page-break-after: always; }
    .view-container .page .page-actions { display: none !important; }
    .page-card, .page-header-right { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}

/* Lesson list */
.lesson-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.lesson-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #f8f9fa; border-radius: 10px; border: 2px solid transparent; }
.lesson-item:hover { border-color: #F5A623; background: #fff; }
.lesson-item .info { flex: 1; min-width: 0; }
.lesson-item .title { font-weight: 700; font-size: 14px; }
.lesson-item .sub { font-size: 12px; color: #6c757d; }
.lesson-item .actions { display: flex; gap: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
(function () {
    const STORAGE_KEY = 'phonics_grid_v2';
    const COLS = 8;
    const ROWS = 12;
    const TOTAL = COLS * ROWS;

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function showToast(msg, type = 'info') {
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        t.innerHTML = `<span>${type==='success'?'✅':type==='error'?'❌':type==='warning'?'⚠️':'ℹ️'}</span> ${escapeHtml(msg)}`;
        document.getElementById('toastContainer').appendChild(t);
        setTimeout(() => t.remove(), 3200);
    }

    // ========== DATA ==========
    let lessons = [];
    let currentLessonId = null;
    let currentPageIndex = 0;
    let history = [];
    let historyIndex = -1;
    let nextId = 1;
    let editingBlockIdx = null; // which existing block is expanded for editing
    let _editTextHistoryTimer = null;

    function defaultTextProps() {
        return {
            text: '',
            fontSize: 18,
            bold: false,
            italic: false,
            underline: false,
            color: '#1a1a1a',
            textAlign: 'center',
            verticalAlign: 'center'
        };
    }
    function defaultImageProps() {
        return {
            imagePath: '',
            imageAlign: 'center',
            imageVerticalAlign: 'center',
            imageFit: 'contain', // contain | cover | scale
            imageScale: 100
        };
    }

    function defaultPage() {
        return {
            title: 'SHORT VOWEL CVC WORDS',
            subtitle: 'SHORT VOWEL',
            lessonNumber: 1,
            blocks: [],
            usedCells: new Set(),
            locked: false
        };
    }

    function defaultLesson() {
        return {
            id: 'l' + (nextId++),
            title: 'SHORT VOWEL CVC WORDS',
            subtitle: 'SHORT VOWEL',
            pages: [defaultPage()]
        };
    }

    function load() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('phonics_grid_v1');
            if (raw) {
                const data = JSON.parse(raw);
                lessons = data.lessons || [];
                nextId = data.nextId || lessons.length + 1;
                lessons.forEach(l => l.pages.forEach(p => {
                    p.usedCells = new Set(p.usedCells || []);
                    // migrate old blocks
                    p.blocks.forEach(b => {
                        if (b.type === 'text') {
                            b.bold = b.bold ?? false;
                            b.italic = b.italic ?? false;
                            b.underline = b.underline ?? false;
                            b.color = b.color || '#1a1a1a';
                            b.textAlign = b.textAlign || 'center';
                            b.verticalAlign = b.verticalAlign || 'center';
                        } else if (b.type === 'image') {
                            b.imageAlign = b.imageAlign || 'center';
                            b.imageVerticalAlign = b.imageVerticalAlign || 'center';
                            b.imageFit = b.imageFit || 'contain';
                            b.imageScale = b.imageScale ?? 100;
                            b.imageLabelOn = b.imageLabelOn ?? false;
                            b.imageLabel = b.imageLabel || '';
                        } else if (b.type === 'trace') {
                            b.traceTarget = b.traceTarget || '';
                            b.traceStyle = b.traceStyle === 'solid' ? 'solid' : 'outlined';
                            b.traceClones = b.traceClones ?? 5;
                            b.traceRepeatAll = b.traceRepeatAll !== false;
                        } else if (b.type === 'table') {
                            b.tableRows = b.tableRows || (b.rowSpan * 2);
                            b.tableCols = b.tableCols || b.colSpan;
                            b.tableShowBorders = b.tableShowBorders !== false;
                            if (!Array.isArray(b.cells) || !b.cells.length) {
                                b.cells = initTableCells(b.tableRows, b.tableCols);
                            } else {
                                b.cells.forEach(c => {
                                    c.bg = c.bg || '#f1f3f5';
                                    c.fontSize = Math.min(22, Math.max(10, c.fontSize ?? 14));
                                    c.bold = !!c.bold;
                                    c.italic = !!c.italic;
                                    c.text = c.text || '';
                                    c.rowSpan = Math.max(1, c.rowSpan || 1);
                                    c.colSpan = Math.max(1, c.colSpan || 1);
                                });
                                // Repair missing atomic coverage (corrupted saves)
                                const covered = new Set();
                                b.cells.forEach(cell => {
                                    for (let r = cell.r; r < cell.r + cell.rowSpan; r++) {
                                        for (let c = cell.c; c < cell.c + cell.colSpan; c++) {
                                            covered.add(r + ',' + c);
                                        }
                                    }
                                });
                                for (let r = 0; r < b.tableRows; r++) {
                                    for (let c = 0; c < b.tableCols; c++) {
                                        if (!covered.has(r + ',' + c)) {
                                            b.cells.push({
                                                r, c, rowSpan: 1, colSpan: 1,
                                                text: '', bg: '#f1f3f5',
                                                fontSize: 14, bold: false, italic: false
                                            });
                                        }
                                    }
                                }
                            }
                        }
                    });
                }));
                if (lessons.length) {
                    currentLessonId = lessons[0].id;
                    currentPageIndex = 0;
                }
                return;
            }
        } catch (e) {}
        const l = defaultLesson();
        lessons = [l];
        currentLessonId = l.id;
        currentPageIndex = 0;
        save();
    }
    function save() {
        try {
            const toSave = {
                nextId,
                lessons: lessons.map(l => ({
                    ...l,
                    pages: l.pages.map(p => ({
                        ...p,
                        usedCells: Array.from(p.usedCells || [])
                    }))
                }))
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
        } catch (e) { showToast('Storage full', 'error'); }
    }

    function getCurrentLesson() {
        return lessons.find(l => l.id === currentLessonId);
    }
    function getCurrentPage() {
        const l = getCurrentLesson();
        return l ? l.pages[currentPageIndex] : null;
    }

    // ========== GRID HELPERS ==========
    function cellKey(r, c) { return r + ',' + c; }
    function parseKey(k) { const [r, c] = k.split(',').map(Number); return { r, c }; }

    function isRectangle(selectedKeys) {
        if (!selectedKeys.size) return false;
        const cells = Array.from(selectedKeys).map(parseKey);
        const rows = cells.map(c => c.r);
        const cols = cells.map(c => c.c);
        const minR = Math.min(...rows), maxR = Math.max(...rows);
        const minC = Math.min(...cols), maxC = Math.max(...cols);
        const expected = (maxR - minR + 1) * (maxC - minC + 1);
        if (selectedKeys.size !== expected) return false;
        for (let r = minR; r <= maxR; r++) {
            for (let c = minC; c <= maxC; c++) {
                if (!selectedKeys.has(cellKey(r, c))) return false;
            }
        }
        return { minR, maxR, minC, maxC, rowSpan: maxR - minR + 1, colSpan: maxC - minC + 1 };
    }

    // ========== HISTORY ==========
    function pushHistory() {
        const page = getCurrentPage();
        if (!page) return;
        const snapshot = JSON.parse(JSON.stringify({
            blocks: page.blocks,
            usedCells: Array.from(page.usedCells)
        }));
        history = history.slice(0, historyIndex + 1);
        history.push(snapshot);
        historyIndex = history.length - 1;
        if (history.length > 40) { history.shift(); historyIndex--; }
        updateUndoRedoButtons();
    }
    window.undo = function() {
        if (historyIndex <= 0) return;
        historyIndex--;
        applySnapshot(history[historyIndex]);
        editingBlockIdx = null;
        tableSel = new Set();
        updateUndoRedoButtons();
        renderEditor();
        showToast('Undo', 'info');
    };
    window.redo = function() {
        if (historyIndex >= history.length - 1) return;
        historyIndex++;
        applySnapshot(history[historyIndex]);
        editingBlockIdx = null;
        tableSel = new Set();
        updateUndoRedoButtons();
        renderEditor();

    function initTableCells(tableRows, tableCols) {
        const cells = [];
        for (let r = 0; r < tableRows; r++) {
            for (let c = 0; c < tableCols; c++) {
                cells.push({
                    r, c, rowSpan: 1, colSpan: 1,
                    text: '',
                    bg: '#f1f3f5',
                    fontSize: 14,
                    bold: false,
                    italic: false
                });
            }
        }
        return cells;
    }

    /** Return the cell object that owns (covers) atomic position (r,c), or null */
    function findTableCellAt(cells, r, c) {
        for (const cell of cells) {
            if (r >= cell.r && r < cell.r + cell.rowSpan &&
                c >= cell.c && c < cell.c + cell.colSpan) {
                return cell;
            }
        }
        return null;
    }

    /** Atomic cells covered by a table cell region */
    function coveredKeys(cell) {
        const keys = [];
        for (let r = cell.r; r < cell.r + cell.rowSpan; r++) {
            for (let c = cell.c; c < cell.c + cell.colSpan; c++) {
                keys.push(tKey(r, c));
            }
        }
        return keys;
    }

    // ========== LIST HELPERS (plain text markers) ==========
    function getLineInfo(textarea) {
        const val = textarea.value;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        // find line start/end for selection
        let lineStart = start;
        while (lineStart > 0 && val[lineStart - 1] !== '\n') lineStart--;
        let lineEnd = end;
        while (lineEnd < val.length && val[lineEnd] !== '\n') lineEnd++;
        const selected = val.slice(lineStart, lineEnd);
        const lines = selected.split('\n');
        return { val, start, end, lineStart, lineEnd, lines };
    }

    function toggleListMarkers(textarea, type) {
        // type: 'ul' or 'ol'
        const info = getLineInfo(textarea);
        let { val, lineStart, lineEnd, lines } = info;
        const isBullet = type === 'ul';
        const markerRe = isBullet ? /^\s*[-*]\s+/ : /^\s*\d+\.\s+/;

        // Empty textarea or empty selection → insert a single marker line
        if (!val || (lines.length === 1 && lines[0].trim() === '')) {
            const marker = isBullet ? '- ' : '1. ';
            const newText = val.slice(0, lineStart) + marker + val.slice(lineEnd);
            textarea.value = newText;
            const pos = lineStart + marker.length;
            textarea.selectionStart = textarea.selectionEnd = pos;
            textarea.focus();
            return newText;
        }

        // Only consider non-empty lines when deciding "all marked"
        const contentLines = lines.filter(l => l.trim() !== '');
        const allMarked = contentLines.length > 0 && contentLines.every(l => markerRe.test(l));

        let newLines;
        if (allMarked) {
            // remove markers
            newLines = lines.map(l => l.replace(markerRe, ''));
        } else {
            if (isBullet) {
                newLines = lines.map(l => {
                    if (l.trim() === '') return l;
                    const cleaned = l.replace(markerRe, '');
                    return '- ' + cleaned;
                });
            } else {
                let n = 1;
                newLines = lines.map(l => {
                    if (l.trim() === '') return l;
                    const cleaned = l.replace(markerRe, '');
                    return (n++) + '. ' + cleaned;
                });
            }
        }
        const newText = val.slice(0, lineStart) + newLines.join('\n') + val.slice(lineEnd);
        textarea.value = newText;
        textarea.selectionStart = lineStart;
        textarea.selectionEnd = lineStart + newLines.join('\n').length;
        textarea.focus();
        return newText;
    }

    // ========== RENDER TEXT TO HTML (for view) ==========
    function textToHtml(text) {
        if (!text) return '';
        const lines = String(text).split('\n');
        let html = '';
        let i = 0;
        while (i < lines.length) {
            const line = lines[i];
            const bulletMatch = line.match(/^\s*[-*]\s+(.*)$/);
            const numMatch = line.match(/^\s*\d+\.\s+(.*)$/);
            if (bulletMatch) {
                html += '<ul>';
                while (i < lines.length) {
                    const m = lines[i].match(/^\s*[-*]\s+(.*)$/);
                    if (!m) break;
                    html += '<li>' + escapeHtml(m[1]) + '</li>';
                    i++;
                }
                html += '</ul>';
            } else if (numMatch) {
                html += '<ol>';
                while (i < lines.length) {
                    const m = lines[i].match(/^\s*\d+\.\s+(.*)$/);
                    if (!m) break;
                    html += '<li>' + escapeHtml(m[1]) + '</li>';
                    i++;
                }
                html += '</ol>';
            } else {
                // normal paragraph (collect consecutive non-list lines)
                let para = [];
                while (i < lines.length) {
                    if (/^\s*[-*]\s+/.test(lines[i]) || /^\s*\d+\.\s+/.test(lines[i])) break;
                    para.push(escapeHtml(lines[i]));
                    i++;
                }
                const joined = para.join('<br>');
                if (joined.trim() !== '') html += '<p>' + joined + '</p>';
                else if (para.length) html += '<p><br></p>';
            }
        }
        return html || '<p></p>';
    }

    function renderTableEditPanel(b, idx) {
        const rows = b.tableRows || (b.rowSpan * 2);
        const cols = b.tableCols || b.colSpan;
        const cells = b.cells || [];

        // Build occupancy map: atomic (r,c) -> cell object
        const rect = isTableRect(tableSel);

        // Primary selected region (first selected cell's owner) for form defaults
        let primary = null;
        if (tableSel.size) {
            const first = parseTKey(Array.from(tableSel)[0]);
            primary = findTableCellAt(cells, first.r, first.c);
        }

        let mini = `<div class="mini-table" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},minmax(28px,auto));">`;
        // Render only origin cells with span; mark covered atoms
        const originMap = {};
        cells.forEach(cell => { originMap[tKey(cell.r, cell.c)] = cell; });

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const k = tKey(r, c);
                const owner = findTableCellAt(cells, r, c);
                const isOrigin = owner && owner.r === r && owner.c === c;
                if (!isOrigin) {
                    // covered by a merge — skip painting a separate box (grid will span)
                    // But CSS grid needs placeholders OR we use explicit placement only on origins
                    continue;
                }
                const selected = coveredKeys(owner).some(ck => tableSel.has(ck));
                const style = [
                    `grid-row:${owner.r + 1}/span ${owner.rowSpan}`,
                    `grid-column:${owner.c + 1}/span ${owner.colSpan}`,
                    `background:${owner.bg || '#f1f3f5'}`,
                    owner.bold ? 'font-weight:700' : '',
                    owner.italic ? 'font-style:italic' : '',
                    `font-size:${Math.min(18, owner.fontSize || 14)}px`
                ].filter(Boolean).join(';');
                mini += `<div class="mt-cell ${selected ? 'selected' : ''}" style="${style}" onclick="toggleTableCell(${idx},${r},${c})" title="${owner.rowSpan}×${owner.colSpan}">${escapeHtml(owner.text || '')}</div>`;
            }
        }
        mini += '</div>';

        // Merge only if selection is a solid rectangle covering 2+ distinct cell regions
        let ownerCount = 0;
        if (rect && tableSel.size > 1) {
            const seen = new Set();
            for (const k of tableSel) {
                const { r, c } = parseTKey(k);
                const o = findTableCellAt(cells, r, c);
                if (o) seen.add(tKey(o.r, o.c));
            }
            ownerCount = seen.size;
        }
        const canMerge = rect && ownerCount >= 2;
        // Can unmerge if selection sits inside one multi-cell region
        const canUnmerge = primary && (primary.rowSpan > 1 || primary.colSpan > 1);

        return `
            <div class="edit-panel">
                <div style="font-size:12px;font-weight:700;color:#6c757d;margin-bottom:6px;">Click cells to select a rectangle · ${rows}×${cols} table</div>
                ${mini}
                <div class="block-actions" style="margin-top:8px;">
                    <button class="btn btn-primary btn-xs" onclick="mergeTableCells(${idx})" ${canMerge ? '' : 'disabled'}>Merge</button>
                    <button class="btn btn-outline btn-xs" onclick="unmergeTableCells(${idx})" ${canUnmerge ? '' : 'disabled'}>Unmerge</button>
                    <button class="btn btn-outline btn-xs" onclick="clearTableSel()">Clear selection</button>
                </div>
                <div style="margin-top:10px;display:${tableSel.size ? 'block' : 'none'};">
                    <label style="font-weight:700;font-size:12px;">Cell text</label>
                    <input id="tableCellText" value="${escapeHtml(primary ? (primary.text || '') : '')}" oninput="applyTableCellProp(${idx},'text',this.value)" placeholder="Centered text" style="width:100%;padding:8px 12px;border:2px solid #dee2e6;border-radius:8px;font-size:13px;">
                    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;align-items:flex-end;">
                        <div>
                            <label style="font-size:11px;font-weight:700;color:#6c757d;">Background</label>
                            <input type="color" value="${primary ? (primary.bg || '#f1f3f5') : '#f1f3f5'}" onchange="applyTableCellProp(${idx},'bg',this.value)" style="width:42px;height:32px;border:1px solid #ced4da;border-radius:6px;padding:2px;cursor:pointer;">
                        </div>
                        <div>
                            <label style="font-size:11px;font-weight:700;color:#6c757d;">Font size</label>
                            <input type="number" value="${primary ? (primary.fontSize || 14) : 14}" min="10" max="22" style="width:56px;padding:4px 6px;border:1px solid #ced4da;border-radius:6px;font-size:12px;" onchange="applyTableCellProp(${idx},'fontSize',Math.min(22,Math.max(10,parseInt(this.value,10)||14)))">
                        </div>
                        <div class="align-group">
                            <button type="button" class="${primary && primary.bold ? 'active' : ''}" onclick="applyTableCellProp(${idx},'bold',${primary && primary.bold ? 'false' : 'true'})"><b>B</b></button>
                            <button type="button" class="${primary && primary.italic ? 'active' : ''}" onclick="applyTableCellProp(${idx},'italic',${primary && primary.italic ? 'false' : 'true'})"><i>I</i></button>
                        </div>
                    </div>
                </div>
                <label class="border-toggle" style="margin-top:10px;">
                    <input type="checkbox" ${b.tableShowBorders !== false ? 'checked' : ''} onchange="toggleTableBorders(${idx}, this.checked)">
                    Show cell borders
                </label>
                <label class="border-toggle" style="margin-top:6px;">
                    <input type="checkbox" ${b.showBorder !== false ? 'checked' : ''} onchange="toggleBlockBorder(${idx}, this.checked)">
                    Show border on page
                </label>
                <div style="margin-top:10px;">
                    <button class="btn btn-success btn-sm" onclick="toggleEditBlock(${idx})">✓ Done editing</button>
                </div>
            </div>`;
    }

    window.clearTableSel = function() {
        tableSel = new Set();
        renderEditor();
    };

    window.toggleTableCell = function(blockIdx, r, c) {
        const page = getCurrentPage();
        if (!page || !page.blocks[blockIdx] || page.blocks[blockIdx].type !== 'table') return;
        const b = page.blocks[blockIdx];
        const owner = findTableCellAt(b.cells || [], r, c);
        if (!owner) return;

        // Toggle all atomic keys belonging to this region
        const keys = coveredKeys(owner);
        const allOn = keys.every(k => tableSel.has(k));
        if (allOn) {
            keys.forEach(k => tableSel.delete(k));
        } else {
            keys.forEach(k => tableSel.add(k));
        }
        renderEditor();
    };

    window.mergeTableCells = function(blockIdx) {
        const page = getCurrentPage();
        if (!page || !page.blocks[blockIdx] || page.blocks[blockIdx].type !== 'table') return;
        const b = page.blocks[blockIdx];
        const rect = isTableRect(tableSel);
        if (!rect || tableSel.size < 2) {
            return showToast('Select a solid rectangle of 2+ cells to merge', 'warning');
        }

        // Ensure selection doesn't partially cut existing merges — all atoms of any touched region must be selected
        const cells = b.cells || [];
        const ownersHit = new Set();
        for (const cell of cells) {
            const keys = coveredKeys(cell);
            const hit = keys.some(k => tableSel.has(k));
            const all = keys.every(k => tableSel.has(k));
            if (hit && !all) {
                return showToast('Selection cuts through a merged cell — select the whole region', 'error');
            }
            if (hit) ownersHit.add(tKey(cell.r, cell.c));
        }
        if (ownersHit.size < 2) {
            return showToast('Select at least two separate cells/regions to merge', 'warning');
        }

        pushHistory();

        // Remove all cells that overlap the selection
        const remaining = cells.filter(cell => {
            const keys = coveredKeys(cell);
            return !keys.some(k => tableSel.has(k));
        });

        // Create one merged cell; inherit text/style from top-left owner if any
        const topLeft = findTableCellAt(cells, rect.minR, rect.minC);
        remaining.push({
            r: rect.minR,
            c: rect.minC,
            rowSpan: rect.rowSpan,
            colSpan: rect.colSpan,
            text: topLeft ? (topLeft.text || '') : '',
            bg: topLeft ? (topLeft.bg || '#f1f3f5') : '#f1f3f5',
            fontSize: topLeft ? (topLeft.fontSize || 14) : 14,
            bold: topLeft ? !!topLeft.bold : false,
            italic: topLeft ? !!topLeft.italic : false
        });

        b.cells = remaining;
        // Keep selection as the merged region
        tableSel = new Set();
        for (let r = rect.minR; r <= rect.maxR; r++) {
            for (let c = rect.minC; c <= rect.maxC; c++) tableSel.add(tKey(r, c));
        }
        save();
        renderEditor();
        showToast('Cells merged', 'success');
    };

    window.unmergeTableCells = function(blockIdx) {
        const page = getCurrentPage();
        if (!page || !page.blocks[blockIdx] || page.blocks[blockIdx].type !== 'table') return;
        const b = page.blocks[blockIdx];
        if (!tableSel.size) return showToast('Select a merged cell first', 'warning');

        const first = parseTKey(Array.from(tableSel)[0]);
        const owner = findTableCellAt(b.cells || [], first.r, first.c);
        if (!owner || (owner.rowSpan === 1 && owner.colSpan === 1)) {
            return showToast('Selection is not a merged cell', 'warning');
        }

        pushHistory();
        const cells = (b.cells || []).filter(cell => !(cell.r === owner.r && cell.c === owner.c));
        // Split back into 1×1 cells, copy style to each
        for (let r = owner.r; r < owner.r + owner.rowSpan; r++) {
            for (let c = owner.c; c < owner.c + owner.colSpan; c++) {
                cells.push({
                    r, c, rowSpan: 1, colSpan: 1,
                    text: (r === owner.r && c === owner.c) ? (owner.text || '') : '',
                    bg: owner.bg || '#f1f3f5',
                    fontSize: owner.fontSize || 14,
                    bold: !!owner.bold,
                    italic: !!owner.italic
                });
            }
        }
        b.cells = cells;
        save();
        renderEditor();
        showToast('Cell unmerged', 'info');
    };

    window.applyTableCellProp = function(blockIdx, prop, value) {
        const page = getCurrentPage();
        if (!page || !page.blocks[blockIdx] || page.blocks[blockIdx].type !== 'table') return;
        const b = page.blocks[blockIdx];
        if (!tableSel.size) return;

        // Collect unique owner cells in selection
        const owners = new Map();
        for (const k of tableSel) {
            const { r, c } = parseTKey(k);
            const owner = findTableCellAt(b.cells || [], r, c);
            if (owner) owners.set(tKey(owner.r, owner.c), owner);
        }
        if (!owners.size) return;

        if (prop === 'text') {
            if (!_editTextHistoryTimer) pushHistory();
            clearTimeout(_editTextHistoryTimer);
            _editTextHistoryTimer = setTimeout(() => { _editTextHistoryTimer = null; }, 800);
        } else {
            pushHistory();
        }

        owners.forEach(owner => {
            if (prop === 'fontSize') {
                owner.fontSize = Math.min(22, Math.max(10, parseInt(value, 10) || 14));
            } else if (prop === 'bold' || prop === 'italic') {
                owner[prop] = value === true || value === 'true';
            } else {
                owner[prop] = value;
            }
        });
        save();
        if (prop !== 'text') renderEditor();
    };

    window.toggleTableBorders = function(idx, val) {
        const page = getCurrentPage();
        if (!page || !page.blocks[idx]) return;
        pushHistory();
        page.blocks[idx].tableShowBorders = !!val;
        save();
    };

    window.updateImageLabelOn = function(idx, val) {
        const page = getCurrentPage();
        if (!page || !page.blocks[idx]) return;
        pushHistory();
        page.blocks[idx].imageLabelOn = !!val;
        save();
        renderEditor();
    };
    window.updateImageLabel = function(idx, val) {
        const page = getCurrentPage();
        if (!page || !page.blocks[idx]) return;
        if (!_editTextHistoryTimer) pushHistory();
        clearTimeout(_editTextHistoryTimer);
        _editTextHistoryTimer = setTimeout(() => { _editTextHistoryTimer = null; }, 800);
        page.blocks[idx].imageLabel = val;
        save();
    };
    window.updateTraceField = function(idx, prop, val) {
        const page = getCurrentPage();
        if (!page || !page.blocks[idx] || page.blocks[idx].type !== 'trace') return;
        if (prop === 'traceTarget') {
            // Debounced history for typing; no full re-render (keeps focus)
            if (!_editTextHistoryTimer) pushHistory();
            clearTimeout(_editTextHistoryTimer);
            _editTextHistoryTimer = setTimeout(() => { _editTextHistoryTimer = null; }, 800);
            page.blocks[idx][prop] = val;
            save();
            return;
        }
        pushHistory();
        page.blocks[idx][prop] = val;
        save();
        renderEditor();
    };

    window.toggleEditBlock = function(idx) {
        if (editingBlockIdx === idx) {
            editingBlockIdx = null;
            tableSel = new Set();
            if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }
        } else {
            editingBlockIdx = idx;
            tableSel = new Set();
        }
        renderEditor();
        if (editingBlockIdx !== null) {
            const ta = document.getElementById('editText');
            if (ta) ta.focus();
        }
    };

    window.updateEditText = function(idx, value) {
        const page = getCurrentPage();
        if (!page || !page.blocks[idx]) return;
        // Debounced history: push once per typing burst, not every keystroke
        if (!_editTextHistoryTimer) {
            pushHistory();
        }
        clearTimeout(_editTextHistoryTimer);
        _editTextHistoryTimer = setTimeout(() => { _editTextHistoryTimer = null; }, 800);
        page.blocks[idx].text = value;
        save();
    };

    window.handleEditImage = function(e, idx) {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type || !file.type.startsWith('image/')) return showToast('Please select an image file', 'error');
        if (file.size > 2*1024*1024) return showToast('Image must be < 2MB', 'error');
        const reader = new FileReader();
        reader.onload = ev => {
            const page = getCurrentPage();
            if (!page || !page.blocks[idx]) return;
            pushHistory();
            page.blocks[idx].imagePath = ev.target.result;
            save();
            renderEditor();
            showToast('Image updated', 'success');
        };
        reader.onerror = () => showToast('Failed to read image', 'error');
        reader.readAsDataURL(file);
    };

    function syncActiveFromDom() {
        const ta = document.getElementById('activeText');
        if (ta) window.activeText = ta.value;
        const fs = document.getElementById('activeFontSize');
        if (fs) {
            const n = parseInt(fs.value, 10);
            window.activeFontSize = Number.isFinite(n) ? Math.min(72, Math.max(10, n)) : 18;
        }
        const col = document.getElementById('activeColor');
        if (col) window.activeColor = col.value;
        const br = document.getElementById('activeBorder');
        if (br) window.activeShowBorder = !!br.checked;
        const sc = document.getElementById('activeImageScale');
        if (sc) window.activeImageScale = Math.min(200, Math.max(10, parseInt(sc.value,10) || 100));
        const labOn = document.getElementById('activeImageLabelOn');
        if (labOn) window.activeImageLabelOn = !!labOn.checked;
        const lab = document.getElementById('activeImageLabel');
        if (lab) window.activeImageLabel = lab.value;
        const tt = document.getElementById('activeTraceTarget');
        if (tt) window.activeTraceTarget = tt.value;
        const tc = document.getElementById('activeTraceClones');
        if (tc) window.activeTraceClones = Math.min(20, Math.max(1, parseInt(tc.value, 10) || 5));
        const tsb = document.getElementById('activeTableShowBorders');
        if (tsb) window.activeTableShowBorders = !!tsb.checked;
    }

    window.toggleCell = function(r, c) {
        const page = getCurrentPage();
        if (!page || page.locked) return;
        const key = cellKey(r, c);
        if (page.usedCells.has(key)) return;
        syncActiveFromDom();
        if (window.activeSelection.has(key)) window.activeSelection.delete(key);
        else window.activeSelection.add(key);
        renderEditor();
    };

    window.clearSelection = function() {
        syncActiveFromDom();
        window.activeSelection = new Set();
        renderEditor();
    };

    function validateSelection() {
        const msg = document.getElementById('validationMsg');
        const btn = document.getElementById('btnSet');
        if (!msg || !btn) return;
        if (window.activeSelection.size === 0) {
            msg.textContent = '';
            msg.style.color = '#e03131';
            btn.disabled = true;
            return;
        }
        const rect = isRectangle(window.activeSelection);
        if (!rect) {
            msg.textContent = '⚠ Selection must be a solid rectangle or square';
            msg.style.color = '#e03131';
            btn.disabled = true;
            document.querySelectorAll('#activeGrid .cell.selected').forEach(el => el.classList.add('invalid'));
        } else {
            msg.textContent = '✓ Valid ' + rect.rowSpan + '×' + rect.colSpan + ' rectangle';
            msg.style.color = '#2d7d46';
            btn.disabled = false;
        }
    }

    window.setMode = function(mode) {
        syncActiveFromDom();
        window.activeMode = mode;
        renderEditor();
    };

    window.handleActiveImage = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type || !file.type.startsWith('image/')) return showToast('Please select an image file', 'error');
        if (file.size > 2*1024*1024) return showToast('Image must be < 2MB', 'error');
        syncActiveFromDom();
        const reader = new FileReader();
        reader.onload = ev => {
            window.activeImagePath = ev.target.result;
            renderEditor();
            showToast('Image loaded', 'success');
        };
        reader.onerror = () => showToast('Failed to read image', 'error');
        reader.readAsDataURL(file);
    };

    window.setBlock = function() {
        const page = getCurrentPage();
        if (!page || page.locked) return;
        syncActiveFromDom();

        const rect = isRectangle(window.activeSelection);
        if (!rect) return showToast('Invalid rectangle — select a solid rectangle or square', 'error');

        if (window.activeMode === 'text') {
            if (!String(window.activeText || '').trim()) {
                return showToast('Please enter some text', 'error');
            }
        } else if (window.activeMode === 'image') {
            if (!window.activeImagePath) {
                return showToast('Please upload an image', 'error');
            }
        } else if (window.activeMode === 'trace') {
            // target can be empty (blank lines) — always valid
        } else if (window.activeMode === 'table') {
            // table is always valid once rectangle is selected
        } else {
            return showToast('Unknown block mode', 'error');
        }

        for (const k of window.activeSelection) {
            if (page.usedCells.has(k)) {
                return showToast('Selection overlaps used cells', 'error');
            }
        }

        pushHistory();

        const block = {
            id: 'b' + Date.now() + Math.random().toString(36).slice(2, 6),
            row: rect.minR,
            col: rect.minC,
            rowSpan: rect.rowSpan,
            colSpan: rect.colSpan,
            type: window.activeMode,
            showBorder: window.activeShowBorder !== false
        };

        if (window.activeMode === 'text') {
            Object.assign(block, {
                text: String(window.activeText || ''),
                fontSize: window.activeFontSize || 18,
                bold: !!window.activeBold,
                italic: !!window.activeItalic,
                underline: !!window.activeUnderline,
                color: window.activeColor || '#1a1a1a',
                textAlign: window.activeTextAlign || 'center',
                verticalAlign: window.activeVerticalAlign || 'center'
            });
        } else if (window.activeMode === 'image') {
            Object.assign(block, {
                imagePath: window.activeImagePath || '',
                imageAlign: window.activeImageAlign || 'center',
                imageVerticalAlign: window.activeImageVerticalAlign || 'center',
                imageFit: window.activeImageFit || 'contain',
                imageScale: window.activeImageScale ?? 100,
                imageLabelOn: !!window.activeImageLabelOn,
                imageLabel: String(window.activeImageLabel || '')
            });
        } else if (window.activeMode === 'trace') {
            Object.assign(block, {
                traceTarget: String(window.activeTraceTarget || ''),
                traceStyle: window.activeTraceStyle === 'solid' ? 'solid' : 'outlined',
                traceClones: Math.min(20, Math.max(1, parseInt(window.activeTraceClones, 10) || 5)),
                traceRepeatAll: window.activeTraceRepeatAll !== false
            });
        } else if (window.activeMode === 'table') {
            const tableRows = rect.rowSpan * 2;
            const tableCols = rect.colSpan;
            Object.assign(block, {
                tableRows,
                tableCols,
                tableShowBorders: window.activeTableShowBorders !== false,
                cells: initTableCells(tableRows, tableCols)
            });
        }

        page.blocks.push(block);
        window.activeSelection.forEach(k => page.usedCells.add(k));
        resetActive();
        editingBlockIdx = null;
        save();
        renderEditor();
        showToast('Block set', 'success');
    };

    window.deleteBlock = function(idx) {
        const page = getCurrentPage();
        if (!page || page.locked) return;
        if (idx < 0 || idx >= page.blocks.length) return;
        pushHistory();
        const b = page.blocks[idx];
        if (!b) return;
        for (let r = b.row; r < b.row + b.rowSpan; r++) {
            for (let c = b.col; c < b.col + b.colSpan; c++) {
                page.usedCells.delete(cellKey(r, c));
            }
        }
        page.blocks.splice(idx, 1);
        if (editingBlockIdx === idx) {
            editingBlockIdx = null;
            tableSel = new Set();
        } else if (editingBlockIdx > idx) {
            editingBlockIdx--;
        }
        save();
        renderEditor();
        showToast('Block removed', 'info');
    };

    window.toggleBlockBorder = function(idx, val) {
        const page = getCurrentPage();
        if (!page || !page.blocks[idx]) return;
        if (page.blocks[idx].showBorder === val) return;
        pushHistory();
        page.blocks[idx].showBorder = val;
        save();
    };

    window.updatePageMeta = function() {
        const page = getCurrentPage();
        if (!page) return;
        const t = document.getElementById('pageTitle');
        const s = document.getElementById('pageSubtitle');
        const n = document.getElementById('pageLessonNum');
        if (t) page.title = t.value.trim() || 'UNTITLED';
        if (s) page.subtitle = s.value.trim() || '';
        if (n) {
            const num = parseInt(n.value, 10);
            page.lessonNumber = Number.isFinite(num) && num > 0 ? num : 1;
        }
        save();
    };

    window.lockPage = function() {
        const page = getCurrentPage();
        if (!page) return;
        page.locked = true;
        editingBlockIdx = null;
        tableSel = new Set();
        save();
        renderEditor();
        showToast('Layout locked — content still editable', 'success');
    };
    window.unlockPage = function() {
        const page = getCurrentPage();
        if (!page) return;
        page.locked = false;
        save();
        renderEditor();
        showToast('Layout unlocked', 'info');
    };
    window.resetPage = function() {
        if (!confirm('Clear all blocks on this page?')) return;
        const page = getCurrentPage();
        if (!page) return;
        pushHistory();
        page.blocks = [];
        page.usedCells = new Set();
        page.locked = false;
        resetActive();
        editingBlockIdx = null;
        tableSel = new Set();
        save();
        renderEditor();
        showToast('Page reset', 'info');
    };

    // ========== VIEW ==========
    function renderView() {
        const container = document.getElementById('viewContainer');
        if (!container) return;
        container.innerHTML = '';
        const lesson = getCurrentLesson();
        if (!lesson) return;

        lesson.pages.forEach((page, pIdx) => {
            const pageEl = document.createElement('div');
            pageEl.className = 'page';
            pageEl.innerHTML = `<div class="page-actions no-print"><button class="export-btn" onclick="exportPage(this.closest('.page'))">📄 Export</button></div>`;

            const card = document.createElement('div');
            card.className = 'page-card';
            card.innerHTML = `
                <div class="page-header">
                    <div class="page-header-left">
                        <h1>${escapeHtml(page.title)}</h1>
                        <div class="sub">${escapeHtml(page.subtitle)}</div>
                    </div>
                    <div class="page-header-right">
                        <span class="lbl">LESSON</span>
                        <span class="num">${page.lessonNumber}</span>
                    </div>
                </div>
                <div class="grid-stage" id="stage-${pIdx}"></div>
                <div class="page-number">${pIdx + 1}</div>
            `;
            pageEl.appendChild(card);
            container.appendChild(pageEl);

            const stage = card.querySelector('.grid-stage');
            page.blocks.forEach(b => {
                const el = document.createElement('div');
                el.className = 'block' + (b.showBorder !== false ? ' has-border' : '');
                el.style.gridRow = `${b.row + 1} / span ${b.rowSpan}`;
                el.style.gridColumn = `${b.col + 1} / span ${b.colSpan}`;

                if (b.type === 'text') {
                    const vAlign = b.verticalAlign || 'center';
                    el.style.alignItems = vAlign === 'top' ? 'flex-start' : vAlign === 'bottom' ? 'flex-end' : 'center';
                    el.style.justifyContent = 'stretch';
                    const style = [
                        `font-size:${b.fontSize || 18}px`,
                        `color:${b.color || '#1a1a1a'}`,
                        `text-align:${b.textAlign || 'center'}`,
                        b.bold ? 'font-weight:700' : 'font-weight:600',
                        b.italic ? 'font-style:italic' : '',
                        b.underline ? 'text-decoration:underline' : '',
                        'width:100%'
                    ].filter(Boolean).join(';');
                    el.innerHTML = `<div class="block-text" style="${style}">${textToHtml(b.text || '')}</div>`;
                } else if (b.type === 'image' && b.imagePath) {
                    const vAlign = b.imageVerticalAlign || 'center';
                    const hAlign = b.imageAlign || 'center';
                    el.style.alignItems = vAlign === 'top' ? 'flex-start' : vAlign === 'bottom' ? 'flex-end' : 'center';
                    el.style.justifyContent = hAlign === 'left' ? 'flex-start' : hAlign === 'right' ? 'flex-end' : 'center';
                    const fit = b.imageFit || 'contain';
                    let imgStyle = 'border-radius:4px;';
                    if (fit === 'contain') {
                        imgStyle += 'max-width:100%;max-height:100%;object-fit:contain;';
                    } else if (fit === 'cover') {
                        imgStyle += 'width:100%;height:100%;object-fit:cover;';
                    } else if (fit === 'scale') {
                        const sc = (b.imageScale ?? 100) / 100;
                        imgStyle += `max-width:${100 * sc}%;max-height:${100 * sc}%;object-fit:contain;`;
                    }
                    if (b.imageLabelOn && b.imageLabel) {
                        // When label is on, constrain image so label fits
                        if (fit === 'contain' || fit === 'scale') {
                            imgStyle = imgStyle.replace(/max-height:100%/, 'max-height:78%');
                        }
                        el.innerHTML = `<div class="block-img-wrap">
                            <img class="block-img" src="${escapeHtml(b.imagePath)}" style="${imgStyle}">
                            <div class="block-img-label">${escapeHtml(b.imageLabel)}</div>
                        </div>`;
                    } else {
                        el.innerHTML = `<img class="block-img" src="${escapeHtml(b.imagePath)}" style="${imgStyle}">`;
                    }
                } else if (b.type === 'trace') {
                    el.style.alignItems = 'stretch';
                    el.style.justifyContent = 'stretch';
                    el.innerHTML = buildTraceHtml(b);
                } else if (b.type === 'table') {
                    el.style.alignItems = 'stretch';
                    el.style.justifyContent = 'stretch';
                    el.innerHTML = buildTableHtml(b);
                }
                stage.appendChild(el);
            });
        });
    }

    function buildTableHtml(b) {
        const rows = b.tableRows || (b.rowSpan * 2) || 1;
        const cols = b.tableCols || b.colSpan || 1;
        const cells = b.cells || [];
        const showBorders = b.tableShowBorders !== false;

        let html = `<div class="inner-table ${showBorders ? 'has-borders' : ''}" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr);">`;

        // Only paint origin cells with placement spans
        cells.forEach(cell => {
            const style = [
                `grid-row:${cell.r + 1} / span ${cell.rowSpan}`,
                `grid-column:${cell.c + 1} / span ${cell.colSpan}`,
                `background:${cell.bg || '#f1f3f5'}`,
                `font-size:${Math.min(22, cell.fontSize || 14)}px`,
                cell.bold ? 'font-weight:700' : 'font-weight:600',
                cell.italic ? 'font-style:italic' : '',
                'color:#1a1a1a'
            ].filter(Boolean).join(';');
            html += `<div class="it-cell" style="${style}">${escapeHtml(cell.text || '')}</div>`;
        });

        html += '</div>';
        return html;
    }

    /**
     * Build handwriting guideline sets for a trace block.
     * - 1 grid row height = 1 line set (red-blue-blue-red, evenly spaced)
     * - Letters centered in the band between the two blue lines
     * - Desktop vs mobile: font-size uses relative units; positioning is % based so it scales
     */
    function buildTraceHtml(b) {
        const sets = Math.max(1, b.rowSpan || 1);
        const target = String(b.traceTarget || '').trim();
        const clones = Math.min(20, Math.max(1, parseInt(b.traceClones, 10) || 5));
        const style = b.traceStyle === 'solid' ? 'solid' : 'outlined';
        const repeatAll = b.traceRepeatAll !== false;

        // Evenly spaced 4 lines → positions at 0%, 33.33%, 66.67%, 100% of set height
        // Letters sit in exact middle of the two blue lines → 50% of set height
        // Font size: scale with set height. On typical page a row is ~70-80px;
        // we use a clamp so it works on desktop print and narrower mobile preview.
        let html = '<div class="trace-wrap">';
        for (let s = 0; s < sets; s++) {
            const showLetters = target && (repeatAll || s === 0);
            html += '<div class="trace-set">';
            // Four guideline lines (evenly spaced)
            html += '<div class="tline red" style="top:0;"></div>';
            html += '<div class="tline blue" style="top:33.333%;"></div>';
            html += '<div class="tline blue" style="top:66.667%;"></div>';
            html += '<div class="tline red" style="top:100%;"></div>';
            if (showLetters) {
                // Letters sit in the exact middle of the space between the 2 blue lines
                // (band from 33.333% to 66.667% of set height).
                // Desktop vs mobile: percentage positioning scales with cell height;
                // font-size uses clamp so print (wide) and mobile preview both look balanced.
                let spans = '';
                for (let c = 0; c < clones; c++) {
                    spans += `<span>${escapeHtml(target)}</span>`;
                }
                html += `<div class="trace-letters ${style === 'outlined' ? 'outlined' : ''}" style="
                    top: 33.333%;
                    height: 33.333%;
                    font-size: clamp(16px, 2.8vw, 32px);
                ">${spans}</div>`;
            }
            html += '</div>';
        }
        html += '</div>';
        return html;
    }

    window.exportPage = function(pageEl) {
        const clone = pageEl.cloneNode(true);
        clone.querySelector('.page-actions')?.remove();
        const win = window.open('', '_blank');
        const styles = document.querySelector('style').outerHTML;
        win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Export</title>${styles}</head><body style="padding:0;margin:0;background:#fff;"><div class="view-container">${clone.outerHTML}</div></body></html>`);
        win.document.close();
        win.focus();
        setTimeout(() => win.print(), 400);
    };

    // ========== LESSON MANAGEMENT ==========
    function renderLessonList() {

            <div class="lesson-item" style="${l.id===currentLessonId?'border-color:#F5A623;background:#fff;':''}">

    window.selectLesson = function(id) {
        currentLessonId = id;
        currentPageIndex = 0;
        history = []; historyIndex = -1;
        editingBlockIdx = null;
        tableSel = new Set();
        if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }
        resetActive();
        pushHistory();
        renderAll();
        // Switch to Edit tab so the opened lesson is ready for manipulation
        switchTab('edit');
        showToast('Lesson opened', 'info');
    };

    window.duplicateLesson = function(id) {
        const source = lessons.find(l => l.id === id);
        if (!source) return;

        // Full deep clone so nested table cells / image data are not shared
        const raw = JSON.parse(JSON.stringify({
            title: source.title,
            subtitle: source.subtitle,
            pages: source.pages.map(p => ({
                title: p.title,
                subtitle: p.subtitle,
                lessonNumber: p.lessonNumber,
                locked: !!p.locked,
                blocks: p.blocks || [],
                usedCells: Array.from(p.usedCells || [])
            }))
        }));

        const copy = {
            id: 'l' + (nextId++),
            title: (raw.title || 'Untitled') + ' (copy)',
            subtitle: raw.subtitle || '',
            pages: (raw.pages || []).map((p, i) => ({
                title: p.title,
                subtitle: p.subtitle,
                lessonNumber: i + 1,
                locked: !!p.locked,
                blocks: (p.blocks || []).map(b => {
                    const nb = JSON.parse(JSON.stringify(b));
                    nb.id = 'b' + Date.now() + Math.random().toString(36).slice(2, 8);
                    return nb;
                }),
                usedCells: new Set(p.usedCells || [])
            }))
        };

        if (!copy.pages.length) {
            copy.pages = [defaultPage()];
        }

        lessons.push(copy);
        save();
        renderLessonList();
        document.getElementById('lessonCount').textContent = lessons.length + ' lessons';
        showToast('Lesson duplicated', 'success');
    };

    window.addLesson = function() {
        const l = defaultLesson();
        lessons.push(l);
        currentLessonId = l.id;
        currentPageIndex = 0;
        history = []; historyIndex = -1;
        editingBlockIdx = null;
        tableSel = new Set();
        resetActive();
        save();
        renderAll();
        switchTab('edit');
        showToast('Lesson added', 'success');
    };

    window.exportLessonsJson = function() {
        try {
            const payload = {
                app: 'phonics-grid-publisher',
                version: 2,
                exportedAt: new Date().toISOString(),
                nextId,
                lessons: lessons.map(l => ({
                    id: l.id,
                    title: l.title,
                    subtitle: l.subtitle,
                    pages: l.pages.map(p => ({
                        title: p.title,
                        subtitle: p.subtitle,
                        lessonNumber: p.lessonNumber,
                        locked: !!p.locked,
                        blocks: p.blocks || [],
                        usedCells: Array.from(p.usedCells || [])
                    }))
                }))
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'phonics-lessons-' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast('Exported ' + lessons.length + ' lesson(s)', 'success');
        } catch (e) {
            showToast('Export failed', 'error');
        }
    };

    window.importLessonsJson = function(event) {
        const file = event.target.files && event.target.files[0];
        event.target.value = ''; // allow re-importing same file
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function() {
            try {
                const data = JSON.parse(String(reader.result || ''));
                if (!data || !Array.isArray(data.lessons)) {
                    return showToast('Invalid file: missing lessons array', 'error');
                }

                let added = 0;
                data.lessons.forEach(src => {
                    if (!src || typeof src !== 'object') return;
                    const pagesIn = Array.isArray(src.pages) ? src.pages : [];
                    const lesson = {
                        id: 'l' + (nextId++),
                        title: (src.title || 'Imported lesson') + '',
                        subtitle: (src.subtitle || '') + '',
                        pages: pagesIn.map((p, i) => {
                            const blocks = Array.isArray(p.blocks)
                                ? p.blocks.map(b => {
                                    const nb = JSON.parse(JSON.stringify(b));
                                    nb.id = 'b' + Date.now() + Math.random().toString(36).slice(2, 8);
                                    return nb;
                                })
                                : [];
                            // Rebuild usedCells from blocks if missing/invalid
                            let used = Array.isArray(p.usedCells) ? p.usedCells.slice() : [];
                            if (!used.length && blocks.length) {
                                blocks.forEach(b => {
                                    for (let r = b.row; r < b.row + (b.rowSpan || 1); r++) {
                                        for (let c = b.col; c < b.col + (b.colSpan || 1); c++) {
                                            used.push(r + ',' + c);
                                        }
                                    }
                                });
                            }
                            return {
                                title: p.title || 'UNTITLED',
                                subtitle: p.subtitle || '',
                                lessonNumber: i + 1,
                                locked: !!p.locked,
                                blocks,
                                usedCells: new Set(used)
                            };
                        })
                    };
                    if (!lesson.pages.length) {
                        lesson.pages = [defaultPage()];
                    }
                    lessons.push(lesson);
                    added++;
                });

                if (!added) {
                    return showToast('No valid lessons found in file', 'warning');
                }

                save();
                renderAll();
                showToast('Imported ' + added + ' lesson(s) (merged)', 'success');
            } catch (e) {
                showToast('Import failed: invalid JSON', 'error');
            }
        };
        reader.onerror = function() {
            showToast('Could not read file', 'error');
        };
        reader.readAsText(file);
    };
    window.deleteLesson = function(id) {
        if (lessons.length <= 1) return showToast('Need at least one lesson', 'warning');
        if (!confirm('Delete this lesson?')) return;
        lessons = lessons.filter(l => l.id !== id);
        if (currentLessonId === id) {
            currentLessonId = lessons[0].id;
            currentPageIndex = 0;
        }
        save();
        renderAll();
    };
    window.addPage = function() {
        const lesson = getCurrentLesson();
        if (!lesson) return;
        const p = defaultPage();
        p.lessonNumber = lesson.pages.length + 1;
        lesson.pages.push(p);
        currentPageIndex = lesson.pages.length - 1;
        history = []; historyIndex = -1;
        editingBlockIdx = null;
        resetActive();
        pushHistory();
        save();
        renderAll();
        showToast('Page added', 'success');
    };

    // ========== TABS & INIT ==========
    window.switchTab = function(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === tab + 'Panel'));
        if (tab === 'view') renderView();
        if (tab === 'edit') renderEditor();
    };

    function renderAll() {
        renderLessonList();
        renderEditor();
        renderView();
        const lesson = getCurrentLesson();
        document.getElementById('lessonCount').textContent = lessons.length + ' lessons';
        document.getElementById('pageSelect').innerHTML = (lesson ? lesson.pages : []).map((p, i) =>
            `<option value="${i}" ${i===currentPageIndex?'selected':''}>Page ${i+1}</option>`
        ).join('');
    }

    window.changePage = function(idx) {
        currentPageIndex = parseInt(idx);
        history = []; historyIndex = -1;
        editingBlockIdx = null;
        tableSel = new Set();
        if (_editTextHistoryTimer) { clearTimeout(_editTextHistoryTimer); _editTextHistoryTimer = null; }
        resetActive();
        pushHistory();
        renderEditor();
        renderView();
    };

    load();
    document.getElementById('app').innerHTML = `
        <div class="app-header">
            <h1>📚 Phonics Grid Publisher</h1>
            <span class="badge" id="lessonCount">0</span>
        </div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="edit" onclick="switchTab('edit')">✏️ Build Pages</button>
            <button class="tab-btn" data-tab="view" onclick="switchTab('view')">👁️ View / Print</button>
            <button class="tab-btn" data-tab="lessons" onclick="switchTab('lessons')">📖 Lessons</button>
        </div>
        <div class="tab-panel active" id="editPanel">
            <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap;">
                <label style="font-weight:700;font-size:13px;">Current page:</label>
                <select id="pageSelect" onchange="changePage(this.value)" style="padding:7px 12px;border:2px solid #dee2e6;border-radius:8px;font-size:13px;"></select>
                <button class="btn btn-outline btn-sm" onclick="addPage()">＋ Add Page</button>
            </div>
            <div id="editorArea"></div>
        </div>
        <div class="tab-panel" id="viewPanel">
            <div class="view-toolbar">
                <span class="info" id="viewInfo">Ready</span>
            </div>
            <div class="view-container" id="viewContainer"></div>
        </div>
        <div class="tab-panel" id="lessonsPanel">
            <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px;">
                <button class="btn btn-primary" onclick="addLesson()">＋ New Lesson</button>
                <button class="btn btn-outline" onclick="exportLessonsJson()">⬇ Export JSON</button>
                <button class="btn btn-outline" onclick="document.getElementById('importJsonInput').click()">⬆ Import JSON</button>
                <input type="file" id="importJsonInput" accept="application/json,.json" style="display:none" onchange="importLessonsJson(event)">
            </div>
            <div class="lesson-list" id="lessonList"></div>
        </div>
    `;
    pushHistory();
    renderAll();
})();
</script>
</body>
</html>
