<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Decodable Reader Publisher (ES5)</title>
<style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --accent-soft: #fef3c7;
      --accent-ring: rgba(245, 158, 11, 0.25);
      --red: #dc2626;
      --red-hover: #b91c1c;
      --red-soft: #fef2f2;
      --green: #16a34a;
      --green-hover: #15803d;
      --green-soft: #f0fdf4;
      --orange: #ea580c;
      --orange-hover: #c2410c;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --scarlet: #b91c1c;
      --scarlet-light: #fff5f5;
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-2xl: 24px;
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-md: 0 10px 25px rgba(0,0,0,0.07), 0 4px 10px rgba(0,0,0,0.04);
      --shadow-lg: 0 20px 50px rgba(0,0,0,0.10), 0 8px 20px rgba(0,0,0,0.05);
      --shadow-xl: 0 30px 70px rgba(0,0,0,0.12), 0 12px 30px rgba(0,0,0,0.06);
      --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @page { size: 850px 1100px; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; line-height: 1.5; letter-spacing: -0.01em; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; border-radius: 20px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 20px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .app { max-width: 1400px; margin: 0 auto; background: var(--surface); border-radius: var(--radius-2xl); box-shadow: var(--shadow-lg); overflow: hidden; border: 1px solid var(--border); }
    .app-header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #1a1a2e 100%); color: #fff; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; position: relative; overflow: hidden; }
    .app-header::before { content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
    .app-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; }
    .app-header h1 .icon { font-size: 26px; }
    .app-header .badge { background: var(--accent); color: #0f172a; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.01em; position: relative; z-index: 1; box-shadow: 0 2px 8px rgba(245, 158, 11, 0.35); }

    .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface-alt); padding: 0 28px; gap: 2px; position: relative; }
    .tab-btn { padding: 14px 24px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: all var(--transition); font-family: var(--font); position: relative; letter-spacing: -0.01em; white-space: nowrap; border-radius: 8px 8px 0 0; margin-bottom: -1px; }
    .tab-btn:hover { color: var(--text); background: rgba(0,0,0,0.03); }
    .tab-btn.active { color: var(--text); font-weight: 700; background: var(--surface); border: 1px solid var(--border); border-bottom-color: var(--surface); box-shadow: 0 -2px 8px rgba(0,0,0,0.03); }
    .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 8px; right: 8px; height: 3px; background: var(--accent); border-radius: 3px 3px 0 0; }

    .tab-panel { display: none; padding: 24px 28px 28px; animation: fadeSlideIn 0.25s ease; }
    .tab-panel.active { display: block; }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: 420px; width: 100%; pointer-events: none; }
    .toast { padding: 13px 18px; border-radius: var(--radius); color: #fff; font-weight: 600; font-size: 13px; box-shadow: var(--shadow-lg); animation: toastSlideIn 0.35s cubic-bezier(0.22,0.61,0.36,1); display: flex; align-items: center; gap: 10px; pointer-events: auto; letter-spacing: -0.01em; backdrop-filter: blur(8px); }
    .toast.success { background: #059669; } .toast.error { background: #dc2626; } .toast.warning { background: #ea580c; } .toast.info { background: #2563eb; }
    .toast .close-toast { background: none; border: none; color: inherit; font-size: 16px; cursor: pointer; margin-left: auto; opacity: 0.7; padding: 2px; border-radius: 4px; transition: opacity var(--transition); }
    .toast .close-toast:hover { opacity: 1; background: rgba(255,255,255,0.15); }
    @keyframes toastSlideIn { from { opacity: 0; transform: translateX(40px) scale(0.95); } to { opacity: 1; transform: translateX(0) scale(1); } }

    .form-section { background: var(--surface-alt); border-radius: var(--radius-xl); padding: 22px 24px; border: 1px solid var(--border); max-width: 800px; margin: 0 auto; box-shadow: var(--shadow-xs); }
    .form-section h2 { font-size: 17px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
    .form-section h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 600; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; letter-spacing: 0.01em; text-transform: uppercase; }
    .form-group label .req { color: var(--red); font-weight: 700; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font); transition: all var(--transition); background: var(--surface); color: var(--text); letter-spacing: -0.01em; resize: vertical; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring); background: #fff; }
    .form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); }
    .form-group textarea { resize: vertical; min-height: 50px; line-height: 1.6; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    .form-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

    .btn { padding: 9px 18px; border: none; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; cursor: pointer; transition: all var(--transition); font-family: var(--font); display: inline-flex; align-items: center; gap: 6px; letter-spacing: -0.01em; white-space: nowrap; position: relative; overflow: hidden; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    .btn-primary { background: var(--accent); color: #0f172a; box-shadow: 0 2px 8px rgba(245,158,11,0.3); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 4px 14px rgba(245,158,11,0.4); transform: translateY(-1px); }
    .btn-success { background: var(--green); color: #fff; box-shadow: 0 2px 8px rgba(22,163,74,0.3); }
    .btn-success:hover:not(:disabled) { background: var(--green-hover); box-shadow: 0 4px 14px rgba(22,163,74,0.4); transform: translateY(-1px); }
    .btn-danger { background: var(--red); color: #fff; box-shadow: 0 2px 8px rgba(220,38,38,0.25); }
    .btn-danger:hover:not(:disabled) { background: var(--red-hover); box-shadow: 0 4px 14px rgba(220,38,38,0.35); transform: translateY(-1px); }
    .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-secondary); }
    .btn-outline:hover:not(:disabled) { background: var(--surface-alt); border-color: #cbd5e1; color: var(--text); }
    .btn-sm { padding: 7px 14px; font-size: 12px; border-radius: 6px; }
    .btn-xs { padding: 5px 10px; font-size: 11px; border-radius: 5px; gap: 3px; }
    .btn-warning { background: var(--orange); color: #fff; box-shadow: 0 2px 8px rgba(234,88,12,0.25); }
    .btn-warning:hover:not(:disabled) { background: var(--orange-hover); box-shadow: 0 4px 14px rgba(234,88,12,0.35); transform: translateY(-1px); }

    .list-section { min-height: 400px; }
    .list-section h2 { font-size: 17px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
    .list-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .search-box { flex: 1; min-width: 160px; padding: 9px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font); background: var(--surface-alt); transition: all var(--transition); letter-spacing: -0.01em; }
    .search-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring); background: #fff; }
    .list-toolbar .count { font-weight: 700; color: var(--text-secondary); font-size: 13px; white-space: nowrap; background: var(--surface-alt); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); }
    .lesson-list { display: flex; flex-direction: column; gap: 6px; }
    .lesson-list .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); background: var(--surface-alt); border-radius: var(--radius-lg); border: 2px dashed var(--border); }
    .lesson-list .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
    .lesson-list .empty-state h3 { color: var(--text); margin-bottom: 4px; font-size: 15px; }
    .lesson-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); transition: all var(--transition); cursor: grab; user-select: none; }
    .lesson-item:hover { border-color: #cbd5e1; box-shadow: var(--shadow-sm); background: #fafbfc; }
    .lesson-item.dragging { opacity: 0.35; border-color: var(--accent); background: var(--accent-soft); box-shadow: var(--shadow-md); }
    .lesson-item .drag-handle { color: #cbd5e1; font-size: 18px; cursor: grab; line-height: 1; flex-shrink: 0; padding: 2px; border-radius: 4px; transition: color var(--transition); }
    .lesson-item:hover .drag-handle { color: #94a3b8; }
    .lesson-item .drag-handle:active { cursor: grabbing; }
    .lesson-item .info { flex: 1; min-width: 0; }
    .lesson-item .info .title { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
    .lesson-item .info .sub { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
    .lesson-item .actions { display: flex; gap: 3px; flex-shrink: 0; }
    .lesson-item.drag-over { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-ring); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); display: flex; align-items: center; justify-content: center; z-index: 9998; animation: fadeIn 0.2s ease; backdrop-filter: blur(2px); }
    .modal-overlay .modal { background: #fff; border-radius: var(--radius-xl); padding: 28px; max-width: 420px; width: 90%; box-shadow: var(--shadow-xl); animation: modalPop 0.25s cubic-bezier(0.22,0.61,0.36,1); }
    @keyframes modalPop { from { opacity: 0; transform: scale(0.92) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal-overlay .modal h3 { margin-bottom: 6px; font-size: 18px; letter-spacing: -0.01em; }
    .modal-overlay .modal p { color: var(--text-secondary); margin-bottom: 20px; font-size: 14px; line-height: 1.5; }
    .modal-overlay .modal .actions { display: flex; gap: 10px; justify-content: flex-end; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ========== VIEW TAB – EXACT 850×1100 LAYOUT ========== */
    .view-container { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .lesson-spread { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; }

    .view-container .page,
    .thumb-page-wrapper .page { width: 850px; min-width: 850px; min-height: 1100px; height: 1100px; padding: 30px 35px; position: relative; margin: 0 auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); box-sizing: border-box; overflow: hidden; flex-shrink: 0; }
    .view-container .page:last-child { page-break-after: auto; }

    .view-container .card,
    .thumb-page-wrapper .card { border: 3px solid #f59e0b; border-radius: 26px; min-height: 1010px; height: 1010px; padding: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #fff; }

    .view-container .page .page-actions { text-align: right; padding: 8px 12px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; border-radius: 8px 8px 0 0; margin-bottom: 6px; }
    .view-container .export-btn, .view-container .edit-btn { background: #b91c1c; color: #fff; border: none; border-radius: 6px; padding: 7px 16px; font-weight: 600; font-size: 12px; font-family: var(--font); cursor: pointer; transition: all var(--transition); margin-left: 8px; }
    .view-container .edit-btn { background: #2563eb; }
    .view-container .export-btn:hover, .view-container .edit-btn:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    .inner-pad { flex: 1; padding: 20px 28px 0 28px; display: flex; flex-direction: column; }

    .page-footer-red { margin-top: auto; height: 26px; width: 100%; background: #b91c1c; border-radius: 0 0 23px 23px; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: 800; font-size: 17px; flex-shrink: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; letter-spacing: 0.02em; }

    .header-row { display: flex; align-items: stretch; gap: 0; margin-bottom: 14px; font-weight: 800; height: 44px; flex-shrink: 0; }
    .header-lesson { background: #f59e0b; color: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2px 18px; border-radius: 10px 0 0 10px; line-height: 1.1; font-size: 11px; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-weight: 800; }
    .header-lesson span { font-size: 19px; font-weight: 900; }
    .header-title { background: #b91c1c; color: #fff; flex: 1; display: flex; justify-content: center; align-items: center; font-size: 21px; letter-spacing: 0.04em; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-weight: 800; }
    .header-grade { background: #f59e0b; color: #0f172a; display: flex; justify-content: center; align-items: center; padding: 2px 18px; border-radius: 0 10px 10px 0; font-size: 15px; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-weight: 800; }

    /* Page 1 (original layout – with optional image box) */
    .title-image-row { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 18px; flex-shrink: 0; }
    .title-side { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; }
    .story-title { font-size: 28px; font-weight: 800; color: #b91c1c; margin: 0 0 8px 0; line-height: 1.15; letter-spacing: -0.01em; }
    .target-pill { display: inline-block; background: #fef9e7; border: 2px solid #f59e0b; border-radius: 26px; padding: 5px 16px; font-weight: 700; font-size: 16px; width: fit-content; align-self: flex-start; flex-shrink: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .story-img-container { flex: 0 0 420px; width: 420px; height: 160px; border-radius: 12px; overflow: hidden; background: #e2e8f0; position: relative; border: 1px solid #cbd5e1; -webkit-print-color-adjust: exact; print-color-adjust: exact; flex-shrink: 0; }
    .story-img-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .story-img-placeholder { width: 100%; height: 100%; background: linear-gradient(135deg, #1e3a5f 0%, #2a4a7f 100%); display: flex; align-items: center; justify-content: center; position: relative; }
    .story-img-placeholder svg { width: 100%; height: 100%; }
    .story-img-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.65); color: #fff; text-align: center; padding: 5px 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .title-block { margin-bottom: 18px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
    .title-block .story-title { text-align: center; }
    .title-block .target-pill { display: block; width: 100%; text-align: center; box-sizing: border-box; }

    .story-lines-area { flex: 0 0 auto; position: relative; padding-bottom: 10px; margin-bottom: 15px; }
    .story-line { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; font-size: 18px; font-weight: 600; line-height: 1.65; }
    .story-line .sentence { flex: 1; }
    .story-line .wc { font-weight: 700; color: #b91c1c; min-width: 30px; text-align: right; font-size: 16px; }

    .parent-corner { margin-top: 25px; margin-bottom: 12px; border: 3px solid #8B4513; border-radius: 12px; overflow: hidden; flex-shrink: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pc-header { background: #f59e0b; color: #0f172a; font-weight: 800; font-size: 15px; text-align: center; padding: 5px; letter-spacing: 0.08em; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pc-body { padding: 10px 14px; background: #fffdf7; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pc-body p { font-size: 12px; margin-bottom: 8px; line-height: 1.45; font-weight: 700; color: #b91c1c; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .parent-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12px; }
    .parent-table th, .parent-table td { padding: 7px 5px; text-align: center; border: 2px solid #8B4513; }
    .parent-table th:first-child { background: #fdfdfd; color: #0f172a; }
    .parent-table th { background: #b91c1c; color: #fff; font-weight: 800; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .parent-table td:first-child { font-weight: 700; text-align: left; background: #fdfdfd; }

    .comp-section { margin: 15px 0; flex-shrink: 0; }
    .comp-section.last-section { flex: 1; display: flex; flex-direction: column; }
    .comp-section.last-section .activity-blank-large { flex: 1; min-height: 120px; }
    .comp-header { background: #b91c1c; color: #fff; border-radius: 12px; padding: 7px 18px; font-size: 16px; font-weight: 700; display: inline-block; margin-bottom: 10px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .comp-q { margin-bottom: 18px; }
    .comp-q .qtext { font-weight: 700; font-size: 17px; margin-bottom: 5px; }
    .comp-q .opt { display: flex; align-items: center; gap: 12px; font-size: 16px; padding: 2px 0; }
    .comp-q .box-check { display: inline-block; width: 20px; height: 20px; border: 2px solid #b91c1c; border-radius: 4px; background: #fff; flex-shrink: 0; }
    .theory-answer { border-bottom: 2px solid #b91c1c; height: 30px; margin-top: 8px; }
    .activity-blank-large { flex: 0 0 auto; min-height: 120px; border: 3px solid #8B4513; border-radius: 16px; margin: 10px 0 18px 0; background: #fff; width: 100%; overflow: hidden; }
    .writing-line { border-bottom: 2px dashed #8B4513; height: 40px; margin: 10px 0 15px 0; width: 100%; display: flex; align-items: flex-end; }
    .writing-line .line-number { font-weight: 800; color: #8B4513; margin-right: 8px; font-size: 16px; }
    .comp-inst { font-size: 15px; color: #334155; margin-bottom: 5px; line-height: 1.55; }

    .image-only-page { display: flex; flex-direction: column; }
    .image-only-page .image-full-placeholder { flex: 1; border: 3px solid #f59e0b; border-radius: 16px; background: #f8fafc; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .image-only-page .image-full-placeholder img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-only-page .image-full-placeholder .placeholder-text { font-size: 24px; font-weight: 700; color: #94a3b8; }
    .image-only-page .image-full-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.65); color: #fff; text-align: center; padding: 8px 10px; font-size: 16px; font-weight: 700; letter-spacing: 0.03em; -webkit-print-color-adjust: exact; print-color-adjust: exact; z-index: 1; }
    .image-only-page .page-footer-red { margin-top: auto; }

    /* NEW: Image page square/rect container */
    .image-square-frame {
      width: var(--image-page-width, 600px);
      height: var(--image-page-height, 600px);
      border: 6px solid #b91c1c;
      outline: 4px solid #b91c1c;
      outline-offset: 4px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .image-square-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

  var tocPages = bookMeta.showToc && active ? Math.ceil(active / MAX_TOC_PER_PAGE) : 0;
  var lessonPages = 0;
  for (i = 0; i < lessons.length; i++) {
    if (!lessons[i].title || !String(lessons[i].title).trim()) continue;

function getFilteredLessons() {
  var q = (searchQuery || '').toLowerCase();
  if (!q) return lessons.slice();
  var out = [], i, j;
  for (i = 0; i < lessons.length; i++) {
    var l = lessons[i];
    var match = (l.title && l.title.toLowerCase().indexOf(q) !== -1) ||
      (l.targetSound && l.targetSound.toLowerCase().indexOf(q) !== -1);
    if (!match && l.storyLines) {
      for (j = 0; j < l.storyLines.length; j++) {
        if (l.storyLines[j].sentence && l.storyLines[j].sentence.toLowerCase().indexOf(q) !== -1) {
          match = true;
          break;
        }
      }
    }
    if (match) out.push(l);
  }
  return out;
}

function setupDragDrop() {
  var list = $('lessonList');
  if (!list) return;
  var items = list.querySelectorAll('.lesson-item');
  var i;
  for (i = 0; i < items.length; i++) {
    (function(item) {
      item.ondragstart = function(e) {
        if (item.className.indexOf('dragging') === -1) item.className += ' dragging';
        if (e.dataTransfer) {
          e.dataTransfer.setData('text/plain', item.getAttribute('data-id'));
          e.dataTransfer.effectAllowed = 'move';
        }
      };
      item.ondragend = function() {
        item.className = item.className.replace(/\s*dragging/g, '').replace(/\s*drag-over/g, '');
        var all = list.querySelectorAll('.drag-over');
        var j;
        for (j = 0; j < all.length; j++) all[j].className = all[j].className.replace(/\s*drag-over/g, '');
      };
      item.ondragover = function(e) {
        if (e.preventDefault) e.preventDefault();
        if (item.className.indexOf('dragging') === -1 && item.className.indexOf('drag-over') === -1) {
          item.className += ' drag-over';
        }
      };
      item.ondragleave = function() {
        item.className = item.className.replace(/\s*drag-over/g, '');
      };
      item.ondrop = function(e) {
        if (e.preventDefault) e.preventDefault();
        item.className = item.className.replace(/\s*drag-over/g, '');
        var id = e.dataTransfer ? e.dataTransfer.getData('text/plain') : '';
        var targetId = item.getAttribute('data-id');
        if (id && targetId && id !== targetId) {
          var fromIdx = -1, toIdx = -1, k;
          for (k = 0; k < lessons.length; k++) {
            if (lessons[k].id === id) fromIdx = k;
            if (lessons[k].id === targetId) toIdx = k;
          }
          if (fromIdx !== -1 && toIdx !== -1) {
            var movedArr = lessons.splice(fromIdx, 1);
            lessons.splice(toIdx, 0, movedArr[0]);
            renumberByOrder(lessons);
            saveData();
            refreshUI();
            showToast('Order updated.', 'info');
          }
        }
      };
    })(items[i]);
  }
}

window.addQuestion = function() {
  if (!tempPage2) return;
  tempPage2.comprehension.questions.push({ id: generateQuestionId(), type: 'objective', question: '', options: ['', '', ''], correctIndex: 0 });
  renderQuestionList();
  renderThumbnail();
};
window.deleteQuestion = function(idx) {
  if (!tempPage2) return;
  tempPage2.comprehension.questions.splice(idx, 1);
  renderQuestionList();
  renderThumbnail();
};
window.moveQuestion = function(idx, dir) {
  if (!tempPage2) return;
  var qs = tempPage2.comprehension.questions;
  var ni = idx + dir;
  if (ni < 0 || ni >= qs.length) return;
  var tmp = qs[idx];
  qs[idx] = qs[ni];
  qs[ni] = tmp;
  renderQuestionList();
  renderThumbnail();
};
window.changeQuestionType = function(idx, type) {
  if (!tempPage2) return;
  var q = tempPage2.comprehension.questions[idx];
  if (!q) return;
  q.type = type;
  if (type === 'objective') {
    if (!Array.isArray(q.options)) q.options = ['', '', ''];
    if (typeof q.correctIndex !== 'number') q.correctIndex = 0;
  } else {
    delete q.options;
    delete q.correctIndex;
  }
  renderQuestionList();
  renderThumbnail();
};
window.updateQuestionText = function(idx, val) {
  if (!tempPage2) return;
  var q = tempPage2.comprehension.questions[idx];
  if (q) q.question = val;
  renderThumbnail();
};
window.updateOption = function(qIdx, optIdx, val) {
  if (!tempPage2) return;
  var q = tempPage2.comprehension.questions[qIdx];
  if (q && q.options) q.options[optIdx] = val;
  renderThumbnail();
};
window.setCorrectOption = function(qIdx, optIdx) {
  if (!tempPage2) return;
  var q = tempPage2.comprehension.questions[qIdx];
  if (q) q.correctIndex = optIdx;
};
window.addOption = function(qIdx) {
  if (!tempPage2) return;
  var q = tempPage2.comprehension.questions[qIdx];
  if (q && q.options && q.options.length < MAX_OPTIONS) {
    q.options.push('');
    renderQuestionList();
    renderThumbnail();
  }
};
window.deleteOption = function(qIdx, optIdx) {
  if (!tempPage2) return;
  var q = tempPage2.comprehension.questions[qIdx];
  if (q && q.options && q.options.length > 2) {
    q.options.splice(optIdx, 1);
    if (typeof q.correctIndex === 'number') {
      if (q.correctIndex === optIdx) q.correctIndex = 0;
      else if (q.correctIndex > optIdx) q.correctIndex -= 1;
    }
    renderQuestionList();
    renderThumbnail();
  }
};
window.toggleSection = function(section, checked) {
  if (!tempPage2) return;
  if (section === 'comp') tempPage2.comprehension.enabled = checked;

function renderThumbnail() {
  var container = $('thumbnailContainer');
  if (!container) return;
  var data = getFormData();
  var ln = lessons.length + 1;
  if (editingId) {
    var existing = lessons.find(function(x) { return x.id === editingId; });
    if (existing) ln = existing.lessonNumber;
  }
  data.lessonNumber = ln;
  data.id = editingId || 'preview';
  container.innerHTML = '';
  function addThumb(pageEl, label) {
    var wrap = document.createElement('div');
    wrap.className = 'thumb-page-wrapper';
    var actions = pageEl.querySelector('.page-actions');
    if (actions && actions.parentNode) actions.parentNode.removeChild(actions);
    pageEl.style.transform = 'scale(0.25)';
    pageEl.style.transformOrigin = 'top left';
    pageEl.style.position = 'absolute';
    pageEl.style.top = '0';
    pageEl.style.left = '0';
    pageEl.style.width = '850px';
    pageEl.style.minWidth = '850px';
    pageEl.style.minHeight = '1100px';
    pageEl.style.height = '1100px';
    pageEl.style.padding = '30px 35px';
    pageEl.style.margin = '0';
    pageEl.style.borderRadius = '0';
    pageEl.style.boxShadow = 'none';
    pageEl.style.pageBreakAfter = 'auto';
    pageEl.style.background = '#fff';
    pageEl.style.boxSizing = 'border-box';
    pageEl.style.overflow = 'hidden';
    wrap.appendChild(pageEl);
    var lab = document.createElement('div');
    lab.className = 'thumb-label-small';
    lab.textContent = label;
    wrap.appendChild(lab);
    container.appendChild(wrap);
  }
  if (data.showImagePage) addThumb(buildImagePage(data, 1), 'Image');
  addThumb(buildPageOne(data, data.showImagePage ? 2 : 1), 'Reading');
  addThumb(buildPageTwo(data, data.showImagePage ? 3 : 2), 'Activities');
}

window.handleImageUpload = function(event) {
  var file = event.target.files && event.target.files[0];
  if (!file) return;
  if (file.size > MAX_IMAGE_SIZE) {
    showToast('Image must be less than 2 MB.', 'error');
    event.target.value = '';
    return;
  }
  if (!file.type || file.type.indexOf('image/') !== 0) {
    showToast('Please select a valid image file.', 'error');
    event.target.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    var dataUrl = e.target.result;
    if ($('fImageUrl')) $('fImageUrl').value = dataUrl;
    tempOriginalImageUrl = dataUrl;
    if ($('imagePreview')) {
      $('imagePreview').src = dataUrl;
      $('imagePreview').style.display = 'block';
    }
    if ($('imagePreviewPlaceholder')) $('imagePreviewPlaceholder').style.display = 'none';
    renderThumbnail();
    showToast('Image uploaded!', 'success');
  };
  reader.readAsDataURL(file);
};

};

window.saveLesson = function() {
  var data = getFormData();
  if (!data.title || !data.targetSound || data.storyLines.length < 1) {
    showToast('Please fill title, target sound, and at least 1 story line.', 'error');
    return;
  }
  if (data.page2.comprehension.enabled) {
    if (!data.page2.comprehension.questions.length) {
      showToast('Add at least one comprehension question or disable the section.', 'error');
      return;
    }
    var qi, oi;
    for (qi = 0; qi < data.page2.comprehension.questions.length; qi++) {
      var q = data.page2.comprehension.questions[qi];
      if (q.type === 'objective') {
        var valid = 0;
        for (oi = 0; oi < (q.options || []).length; oi++) {
          if (q.options[oi] && String(q.options[oi]).trim()) valid++;
        }
        if (valid < 2) {
          showToast('Each multiple-choice question needs at least 2 options.', 'error');
          return;
        }
      }
    }
  }
  if (data.useSprite) {
    if (!data.spriteSheetId) {
      showToast('Select a sprite sheet when sprite mode is on.', 'error');
      return;
    }
    if (data.spriteCrop.width <= 0 || data.spriteCrop.height <= 0) {
      showToast('Crop width and height must be greater than zero.', 'error');
      return;
    }
    var sheet = null, si;
    for (si = 0; si < bookMeta.spriteSheets.length; si++) {
      if (bookMeta.spriteSheets[si].id === data.spriteSheetId) {
        sheet = bookMeta.spriteSheets[si];
        break;
      }
    }
    if (!sheet) {
      showToast('Selected sprite sheet not found.', 'error');
      return;
    }
    cropSpriteSheet(sheet.dataUrl, data.spriteCrop, function(cropped) {
      if (!cropped) {
        showToast('Failed to crop sprite. Check coordinates.', 'error');
        return;
      }
      data.imageUrl = cropped;
      finishSave(data);
    });
    return;
  }
  finishSave(data);
};

function finishSave(data) {
  if (editingId) {
    var idx = -1, i;
    for (i = 0; i < lessons.length; i++) {
      if (lessons[i].id === editingId) { idx = i; break; }
    }
    if (idx === -1) {
      showToast('Not found.', 'error');
      return;
    }
    data.lessonNumber = idx + 1;
    data.id = editingId;
    lessons[idx] = data;
  } else {
    data.lessonNumber = lessons.length + 1;
    data.id = generateId();
    lessons.push(data);
  }
  previewLessonOverride = null;
  saveData();
  resetForm();
  refreshUI();
  showToast('Lesson saved!', 'success');
  switchTab('edit');
}

window.deleteLesson = function(id) {
  var l = lessons.find(function(x) { return x.id === id; });
  if (!l) return;
  confirmDialog('Delete "<strong>' + escapeHtml(l.title) + '</strong>"?', function() {
    var next = [], i;
    for (i = 0; i < lessons.length; i++) {
      if (lessons[i].id !== id) next.push(lessons[i]);
    }
    lessons = next;
    if (editingId === id) resetForm();
    renumberByOrder(lessons);
    previewLessonOverride = null;
    saveData();
    refreshUI();
  });
};

window.duplicateLesson = function(id) {
  var l = lessons.find(function(x) { return x.id === id; });
  if (!l) return;
  var copy = clone(l);
  copy.id = generateId();
  lessons.push(copy);
  renumberByOrder(lessons);
  previewLessonOverride = null;
  saveData();
  refreshUI();
  showToast('Duplicated.', 'success');
};

  var a = document.createElement('a');

};

window.importJSON = function(input) {
  var file = input && input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data || typeof data !== 'object') throw new Error('Invalid');
      var importedLessons = Array.isArray(data.lessons) ? data.lessons : [];
      if (!importedLessons.length) throw new Error('No lessons');
      confirmDialog('Replace all lessons with imported data?', function() {
        applyLoadedLessons(importedLessons);
        dataSource = 'import';
        normalizeBookMeta(data.bookMeta || getHardcodedBookMeta());
        previewLessonOverride = null;
        saveData();
        resetForm();
        refreshUI();
        showToast('Imported successfully.', 'success');
        switchTab('book');
      });
    } catch (err) {
      showToast('Invalid JSON file.', 'error');
    }
  };
  reader.readAsText(file);
  input.value = '';
};

window.resetToHardcodedData = function() {
  dataSource = 'hardcode';
  if (typeof DEFAULT_LESSONS !== 'undefined' && DEFAULT_LESSONS) {
    applyLoadedLessons(clone(DEFAULT_LESSONS));
  } else {
    lessons = [];
  }
  normalizeBookMeta(getHardcodedBookMeta());
  renumberByOrder(lessons);
  previewLessonOverride = null;
  editingId = null;
  saveData();
  resetForm();
  refreshUI();
  showToast('Loaded factory data (' + lessons.length + ' lessons).', 'success');
};

function renderTocPreview() {
  var container = $('tocPreview');
  if (!container) return;
  if (!bookMeta.showToc) {
    container.innerHTML = '<p style="color:#64748b;font-style:italic;">Table of Contents is disabled.</p>';
    return;
  }
  var active = [], i;
  for (i = 0; i < lessons.length; i++) {
    if (lessons[i].title && String(lessons[i].title).trim()) active.push(lessons[i]);
  }
  if (!active.length) {
    container.innerHTML = '<p style="color:#64748b;">No active lessons.</p>';
    return;
  }
  var sightPages = bookMeta.sightWords.enabled ? parseSightWords(bookMeta.sightWords.rawText).length : 0;
  var tocPageCount = Math.ceil(active.length / MAX_TOC_PER_PAGE);
  var runningPage = 1 + sightPages + tocPageCount + 1;
  var html = '<ul style="list-style:none;padding:0;margin:0;">';
  for (i = 0; i < active.length; i++) {
    var l = active[i];
    html += '<li style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0;"><span>Lesson ' +
      escapeHtml(l.lessonNumber) + ': ' + escapeHtml(l.title) + '</span><span style="color:#b91c1c;font-weight:700;">Page ' +
      runningPage + '</span></li>';
    runningPage += l.showImagePage ? 3 : 2;
  }
  html += '</ul>';
  container.innerHTML = html;
}

window.addSpriteSheet = function(fileInput) {
  var file = fileInput && fileInput.files && fileInput.files[0];
  if (!file) return;
  if (file.size > MAX_IMAGE_SIZE) {
    showToast('Sprite sheet must be less than 2 MB.', 'error');
    fileInput.value = '';
    return;
  }
  if (!file.type || file.type.indexOf('image/') !== 0) {
    showToast('Please select a valid image file.', 'error');
    fileInput.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    var dataUrl = e.target.result;
    var name = window.prompt('Enter a name for this sprite sheet:', 'Sprite Sheet ' + (bookMeta.spriteSheets.length + 1));
    fileInput.value = '';
    if (!name) return;
    bookMeta.spriteSheets.push({
      id: generateSpriteSheetId(),
      name: String(name).trim() || 'Unnamed',
      dataUrl: dataUrl
    });
    saveData();
    renderSpriteSheetsList();
    populateSpriteSheetSelect();
    showToast('Sprite sheet added!', 'success');
  };
  reader.readAsDataURL(file);
};

window.deleteSpriteSheet = function(id) {
  var sheet = null, i;
  for (i = 0; i < bookMeta.spriteSheets.length; i++) {
    if (bookMeta.spriteSheets[i].id === id) { sheet = bookMeta.spriteSheets[i]; break; }
  }
  if (!sheet) return;
  confirmDialog('Delete sprite sheet "<strong>' + escapeHtml(sheet.name) + '</strong>"?', function() {
    var next = [];
    for (i = 0; i < bookMeta.spriteSheets.length; i++) {
      if (bookMeta.spriteSheets[i].id !== id) next.push(bookMeta.spriteSheets[i]);
    }
    bookMeta.spriteSheets = next;
    for (i = 0; i < lessons.length; i++) {
      if (lessons[i].spriteSheetId === id) {
        lessons[i].useSprite = false;
        lessons[i].spriteSheetId = '';
        lessons[i].spriteCrop = { x: 0, y: 0, width: 0, height: 0 };
      }
    }
    saveData();
    renderSpriteSheetsList();
    populateSpriteSheetSelect();
    renderEditList();
    showToast('Sprite sheet deleted.', 'info');
  });
};

/* ========== PRESENT ========== */
function populatePresentLessonSelect() {
  var sel = $('presentLessonSelect');
  if (!sel) return;
  var prev = presentSelectedLessonId || sel.value;
  sel.innerHTML = '';
  var active = [], i;
  for (i = 0; i < lessons.length; i++) {
    if (lessons[i].title && String(lessons[i].title).trim()) active.push(lessons[i]);
  }
  if (!active.length) {
    sel.innerHTML = '<option value="">No lessons</option>';
    presentSelectedLessonId = null;
    return;
  }
  for (i = 0; i < active.length; i++) {
    var opt = document.createElement('option');
    opt.value = active[i].id;
    opt.textContent = 'Lesson ' + active[i].lessonNumber + ': ' + active[i].title;
    sel.appendChild(opt);
  }
  var found = false;
  for (i = 0; i < active.length; i++) {
    if (active[i].id === prev) { found = true; break; }
  }
  if (found) {
    sel.value = prev;
    presentSelectedLessonId = prev;
  } else {
    sel.value = active[0].id;
    presentSelectedLessonId = active[0].id;
  }
}

function cycleColor(current) {
  if (!current) return PRESENT_COLORS[0];
  var idx = -1, i;
  for (i = 0; i < PRESENT_COLORS.length; i++) {
    if (PRESENT_COLORS[i] === current) { idx = i; break; }
  }
  if (idx === -1) return PRESENT_COLORS[0];
  return PRESENT_COLORS[(idx + 1) % PRESENT_COLORS.length];
}

function colorClass(name) {
  return name ? ('pw-' + name) : '';
}

function tokenizeSentence(sentence) {
  return String(sentence || '').trim().split(/\s+/).filter(function(w) { return !!w; });
}

function renderPresentView() {
  var stage = $('presentStage');
  if (!stage) return;
  var lesson = lessons.find(function(l) { return l.id === presentSelectedLessonId; });
  if (!lesson) {
    stage.innerHTML = '<div class="present-empty">Select a lesson to present.</div>';
    return;
  }
  var runningTotal = 0, linesHtml = '', lineIdx, wordIdx;
  for (lineIdx = 0; lineIdx < lesson.storyLines.length; lineIdx++) {
    var words = tokenizeSentence(lesson.storyLines[lineIdx].sentence);
    runningTotal += words.length;
    var wordsHtml = '';
    for (wordIdx = 0; wordIdx < words.length; wordIdx++) {
      var key = lineIdx + '-' + wordIdx;
      var col = presentWordColors[key] || '';
      wordsHtml += '<span class="present-word ' + colorClass(col) + '" data-line="' + lineIdx + '" data-word="' + wordIdx +
        '" data-text="' + escapeHtml(words[wordIdx]) + '">' + escapeHtml(words[wordIdx]) + '</span>';
    }
    linesHtml += '<div class="present-line"><div class="present-sentence">' + wordsHtml +
      '</div><span class="present-wc">' + runningTotal + '</span></div>';
  }
  stage.innerHTML = '<div class="present-header"><div class="present-title">Lesson ' + escapeHtml(lesson.lessonNumber) +
    ' \u2014 ' + escapeHtml(lesson.title) + '</div><div class="present-meta">Target: ' + escapeHtml(lesson.targetSound) +
    ' \u00B7 Grade ' + escapeHtml(bookMeta.grade) + '</div></div><div class="present-lines">' + linesHtml + '</div>';
  var els = stage.querySelectorAll('.present-word'), ei;
  for (ei = 0; ei < els.length; ei++) {
    (function(el) {
      el.onclick = function(e) {
        if (e && e.preventDefault) e.preventDefault();
        if (e && e.stopPropagation) e.stopPropagation();
        var lineIdx2 = parseInt(el.getAttribute('data-line'), 10);
        var wordIdx2 = parseInt(el.getAttribute('data-word'), 10);
        var text = el.getAttribute('data-text') || el.textContent;
        var key2 = lineIdx2 + '-' + wordIdx2;
        if (presentSegmentMode) {
          openSegmentOverlay(text);
        } else {
          var next = cycleColor(presentWordColors[key2]);
          presentWordColors[key2] = next;
          el.className = 'present-word ' + colorClass(next);
        }
      };
    })(els[ei]);
  }
}

function openSegmentOverlay(wordText) {
  var existing = document.querySelector('.present-overlay');
  if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
  var overlay = document.createElement('div');
  overlay.className = 'present-overlay';
  var letterColors = {};
  var letters = String(wordText).split('');
  var lettersHtml = '', i;
  for (i = 0; i < letters.length; i++) {
    var ch = letters[i];
    var display = ch === ' ' ? '\u00A0' : ch;
    lettersHtml += '<span class="present-overlay-letter" data-idx="' + i + '">' + escapeHtml(display) + '</span>';
  }
  overlay.innerHTML = '<div class="present-overlay-inner"><div class="present-overlay-word">' + lettersHtml +
    '</div><div class="present-overlay-hint">Tap a letter to cycle color \u00B7 Tap outside to close</div></div>';
  document.body.appendChild(overlay);
  var wordEl = overlay.querySelector('.present-overlay-word');
  if (wordEl) {
    wordEl.onclick = function(e) {
      if (e && e.stopPropagation) e.stopPropagation();
    };
  }
  var letterEls = overlay.querySelectorAll('.present-overlay-letter');
  for (i = 0; i < letterEls.length; i++) {
    (function(letterEl) {
      letterEl.onclick = function(e) {
        if (e && e.preventDefault) e.preventDefault();
        if (e && e.stopPropagation) e.stopPropagation();
        var idx = letterEl.getAttribute('data-idx');
        var next = cycleColor(letterColors[idx]);
        letterColors[idx] = next;
        letterEl.className = 'present-overlay-letter ' + colorClass(next);
      };
    })(letterEls[i]);
  }
  overlay.onclick = function() {
    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
  };
}

function getQuizQuestions(lesson) {
  if (!lesson || !lesson.page2 || !lesson.page2.comprehension) return [];
  if (!lesson.page2.comprehension.enabled) return [];
  var raw = lesson.page2.comprehension.questions || [];
  var out = [], i, j;
  for (i = 0; i < raw.length; i++) {
    var q = raw[i];
    if (q.type === 'objective' && q.question && String(q.question).trim() && Array.isArray(q.options)) {
      var valid = 0;
      for (j = 0; j < q.options.length; j++) {
        if (q.options[j] && String(q.options[j]).trim()) valid++;
      }
      if (valid >= 2) out.push(q);
    }
  }
  return out;
}

function shuffleArray(arr) {
  var a = arr.slice(), i;
  for (i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i];
    a[i] = a[j];
    a[j] = t;
  }
  return a;
}

function prepareShuffledQuizQuestions(rawQuestions) {
  var out = [], i, j;
  for (i = 0; i < rawQuestions.length; i++) {
    var q = rawQuestions[i];
    var opts = [];
    for (j = 0; j < (q.options || []).length; j++) {
      var o = String(q.options[j] || '').trim();
      if (o) opts.push(o);
    }
    var storedCorrect = (typeof q.correctIndex === 'number' && q.correctIndex >= 0 && q.correctIndex < opts.length) ? q.correctIndex : 0;
    var correctText = opts[storedCorrect];
    var shuffled = shuffleArray(opts);
    var newCorrectIndex = 0;
    for (j = 0; j < shuffled.length; j++) {
      if (shuffled[j] === correctText) { newCorrectIndex = j; break; }
    }
    out.push({ question: q.question, options: shuffled, correctIndex: newCorrectIndex });
  }
  return out;
}

function setQuizOpen(open) {
  quizState.open = !!open;
  var workspace = $('presentWorkspace');
  var btn = $('presentQuizBtn');
  if (workspace) {
    if (quizState.open) {
      if (workspace.className.indexOf('quiz-open') === -1) workspace.className += ' quiz-open';
    } else {
      workspace.className = workspace.className.replace(/\s*quiz-open/g, '');
    }
  }
  if (btn) {
    btn.className = quizState.open ? 'btn btn-warning btn-sm' : 'btn btn-primary btn-sm';
    btn.textContent = quizState.open ? '\u2715 Hide Quiz' : '\u2753 Quiz';
  }
}

window.startPresentQuiz = function() {
  if (quizState.open) {
    closePresentQuiz();
    return;
  }
  var lesson = lessons.find(function(l) { return l.id === presentSelectedLessonId; });
  if (!lesson) {
    showToast('Select a lesson first.', 'warning');
    return;
  }
  var raw = getQuizQuestions(lesson);
  if (!raw.length) {
    showToast('No multiple-choice questions for this lesson. Add some in Edit and mark the correct answer.', 'warning');
    return;
  }
  var questions = prepareShuffledQuizQuestions(raw);
  var existingSeg = document.querySelector('.present-overlay');
  if (existingSeg && existingSeg.parentNode) existingSeg.parentNode.removeChild(existingSeg);
  quizState = { questions: questions, index: 0, lessonId: lesson.id, open: true };
  setQuizOpen(true);
  renderQuizPanel();
};

function closePresentQuiz() {
  var pane = $('presentQuizPane');
  if (pane) pane.innerHTML = '';
  quizState = { questions: [], index: 0, lessonId: null, open: false };
  setQuizOpen(false);
}

function renderQuizPanel() {
  var pane = $('presentQuizPane');
  if (!pane) return;
  pane.innerHTML = '';
  pane.style.position = 'relative';
  var q = quizState.questions[quizState.index];
  if (!q) return;
  var opts = [], i;
  for (i = 0; i < (q.options || []).length; i++) {
    var o = String(q.options[i] || '').trim();
    if (o) opts.push(o);
  }
  var correctIndex = (typeof q.correctIndex === 'number' && q.correctIndex >= 0 && q.correctIndex < opts.length) ? q.correctIndex : 0;
  var card = document.createElement('div');
  card.className = 'present-quiz-card';
  var optsHtml = '';
  for (i = 0; i < opts.length; i++) {
    optsHtml += '<button type="button" class="present-quiz-opt" data-opt="' + i + '">' + escapeHtml(opts[i]) + '</button>';
  }
  card.innerHTML = '<div class="present-quiz-progress">Question ' + (quizState.index + 1) + ' of ' + quizState.questions.length +
    '</div><div class="present-quiz-question">' + escapeHtml(q.question) + '</div><div class="present-quiz-options">' + optsHtml +
    '</div><div class="present-quiz-actions"><button type="button" class="btn btn-outline btn-sm" id="quizCloseBtn">Hide Quiz</button>' +
    '<span class="hint">Tap an answer</span></div>';
  pane.appendChild(card);
  var closeBtn = card.querySelector('#quizCloseBtn');
  if (closeBtn) closeBtn.onclick = function() { closePresentQuiz(); };
  var optBtns = card.querySelectorAll('.present-quiz-opt');
  for (i = 0; i < optBtns.length; i++) {
    (function(btn) {
      btn.onclick = function() {
        var chosen = parseInt(btn.getAttribute('data-opt'), 10);
        var isCorrect = chosen === correctIndex;
        var b;
        // Temporarily disable while feedback is showing
        for (b = 0; b < optBtns.length; b++) optBtns[b].disabled = true;
        showQuizFeedback(isCorrect, function() {
          if (!quizState.open) return;
          if (isCorrect) {
            // Only advance (or finish) on a correct answer
            if (quizState.index < quizState.questions.length - 1) {
              quizState.index += 1;
              renderQuizPanel();
            } else {
              closePresentQuiz();
              showToast('Quiz complete!', 'success');
            }
          } else {
            // Wrong answer: re-enable options so the student can try again
            for (b = 0; b < optBtns.length; b++) optBtns[b].disabled = false;
          }
        });
      };
    })(optBtns[i]);
  }
}

function showQuizFeedback(isCorrect, onDone) {
  var pane = $('presentQuizPane');
  if (!pane) {
    if (typeof onDone === 'function') onDone();
    return;
  }
  var existing = pane.querySelector('.present-quiz-feedback');
  if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
  var fb = document.createElement('div');
  fb.className = 'present-quiz-feedback ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = '<div class="present-quiz-feedback-text">' + (isCorrect ? '\u2713 Correct!' : '\u2717 Wrong') + '</div>';
  pane.appendChild(fb);
  setTimeout(function() {
    if (fb.parentNode) fb.parentNode.removeChild(fb);
    if (typeof onDone === 'function') onDone();
  }, 2000);
}

window.switchTab = function(tab) {
  var btns = document.querySelectorAll('.tab-btn');
  var panels = document.querySelectorAll('.tab-panel');
  var i;
  for (i = 0; i < btns.length; i++) {
    btns[i].className = btns[i].getAttribute('data-tab') === tab ? 'tab-btn active' : 'tab-btn';
  }
  for (i = 0; i < panels.length; i++) {
    panels[i].className = panels[i].id === tab + 'Panel' ? 'tab-panel active' : 'tab-panel';
  }
  if (tab === 'edit') {
    renderEditList();
    renderThumbnail();
    populateSpriteSheetSelect();
  }
  if (tab === 'view') renderAllView();
  if (tab === 'book') {
    if ($('coverTitleInput')) $('coverTitleInput').value = bookMeta.title;
    if ($('coverSubtitleInput')) $('coverSubtitleInput').value = bookMeta.subtitle;
    if ($('globalGradeInput')) $('globalGradeInput').value = bookMeta.grade;
    if ($('tocToggle')) $('tocToggle').checked = bookMeta.showToc;
    if ($('sightWordsToggle')) $('sightWordsToggle').checked = bookMeta.sightWords.enabled;
    if ($('sightWordsTitle')) $('sightWordsTitle').value = bookMeta.sightWords.title;
    if ($('sightColumns')) $('sightColumns').value = bookMeta.sightWords.columns;
    if ($('sightWordsText')) $('sightWordsText').value = bookMeta.sightWords.rawText;
    toggleSightWordsFields();
    renderSpriteSheetsList();
    renderEditList();
    renderTocPreview();
  }
  if (tab === 'present') {
    populatePresentLessonSelect();
    renderPresentView();
  } else {
    closePresentQuiz();
  }
  if (tab !== 'view') previewLessonOverride = null;
  updateCounts();
};

function refreshUI() {
  renderEditList();
  renderAllView();
  updateCounts();
  renderSpriteSheetsList();
}

    '<div class="present-workspace" id="presentWorkspace">' +
    '<div class="present-stage" id="presentStage"><div class="present-empty">Select a lesson to present.</div></div>' +
    '<div class="present-quiz-pane" id="presentQuizPane"></div></div></div>';
}

function initApp() {
  try {
    loadData();
  } catch (e) {
    lessons = [];
    normalizeBookMeta(getHardcodedBookMeta());
  }
  buildAppShell();
  var importFile = $('importFile');
  if (importFile) {
    importFile.onchange = function() { importJSON(importFile); };
  }
  resetForm();
  renderEditList();
  renderAllView();
  updateCounts();
  renderTocPreview();
  renderSpriteSheetsList();
  renderThumbnail();
}

initApp();
</script>
</body>
</html>
