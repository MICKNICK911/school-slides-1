<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phonics Slide Studio</title>
  <style>
    /* ========== RESET & TOKENS ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Hardcoded colors (no CSS variables) */
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f5f7fa;
  color: #1a1a1a;
  font-size: 15px;
  line-height: 1.45;
  overflow: hidden;
}
/* Dark theme (applied via class) */
body.dark {
  background: #121212;
  color: #f0f0f0;
}

/* ========== APP SHELL ========== */
#app { display: flex; flex-direction: column; height: 100vh; }
.app-header {
  background: #1a1a2e;
  color: #fff;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  flex-shrink: 0;
  z-index: 50;
}
.app-header .logo { font-weight: 800; font-size: 18px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.app-header .logo span { color: #F5A623; }
.deck-switcher { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; max-width: 220px; cursor: pointer; }
.search-wrap { flex: 1; min-width: 140px; max-width: 320px; position: relative; }
.search-wrap input { width: 100%; padding: 8px 14px 8px 36px; border-radius: 20px; border: none; font-size: 14px; background: rgba(255,255,255,0.95); color: #111; }
.search-wrap::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; pointer-events: none; }
.header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(255,255,255,0.12); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.icon-btn:hover { background: rgba(255,255,255,0.25); }
.icon-btn.active { background: #F5A623; color: #111; }

/* ========== MAIN ========== */
.main { flex: 1; overflow: hidden; display: flex; position: relative; }

/* Library */
.library-view { width: 100%; overflow-y: auto; padding: 28px 24px; }
.library-hero { text-align: center; max-width: 560px; margin: 0 auto 32px; }
.library-hero h1 { font-size: 28px; margin-bottom: 8px; }
.library-hero p { color: #6c757d; margin-bottom: 20px; }
.library-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
.deck-grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 1100px; margin: 0 auto; }
.deck-card { background: #ffffff; border: 2px solid #dee2e6; border-radius: 12px; padding: 18px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; flex: 0 0 260px; margin-bottom: 16px; }
.deck-card:hover { border-color: #F5A623; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
.deck-card h3 { font-size: 17px; margin-bottom: 6px; }
.deck-card .meta { font-size: 13px; color: #6c757d; margin-bottom: 12px; }
.deck-card .actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* Deck View */
.deck-view { display: flex; width: 100%; height: 100%; overflow: hidden; }
.page-list-panel { width: 300px; min-width: 240px; background: #ffffff; border-right: 1px solid #dee2e6; display: flex; flex-direction: column; overflow: hidden; }
.page-list-header { padding: 12px 14px; border-bottom: 1px solid #dee2e6; font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.page-list { flex: 1; overflow-y: auto; padding: 8px; }
.page-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; margin-bottom: 4px; transition: background 0.12s, border-color 0.12s; }
.page-item:hover { background: #f5f7fa; }
.page-item.active { border-color: #F5A623; background: rgba(245,166,35,0.08); }
.page-item .name { font-weight: 700; font-size: 14px; }
.page-item .title { font-size: 12px; color: #6c757d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-item .item-actions { display: none; gap: 4px; margin-top: 6px; }
.page-item.active .item-actions, .page-item:hover .item-actions { display: flex; }

.preview-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f5f7fa; }
.preview-toolbar { padding: 10px 16px; background: #ffffff; border-bottom: 1px solid #dee2e6; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.preview-toolbar .info { margin-right: auto; font-size: 13px; color: #6c757d; font-weight: 600; }
.preview-scroll { flex: 1; overflow: auto; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }

/* Editor */
.editor-view { display: flex; width: 100%; height: 100%; overflow: hidden; }
.editor-form { width: 420px; min-width: 320px; background: #ffffff; border-right: 1px solid #dee2e6; overflow-y: auto; padding: 16px; }
.editor-form h2 { font-size: 18px; margin-bottom: 14px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-weight: 700; font-size: 12px; color: #6c757d; margin-bottom: 4px; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 10px; border: 2px solid #dee2e6; border-radius: 8px; font-size: 14px; font-family: inherit; background: #f5f7fa; color: #1a1a1a; }
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: #F5A623; }
.form-group textarea { resize: vertical; min-height: 80px; font-family: ui-monospace, monospace; font-size: 13px; }
.form-group textarea.code { min-height: 120px; }
.editor-preview-wrap { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; align-items: center; background: #f5f7fa; }
.editor-preview-wrap .label { font-size: 13px; font-weight: 700; color: #6c757d; margin-bottom: 10px; }
.editor-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 12px; border-top: 1px solid #dee2e6; }

/* Image Manager */
.img-manager { margin-top: 8px; border: 2px solid #dee2e6; border-radius: 8px; padding: 10px 12px; background: #f5f7fa; }
.img-manager .img-manager-title { font-weight: 700; font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.img-manager .img-slot { display: flex; align-items: center; gap: 10px; background: #ffffff; padding: 6px 10px; border-radius: 6px; border: 1px solid #dee2e6; margin-bottom: 6px; }
.img-manager .img-slot .thumb { width: 44px; height: 44px; object-fit: contain; border-radius: 4px; background: #fff; border: 1px solid #dee2e6; flex-shrink: 0; }
.img-manager .img-slot .info { flex: 1; font-size: 12px; color: #6c757d; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.img-manager .img-slot .info strong { color: #1a1a1a; font-weight: 600; }
.img-manager .img-slot .img-actions { display: flex; gap: 4px; flex-shrink: 0; }
.img-manager .empty-img-note { font-size: 13px; color: #6c757d; padding: 6px 0; text-align: center; }

/* Buttons */
.btn { padding: 8px 16px; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; transition: transform 0.1s, background 0.15s; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: #F5A623; color: #1a1a1a; }
.btn-primary:hover:not(:disabled) { background: #e0950f; }
.btn-success { background: #2d7d46; color: #fff; }
.btn-danger { background: #dc3545; color: #fff; }
.btn-outline { background: transparent; border: 2px solid #dee2e6; color: #1a1a1a; }
.btn-outline:hover:not(:disabled) { background: #f5f7fa; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 6px; }
.btn-icon { padding: 4px 8px; font-size: 14px; }

/* ========== PAGE RENDERER ========== */
.page-frame {
  width: 1100px;
  min-width: 1100px;
  height: 850px;
  min-height: 850px;
  max-height: 850px;
  padding: 16px 22px;
  background: #fff;
  border-radius: 6px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.08);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.page-frame .card {
  border: 4px solid #E2571C;
  border-radius: 12px;
  width: 100%;
  height: 818px;
  min-height: 818px;
  max-height: 818px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #fff;
  box-sizing: border-box;
}
.cvc-header {
  display: flex;
  align-items: stretch;
  border-bottom: 3px solid #E2571C;
  min-height: 64px;
  flex-shrink: 0;
}
.cvc-header-left {
  flex: 1;
  padding: 10px 18px 6px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.cvc-main-title {
  font-size: 26px;
  font-weight: 800;
  color: #E2571C;
  letter-spacing: 0.3px;
  line-height: 1.1;
  margin: 0;
}
.cvc-subtitle {
  font-size: 12px;
  font-weight: 700;
  color: #c45a12;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  margin-top: 2px;
}
.cvc-header-right {
  background: #E2571C;
  color: #fff;
  min-width: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 14px;
}
.cvc-header-right .lesson-label { font-size: 12px; font-weight: 600; opacity: 0.95; margin-right: 5px; }
.cvc-header-right .lesson-num { font-size: 24px; font-weight: 800; line-height: 1; }
.code-content-area {
  flex: 1 1 auto;
  overflow: hidden;
  position: relative;
  width: 100%;
  min-height: 0;
}
.code-content-area .code-inner {
  width: 100%;
  height: 100%;
  overflow: auto;
  padding: 16px 20px;
  box-sizing: border-box;
}
.cvc-page-number {
  position: absolute;
  bottom: 8px;
  left: 0;
  right: 0;
  text-align: center;
  font-weight: 700;
  font-size: 13px;
  color: #6c757d;
  z-index: 2;
  pointer-events: none;
}

/* Cover */
.cover-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 818px;
  border: 3px solid #F5A623;
  border-radius: 24px;
  font-family: 'Times New Roman', Times, serif;
}
.cover-line { width: 110px; height: 4px; background: #F5A623; margin: 26px auto; border-radius: 2px; }
.cover-title { font-size: 56px; font-weight: 800; color: #1a1a2e; letter-spacing: 2px; }
.cover-subtitle { font-size: 28px; font-weight: 400; color: #E2571C; margin-top: 12px; font-style: italic; }

/* TOC */
.toc-card {
  border: 3px solid #F5A623;
  border-radius: 24px;
  height: 818px;
  padding: 26px 36px;
  position: relative;
  font-family: 'Times New Roman', Times, serif;
  overflow: hidden;
}
.toc-title {
  font-size: 26px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 18px;
  border-bottom: 4px solid #F5A623;
  padding-bottom: 8px;
}
.toc-list { list-style: none; }
.toc-item {
  display: flex;
  justify-content: space-between;
  padding: 6px 5px;
  border-bottom: 1px dashed #dee2e6;
  font-size: 13px;
  font-weight: 600;
}
.toc-item .toc-page-num { font-weight: 800; color: #E2571C; min-width: 56px; text-align: right; }

/* Thumbnail scale */
.thumb-box {
  width: 440px;
  height: 340px;
  border: 2px solid #dee2e6;
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
  position: relative;
  box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}
.thumb-box .page-frame {
  transform: scale(0.4);
  transform-origin: top left;
  position: absolute;
  top: 0; left: 0;
  box-shadow: none;
  border-radius: 0;
}

/* ========== PRESENTATION ========== */
.present-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #111;
  z-index: 9000;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.present-overlay.active { display: flex; }
.present-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 12px; }
.present-stage .page-frame { box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
.present-nav { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 4; }
.nav-cluster { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; pointer-events: auto; z-index: 6; }
.nav-cluster.left { left: 14px; }
.nav-cluster.right { right: 14px; }
.present-nav-btn { width: 46px; height: 46px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 20px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.present-nav-btn:hover { background: rgba(255,255,255,0.3); }
.present-topbar { position: absolute; top: 0; left: 0; right: 0; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); z-index: 5; opacity: 0; transition: opacity 0.25s; }
.present-overlay:hover .present-topbar { opacity: 1; }
.present-indicator { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; z-index: 5; }
.present-close { background: rgba(255,255,255,0.15); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.present-close:hover { background: rgba(255,255,255,0.3); }

/* ========== SIDE PANELS ========== */
.side-panel { position: fixed; top: 0; bottom: 0; width: 300px; background: #ffffff; box-shadow: 0 4px 18px rgba(0,0,0,0.08); z-index: 800; transform: translateX(-100%); transition: transform 0.25s ease; display: flex; flex-direction: column; overflow: hidden; }
.side-panel.right { left: auto; right: 0; transform: translateX(100%); }
.side-panel.active { transform: translateX(0); }
.side-panel-header { padding: 16px; border-bottom: 1px solid #dee2e6; display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
.side-panel-body { flex: 1; overflow-y: auto; padding: 12px; }
.side-item { padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid #dee2e6; margin-bottom: 8px; transition: border-color 0.12s; }
.side-item:hover { border-color: #F5A623; }
.overlay-dim { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 700; display: none; }
.overlay-dim.active { display: block; }

/* ========== TOAST & MODAL ========== */
.toast-container { position: fixed; top: 16px; right: 16px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; max-width: 360px; pointer-events: none; }
.toast { padding: 12px 16px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 8px; pointer-events: auto; animation: slideIn 0.25s ease; }
.toast.success { background: #2d7d46; }
.toast.error { background: #dc3545; }
.toast.info { background: #2c7be5; }
.toast.warning { background: #e67e22; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 9500; }
.modal { background: #ffffff; border-radius: 16px; padding: 24px; max-width: 400px; width: 90%; box-shadow: 0 24px 48px rgba(0,0,0,0.25); }
.modal h3 { margin-bottom: 8px; }
.modal p { color: #6c757d; margin-bottom: 18px; font-size: 14px; }
.modal .actions { display: flex; gap: 10px; justify-content: flex-end; }

/* ========== EMPTY / HELPERS ========== */
.empty-state { text-align: center; padding: 48px 20px; color: #6c757d; }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.hidden { display: none !important; }

/* ========== FLASH MODE (manager) ========== */
.flash-view { display: flex; width: 100%; height: 100%; overflow: hidden; }
.flash-deck-list-panel { width: 300px; min-width: 240px; background: #ffffff; border-right: 1px solid #dee2e6; display: flex; flex-direction: column; overflow: hidden; }
.flash-deck-list { flex: 1; overflow-y: auto; padding: 8px; }
.flash-deck-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; margin-bottom: 4px; }
.flash-deck-item:hover { background: #f5f7fa; }
.flash-deck-item.active { border-color: #F5A623; background: rgba(245,166,35,0.08); }
.flash-deck-item .name { font-weight: 700; font-size: 14px; }
.flash-deck-item .meta { font-size: 12px; color: #6c757d; }
.flash-type-badge { display: inline-block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 6px; border-radius: 6px; background: #F5A623; color: #1a1a1a; margin-right: 6px; }
.flash-editor-panel { flex: 1; overflow-y: auto; padding: 18px; background: #f5f7fa; }
.flash-items-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.flash-item-chip { background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; padding: 6px 10px; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: grab; }
.flash-item-chip .del { border: none; background: none; cursor: pointer; color: #dc3545; font-weight: 800; font-size: 14px; line-height: 1; }
.flash-item-chip.drag-over { border-color: #F5A623; }

/* ========== FLASH PRESENTATION ========== */
.flash-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9200; display: none; align-items: center; justify-content: center; }
.flash-overlay.active { display: flex; }
.flash-overlay.theme-words { background: #fdf3e7; }
.flash-overlay.theme-sentences { background: #eef6ee; }
.flash-card-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box; }
.flash-word-display { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 92%; }
.flash-letter { font-size: 13vw; font-weight: 800; font-family: 'Segoe UI', sans-serif; color: #1a1a1a; cursor: pointer; user-select: none; line-height: 1; padding: 4px 6px; border-radius: 14px; transition: color 0.1s; text-shadow: 0 0 1px rgba(0,0,0,0.15); }
.flash-sentence-display { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
.flash-word-token { font-size: 9vw; font-weight: 700; font-family: 'Georgia', 'Times New Roman', serif; color: #1a1a1a; cursor: pointer; user-select: none; line-height: 1.3; padding: 4px 10px; border-radius: 10px; transition: color 0.1s; text-shadow: 0 0 1px rgba(0,0,0,0.12); }
.flash-topbar { position: absolute; top: 0; left: 0; right: 0; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(255,255,255,0.75), transparent); z-index: 5; }
.flash-topbar .label { color: #1a1a1a; font-weight: 700; font-size: 14px; }
.flash-topbar .controls { display: flex; gap: 8px; }
.flash-indicator { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(26,26,26,0.75); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; z-index: 5; }
.flash-nav { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100; }
.flash-nav-btn { width: 52px; height: 52px; border-radius: 50%; border: none; background: rgba(26,26,26,0.12); color: #1a1a1a; font-size: 22px; font-weight: 800; cursor: pointer; pointer-events: auto; }
.flash-nav-btn:hover { background: rgba(26,26,26,0.22); }
.flash-card-stage { position: relative; z-index: 2; }
.flash-close { background: rgba(26,26,26,0.1); border: none; color: #1a1a1a; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.flash-close:hover { background: rgba(26,26,26,0.2); }
.flash-reset-btn { background: rgba(26,26,26,0.1); border: none; color: #1a1a1a; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
.flash-reset-btn:hover { background: rgba(26,26,26,0.2); }

/* ========== PRINT ========== */
@media print {
  body * { visibility: hidden; }
  #printRoot, #printRoot * { visibility: visible; }
  #printRoot { position: absolute; left: 0; top: 0; width: 100%; }
  .page-frame { box-shadow: none !important; border-radius: 0 !important; page-break-after: always; margin: 0 !important; }
  .page-frame:last-child { page-break-after: auto; }
}

/* ========== RESPONSIVE ========== */
@media (max-width: 800px) {
  .deck-view { flex-direction: column; }
  .page-list-panel { width: 100%; min-width: 0; max-height: 40%; border-right: none; border-bottom: 1px solid #dee2e6; }
  .editor-view { flex-direction: column; }
  .editor-form { width: 100%; min-width: 0; max-height: 60%; border-right: none; border-bottom: 1px solid #dee2e6; }
  .app-header { padding: 8px 12px; }
  .search-wrap { max-width: none; order: 10; width: 100%; }
  .img-manager .img-slot { flex-wrap: wrap; }
}
  </style>
</head>
<body>
  <div id="app"></div>

// Escape HTML
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];

// Sanitize HTML
function sanitizeHTML(html) {
  var d = new DOMParser().parseFromString(String(html || ''), 'text/html');
  var scripts = d.querySelectorAll('script,iframe,object,embed,link,meta,base,form');
  for (var i = 0; i < scripts.length; i++) scripts[i].parentNode.removeChild(scripts[i]);
  var all = d.querySelectorAll('*');
  for (var j = 0; j < all.length; j++) {
    var el = all[j];
    var attrs = el.attributes;
    for (var k = attrs.length - 1; k >= 0; k--) {
      var attr = attrs[k];
      if (attr.name.indexOf('on') === 0 || attr.name === 'srcdoc') el.removeAttribute(attr.name);
    }
  }
  var elems = d.querySelectorAll('[href],[src]');
  for (var l = 0; l < elems.length; l++) {
    var e = elems[l];
    ['href', 'src'].forEach(function(attrName) {
      var val = e.getAttribute(attrName) || '';
      if (/^\s*(javascript:|vbscript:|data:text\/html)/i.test(val)) e.removeAttribute(attrName);
    });
  }
  return d.body.innerHTML;
}

// Sanitize CSS
function sanitizeCSS(css) {
  return String(css || '')
    .replace(/@import\s+[^;]+;?/gi, '')
    .replace(/expression\s*\([^)]*\)/gi, '')
    .replace(/url\s*\(\s*['"]?\s*javascript:[^)]*\)/gi, '');
}

// Scope CSS
function scopeCSS(css, scopeClass) {
  var raw = sanitizeCSS(css);
  var out = '';
  try {
    var chunks = raw.split('}');
    for (var i = 0; i < chunks.length; i++) {
      var t = chunks[i].trim();
      if (!t) continue;
      var brace = t.indexOf('{');
      if (brace === -1) {
        if (t.indexOf('@') === 0) out += t + '}';
        continue;
      }
      var selectors = t.slice(0, brace).trim();
      var body = t.slice(brace + 1).trim();
      if (!selectors) continue;
      var scoped = selectors.split(',').map(function(s) {
        s = s.trim();
        if (!s) return s;
        if (s.indexOf('.' + scopeClass) !== -1) return s;
        return '.' + scopeClass + ' ' + s;
      }).filter(Boolean).join(', ');
      out += scoped + ' { ' + body + ' }\n';
    }
  } catch (e) {
    out = raw;
  }
  return out;
}

// ========== PAGE RENDERER ==========
function renderPageElement(page, opts) {
  opts = opts || {};
  var pageNum = (opts.pageNum == null ? 1 : opts.pageNum);
  var isThumb = !!opts.isThumbnail;

  var frame = document.createElement('div');
  frame.className = 'page-frame';

  var card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = '<div class="cvc-header">' +
    '<div class="cvc-header-left">' +
    '<h1 class="cvc-main-title">' + escapeHtml(page.mainTitle || 'Untitled') + '</h1>' +
    '<div class="cvc-subtitle">' + escapeHtml(page.subtitle || '') + '</div>' +
    '</div>' +
    '<div class="cvc-header-right">' +
    '<span class="lesson-label">LESSON</span>' +
    '<span class="lesson-num">' + pageNum + '</span>' +
    '</div>' +
    '</div>';

  var contentArea = document.createElement('div');
  contentArea.className = 'code-content-area';
  contentArea.style.background = page.contentBackground || '#ffffff';

  var scopeClass = 'scope-' + String(page.id || 'p').replace(/[^a-zA-Z0-9_-]/g, '');
  contentArea.classList.add(scopeClass);

  var style = document.createElement('style');
  style.textContent = scopeCSS(page.css || '', scopeClass);

  var inner = document.createElement('div');
  inner.className = 'code-inner';
  inner.innerHTML = sanitizeHTML(page.html || '');

  contentArea.appendChild(style);
  contentArea.appendChild(inner);
  card.appendChild(contentArea);

  var pn = document.createElement('div');
  pn.className = 'cvc-page-number';
  pn.textContent = pageNum;
  card.appendChild(pn);

  frame.appendChild(card);

  // Execute page JS if present
  if (!isThumb && page.js && page.js.trim()) {
    try {
      var fn = new Function('root', page.js);
      setTimeout(function() {
        try { fn(inner); } catch (e) { console.warn('Page JS error:', e); }
      }, 0);
    } catch (e) {
      console.warn('Page JS compile error:', e);
    }
  }

  return frame;
}

function renderCoverElement(cover) {

}

// ========== PERSISTENCE ==========
var dbPromise = null;

function getDB() {
  if (!dbPromise) {
    dbPromise = new Promise(function (resolve, reject) {
      try {
        if (!window.indexedDB) {
          reject(new Error('IndexedDB unavailable'));
          return;
        }
        var req = window.indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = function (e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error || new Error('IndexedDB open failed')); };
        req.onblocked = function () { reject(new Error('IndexedDB blocked')); };
      } catch (err) {
        reject(err);
      }
    });
  }
  return dbPromise;
}

function persist() {
  var payload = {
    version: 1,
    decks: state.decks,
    currentDeckId: state.currentDeckId,
    theme: state.theme,
    fontScale: state.fontScale,
    history: state.history.slice(0, MAX_HISTORY)
  };
  getDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(payload, 'app');
      tx.oncomplete = resolve;
      tx.onerror = function() { reject(tx.error); };
    });
  }).catch(function(e) {
    try {
      localStorage.setItem(DB_NAME, JSON.stringify(payload));
    } catch (err) {
      showToast('Could not save. Storage full?', 'error');
    }
  });
}

function loadPersisted() {
  return getDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(DB_STORE, 'readonly');
      var req = tx.objectStore(DB_STORE).get('app');
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { reject(req.error); };
    });
  }).catch(function() {
    // Fallback to localStorage
    try {
      var raw = localStorage.getItem(DB_NAME);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  });
}

// ========== HISTORY ==========
function pushHistory(deckId, pageId, name) {
  state.history = state.history.filter(function(h) {
    return !(h.deckId === deckId && h.pageId === pageId);
  });
  state.history.unshift({ deckId: deckId, pageId: pageId, name: name, ts: Date.now() });
  if (state.history.length > MAX_HISTORY) state.history.length = MAX_HISTORY;
  persist();
}

// ========== MAIN RENDER ==========
function applyTheme() {
  var root = document.documentElement;
  if (state.theme === 'dark') {
    root.classList.add('dark');
  } else {
    root.classList.remove('dark');
  }
  root.style.setProperty('--font-scale', state.fontScale);
}

function render() {
  applyTheme();

  // Capture scroll if we are still on the same deck
  if (state.ui.mode === 'deck' && state.currentDeckId === lastRenderedDeckId) {
    var listEl = document.querySelector('.page-list');
    if (listEl) {
      deckScrollMap[state.currentDeckId] = {
        scroll: listEl.scrollTop,
        search: state.searchQuery || ''
      };
    }
  }

  var app = $('#app');
  app.innerHTML = '';

  // Build header
  var header = document.createElement('header');
  header.className = 'app-header';

  var deck = currentDeck();
  var deckOptions = '';
  var deckKeys = Object.keys(state.decks);
  for (var i = 0; i < deckKeys.length; i++) {
    var d = state.decks[deckKeys[i]];
    deckOptions += '<option value="' + d.id + '"' + (d.id === state.currentDeckId ? ' selected' : '') + '>' + escapeHtml(d.deckName) + '</option>';
  }

  header.innerHTML = '<div class="logo" id="logoBtn"><span>📚</span> Slide Studio</div>' +

    '<button class="icon-btn" id="btnFont" title="Font size">🔤</button>';

  header.innerHTML += '</div>';

  if (state.ui.mode === 'library') renderLibrary(main);

  else renderDeckView(main);

  $('#logoBtn').onclick = function() {
    if (state.ui.dirty && !confirm('Discard unsaved changes?')) return;
    captureDeckScroll();
    state.ui.dirty = false;
    state.ui.mode = 'library';
    state.ui.topicsOpen = false;
    state.ui.historyOpen = false;
    lastRenderedDeckId = null;

  };

    var id = e.target.value;
    if (!id) return;
    if (state.ui.dirty && !confirm('Discard unsaved changes?')) {
      e.target.value = state.currentDeckId || '';
      return;
    }
    captureDeckScroll();
    state.ui.dirty = false;

  };

  // Overlay dim
  $('#overlayDim').classList.toggle('active', state.ui.topicsOpen || state.ui.historyOpen);
  $('#overlayDim').onclick = function() {
    state.ui.topicsOpen = false;
    state.ui.historyOpen = false;
    render();
  };

  lastRenderedDeckId = (state.ui.mode === 'deck') ? state.currentDeckId : null;
}

// Helper to capture scroll
function captureDeckScroll() {
  if (state.ui.mode === 'deck' && state.currentDeckId) {
    var listEl = document.querySelector('.page-list');
    if (listEl) {
      deckScrollMap[state.currentDeckId] = {
        scroll: listEl.scrollTop,
        search: state.searchQuery || ''
      };
    }
  }
}

// ========== CURRENT HELPERS ==========
function currentDeck() {
  return state.currentDeckId ? state.decks[state.currentDeckId] : null;
}

function currentPage() {
  var d = currentDeck();
  if (!d || !state.currentPageId) return null;
  for (var i = 0; i < d.pages.length; i++) {
    if (d.pages[i].id === state.currentPageId) return d.pages[i];
  }
  return null;
}

function deckFlashDecks(deck) {
  if (!deck) return [];
  if (!Array.isArray(deck.flashDecks)) deck.flashDecks = [];
  return deck.flashDecks;
}

function currentFlashDeck() {
  var d = currentDeck();
  if (!d || !state.ui.currentFlashDeckId) return null;
  var decks = deckFlashDecks(d);
  for (var i = 0; i < decks.length; i++) {
    if (decks[i].id === state.ui.currentFlashDeckId) return decks[i];
  }
  return null;
}

function filteredPages() {
  var d = currentDeck();
  if (!d) return [];
  var q = (state.searchQuery || '').toLowerCase().trim();
  if (!q) return d.pages;
  return d.pages.filter(function(p) {
    return (p.name || '').toLowerCase().indexOf(q) !== -1 ||
           (p.mainTitle || '').toLowerCase().indexOf(q) !== -1 ||
           (p.subtitle || '').toLowerCase().indexOf(q) !== -1;
  });
}

    '</div>' +
    '<div class="deck-grid" id="deckGrid"></div>';

  $('#libLoad').onclick = function() { $('#fileInput').click(); };

  }

      '<button class="btn btn-danger btn-sm delete">Delete</button>' +

      e.stopPropagation();
      state.currentDeckId = d.id;

// ========== DECK VIEW ==========
function renderDeckView(main) {
  var deck = currentDeck();
  if (!deck) {
    state.ui.mode = 'library';
    render();
    return;
  }

  var view = document.createElement('div');
  view.className = 'deck-view';

  var listPanel = document.createElement('div');
  listPanel.className = 'page-list-panel';
  var pages = filteredPages();
  listPanel.innerHTML = '<div class="page-list-header">' +
    '<span>Pages (' + pages.length + '/' + deck.pages.length + ')</span>' +
    '</div>' +
    '<div class="page-list" id="pageList"></div>';
  view.appendChild(listPanel);

  var list = listPanel.querySelector('#pageList');
  if (!pages.length) {
    list.innerHTML = '<div class="empty-state"><p>No pages match.</p></div>';
  } else {
    pages.forEach(function(p) {
      var item = document.createElement('div');
      item.className = 'page-item' + (p.id === state.currentPageId ? ' active' : '');
      item.innerHTML = '<div class="name">' + escapeHtml(p.name) + '</div>' +
        '<div class="title">' + escapeHtml(p.mainTitle) + '</div>' +
        '<div class="item-actions">' +
        '<button class="btn btn-outline btn-xs edit">✏️</button>' +
        '<button class="btn btn-outline btn-xs dup">📋</button>' +
        '<button class="btn btn-danger btn-xs del">🗑️</button>' +
        '</div>';

      item.onclick = function(e) {
        if (e.target.closest('.item-actions')) return;
        state.currentPageId = p.id;
        pushHistory(deck.id, p.id, p.name);
        render();
      };
      item.querySelector('.edit').onclick = function(e) {
        e.stopPropagation();
        startEditPage(p.id);
      };
      item.querySelector('.dup').onclick = function(e) {
        e.stopPropagation();
        var copy = clone(p);
        copy.id = uid('p');
        copy.name = (copy.name || 'Page') + ' (copy)';
        deck.pages.push(copy);
        deck.updatedAt = Date.now();
        state.currentPageId = copy.id;
        persist();
        render();
        showToast('Page duplicated', 'success');
      };
      item.querySelector('.del').onclick = function(e) {
        e.stopPropagation();
        confirmDialog('Delete "' + p.name + '"?', function() {
          deck.pages = deck.pages.filter(function(x) { return x.id !== p.id; });
          if (state.currentPageId === p.id) {
            state.currentPageId = (deck.pages && deck.pages[0] ? deck.pages[0].id : null);
          }
          deck.updatedAt = Date.now();
          persist();
          render();
          showToast('Page deleted', 'success');
        });
      };
      list.appendChild(item);
    });
  }

  // Restore scroll after DOM update
  var deckId = state.currentDeckId;
  var saved = deckScrollMap[deckId];
  var listScrollEl = view.querySelector('.page-list');
  if (listScrollEl && saved) {
    if (saved.search === state.searchQuery) {
      requestAnimationFrame(function() {
        listScrollEl.scrollTop = saved.scroll;
      });
    } else {
      deckScrollMap[deckId] = { scroll: 0, search: state.searchQuery };
      listScrollEl.scrollTop = 0;
    }
  }

  // Preview panel
  var preview = document.createElement('div');
  preview.className = 'preview-panel';
  var page = currentPage();
  var pageNum = page ? deck.pages.findIndex(function(x) { return x.id === page.id; }) + 1 : 0;

  preview.innerHTML = '<div class="preview-toolbar">' +
    '<span class="info">' + (page ? escapeHtml(page.name) + ' · ' + pageNum + ' / ' + deck.pages.length : 'No page selected') + '</span>' +
    '<button class="btn btn-primary btn-sm" id="btnPresent" ' + (!page ? 'disabled' : '') + '>▶️ Present</button>' +
    '<button class="btn btn-outline btn-sm" id="btnEdit" ' + (!page ? 'disabled' : '') + '>✏️ Edit</button>' +
    '<button class="btn btn-outline btn-sm" id="btnPrintOne" ' + (!page ? 'disabled' : '') + '>🖨️ Page</button>' +
    '<button class="btn btn-success btn-sm" id="btnPrintAll">🖨️ All</button>' +
    '<button class="btn btn-outline btn-sm" id="btnExportDeck">📤 JSON</button>' +
    '</div>' +
    '<div class="preview-scroll" id="previewScroll"></div>';
  view.appendChild(preview);
  main.appendChild(view);

  var scroll = $('#previewScroll');
  if (page) {
    var el = renderPageElement(page, { pageNum: pageNum });
    scroll.appendChild(el);
  } else {
    scroll.innerHTML = '<div class="empty-state"><div class="icon">📄</div><p>Select a page or add one.</p></div>';
  }

  $('#btnPresent').onclick = function() { enterPresent(); };
  $('#btnEdit').onclick = function() { if (page) startEditPage(page.id); };
  $('#btnPrintOne').onclick = function() { if (page) printPages([page], deck, pageNum); };
  $('#btnPrintAll').onclick = function() { printAll(deck); };
  $('#btnExportDeck').onclick = function() { exportDeck(deck); };
}

// ========== CREATE EMPTY DEFAULTS ==========
function createEmptyPage() {
  return {
    id: uid('p'),
    name: 'New Page',
    mainTitle: 'SHORT VOWEL CVC WORDS',
    subtitle: 'SHORT VOWEL',
    html: '<div class="content"><h1>Your content here</h1><p>Edit HTML and CSS in the editor.</p></div>',
    css: '.content{padding:8px}h1{margin:0 0 12px;color:#E2571C;font-size:28px}p{font-size:18px;line-height:1.5}',
    contentBackground: '#ffffff',
    js: ''
  };
}

function createEmptyDeck(name) {
  name = name || 'New Deck';
  return {
    id: uid('deck'),
    deckName: name,
    cover: { title: 'Crystal Phonics', subtitle: 'Grade 1' },
    includeToc: true,
    pages: [createEmptyPage()],
    flashDecks: [],
    updatedAt: Date.now()
  };
}

function createEmptyFlashDeck(name, type) {
  name = name || (type === 'sentences' ? 'New Sentence Deck' : 'New Word Deck');
  type = type === 'sentences' ? 'sentences' : 'words';
  return {
    id: uid('flash'),
    name: name,
    type: type,
    items: []
  };
}

function parseFlashInput(text) {
  var items = [];
  var parts = String(text || '').split(/[\n,]+/);
  for (var i = 0; i < parts.length; i++) {
    var s = parts[i].trim();
    if (s) items.push({ id: uid('item'), text: s });
  }
  return items;
}

// ========== EDITOR ==========
function startNewPage() {
  state.ui.editingPageId = null;
  state.ui.mode = 'edit';
  state.ui.dirty = false;
  render();
}

function startEditPage(pageId) {
  state.ui.editingPageId = pageId;
  state.ui.mode = 'edit';
  state.ui.dirty = false;
  render();
}

function renderEditor(main) {
  var deck = currentDeck();
  if (!deck) {
    state.ui.mode = 'library';
    render();
    return;
  }

  var isNew = !state.ui.editingPageId;
  var page = isNew ? createEmptyPage() : clone(deck.pages.find(function(p) { return p.id === state.ui.editingPageId; }) || createEmptyPage());

  var view = document.createElement('div');
  view.className = 'editor-view';

  var form = document.createElement('div');
  form.className = 'editor-form';
  form.innerHTML = '<h2>' + (isNew ? '➕ New Page' : '✏️ Edit Page') + '</h2>' +
    '<div class="form-group"><label>Page Name (list / search)</label><input id="fName" value="' + escapeHtml(page.name) + '" /></div>' +
    '<div class="form-group"><label>Main Title (header)</label><input id="fMainTitle" value="' + escapeHtml(page.mainTitle) + '" /></div>' +
    '<div class="form-group"><label>Subtitle (header)</label><input id="fSubtitle" value="' + escapeHtml(page.subtitle) + '" /></div>' +
    '<div class="form-group"><label>Content Background</label><input id="fBg" type="color" value="' + (page.contentBackground || '#ffffff') + '" style="height:36px;padding:2px;width:80px;" /></div>' +
    '<div class="form-group"><label>HTML</label><textarea id="fHtml" class="code" rows="8">' + escapeHtml(page.html) + '</textarea></div>' +
    '<div class="form-group"><label>CSS (scoped to content)</label><textarea id="fCss" class="code" rows="5">' + escapeHtml(page.css) + '</textarea></div>' +
    '<div class="form-group"><label>JS (optional, scoped — receives <code>root</code>)</label><textarea id="fJs" class="code" rows="3" placeholder="// root.querySelectorAll(\'span\').forEach(...)">' + escapeHtml(page.js || '') + '</textarea></div>' +
    '<div class="form-group"><div class="img-manager" id="imageManager"><div class="img-manager-title">🖼️ Image Manager</div><div id="imageManagerSlots"></div></div></div>' +
    '<div class="editor-actions">' +
    '<button class="btn btn-primary" id="btnSave">💾 Save</button>' +
    '<button class="btn btn-outline" id="btnCancel">Cancel</button>' +
    '<button class="btn btn-success" id="btnSavePresent">💾 + Present</button>' +
    '</div>';
  view.appendChild(form);

  var prevWrap = document.createElement('div');
  prevWrap.className = 'editor-preview-wrap';
  prevWrap.innerHTML = '<div class="label">Live Preview</div><div class="thumb-box" id="editorThumb"></div>';
  view.appendChild(prevWrap);
  main.appendChild(view);

  function gather() {
    return {
      id: isNew ? uid('p') : page.id,
      name: ($('#fName').value || '').trim() || 'Page',
      mainTitle: ($('#fMainTitle').value || '').trim() || 'Untitled',
      subtitle: ($('#fSubtitle').value || '').trim(),
      html: $('#fHtml').value || '',
      css: $('#fCss').value || '',
      contentBackground: $('#fBg').value || '#ffffff',
      js: $('#fJs').value || ''
    };
  }

  function refreshThumb() {
    var data = gather();
    var box = $('#editorThumb');
    box.innerHTML = '';
    var el = renderPageElement(data, { pageNum: 1, isThumbnail: true });
    box.appendChild(el);
  }

  // Image Manager
  function rebuildImageManager() {
    var slots = $('#imageManagerSlots');
    var html = $('#fHtml').value || '';
    var doc;
    try {
      doc = new DOMParser().parseFromString(html, 'text/html');
    } catch (e) {
      doc = document.implementation.createHTMLDocument('');
    }
    var imgs = doc.querySelectorAll('img');
    if (!imgs.length) {
      slots.innerHTML = '<div class="empty-img-note">No &lt;img&gt; tags found in HTML. Add one to enable image management.</div>';
      return;
    }

    var htmlOut = '';
    for (var i = 0; i < imgs.length; i++) {
      (function(idx) {
        var img = imgs[idx];
        var src = img.getAttribute('src') || '';
        var alt = img.getAttribute('alt') || ('Image ' + (idx + 1));
        var previewSrc = src && src.indexOf('data:') !== 0 && src.indexOf('http') !== 0 && src.indexOf('/') !== 0
          ? 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23eee"/><text x="50" y="55" text-anchor="middle" font-family="sans-serif" font-size="12" fill="%23999">No preview</text></svg>'
          : (src || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23f5f5f5"/><text x="50" y="55" text-anchor="middle" font-family="sans-serif" font-size="18" fill="%23ccc">?</text></svg>');

        htmlOut += '<div class="img-slot" data-index="' + idx + '">' +
          '<img class="thumb" src="' + escapeHtml(previewSrc) + '" alt="' + escapeHtml(alt) + '" />' +
          '<div class="info"><strong>' + escapeHtml(alt) + '</strong> <span style="font-size:10px;color:var(--muted);">' + (src ? 'has image' : 'empty') + '</span></div>' +
          '<div class="img-actions">' +
          '<div class="file-input-wrap"><button class="btn btn-primary btn-xs">Upload</button><input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/gif" data-index="' + idx + '" /></div>' +
          '<button class="btn btn-outline btn-xs img-clear" data-index="' + idx + '">✕</button>' +
          '</div></div>';
      })(i);
    }
    slots.innerHTML = htmlOut;

    // Wire upload events
    var fileInputs = slots.querySelectorAll('input[type="file"]');
    for (var j = 0; j < fileInputs.length; j++) {
      (function(input) {
        var idx = parseInt(input.getAttribute('data-index'), 10);
        input.addEventListener('change', function(e) {
          var file = this.files && this.files[0];
          if (!file) return;
          if (file.size > 3 * 1024 * 1024) {
            showToast('Image too large (max 3 MB)', 'error');
            this.value = '';
            return;
          }
          var reader = new FileReader();
          reader.onload = function(ev) {
            var dataUrl = ev.target.result;
            var currentHtml = $('#fHtml').value || '';
            var doc2;
            try {
              doc2 = new DOMParser().parseFromString(currentHtml, 'text/html');
            } catch (e) {
              doc2 = document.implementation.createHTMLDocument('');
            }
            var imgs2 = doc2.querySelectorAll('img');
            if (imgs2[idx]) {
              imgs2[idx].setAttribute('src', dataUrl);
              if (!imgs2[idx].getAttribute('alt') || imgs2[idx].getAttribute('alt') === '') {
                imgs2[idx].setAttribute('alt', file.name.replace(/\.[^.]+$/, ''));
              }
              $('#fHtml').value = doc2.body.innerHTML;
              state.ui.dirty = true;
              refreshThumb();
              rebuildImageManager();
              showToast('Image uploaded', 'success');
            }
          };
          reader.onerror = function() { showToast('Failed to read image', 'error'); };
          reader.readAsDataURL(file);
          this.value = '';
        });
      })(fileInputs[j]);
    }

    // Wire clear events
    var clearBtns = slots.querySelectorAll('.img-clear');
    for (var k = 0; k < clearBtns.length; k++) {
      (function(btn) {
        var idx = parseInt(btn.getAttribute('data-index'), 10);
        btn.addEventListener('click', function() {
          var currentHtml = $('#fHtml').value || '';
          var doc2;
          try {
            doc2 = new DOMParser().parseFromString(currentHtml, 'text/html');
          } catch (e) {
            doc2 = document.implementation.createHTMLDocument('');
          }
          var imgs2 = doc2.querySelectorAll('img');
          if (imgs2[idx]) {
            imgs2[idx].setAttribute('src', '');
            $('#fHtml').value = doc2.body.innerHTML;
            state.ui.dirty = true;
            refreshThumb();
            rebuildImageManager();
            showToast('Image cleared', 'info');
          }
        });
      })(clearBtns[k]);
    }
  }

  // Wire input events
  var inputIds = ['fName', 'fMainTitle', 'fSubtitle', 'fHtml', 'fCss', 'fBg', 'fJs'];
  for (var m = 0; m < inputIds.length; m++) {
    (function(id) {
      var el = $('#' + id);
      el.addEventListener('input', function() {
        state.ui.dirty = true;
        if (id === 'fHtml') rebuildImageManager();
        refreshThumb();
      });
    })(inputIds[m]);
  }

  refreshThumb();
  rebuildImageManager();

  $('#btnSave').onclick = function() {
    var data = gather();
    if (isNew) {
      deck.pages.push(data);
    } else {
      var idx = deck.pages.findIndex(function(p) { return p.id === data.id; });
      if (idx >= 0) deck.pages[idx] = data;
    }
    deck.updatedAt = Date.now();
    state.currentPageId = data.id;
    state.ui.dirty = false;
    state.ui.mode = 'deck';
    persist();
    render();
    showToast('Page saved', 'success');
  };

  $('#btnCancel').onclick = function() {
    if (state.ui.dirty && !confirm('Discard unsaved changes?')) return;
    state.ui.dirty = false;
    state.ui.mode = 'deck';
    render();
  };

  $('#btnSavePresent').onclick = function() {
    $('#btnSave').click();
    setTimeout(function() { enterPresent(); }, 50);
  };
}

// ========== FLASH MANAGER ==========
function renderFlashManager(main) {
  try {
    var deck = currentDeck();
    if (!deck) {
      state.ui.mode = 'library';
      render();
      return;
    }

    if (!Array.isArray(deck.flashDecks)) {
      deck.flashDecks = [];
    }
    var flashDecks = deck.flashDecks;

    if (state.ui.currentFlashDeckId && !flashDecks.some(function(f) { return f.id === state.ui.currentFlashDeckId; })) {
      state.ui.currentFlashDeckId = null;
    }
    if (!state.ui.currentFlashDeckId && flashDecks.length) {
      state.ui.currentFlashDeckId = flashDecks[0].id;
    }

    var view = document.createElement('div');
    view.className = 'flash-view';

    var listPanel = document.createElement('div');
    listPanel.className = 'flash-deck-list-panel';
    listPanel.innerHTML = '<div class="page-list-header"><span>Flash Decks (' + flashDecks.length + ')</span></div>' +
      '<div style="padding:10px;display:flex;gap:6px;border-bottom:1px solid #dee2e6;">' +
      '<button class="btn btn-primary btn-sm" id="btnNewWordDeck" style="flex:1;">➕ Words</button>' +
      '<button class="btn btn-success btn-sm" id="btnNewSentenceDeck" style="flex:1;">➕ Sentences</button>' +
      '</div>' +
      '<div class="flash-deck-list" id="flashDeckList"></div>';
    view.appendChild(listPanel);

    var listEl = listPanel.querySelector('#flashDeckList');
    if (!flashDecks.length) {
      listEl.innerHTML = '<div class="empty-state"><div class="icon">🎬</div><p>No flash decks yet.</p></div>';
    } else {
      flashDecks.forEach(function(fd) {
        var item = document.createElement('div');
        item.className = 'flash-deck-item' + (fd.id === state.ui.currentFlashDeckId ? ' active' : '');
        item.innerHTML = '<div class="name"><span class="flash-type-badge">' + (fd.type === 'sentences' ? 'Sentences' : 'Words') + '</span>' + escapeHtml(fd.name) + '</div>' +
          '<div class="meta">' + (fd.items ? fd.items.length : 0) + ' item(s)</div>';
        item.onclick = function() {
          state.ui.currentFlashDeckId = fd.id;
          render();
        };
        listEl.appendChild(item);
      });
    }

    // Wire new deck buttons
    var btnWord = document.getElementById('btnNewWordDeck');
    if (btnWord) btnWord.onclick = function() {
      var newFd = createEmptyFlashDeck(null, 'words');
      flashDecks.push(newFd);
      deck.updatedAt = Date.now();
      state.ui.currentFlashDeckId = newFd.id;
      persist();
      render();
    };

    var btnSentence = document.getElementById('btnNewSentenceDeck');
    if (btnSentence) btnSentence.onclick = function() {
      var newFd = createEmptyFlashDeck(null, 'sentences');
      flashDecks.push(newFd);
      deck.updatedAt = Date.now();
      state.ui.currentFlashDeckId = newFd.id;
      persist();
      render();
    };

    var editorPanel = document.createElement('div');
    editorPanel.className = 'flash-editor-panel';
    var fd = currentFlashDeck();

    if (!fd) {
      editorPanel.innerHTML = '<div class="empty-state"><div class="icon">👈</div><p>Select or create a flash deck.</p></div>';
    } else {
      editorPanel.innerHTML = '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;">' +
        '<input id="flashName" value="' + escapeHtml(fd.name) + '" style="flex:1;min-width:200px;padding:8px 10px;border:2px solid #dee2e6;border-radius:8px;font-size:15px;font-weight:700;background:#fff;color:#1a1a1a;" />' +
        '<span class="flash-type-badge">' + (fd.type === 'sentences' ? 'Sentences' : 'Words') + '</span>' +
        '<button class="btn btn-primary btn-sm" id="btnPresentFlash" ' + (!fd.items || !fd.items.length ? 'disabled' : '') + '>▶️ Present</button>' +
        '<button class="btn btn-outline btn-sm" id="btnDupFlash">📋 Duplicate</button>' +
        '<button class="btn btn-danger btn-sm" id="btnDelFlash">🗑️ Delete</button>' +
        '</div>' +
        '<div class="form-group"><label>Add ' + (fd.type === 'sentences' ? 'sentences' : 'words') + ' — separate with commas or new lines</label>' +
        '<textarea id="flashBulkInput" class="code" rows="4"></textarea>' +
        '<div style="margin-top:8px;"><button class="btn btn-success btn-sm" id="btnParseAdd">Parse &amp; Add</button></div></div>' +
        '<div class="form-group"><label>Sequence (' + (fd.items ? fd.items.length : 0) + ') — this is the presentation order</label>' +
        '<div class="flash-items-wrap" id="flashItemsWrap"></div></div>';
    }
    view.appendChild(editorPanel);
    main.appendChild(view);

    if (fd) {
      // Wire up events with null checks
      var nameInput = document.getElementById('flashName');
      if (nameInput) nameInput.onchange = function(e) {
        fd.name = (e.target.value || '').trim() || fd.name;
        deck.updatedAt = Date.now();
        persist();
        render();
      };

      var presentBtn = document.getElementById('btnPresentFlash');
      if (presentBtn) presentBtn.onclick = function() {
        var currentFd = currentFlashDeck();
        if (currentFd && currentFd.items && currentFd.items.length > 0) {
          enterFlashPresent(currentFd);
        } else {
          showToast('No items in this flash deck', 'warning');
        }
      };

      var dupBtn = document.getElementById('btnDupFlash');
      if (dupBtn) dupBtn.onclick = function() {
        var copy = clone(fd);
        copy.id = uid('flash');
        copy.name = fd.name + ' (copy)';
        flashDecks.push(copy);
        deck.updatedAt = Date.now();
        state.ui.currentFlashDeckId = copy.id;
        persist();
        render();
        showToast('Flash deck duplicated', 'success');
      };

      var delBtn = document.getElementById('btnDelFlash');
      if (delBtn) delBtn.onclick = function() {
        confirmDialog('Delete flash deck "' + fd.name + '"?', function() {
          deck.flashDecks = flashDecks.filter(function(x) { return x.id !== fd.id; });
          state.ui.currentFlashDeckId = (deck.flashDecks && deck.flashDecks[0] ? deck.flashDecks[0].id : null) || null;
          deck.updatedAt = Date.now();
          persist();
          render();
          showToast('Flash deck deleted', 'success');
        });
      };

      var parseBtn = document.getElementById('btnParseAdd');
      if (parseBtn) parseBtn.onclick = function() {
        var raw = document.getElementById('flashBulkInput').value;
        var newItems = parseFlashInput(raw);
        if (!newItems.length) {
          showToast('Nothing to add', 'warning');
          return;
        }
        if (!fd.items) fd.items = [];
        fd.items.push.apply(fd.items, newItems);
        deck.updatedAt = Date.now();
        persist();
        render();
        showToast('Added ' + newItems.length + ' item(s)', 'success');
      };

      var itemsWrap = document.getElementById('flashItemsWrap');
      if (itemsWrap) {
        if (!fd.items || !fd.items.length) {
          itemsWrap.innerHTML = '<div class="empty-state" style="padding:24px;"><p>No items yet. Add some above.</p></div>';
        } else {
          fd.items.forEach(function(it, i) {
            var chip = document.createElement('div');
            chip.className = 'flash-item-chip';
            chip.innerHTML = '<button class="btn btn-outline btn-xs up" title="Move earlier" ' + (i === 0 ? 'disabled' : '') + '>↑</button>' +
              '<button class="btn btn-outline btn-xs down" title="Move later" ' + (i === fd.items.length - 1 ? 'disabled' : '') + '>↓</button>' +
              '<span class="txt">' + escapeHtml(it.text) + '</span>' +
              '<button class="del" title="Remove">✕</button>';

            chip.querySelector('.up').onclick = function() {
              if (i === 0) return;
              var tmp = fd.items[i - 1];
              fd.items[i - 1] = fd.items[i];
              fd.items[i] = tmp;
              deck.updatedAt = Date.now();
              persist();
              render();
            };
            chip.querySelector('.down').onclick = function() {
              if (i === fd.items.length - 1) return;
              var tmp = fd.items[i + 1];
              fd.items[i + 1] = fd.items[i];
              fd.items[i] = tmp;
              deck.updatedAt = Date.now();
              persist();
              render();
            };
            chip.querySelector('.del').onclick = function() {
              fd.items.splice(i, 1);
              deck.updatedAt = Date.now();
              persist();
              render();
            };
            chip.querySelector('.txt').onclick = function() {
              var val = prompt('Edit text:', it.text);
              if (val !== null && val.trim()) {
                it.text = val.trim();
                deck.updatedAt = Date.now();
                persist();
                render();
              }
            };
            itemsWrap.appendChild(chip);
          });
        }
      }
    }

  } catch (e) {
    console.error('Error in renderFlashManager:', e);
    showToast('Error rendering Flash Manager: ' + e.message, 'error');
  }
}

//========== EXPORT ==========
function exportDeck(deck) {
  var payload = {
    version: 1,
    deckName: deck.deckName,
    cover: deck.cover,
    includeToc: deck.includeToc,
    pages: deck.pages,
    flashDecks: deck.flashDecks || []
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (deck.deckName || 'deck').replace(/\s+/g, '_') + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('JSON exported', 'success');
}


// ========== SIDE PANELS ==========

  var tBody = $('#topicsBody');
  if (!deck) {
    tBody.innerHTML = '<p style="color:var(--muted);font-size:13px;">Open a deck first.</p>';
  } else {
    deck.pages.forEach(function(p) {
      var item = document.createElement('div');
      item.className = 'side-item';
      item.innerHTML = '<strong>' + escapeHtml(p.name) + '</strong><div style="font-size:12px;color:var(--muted)">' + escapeHtml(p.mainTitle) + '</div>';
      item.onclick = function() {
        state.currentPageId = p.id;
        state.ui.mode = 'deck';
        state.ui.topicsOpen = false;
        pushHistory(deck.id, p.id, p.name);
        render();
      };
      tBody.appendChild(item);
    });
  }

  var hist = document.createElement('div');
  hist.className = 'side-panel right' + (state.ui.historyOpen ? ' active' : '');
  hist.innerHTML = '<div class="side-panel-header"><span>🕒 History</span>' +
    '<button class="btn btn-outline btn-xs" id="closeHist">✕</button></div>' +
    '<div class="side-panel-body" id="histBody"></div>';
  document.body.appendChild(hist);
  $('#closeHist').onclick = function() { state.ui.historyOpen = false; render(); };

  var hBody = $('#histBody');
  if (!state.history.length) {
    hBody.innerHTML = '<p style="color:var(--muted);font-size:13px;">No history yet.</p>';
  } else {
    state.history.forEach(function(h) {
      var item = document.createElement('div');
      item.className = 'side-item';
      var d = state.decks[h.deckId];
      item.innerHTML = '<strong>' + escapeHtml(h.name) + '</strong>' +
        '<div style="font-size:12px;color:var(--muted)">' + escapeHtml((d && d.deckName) || 'Deck') + ' · ' + new Date(h.ts).toLocaleString() + '</div>';
      item.onclick = function() {
        if (!state.decks[h.deckId]) {
          showToast('Deck no longer available', 'warning');
          return;
        }
        state.currentDeckId = h.deckId;
        state.currentPageId = h.pageId;
        state.ui.mode = 'deck';
        state.ui.historyOpen = false;
        render();
      };
      hBody.appendChild(item);
    });
  }
}

// ========== PRINT ==========
function getPrintStyles() {
  var styles = (document.querySelector('style') && document.querySelector('style').outerHTML) || '';
  return styles + '<style>' +
    'html, body { height: auto !important; min-height: 0 !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; background: #ffffff !important; color: #1a1a1a !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }' +
    'body * { visibility: visible !important; }' +
    '.page-frame { box-shadow: none !important; border-radius: 0 !important; margin: 0 auto !important; page-break-after: always; page-break-inside: avoid; break-after: page; break-inside: avoid; width: ' + PAGE_W + 'px !important; min-width: ' + PAGE_W + 'px !important; height: ' + PAGE_H + 'px !important; min-height: ' + PAGE_H + 'px !important; max-height: ' + PAGE_H + 'px !important; overflow: hidden !important; background: #fff !important; }' +
    '.page-frame:last-child { page-break-after: auto; break-after: auto; }' +
    '.card, .cover-card, .toc-card { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }' +
    '@page { size: ' + PAGE_W + 'px ' + PAGE_H + 'px; margin: 0; }' +
    '</style>';
}

function openPrintWindow(title, htmlContent) {
  var root = $('#printRoot');
  if (root) {
    try {
      root.innerHTML = htmlContent;
      root.classList.remove('hidden');
      setTimeout(function() {
        try { window.print(); } catch (e) {}
      }, 60);
      setTimeout(function() {
        root.classList.add('hidden');
        root.innerHTML = '';
      }, 1500);
      return;
    } catch (e) {}
  }

  var win = window.open('', '_blank');
  if (!win) {
    showToast('Printing is unavailable because the browser blocked the print window.', 'warning');
    return;
  }
  try {
    win.document.open();
    win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + escapeHtml(title || 'Print') + '</title>' + getPrintStyles() + '</head><body>' + htmlContent + '</body></html>');
    win.document.close();
    setTimeout(function() {
      try { win.focus(); win.print(); } catch (e) {}
    }, 350);
  } catch (e) {
    showToast('Print failed', 'error');
  }
}

function printPages(pages, deck, startNum) {
  startNum = startNum || 1;
  var root = $('#printRoot');
  root.innerHTML = '';
  root.classList.remove('hidden');
  pages.forEach(function(p, i) {
    root.appendChild(renderPageElement(p, { pageNum: startNum + i }));
  });

  var htmlContent = root.innerHTML;
  root.classList.add('hidden');
  root.innerHTML = '';

  openPrintWindow('Print Page', htmlContent);
}

function printAll(deck) {
  var html = '';
  var coverEl = renderCoverElement(deck.cover);
  html += coverEl.outerHTML;

  if (deck.includeToc && deck.pages.length) {
    var tocFrame = document.createElement('div');
    tocFrame.className = 'page-frame';
    var entries = deck.pages.map(function(p, i) {
      return '<li class="toc-item"><span>' + escapeHtml(p.name) + '</span><span class="toc-page-num">Page ' + (i + 1) + '</span></li>';
    }).join('');
    tocFrame.innerHTML = '<div class="toc-card"><div class="toc-title">Table of Contents</div><ul class="toc-list">' + entries + '</ul></div>';
    html += tocFrame.outerHTML;
  }

  deck.pages.forEach(function(p, i) {
    var el = renderPageElement(p, { pageNum: i + 1 });
    html += el.outerHTML;
  });

  openPrintWindow((deck.deckName || 'Deck') + ' — Print', html);
}

// ========== NORMALIZE IMPORT ==========
function normalizeImported(raw) {
  var pages = [];
  var deckName = 'Imported Deck';
  var cover = { title: 'Crystal Phonics', subtitle: 'Grade 1' };
  var includeToc = true;

  if (Array.isArray(raw.pages)) {
    pages = raw.pages;
    if (raw.deckName) deckName = String(raw.deckName);
    else if (raw.coverData && raw.coverData.title) deckName = String(raw.coverData.title);
    if (raw.cover) cover = { title: String(raw.cover.title || cover.title), subtitle: String(raw.cover.subtitle || '') };
    else if (raw.coverData) cover = { title: String(raw.coverData.title || cover.title), subtitle: String(raw.coverData.subtitle || '') };
    if (raw.includeToc !== undefined) includeToc = !!raw.includeToc;
  } else if (Array.isArray(raw)) {
    pages = raw;
  } else {
    throw new Error('Unrecognized JSON structure');
  }

  var safePages = pages.slice(0, 200).map(function(p) {
    var id = p.id && typeof p.id === 'string' ? p.id : uid('p');
    if (p.type === 'structured' && Array.isArray(p.sections)) {
      return {
        id: id,
        name: String(p.name || p.mainTitle || 'Structured Page'),
        mainTitle: String(p.mainTitle || 'Untitled'),
        subtitle: String(p.subtitle || ''),
        html: '<div class="content"><p><em>Imported structured page — re-create in editor or export as code page from Publisher.</em></p><pre style="font-size:12px;white-space:pre-wrap;">' + escapeHtml(JSON.stringify((p.sections ? p.sections.map(function(s) { return s.type; }) : []), null, 0)) + '</pre></div>',
        css: '.content{padding:8px}em{color:#666}',
        contentBackground: '#ffffff',
        js: ''
      };
    }
    return {
      id: id,
      name: String(p.name || p.mainTitle || 'Page'),
      mainTitle: String(p.mainTitle || 'Untitled'),
      subtitle: String(p.subtitle || ''),
      html: String(p.html || ''),
      css: String(p.css || ''),
      contentBackground: String(p.contentBackground || p.background || '#ffffff'),
      js: String(p.js || '')
    };
  });

  var safeFlashDecks = Array.isArray(raw.flashDecks) ? raw.flashDecks.slice(0, 100).map(function(fd) {
    var items = Array.isArray(fd.items) ? fd.items.slice(0, 500).map(function(it) {
      return {
        id: it.id && typeof it.id === 'string' ? it.id : uid('item'),
        text: String(it.text || '').trim()
      };
    }).filter(function(it) { return it.text; }) : [];
    return {
      id: fd.id && typeof fd.id === 'string' ? fd.id : uid('flash'),
      name: String(fd.name || 'Flash Deck'),
      type: fd.type === 'sentences' ? 'sentences' : 'words',
      items: items
    };
  }) : [];

  return {
    id: uid('deck'),
    deckName: deckName,
    cover: cover,
    includeToc: includeToc,
    pages: safePages.length ? safePages : [createEmptyPage()],
    flashDecks: safeFlashDecks,
    updatedAt: Date.now()
  };
}

// ========== FILE INPUT ==========
$('#fileInput').addEventListener('change', function(e) {
  var file = (e.target.files && e.target.files[0]);
  e.target.value = '';
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) {
    showToast('File too large (max 15 MB)', 'error');
    return;
  }
  var reader = new FileReader();
  reader.onload = function() {
    try {
      var raw = JSON.parse(reader.result);
      var deck = normalizeImported(raw);
      state.decks[deck.id] = deck;
      state.currentDeckId = deck.id;
      state.currentPageId = (deck.pages && deck.pages[0] ? deck.pages[0].id : null);
      state.ui.mode = 'deck';
      state.searchQuery = '';
      persist();
      render();
      showToast('Loaded "' + deck.deckName + '" (' + deck.pages.length + ' pages)', 'success');
    } catch (err) {
      console.error(err);
      showToast('Invalid JSON: ' + (err.message || 'parse error'), 'error');
    }
  };
  reader.onerror = function() { showToast('Could not read file', 'error'); };
  reader.readAsText(file);
});

// ========== PRESENTATION ==========
function enterPresent() {
  var deck = currentDeck();
  var page = currentPage();
  if (!deck || !page) return;
  state.ui.mode = 'present';
  showPresentUI();
}

function showPresentUI() {
  var overlay = $('#presentOverlay');
  var deck = currentDeck();
  if (!deck) return;

  var idx = Math.max(0, deck.pages.findIndex(function(p) { return p.id === state.currentPageId; }));

  function paint() {
    var page = deck.pages[idx];
    if (!page) return;
    state.currentPageId = page.id;
    overlay.innerHTML = '';
    overlay.classList.add('active');

    var stage = document.createElement('div');
    stage.className = 'present-stage';
    var el = renderPageElement(page, { pageNum: idx + 1 });
    var scale = Math.min(
      (window.innerWidth - 24) / PAGE_W,
      (window.innerHeight - 24) / PAGE_H,
      1
    );
    el.style.transform = 'scale(' + scale + ')';
    el.style.transformOrigin = 'center center';
    stage.appendChild(el);
    overlay.appendChild(stage);

    var nav = document.createElement('div');
    nav.className = 'present-nav';
    var navDisabled = deck.pages.length < 2;
    nav.innerHTML = '<div class="nav-cluster left" ' + (navDisabled ? 'style="display:none;"' : '') + '>' +
      '<button class="present-nav-btn" id="navPrevL" title="Previous">‹</button>' +
      '<button class="present-nav-btn" id="navNextL" title="Next">›</button>' +
      '</div>' +
      '<div class="nav-cluster right" ' + (navDisabled ? 'style="display:none;"' : '') + '>' +
      '<button class="present-nav-btn" id="navPrevR" title="Previous">‹</button>' +
      '<button class="present-nav-btn" id="navNextR" title="Next">›</button>' +
      '</div>';
    overlay.appendChild(nav);
    var goNext = function() { idx = (idx + 1) % deck.pages.length; paint(); };
    var goPrev = function() { idx = (idx - 1 + deck.pages.length) % deck.pages.length; paint(); };
    $('#navNextL').onclick = goNext;
    $('#navNextR').onclick = goNext;
    $('#navPrevL').onclick = goPrev;
    $('#navPrevR').onclick = goPrev;

    var top = document.createElement('div');
    top.className = 'present-topbar';
    top.innerHTML = '<span style="color:#fff;font-weight:700;font-size:14px;">' + escapeHtml(page.name) + '</span>' +
      '<button class="present-close" id="presentClose">✕</button>';
    overlay.appendChild(top);
    $('#presentClose').onclick = exitPresent;

    var ind = document.createElement('div');
    ind.className = 'present-indicator';
    ind.textContent = (idx + 1) + ' / ' + deck.pages.length;
    overlay.appendChild(ind);
  }

  paint();

  function onKey(e) {
    if (e.key === 'Escape') { exitPresent(); return; }
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault();
      idx = (idx + 1) % deck.pages.length;
      paint();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      idx = (idx - 1 + deck.pages.length) % deck.pages.length;
      paint();
    }
  }
  window.__presentKeyHandler = onKey;
  window.addEventListener('keydown', onKey);
}

function exitPresent() {
  $('#presentOverlay').classList.remove('active');
  $('#presentOverlay').innerHTML = '';
  if (window.__presentKeyHandler) {
    window.removeEventListener('keydown', window.__presentKeyHandler);
    window.__presentKeyHandler = null;
  }
  state.ui.mode = 'deck';
  persist();
  render();
}

// ========== FLASH PRESENTATION ==========
function enterFlashPresent(flashDeck) {
  console.log('enterFlashPresent called', flashDeck);
  if (!flashDeck || !flashDeck.items.length) return;
  showFlashPresentUI(flashDeck);
}

function showFlashPresentUI(flashDeck) {
  var overlay = $('#flashOverlay');
  var idx = 0;
  var colorMap = {};

  function getColorIdx(itemId, tokenIdx) {
    return (colorMap[itemId] && colorMap[itemId][tokenIdx] ? colorMap[itemId][tokenIdx] : 0);
  }
  function cycleColor(itemId, tokenIdx) {
    if (!colorMap[itemId]) colorMap[itemId] = {};
    var cur = colorMap[itemId][tokenIdx] || 0;
    colorMap[itemId][tokenIdx] = (cur + 1) % FLASH_COLORS.length;
    paint();
  }
  function resetColors() {
    Object.keys(colorMap).forEach(function(k) { delete colorMap[k]; });
    paint();
  }

  function paint() {
    var item = flashDeck.items[idx];
    if (!item) return;
    overlay.innerHTML = '';
    overlay.className = 'flash-overlay active theme-' + flashDeck.type;

    var stage = document.createElement('div');
    stage.className = 'flash-card-stage';

    if (flashDeck.type === 'sentences') {
      var wrap = document.createElement('div');
      wrap.className = 'flash-sentence-display';
      var words = item.text.split(/\s+/).filter(Boolean);
      words.forEach(function(w, ti) {
        var span = document.createElement('span');
        span.className = 'flash-word-token';
        span.textContent = w;
        span.style.color = FLASH_COLORS[getColorIdx(item.id, ti)];
        span.onclick = function() { cycleColor(item.id, ti); };
        wrap.appendChild(span);
      });
      stage.appendChild(wrap);
    } else {
      var wrap2 = document.createElement('div');
      wrap2.className = 'flash-word-display';
      var letters = item.text.split('');
      letters.forEach(function(ch, ti) {
        var span = document.createElement('span');
        span.className = 'flash-letter';
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        span.style.color = FLASH_COLORS[getColorIdx(item.id, ti)];
        span.onclick = function() { if (ch.trim()) cycleColor(item.id, ti); };
        wrap2.appendChild(span);
      });
      stage.appendChild(wrap2);
    }
    overlay.appendChild(stage);

    var nav = document.createElement('div');
    nav.className = 'flash-nav';
    var navDisabled = flashDeck.items.length < 2;
    nav.innerHTML = '<div class="nav-cluster left" ' + (navDisabled ? 'style="display:none;"' : '') + '>' +
      '<button class="flash-nav-btn" id="flashPrevL" title="Previous">‹</button>' +
      '<button class="flash-nav-btn" id="flashNextL" title="Next">›</button>' +
      '</div>' +
      '<div class="nav-cluster right" ' + (navDisabled ? 'style="display:none;"' : '') + '>' +
      '<button class="flash-nav-btn" id="flashPrevR" title="Previous">‹</button>' +
      '<button class="flash-nav-btn" id="flashNextR" title="Next">›</button>' +
      '</div>';
    overlay.appendChild(nav);
    var flashGoNext = function() { idx = (idx + 1) % flashDeck.items.length; paint(); };
    var flashGoPrev = function() { idx = (idx - 1 + flashDeck.items.length) % flashDeck.items.length; paint(); };
    $('#flashNextL').onclick = flashGoNext;
    $('#flashNextR').onclick = flashGoNext;
    $('#flashPrevL').onclick = flashGoPrev;
    $('#flashPrevR').onclick = flashGoPrev;

    var top = document.createElement('div');
    top.className = 'flash-topbar';
    top.innerHTML = '<span class="label">' + escapeHtml(flashDeck.name) + '</span>' +
      '<div class="controls">' +
      '<button class="flash-reset-btn" id="flashReset">↺ Reset all colors</button>' +
      '<button class="flash-close" id="flashClose">✕</button>' +
      '</div>';
    overlay.appendChild(top);
    $('#flashReset').onclick = resetColors;
    $('#flashClose').onclick = exitFlashPresent;

    var ind = document.createElement('div');
    ind.className = 'flash-indicator';
    ind.textContent = (idx + 1) + ' / ' + flashDeck.items.length;
    overlay.appendChild(ind);
  }

  paint();

  function onKey(e) {
    if (e.key === 'Escape') { exitFlashPresent(); return; }
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault();
      idx = (idx + 1) % flashDeck.items.length;
      paint();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      idx = (idx - 1 + flashDeck.items.length) % flashDeck.items.length;
      paint();
    } else if (e.key === 'r' || e.key === 'R') {
      resetColors();
    }
  }
  window.__flashPresentKeyHandler = onKey;
  window.addEventListener('keydown', onKey);
}

function exitFlashPresent() {
  var overlay = $('#flashOverlay');
  overlay.classList.remove('active');
  overlay.innerHTML = '';
  if (window.__flashPresentKeyHandler) {
    window.removeEventListener('keydown', window.__flashPresentKeyHandler);
    window.__flashPresentKeyHandler = null;
  }
}

// Replace the async init above with this:
// ========== INIT ==========
function init() {
  render();

  loadPersisted().then(function(data) {
    if (data && data.decks) {
      state.decks = data.decks;
      state.currentDeckId = data.currentDeckId || null;
      state.theme = data.theme || 'light';
      state.fontScale = data.fontScale || 1;
      state.history = Array.isArray(data.history) ? data.history : [];
    }

    if (!state.decks || Object.keys(state.decks).length === 0) {
      var defaults = DEFAULT_DECKS;
      for (var i = 0; i < defaults.length; i++) {
        state.decks[defaults[i].id] = defaults[i];
      }
      if (defaults.length > 0) {
        state.currentDeckId = defaults[0].id;
        state.currentPageId = defaults[0].pages[0].id;
        state.ui.mode = 'deck';
      } else {
        state.ui.mode = 'library';
      }
      persist();
    } else if (state.currentDeckId && state.decks[state.currentDeckId]) {
      state.ui.mode = 'deck';
      if (!state.currentPageId && state.decks[state.currentDeckId].pages.length) {
        state.currentPageId = state.decks[state.currentDeckId].pages[0].id;
      }
    } else {
      state.ui.mode = 'library';
    }

    render();
  }).catch(function(err) {
    console.error(err);
    showToast('Failed to start app', 'error');
    render();
  });
}

// Global error handlers
window.addEventListener('error', function(e) {
  try { console.error(e.error || e.message); } catch (err) {}
});
window.addEventListener('unhandledrejection', function(e) {
  try { console.error(e.reason || e); } catch (err) {}
});

// Start
init();
  </script>
