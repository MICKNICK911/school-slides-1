<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 Phonics Lesson Publisher v8 — Dynamic Sections</title>
    <style>
        @page { size: 850px 1100px; margin: 0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; background: #f5f7fa; color: #1a1a1a; padding: 20px; }
        .app { max-width: 1500px; margin: 0 auto; background: #fff; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); overflow: hidden; }
        .app-header { background: #1a1a2e; color: #fff; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .app-header h1 { font-size: 24px; font-weight: 800; }
        .app-header .badge { background: #F5A623; color: #1a1a1a; padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; }
        .tabs { display: flex; border-bottom: 2px solid #e9ecef; background: #fafbfc; padding: 0 32px; gap: 4px; }
        .tab-btn { padding: 16px 28px; border: none; background: transparent; font-size: 17px; font-weight: 700; color: #6c757d; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; font-family: inherit; touch-action: manipulation; }
        .tab-btn.active { color: #1a1a2e; border-bottom-color: #F5A623; }
        .tab-panel { display: none; padding: 24px 32px 32px; }
        .tab-panel.active { display: block; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: 420px; width: 100%; pointer-events: none; }
        .toast { padding: 14px 20px; border-radius: 12px; color: #fff; font-weight: 600; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 10px; pointer-events: auto; }
        .toast.success { background: #2d7d46; } .toast.error { background: #dc3545; } .toast.warning { background: #e67e22; } .toast.info { background: #2c7be5; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .edit-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
        @media (max-width: 1200px) { .edit-layout { grid-template-columns: 1fr; } }
        .form-section { background: #f8f9fa; border-radius: 16px; padding: 24px; border: 2px solid #e9ecef; position: sticky; top: 20px; max-height: calc(100vh - 160px); overflow-y: auto; }
        .form-section h2 { font-size: 21px; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 700; font-size: 13px; color: #495057; margin-bottom: 4px; }
        .form-group label .req { color: #dc3545; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; border: 2px solid #dee2e6; border-radius: 10px; font-size: 14px; font-family: inherit; transition: border 0.2s; background: #fff; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #F5A623; box-shadow: 0 0 0 3px rgba(245,166,35,0.15); }
        .form-group textarea { resize: vertical; min-height: 50px; }
        .form-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .btn { padding: 10px 22px; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; transition: background 0.2s, transform 0.15s; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn-primary { background: #F5A623; color: #1a1a1a; }
        .btn-success { background: #2d7d46; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-outline { background: transparent; border: 2px solid #dee2e6; color: #495057; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn-xs { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
        .btn-warning { background: #e67e22; color: #fff; }
        .list-section { min-height: 400px; }
        .list-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 2px solid #e9ecef; }
        .search-box { flex: 1; min-width: 180px; padding: 10px 16px; border: 2px solid #dee2e6; border-radius: 10px; font-size: 14px; font-family: inherit; }
        .search-box:focus { outline: none; border-color: #F5A623; }
        .list-toolbar .count { font-weight: 700; color: #6c757d; font-size: 14px; white-space: nowrap; }
        .lesson-list { display: flex; flex-direction: column; gap: 8px; }
        .lesson-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #f8f9fa; border-radius: 12px; border: 2px solid transparent; transition: background 0.2s, border-color 0.2s; }
        .lesson-item:active { border-color: #F5A623; background: #fff; }
        .lesson-item .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #e9ecef; border: 1px solid #dee2e6; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 21px; }
        .lesson-item .info { flex: 1; min-width: 0; }
        .lesson-item .info .title { font-weight: 700; font-size: 17px; }

        .lesson-item .actions { display: flex; gap: 4px; flex-shrink: 0; }

        .toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 10px 14px; background: #fff; border: 2px solid #e9ecef; border-radius: 12px; flex-wrap: wrap; }
        .toggle-row label { margin: 0; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .toggle-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: #F5A623; cursor: pointer; }
        .section-card { background: #fff; border: 2px solid #e9ecef; border-radius: 12px; padding: 14px; margin-bottom: 12px; }

        .image-upload-wrap .preview-ph { width: 56px; height: 56px; border-radius: 8px; border: 2px dashed #dee2e6; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #adb5bd; background: #f8f9fa; }

        /* Custom boxes form card */
        .custom-box-card { background: #fff; border: 2px solid #e9ecef; border-radius: 12px; padding: 10px; margin-bottom: 8px; }
        .custom-box-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }

        .section-builder-item .sb-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .section-builder-item .sb-header .sb-title { font-weight: 700; font-size: 14px; flex: 1; }
        .section-builder-item .sb-header select { width: auto; padding: 4px 8px; border-radius: 8px; border: 2px solid #dee2e6; font-size: 12px; }
        .section-builder-item .sb-body { display: flex; flex-direction: column; gap: 8px; }
        .section-builder-item .sb-body textarea, .section-builder-item .sb-body input, .section-builder-item .sb-body select { width: 100%; padding: 6px 10px; border: 2px solid #dee2e6; border-radius: 8px; font-size: 13px; font-family: inherit; }
        .section-builder-item .sb-actions { display: flex; gap: 4px; justify-content: flex-end; }

        .todays-sound-stars { color: #F5A623; font-size: 12px; letter-spacing: 3px; margin-bottom: 2px; }

        .cvc-intro-box p { margin: 0; font-size: 13px; line-height: 1.4; color: #1a1a1a; font-weight: 500; }
        .cvc-intro-box .highlight { color: #E2571C; font-weight: 700; }
        .cvc-instruction-box { border: 2px solid #F5A623; border-radius: 10px; padding: 9px 14px; background: #fffaf0; }
        .cvc-instruction-box p { margin: 0; font-size: 13px; font-weight: 700; color: #1a1a2e; line-height: 1.35; }

        .custom-text-box { border: 2px dashed #E2571C; border-radius: 10px; padding: 10px 14px; background: #fff8f3; }
        .custom-text-box p { margin: 0; font-size: 13px; line-height: 1.4; color: #1a1a1a; font-weight: 500; }
        .custom-text-box .highlight { color: #E2571C; font-weight: 700; }

        .word-grid { display: grid; grid-template-columns: repeat(4, 1fr); border: 2px solid #E2571C; border-radius: 10px; overflow: hidden; background: #fff; }
        .word-cell { border-right: 1px solid #f0c9a8; border-bottom: 1px solid #f0c9a8; padding: 9px 4px; text-align: center; font-size: 23px; font-weight: 600; color: #1a1a1a; min-height: 40px; display: flex; align-items: center; justify-content: center; background: #fff; }
        .word-cell:nth-child(4n) { border-right: none; }
        .word-cell:nth-last-child(-n+4) { border-bottom: none; }
        .word-cell.empty { background: #faf7f4; color: transparent; }

        .act-box { border: 2px solid #E2571C; border-radius: 12px; padding: 12px 16px; background: #fff; }
        .act-box .act-title { font-size: 13px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
        .act-box .sentence { font-size: 17px; font-weight: 600; color: #E2571C; margin: 3px 0; line-height: 1.35; }

        .fill-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .fill-item { border: 2px solid #F5A623; border-radius: 10px; padding: 8px 6px; text-align: center; font-size: 21px; font-weight: 700; color: #E2571C; background: #fffaf0; display: flex; align-items: center; justify-content: center; gap: 2px; min-height: 42px; }
        .fill-item .blank-sq { display: inline-block; width: 22px; height: 26px; border: 2px solid #1a1a1a; border-radius: 4px; background: #fff; vertical-align: middle; }

        .sent-lines { margin-top: 4px; }
        .sent-line { border-bottom: 1.5px solid #999; padding: 12px 0 4px; font-size: 14px; color: #666; font-weight: 600; }

        .writing-lines-area { display: flex; flex-direction: column; justify-content: space-evenly; min-height: 120px; padding-bottom: 26px; flex: 1; }
        .writing-set { position: relative; height: 46px; width: 100%; flex: 0 0 auto; }
        .writing-set .line { position: absolute; left: 0; right: 0; height: 0; border-top-width: 1.8px; border-top-style: solid; }
        .writing-set .line.l1 { top: 0; border-top-color: #E2571C; }
        .writing-set .line.l2 { top: 15px; border-top-color: #2c7be5; }
        .writing-set .line.l3 { top: 30px; border-top-color: #2c7be5; }
        .writing-set .line.l4 { top: 45px; border-top-color: #E2571C; }

        .cvc-page-number { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 14px; color: #6c757d; z-index: 2; pointer-events: none; }

        .cover-card { display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Times New Roman', Times, serif; min-height: 1000px; border: 3px solid #F5A623; border-radius: 28px; }
        .cover-text-block { text-align: center; padding: 0 40px; }
        .cover-line { width: 120px; height: 4px; background-color: #F5A623; margin: 30px auto; border-radius: 2px; }
        .cover-title { font-size: 60px; font-weight: 800; color: #1a1a2e; letter-spacing: 2px; margin: 0; }
        .cover-subtitle { font-size: 32px; font-weight: 400; color: #E2571C; margin-top: 14px; letter-spacing: 1px; font-style: italic; }

        .toc-card { border: 3px solid #F5A623; border-radius: 28px; min-height: 1000px; padding: 30px 40px; position: relative; font-family: 'Times New Roman', Times, serif; }
        .toc-title { font-size: 28px; font-weight: 800; color: #1a1a2e; text-align: center; margin-bottom: 20px; border-bottom: 4px solid #F5A623; padding-bottom: 10px; }
        .toc-list { list-style: none; padding: 0; margin: 0; }
        .toc-item { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 6px; border-bottom: 1px dashed #dee2e6; font-size: 14px; font-weight: 600; line-height: 1.3; }
        .toc-item .toc-page-num { font-weight: 800; color: #E2571C; min-width: 60px; text-align: right; }
        .toc-card .page-number { position: absolute; bottom: 16px; right: 24px; font-weight: 800; font-size: 14px; font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; }

        .sight-words-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 8px; padding: 0 12px; }
        .sight-word-pill { display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #E2571C; background: #fff; border: 3px solid #F5A623; border-radius: 14px; padding: 16px 6px; min-height: 76px; text-align: center; word-break: break-word; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .view-container .card.sight-card { border: 3px solid #F5A623; border-radius: 28px; min-height: 1000px; padding: 24px 32px; }
        .view-container .title { font-size: 28px; font-weight: 800; color: #1a1a1a; letter-spacing: 0.5px; margin: 4px 0 16px 0; }
        .view-container .section-header { display: flex; align-items: center; margin-bottom: 10px; margin-top: 10px; }
        .view-container .section-header .circle { background: #F5A623; color: #fff; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; margin-right: 12px; flex-shrink: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .view-container .section-header .label-box { flex: 1; border: 3px dashed #E2571C; border-radius: 12px; padding: 7px 16px; font-weight: 800; font-size: 17px; color: #1a1a1a; }

        .view-toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid #e9ecef; }
        .view-toolbar .info { font-weight: 700; color: #6c757d; font-size: 14px; margin-right: auto; }
        .page-actions { text-align: right; margin-bottom: 8px; }
        .export-btn { background: #E2571C; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-weight: 700; font-size: 13px; font-family: inherit; cursor: pointer; }

        /* ---------- Print Rules ---------- */
        @media print {
            body { padding: 0; background: #fff; }
            .app-header, .tabs, .desktop-left-tabs, .left-pane, .edit-panel, .book-panel, .toast-container, .modal-overlay, .no-print, .page-actions, .view-toolbar { display: none !important; }
            .panels-container { display: block !important; }
            .right-pane { overflow: visible !important; height: auto !important; max-width: 100% !important; padding: 0 !important; border: none !important; }
            .view-container { overflow: visible !important; display: block !important; }

            .view-container .page:last-child { page-break-after: auto; }
            .view-container .card, .todays-sound-header, .cvc-header-right, .sight-word-pill, .toc-card, .cover-card,

<body>
    <div id="app"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function () {
            // ---------- Storage Configuration ----------
            const IDB_NAME = 'phonics_lessons_db';
            const IDB_STORE = 'app_data';
            const LEGACY_STORAGE_KEY = 'phonics_lessons_v8';
            const MAX_TOC_PER_PAGE = 20;
            const MAX_SIGHT_WORDS_PER_PAGE = 50;
            const MAX_GRID_WORDS = 24;
            const MAX_FILL_ITEMS = 18;
            const FONT_FAMILIES = ['Poppins', 'Arial', 'Georgia', 'Courier New'];

            // ---------- IndexedDB Utility ----------
            let dbPromise = null;
            function getDB() {
                if (!dbPromise) {
                    dbPromise = new Promise((resolve, reject) => {
                        const request = indexedDB.open(IDB_NAME, 1);
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(IDB_STORE)) {
                                db.createObjectStore(IDB_STORE);
                            }
                        };
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => reject(request.error);
                    });
                }
                return dbPromise;
            }

            async function idbSet(data) {
                try {
                    const db = await getDB();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(IDB_STORE, 'readwrite');
                        const store = tx.objectStore(IDB_STORE);
                        store.put(data, 'appData');
                        tx.oncomplete = () => resolve();
                        tx.onerror = () => reject(tx.error);
                    });
                } catch (e) {
                    localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(data));
                }
            }

            async function idbGet() {
                try {
                    const db = await getDB();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(IDB_STORE, 'readonly');
                        const store = tx.objectStore(IDB_STORE);
                        const request = store.get('appData');
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => reject(request.error);
                    });
                } catch (e) {
                    return null;
                }
            }

            // ---------- Helper Functions ----------
            function sanitizeRichText(text) {
                if (!text) return '';
                let esc = escapeHtml(text);
                esc = esc
                    .replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>')
                    .replace(/&lt;i&gt;/g, '<i>').replace(/&lt;\/i&gt;/g, '</i>')
                    .replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>')
                    .replace(/&lt;strong&gt;/g, '<strong>').replace(/&lt;\/strong&gt;/g, '</strong>')
                    .replace(/&lt;em&gt;/g, '<em>').replace(/&lt;\/em&gt;/g, '</em>')
                    .replace(/&lt;span class=&quot;highlight&quot;&gt;/g, '<span class="highlight">')
                    .replace(/&lt;span class="highlight"&gt;/g, '<span class="highlight">')
                    .replace(/&lt;\/span&gt;/g, '</span>');
                return esc;
            }

            function formatTextWithHighlight(text) {
                const formatted = sanitizeRichText(text);
                return formatted.replace(/\b(apple|egg|igloo|octopus|umbrella)\b/gi, m => `<span class="highlight">${m}</span>`);
            }

            function flattenWords(arr) {
                if (!Array.isArray(arr)) return [];
                let r = [];
                for (let row of arr) {
                    if (Array.isArray(row)) r = r.concat(row);
                    else r.push(row);
                }
                return r;
            }
            function escapeHtml(str) {
                return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
            }
            function showToast(msg, type = 'info') {
                const t = document.createElement('div');
                t.className = 'toast ' + type;
                t.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️'}</span> ${escapeHtml(msg)}`;
                document.getElementById('toastContainer').appendChild(t);
                setTimeout(() => t.remove(), 3500);
            }
            function confirmDialog(msg, cb) {
                const o = document.createElement('div');
                o.className = 'modal-overlay';
                o.innerHTML = `<div class="modal"><h3>⚠️ Confirm</h3><p>${msg}</p><div class="actions"><button class="btn btn-outline cancel">Cancel</button><button class="btn btn-danger confirm">Yes</button></div></div>`;
                document.body.appendChild(o);
                o.querySelector('.cancel').onclick = () => o.remove();
                o.querySelector('.confirm').onclick = () => { o.remove(); cb(); };
            }

            // ---------- Section Types Definitions ----------
            const SECTION_TYPES = {
                tile: { label: 'Letter/Image Tile', defaultWidth: 'full', defaultFont: { family: 'Poppins', size: 56, bold: true, italic: false } },
                introText: { label: 'Intro Text', defaultWidth: 'full', defaultFont: { family: 'Poppins', size: 13, bold: false, italic: false } },
                instruction: { label: 'Instruction', defaultWidth: 'full', defaultFont: { family: 'Poppins', size: 13, bold: true, italic: false } },
                wordGrid: { label: 'Word Grid', defaultWidth: 'full', defaultFont: { family: 'Poppins', size: 23, bold: false, italic: false } },
                decodable: { label: 'Decodable Reading', defaultWidth: 'full', defaultFont: { family: 'Poppins', size: 17, bold: false, italic: false } },
                fillBlanks: { label: 'Fill-in-Blanks', defaultWidth: 'full', defaultFont: { family: 'Poppins', size: 21, bold: true, italic: false } },
                sentenceWriting: { label: 'Sentence Writing', defaultWidth: 'full', defaultFont: { family: 'Poppins', size: 14, bold: false, italic: false } },
                customText: { label: 'Custom Text', defaultWidth: 'full', defaultFont: { family: 'Poppins', size: 13, bold: false, italic: false } },
                writingLines: { label: 'Writing Lines (expandable)', defaultWidth: 'full', defaultFont: { family: 'Poppins', size: 14, bold: false, italic: false } }
            };

            function generateSectionId() { return 'sec' + Date.now() + Math.random().toString(36).slice(2, 7); }

            function createDefaultSection(type) {
                const id = generateSectionId();
                const typeInfo = SECTION_TYPES[type];
                const base = { id, type, width: typeInfo.defaultWidth, font: { ...typeInfo.defaultFont } };
                switch (type) {
                    case 'tile':
                        return { ...base, tileMode: 'letter', letterTile: 'Aa', letterFontSize: 56, imagePath: '', imageCaption: "TODAY'S SOUND" };
                    case 'introText':
                    case 'instruction':
                    case 'customText':
                        return { ...base, text: '' };
                    case 'wordGrid':
                        return { ...base, words: [] };
                    case 'decodable':
                        return { ...base, instruction: 'Read ALOUD and circle all words with the target sound', sentences: [] };
                    case 'fillBlanks':
                        return { ...base, title: 'A. Fill in the missing letters and say the word', items: [] };
                    case 'sentenceWriting':
                        return { ...base, title: 'C. Choose any word and form 2 sentences', lines: 2 };
                    case 'writingLines':
                        return { ...base, fillRemaining: true };
                    default:
                        return { ...base };
                }
            }

            function hasCustomFont(section) {
                const def = SECTION_TYPES[section.type]?.defaultFont;
                if (!section.font || !def) return false;
                return section.font.family !== def.family ||
                       section.font.size !== def.size ||
                       section.font.bold !== def.bold ||
                       section.font.italic !== def.italic;
            }

            // Migration: add font object to existing sections if missing
            function migrateToSections(lesson) {
                if (Array.isArray(lesson.sections) && lesson.sections.length > 0) {
                    lesson.sections.forEach(section => {
                        if (!section.font) {
                            section.font = { ...(SECTION_TYPES[section.type]?.defaultFont || { family: 'Poppins', size: 13, bold: false, italic: false }) };
                        }
                    });
                    return lesson;
                }
                // fallback to old conversion if no sections
                const sections = [];
                if (lesson.tileMode && lesson.tileMode !== 'none') {
                    sections.push({ id: generateSectionId(), type: 'tile', width: 'full', tileMode: lesson.tileMode, letterTile: lesson.letterTile || '', letterFontSize: lesson.letterFontSize || 56, imagePath: lesson.imagePath || '', imageCaption: lesson.imageCaption || "TODAY'S SOUND", font: { ...SECTION_TYPES.tile.defaultFont } });
                }
                if (lesson.showIntro !== false && lesson.introText) {
                    sections.push({ id: generateSectionId(), type: 'introText', width: 'full', text: lesson.introText, font: { ...SECTION_TYPES.introText.defaultFont } });
                }
                if (lesson.showInstruction !== false && lesson.instruction) {
                    sections.push({ id: generateSectionId(), type: 'instruction', width: 'full', text: lesson.instruction, font: { ...SECTION_TYPES.instruction.defaultFont } });
                }
                if (lesson.showGrid !== false && lesson.words && lesson.words.length > 0) {
                    sections.push({ id: generateSectionId(), type: 'wordGrid', width: 'full', words: lesson.words, font: { ...SECTION_TYPES.wordGrid.defaultFont } });
                }
                if (lesson.showDecodable === true) {
                    sections.push({ id: generateSectionId(), type: 'decodable', width: 'full', instruction: lesson.decodableInstruction || 'Read ALOUD and circle all words with the target sound', sentences: lesson.decodableSentences || [], font: { ...SECTION_TYPES.decodable.defaultFont } });
                }
                if (lesson.showFillBlanks === true) {
                    sections.push({ id: generateSectionId(), type: 'fillBlanks', width: 'full', title: lesson.fillTitle || 'A. Fill in the missing letters and say the word', items: lesson.fillItems || [], font: { ...SECTION_TYPES.fillBlanks.defaultFont } });
                }
                if (lesson.showSentenceWrite === true) {
                    sections.push({ id: generateSectionId(), type: 'sentenceWriting', width: 'full', title: lesson.sentenceTitle || 'C. Choose any word and form 2 sentences', lines: lesson.sentenceLines || 2, font: { ...SECTION_TYPES.sentenceWriting.defaultFont } });
                }
                if (lesson.showWritingLines !== false) {
                    sections.push({ id: generateSectionId(), type: 'writingLines', width: 'full', fillRemaining: true, font: { ...SECTION_TYPES.writingLines.defaultFont } });
                }
                if (Array.isArray(lesson.customBoxes)) {
                    lesson.customBoxes.forEach(cb => {
                        if (cb.enabled && cb.text) sections.push({ id: generateSectionId(), type: 'customText', width: 'full', text: cb.text, font: { ...SECTION_TYPES.customText.defaultFont } });
                    });
                }
                lesson.sections = sections;
                delete lesson.tileMode; delete lesson.letterTile; delete lesson.letterFontSize; delete lesson.imagePath; delete lesson.imageCaption;
                delete lesson.showIntro; delete lesson.introText; delete lesson.showInstruction; delete lesson.instruction;
                delete lesson.showGrid; delete lesson.words; delete lesson.showDecodable; delete lesson.decodableInstruction; delete lesson.decodableSentences;
                delete lesson.showFillBlanks; delete lesson.fillTitle; delete lesson.fillItems; delete lesson.showSentenceWrite; delete lesson.sentenceTitle; delete lesson.sentenceLines;
                delete lesson.showWritingLines; delete lesson.customBoxes;
                return lesson;
            }

            // ---------- Default data ----------
            const DEFAULT_LESSONS = [
                (() => {
                    const l = { id: 'l1', mainTitle: 'SHORT VOWEL CVC WORDS', subtitle: 'SHORT VOWEL', lessonNumber: 1 };
                    l.sections = [
                        { id: generateSectionId(), type: 'tile', width: 'full', tileMode: 'letter', letterTile: 'Aa', letterFontSize: 56, imagePath: '', imageCaption: "TODAY'S SOUND", font: { ...SECTION_TYPES.tile.defaultFont } },
                        { id: generateSectionId(), type: 'introText', width: 'full', text: 'Short a says /a/ like in <b>apple</b> — when a single vowel is boxed in between two consonants, it usually keeps this quick, clipped sound.', font: { ...SECTION_TYPES.introText.defaultFont } },
                        { id: generateSectionId(), type: 'instruction', width: 'full', text: 'Say each picture word out loud and listen for this pattern.', font: { ...SECTION_TYPES.instruction.defaultFont } },
                        { id: generateSectionId(), type: 'wordGrid', width: 'full', words: ['bag','cat','mat','hat','rat','bat','sat','pat','fat','man','van','map'], font: { ...SECTION_TYPES.wordGrid.defaultFont } },
                        { id: generateSectionId(), type: 'decodable', width: 'full', instruction: 'Read ALOUD and circle all words with the target sound', sentences: ['I see a bag.','Look at the cat and the mat.','Is this a hat?','I like my rat.','We have a bat.'], font: { ...SECTION_TYPES.decodable.defaultFont } },
                        { id: generateSectionId(), type: 'fillBlanks', width: 'full', title: 'A. Fill in the missing letters and say the word', items: ['b_g','c_t','m_t','h_t','r_t','b_t','s_t','p_t','f_t'], font: { ...SECTION_TYPES.fillBlanks.defaultFont } },
                        { id: generateSectionId(), type: 'sentenceWriting', width: 'full', title: 'C. Choose any word and form 2 sentences', lines: 2, font: { ...SECTION_TYPES.sentenceWriting.defaultFont } },
                        { id: generateSectionId(), type: 'writingLines', width: 'full', fillRemaining: true, font: { ...SECTION_TYPES.writingLines.defaultFont } }
                    ];
                    return l;
                })()
            ];
            const DEFAULT_SIGHT_WORDS = ['the','of','and','a','to','in','is','you','that','it','he','was','for','on','are','as','with','his','they','I','at','be','this','have','from','or','one','had','by','but','not','what','all','were','we','when','your','can','said','there','use','an','each','which','she','do','how','their','if','will','up','other','about','out','many','then','them','these','so','some','her','would','make','like','him','into','time','has','look','two','more','write','go','see','no','way','could','people','my','than','first','water','been','called','who','am','its','now','find','long','down','day','did','get','come','made','may','part'];
            const DEFAULT_COVER = { title: 'Crystal Phonics', subtitle: 'Grade 1' };

            let lessons = [], sightWords = [], coverData = { ...DEFAULT_COVER };
            let editingId = null, nextId = 1, tempSections = [];
            window.searchQuery = '';

            async function loadData() {
                let data = null;
                try { data = await idbGet(); } catch (e) { data = null; }
                if (!data || !data.lessons) {
                    try { const raw = localStorage.getItem(LEGACY_STORAGE_KEY); if (raw) data = JSON.parse(raw); } catch (e) {}
                }
                if (data && data.lessons) {
                    lessons = data.lessons.map(l => migrateToSections(l));
                    sightWords = data.sightWords || [...DEFAULT_SIGHT_WORDS];
                    coverData = data.coverData || { ...DEFAULT_COVER };
                    if (lessons.length) {
                        let maxId = 0;
                        lessons.forEach(l => {
                            if (!l.id) l.id = 'l' + Date.now() + Math.random().toString(36).slice(2, 6);
                            const num = parseInt(String(l.id).replace('l', '')) || 0;
                            if (num > maxId) maxId = num;
                        });
                        nextId = maxId + 1;
                    } else {
                        lessons = JSON.parse(JSON.stringify(DEFAULT_LESSONS)); nextId = lessons.length + 1;
                    }
                    renumberByOrder(lessons);
                } else {
                    lessons = JSON.parse(JSON.stringify(DEFAULT_LESSONS));
                    sightWords = [...DEFAULT_SIGHT_WORDS];
                    coverData = { ...DEFAULT_COVER };
                    nextId = lessons.length + 1;
                    renumberByOrder(lessons);
                }
                await saveData();
            }

            async function saveData() {
                const payload = { lessons, sightWords, coverData };
                await idbSet(payload);
                try { localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
            }

            function generateId() { return 'l' + (nextId++); }
            function resyncNextId() {
                let maxId = 0; lessons.forEach(l => { const num = parseInt(String(l.id).replace('l','')) || 0; if (num > maxId) maxId = num; }); nextId = maxId + 1;
            }
            function renumberByOrder(arr) { arr.forEach((lesson, idx) => lesson.lessonNumber = idx + 1); }

            // ---------- Section Builder UI ----------
            function renderSectionsBuilder() {
                const container = document.getElementById('sectionsContainer');
                if (!container) return;
                if (!tempSections.length) { container.innerHTML = '<div style="color:#6c757d;font-size:12px;padding:8px 0;">No sections added.</div>'; return; }
                let html = '';
                tempSections.forEach((section, idx) => {
                    const typeInfo = SECTION_TYPES[section.type];
                    html += `<div class="section-builder-item" data-id="${section.id}">
                        <div class="sb-header">
                            <span class="sb-title">${typeInfo.label}</span>
                            <select onchange="updateSectionWidth('${section.id}', this.value)">
                                <option value="full" ${section.width === 'full' ? 'selected' : ''}>Full width</option>
                                <option value="half" ${section.width === 'half' ? 'selected' : ''}>Half width</option>
                                <option value="quarter" ${section.width === 'quarter' ? 'selected' : ''}>Quarter width</option>
                                <option value="threequarter" ${section.width === 'threequarter' ? 'selected' : ''}>Three-quarter width</option>
                            </select>
                            <div class="sb-actions">
                                <button class="btn btn-outline btn-xs" onclick="moveSection('${section.id}', -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
                                <button class="btn btn-outline btn-xs" onclick="moveSection('${section.id}', 1)" ${idx === tempSections.length-1 ? 'disabled' : ''}>▼</button>
                                <button class="btn btn-danger btn-xs" onclick="deleteSection('${section.id}')">🗑️</button>
                            </div>
                        </div>
                        <div class="sb-body">
                            ${renderSectionFields(section)}
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            }

            function renderFontControls(section) {
                const f = section.font || SECTION_TYPES[section.type].defaultFont;
                return `<div class="font-controls">
                    <label>Font:</label>
                    <select onchange="updateSectionFont('${section.id}', 'family', this.value)">
                        ${FONT_FAMILIES.map(fam => `<option value="${fam}" ${f.family === fam ? 'selected' : ''}>${fam}</option>`).join('')}
                    </select>
                    <label>Size:</label>
                    <input type="number" value="${f.size}" min="6" max="100" onchange="updateSectionFont('${section.id}', 'size', parseInt(this.value))">
                    <label><input type="checkbox" ${f.bold ? 'checked' : ''} onchange="updateSectionFont('${section.id}', 'bold', this.checked)"> Bold</label>
                    <label><input type="checkbox" ${f.italic ? 'checked' : ''} onchange="updateSectionFont('${section.id}', 'italic', this.checked)"> Italic</label>
                </div>`;
            }

            function renderSectionFields(section) {
                let html = '';
                switch (section.type) {
                    case 'tile':
                        html = `
                            <select onchange="updateSectionData('${section.id}', 'tileMode', this.value)">
                                <option value="letter" ${section.tileMode === 'letter' ? 'selected' : ''}>Letter</option>
                                <option value="image" ${section.tileMode === 'image' ? 'selected' : ''}>Image</option>
                            </select>
                            <div class="form-group">
                                <label>Letter Tile</label>
                                <input value="${escapeHtml(section.letterTile || '')}" onchange="updateSectionData('${section.id}', 'letterTile', this.value)">
                            </div>
                            <div class="form-group">
                                <label>Caption (for image mode)</label>
                                <input value="${escapeHtml(section.imageCaption || "TODAY'S SOUND")}" onchange="updateSectionData('${section.id}', 'imageCaption', this.value)">
                            </div>
                            <div class="form-group">
                                <label>Image Upload</label>
                                <div class="image-upload-wrap">
                                    <img id="sectionImgPreview_${section.id}" class="preview" style="${section.imagePath ? 'display:block' : 'display:none'}" src="${escapeHtml(section.imagePath || '')}">
                                    <div id="sectionImgPh_${section.id}" class="preview-ph" style="${section.imagePath ? 'display:none' : 'display:flex'}">🖼️</div>
                                    <input type="file" accept="image/*" onchange="handleSectionImageUpload('${section.id}', event)">
                                    <input type="hidden" id="sectionImagePath_${section.id}" value="${escapeHtml(section.imagePath || '')}">
                                </div>
                            </div>
                            ${renderFontControls(section)}`;
                        break;
                    case 'introText':
                    case 'instruction':
                    case 'customText':
                        html = `
                            <textarea rows="3" oninput="updateSectionData('${section.id}', 'text', this.value)">${escapeHtml(section.text || '')}</textarea>
                            ${renderFontControls(section)}`;
                        break;
                    case 'wordGrid':
                        html = `
                            <textarea rows="3" placeholder="Comma separated words" oninput="updateSectionData('${section.id}', 'words', this.value.split(',').map(s=>s.trim()).filter(Boolean))">${(section.words || []).join(', ')}</textarea>
                            ${renderFontControls(section)}`;
                        break;
                    case 'decodable':
                        html = `
                            <input value="${escapeHtml(section.instruction || '')}" onchange="updateSectionData('${section.id}', 'instruction', this.value)">
                            <textarea rows="3" placeholder="Sentences, comma separated" oninput="updateSectionData('${section.id}', 'sentences', this.value.split(',').map(s=>s.trim()).filter(Boolean))">${(section.sentences || []).join(', ')}</textarea>
                            ${renderFontControls(section)}`;
                        break;
                    case 'fillBlanks':
                        html = `
                            <input value="${escapeHtml(section.title || '')}" onchange="updateSectionData('${section.id}', 'title', this.value)">
                            <textarea rows="3" placeholder="Items, comma separated (use _ for blank)" oninput="updateSectionData('${section.id}', 'items', this.value.split(',').map(s=>s.trim()).filter(Boolean))">${(section.items || []).join(', ')}</textarea>
                            ${renderFontControls(section)}`;
                        break;
                    case 'sentenceWriting':
                        html = `
                            <input value="${escapeHtml(section.title || '')}" onchange="updateSectionData('${section.id}', 'title', this.value)">
                            <input type="number" value="${section.lines || 2}" min="1" max="8" onchange="updateSectionData('${section.id}', 'lines', parseInt(this.value))">
                            ${renderFontControls(section)}`;
                        break;
                    case 'writingLines':
                        html = `
                            <label><input type="checkbox" ${section.fillRemaining ? 'checked' : ''} onchange="updateSectionData('${section.id}', 'fillRemaining', this.checked)"> Fill remaining height</label>
                            ${renderFontControls(section)}`;
                        break;
                    default: html = '';
                }
                return html;
            }

            // Section CRUD
            window.addSection = function(type) {
                const newSection = createDefaultSection(type);
                tempSections.push(newSection);
                renderSectionsBuilder();
                schedulePreviewUpdate();
            };
            window.deleteSection = function(id) {
                tempSections = tempSections.filter(s => s.id !== id);
                renderSectionsBuilder();
                schedulePreviewUpdate();
            };
            window.moveSection = function(id, dir) {
                const idx = tempSections.findIndex(s => s.id === id);
                if (idx === -1) return;
                const newIdx = idx + dir;
                if (newIdx < 0 || newIdx >= tempSections.length) return;
                [tempSections[idx], tempSections[newIdx]] = [tempSections[newIdx], tempSections[idx]];
                renderSectionsBuilder();
                schedulePreviewUpdate();
            };
            window.updateSectionWidth = function(id, width) {
                const section = tempSections.find(s => s.id === id);
                if (section) section.width = width;
                schedulePreviewUpdate();
            };
            window.updateSectionData = function(id, field, value) {
                const section = tempSections.find(s => s.id === id);
                if (!section) return;
                section[field] = value;
                if (field === 'lines') section.lines = parseInt(value) || 2;
                schedulePreviewUpdate();
            };
            window.updateSectionFont = function(id, field, value) {
                const section = tempSections.find(s => s.id === id);
                if (!section) return;
                if (!section.font) section.font = { ...SECTION_TYPES[section.type].defaultFont };
                section.font[field] = value;
                if (field === 'size') section.font.size = parseInt(value) || 12;
                if (section.type === 'tile') section.letterFontSize = section.font.size;
                schedulePreviewUpdate();
            };

            // Image upload handler
            window.handleSectionImageUpload = function(sectionId, event) {
                const file = event.target.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) { showToast('Image must be < 2MB.', 'error'); event.target.value=''; return; }
                if (!file.type.startsWith('image/')) { showToast('Please select an image file.', 'error'); event.target.value=''; return; }
                const reader = new FileReader();
                reader.onload = ev => {
                    const dataUrl = ev.target.result;
                    const section = tempSections.find(s => s.id === sectionId);
                    if (section) {
                        section.imagePath = dataUrl;
                        const img = document.getElementById('sectionImgPreview_' + sectionId);
                        const ph = document.getElementById('sectionImgPh_' + sectionId);
                        if (img) { img.src = dataUrl; img.style.display = 'block'; }
                        if (ph) ph.style.display = 'none';
                        schedulePreviewUpdate();
                        showToast('Image uploaded.', 'success');
                    }
                };
                reader.readAsDataURL(file);
            };

            // ---------- Preview Scheduling ----------
            let previewTimer = null;
            function schedulePreviewUpdate() {
                clearTimeout(previewTimer);
                previewTimer = setTimeout(renderLivePreview, 250);
            }

            function getDisplayLessons() {
                const display = lessons.map(l => ({ ...l, sections: l.sections.map(s => ({ ...s })) }));
                const tempLesson = {
                    mainTitle: document.getElementById('fMainTitle')?.value || 'Untitled',
                    subtitle: document.getElementById('fSubtitle')?.value || 'SHORT VOWEL',
                    lessonNumber: editingId ? (lessons.findIndex(l => l.id === editingId) + 1) : (lessons.length + 1),
                    id: editingId || 'temp',
                    sections: JSON.parse(JSON.stringify(tempSections))
                };
                if (editingId) {
                    const idx = lessons.findIndex(l => l.id === editingId);
                    if (idx !== -1) display[idx] = tempLesson;
                } else {
                    display.push(tempLesson);
                }
                return display;
            }

            function renderLivePreview() {
                const container = document.getElementById('viewContainer');
                if (!container) return;
                container.innerHTML = renderFullBookHTML();
            }

            function renderFullBookHTML() {
                const displayLessons = getDisplayLessons();
                let html = '';
                html += `<div class="page"><div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div><div class="card cover-card"><div class="cover-text-block"><div class="cover-line"></div><div class="cover-title">${escapeHtml(coverData.title)}</div><div class="cover-subtitle">${escapeHtml(coverData.subtitle)}</div><div class="cover-line"></div></div></div></div>`;
                if (!displayLessons.length && !sightWords.length) return html;
                const swPages = Math.ceil(sightWords.length / MAX_SIGHT_WORDS_PER_PAGE) || 0;
                const tocPages = displayLessons.length ? Math.ceil(displayLessons.length / MAX_TOC_PER_PAGE) : 0;
                const lessonStart = tocPages + swPages + 1;
                let running = lessonStart;
                const tocEntries = displayLessons.map(l => ({ lessonNumber: l.lessonNumber, mainTitle: l.mainTitle, firstPage: running++ }));
                for (let p = 0; p < tocPages; p++) {
                    const entries = tocEntries.slice(p * MAX_TOC_PER_PAGE, (p + 1) * MAX_TOC_PER_PAGE);
                    html += `<div class="page"><div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div><div class="toc-card"><div class="toc-title">Table of Contents</div><ul class="toc-list">${entries.map(e => `<li class="toc-item"><span>Lesson ${e.lessonNumber}: ${escapeHtml(e.mainTitle)}</span><span class="toc-page-num">Page ${e.firstPage}</span></li>`).join('')}</ul><div class="page-number">${p+1}</div></div></div>`;
                }
                let pageNum = tocPages + 1;
                for (let p = 0; p < swPages; p++) {
                    const words = sightWords.slice(p * MAX_SIGHT_WORDS_PER_PAGE, (p + 1) * MAX_SIGHT_WORDS_PER_PAGE);
                    const wordPills = words.map(w => `<div class="sight-word-pill">${escapeHtml(w)}</div>`).join('');
                    html += `<div class="page"><div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div><div class="card sight-card"><div class="title">Sight Words Practice</div><div class="section-header"><div class="circle">★</div><div class="label-box">Read and say each word</div></div><div class="sight-words-grid">${wordPills}</div><div class="page-number" style="position:absolute;bottom:18px;right:28px;">${pageNum}</div></div></div>`;
                    pageNum++;
                }
                pageNum = lessonStart;
                displayLessons.forEach(l => {
                    html += buildLessonPageHTML(l, pageNum++);
                });
                return html;
            }

            function buildLessonPageHTML(lesson, pageNum) {
                let header = `<div class="cvc-header"><div class="cvc-header-left"><h1 class="cvc-main-title">${escapeHtml(lesson.mainTitle || 'CVC WORDS')}</h1><div class="cvc-subtitle">${escapeHtml(lesson.subtitle || 'SHORT VOWEL')}</div></div><div class="cvc-header-right"><span class="lesson-label">LESSON</span><span class="lesson-num">${lesson.lessonNumber}</span></div></div>`;
                let sectionsHTML = '<div class="lesson-sections-container">';
                (lesson.sections || []).forEach(section => {
                    sectionsHTML += `<div class="section-item w-${section.width}">${renderSectionContentHTML(section)}</div>`;
                });
                sectionsHTML += '</div>';
                return `<div class="page"><div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div><div class="card">${header}${sectionsHTML}<div class="cvc-page-number">${pageNum}</div></div></div>`;
            }

            function renderSectionContentHTML(section) {
                const hasCustom = hasCustomFont(section);
                const fontStyle = hasCustom
                    ? `style="font-family:${section.font.family};font-size:${section.font.size}px;font-weight:${section.font.bold ? 'bold' : 'normal'};font-style:${section.font.italic ? 'italic' : 'normal'};"`
                    : '';
                switch (section.type) {
                    case 'tile': {
                        const tileMode = section.tileMode || 'letter';
                        if (tileMode === 'letter') {
                            const letterDiv = `<div class="todays-sound-letter" ${fontStyle}>${escapeHtml(section.letterTile || 'Aa')}</div>`;
                            return `<div class="todays-sound-card"><div class="todays-sound-header">TODAY'S SOUND</div><div class="todays-sound-body"><div class="todays-sound-stars">★ ★ ★</div>${letterDiv}</div></div>`;
                        } else {
                            const img = section.imagePath ? `<img class="todays-sound-img" src="${escapeHtml(section.imagePath)}" />` : `<div style="font-size:32px;opacity:0.4">🖼️</div>`;
                            return `<div class="todays-sound-card"><div class="todays-sound-header">${escapeHtml(section.imageCaption || "TODAY'S SOUND")}</div><div class="todays-sound-body">${img}</div></div>`;
                        }
                    }
                    case 'introText':
                    case 'customText': {
                        const p = `<p ${fontStyle}>${formatTextWithHighlight(section.text || '')}</p>`;
                        return `<div class="cvc-intro-box">${p}</div>`;
                    }
                    case 'instruction': {
                        const p = `<p ${fontStyle}>${escapeHtml(section.text || '')}</p>`;
                        return `<div class="cvc-instruction-box">${p}</div>`;
                    }
                    case 'wordGrid': {
                        const words = (section.words || []).filter(w => w && String(w).trim()).slice(0, MAX_GRID_WORDS);
                        if (!words.length) return '';
                        const display = [...words];
                        while (display.length % 4 !== 0) display.push('');
                        const cells = display.map(w => `<div class="word-cell${w ? '' : ' empty'}" ${fontStyle}>${escapeHtml(w || '')}</div>`).join('');
                        return `<div class="word-grid">${cells}</div>`;
                    }
                    case 'decodable': {
                        const sents = (section.sentences || []).filter(Boolean);
                        if (!sents.length) return '';
                        const lines = sents.map((s, i) => `<div class="sentence" ${fontStyle}>${i + 1}. ${escapeHtml(s)}</div>`).join('');
                        const title = `<div class="act-title" ${fontStyle}>${escapeHtml(section.instruction || '')}</div>`;
                        return `<div class="act-box">${title}${lines}</div>`;
                    }
                    case 'fillBlanks': {
                        const items = (section.items || []).filter(Boolean).slice(0, MAX_FILL_ITEMS);
                        if (!items.length) return '';
                        const cells = items.map(item => {
                            let inner = '';
                            for (const ch of String(item)) {
                                if (ch === '_') inner += '<span class="blank-sq"></span>';
                                else inner += `<span>${escapeHtml(ch)}</span>`;
                            }
                            return `<div class="fill-item" ${fontStyle}>${inner}</div>`;
                        }).join('');
                        const title = `<div class="act-title" ${fontStyle}>${escapeHtml(section.title || '')}</div>`;
                        return `<div class="act-box">${title}<div class="fill-grid">${cells}</div></div>`;
                    }
                    case 'sentenceWriting': {
                        const n = Math.max(1, Math.min(8, section.lines || 2));
                        let lines = '';
                        for (let i = 0; i < n; i++) {
                            lines += `<div class="sent-line" ${fontStyle}>${i + 1}.</div>`;
                        }
                        const title = `<div class="act-title" ${fontStyle}>${escapeHtml(section.title || '')}</div>`;
                        return `<div class="act-box">${title}<div class="sent-lines">${lines}</div></div>`;
                    }
                    case 'writingLines': {
                        const count = 3;
                        let lines = '';
                        for (let i = 0; i < count; i++) {
                            lines += `<div class="writing-set"><div class="line l1"></div><div class="line l2"></div><div class="line l3"></div><div class="line l4"></div></div>`;
                        }
                        return `<div class="writing-lines-area">${lines}</div>`;
                    }
                    default: return '';
                }
            }

            // ---------- Form Handling ----------
            function fillForm(lesson) {
                document.getElementById('fMainTitle').value = lesson.mainTitle || '';
                document.getElementById('fSubtitle').value = lesson.subtitle || 'SHORT VOWEL';
                document.getElementById('fLessonNumber').value = lesson.lessonNumber || '';
                tempMainTitle = lesson.mainTitle || '';
                tempSubtitle = lesson.subtitle || 'SHORT VOWEL';
                tempSections = JSON.parse(JSON.stringify(lesson.sections || []));
                renderSectionsBuilder();
                schedulePreviewUpdate();
            }

            function resetForm() {
                editingId = null;
                document.getElementById('formTitle').textContent = '➕ Add New Lesson';
                document.getElementById('fMainTitle').value = 'SHORT VOWEL CVC WORDS';
                document.getElementById('fSubtitle').value = 'SHORT VOWEL';
                document.getElementById('fLessonNumber').value = lessons.length + 1;
                tempMainTitle = 'SHORT VOWEL CVC WORDS';
                tempSubtitle = 'SHORT VOWEL';
                tempSections = JSON.parse(JSON.stringify(DEFAULT_LESSONS[0].sections || []));
                renderSectionsBuilder();
                document.getElementById('saveBtn').textContent = '💾 Save Lesson';
                document.getElementById('cancelBtn').style.display = 'none';
                schedulePreviewUpdate();
            }

            window.editLesson = function(id) {
                const lesson = lessons.find(l => l.id === id);
                if (!lesson) return showToast('Lesson not found.', 'error');
                editingId = id;
                document.getElementById('formTitle').textContent = '✏️ Edit Lesson';
                fillForm(lesson);
                document.getElementById('saveBtn').textContent = '💾 Update Lesson';
                document.getElementById('cancelBtn').style.display = 'inline-block';
                switchDesktopTab('edit');
                switchTab('edit');
                document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
                schedulePreviewUpdate();
            };
            window.cancelEdit = function() { resetForm(); showToast('Edit cancelled.', 'info'); };

            window.saveLesson = function() {
                const mainTitle = document.getElementById('fMainTitle').value.trim();
                const subtitle = document.getElementById('fSubtitle').value.trim() || 'SHORT VOWEL';
                if (!mainTitle) return showToast('Main Title is required.', 'error');
                const sections = JSON.parse(JSON.stringify(tempSections));
                if (editingId) {
                    const idx = lessons.findIndex(l => l.id === editingId);
                    if (idx === -1) return showToast('Lesson not found.', 'error');
                    lessons[idx] = { ...lessons[idx], mainTitle, subtitle, sections, id: editingId };
                    lessons[idx].lessonNumber = idx + 1;
                } else {
                    const newLesson = { mainTitle, subtitle, sections, id: generateId() };
                    newLesson.lessonNumber = lessons.length + 1;
                    lessons.push(newLesson);
                }
                renumberByOrder(lessons);
                saveData();
                resetForm();
                refreshUI();
                showToast('Lesson saved.', 'success');
            };

            window.deleteLesson = function(id) {
                const lesson = lessons.find(l => l.id === id);
                if (!lesson) return;
                confirmDialog(`Delete Lesson ${lesson.lessonNumber}?`, () => {
                    lessons = lessons.filter(l => l.id !== id);
                    if (editingId === id) resetForm();
                    renumberByOrder(lessons);
                    saveData();
                    refreshUI();
                });
            };
            window.duplicateLesson = function(id) {
                const lesson = lessons.find(l => l.id === id);
                if (!lesson) return;
                const copy = JSON.parse(JSON.stringify(lesson));
                delete copy.id; copy.id = generateId();
                lessons.push(copy);
                renumberByOrder(lessons);
                saveData();
                refreshUI();
                showToast('Lesson duplicated.', 'success');
            };
            window.exportJSON = function() {
                const blob = new Blob([JSON.stringify({ lessons, sightWords, coverData }, null, 2)], { type: 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lessons_v8.json'; a.click();
            };
            window.importJSON = function(input) {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data || typeof data !== 'object') throw new Error('Invalid');
                        confirmDialog('Replace all data with imported file?', () => {
                            if (Array.isArray(data.lessons)) {
                                lessons = data.lessons.map(l => migrateToSections(l));
                                resyncNextId();
                                lessons.forEach(l => { if (!l.id) l.id = generateId(); });
                                resyncNextId();
                            } else {
                                lessons = JSON.parse(JSON.stringify(DEFAULT_LESSONS));
                                resyncNextId();
                            }
                            sightWords = Array.isArray(data.sightWords) ? [...data.sightWords] : [...DEFAULT_SIGHT_WORDS];
                            coverData = data.coverData || { ...DEFAULT_COVER };
                            renumberByOrder(lessons);
                            saveData();
                            resetForm();
                            refreshUI();
                            showToast('Data imported.', 'success');
                        });
                    } catch (err) { showToast('Invalid JSON file.', 'error'); }
                };
                reader.readAsText(file);
                input.value = '';
            };
            window.saveSightWords = function() {
                sightWords = document.getElementById('fSightWords').value.split(',').map(s => s.trim()).filter(Boolean);
                saveData(); refreshUI(); showToast('Sight words saved.', 'success');
            };
            window.saveCover = function() {
                coverData = {
                    title: document.getElementById('coverTitleInput').value.trim() || DEFAULT_COVER.title,
                    subtitle: document.getElementById('coverSubtitleInput').value.trim() || DEFAULT_COVER.subtitle
                };
                saveData(); schedulePreviewUpdate(); showToast('Cover updated.', 'success');
            };

            function refreshUI() {
                renderEditList();
                schedulePreviewUpdate();
                updateCounts();
            }

            function renderEditList() {
                const container = document.getElementById('lessonList');
                const q = (window.searchQuery || '').toLowerCase();
                const filtered = lessons.filter(l => {
                    if (!q) return true;
                    return String(l.lessonNumber).includes(q) || (l.mainTitle || '').toLowerCase().includes(q) ||
                           (l.sections?.some(s => s.letterTile && s.letterTile.toLowerCase().includes(q)));
                });
                container.innerHTML = filtered.length ? filtered.map(l => {
                    const tileSection = l.sections?.find(s => s.type === 'tile');
                    const tileLabel = tileSection ? (tileSection.tileMode === 'letter' ? tileSection.letterTile : '🖼️') : '—';
                    return `<div class="lesson-item" data-id="${l.id}">
                        <div class="thumb">📄</div>
                        <div class="info">
                            <div class="title">Lesson ${l.lessonNumber} — ${escapeHtml(l.mainTitle)} · ${escapeHtml(tileLabel)}</div>
                            <div class="sub">${l.sections?.length || 0} sections</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-primary btn-xs" onclick="editLesson('${l.id}')">✏️</button>
                            <button class="btn btn-warning btn-xs" onclick="duplicateLesson('${l.id}')">📋</button>
                            <button class="btn btn-danger btn-xs" onclick="deleteLesson('${l.id}')">🗑️</button>
                        </div>
                    </div>`;
                }).join('') : '<div style="text-align:center;padding:40px;color:#6c757d;">No lessons found.</div>';
                document.getElementById('listCount').textContent = filtered.length + ' / ' + lessons.length;
                const sp = document.getElementById('sightWordsPreview');
                if (sp) sp.innerHTML = sightWords.length ? sightWords.map(w => `<span style="display:inline-block;margin:3px;padding:5px 10px;background:#E2571C;color:#fff;border-radius:8px;font-weight:600;font-size:13px;">${escapeHtml(w)}</span>`).join('') : '<span style="color:#6c757d;">No sight words yet.</span>';
            }

            function updateCounts() {
                document.getElementById('lessonCount').textContent = lessons.length + ' lessons, ' + sightWords.length + ' sight words';
                const tocPages = lessons.length ? Math.ceil(lessons.length / MAX_TOC_PER_PAGE) : 0;
                const swPages = Math.ceil(sightWords.length / MAX_SIGHT_WORDS_PER_PAGE) || 0;
                document.getElementById('viewInfo').textContent = `📄 ${lessons.length} lessons · ${1 + tocPages + swPages + lessons.length} pages`;
            }

            // Export functions - exactly as pasted code sequence
            window.exportSinglePage = function(pageEl) {
                const clone = pageEl.cloneNode(true);
                clone.querySelector('.page-actions')?.remove();
                const win = window.open('', '_blank');
                const styles = document.querySelector('style').outerHTML;
                win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Export</title>${styles}</head><body style="padding:0;background:#fff;margin:0;display:flex;justify-content:center;"><div class="view-container" style="overflow:visible;display:flex;flex-direction:column;align-items:center;">${clone.outerHTML}</div></body></html>`);
                win.document.close(); win.focus(); setTimeout(() => win.print(), 400);
            };
            window.exportAllPages = function() {
                if (!lessons.length && !sightWords.length) return showToast('No lessons or sight words.', 'warning');
                const container = document.querySelector('.view-container').cloneNode(true);
                container.querySelectorAll('.page-actions').forEach(el => el.remove());
                const win = window.open('', '_blank');
                const styles = document.querySelector('style').outerHTML;
                win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>All Pages</title>${styles}</head><body style="padding:0;background:#fff;margin:0;"><div class="view-container" style="overflow:visible;display:block;">${container.innerHTML}</div></body></html>`);
                win.document.close(); win.focus(); setTimeout(() => win.print(), 400);
            };

            // Tab switching
            window.switchTab = function(tab) {
                document.querySelectorAll('.tabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === tab + 'Panel'));
                if (tab === 'edit') renderEditList();
                if (tab === 'view') renderLivePreview();
                updateCounts();
            };

            window.switchDesktopTab = function(tab) {
                document.querySelectorAll('.desktop-left-tabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
                document.querySelectorAll('.left-pane .tab-panel').forEach(p => p.classList.toggle('active', p.id === tab + 'Panel'));
                if (tab === 'edit') renderEditList();
                if (tab === 'book') {
                    document.getElementById('coverTitleInput').value = coverData.title;
                    document.getElementById('coverSubtitleInput').value = coverData.subtitle;
                }
            };

            // ---------- Initialization ----------
            async function initApp() {
                await loadData();
                document.getElementById('app').innerHTML = `
                    <div class="app-header"><h1>📚 Phonics Lesson Publisher v8</h1><span class="badge" id="lessonCount">0</span></div>
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="edit" onclick="switchTab('edit')">✏️ Edit</button>
                        <button class="tab-btn" data-tab="book" onclick="switchTab('book')">📘 Book</button>
                        <button class="tab-btn" data-tab="view" onclick="switchTab('view')">👁️ View</button>
                    </div>
                    <div class="panels-container">
                        <div class="left-pane">
                            <div class="desktop-left-tabs">
                                <button class="tab-btn active" data-tab="edit" onclick="switchDesktopTab('edit')">✏️ Lesson</button>
                                <button class="tab-btn" data-tab="book" onclick="switchDesktopTab('book')">📘 Cover & Lists</button>
                            </div>
                            <div class="tab-panel active" id="editPanel">
                                <div class="edit-layout">
                                    <div class="form-section">
                                        <h2 id="formTitle">➕ Add New Lesson</h2>
                                        <div class="form-group"><label>Main Title</label><input id="fMainTitle" value="SHORT VOWEL CVC WORDS"></div>
                                        <div class="form-group"><label>Subtitle</label><input id="fSubtitle" value="SHORT VOWEL"></div>
                                        <div class="form-group"><label>Lesson Number (auto)</label><input id="fLessonNumber" readonly style="background:#f0f0f0;"></div>

                                        <div class="section-card">
                                            <h4>Page Sections</h4>
                                            <p style="font-size:12px;color:#6c757d;margin-bottom:8px;">Add sections and choose their width, font, and style.</p>
                                            <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
                                                ${Object.keys(SECTION_TYPES).map(type => `<button class="btn btn-outline btn-sm" onclick="addSection('${type}')">+ ${SECTION_TYPES[type].label}</button>`).join('')}
                                            </div>
                                            <div id="sectionsContainer"></div>
                                        </div>

                                        <div class="form-actions">
                                            <button class="btn btn-primary" id="saveBtn" onclick="saveLesson()">💾 Save Lesson</button>
                                            <button class="btn btn-outline" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="tab-panel" id="bookPanel">
                                <div style="margin-bottom:20px;border-bottom:2px solid #e9ecef;padding-bottom:20px;">
                                    <h3>📘 Cover Page</h3>
                                    <div class="form-group"><label>Cover Title</label><input id="coverTitleInput" value="${escapeHtml(coverData.title)}"></div>
                                    <div class="form-group"><label>Cover Subtitle</label><input id="coverSubtitleInput" value="${escapeHtml(coverData.subtitle)}"></div>
                                    <button class="btn btn-success btn-sm" onclick="saveCover()">💾 Save Cover</button>
                                </div>
                                <h2>📖 All Lessons</h2>
                                <div class="list-toolbar">
                                    <input class="search-box" placeholder="🔍 Search..." oninput="window.searchQuery=this.value;window.renderEditList()">
                                    <span class="count" id="listCount">0/0</span>
                                    <button class="btn btn-success btn-sm" onclick="exportJSON()">📤 Export</button>
                                    <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">📥 Import</button>
                                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
                                </div>
                                <div class="lesson-list" id="lessonList"></div>
                                <div style="margin-top:28px;border-top:2px solid #e9ecef;padding-top:20px;">
                                    <h3>📝 Sight Words</h3>
                                    <div class="form-group"><textarea id="fSightWords" rows="3"></textarea></div>
                                    <button class="btn btn-success btn-sm" onclick="saveSightWords()">💾 Save Sight Words</button>
                                    <div style="margin-top:10px;"><strong>Preview:</strong><div id="sightWordsPreview" style="margin-top:6px;"></div></div>
                                </div>
                            </div>
                        </div>
                        <div class="right-pane">
                            <div class="view-toolbar">
                                <span class="info" id="viewInfo">0 lessons · 0 pages</span>
                                <button class="btn btn-success" onclick="exportAllPages()">⬇ Export All</button>
                            </div>
                            <div class="view-container" id="viewContainer"></div>
                        </div>
                    </div>`;

                document.getElementById('fSightWords').value = sightWords.join(', ');
                resetForm();
                renderEditList();
                schedulePreviewUpdate();
                updateCounts();
                window.renderEditList = renderEditList;
                switchDesktopTab('edit');
                if (window.innerWidth < 1200) {
                    switchTab('edit');
                }
            }

            initApp();
        })();
    </script>
</body>
</html>
