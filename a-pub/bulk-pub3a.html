<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 Phonics Lesson Publisher</title>
    <style>
        @page { size: 850px 1100px; margin: 0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; background: #f5f7fa; color: #1a1a1a; padding: 20px; }
        .app { max-width: 1400px; margin: 0 auto; background: #fff; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); overflow: hidden; }
        .app-header { background: #1a1a2e; color: #fff; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .app-header h1 { font-size: 24px; font-weight: 800; }
        .app-header .badge { background: #F5A623; color: #1a1a1a; padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; }
        .tabs { display: flex; border-bottom: 2px solid #e9ecef; background: #fafbfc; padding: 0 32px; gap: 4px; }
        .tab-btn { padding: 16px 28px; border: none; background: transparent; font-size: 15px; font-weight: 700; color: #6c757d; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; font-family: inherit; }
        .tab-btn:hover { color: #1a1a2e; }
        .tab-btn.active { color: #1a1a2e; border-bottom-color: #F5A623; }
        .tab-panel { display: none; padding: 24px 32px 32px; }
        .tab-panel.active { display: block; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: 420px; width: 100%; pointer-events: none; }
        .toast { padding: 14px 20px; border-radius: 12px; color: #fff; font-weight: 600; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 10px; pointer-events: auto; }
        .toast.success { background: #2d7d46; } .toast.error { background: #dc3545; } .toast.warning { background: #e67e22; } .toast.info { background: #2c7be5; }
        .toast .close-toast { background: none; border: none; color: inherit; font-size: 18px; cursor: pointer; margin-left: auto; opacity: 0.7; }
        .toast .close-toast:hover { opacity: 1; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .edit-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
        @media (max-width: 1100px) { .edit-layout { grid-template-columns: 1fr; } }
        .form-section { background: #f8f9fa; border-radius: 16px; padding: 24px; border: 2px solid #e9ecef; position: sticky; top: 20px; max-height: calc(100vh - 200px); overflow-y: auto; }
        .form-section h2 { font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .form-section h2 .edit-id { color: #6c757d; font-weight: 400; font-size: 14px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 700; font-size: 13px; color: #495057; margin-bottom: 4px; }
        .form-group label .req { color: #dc3545; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; border: 2px solid #dee2e6; border-radius: 10px; font-size: 14px; font-family: inherit; transition: border 0.2s; background: #fff; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #F5A623; box-shadow: 0 0 0 3px rgba(245,166,35,0.15); }
        .form-group textarea { resize: vertical; min-height: 50px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
        .form-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .btn { padding: 10px 22px; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #F5A623; color: #1a1a1a; }
        .btn-primary:hover:not(:disabled) { background: #e0950f; transform: translateY(-1px); }
        .btn-success { background: #2d7d46; color: #fff; }
        .btn-success:hover:not(:disabled) { background: #1f5f34; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #b02a37; }
        .btn-outline { background: transparent; border: 2px solid #dee2e6; color: #495057; }
        .btn-outline:hover:not(:disabled) { background: #f1f3f5; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn-xs { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
        .btn-warning { background: #e67e22; color: #fff; }
        .btn-warning:hover:not(:disabled) { background: #cf6d17; }
        .list-section { min-height: 400px; }
        .list-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 2px solid #e9ecef; }
        .search-box { flex: 1; min-width: 180px; padding: 10px 16px; border: 2px solid #dee2e6; border-radius: 10px; font-size: 14px; font-family: inherit; }
        .search-box:focus { outline: none; border-color: #F5A623; }
        .list-toolbar .count { font-weight: 700; color: #6c757d; font-size: 14px; white-space: nowrap; }
        .lesson-list { display: flex; flex-direction: column; gap: 8px; }
        .lesson-list .empty-state { text-align: center; padding: 60px 20px; color: #6c757d; }
        .lesson-list .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .lesson-list .empty-state h3 { color: #1a1a1a; margin-bottom: 4px; }
        .lesson-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #f8f9fa; border-radius: 12px; border: 2px solid transparent; transition: all 0.2s; cursor: grab; user-select: none; }
        .lesson-item:hover { border-color: #F5A623; background: #fff; }
        .lesson-item.dragging { opacity: 0.4; border-color: #F5A623; background: #fff8e7; }
        .lesson-item .drag-handle { color: #adb5bd; font-size: 20px; cursor: grab; line-height: 1; flex-shrink: 0; }
        .lesson-item .drag-handle:active { cursor: grabbing; }
        .lesson-item .info { flex: 1; min-width: 0; }
        .lesson-item .info .title { font-weight: 700; font-size: 15px; }
        .lesson-item .info .sub { font-size: 13px; color: #6c757d; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lesson-item .actions { display: flex; gap: 4px; flex-shrink: 0; }
        .lesson-item.drag-over { border-color: #F5A623; background: #fff8e7; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 9998; animation: fadeIn 0.2s ease; }
        .modal-overlay .modal { background: #fff; border-radius: 20px; padding: 32px; max-width: 440px; width: 90%; box-shadow: 0 30px 60px rgba(0,0,0,0.2); }
        .modal-overlay .modal h3 { margin-bottom: 8px; }
        .modal-overlay .modal p { color: #6c757d; margin-bottom: 20px; font-size: 15px; }
        .modal-overlay .modal .actions { display: flex; gap: 10px; justify-content: flex-end; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        /* ----- VIEW TAB ----- */
        .view-container { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
        .view-container .page { width: 850px; min-width: 850px; min-height: 1080px; padding: 30px 40px; position: relative; page-break-after: always; margin: 0 auto 30px; background: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .view-container .page:last-child { margin-bottom: 0; }
        .view-container .card { border: 3px solid #F5A623; border-radius: 28px; min-height: 1000px; padding: 24px 32px; position: relative; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .view-container .title { font-size: 30px; font-weight: 800; color: #1a1a1a; letter-spacing: 0.5px; margin: 4px 0 18px 0; }
        .view-container .header-row { display: flex; align-items: stretch; gap: 0; margin-bottom: 22px; }
        .view-container .lesson-badge { background: #F5A623; border-radius: 16px; color: #fff; width: 130px; min-width: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 6px; position: relative; margin-right: 18px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .view-container .lesson-badge .arrow { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 22px solid transparent; border-right: 22px solid transparent; border-bottom: 26px solid #F5A623; }
        .view-container .lesson-badge .label { font-size: 13px; font-weight: 600; opacity: 0.95; }
        .view-container .lesson-badge .num { font-size: 34px; font-weight: 800; line-height: 1.1; }
        .view-container .intro-box { flex: 1; border: 3px dashed #E2571C; border-radius: 16px; display: flex; align-items: center; padding: 14px 20px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .view-container .intro-box p { margin: 0; color: #E2571C; font-weight: 700; font-size: 14px; line-height: 1.5; }
        .view-container .hero-tile { background: #F5A623; color: #fff; border-radius: 24px; padding: 30px 40px; text-align: center; margin-bottom: 22px; box-shadow: 0 10px 24px rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .view-container .hero-tile .sound-label { font-size: 18px; font-weight: 700; opacity: 0.95; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 8px; }
        .view-container .hero-tile .letter-display { font-size: 90px; font-weight: 800; line-height: 1.1; text-shadow: 3px 3px 6px rgba(0,0,0,0.25); margin: 8px 0; }
        .view-container .hero-tile .decoration { font-size: 22px; opacity: 0.7; margin-top: 8px; }
        .view-container .section-header { display: flex; align-items: center; margin-bottom: 10px; margin-top: 12px; }
        .view-container .section-header .circle { background: #F5A623; color: #fff; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; margin-right: 14px; flex-shrink: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .view-container .section-header .label-box { flex: 1; border: 3px dashed #E2571C; border-radius: 14px; padding: 8px 18px; font-weight: 800; font-size: 19px; color: #1a1a1a; }
        .view-container .word-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .view-container .word-grid .pill { background: #E2571C; color: #fff; border-radius: 14px; text-align: center; padding: 8px 6px; font-weight: 600; font-size: 28px; min-height: 60px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .view-container .word-grid.blanks .pill { background: #fff; color: #E2571C; border: 2px solid #F5A623; min-height: 60px; }
        .view-container .word-grid.empty .pill { background: #fff; border: 2px solid #F5A623; min-height: 60px; }
        .view-container .instructions { font-weight: 700; font-size: 13px; margin: 8px 0 10px 0; color: #1a1a1a; }
        .view-container .reading-box { border: 2px solid #F5A623; border-radius: 16px; padding: 12px 22px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .view-container .reading-box p { margin: 0 0 5px 0; color: #E2571C; font-weight: 700; font-size: 18px; }
        .view-container .reading-box p:last-child { margin-bottom: 0; }
        .view-container .activity-label { font-weight: 700; font-size: 13px; margin: 10px 0 6px 0; }
        .view-container .sentence-line { border-bottom: 1px solid #999; padding: 15px 0 25px 0; font-size: 16px; color: #E2571C; font-weight: 800; }
        .view-container .card .page-number { position: absolute; bottom: 20px; right: 30px; margin: 0; font-weight: 800; font-size: 16px; color: #1a1a1a; }
        .view-container .page-actions { text-align: right; margin-bottom: 8px; }
        .view-container .export-btn { background: #E2571C; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-weight: 700; font-size: 13px; font-family: inherit; cursor: pointer; }
        .view-container .export-btn:hover { background: #c8481a; }

        /* ----- TOC adjustments ----- */
        .toc-card {
            border: 3px solid #F5A623; border-radius: 28px;
            min-height: 1000px; padding: 40px 48px; position: relative;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
            font-family: 'Times New Roman', Times, serif;
        }
        .toc-title {
            font-size: 32px; font-weight: 800; color: #1a1a2e; text-align: center;
            margin-bottom: 30px; border-bottom: 4px solid #F5A623; padding-bottom: 16px;
        }
        .toc-list { list-style: none; padding: 0; margin: 0; }
        .toc-item {
            display: flex; justify-content: space-between; align-items: baseline;
            padding: 12px 8px; border-bottom: 1px dashed #dee2e6;
            font-size: 16px; font-weight: 600; color: #1a1a1a;
        }
        .toc-item .toc-lesson-title { flex: 1; text-align: left; padding-right: 20px; }
        .toc-item .toc-page-num { font-weight: 800; color: #E2571C; min-width: 80px; text-align: right; }
        .toc-card .page-number {
            position: absolute; bottom: 20px; right: 30px; margin: 0;
            font-weight: 800; font-size: 16px; color: #1a1a1a;
            font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
        }

        .view-toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid #e9ecef; }
        .view-toolbar .info { font-weight: 700; color: #6c757d; font-size: 14px; margin-right: auto; }
        @media (max-width: 900px) {
            .view-container .page { width: 850px; min-width: 850px; }
            .edit-layout { grid-template-columns: 1fr; }
            .form-section { position: static; max-height: none; }
            .app-header h1 { font-size: 20px; }
            .tabs { padding: 0 16px; }
            .tab-btn { padding: 12px 18px; font-size: 13px; }
            .tab-panel { padding: 16px; }
        }
        @media print {
            body { padding: 0; background: #fff; }
            .app, .app-header, .tabs, .tab-panel, .view-toolbar, .no-print { display: none !important; }
            .view-container { overflow-x: visible !important; }
            .view-container .page { box-shadow: none !important; border-radius: 0 !important; margin: 0 auto !important; padding: 30px 30px !important; width: 850px !important; min-width: 850px !important; min-height: 1080px !important; page-break-after: always; background: #fff !important; }
            .view-container .page .page-actions { display: none !important; }
            .view-container .page:last-child { page-break-after: auto; }
            .view-container .card, .view-container .lesson-badge, .view-container .hero-tile,
            .view-container .word-grid .pill, .view-container .intro-box, .view-container .section-header .circle,
            .view-container .reading-box, .view-container .lesson-badge .arrow, .toc-card {
                -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            const STORAGE_KEY = 'phonics_lessons_v2';
            const MAX_TOC_PER_PAGE = 18;
            const MAX_SIGHT_WORDS_PER_PAGE = 28;   // 4 columns × 7 rows

            function flattenWords(arr) {
                if (!Array.isArray(arr)) return [];
                let result = [];
                for (let row of arr) if (Array.isArray(row)) result = result.concat(row);
                return result;
            }
            function escapeHtml(str) {
                return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            }
            function showToast(msg, type = 'info') {
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.innerHTML = `<span>${type==='success'?'✅':type==='error'?'❌':'ℹ️'}</span> ${escapeHtml(msg)}`;
                document.getElementById('toastContainer').appendChild(toast);
                setTimeout(() => toast.remove(), 3500);
            }
            function confirmDialog(msg, cb) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `<div class="modal"><h3>⚠️ Confirm</h3><p>${msg}</p><div class="actions"><button class="btn btn-outline cancel">Cancel</button><button class="btn btn-danger confirm">Yes</button></div></div>`;
                document.body.appendChild(overlay);
                overlay.querySelector('.cancel').onclick = () => overlay.remove();
                overlay.querySelector('.confirm').onclick = () => { overlay.remove(); cb(); };
            }

            // ---------- Default data (3 lessons + sight words) ----------
            const DEFAULT_LESSONS = [
  {
    "id": "l1",
    "mainTitle": "SHORT VOWEL CVC WORDS",
    "lessonNumber": 1,
    "letterTile": "Aa",
    "introText": "Short a says /a/ like in apple — when a single vowel is boxed in between two consonants, it usually keeps this quick, clipped sound instead of saying its name. Say each picture word out loud and listen for this pattern.",
    "words": [
      ["bag", "cat", "mat", "hat"],
      ["rat", "bat", "sat", "pat"],
      ["fat", "man", "van", "map"]
    ],
    "sentences": [
      "I see a bag.",
      "Look at the cat and the mat.",
      "Is this a hat?",
      "I like my rat.",
      "We have a bat."
    ],
    "fillBlanks": ["b_g", "c_t", "m_t", "h_t", "r_t", "b_t", "s_t", "p_t", "f_t", "m_n", "v_n", "m_p"]
  },
  {
    "id": "l2",
    "mainTitle": "SHORT VOWEL CVC WORDS",
    "lessonNumber": 2,
    "letterTile": "Ee",
    "introText": "Short e says /e/ like in egg — in a closed CVC word, a lone e squeezed between consonants stays short and fast. Say each picture word out loud and listen for this pattern.",
    "words": [
      ["get", "wet", "net", "let"],
      ["pen", "ten", "hen", "men"],
      ["bed", "red", "led", "fed"]
    ],
    "sentences": [
      "They will get a wet.",
      "Here is a little net.",
      "Can you find the let?",
      "I have a big pen and a ten.",
      "Go get the hen for me."
    ],
    "fillBlanks": ["g_t", "w_t", "n_t", "l_t", "p_n", "t_n", "h_n", "m_n", "b_d", "r_d", "l_d", "f_d"]
  },
  {
    "id": "l3",
    "mainTitle": "SHORT VOWEL CVC WORDS",
    "lessonNumber": 3,
    "letterTile": "Ii",
    "introText": "Short i says /i/ like in igloo — notice how quickly your mouth taps the sound when i sits alone between two consonants. Say each picture word out loud and listen for this pattern.",
    "words": [
      ["sit", "fix", "hit", "win"],
      ["pin", "big", "pig", "dig"],
      ["lid", "kid", "hid", "rip"]
    ],
    "sentences": [
      "That is my sit.",
      "Where is the fix?",
      "I want the hit, not the win.",
      "She will help with the pin.",
      "Now we can see the big and the pig."
    ],
    "fillBlanks": ["s_t", "f_x", "h_t", "w_n", "p_n", "b_g", "p_g", "d_g", "l_d", "k_d", "h_d", "r_p"]
  },
  {
    "id": "l4",
    "mainTitle": "SHORT VOWEL CVC WORDS",
    "lessonNumber": 4,
    "letterTile": "Oo",
    "introText": "Short o says /o/ like in octopus — a single o closed in by consonants stays short instead of stretching into its long name sound. Say each picture word out loud and listen for this pattern.",
    "words": [
      ["pot", "hot", "not", "lot"],
      ["got", "dog", "log", "fog"],
      ["hop", "mop", "top", "cop"]
    ],
    "sentences": [
      "Look at the pot and the hot.",
      "Is this a not?",
      "I like my lot.",
      "We have a got.",
      "You can see the dog."
    ],
    "fillBlanks": ["p_t", "h_t", "n_t", "l_t", "g_t", "d_g", "l_g", "f_g", "h_p", "m_p", "t_p", "c_p"]
  },
  {
    "id": "l5",
    "mainTitle": "SHORT VOWEL CVC WORDS",
    "lessonNumber": 5,
    "letterTile": "Uu",
    "introText": "Short u says /u/ like in umbrella — this vowel keeps its short, punchy sound whenever it's boxed in by consonants on both sides. Say each picture word out loud and listen for this pattern.",
    "words": [
      ["sum", "fun", "bun", "mud"],
      ["but", "sun", "run", "cup"],
      ["bug", "rug", "hug", "tub"]
    ],
    "sentences": [
      "Here is a little sum.",
      "Can you find the fun?",
      "I have a big bun and a mud.",
      "Go get the but for me.",
      "We will play with the sun."
    ],
    "fillBlanks": ["s_m", "f_n", "b_n", "m_d", "b_t", "s_n", "r_n", "c_p", "b_g", "r_g", "h_g", "t_b"]
  },
  {
    "id": "l6",
    "mainTitle": "SPECIAL CONSONANTS",
    "lessonNumber": 6,
    "letterTile": "x (ks)",
    "introText": "The letter x usually stands for two sounds blended together, /k/ and /s/, especially at the end of a word like box or fix. Say each picture word out loud and listen for this pattern.",
    "words": [
      ["box", "fox", "mix", "six"],
      ["ax", "ox", "fix", "wax"],
      ["tax", "next", "flex", "text"]
    ],
    "sentences": [
      "Where is the box?",
      "I want the fox, not the mix.",
      "She will help with the six.",
      "Now we can see the ax and the ox.",
      "Put the fix here."
    ],
    "fillBlanks": ["b_x", "f_x", "m_x", "s_x", "a_", "o_", "f_x", "w_x", "t_x", "n__t", "f__x", "t__t"]
  },
  {
    "id": "l7",
    "mainTitle": "SPECIAL CONSONANTS",
    "lessonNumber": 7,
    "letterTile": "qu",
    "introText": "The letter q never travels alone in English — it always teams up with u, and together qu makes the /kw/ sound heard in quit and queen. Say each picture word out loud and listen for this pattern.",
    "words": [
      ["quit", "queen", "quiz", "quick"],
      ["quack", "quill", "quilt", "quest"],
      ["quench", "quote", "quail", "quirk"]
    ],
    "sentences": [
      "Is this a quit?",
      "I like my queen.",
      "We have a quiz.",
      "You can see the quick.",

            const DEFAULT_SIGHT_WORDS = [
                'the','and','is','in','it','you','that','he','she','we','they','but'
            ];

            let lessons = [];
            let sightWords = [];
            let editingId = null;
            let nextId = 1;

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        // Backward compatibility: if it's an array, it's old lessons-only format
                        if (Array.isArray(parsed)) {
                            lessons = parsed;
                            sightWords = [...DEFAULT_SIGHT_WORDS];
                        } else if (parsed && typeof parsed === 'object') {
                            lessons = parsed.lessons || [];
                            sightWords = parsed.sightWords || [...DEFAULT_SIGHT_WORDS];
                        }
                        if (lessons.length) {
                            let maxId = 0;
                            lessons.forEach(l => {
                                if (!l.id) l.id = 'l' + Date.now() + Math.random().toString(36).slice(2,6);
                                if (!l.mainTitle) l.mainTitle = 'SHORT VOWEL CVC WORDS';
                                if (l.words && l.words.length && !Array.isArray(l.words[0])) {
                                    const flat = l.words;
                                    const chunked = [];
                                    for (let i=0;i<flat.length;i+=4) chunked.push(flat.slice(i,i+4));
                                    l.words = chunked;
                                }
                                const num = parseInt(l.id.replace('l','')) || 0;
                                if (num > maxId) maxId = num;
                            });
                            nextId = maxId + 1;
                        } else {
                            lessons = JSON.parse(JSON.stringify(DEFAULT_LESSONS));
                            nextId = lessons.length + 1;
                        }
                        return;
                    }
                } catch(e) {}
                lessons = JSON.parse(JSON.stringify(DEFAULT_LESSONS));
                sightWords = [...DEFAULT_SIGHT_WORDS];
                nextId = lessons.length + 1;
                saveData();
            }
            function saveData() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ lessons, sightWords }));
                } catch(e) { showToast('Storage full – delete some lessons.', 'error'); }
            }
            function generateId() { return 'l' + (nextId++); }

            // ---------- VIEW RENDERING (hero-tile, no images) ----------
            function createWordGrid(words, cls = '') {
                const grid = document.createElement('div');
                grid.className = 'word-grid ' + cls;
                words.forEach(w => { const d = document.createElement('div'); d.className = 'pill'; d.textContent = w; grid.appendChild(d); });
                return grid;
            }

            function buildPageOne(lesson, pageNum) {
                const page = document.createElement('div'); page.className = 'page';
                page.innerHTML = `<div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div>`;
                const card = document.createElement('div'); card.className = 'card';
                card.innerHTML = `
                    <div class="title">${escapeHtml(lesson.mainTitle)}</div>
                    <div class="header-row">
                        <div class="lesson-badge"><div class="arrow"></div><div class="label">Lesson</div><div class="num">${lesson.lessonNumber}</div></div>
                        <div class="intro-box"><p>${escapeHtml(lesson.introText)}</p></div>
                    </div>
                    <div class="hero-tile"><div class="sound-label">Today's Sound</div><div class="letter-display">${escapeHtml(lesson.letterTile)}</div><div class="decoration">✦ ✦ ✦</div></div>
                    <div class="section-header"><div class="circle">1</div><div class="label-box">Look and say aloud</div></div>`;
                card.appendChild(createWordGrid(flattenWords(lesson.words)));
                card.innerHTML += `<div class="page-number">${pageNum}</div>`;
                page.appendChild(card);
                return page;
            }

            function buildPageTwo(lesson, pageNum) {
                const page = document.createElement('div'); page.className = 'page';
                page.innerHTML = `<div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div>`;
                const card = document.createElement('div'); card.className = 'card';
                card.innerHTML = `
                    <div class="section-header"><div class="circle">2</div><div class="label-box">Decodable Reading</div></div>
                    <div class="instructions">Read ALOUD and circle all words with the short vowel sound</div>
                    <div class="reading-box">${(lesson.sentences||[]).map((s,i)=>`<p>${i+1}. ${escapeHtml(s)}</p>`).join('')}</div>
                    <div class="section-header"><div class="circle">3</div><div class="label-box">Activities</div></div>
                    <div class="activity-label">A. Fill in the missing letters and say word</div>`;
                card.appendChild(createWordGrid(lesson.fillBlanks||[], 'blanks'));
                card.innerHTML += `<div class="activity-label">B. Copy each word from above</div>`;
                card.appendChild(createWordGrid((lesson.fillBlanks||[]).map(()=>'\u00A0'), 'empty'));
                card.innerHTML += `<div class="activity-label">C. Choose any word from above and form 2 sentences</div>
                    <div class="sentence-line">1.</div><div class="sentence-line">2.</div>
                    <div class="page-number">${pageNum}</div>`;
                page.appendChild(card);
                return page;
            }

            function buildTocPage(pageNum, entries) {
                const page = document.createElement('div'); page.className = 'page';
                page.innerHTML = `<div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div>`;
                const card = document.createElement('div'); card.className = 'toc-card';
                card.innerHTML = `<div class="toc-title">Table of Contents</div><ul class="toc-list">` +
                    entries.map(e => `<li class="toc-item"><span class="toc-lesson-title">Lesson ${e.lessonNumber}: ${escapeHtml(e.mainTitle)}</span><span class="toc-page-num">Page ${e.firstPage}</span></li>`).join('') +
                    `</ul><div class="page-number">${pageNum}</div>`;
                page.appendChild(card);
                return page;
            }

            function buildSightWordsPage(pageNum, words) {
                const page = document.createElement('div'); page.className = 'page';
                page.innerHTML = `<div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div>`;
                const card = document.createElement('div'); card.className = 'card';
                card.innerHTML = `
                    <div class="title">Sight Words Practice</div>
                    <div class="section-header"><div class="circle">★</div><div class="label-box">Read and say each word</div></div>`;
                card.appendChild(createWordGrid(words));
                card.innerHTML += `<div class="page-number">${pageNum}</div>`;
                page.appendChild(card);
                return page;
            }

            window.exportSinglePage = function(pageEl) {
                const clone = pageEl.cloneNode(true);
                clone.querySelector('.page-actions')?.remove();
                const win = window.open('', '_blank');
                const styles = document.querySelector('style').outerHTML;
                win.document.write(`
                    <!DOCTYPE html><html><head><meta charset="UTF-8"><title>Export</title>
                    <style>${styles}</style>
                    </head><body style="padding:0;background:#fff;margin:0;">
                    <div class="view-container" style="overflow:visible;">${clone.outerHTML}</div>
                    </body></html>`);
                win.document.close();
                win.focus();
                setTimeout(() => win.print(), 400);
            };
            window.exportAllPages = function() {
                if (!lessons.length && !sightWords.length) return showToast('No lessons or sight words.', 'warning');
                const container = document.querySelector('.view-container').cloneNode(true);
                container.querySelectorAll('.page-actions').forEach(el => el.remove());
                const win = window.open('', '_blank');
                const styles = document.querySelector('style').outerHTML;
                win.document.write(`
                    <!DOCTYPE html><html><head><meta charset="UTF-8"><title>All Pages</title>
                    <style>${styles}</style>
                    </head><body style="padding:0;background:#fff;margin:0;">
                    <div class="view-container" style="overflow:visible;">${container.outerHTML}</div>
                    </body></html>`);
                win.document.close();
                win.focus();
                setTimeout(() => win.print(), 400);
            };

            function renderAllView() {
                const container = document.getElementById('viewContainer');
                container.innerHTML = '';
                if (!lessons.length && !sightWords.length) {
                    container.innerHTML = '<div style="text-align:center;padding:80px"><h3>No lessons or sight words yet</h3></div>';
                    return;
                }

                // Calculate pages
                const tocPages = lessons.length ? Math.ceil(lessons.length / MAX_TOC_PER_PAGE) : 0;
                const sightWordsPages = Math.ceil(sightWords.length / MAX_SIGHT_WORDS_PER_PAGE);
                const lessonStartPage = tocPages + sightWordsPages + 1;   // after TOC + sight words

                // TOC (lessons only)
                const tocEntries = lessons.map((l, i) => ({
                    lessonNumber: l.lessonNumber,
                    mainTitle: l.mainTitle,
                    firstPage: lessonStartPage + i * 2   // each lesson has 2 pages
                }));
                for (let p = 0; p < tocPages; p++) {
                    const slice = tocEntries.slice(p * MAX_TOC_PER_PAGE, (p + 1) * MAX_TOC_PER_PAGE);
                    container.appendChild(buildTocPage(p + 1, slice));
                }

                // Sight words pages
                let pageNum = tocPages + 1;   // right after TOC
                for (let p = 0; p < sightWordsPages; p++) {
                    const start = p * MAX_SIGHT_WORDS_PER_PAGE;
                    const slice = sightWords.slice(start, start + MAX_SIGHT_WORDS_PER_PAGE);
                    container.appendChild(buildSightWordsPage(pageNum++, slice));
                }

                // Lesson pages
                pageNum = lessonStartPage;   // reset to first lesson page
                lessons.forEach(l => {
                    container.appendChild(buildPageOne(l, pageNum++));
                    container.appendChild(buildPageTwo(l, pageNum++));
                });
            }

            // ---------- EDIT TAB (no image fields) ----------
            function getFormData() {
                const wordsRaw = document.getElementById('fWords').value;
                const words = wordsRaw.split(',').map(s=>s.trim()).filter(Boolean);
                const chunked = [];
                for (let i=0;i<words.length;i+=4) chunked.push(words.slice(i,i+4));
                if (chunked.length === 0) chunked.push([]);
                return {
                    mainTitle: document.getElementById('fMainTitle').value.trim(),
                    lessonNumber: parseInt(document.getElementById('fLessonNumber').value) || 0,
                    letterTile: document.getElementById('fLetterTile').value.trim(),
                    introText: document.getElementById('fIntroText').value.trim(),
                    words: chunked,
                    sentences: document.getElementById('fSentences').value.split(',').map(s=>s.trim()).filter(Boolean),
                    fillBlanks: document.getElementById('fFillBlanks').value.split(',').map(s=>s.trim()).filter(Boolean)
                };
            }
            function fillForm(lesson) {
                document.getElementById('fMainTitle').value = lesson.mainTitle || '';
                document.getElementById('fLessonNumber').value = lesson.lessonNumber || '';
                document.getElementById('fLetterTile').value = lesson.letterTile || '';
                document.getElementById('fIntroText').value = lesson.introText || '';
                document.getElementById('fWords').value = flattenWords(lesson.words||[]).join(', ');
                document.getElementById('fSentences').value = (lesson.sentences||[]).join(', ');
                document.getElementById('fFillBlanks').value = (lesson.fillBlanks||[]).join(', ');
            }
            function resetForm() {
                editingId = null;
                document.getElementById('formTitle').textContent = '➕ Add New Lesson';
                document.getElementById('fMainTitle').value = '';
                document.getElementById('fLessonNumber').value = lessons.length + 1;
                document.getElementById('fLetterTile').value = '';
                document.getElementById('fIntroText').value = '';
                document.getElementById('fWords').value = '';
                document.getElementById('fSentences').value = '';
                document.getElementById('fFillBlanks').value = '';
                document.getElementById('saveBtn').textContent = '💾 Save Lesson';
                document.getElementById('cancelBtn').style.display = 'none';
            }

            window.editLesson = function(id) {
                const lesson = lessons.find(l => l.id === id);
                if (!lesson) return showToast('Lesson not found.', 'error');
                editingId = id;
                document.getElementById('formTitle').textContent = '✏️ Edit Lesson';
                fillForm(lesson);
                document.getElementById('saveBtn').textContent = '💾 Update Lesson';
                document.getElementById('cancelBtn').style.display = 'inline-block';
                document.querySelector('.form-section').scrollIntoView({behavior:'smooth'});
            };
            window.cancelEdit = function() { resetForm(); showToast('Edit cancelled.', 'info'); };
            window.saveLesson = function() {
                const data = getFormData();
                if (!data.mainTitle || !data.lessonNumber || !data.letterTile || !data.introText ||
                    flattenWords(data.words).length<6 || data.sentences.length<2 || data.fillBlanks.length<4)
                    return showToast('Fill all required fields (≥6 words, 2 sentences, 4 blanks).', 'error');
                if (lessons.find(l => l.lessonNumber === data.lessonNumber && l.id !== editingId))
                    return showToast('Lesson number already exists.', 'error');
                if (editingId) {
                    const idx = lessons.findIndex(l => l.id === editingId);
                    if (idx === -1) return showToast('Lesson not found.', 'error');
                    lessons[idx] = { ...lessons[idx], ...data, id: editingId };
                } else {
                    lessons.push({ ...data, id: generateId() });
                }
                saveData(); resetForm(); refreshUI();
                showToast('Lesson saved.', 'success');
            };
            window.deleteLesson = function(id) {
                const lesson = lessons.find(l => l.id === id);
                if (!lesson) return;
                confirmDialog(`Delete Lesson ${lesson.lessonNumber}?`, () => {
                    lessons = lessons.filter(l => l.id !== id);
                    if (editingId === id) resetForm();
                    saveData(); refreshUI();
                });
            };
            window.duplicateLesson = function(id) {
                const lesson = lessons.find(l => l.id === id);
                if (!lesson) return;
                const copy = JSON.parse(JSON.stringify(lesson));
                delete copy.id;
                copy.lessonNumber = Math.max(...lessons.map(l=>l.lessonNumber), 0) + 1;
                copy.id = generateId();
                lessons.push(copy);
                saveData(); refreshUI();
                showToast('Lesson duplicated.', 'success');
            };
            window.exportJSON = function() {
                const blob = new Blob([JSON.stringify({ lessons, sightWords }, null, 2)], {type:'application/json'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'lessons.json';
                a.click();
            };
            window.importJSON = function(input) {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data || typeof data !== 'object' || !data.lessons && !data.sightWords) throw new Error('Invalid format');
                        confirmDialog(`Replace all data with imported file?`, () => {
                            if (Array.isArray(data.lessons)) {
                                lessons = data.lessons.map(l => {
                                    if (!l.id) l.id = generateId();
                                    if (!l.mainTitle) l.mainTitle = 'SHORT VOWEL CVC WORDS';
                                    if (l.words && l.words.length && !Array.isArray(l.words[0])) {
                                        const flat = l.words;
                                        const chunked = [];
                                        for (let i=0;i<flat.length;i+=4) chunked.push(flat.slice(i,i+4));
                                        l.words = chunked;
                                    }
                                    return l;
                                });
                            } else {
                                lessons = JSON.parse(JSON.stringify(DEFAULT_LESSONS));
                            }
                            sightWords = Array.isArray(data.sightWords) ? [...data.sightWords] : [...DEFAULT_SIGHT_WORDS];
                            saveData(); resetForm(); refreshUI();
                            showToast('Data imported.', 'success');
                        });
                    } catch(err) { showToast('Invalid JSON file.', 'error'); }
                };
                reader.readAsText(file);
            };

            // Sight words editing
            window.saveSightWords = function() {
                const raw = document.getElementById('fSightWords').value;
                const words = raw.split(',').map(s => s.trim()).filter(Boolean);
                sightWords = words;
                saveData();
                renderEditList();   // refresh the preview in the list area if needed
                renderAllView();
                updateCounts();
                showToast('Sight words saved.', 'success');
            };

            function refreshUI() { renderEditList(); renderAllView(); updateCounts(); }

            let searchQuery = '';
            function renderEditList() {
                const container = document.getElementById('lessonList');
                const q = searchQuery.toLowerCase();
                const filtered = lessons.filter(l =>
                    !q || String(l.lessonNumber).includes(q) || (l.mainTitle||'').toLowerCase().includes(q) ||
                    (l.letterTile||'').toLowerCase().includes(q) ||
                    (l.introText||'').toLowerCase().includes(q) ||
                    flattenWords(l.words||[]).join(' ').toLowerCase().includes(q) ||
                    (l.sentences||[]).join(' ').toLowerCase().includes(q) ||
                    (l.fillBlanks||[]).join(' ').toLowerCase().includes(q)
                );
                container.innerHTML = filtered.length ? filtered.map(l => `
                    <div class="lesson-item" draggable="true" data-id="${l.id}">
                        <span class="drag-handle">⠿</span>
                        <div class="info">
                            <div class="title">Lesson ${l.lessonNumber} — ${escapeHtml(l.mainTitle)}</div>
                            <div class="sub">${escapeHtml((l.introText||'').slice(0,80))}${(l.introText||'').length>80?'…':''}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-primary btn-xs" onclick="editLesson('${l.id}')">✏️</button>
                            <button class="btn btn-warning btn-xs" onclick="duplicateLesson('${l.id}')">📋</button>
                            <button class="btn btn-danger btn-xs" onclick="deleteLesson('${l.id}')">🗑️</button>
                        </div>
                    </div>`).join('') : '<div class="empty-state">No lessons found.</div>';
                document.getElementById('listCount').textContent = filtered.length + ' / ' + lessons.length;

                // Update sight words preview
                const sightPreview = document.getElementById('sightWordsPreview');
                if (sightPreview) {
                    sightPreview.innerHTML = sightWords.length
                        ? sightWords.map(w => `<span class="pill" style="display:inline-block;margin:4px;padding:6px 12px;">${escapeHtml(w)}</span>`).join('')
                        : '<span style="color:#6c757d;">No sight words yet.</span>';
                }
            }
            function updateCounts() {
                document.getElementById('lessonCount').textContent = lessons.length + ' lessons, ' + sightWords.length + ' sight words';
                const tocPages = lessons.length ? Math.ceil(lessons.length / MAX_TOC_PER_PAGE) : 0;
                const sightWordsPages = Math.ceil(sightWords.length / MAX_SIGHT_WORDS_PER_PAGE);
                const totalPages = tocPages + sightWordsPages + lessons.length * 2;
                document.getElementById('viewInfo').textContent = `📄 ${lessons.length} lessons · ${totalPages} pages (incl. TOC & sight words)`;
            }

            window.switchTab = function(tab) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === tab + 'Panel'));
                if (tab === 'edit') renderEditList();
                if (tab === 'view') renderAllView();
                updateCounts();
            };

            // Init
            loadData();
            document.getElementById('app').innerHTML = `
                <div class="app-header"><h1>📚 Phonics Lesson Publisher</h1><span class="badge" id="lessonCount">0</span></div>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="edit" onclick="switchTab('edit')">✏️ Edit</button>
                    <button class="tab-btn" data-tab="view" onclick="switchTab('view')">👁️ View</button>
                </div>
                <div class="tab-panel active" id="editPanel">
                    <div class="edit-layout">
                        <div class="form-section">
                            <h2 id="formTitle">➕ Add New Lesson</h2>
                            <div class="form-group"><label>Main Title <span class="req">*</span></label><input id="fMainTitle" placeholder="e.g. SHORT VOWEL CVC WORDS"></div>
                            <div class="form-group"><label>Lesson Number <span class="req">*</span></label><input type="number" id="fLessonNumber"></div>
                            <div class="form-row">
                                <div class="form-group"><label>Letter Tile <span class="req">*</span></label><input id="fLetterTile" placeholder="e.g. Aa"></div>
                                <div class="form-group" style="visibility:hidden;pointer-events:none;"></div>
                            </div>
                            <div class="form-group"><label>Intro Text <span class="req">*</span></label><textarea id="fIntroText" rows="2"></textarea></div>
                            <div class="form-group"><label>Words (comma separated) <span class="req">*</span></label><textarea id="fWords" rows="2" placeholder="cat, bat, hat..."></textarea></div>
                            <div class="form-group"><label>Sentences (comma separated) <span class="req">*</span></label><textarea id="fSentences" rows="2"></textarea></div>
                            <div class="form-group"><label>Fill Blanks (comma separated) <span class="req">*</span></label><textarea id="fFillBlanks" rows="2"></textarea></div>
                            <div class="form-actions">
                                <button class="btn btn-primary" id="saveBtn" onclick="saveLesson()">💾 Save Lesson</button>
                                <button class="btn btn-outline" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
                            </div>
                        </div>
                        <div class="list-section">
                            <h2>📖 All Lessons</h2>
                            <div class="list-toolbar">
                                <input class="search-box" id="searchInput" placeholder="🔍 Search lessons..." oninput="searchQuery=this.value;renderEditList()">
                                <span class="count" id="listCount">0/0</span>
                                <button class="btn btn-success btn-sm" onclick="exportJSON()">📤 Export JSON</button>
                                <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">📥 Import</button>
                                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
                            </div>
                            <div class="lesson-list" id="lessonList"></div>

                            <!-- Sight Words Editor -->
                            <div style="margin-top:30px; border-top: 2px solid #e9ecef; padding-top:20px;">
                                <h3>📝 Sight Words</h3>
                                <div class="form-group">
                                    <label>Sight Words (comma separated)</label>
                                    <textarea id="fSightWords" rows="2" placeholder="the, and, is, in..."></textarea>
                                </div>
                                <button class="btn btn-success btn-sm" onclick="saveSightWords()">💾 Save Sight Words</button>
                                <div style="margin-top:12px;">
                                    <strong>Preview:</strong>
                                    <div id="sightWordsPreview" style="margin-top:8px;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-panel" id="viewPanel">
                    <div class="view-toolbar">
                        <span class="info" id="viewInfo">0 lessons · 0 pages</span>
                        <button class="btn btn-success" onclick="exportAllPages()">⬇ Export All</button>
                    </div>
                    <div class="view-container" id="viewContainer"></div>
                </div>`;

            // Fill sight words textarea
            document.getElementById('fSightWords').value = sightWords.join(', ');

            resetForm();
            renderEditList();
            renderAllView();
            updateCounts();

            // Drag-and-drop
            const list = document.getElementById('lessonList');
            list.addEventListener('dragstart', e => {
                const item = e.target.closest('.lesson-item');
                if (item) e.dataTransfer.setData('text/plain', item.dataset.id);
            });
            list.addEventListener('dragover', e => e.preventDefault());
            list.addEventListener('drop', e => {
                e.preventDefault();
                const id = e.dataTransfer.getData('text/plain');
                const target = e.target.closest('.lesson-item');
                if (id && target) {
                    const fromIdx = lessons.findIndex(l => l.id === id);
                    const toIdx = lessons.findIndex(l => l.id === target.dataset.id);
                    if (fromIdx !== -1 && toIdx !== -1 && fromIdx !== toIdx) {
                        const [moved] = lessons.splice(fromIdx, 1);
                        lessons.splice(toIdx, 0, moved);
                        saveData();
                        refreshUI();
                    }
                }
            });

            window.searchQuery = '';
            window.renderEditList = renderEditList;
        })();
    </script>
</body>
</html>
