<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phonics Lessons</title>
<style>
  @page { size: 850px 1100px; margin: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    background: #fff;
  }

  .page {
    width: 850px;
    min-height: 1080px;
    padding: 30px 40px;
    position: relative;
    page-break-after: always;
  }
  .page:last-child { page-break-after: auto; }

  .card {
    border: 3px solid #F5A623;
    border-radius: 28px;
    min-height: 1000px;
    padding: 24px 32px;
    position: relative;
  }

  .title {
    font-size: 30px;
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: 0.5px;
    margin: 4px 0 18px 0;
  }

  .header-row {
    display: flex;
    align-items: stretch;
    gap: 0;
    margin-bottom: 22px;
  }

  .lesson-badge {
    background: #F5A623;
    border-radius: 16px;
    color: #fff;
    width: 130px;
    min-width: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 6px;
    position: relative;
    margin-right: 18px;
  }
  .lesson-badge .arrow {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 26px solid #F5A623;
  }
  .lesson-badge .label { font-size: 13px; font-weight: 600; opacity: 0.95; }
  .lesson-badge .num { font-size: 34px; font-weight: 800; line-height: 1.1; }

  .intro-box {
    flex: 1;
    border: 3px dashed #E2571C;
    border-radius: 16px;
    display: flex;
    align-items: center;
    padding: 14px 20px;
  }
  .intro-box p {
    margin: 0;
    color: #E2571C;
    font-weight: 700;
    font-size: 14px;
    line-height: 1.5;
  }

  .hero-row {
    display: flex;
    border-radius: 20px;
    overflow: hidden;
    border: 3px solid #F5A623;
    height: 190px;
    margin-bottom: 22px;
  }
  .hero-image {
    flex: 1;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .hero-image img { max-height: 110px; max-width: 80%; object-fit: contain; }
  .hero-image .placeholder {
    width: 100px; height: 100px;
    border: 2px dashed #ccc;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #999; font-size: 12px;
  }
  .hero-image .caption { font-weight: 800; font-size: 18px; color: #1a1a1a; }
  .hero-letter {
    flex: 1;
    background: #F5A623;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 90px;
    font-weight: 800;
    font-style: italic;
  }

  .section-header {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    margin-top: 12px;
  }
  .section-header .circle {
    background: #F5A623;
    color: #fff;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px;
    margin-right: 14px;
    flex-shrink: 0;
  }
  .section-header .label-box {
    flex: 1;
    border: 3px dashed #E2571C;
    border-radius: 14px;
    padding: 8px 18px;
    font-weight: 800;
    font-size: 19px;
    color: #1a1a1a;
  }

  .word-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .word-grid .pill {
    background: #E2571C;
    color: #fff;
    border-radius: 14px;
    text-align: center;
    padding: 8px 6px;
    font-weight: 800;
    font-size: 17px;
  }
  .word-grid.blanks .pill {
    background: #fff;
    color: #E2571C;
    border: 2px solid #F5A623;
  }
  .word-grid.empty .pill {
    background: #fff;
    border: 2px solid #F5A623;
    min-height: 44px;
  }

  .instructions {
    font-weight: 700;
    font-size: 13px;
    margin: 8px 0 10px 0;
    color: #1a1a1a;
  }

  .reading-box {
    border: 2px solid #F5A623;
    border-radius: 16px;
    padding: 12px 22px;
  }
  .reading-box p {
    margin: 0 0 5px 0;
    color: #E2571C;
    font-weight: 800;
    font-size: 15px;
  }
  .reading-box p:last-child { margin-bottom: 0; }

  .activity-label { font-weight: 700; font-size: 13px; margin: 10px 0 6px 0; }

  .sentence-line {
    border-bottom: 1px solid #999;
    padding: 3px 0 4px 0;
    font-size: 13px;
    color: #E2571C;
    font-weight: 600;
  }

  .page-number {
    text-align: right;
    margin-top: 16px;
    font-weight: 800;
    font-size: 13px;
    color: #1a1a1a;
  }

  .page-actions {
    text-align: right;
    margin-bottom: 8px;
  }
  .export-btn {
    background: #E2571C;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 700;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .export-btn:hover { background: #c8481a; }

  /* keep colors/borders in print + PDF export */
  .card, .lesson-badge, .hero-letter, .word-grid .pill,
  .intro-box, .section-header .circle, .reading-box {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  @media print {
    .no-print { display: none !important; }
    body.print-single .page { display: none; }
    body.print-single .page.print-target {
      display: block;
      page-break-after: auto !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
// ==================== LESSONS DATA (embedded) ====================
window.LESSONS = [
  {
    lessonNumber: 1,
    letterTile: "Aa",
    imageCaption: "Apple",
    imagePath: "apple.png",   // ← replace with your actual image file
    words: [["cat", "bat", "hat", "mat"], ["dad", "fat", "sat", "rat"], ["jam", "fan", "can", "car"]],
    sentences: ["The cat sat on a mat.", "A rat had a hat.", "The cat is mad.", "The rat ran to a van.", "The cat had a nap."],
    fillBlanks: ["c__t", "b__t", "h__t", "m__t", "d__d", "f__t", "s__t", "r__t"]
  },
  {
    lessonNumber: 2,
    letterTile: "Ee",
    imageCaption: "Net",
    imagePath: "net.png",
    words: [["net", "bed", "hen", "men"], ["let", "fed", "set", "red"], ["jet", "get", "ten", "vet"]],
    sentences: ["Jen has a pet hen.", "The hen is wet.", "Jen gets a red net.", "The hen sits on a bed.", "Ten men let the hen rest."],
    fillBlanks: ["n__t", "b__d", "h__n", "m__n", "l__t", "g__t", "t__n", "r__d"]
  },
  {
    lessonNumber: 3,
    letterTile: "Ii",
    imageCaption: "Pin",
    imagePath: "pin.png",
    // Fixed duplicate 'pit' → changed to 'zip'
    words: [["sit", "hit", "fit", "tin"], ["mix", "lip", "pin", "fix"], ["pit", "win", "sip", "zip"]],
    sentences: ["Tim has a big pig.", "The pig can sit.", "Tim hits the lid.", "The pig digs in the bin.", "Tim wins a pin."],
    fillBlanks: ["s__t", "h__t", "f__t", "t__n", "p__g", "p__t", "s__p", "w__n"]
  },
  {
    lessonNumber: 4,
    letterTile: "Oo",
    imageCaption: "Mop",
    imagePath: "mop.png",
    words: [["hot", "lot", "fox", "top"], ["not", "rot", "got", "pot"], ["bot", "cot", "dot", "mob"]],
    sentences: ["Bob has a red fox.", "The fox hops on a log.", "Bob gets a mop and a pot.", "The fox stops and drops the top.", "Bob hops with the fox."],
    fillBlanks: ["p__t", "B__b", "f__x", "t__p", "l__t", "g__t", "m__p", "h__p"]
  },
  {
    lessonNumber: 5,
    letterTile: "Uu",
    imageCaption: "Bug",
    imagePath: "bug.png",
    words: [["sun", "bug", "run", "hug"], ["gun", "bus", "gum", "rug"], ["fun", "cut", "but", "mud"]],
    sentences: ["Bud has a bug.", "The bug sits on a mug.", "Bud runs to the sun.", "The bug is on the rug.", "Bud hugs the bug."],
    fillBlanks: ["b__t", "b__d", "h__g", "r__g", "s__n", "b__s", "m__d", "g__n"]
  }
];

// ==================== RENDER ENGINE ====================
function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (typeof html !== 'undefined') e.innerHTML = html;
  return e;
}

function wordGrid(words, extraClass) {
  var grid = el('div', 'word-grid ' + (extraClass || ''));
  for (var i = 0; i < words.length; i++) {
    grid.appendChild(el('div', 'pill', words[i]));
  }
  return grid;
}

function exportButton(pageId) {
  var wrap = el('div', 'page-actions no-print');
  var btn = el('button', 'export-btn', 'Export this page to PDF');
  btn.type = 'button';
  btn.onclick = function () { exportSinglePage(pageId); };
  wrap.appendChild(btn);
  return wrap;
}

function exportSinglePage(pageId) {
  var target = document.getElementById(pageId);
  if (!target) return;
  target.classList.add('print-target');
  document.body.classList.add('print-single');
  window.print();
}

window.addEventListener('afterprint', function () {
  document.body.classList.remove('print-single');
  var targets = document.querySelectorAll('.print-target');
  for (var i = 0; i < targets.length; i++) targets[i].classList.remove('print-target');
});

function buildPageOne(lesson, pageId, pageNumber) {
  var page = el('div', 'page');
  page.id = pageId;
  page.appendChild(exportButton(pageId));

  var card = el('div', 'card');
  page.appendChild(card);

  card.appendChild(el('div', 'title', 'SHORT VOWEL CVC WORDS'));

  var headerRow = el('div', 'header-row');
  var badge = el('div', 'lesson-badge');
  badge.appendChild(el('div', 'arrow'));
  badge.appendChild(el('div', 'label', 'Lesson'));
  badge.appendChild(el('div', 'num', lesson.lessonNumber));
  headerRow.appendChild(badge);

  var introBox = el('div', 'intro-box');
  introBox.appendChild(el('p', null,
    'Vowels are letters of the alphabets that we usually say with our mouth open. ' +
    'There are 5 short vowels &ndash; a, e, i, o, u and 5 long vowels &ndash; a, e, i, o, u. ' +
    'The letter Y can sometimes make the vowel sounds.'));
  headerRow.appendChild(introBox);
  card.appendChild(headerRow);

  var heroRow = el('div', 'hero-row');
  var heroImage = el('div', 'hero-image');
  if (lesson.imagePath) {
    var img = el('img');
    img.src = lesson.imagePath;
    img.alt = lesson.imageCaption;
    heroImage.appendChild(img);
  } else {
    heroImage.appendChild(el('div', 'placeholder', 'image'));
  }
  heroImage.appendChild(el('div', 'caption', lesson.imageCaption));
  heroRow.appendChild(heroImage);
  heroRow.appendChild(el('div', 'hero-letter', lesson.letterTile));
  card.appendChild(heroRow);

  var sec1 = el('div', 'section-header');
  sec1.appendChild(el('div', 'circle', '1'));
  sec1.appendChild(el('div', 'label-box', 'Look and say aloud'));
  card.appendChild(sec1);
  var allWords = [];
  for (var r = 0; r < lesson.words.length; r++) {
    allWords = allWords.concat(lesson.words[r]);
  }
  card.appendChild(wordGrid(allWords));

  card.appendChild(el('div', 'page-number', pageNumber));

  return page;
}

function buildPageTwo(lesson, pageId, pageNumber) {
  var page = el('div', 'page');
  page.id = pageId;
  page.appendChild(exportButton(pageId));

  var card = el('div', 'card');
  page.appendChild(card);

  var sec2 = el('div', 'section-header');
  sec2.appendChild(el('div', 'circle', '2'));
  sec2.appendChild(el('div', 'label-box', 'Decodable Reading'));
  card.appendChild(sec2);
  card.appendChild(el('div', 'instructions', 'Read ALOUD and circle all words with the short vowel sound'));
  var readingBox = el('div', 'reading-box');
  for (var s = 0; s < lesson.sentences.length; s++) {
    readingBox.appendChild(el('p', null, (s + 1) + '. ' + lesson.sentences[s]));
  }
  card.appendChild(readingBox);

  var sec3 = el('div', 'section-header');
  sec3.appendChild(el('div', 'circle', '3'));
  sec3.appendChild(el('div', 'label-box', 'Activities'));
  card.appendChild(sec3);

  card.appendChild(el('div', 'activity-label', 'A. Fill in the missing letters and say word'));
  card.appendChild(wordGrid(lesson.fillBlanks, 'blanks'));

  var emptySlots = [];
  for (var b = 0; b < lesson.fillBlanks.length; b++) emptySlots.push('&nbsp;');
  card.appendChild(el('div', 'activity-label', 'B. Copy each word from above'));
  card.appendChild(wordGrid(emptySlots, 'empty'));

  card.appendChild(el('div', 'activity-label', 'C. Choose any word from above and form 2 sentences'));
  card.appendChild(el('div', 'sentence-line', '1.'));
  card.appendChild(el('div', 'sentence-line', '2.'));

  card.appendChild(el('div', 'page-number', pageNumber));

  return page;
}

function render(lessons) {
  var root = document.getElementById('root');
  root.innerHTML = '';
  var pageCounter = 1;
  for (var i = 0; i < lessons.length; i++) {
    var lesson = lessons[i];
    var idOne = 'lesson-' + (i + 1) + '-page-1';
    var idTwo = 'lesson-' + (i + 1) + '-page-2';
    root.appendChild(buildPageOne(lesson, idOne, pageCounter++));
    root.appendChild(buildPageTwo(lesson, idTwo, pageCounter++));
  }
}

render(window.LESSONS);
</script>
</body>
</html>
