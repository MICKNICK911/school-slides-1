<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phonics Slide Studio</title>
  <style>
    /* ========== RESET & TOKENS ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Hardcoded colors (no CSS variables) */
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f5f7fa;
  color: #1a1a1a;
  font-size: 15px;
  line-height: 1.45;
  overflow: hidden;
}
/* Dark theme (applied via class) */
body.dark {
  background: #121212;
  color: #f0f0f0;
}

/* ========== APP SHELL ========== */
#app { display: flex; flex-direction: column; height: 100vh; }
.app-header {
  background: #1a1a2e;
  color: #fff;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  flex-shrink: 0;
  z-index: 50;
}
.app-header .logo { font-weight: 800; font-size: 18px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.app-header .logo span { color: #F5A623; }
.deck-switcher { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; max-width: 220px; cursor: pointer; }
.search-wrap { flex: 1; min-width: 140px; max-width: 320px; position: relative; }
.search-wrap input { width: 100%; padding: 8px 14px 8px 36px; border-radius: 20px; border: none; font-size: 14px; background: rgba(255,255,255,0.95); color: #111; }
.search-wrap::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; pointer-events: none; }
.header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(255,255,255,0.12); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.icon-btn:hover { background: rgba(255,255,255,0.25); }
.icon-btn.active { background: #F5A623; color: #111; }

/* ========== MAIN ========== */
.main { flex: 1; overflow: hidden; display: flex; position: relative; }

/* Library */
.library-view { width: 100%; overflow-y: auto; padding: 28px 24px; }
.library-hero { text-align: center; max-width: 560px; margin: 0 auto 32px; }
.library-hero h1 { font-size: 28px; margin-bottom: 8px; }
.library-hero p { color: #6c757d; margin-bottom: 20px; }
.library-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
.deck-grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 1100px; margin: 0 auto; }
.deck-card { background: #ffffff; border: 2px solid #dee2e6; border-radius: 12px; padding: 18px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; flex: 0 0 260px; margin-bottom: 16px; }
.deck-card:hover { border-color: #F5A623; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
.deck-card h3 { font-size: 17px; margin-bottom: 6px; }
.deck-card .meta { font-size: 13px; color: #6c757d; margin-bottom: 12px; }
.deck-card .actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* Deck View */
.deck-view { display: flex; width: 100%; height: 100%; overflow: hidden; }
.page-list-panel { width: 300px; min-width: 240px; background: #ffffff; border-right: 1px solid #dee2e6; display: flex; flex-direction: column; overflow: hidden; }
.page-list-header { padding: 12px 14px; border-bottom: 1px solid #dee2e6; font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.page-list { flex: 1; overflow-y: auto; padding: 8px; }
.page-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; margin-bottom: 4px; transition: background 0.12s, border-color 0.12s; }
.page-item:hover { background: #f5f7fa; }
.page-item.active { border-color: #F5A623; background: rgba(245,166,35,0.08); }
.page-item .name { font-weight: 700; font-size: 14px; }
.page-item .title { font-size: 12px; color: #6c757d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-item .item-actions { display: none; gap: 4px; margin-top: 6px; }
.page-item.active .item-actions, .page-item:hover .item-actions { display: flex; }

.preview-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f5f7fa; }
.preview-toolbar { padding: 10px 16px; background: #ffffff; border-bottom: 1px solid #dee2e6; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.preview-toolbar .info { margin-right: auto; font-size: 13px; color: #6c757d; font-weight: 600; }
.preview-scroll { flex: 1; overflow: auto; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }

/* Editor */
.editor-view { display: flex; width: 100%; height: 100%; overflow: hidden; }
.editor-form { width: 420px; min-width: 320px; background: #ffffff; border-right: 1px solid #dee2e6; overflow-y: auto; padding: 16px; }
.editor-form h2 { font-size: 18px; margin-bottom: 14px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-weight: 700; font-size: 12px; color: #6c757d; margin-bottom: 4px; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 10px; border: 2px solid #dee2e6; border-radius: 8px; font-size: 14px; font-family: inherit; background: #f5f7fa; color: #1a1a1a; }
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: #F5A623; }
.form-group textarea { resize: vertical; min-height: 80px; font-family: ui-monospace, monospace; font-size: 13px; }
.form-group textarea.code { min-height: 120px; }
.editor-preview-wrap { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; align-items: center; background: #f5f7fa; }
.editor-preview-wrap .label { font-size: 13px; font-weight: 700; color: #6c757d; margin-bottom: 10px; }
.editor-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 12px; border-top: 1px solid #dee2e6; }

/* Image Manager */
.img-manager { margin-top: 8px; border: 2px solid #dee2e6; border-radius: 8px; padding: 10px 12px; background: #f5f7fa; }
.img-manager .img-manager-title { font-weight: 700; font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.img-manager .img-slot { display: flex; align-items: center; gap: 10px; background: #ffffff; padding: 6px 10px; border-radius: 6px; border: 1px solid #dee2e6; margin-bottom: 6px; }
.img-manager .img-slot .thumb { width: 44px; height: 44px; object-fit: contain; border-radius: 4px; background: #fff; border: 1px solid #dee2e6; flex-shrink: 0; }
.img-manager .img-slot .info { flex: 1; font-size: 12px; color: #6c757d; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.img-manager .img-slot .info strong { color: #1a1a1a; font-weight: 600; }
.img-manager .img-slot .img-actions { display: flex; gap: 4px; flex-shrink: 0; }
.img-manager .empty-img-note { font-size: 13px; color: #6c757d; padding: 6px 0; text-align: center; }

/* Buttons */
.btn { padding: 8px 16px; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; transition: transform 0.1s, background 0.15s; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: #F5A623; color: #1a1a1a; }
.btn-primary:hover:not(:disabled) { background: #e0950f; }
.btn-success { background: #2d7d46; color: #fff; }
.btn-danger { background: #dc3545; color: #fff; }
.btn-outline { background: transparent; border: 2px solid #dee2e6; color: #1a1a1a; }
.btn-outline:hover:not(:disabled) { background: #f5f7fa; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 6px; }
.btn-icon { padding: 4px 8px; font-size: 14px; }

/* ========== PAGE RENDERER ========== */
.page-frame {
  width: 1100px;
  min-width: 1100px;
  height: 850px;
  min-height: 850px;
  max-height: 850px;
  padding: 16px 22px;
  background: #fff;
  border-radius: 6px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.08);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.page-frame .card {
  border: 4px solid #E2571C;
  border-radius: 12px;
  width: 100%;
  height: 818px;
  min-height: 818px;
  max-height: 818px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #fff;
  box-sizing: border-box;
}
.cvc-header {
  display: flex;
  align-items: stretch;
  border-bottom: 3px solid #E2571C;
  min-height: 64px;
  flex-shrink: 0;
}
.cvc-header-left {
  flex: 1;
  padding: 10px 18px 6px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.cvc-main-title {
  font-size: 26px;
  font-weight: 800;
  color: #E2571C;
  letter-spacing: 0.3px;
  line-height: 1.1;
  margin: 0;
}
.cvc-subtitle {
  font-size: 12px;
  font-weight: 700;
  color: #c45a12;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  margin-top: 2px;
}
.cvc-header-right {
  background: #E2571C;
  color: #fff;
  min-width: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 14px;
}
.cvc-header-right .lesson-label { font-size: 12px; font-weight: 600; opacity: 0.95; margin-right: 5px; }
.cvc-header-right .lesson-num { font-size: 24px; font-weight: 800; line-height: 1; }
.code-content-area {
  flex: 1 1 auto;
  overflow: hidden;
  position: relative;
  width: 100%;
  min-height: 0;
}
.code-content-area .code-inner {
  width: 100%;
  height: 100%;
  overflow: auto;
  padding: 16px 20px;
  box-sizing: border-box;
}
.cvc-page-number {
  position: absolute;
  bottom: 8px;
  left: 0;
  right: 0;
  text-align: center;
  font-weight: 700;
  font-size: 13px;
  color: #6c757d;
  z-index: 2;
  pointer-events: none;
}

/* Cover */
.cover-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 818px;
  border: 3px solid #F5A623;
  border-radius: 24px;
  font-family: 'Times New Roman', Times, serif;
}
.cover-line { width: 110px; height: 4px; background: #F5A623; margin: 26px auto; border-radius: 2px; }
.cover-title { font-size: 56px; font-weight: 800; color: #1a1a2e; letter-spacing: 2px; }
.cover-subtitle { font-size: 28px; font-weight: 400; color: #E2571C; margin-top: 12px; font-style: italic; }

/* TOC */
.toc-card {
  border: 3px solid #F5A623;
  border-radius: 24px;
  height: 818px;
  padding: 26px 36px;
  position: relative;
  font-family: 'Times New Roman', Times, serif;
  overflow: hidden;
}
.toc-title {
  font-size: 26px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 18px;
  border-bottom: 4px solid #F5A623;
  padding-bottom: 8px;
}
.toc-list { list-style: none; }
.toc-item {
  display: flex;
  justify-content: space-between;
  padding: 6px 5px;
  border-bottom: 1px dashed #dee2e6;
  font-size: 13px;
  font-weight: 600;
}
.toc-item .toc-page-num { font-weight: 800; color: #E2571C; min-width: 56px; text-align: right; }

/* Thumbnail scale */
.thumb-box {
  width: 440px;
  height: 340px;
  border: 2px solid #dee2e6;
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
  position: relative;
  box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}
.thumb-box .page-frame {
  transform: scale(0.4);
  transform-origin: top left;
  position: absolute;
  top: 0; left: 0;
  box-shadow: none;
  border-radius: 0;
}

/* ========== PRESENTATION ========== */
.present-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #111;
  z-index: 9000;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.present-overlay.active { display: flex; }
.present-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 12px; }
.present-stage .page-frame { box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
.present-nav { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 4; }
.nav-cluster { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; pointer-events: auto; z-index: 6; }
.nav-cluster.left { left: 14px; }
.nav-cluster.right { right: 14px; }
.present-nav-btn { width: 46px; height: 46px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 20px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.present-nav-btn:hover { background: rgba(255,255,255,0.3); }
.present-topbar { position: absolute; top: 0; left: 0; right: 0; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); z-index: 5; opacity: 0; transition: opacity 0.25s; }
.present-overlay:hover .present-topbar { opacity: 1; }
.present-indicator { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; z-index: 5; }
.present-close { background: rgba(255,255,255,0.15); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.present-close:hover { background: rgba(255,255,255,0.3); }

/* ========== SIDE PANELS ========== */
.side-panel { position: fixed; top: 0; bottom: 0; width: 300px; background: #ffffff; box-shadow: 0 4px 18px rgba(0,0,0,0.08); z-index: 800; transform: translateX(-100%); transition: transform 0.25s ease; display: flex; flex-direction: column; overflow: hidden; }
.side-panel.right { left: auto; right: 0; transform: translateX(100%); }
.side-panel.active { transform: translateX(0); }
.side-panel-header { padding: 16px; border-bottom: 1px solid #dee2e6; display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
.side-panel-body { flex: 1; overflow-y: auto; padding: 12px; }
.side-item { padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid #dee2e6; margin-bottom: 8px; transition: border-color 0.12s; }
.side-item:hover { border-color: #F5A623; }
.overlay-dim { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 700; display: none; }
.overlay-dim.active { display: block; }

/* ========== TOAST & MODAL ========== */
.toast-container { position: fixed; top: 16px; right: 16px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; max-width: 360px; pointer-events: none; }
.toast { padding: 12px 16px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 8px; pointer-events: auto; animation: slideIn 0.25s ease; }
.toast.success { background: #2d7d46; }
.toast.error { background: #dc3545; }
.toast.info { background: #2c7be5; }
.toast.warning { background: #e67e22; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 9500; }
.modal { background: #ffffff; border-radius: 16px; padding: 24px; max-width: 400px; width: 90%; box-shadow: 0 24px 48px rgba(0,0,0,0.25); }
.modal h3 { margin-bottom: 8px; }
.modal p { color: #6c757d; margin-bottom: 18px; font-size: 14px; }
.modal .actions { display: flex; gap: 10px; justify-content: flex-end; }

/* ========== EMPTY / HELPERS ========== */
.empty-state { text-align: center; padding: 48px 20px; color: #6c757d; }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.hidden { display: none !important; }

/* ========== FLASH MODE (manager) ========== */
.flash-view { display: flex; width: 100%; height: 100%; overflow: hidden; }
.flash-deck-list-panel { width: 300px; min-width: 240px; background: #ffffff; border-right: 1px solid #dee2e6; display: flex; flex-direction: column; overflow: hidden; }
.flash-deck-list { flex: 1; overflow-y: auto; padding: 8px; }
.flash-deck-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; margin-bottom: 4px; }
.flash-deck-item:hover { background: #f5f7fa; }
.flash-deck-item.active { border-color: #F5A623; background: rgba(245,166,35,0.08); }
.flash-deck-item .name { font-weight: 700; font-size: 14px; }
.flash-deck-item .meta { font-size: 12px; color: #6c757d; }
.flash-type-badge { display: inline-block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 6px; border-radius: 6px; background: #F5A623; color: #1a1a1a; margin-right: 6px; }
.flash-editor-panel { flex: 1; overflow-y: auto; padding: 18px; background: #f5f7fa; }
.flash-items-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.flash-item-chip { background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; padding: 6px 10px; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: grab; }
.flash-item-chip .del { border: none; background: none; cursor: pointer; color: #dc3545; font-weight: 800; font-size: 14px; line-height: 1; }
.flash-item-chip.drag-over { border-color: #F5A623; }

/* ========== FLASH PRESENTATION ========== */
.flash-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9200; display: none; align-items: center; justify-content: center; }
.flash-overlay.active { display: flex; }
.flash-overlay.theme-words { background: #fdf3e7; }
.flash-overlay.theme-sentences { background: #eef6ee; }
.flash-card-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box; }
.flash-word-display { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 92%; }
.flash-letter { font-size: 13vw; font-weight: 800; font-family: 'Segoe UI', sans-serif; color: #1a1a1a; cursor: pointer; user-select: none; line-height: 1; padding: 4px 6px; border-radius: 14px; transition: color 0.1s; text-shadow: 0 0 1px rgba(0,0,0,0.15); }
.flash-sentence-display { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
.flash-word-token { font-size: 9vw; font-weight: 700; font-family: 'Georgia', 'Times New Roman', serif; color: #1a1a1a; cursor: pointer; user-select: none; line-height: 1.3; padding: 4px 10px; border-radius: 10px; transition: color 0.1s; text-shadow: 0 0 1px rgba(0,0,0,0.12); }
.flash-topbar { position: absolute; top: 0; left: 0; right: 0; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(255,255,255,0.75), transparent); z-index: 5; }
.flash-topbar .label { color: #1a1a1a; font-weight: 700; font-size: 14px; }
.flash-topbar .controls { display: flex; gap: 8px; }
.flash-indicator { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(26,26,26,0.75); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; z-index: 5; }
.flash-nav { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100; }
.flash-nav-btn { width: 52px; height: 52px; border-radius: 50%; border: none; background: rgba(26,26,26,0.12); color: #1a1a1a; font-size: 22px; font-weight: 800; cursor: pointer; pointer-events: auto; }
.flash-nav-btn:hover { background: rgba(26,26,26,0.22); }
.flash-card-stage { position: relative; z-index: 2; }
.flash-close { background: rgba(26,26,26,0.1); border: none; color: #1a1a1a; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.flash-close:hover { background: rgba(26,26,26,0.2); }
.flash-reset-btn { background: rgba(26,26,26,0.1); border: none; color: #1a1a1a; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
.flash-reset-btn:hover { background: rgba(26,26,26,0.2); }

/* ========== PRINT ========== */
@media print {
  body * { visibility: hidden; }
  #printRoot, #printRoot * { visibility: visible; }
  #printRoot { position: absolute; left: 0; top: 0; width: 100%; }
  .page-frame { box-shadow: none !important; border-radius: 0 !important; page-break-after: always; margin: 0 !important; }
  .page-frame:last-child { page-break-after: auto; }
}

/* ========== RESPONSIVE ========== */
@media (max-width: 800px) {
  .deck-view { flex-direction: column; }
  .page-list-panel { width: 100%; min-width: 0; max-height: 40%; border-right: none; border-bottom: 1px solid #dee2e6; }
  .editor-view { flex-direction: column; }
  .editor-form { width: 100%; min-width: 0; max-height: 60%; border-right: none; border-bottom: 1px solid #dee2e6; }
  .app-header { padding: 8px 12px; }
  .search-wrap { max-width: none; order: 10; width: 100%; }
  .img-manager .img-slot { flex-wrap: wrap; }
}
  </style>
</head>
<body>
  <div id="app"></div>

// Sanitize HTML
function sanitizeHTML(html) {
  var d = new DOMParser().parseFromString(String(html || ''), 'text/html');
  var scripts = d.querySelectorAll('script,iframe,object,embed,link,meta,base,form');
  for (var i = 0; i < scripts.length; i++) scripts[i].parentNode.removeChild(scripts[i]);
  var all = d.querySelectorAll('*');
  for (var j = 0; j < all.length; j++) {
    var el = all[j];
    var attrs = el.attributes;
    for (var k = attrs.length - 1; k >= 0; k--) {
      var attr = attrs[k];
      if (attr.name.indexOf('on') === 0 || attr.name === 'srcdoc') el.removeAttribute(attr.name);
    }
  }
  var elems = d.querySelectorAll('[href],[src]');
  for (var l = 0; l < elems.length; l++) {
    var e = elems[l];
    ['href', 'src'].forEach(function(attrName) {
      var val = e.getAttribute(attrName) || '';
      if (/^\s*(javascript:|vbscript:|data:text\/html)/i.test(val)) e.removeAttribute(attrName);
    });
  }
  return d.body.innerHTML;
}

// Sanitize CSS
function sanitizeCSS(css) {
  return String(css || '')

    .replace(/expression\s*\([^)]*\)/gi, '')
    .replace(/url\s*\(\s*['"]?\s*javascript:[^)]*\)/gi, '');
}

// Scope CSS
function scopeCSS(css, scopeClass) {
  var raw = sanitizeCSS(css);
  var out = '';

    var chunks = raw.split('}');
    for (var i = 0; i < chunks.length; i++) {
      var t = chunks[i].trim();
      if (!t) continue;
      var brace = t.indexOf('{');
      if (brace === -1) {
        if (t.indexOf('@') === 0) out += t + '}';
        continue;
      }
      var selectors = t.slice(0, brace).trim();
      var body = t.slice(brace + 1).trim();
      if (!selectors) continue;
      var scoped = selectors.split(',').map(function(s) {
        s = s.trim();
        if (!s) return s;
        if (s.indexOf('.' + scopeClass) !== -1) return s;
        return '.' + scopeClass + ' ' + s;
      }).filter(Boolean).join(', ');
      out += scoped + ' { ' + body + ' }\n';
    }
  } catch (e) {
    out = raw;
  }
  return out;
}

lorIdx = (colorIdx + 1) % COLORS.length;\n  textEl.style.color = COLORS[colorIdx];\n});\n\nroot.querySelectorAll('.tap-item').forEach(el => {\n  el.addEventListener('click', () => {\n    const t = el.dataset.item || el.textContent.trim();\n    textEl.textContent = t;\n    colorIdx = 0;\n    textEl.style.color = COLORS[0];\n    overlay.classList.add('open');\n    overlay.style.display = 'flex';\n  });\n});\n\nif (!window.__phonicsItemEscapeInstalled) {\n  window.__phonicsItemEscapeInstalled = true;\n  window.addEventListener('keydown', e => {\n    if (e.key === 'Escape') {\n      document.querySelectorAll('.item-fullscreen.open').forEach(o => {\n        o.classList.remove('open');\n        o.style.display = 'none';\n      });\n    }\n  });\n}\n"

lorIdx = (colorIdx + 1) % COLORS.length;\n  textEl.style.color = COLORS[colorIdx];\n});\n\nroot.querySelectorAll('.tap-item').forEach(el => {\n  el.addEventListener('click', () => {\n    const t = el.dataset.item || el.textContent.trim();\n    textEl.textContent = t;\n    colorIdx = 0;\n    textEl.style.color = COLORS[0];\n    overlay.classList.add('open');\n    overlay.style.display = 'flex';\n  });\n});\n\nif (!window.__phonicsItemEscapeInstalled) {\n  window.__phonicsItemEscapeInstalled = true;\n  window.addEventListener('keydown', e => {\n    if (e.key === 'Escape') {\n      document.querySelectorAll('.item-fullscreen.open').forEach(o => {\n        o.classList.remove('open');\n        o.style.display = 'none';\n      });\n    }\n  });\n}\n"

      "css": ".content-root{width:100%;height:100%;padding:6px 8px;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#fff;display:flex;flex-direction:column;}\n.page-title{font-size:22px;font-weight:800;color:#5d4037;text-align:center;margin:0 0 4px;}\n.tables-grid{flex:1;display:grid;gap:6px;min-height:0;grid-template-columns:repeat(5,1fr);}\n.mini-table{border-radius:8px;padding:3px;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:#e3f2fd;}\n.mini-table table{width:100%;border-collapse:collapse;table-layout:fixed;flex:1;}\n.mini-table th,.mini-table td{padding:1px;text-align:center;vertical-align:middle;}\n.hdr-btn{width:100%;min-height:28px;border:none;border-radius:5px 5px 0 0;background:#90caf9;color:#0d47a1;font-size:15px;font-weight:800;cursor:pointer;}\n.hdr-btn:hover{filter:brightness(0.95);}\n.word-btn{width:100%;min-height:48px;border:1.5px solid #bbdefb;border-radius:4px;background:#fff;color:#1a1a1a;font-size:20px;font-weight:700;cursor:pointer;padding:1px;}\n.word-btn:hover{border-color:#F5A623;background:#fffde7;}\n",
      "contentBackground": "#ffffff",
      "js": "const overlay = document.createElement('div');\noverlay.className = 'item-fullscreen';\noverlay.style.cssText = `\n  position: absolute !important;\n  top: 0 !important; left: 0 !important;\n  width: 100% !important; height: 100% !important;\n  background: #ffffff !important;\n  display: none !important;\n  align-items: center !important;\n  justify-content: center !important;\n  z-index: 10 !important;\n  padding: 40px !important;\n  box-sizing: border-box !important;\n  pointer-events: auto !important;\n`;\n\nconst closeBtn = document.createElement('button');\ncloseBtn.type = 'button';\ncloseBtn.setAttribute('aria-label', 'Close');\ncloseBtn.textContent = '×';\ncloseBtn.style.cssText = `\n  position: absolute; left: 20px; top: 20px;\n  width: 48px; height: 48px; border: 2px solid #333; border-radius: 50%;\n  background: #fff; color: #333; font-size: 28px; font-weight: 800;\n  line-height: 1; cursor: pointer; z-index: 20;\n  display: flex; align-items: center; justify-content: center;\n  box-shadow: 0 2px 6px rgba(0,0,0,0.2);\n`;\n\nconst textEl = document.createElement('div');\ntextEl.style.cssText = `\n  font-family: 'Segoe UI', system-ui, sans-serif;\n  font-size: clamp(48px, 12vw, 120px);\n  font-weight: 800;\n  line-height: 1.2;\n  text-align: center;\n  color: #1a1a1a;\n  max-width: 95%;\n  cursor: pointer;\n  user-select: none;\n`;\n\noverlay.appendChild(closeBtn);\noverlay.appendChild(textEl);\n\nconst pageFrame = root.closest('.page-frame');\nif (pageFrame) pageFrame.appendChild(overlay);\nelse root.appendChild(overlay);\n\nconst close = () => {\n  overlay.classList.remove('open');\n  overlay.style.display = 'none';\n  textEl.textContent = '';\n  textEl.style.color = '#1a1a1a';\n};\ncloseBtn.addEventListener('click', close);\noverlay.addEventListener('click', e => { if (e.target === overlay) close(); });\n\nconst COLORS = ['#1a1a1a', '#e63946', '#1d6fd6', '#E2571C', '#2a9d8f'];\nlet colorIdx = 0;\ntextEl.addEventListener('click', () => {\n  colorIdx = (colorIdx + 1) % COLORS.length;\n  textEl.style.color = COLORS[colorIdx];\n});\n\nroot.querySelectorAll('.tap-item').forEach(el => {\n  el.addEventListener('click', () => {\n    const t = el.dataset.item || el.textContent.trim();\n    textEl.textContent = t;\n    colorIdx = 0;\n    textEl.style.color = COLORS[0];\n    overlay.classList.add('open');\n    overlay.style.display = 'flex';\n  });\n});\n\nif (!window.__phonicsItemEscapeInstalled) {\n  window.__phonicsItemEscapeInstalled = true;\n  window.addEventListener('keydown', e => {\n    if (e.key === 'Escape') {\n      document.querySelectorAll('.item-fullscreen.open').forEach(o => {\n        o.classList.remove('open');\n        o.style.display = 'none';\n      });\n    }\n  });\n}\n"

        { "id": "s1", "text": "I have a big dog." },
        { "id": "s2", "text": "The cat is on the mat." },
        { "id": "s3", "text": "You and I can go." },
        { "id": "s4", "text": "He was at the park." },
        { "id": "s5", "text": "She said it was fun." },
        { "id": "s6", "text": "They have a red ball." },
        { "id": "s7", "text": "This is my new hat." },
        { "id": "s8", "text": "We can look at the water." },
        { "id": "s9", "text": "What do you like to do?" },
        { "id": "s10", "text": "I will go with him." },
        { "id": "s11", "text": "Can you find my book?" },
        { "id": "s12", "text": "There are two dogs by the tree." },
        { "id": "s13", "text": "My mom will make lunch now." },
        { "id": "s14", "text": "Look at all the stars." },
        { "id": "s15", "text": "We had a good time." },
        { "id": "s16", "text": "It is time to go home." },
        { "id": "s17", "text": "She will write her name." },
        { "id": "s18", "text": "He can not see the sun." },
        { "id": "s19", "text": "This water is for you." },
        { "id": "s20", "text": "I like to play with them." },
        { "id": "s21", "text": "They were at my house." },
        { "id": "s22", "text": "Do you have a first name?" },
        { "id": "s23", "text": "We will use this one." },
        { "id": "s24", "text": "Some people like to walk." },

        { "id": "s27", "text": "Come and see my new toy." },
        { "id": "s28", "text": "Her cat likes to look up." },

        { "id": "s30", "text": "This is the way to go." },
        { "id": "s31", "text": "I will get my hat and go." },
        { "id": "s32", "text": "They made a big cake for us." },
        { "id": "s33", "text": "Would you like more water?" },
        { "id": "s34", "text": "He did not have his book." },
        { "id": "s35", "text": "Can we go down to the water?" },
        { "id": "s36", "text": "She has been here all day." },
        { "id": "s37", "text": "I like this one, but not that one." },
        { "id": "s38", "text": "We will write it down now." },
        { "id": "s39", "text": "My dad called them on time." },
        { "id": "s40", "text": "The sun is up now." },
        { "id": "s41", "text": "Other people can come too." },
        { "id": "s42", "text": "I am so happy about this day." },
        { "id": "s43", "text": "We went into the big house." },

      "type": "sentences",
      "items": [
        { "id": "g1", "text": "I moved to a new home this year." },
        { "id": "g2", "text": "Our little dog followed us home." },
        { "id": "g3", "text": "Can you show me the way there?" },
        { "id": "g4", "text": "Mother read a great sentence to us." },
        { "id": "g5", "text": "The man went to work early." },
        { "id": "g6", "text": "We must try to find the answer." },
        { "id": "g7", "text": "I think this is the right page." },
        { "id": "g8", "text": "Three boys came to play after school." },
        { "id": "g9", "text": "She put the letter on the table." },
        { "id": "g10", "text": "Turn the page and study the picture." },
        { "id": "g11", "text": "We live in a small house near the land." },
        { "id": "g12", "text": "I need help to move this large box." },
        { "id": "g13", "text": "Should we take a walk in the air?" },
        { "id": "g14", "text": "Where did you learn to spell that word?" },
        { "id": "g15", "text": "The animal ran away from the house." },
        { "id": "g16", "text": "Even now, I still think about it." },
        { "id": "g17", "text": "We found a different way to end the game." },
        { "id": "g18", "text": "Our hand hurt after we tried to play." },
        { "id": "g19", "text": "Just ask her to change the sound." },
        { "id": "g20", "text": "Many years ago, our family came here." },
        { "id": "g21", "text": "Only good work will help us win." },
        { "id": "g22", "text": "I want to know why the sky turns dark." },
        { "id": "g23", "text": "Give me the picture, and I will show it." },
        { "id": "g24", "text": "Set the page down and go outside to play." },
        { "id": "g25", "text": "We put our name on the same line." },
        { "id": "g26", "text": "The men went back to work after lunch." },
        { "id": "g27", "text": "Take another look before you say no." },
        { "id": "g28", "text": "Her thing was found by the old house." },
        { "id": "g29", "text": "This is a great place to build a home." },
        { "id": "g30", "text": "We form a line and wait for our turn." },
        { "id": "g31", "text": "The boy said he would help us move." },
        { "id": "g32", "text": "I like to read before I go to sleep." },
        { "id": "g33", "text": "Off in the distance, we saw a small light." },
        { "id": "g34", "text": "Our teacher will help us learn the answer." },
        { "id": "g35", "text": "Does she need a form to fill out?" },
        { "id": "g36", "text": "The land around here is very different." },
        { "id": "g37", "text": "We must think about what we say to others." },
        { "id": "g38", "text": "I found my old picture on the wall." },
        { "id": "g39", "text": "The kind man gave us a new page." },
        { "id": "g40", "text": "Study hard and you will learn much more." },
        { "id": "g41", "text": "Our house has a big yard and a small pond." },
        { "id": "g42", "text": "Even the youngest boy can play this game." },
        { "id": "g43", "text": "Just try again if it does not work." },
        { "id": "g44", "text": "We went through the woods to find our way home." },
        { "id": "g45", "text": "Her mother will help us set the table." },
        { "id": "g46", "text": "I think America is a very large place." },
        { "id": "g47", "text": "Follow the line to find the right answer." },
        { "id": "g48", "text": "Take a picture before we move the boxes." },
        { "id": "g49", "text": "Why did you turn the sound off?" },
        { "id": "g50", "text": "The world is a great and different place." },
        { "id": "g51", "text": "We need to change our plan before we go." },
        { "id": "g52", "text": "Our small dog likes to follow me around." },
        { "id": "g53", "text": "Ask your mother if we can go outside." },
        { "id": "g54", "text": "The letter came from a man in another town." },
        { "id": "g55", "text": "I put my hand up to answer the question." },
        { "id": "g56", "text": "We should study before we go to play." },
        { "id": "g57", "text": "Give the picture back to her, please." },
        { "id": "g58", "text": "Our new home has a very large yard." },
        { "id": "g59", "text": "Away from home, we found a great place to live." },
        { "id": "g60", "text": "Well, I must think about it again." }
      ]

            css: '.content-root{width:100%;height:100%;padding:18px 20px;overflow:hidden;font-family:\'Segoe UI\',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffff;}\n.consonants-header{margin-bottom:24px;text-align:center;}\n.consonants-header h2{font-size:32px;font-weight:800;color:#E2571C;text-transform:uppercase;letter-spacing:2px;margin:0 0 12px;}\n.caps-toggle{display:flex;justify-content:center;gap:0;margin-top:4px;}\n.caps-btn{padding:8px 22px;font-size:16px;font-weight:800;border:2px solid #dee2e6;background:#fff;color:#1a1a1a;cursor:pointer;transition:all .15s;border-radius:20px;}\n.caps-btn:first-child{border-radius:20px 0 0 20px;}\n.caps-btn:last-child{border-radius:0 20px 20px 0;border-left:none;}\n.caps-btn.active{background:#E2571C;border-color:#E2571C;color:#fff;}\n.caps-btn:not(.active):hover{background:#f5f7fa;}\n.consonants-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:14px;width:100%;max-width:820px;padding:10px;justify-items:center;align-items:center;}\n.letter{width:80px;height:80px;border:3px solid #dee2e6;border-radius:20px;background:#fff;font-size:38px;font-weight:800;color:#1a1a1a;cursor:pointer;transition:all .15s ease;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.08);}\n.letter:hover{border-color:#F5A623;transform:scale(1.06);box-shadow:0 6px 14px rgba(0,0,0,.12);}\n.letter:active{transform:scale(0.95);}',
            contentBackground: '#ffffff',
            js: 'const letters = document.querySelectorAll(\'.letter\');\nconst colors = [\'#1a1a1a\',\'#ff0000\',\'#ff7f00\',\'#ffff00\',\'#00ff00\',\'#0000ff\',\'#4b0082\',\'#9400d3\'];\nconst stateMap = new Map();\nletters.forEach(letter => {\n  letter.addEventListener(\'click\', () => {\n    const key = letter.dataset.letter;\n    const cur = stateMap.get(key) || 0;\n    const next = (cur + 1) % colors.length;\n    letter.style.color = colors[next];\n    stateMap.set(key, next);\n  });\n});\n\n// Caps Toggle\nconst capsBtns = document.querySelectorAll(\'.caps-btn\');\ncapsBtns.forEach(btn => {\n  btn.addEventListener(\'click\', () => {\n    capsBtns.forEach(b => b.classList.remove(\'active\'));\n    btn.classList.add(\'active\');\n    const isUpper = btn.dataset.case === \'upper\';\n    letters.forEach(letter => {\n      const orig = letter.dataset.letter;\n      letter.textContent = isUpper ? orig.toUpperCase() : orig.toLowerCase();\n    });\n  });\n});'

function renderPageElement(page, opts) {

  var isThumb = !!opts.isThumbnail;

  var frame = document.createElement('div');
  frame.className = 'page-frame';

  var card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = '<div class="cvc-header">' +
    '<div class="cvc-header-left">' +
    '<h1 class="cvc-main-title">' + escapeHtml(page.mainTitle || 'Untitled') + '</h1>' +
    '<div class="cvc-subtitle">' + escapeHtml(page.subtitle || '') + '</div>' +
    '</div>' +
    '<div class="cvc-header-right">' +
    '<span class="lesson-label">LESSON</span>' +
    '<span class="lesson-num">' + pageNum + '</span>' +
    '</div>' +
    '</div>';

  var contentArea = document.createElement('div');
  contentArea.className = 'code-content-area';
  contentArea.style.background = page.contentBackground || '#ffffff';

  var scopeClass = 'scope-' + String(page.id || 'p').replace(/[^a-zA-Z0-9_-]/g, '');
  contentArea.classList.add(scopeClass);

  var style = document.createElement('style');
  style.textContent = scopeCSS(page.css || '', scopeClass);

  var inner = document.createElement('div');
  inner.className = 'code-inner';

  contentArea.appendChild(style);

  card.appendChild(contentArea);
