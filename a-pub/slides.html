<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phonics Slide Studio</title>
  <style>
    /* ========== RESET & TOKENS ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #E2571C;
      --accent: #F5A623;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #6c757d;
      --border: #dee2e6;
      --header-bg: #1a1a2e;
      --success: #2d7d46;
      --danger: #dc3545;
      --shadow: 0 4px 18px rgba(0,0,0,0.08);
      --radius: 12px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --page-w: 850px;
      --page-h: 1100px;
      --card-h: 1068px;
      --font-scale: 1;
    }
    .dark {
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #f0f0f0;
      --muted: #9aa0a6;
      --border: #333;
      --header-bg: #0d0d14;
      --shadow: 0 4px 18px rgba(0,0,0,0.35);
    }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: calc(15px * var(--font-scale));
      line-height: 1.45;
      overflow: hidden;
    }

    /* ========== APP SHELL ========== */
    #app { display: flex; flex-direction: column; height: 100vh; }
    .app-header {
      background: var(--header-bg);
      color: #fff;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
      z-index: 50;
    }
    .app-header .logo {
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .app-header .logo span { color: var(--accent); }
    .deck-switcher {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      max-width: 220px;
      cursor: pointer;
    }
    .deck-switcher option { color: #111; }
    .search-wrap {
      flex: 1;
      min-width: 140px;
      max-width: 320px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 8px 14px 8px 36px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
      background: rgba(255,255,255,0.95);
      color: #111;
    }
    .search-wrap::before {
      content: '🔍';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      pointer-events: none;
    }
    .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.25); }
    .icon-btn.active { background: var(--accent); color: #111; }

    /* ========== MAIN CONTENT ========== */
    .main { flex: 1; overflow: hidden; display: flex; position: relative; }

    /* ========== LIBRARY ========== */
    .library-view {
      width: 100%;
      overflow-y: auto;
      padding: 28px 24px;
    }
    .library-hero {
      text-align: center;
      max-width: 560px;
      margin: 0 auto 32px;
    }
    .library-hero h1 { font-size: 28px; margin-bottom: 8px; }
    .library-hero p { color: var(--muted); margin-bottom: 20px; }
    .library-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .deck-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .deck-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
    .deck-card h3 { font-size: 17px; margin-bottom: 6px; }
    .deck-card .meta { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .deck-card .actions { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ========== DECK VIEW ========== */
    .deck-view {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .page-list-panel {
      width: 300px;
      min-width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .page-list-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .page-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .page-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      margin-bottom: 4px;
      transition: background 0.12s, border-color 0.12s;
    }
    .page-item:hover { background: var(--bg); }
    .page-item.active {
      border-color: var(--accent);
      background: rgba(245,166,35,0.08);
    }
    .page-item .name { font-weight: 700; font-size: 14px; }
    .page-item .title { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-item .item-actions {
      display: none;
      gap: 4px;
      margin-top: 6px;
    }
    .page-item.active .item-actions,
    .page-item:hover .item-actions { display: flex; }

    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .preview-toolbar {
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .preview-toolbar .info { margin-right: auto; font-size: 13px; color: var(--muted); font-weight: 600; }
    .preview-scroll {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ========== EDITOR ========== */
    .editor-view {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .editor-form {
      width: 380px;
      min-width: 300px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
    }
    .editor-form h2 { font-size: 18px; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .form-group textarea { resize: vertical; min-height: 80px; font-family: ui-monospace, monospace; font-size: 13px; }
    .form-group textarea.code { min-height: 120px; }
    .editor-preview-wrap {
      flex: 1;
      overflow: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg);
    }
    .editor-preview-wrap .label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .editor-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    /* ========== BUTTONS ========== */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #1a1a1a; }
    .btn-primary:hover:not(:disabled) { background: #e0950f; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover:not(:disabled) { background: var(--bg); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 6px; }

    /* ========== PAGE RENDERER (shared visual language) ========== */
    .page-frame {
      width: var(--page-w);
      min-width: var(--page-w);
      height: var(--page-h);
      min-height: var(--page-h);
      max-height: var(--page-h);
      padding: 16px 22px;
      background: #fff;
      border-radius: 6px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .page-frame .card {
      border: 4px solid var(--primary);
      border-radius: 12px;
      width: 100%;
      height: var(--card-h);
      min-height: var(--card-h);
      max-height: var(--card-h);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      box-sizing: border-box;
    }
    .cvc-header {
      display: flex;
      align-items: stretch;
      border-bottom: 3px solid var(--primary);
      min-height: 64px;
      flex-shrink: 0;
    }
    .cvc-header-left {
      flex: 1;
      padding: 10px 18px 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .cvc-main-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.3px;
      line-height: 1.1;
      margin: 0;
    }
    .cvc-subtitle {
      font-size: 12px;
      font-weight: 700;
      color: #c45a12;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .cvc-header-right {
      background: var(--primary);
      color: #fff;
      min-width: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
    }
    .cvc-header-right .lesson-label { font-size: 12px; font-weight: 600; opacity: 0.95; margin-right: 5px; }
    .cvc-header-right .lesson-num { font-size: 24px; font-weight: 800; line-height: 1; }
    .code-content-area {
      flex: 1 1 auto;
      overflow: hidden;
      position: relative;
      width: 100%;
      min-height: 0;
    }
    .code-content-area .code-inner {
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 16px 20px;
      box-sizing: border-box;
    }
    .cvc-page-number {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      color: #6c757d;
      z-index: 2;
      pointer-events: none;
    }

    /* Cover (print) */
    .cover-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: var(--card-h);
      border: 3px solid var(--accent);
      border-radius: 24px;
      font-family: 'Times New Roman', Times, serif;
    }
    .cover-line { width: 110px; height: 4px; background: var(--accent); margin: 26px auto; border-radius: 2px; }
    .cover-title { font-size: 56px; font-weight: 800; color: #1a1a2e; letter-spacing: 2px; }
    .cover-subtitle { font-size: 28px; font-weight: 400; color: var(--primary); margin-top: 12px; font-style: italic; }

    /* TOC */
    .toc-card {
      border: 3px solid var(--accent);
      border-radius: 24px;
      height: var(--card-h);
      padding: 26px 36px;
      position: relative;
      font-family: 'Times New Roman', Times, serif;
      overflow: hidden;
    }
    .toc-title {
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 18px;
      border-bottom: 4px solid var(--accent);
      padding-bottom: 8px;
    }
    .toc-list { list-style: none; }
    .toc-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 5px;
      border-bottom: 1px dashed #dee2e6;
      font-size: 13px;
      font-weight: 600;
    }
    .toc-item .toc-page-num { font-weight: 800; color: var(--primary); min-width: 56px; text-align: right; }

    /* Thumbnail scale */
    .thumb-box {
      width: 340px;
      height: 440px;
      border: 2px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      position: relative;
      box-shadow: var(--shadow);
    }
    .thumb-box .page-frame {
      transform: scale(0.4);
      transform-origin: top left;
      position: absolute;
      top: 0; left: 0;
      box-shadow: none;
      border-radius: 0;
    }

    /* ========== PRESENTATION ========== */
    .present-overlay {
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 9000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .present-overlay.active { display: flex; }
    .present-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 12px;
    }
    .present-stage .page-frame {
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .present-nav {
      position: absolute;
      inset: 0;
      display: flex;
      pointer-events: none;
    }
    .present-nav .zone {
      flex: 1;
      pointer-events: auto;
      cursor: pointer;
    }
    .present-topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 5;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .present-overlay:hover .present-topbar { opacity: 1; }
    .present-indicator {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      z-index: 5;
    }
    .present-close {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }
    .present-close:hover { background: rgba(255,255,255,0.3); }

    /* ========== SIDE PANELS ========== */
    .side-panel {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 300px;
      background: var(--surface);
      box-shadow: var(--shadow);
      z-index: 800;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .side-panel.right { left: auto; right: 0; transform: translateX(100%); }
    .side-panel.active { transform: translateX(0); }
    .side-panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
    }
    .side-panel-body { flex: 1; overflow-y: auto; padding: 12px; }
    .side-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      transition: border-color 0.12s;
    }
    .side-item:hover { border-color: var(--accent); }
    .overlay-dim {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 700;
      display: none;
    }
    .overlay-dim.active { display: block; }

    /* ========== TOAST & MODAL ========== */
    .toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 360px;
      pointer-events: none;
    }
    .toast {
      padding: 12px 16px;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      animation: slideIn 0.25s ease;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    .toast.info { background: #2c7be5; }
    .toast.warning { background: #e67e22; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9500;
    }
    .modal {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 24px 48px rgba(0,0,0,0.25);
    }
    .modal h3 { margin-bottom: 8px; }
    .modal p { color: var(--muted); margin-bottom: 18px; font-size: 14px; }
    .modal .actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* ========== EMPTY / HELPERS ========== */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .hidden { display: none !important; }

    /* ========== PRINT ========== */
    @media print {
      body * { visibility: hidden; }
      #printRoot, #printRoot * { visibility: visible; }
      #printRoot {
        position: absolute;
        left: 0; top: 0;
        width: 100%;
      }
      .page-frame {
        box-shadow: none !important;
        border-radius: 0 !important;
        page-break-after: always;
        margin: 0 !important;
      }
      .page-frame:last-child { page-break-after: auto; }
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 800px) {
      .deck-view { flex-direction: column; }
      .page-list-panel {
        width: 100%;
        min-width: 0;
        max-height: 40%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .editor-view { flex-direction: column; }
      .editor-form {
        width: 100%;
        min-width: 0;
        max-height: 50%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .app-header { padding: 8px 12px; }
      .search-wrap { max-width: none; order: 10; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast-container" id="toastContainer"></div>
  <div class="overlay-dim" id="overlayDim"></div>
  <div class="present-overlay" id="presentOverlay"></div>
  <div id="printRoot" class="hidden"></div>
  <input type="file" id="fileInput" accept=".json,application/json" class="hidden" />

  <script>
  (function () {
    'use strict';

    // ========== CONSTANTS ==========
    const DB_NAME = 'phonics_slide_studio_v1';
    const DB_STORE = 'data';
    const MAX_HISTORY = 40;
    const PAGE_W = 850;
    const PAGE_H = 1100;

    // ========== STATE ==========
    let state = {
      decks: {},                 // id -> deck
      currentDeckId: null,
      currentPageId: null,
      theme: 'light',
      fontScale: 1,
      searchQuery: '',
      history: [],
      ui: {
        mode: 'library',         // library | deck | edit | present
        topicsOpen: false,
        historyOpen: false,
        editingPageId: null,     // null = new page
        dirty: false
      }
    };

    // ========== UTIL ==========
    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
    const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const clone = (o) => JSON.parse(JSON.stringify(o));
    const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, m =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

    function showToast(msg, type = 'info') {
      const t = document.createElement('div');
      t.className = 'toast ' + type;
      const icon = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' }[type] || 'ℹ️';
      t.innerHTML = `<span>${icon}</span><span>${escapeHtml(msg)}</span>`;
      $('#toastContainer').appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    function confirmDialog(msg, onYes) {
      const o = document.createElement('div');
      o.className = 'modal-overlay';
      o.innerHTML = `
        <div class="modal">
          <h3>Confirm</h3>
          <p>${escapeHtml(msg)}</p>
          <div class="actions">
            <button class="btn btn-outline cancel">Cancel</button>
            <button class="btn btn-danger confirm">Yes</button>
          </div>
        </div>`;
      document.body.appendChild(o);
      o.querySelector('.cancel').onclick = () => o.remove();
      o.querySelector('.confirm').onclick = () => { o.remove(); onYes(); };
    }

    // ========== SANITIZE ==========
    function sanitizeHTML(html) {
      const d = new DOMParser().parseFromString(String(html || ''), 'text/html');
      d.querySelectorAll('script,iframe,object,embed,link,meta,base,form').forEach(n => n.remove());
      d.querySelectorAll('*').forEach(n => {
        [...n.attributes].forEach(a => {
          if (/^on/i.test(a.name) || a.name === 'srcdoc') n.removeAttribute(a.name);
        });
      });
      d.querySelectorAll('[href],[src]').forEach(n => {
        ['href', 'src'].forEach(k => {
          const v = n.getAttribute(k) || '';
          if (/^\s*(javascript:|vbscript:|data:text\/html)/i.test(v)) n.removeAttribute(k);
        });
      });
      return d.body.innerHTML;
    }

    function sanitizeCSS(css) {
      return String(css || '')
        .replace(/@import\s+[^;]+;?/gi, '')
        .replace(/expression\s*\([^)]*\)/gi, '')
        .replace(/url\s*\(\s*['"]?\s*javascript:[^)]*\)/gi, '');
    }

    function scopeCSS(css, scopeClass) {
      const raw = sanitizeCSS(css);
      let out = '';
      try {
        const chunks = raw.split('}');
        for (const chunk of chunks) {
          const t = chunk.trim();
          if (!t) continue;
          const brace = t.indexOf('{');
          if (brace === -1) {
            if (t.startsWith('@')) out += t + '}';
            continue;
          }
          const selectors = t.slice(0, brace).trim();
          const body = t.slice(brace + 1).trim();
          if (!selectors) continue;
          const scoped = selectors.split(',').map(s => {
            s = s.trim();
            if (!s) return s;
            if (s.includes('.' + scopeClass)) return s;
            return `.${scopeClass} ${s}`;
          }).filter(Boolean).join(', ');
          out += `${scoped} { ${body} }\n`;
        }
      } catch (_) {
        out = raw;
      }
      return out;
    }

    // ========== PAGE RENDERER ==========
    function renderPageElement(page, opts = {}) {
      const pageNum = opts.pageNum ?? 1;
      const isThumb = !!opts.isThumbnail;

      // Header

            <div class="cvc-subtitle">${escapeHtml(page.subtitle || '')}</div>
          </div>
          <div class="cvc-header-right">
            <span class="lesson-label">LESSON</span>
            <span class="lesson-num">${pageNum}</span>

      // Content
      const contentArea = document.createElement('div');

      contentArea.style.background = page.contentBackground || '#ffffff';

      const scopeClass = 'scope-' + String(page.id || 'p').replace(/[^a-zA-Z0-9_-]/g, '');
      contentArea.classList.add(scopeClass);

      const style = document.createElement('style');
      style.textContent = scopeCSS(page.css || '', scopeClass);

      const inner = document.createElement('div');
      inner.className = 'code-inner';
      inner.innerHTML = sanitizeHTML(page.html || '');

      contentArea.append(style, inner);
      card.appendChild(contentArea);

      // Page number
      const pn = document.createElement('div');
      pn.className = 'cvc-page-number';
      pn.textContent = pageNum;
      card.appendChild(pn);

      frame.appendChild(card);

      // Optional scoped JS (not in thumbnail to avoid side effects)
      if (!isThumb && typeof page.js === 'string' && page.js.trim()) {
        try {
          const fn = new Function('root', page.js);
          setTimeout(() => {
            try { fn(inner); } catch (e) { console.warn('Page JS error:', e); }
          }, 0);
        } catch (e) {
          console.warn('Page JS compile error:', e);
        }
      }

      return frame;
    }

    function renderCoverElement(cover) {

    // ========== DEFAULTS ==========
    function createEmptyPage() {
      return {
        id: uid('p'),
        name: 'New Page',
        mainTitle: 'SHORT VOWEL CVC WORDS',
        subtitle: 'SHORT VOWEL',
        html: '<div class="content"><h1>Your content here</h1><p>Edit HTML and CSS in the editor.</p></div>',
        css: '.content{padding:8px}h1{margin:0 0 12px;color:#E2571C;font-size:28px}p{font-size:18px;line-height:1.5}',
        contentBackground: '#ffffff',

      };
    }

    function createEmptyDeck(name = 'New Deck') {
      return {
        id: uid('deck'),
        deckName: name,

      };

    // ========== PERSISTENCE ==========
    let dbPromise = null;
    function getDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      return dbPromise;
    }

    async function persist() {
      const payload = {
        version: 1,
        decks: state.decks,
        currentDeckId: state.currentDeckId,
        theme: state.theme,
        fontScale: state.fontScale,
        history: state.history.slice(0, MAX_HISTORY)
      };
      try {
        const db = await getDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, 'readwrite');
          tx.objectStore(DB_STORE).put(payload, 'app');
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      } catch (e) {
        try {
          localStorage.setItem(DB_NAME, JSON.stringify(payload));
        } catch (_) {
          showToast('Could not save. Storage full?', 'error');
        }
      }
    }

    async function loadPersisted() {
      let data = null;
      try {
        const db = await getDB();
        data = await new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, 'readonly');
          const req = tx.objectStore(DB_STORE).get('app');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      } catch (_) {}
      if (!data) {
        try {
          const raw = localStorage.getItem(DB_NAME);
          if (raw) data = JSON.parse(raw);
        } catch (_) {}
      }
      if (data && data.decks) {
        state.decks = data.decks;
        state.currentDeckId = data.currentDeckId || null;
        state.theme = data.theme || 'light';
        state.fontScale = data.fontScale || 1;
        state.history = Array.isArray(data.history) ? data.history : [];
      }
    }

    // ========== NORMALIZE IMPORT ==========
    function normalizeImported(raw) {
      let pages = [];
      let deckName = 'Imported Deck';
      let cover = { title: 'Crystal Phonics', subtitle: 'Grade 1' };
      let includeToc = true;

      if (Array.isArray(raw.pages)) {
        pages = raw.pages;
        if (raw.deckName) deckName = String(raw.deckName);
        else if (raw.coverData?.title) deckName = String(raw.coverData.title);
        if (raw.cover) cover = { title: String(raw.cover.title || cover.title), subtitle: String(raw.cover.subtitle || '') };
        else if (raw.coverData) cover = { title: String(raw.coverData.title || cover.title), subtitle: String(raw.coverData.subtitle || '') };
        if (raw.includeToc !== undefined) includeToc = !!raw.includeToc;
      } else if (Array.isArray(raw)) {
        pages = raw;
      } else {
        throw new Error('Unrecognized JSON structure');
      }

      const safePages = pages.slice(0, 200).map((p) => {
        const id = p.id && typeof p.id === 'string' ? p.id : uid('p');
        // Publisher structured pages → convert to simple HTML summary (fallback)
        if (p.type === 'structured' && Array.isArray(p.sections)) {
          return {
            id,
            name: String(p.name || p.mainTitle || 'Structured Page'),
            mainTitle: String(p.mainTitle || 'Untitled'),
            subtitle: String(p.subtitle || ''),
            html: `<div class="content"><p><em>Imported structured page — re-create in editor or export as code page from Publisher.</em></p><pre style="font-size:12px;white-space:pre-wrap;">${escapeHtml(JSON.stringify(p.sections?.map(s => s.type), null, 0))}</pre></div>`,
            css: '.content{padding:8px}em{color:#666}',
            contentBackground: '#ffffff',
            js: ''
          };
        }
        return {
          id,
          name: String(p.name || p.mainTitle || 'Page'),
          mainTitle: String(p.mainTitle || 'Untitled'),
          subtitle: String(p.subtitle || ''),
          html: String(p.html || ''),
          css: String(p.css || ''),
          contentBackground: String(p.contentBackground || p.background || '#ffffff'),
          js: String(p.js || '')
        };
      });

      return {
        id: uid('deck'),
        deckName,
        cover,
        includeToc,
        pages: safePages.length ? safePages : [createEmptyPage()],
        updatedAt: Date.now()
      };
    }

    // ========== HISTORY ==========
    function pushHistory(deckId, pageId, name) {
      state.history = state.history.filter(h => !(h.deckId === deckId && h.pageId === pageId));
      state.history.unshift({ deckId, pageId, name, ts: Date.now() });
      if (state.history.length > MAX_HISTORY) state.history.length = MAX_HISTORY;
      persist();
    }

    // ========== CURRENT HELPERS ==========
    function currentDeck() {
      return state.currentDeckId ? state.decks[state.currentDeckId] : null;
    }
    function currentPage() {
      const d = currentDeck();
      if (!d || !state.currentPageId) return null;
      return d.pages.find(p => p.id === state.currentPageId) || null;
    }
    function filteredPages() {
      const d = currentDeck();
      if (!d) return [];
      const q = (state.searchQuery || '').toLowerCase().trim();
      if (!q) return d.pages;
      return d.pages.filter(p =>
        (p.name || '').toLowerCase().includes(q) ||
        (p.mainTitle || '').toLowerCase().includes(q) ||
        (p.subtitle || '').toLowerCase().includes(q)
      );
    }

    // ========== RENDER APP ==========
    function applyTheme() {
      document.documentElement.classList.toggle('dark', state.theme === 'dark');
      document.documentElement.style.setProperty('--font-scale', state.fontScale);
    }

    function render() {
      applyTheme();
      const app = $('#app');
      app.innerHTML = '';

      // Header
      const header = document.createElement('header');
      header.className = 'app-header';
      const deck = currentDeck();
      const deckOptions = Object.values(state.decks)
        .map(d => `<option value="${d.id}" ${d.id === state.currentDeckId ? 'selected' : ''}>${escapeHtml(d.deckName)}</option>`)
        .join('');

      header.innerHTML = `
        <div class="logo" id="logoBtn"><span>📚</span> Slide Studio</div>
        <select class="deck-switcher" id="deckSwitcher" title="Switch deck">
          <option value="">— Decks —</option>
          ${deckOptions}
        </select>
        <div class="search-wrap">
          <input type="search" id="searchInput" placeholder="Search pages..." value="${escapeHtml(state.searchQuery)}" ${state.ui.mode === 'library' ? 'disabled' : ''} />
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="btnLoad" title="Load JSON">📂</button>
          <button class="icon-btn ${state.ui.topicsOpen ? 'active' : ''}" id="btnTopics" title="Topics">📚</button>
          <button class="icon-btn ${state.ui.historyOpen ? 'active' : ''}" id="btnHistory" title="History">🕒</button>
          <button class="icon-btn" id="btnTheme" title="Theme">${state.theme === 'dark' ? '☀️' : '🌙'}</button>
          <button class="icon-btn" id="btnFont" title="Font size">🔤</button>
          ${deck && state.ui.mode !== 'edit' ? '<button class="icon-btn" id="btnAddPage" title="Add page">➕</button>' : ''}
        </div>`;
      app.appendChild(header);

      // Main
      const main = document.createElement('div');
      main.className = 'main';
      app.appendChild(main);

      if (state.ui.mode === 'library') renderLibrary(main);
      else if (state.ui.mode === 'edit') renderEditor(main);
      else renderDeckView(main);

      // Side panels
      renderSidePanels();

      // Wire header
      $('#logoBtn').onclick = () => {
        if (state.ui.dirty && !confirm('Discard unsaved changes?')) return;
        state.ui.dirty = false;
        state.ui.mode = 'library';
        state.ui.topicsOpen = false;
        state.ui.historyOpen = false;
        render();
      };
      $('#deckSwitcher').onchange = (e) => {
        const id = e.target.value;
        if (!id) return;
        if (state.ui.dirty && !confirm('Discard unsaved changes?')) {
          e.target.value = state.currentDeckId || '';
          return;
        }
        state.ui.dirty = false;
        state.currentDeckId = id;
        const d = state.decks[id];
        state.currentPageId = d?.pages[0]?.id || null;
        state.ui.mode = 'deck';
        state.searchQuery = '';
        persist();
        render();
      };
      $('#searchInput').oninput = (e) => {
        state.searchQuery = e.target.value;
        if (state.ui.mode === 'deck') render(); // re-filter list
      };
      $('#btnLoad').onclick = () => $('#fileInput').click();
      $('#btnTopics').onclick = () => {
        state.ui.topicsOpen = !state.ui.topicsOpen;
        state.ui.historyOpen = false;
        render();
      };
      $('#btnHistory').onclick = () => {
        state.ui.historyOpen = !state.ui.historyOpen;
        state.ui.topicsOpen = false;
        render();
      };
      $('#btnTheme').onclick = () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        persist();
        render();
      };
      $('#btnFont').onclick = () => {
        const scales = [0.9, 1, 1.1, 1.2];
        const i = scales.indexOf(state.fontScale);
        state.fontScale = scales[(i + 1) % scales.length];
        persist();
        render();
        showToast(`Font scale: ${state.fontScale}`, 'info');
      };
      const addBtn = $('#btnAddPage');
      if (addBtn) addBtn.onclick = () => startNewPage();

      $('#overlayDim').classList.toggle('active', state.ui.topicsOpen || state.ui.historyOpen);
      $('#overlayDim').onclick = () => {
        state.ui.topicsOpen = false;
        state.ui.historyOpen = false;
        render();
      };
    }

    // ---------- Library ----------
    function renderLibrary(main) {
      const view = document.createElement('div');
      view.className = 'library-view';
      const decks = Object.values(state.decks).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      view.innerHTML = `
        <div class="library-hero">
          <h1>Phonics Slide Studio</h1>
          <p>Load Publisher-style JSON decks, browse pages, present as slides, edit, and print.</p>
        </div>
        <div class="library-actions">
          <button class="btn btn-primary" id="libLoad">📂 Load JSON</button>
          <button class="btn btn-success" id="libNew">➕ New Empty Deck</button>
        </div>
        <div class="deck-grid" id="deckGrid"></div>`;
      main.appendChild(view);

      $('#libLoad').onclick = () => $('#fileInput').click();
      $('#libNew').onclick = () => {
        const d = createEmptyDeck('Untitled Deck');
        state.decks[d.id] = d;
        state.currentDeckId = d.id;
        state.currentPageId = d.pages[0].id;
        state.ui.mode = 'deck';
        persist();
        render();
        showToast('New deck created', 'success');
      };

      const grid = $('#deckGrid');
      if (!decks.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="icon">📭</div><p>No decks yet. Load a JSON file or create a new deck.</p></div>`;
        return;
      }
      decks.forEach(d => {
        const card = document.createElement('div');
        card.className = 'deck-card';
        card.innerHTML = `
          <h3>${escapeHtml(d.deckName)}</h3>
          <div class="meta">${d.pages.length} page(s) · ${new Date(d.updatedAt || Date.now()).toLocaleDateString()}</div>
          <div class="actions">
            <button class="btn btn-primary btn-sm open">Open</button>
            <button class="btn btn-outline btn-sm export">Export</button>
            <button class="btn btn-outline btn-sm rename">Rename</button>
            <button class="btn btn-danger btn-sm delete">Delete</button>
          </div>`;
        card.querySelector('.open').onclick = (e) => {
          e.stopPropagation();
          state.currentDeckId = d.id;
          state.currentPageId = d.pages[0]?.id || null;
          state.ui.mode = 'deck';
          persist();
          render();
        };
        card.querySelector('.export').onclick = (e) => {
          e.stopPropagation();
          exportDeck(d);
        };
        card.querySelector('.rename').onclick = (e) => {
          e.stopPropagation();
          const name = prompt('Deck name:', d.deckName);
          if (name && name.trim()) {
            d.deckName = name.trim();
            d.updatedAt = Date.now();
            persist();
            render();
          }
        };
        card.querySelector('.delete').onclick = (e) => {
          e.stopPropagation();
          confirmDialog(`Delete deck "${d.deckName}"?`, () => {
            delete state.decks[d.id];
            if (state.currentDeckId === d.id) {
              state.currentDeckId = null;
              state.currentPageId = null;
            }
            persist();
            render();
            showToast('Deck deleted', 'success');
          });
        };
        card.onclick = () => card.querySelector('.open').click();
        grid.appendChild(card);
      });
    }

    // ---------- Deck View ----------
    function renderDeckView(main) {
      const deck = currentDeck();
      if (!deck) {
        state.ui.mode = 'library';
        render();
        return;
      }

      const view = document.createElement('div');
      view.className = 'deck-view';

      // Page list
      const listPanel = document.createElement('div');
      listPanel.className = 'page-list-panel';
      const pages = filteredPages();
      listPanel.innerHTML = `
        <div class="page-list-header">
          <span>Pages (${pages.length}/${deck.pages.length})</span>
        </div>
        <div class="page-list" id="pageList"></div>`;
      view.appendChild(listPanel);

      const list = listPanel.querySelector('#pageList');
      if (!pages.length) {
        list.innerHTML = `<div class="empty-state"><p>No pages match.</p></div>`;
      } else {
        pages.forEach((p) => {
          const item = document.createElement('div');
          item.className = 'page-item' + (p.id === state.currentPageId ? ' active' : '');
          item.innerHTML = `
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="title">${escapeHtml(p.mainTitle)}</div>
            <div class="item-actions">
              <button class="btn btn-outline btn-xs edit">✏️</button>
              <button class="btn btn-outline btn-xs dup">📋</button>
              <button class="btn btn-danger btn-xs del">🗑️</button>
            </div>`;
          item.onclick = (e) => {
            if (e.target.closest('.item-actions')) return;
            state.currentPageId = p.id;
            pushHistory(deck.id, p.id, p.name);
            render();
          };
          item.querySelector('.edit').onclick = (e) => {
            e.stopPropagation();
            startEditPage(p.id);
          };
          item.querySelector('.dup').onclick = (e) => {
            e.stopPropagation();
            const copy = clone(p);
            copy.id = uid('p');
            copy.name = (copy.name || 'Page') + ' (copy)';
            deck.pages.push(copy);
            deck.updatedAt = Date.now();
            state.currentPageId = copy.id;
            persist();
            render();
            showToast('Page duplicated', 'success');
          };
          item.querySelector('.del').onclick = (e) => {
            e.stopPropagation();
            confirmDialog(`Delete "${p.name}"?`, () => {
              deck.pages = deck.pages.filter(x => x.id !== p.id);
              if (state.currentPageId === p.id) {
                state.currentPageId = deck.pages[0]?.id || null;
              }
              deck.updatedAt = Date.now();
              persist();
              render();
              showToast('Page deleted', 'success');
            });
          };
          list.appendChild(item);
        });
      }

      // Preview
      const preview = document.createElement('div');
      preview.className = 'preview-panel';
      const page = currentPage();
      const pageNum = page ? deck.pages.findIndex(x => x.id === page.id) + 1 : 0;

      preview.innerHTML = `
        <div class="preview-toolbar">
          <span class="info">${page ? escapeHtml(page.name) + ' · ' + pageNum + ' / ' + deck.pages.length : 'No page selected'}</span>
          <button class="btn btn-primary btn-sm" id="btnPresent" ${!page ? 'disabled' : ''}>▶️ Present</button>
          <button class="btn btn-outline btn-sm" id="btnEdit" ${!page ? 'disabled' : ''}>✏️ Edit</button>
          <button class="btn btn-outline btn-sm" id="btnPrintOne" ${!page ? 'disabled' : ''}>🖨️ Page</button>
          <button class="btn btn-success btn-sm" id="btnPrintAll">🖨️ All</button>
          <button class="btn btn-outline btn-sm" id="btnExportDeck">📤 JSON</button>
        </div>
        <div class="preview-scroll" id="previewScroll"></div>`;
      view.appendChild(preview);
      main.appendChild(view);

      const scroll = $('#previewScroll');
      if (page) {
        const el = renderPageElement(page, { pageNum });
        scroll.appendChild(el);
      } else {
        scroll.innerHTML = `<div class="empty-state"><div class="icon">📄</div><p>Select a page or add one.</p></div>`;
      }

      $('#btnPresent').onclick = () => enterPresent();
      $('#btnEdit').onclick = () => page && startEditPage(page.id);
      $('#btnPrintOne').onclick = () => page && printPages([page], deck, pageNum);
      $('#btnPrintAll').onclick = () => printAll(deck);
      $('#btnExportDeck').onclick = () => exportDeck(deck);
    }

    // ---------- Editor ----------
    function startNewPage() {
      state.ui.editingPageId = null;
      state.ui.mode = 'edit';
      state.ui.dirty = false;
      render();
    }

    function startEditPage(pageId) {
      state.ui.editingPageId = pageId;
      state.ui.mode = 'edit';
      state.ui.dirty = false;
      render();
    }

    function renderEditor(main) {
      const deck = currentDeck();
      if (!deck) {
        state.ui.mode = 'library';
        render();
        return;
      }

      const isNew = !state.ui.editingPageId;
      let page = isNew
        ? createEmptyPage()
        : clone(deck.pages.find(p => p.id === state.ui.editingPageId) || createEmptyPage());

      const view = document.createElement('div');
      view.className = 'editor-view';

      const form = document.createElement('div');
      form.className = 'editor-form';
      form.innerHTML = `
        <h2>${isNew ? '➕ New Page' : '✏️ Edit Page'}</h2>
        <div class="form-group">
          <label>Page Name (list / search)</label>
          <input id="fName" value="${escapeHtml(page.name)}" />
        </div>
        <div class="form-group">
          <label>Main Title (header)</label>
          <input id="fMainTitle" value="${escapeHtml(page.mainTitle)}" />
        </div>
        <div class="form-group">
          <label>Subtitle (header)</label>
          <input id="fSubtitle" value="${escapeHtml(page.subtitle)}" />
        </div>
        <div class="form-group">
          <label>Content Background</label>
          <input id="fBg" type="color" value="${page.contentBackground || '#ffffff'}" style="height:36px;padding:2px;width:80px;" />
        </div>
        <div class="form-group">
          <label>HTML</label>
          <textarea id="fHtml" class="code" rows="8">${escapeHtml(page.html)}</textarea>
        </div>
        <div class="form-group">
          <label>CSS (scoped to content)</label>
          <textarea id="fCss" class="code" rows="5">${escapeHtml(page.css)}</textarea>
        </div>
        <div class="form-group">
          <label>JS (optional, scoped — receives <code>root</code>)</label>
          <textarea id="fJs" class="code" rows="3" placeholder="// root.querySelectorAll('span').forEach(...)">${escapeHtml(page.js || '')}</textarea>
        </div>
        <div class="editor-actions">
          <button class="btn btn-primary" id="btnSave">💾 Save</button>
          <button class="btn btn-outline" id="btnCancel">Cancel</button>
          <button class="btn btn-success" id="btnSavePresent">💾 + Present</button>
        </div>`;
      view.appendChild(form);

      const prevWrap = document.createElement('div');
      prevWrap.className = 'editor-preview-wrap';
      prevWrap.innerHTML = `<div class="label">Live Preview</div><div class="thumb-box" id="editorThumb"></div>`;
      view.appendChild(prevWrap);
      main.appendChild(view);

      function gather() {
        return {
          id: isNew ? uid('p') : page.id,
          name: ($('#fName').value || '').trim() || 'Page',
          mainTitle: ($('#fMainTitle').value || '').trim() || 'Untitled',
          subtitle: ($('#fSubtitle').value || '').trim(),
          html: $('#fHtml').value || '',
          css: $('#fCss').value || '',
          contentBackground: $('#fBg').value || '#ffffff',
          js: $('#fJs').value || ''
        };
      }

      function refreshThumb() {
        const data = gather();
        const box = $('#editorThumb');
        box.innerHTML = '';
        const el = renderPageElement(data, { pageNum: 1, isThumbnail: true });
        box.appendChild(el);
      }

      ['fName', 'fMainTitle', 'fSubtitle', 'fHtml', 'fCss', 'fBg', 'fJs'].forEach(id => {
        const el = $('#' + id);
        el.addEventListener('input', () => {
          state.ui.dirty = true;
          refreshThumb();
        });
      });
      refreshThumb();

      $('#btnSave').onclick = () => {
        const data = gather();
        if (isNew) {
          deck.pages.push(data);
        } else {
          const idx = deck.pages.findIndex(p => p.id === data.id);
          if (idx >= 0) deck.pages[idx] = data;
        }
        deck.updatedAt = Date.now();
        state.currentPageId = data.id;
        state.ui.dirty = false;
        state.ui.mode = 'deck';
        persist();
        render();
        showToast('Page saved', 'success');
      };
      $('#btnCancel').onclick = () => {
        if (state.ui.dirty && !confirm('Discard unsaved changes?')) return;
        state.ui.dirty = false;
        state.ui.mode = 'deck';
        render();
      };
      $('#btnSavePresent').onclick = () => {
        $('#btnSave').click();
        setTimeout(() => enterPresent(), 50);
      };
    }

    // ---------- Side panels ----------
    function renderSidePanels() {
      // Remove old
      $$('.side-panel').forEach(el => el.remove());

      const deck = currentDeck();

      // Topics
      const topics = document.createElement('div');
      topics.className = 'side-panel' + (state.ui.topicsOpen ? ' active' : '');
      topics.innerHTML = `
        <div class="side-panel-header">
          <span>📚 Pages</span>
          <button class="btn btn-outline btn-xs" id="closeTopics">✕</button>
        </div>
        <div class="side-panel-body" id="topicsBody"></div>`;
      document.body.appendChild(topics);
      $('#closeTopics').onclick = () => { state.ui.topicsOpen = false; render(); };

      const tBody = $('#topicsBody');
      if (!deck) {
        tBody.innerHTML = '<p style="color:var(--muted);font-size:13px;">Open a deck first.</p>';
      } else {
        deck.pages.forEach(p => {
          const item = document.createElement('div');
          item.className = 'side-item';
          item.innerHTML = `<strong>${escapeHtml(p.name)}</strong><div style="font-size:12px;color:var(--muted)">${escapeHtml(p.mainTitle)}</div>`;
          item.onclick = () => {
            state.currentPageId = p.id;
            state.ui.mode = 'deck';
            state.ui.topicsOpen = false;
            pushHistory(deck.id, p.id, p.name);
            render();
          };
          tBody.appendChild(item);
        });
      }

      // History
      const hist = document.createElement('div');
      hist.className = 'side-panel right' + (state.ui.historyOpen ? ' active' : '');
      hist.innerHTML = `
        <div class="side-panel-header">
          <span>🕒 History</span>
          <button class="btn btn-outline btn-xs" id="closeHist">✕</button>
        </div>
        <div class="side-panel-body" id="histBody"></div>`;
      document.body.appendChild(hist);
      $('#closeHist').onclick = () => { state.ui.historyOpen = false; render(); };

      const hBody = $('#histBody');
      if (!state.history.length) {
        hBody.innerHTML = '<p style="color:var(--muted);font-size:13px;">No history yet.</p>';
      } else {
        state.history.forEach(h => {
          const item = document.createElement('div');
          item.className = 'side-item';
          const d = state.decks[h.deckId];
          item.innerHTML = `<strong>${escapeHtml(h.name)}</strong><div style="font-size:12px;color:var(--muted)">${escapeHtml(d?.deckName || 'Deck')} · ${new Date(h.ts).toLocaleString()}</div>`;
          item.onclick = () => {
            if (!state.decks[h.deckId]) {
              showToast('Deck no longer available', 'warning');
              return;
            }
            state.currentDeckId = h.deckId;
            state.currentPageId = h.pageId;
            state.ui.mode = 'deck';
            state.ui.historyOpen = false;
            render();
          };
          hBody.appendChild(item);
        });
      }
    }

    // ---------- Presentation ----------
    function enterPresent() {
      const deck = currentDeck();
      const page = currentPage();
      if (!deck || !page) return;
      state.ui.mode = 'present';
      showPresentUI();
    }

    function showPresentUI() {
      const overlay = $('#presentOverlay');
      const deck = currentDeck();
      if (!deck) return;

      let idx = Math.max(0, deck.pages.findIndex(p => p.id === state.currentPageId));

      function paint() {
        const page = deck.pages[idx];
        if (!page) return;
        state.currentPageId = page.id;
        overlay.innerHTML = '';
        overlay.classList.add('active');

        const stage = document.createElement('div');
        stage.className = 'present-stage';
        const el = renderPageElement(page, { pageNum: idx + 1 });
        // Scale to fit viewport
        const scale = Math.min(
          (window.innerWidth - 24) / PAGE_W,
          (window.innerHeight - 24) / PAGE_H,
          1
        );
        el.style.transform = `scale(${scale})`;
        el.style.transformOrigin = 'center center';
        stage.appendChild(el);
        overlay.appendChild(stage);

        const nav = document.createElement('div');
        nav.className = 'present-nav';
        nav.innerHTML = `<div class="zone" id="zonePrev"></div><div class="zone" id="zoneNext"></div>`;
        overlay.appendChild(nav);
        $('#zonePrev').onclick = () => { idx = (idx - 1 + deck.pages.length) % deck.pages.length; paint(); };
        $('#zoneNext').onclick = () => { idx = (idx + 1) % deck.pages.length; paint(); };

        const top = document.createElement('div');
        top.className = 'present-topbar';
        top.innerHTML = `
          <span style="color:#fff;font-weight:700;font-size:14px;">${escapeHtml(page.name)}</span>
          <button class="present-close" id="presentClose">✕</button>`;
        overlay.appendChild(top);
        $('#presentClose').onclick = exitPresent;

        const ind = document.createElement('div');
        ind.className = 'present-indicator';
        ind.textContent = `${idx + 1} / ${deck.pages.length}`;
        overlay.appendChild(ind);
      }

      paint();

      function onKey(e) {
        if (e.key === 'Escape') { exitPresent(); return; }
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
          e.preventDefault();
          idx = (idx + 1) % deck.pages.length;
          paint();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          idx = (idx - 1 + deck.pages.length) % deck.pages.length;
          paint();
        }
      }
      window.__presentKeyHandler = onKey;
      window.addEventListener('keydown', onKey);
    }

    function exitPresent() {
      $('#presentOverlay').classList.remove('active');
      $('#presentOverlay').innerHTML = '';
      if (window.__presentKeyHandler) {
        window.removeEventListener('keydown', window.__presentKeyHandler);
        window.__presentKeyHandler = null;
      }
      state.ui.mode = 'deck';
      persist();
      render();
    }

    // ---------- Print / Export ----------
    function exportDeck(deck) {
      const payload = {
        version: 1,
        deckName: deck.deckName,
        cover: deck.cover,
        includeToc: deck.includeToc,
        pages: deck.pages
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (deck.deckName || 'deck').replace(/\s+/g, '_') + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('JSON exported', 'success');
    }

    function printPages(pages, deck, startNum = 1) {
      const root = $('#printRoot');
      root.innerHTML = '';
      root.classList.remove('hidden');
      pages.forEach((p, i) => {
        root.appendChild(renderPageElement(p, { pageNum: startNum + i }));
      });

      // Get the HTML string before clearing
      const htmlContent = root.innerHTML;
      root.classList.add('hidden');
      root.innerHTML = '';

      const win = window.open('', '_blank');
      if (!win) {
        showToast('Popup blocked — allow popups to print', 'warning');
        return;
      }

      const styles = document.querySelector('style')?.outerHTML || '';
      const rootInlineStyle = document.documentElement.getAttribute('style') || '';

      win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Print</title>${styles}
        <style>
          @page { size: ${PAGE_W}px ${PAGE_H}px; margin: 0; }
          body { margin:0; padding:0; background:#fff; }
          .page-frame { box-shadow:none !important; margin:0 auto !important; page-break-after:always; }
          .page-frame:last-child { page-break-after:auto; }
        </style></head><body style="${rootInlineStyle}">${htmlContent}</body></html>`);
      win.document.close();

      // Wait for the window to fully load before printing
      win.onload = () => {
        setTimeout(() => {
          try {
            win.focus();
            win.print();
          } catch (_) {
            showToast('Print failed', 'error');
          }
        }, 200);
      };
    }

    function printAll(deck) {
      const win = window.open('', '_blank');
      if (!win) {
        showToast('Popup blocked — allow popups to print', 'warning');
        return;
      }

      const styles = document.querySelector('style')?.outerHTML || '';
      const rootInlineStyle = document.documentElement.getAttribute('style') || '';

      let html = '';
      // Cover
      const coverEl = renderCoverElement(deck.cover);
      html += coverEl.outerHTML;

      // TOC (if enabled)
      if (deck.includeToc && deck.pages.length) {
        const tocFrame = document.createElement('div');
        tocFrame.className = 'page-frame';
        const entries = deck.pages.map((p, i) =>
          `<li class="toc-item"><span>${escapeHtml(p.name)}</span><span class="toc-page-num">Page ${i + 1}</span></li>`
        ).join('');
        tocFrame.innerHTML = `<div class="toc-card"><div class="toc-title">Table of Contents</div><ul class="toc-list">${entries}</ul></div>`;
        html += tocFrame.outerHTML;
      }

      // Content pages
      deck.pages.forEach((p, i) => {
        const el = renderPageElement(p, { pageNum: i + 1 });
        html += el.outerHTML;
      });

      win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeHtml(deck.deckName)} — Print</title>${styles}
        <style>
          @page { size: ${PAGE_W}px ${PAGE_H}px; margin: 0; }
          body { margin:0; padding:0; background:#fff; }
          .page-frame { box-shadow:none !important; margin:0 auto !important; page-break-after:always; }
          .page-frame:last-child { page-break-after:auto; }
        </style></head><body style="${rootInlineStyle}">${html}</body></html>`);
      win.document.close();

      win.onload = () => {
        setTimeout(() => {
          try {
            win.focus();
            win.print();
          } catch (_) {
            showToast('Print failed', 'error');
          }
        }, 200);
      };
    }

    // ---------- File import ----------
    $('#fileInput').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      if (file.size > 15 * 1024 * 1024) {
        showToast('File too large (max 15 MB)', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const raw = JSON.parse(reader.result);
          const deck = normalizeImported(raw);
          state.decks[deck.id] = deck;
          state.currentDeckId = deck.id;
          state.currentPageId = deck.pages[0]?.id || null;
          state.ui.mode = 'deck';
          state.searchQuery = '';
          persist();
          render();
          showToast(`Loaded "${deck.deckName}" (${deck.pages.length} pages)`, 'success');
        } catch (err) {
          console.error(err);
          showToast('Invalid JSON: ' + (err.message || 'parse error'), 'error');
        }
      };
      reader.onerror = () => showToast('Could not read file', 'error');
      reader.readAsText(file);
    });

    // ========== INIT ==========
    async function init() {
      await loadPersisted();
      if (state.currentDeckId && state.decks[state.currentDeckId]) {
        state.ui.mode = 'deck';
        if (!state.currentPageId) {
          state.currentPageId = state.decks[state.currentDeckId].pages[0]?.id || null;
        }
      } else {
        state.ui.mode = 'library';
      }
      render();
    }

    init().catch(err => {
      console.error(err);
      showToast('Failed to start app', 'error');
      render();
    });
  })();
  </script>
</body>
</html>
