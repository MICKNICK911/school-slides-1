      // ---------- Render list and counts ----------
      function renderEditList() {
        const container = document.getElementById('lessonList');
        if (!container) return;
        const q = (window.searchQuery||'').toLowerCase();
        const filtered = lessons.filter(l => !q || l.title.toLowerCase().includes(q) || l.targetSound.toLowerCase().includes(q) || l.storyLines.some(sl => sl.sentence.toLowerCase().includes(q)) || (l.page2?.comprehension?.questions || []).some(c => c.question.toLowerCase().includes(q) || (c.options || []).some(o => o.toLowerCase().includes(q))));
        container.innerHTML = filtered.length ? filtered.map(l => `
          <div class="lesson-item" draggable="true" data-id="${l.id}">
            <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
            <div class="info">
              <div class="title">Lesson ${l.lessonNumber} — ${escapeHtml(l.title)}</div>
              <div class="sub">🎯 ${escapeHtml(l.targetSound)} · 📝 ${l.storyLines.length} lines · 🏫 ${escapeHtml(bookMeta.grade)} · 🖼️ ${escapeHtml(l.imageLabel || DEFAULT_IMAGE_LABEL)} · 📚 ${l.page2?.comprehension?.questions?.length || 0} questions ${l.showImagePage ? '· 🖼️ Image Page' : ''} ${l.showReadingImageBox ? '· 📷 Reading Image' : ''} ${l.useSprite ? '· 🧩 Sprite' : ''}</div>
            </div>
            <div class="actions">
              <button class="btn btn-primary btn-xs" onclick="editLesson('${l.id}')" title="Edit">✏️</button>
              <button class="btn btn-warning btn-xs" onclick="duplicateLesson('${l.id}')" title="Duplicate">📋</button>
              <button class="btn btn-danger btn-xs" onclick="deleteLesson('${l.id}')" title="Delete">🗑️</button>
            </div>
          </div>`).join('') : '<div class="empty-state"><div class="icon">📭</div><h3>No lessons found</h3></div>';
        document.getElementById('listCount').textContent = filtered.length + ' / ' + lessons.length;
        updateCounts();
      }

      function updateCounts() {
        document.getElementById('lessonCount').textContent = lessons.length + ' lessons';
        const activeLessons = lessons.filter(l => l.title.trim());
        const sightPages = bookMeta.sightWords.enabled ? parseSightWords(bookMeta.sightWords.rawText).length : 0;
        const tocPages = (bookMeta.showToc && activeLessons.length) ? Math.ceil(activeLessons.length / MAX_TOC_PER_PAGE) : 0;
        let lessonPages = 0;
        activeLessons.forEach(l => { lessonPages += l.showImagePage ? 3 : 2; });
        const frontMatter = 1 + (ackData.show ? 1 : 0);
        const totalPages = frontMatter + sightPages + tocPages + lessonPages;
        document.getElementById('viewInfo').textContent = `📄 ${lessons.length} lessons · ${totalPages} pages (${escapeHtml(bookMeta.grade)}) · Sight Words: ${sightPages} pages`;
      }

      function refreshUI() { renderEditList(); renderAllView(); updateCounts(); renderSpriteSheetsList(); }

      // ---------- TOC Preview ----------
      function renderTocPreview() {
        const container = document.getElementById('tocPreview');
        if (!container) return;
        if (!bookMeta.showToc) {
          container.innerHTML = '<p style="color:#64748b; font-style:italic;">Table of Contents is disabled.</p>';
          return;
        }
        const activeLessons = lessons.filter(l => l.title.trim());
        if (!activeLessons.length) {
          container.innerHTML = '<p style="color:#64748b;">No active lessons.</p>';
          return;
        }
        const sightPages = bookMeta.sightWords.enabled ? parseSightWords(bookMeta.sightWords.rawText).length : 0;
        const tocPageCount = Math.ceil(activeLessons.length / MAX_TOC_PER_PAGE);
        const firstLessonPage = 1 + sightPages + tocPageCount + 1;
        let runningPage = firstLessonPage;
        let html = '<ul style="list-style:none;padding:0;margin:0;">';
        activeLessons.forEach(l => {
          html += `<li style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0;"><span>Lesson ${l.lessonNumber}: ${escapeHtml(l.title)}</span><span style="color:#b91c1c;font-weight:700;">Page ${runningPage}</span></li>`;
          runningPage += l.showImagePage ? 3 : 2;
        });
        html += '</ul>';
        container.innerHTML = html;
      }

      window.switchTab = function(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === tab+'Panel'));
        if (tab === 'edit') { renderEditList(); renderThumbnail(); populateSpriteSheetSelect(); }
        if (tab === 'view') renderAllView();
        if (tab === 'book') {
          document.getElementById('coverTitleInput').value = bookMeta.title;
          document.getElementById('coverSubtitleInput').value = bookMeta.subtitle;
          document.getElementById('globalGradeInput').value = bookMeta.grade;
          document.getElementById('tocToggle').checked = bookMeta.showToc;
          document.getElementById('sightWordsToggle').checked = bookMeta.sightWords.enabled;
          document.getElementById('sightWordsTitle').value = bookMeta.sightWords.title;
          document.getElementById('sightColumns').value = bookMeta.sightWords.columns;
          document.getElementById('sightWordsText').value = bookMeta.sightWords.rawText;
          toggleSightWordsFields();
          if (document.getElementById('fShowAck')) {
            document.getElementById('fShowAck').checked = !!ackData.show;
            document.getElementById('fAckTitle').value = ackData.title || '';
            document.getElementById('fAckBody').value = ackData.body || '';
            document.getElementById('fAckPubTitle').value = ackData.pubTitle || '';
            document.getElementById('fAckPubBody').value = ackData.pubBody || '';
            toggleAckFields();
          }
          renderSpriteSheetsList();
          renderEditList();
          renderTocPreview();
        }
        if (tab !== 'view') previewLessonOverride = null;
        updateCounts();
      };

      window.toggleSightWordsFields = function() {
        const enabled = document.getElementById('sightWordsToggle').checked;
        document.getElementById('sightWordsFields').style.display = enabled ? 'block' : 'none';
      };

      // ---------- Initialization ----------
      async function initApp() {
        await loadData();

        document.getElementById('app').innerHTML = `
          <div class="app-header"><h1><span class="icon">📖</span> Decodable Reader Publisher</h1><span class="badge" id="lessonCount">0</span></div>
          <div class="tabs">
            <button class="tab-btn active" data-tab="edit" onclick="switchTab('edit')">✏️ Edit Readers</button>
            <button class="tab-btn" data-tab="book" onclick="switchTab('book')">📘 Book Setup</button>
            <button class="tab-btn" data-tab="view" onclick="switchTab('view')">👁️ Preview &amp; Export</button>
          </div>
          <div class="tab-panel active" id="editPanel">
            <div class="form-section">
              <h2 id="formTitle"><span class="dot"></span> Add New Reader</h2>
              <div class="thumbnail-wrapper">
                <div class="thumb-label">📄 Live Preview (All Pages)</div>
                <div class="thumbnail-container" id="thumbnailContainer"></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Title <span class="req">*</span></label><input id="fTitle" placeholder="e.g. Ben's Camping Trip" oninput="renderThumbnail()"></div>
                <div class="form-group"><label>Lesson Number (auto)</label><input id="fLessonNumber" type="number" readonly style="background:#f0f0f0;"></div>
                <div class="form-group"><label>Image</label>
                  <div class="image-upload-wrap">
                    <img id="imagePreview" class="preview" style="display:none;">
                    <div id="imagePreviewPlaceholder" class="preview-placeholder">🖼️</div>
                    <input type="file" id="imageUploadFile" accept="image/*" onchange="handleImageUpload(event)">
                    <input type="hidden" id="fImageUrl">
                  </div>
                </div>
              </div>
              <div class="form-group"><label>Image Label (overlay on image)</label><input id="fImageLabel" placeholder="e.g. Let's read together!" value="${escapeHtml(DEFAULT_IMAGE_LABEL)}" oninput="renderThumbnail()"></div>
              <div class="form-group"><label>Full-Page Image Label (overlay on image page)</label><input id="fImagePageLabel" placeholder="e.g. Picture Page" value="${escapeHtml(DEFAULT_IMAGE_PAGE_LABEL)}" oninput="renderThumbnail()"></div>
              <div class="form-group" style="display:flex;align-items:center;gap:10px;margin-top:16px;">
                <input type="checkbox" id="readingImageToggle" onchange="toggleReadingImage(this.checked)" style="width:18px;height:18px;accent-color:#f59e0b;">
                <label for="readingImageToggle" style="margin:0;font-weight:600;">Include image box on reading page</label>
              </div>
              <div class="form-group"><label>Target Sound <span class="req">*</span></label><input id="fTargetSound" placeholder="short e (/ɛ/)" oninput="renderThumbnail()"></div>
              <div class="form-group"><label>Story Text <span class="req">*</span></label><textarea id="fStory" rows="8" placeholder="One sentence per line..." oninput="renderThumbnail()"></textarea></div>
              <div class="form-group" style="display:flex;align-items:center;gap:10px;margin-top:16px;">
                <input type="checkbox" id="imagePageToggle" onchange="toggleImagePage(this.checked)" style="width:18px;height:18px;accent-color:#f59e0b;">
                <label for="imagePageToggle" style="margin:0;font-weight:600;">Include full-page image placeholder before reading page</label>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Image Page Width (px)</label>
                  <input type="number" id="imagePageWidthInput" min="50" max="800" value="${DEFAULT_IMAGE_PAGE_WIDTH}" onchange="updateImagePageWidth(this.value)">
                </div>
                <div class="form-group">
                  <label>Image Page Height (px)</label>
                  <input type="number" id="imagePageHeightInput" min="50" max="1000" value="${DEFAULT_IMAGE_PAGE_HEIGHT}" onchange="updateImagePageHeight(this.value)">
                </div>
              </div>
              <div class="form-group" style="display:flex;align-items:center;gap:10px;margin-top:16px;">
                <input type="checkbox" id="spriteToggle" onchange="toggleSprite(this.checked)" style="width:18px;height:18px;accent-color:#f59e0b;">
                <label for="spriteToggle" style="margin:0;font-weight:600;">Use sprite sheet for image</label>
              </div>
              <div id="spriteFields" style="display:none;margin-top:8px;">
                <div class="form-group">
                  <label>Sprite Sheet</label>
                  <select id="spriteSheetSelect" onchange="updateSpriteSheet(this.value)"></select>
                </div>
                <div class="form-row">
                  <div class="form-group"><label>Crop X</label><input type="number" id="spriteCropX" min="0" value="0" onchange="updateSpriteCropX(this.value)"></div>
                  <div class="form-group"><label>Crop Y</label><input type="number" id="spriteCropY" min="0" value="0" onchange="updateSpriteCropY(this.value)"></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label>Crop Width</label><input type="number" id="spriteCropWidth" min="1" value="0" onchange="updateSpriteCropWidth(this.value)"></div>
                  <div class="form-group"><label>Crop Height</label><input type="number" id="spriteCropHeight" min="1" value="0" onchange="updateSpriteCropHeight(this.value)"></div>
                </div>
              </div>
              <hr style="margin:16px 0;border-color:#e2e8f0;">
              <h4 style="margin-bottom:12px;">📋 Page 2 Activities</h4>
              <div class="form-group" style="display:flex;align-items:center;gap:10px;">
                <input type="checkbox" id="compToggle" onchange="toggleSection('comp', this.checked)" style="width:18px;height:18px;accent-color:#f59e0b;">
                <label for="compToggle" style="margin:0;font-weight:600;">Comprehension Section</label>
              </div>
              <div id="compQuestionsContainer" style="margin-bottom:16px;"></div>
              <button class="btn btn-outline btn-sm" onclick="addQuestion()">+ Add Question</button>
              <hr style="margin:16px 0;border-color:#e2e8f0;">
              <div class="form-group" style="display:flex;align-items:center;gap:10px;">
                <input type="checkbox" id="findSoundToggle" onchange="toggleSection('findSound', this.checked)" style="width:18px;height:18px;accent-color:#f59e0b;">
                <label for="findSoundToggle" style="margin:0;font-weight:600;">Find Sound Section</label>
              </div>
              <div class="form-group">
                <label>Find Sound Instruction</label>
                <textarea id="findSoundInstruction" rows="2" onchange="updateFindSoundInstruction(this.value)"></textarea>
              </div>
              <hr style="margin:16px 0;border-color:#e2e8f0;">
              <div class="form-group" style="display:flex;align-items:center;gap:10px;">
                <input type="checkbox" id="sentenceToggle" onchange="toggleSection('sentence', this.checked)" style="width:18px;height:18px;accent-color:#f59e0b;">
                <label for="sentenceToggle" style="margin:0;font-weight:600;">Sentence Writing Section</label>
              </div>
              <div class="form-group">
                <label>Sentence Writing Instruction</label>
                <textarea id="sentenceInstruction" rows="2" onchange="updateSentenceInstruction(this.value)"></textarea>
              </div>
              <div class="form-group">
                <label>Number of Lines</label>
                <input type="number" id="sentenceLines" min="1" max="10" value="1" onchange="updateSentenceLines(this.value)">
              </div>
              <div class="form-actions">
                <button class="btn btn-primary" id="saveBtn" onclick="saveLesson()">💾 Save Lesson</button>
                <button class="btn btn-outline" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
                <button class="btn btn-outline" id="viewLessonBtn" onclick="viewLessonFromEdit()" style="display:none">👁️ View Lesson</button>
              </div>
            </div>
          </div>
          <div class="tab-panel" id="bookPanel">
            <div style="max-width:900px;margin:0 auto;">
              <h2 style="margin-bottom:20px;">📘 Book Cover &amp; Setup</h2>
              <div class="form-section" style="position:static;max-height:none;margin-bottom:24px;">
                <div class="form-group"><label>Cover Title</label><input id="coverTitleInput" value="${escapeHtml(bookMeta.title)}"></div>
                <div class="form-group"><label>Cover Subtitle</label><input id="coverSubtitleInput" value="${escapeHtml(bookMeta.subtitle)}"></div>
                <div class="form-group"><label>Global Grade</label><input id="globalGradeInput" value="${escapeHtml(bookMeta.grade)}" placeholder="e.g. 1, 2, K"></div>
                <div class="form-group" style="display:flex;align-items:center;gap:12px;margin-top:16px;">
                  <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:14px;">
                    <input type="checkbox" id="tocToggle" style="width:18px;height:18px;accent-color:#f59e0b;"> Include Table of Contents
                  </label>
                </div>
                <hr style="margin:20px 0;border-color:#e2e8f0;">
                <div class="form-group" style="display:flex;align-items:center;gap:12px;">
                  <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:14px;">
                    <input type="checkbox" id="sightWordsToggle" onchange="toggleSightWordsFields()" style="width:18px;height:18px;accent-color:#f59e0b;"> Include Sight Words Pages
                  </label>
                </div>
                <div id="sightWordsFields" style="display:none;">
                  <div class="form-group">
                    <label>Sight Words Page Title</label>
                    <input id="sightWordsTitle" value="${escapeHtml(bookMeta.sightWords.title)}" placeholder="e.g. Sight Words">
                  </div>
                  <div class="form-row">
                    <div class="form-group">
                      <label>Columns (2-6)</label>
                      <input type="number" id="sightColumns" min="${MIN_SIGHT_COLUMNS}" max="${MAX_SIGHT_COLUMNS}" value="${bookMeta.sightWords.columns}" onchange="this.value = Math.min(Math.max(parseInt(this.value) || ${DEFAULT_SIGHT_COLUMNS}, ${MIN_SIGHT_COLUMNS}), ${MAX_SIGHT_COLUMNS})">
                    </div>
                  </div>
                  <div class="form-group">
                    <label>Sight Words (comma separated, line breaks create new pages)</label>
                    <textarea id="sightWordsText" rows="6" placeholder="Example:&#10;the, and, you, was&#10;for, are, with, his&#10;they, I, at, be, this">${escapeHtml(bookMeta.sightWords.rawText)}</textarea>
                  </div>
                </div>
                <hr style="margin:20px 0;border-color:#e2e8f0;">
                <h3>📜 Acknowledgements Page</h3>
                <div class="form-group" style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                  <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:14px;">
                    <input type="checkbox" id="fShowAck" ${ackData.show ? 'checked' : ''} onchange="toggleAckFields()" style="width:18px;height:18px;accent-color:#f59e0b;">
                    Show Acknowledgements Page
                  </label>
                </div>
                <div id="ackFields">
                  <div class="form-group"><label>Title</label><input id="fAckTitle" value="${escapeHtml(ackData.title)}"></div>
                  <div class="form-group"><label>Body Text</label><textarea id="fAckBody" rows="4">${escapeHtml(ackData.body)}</textarea></div>
                  <div class="form-group"><label>Publication Details Title</label><input id="fAckPubTitle" value="${escapeHtml(ackData.pubTitle)}"></div>
                  <div class="form-group"><label>Publication Details</label><textarea id="fAckPubBody" rows="5">${escapeHtml(ackData.pubBody)}</textarea></div>
                </div>
                <button class="btn btn-success btn-sm" onclick="saveAck()" style="margin-bottom:16px;">💾 Save Acknowledgements</button>
                <hr style="margin:20px 0;border-color:#e2e8f0;">
                <h3>🧩 Sprite Sheets</h3>
                <div class="sprite-sheet-upload" style="margin-bottom:10px;">
                  <input type="file" id="spriteSheetFile" accept="image/*" onchange="addSpriteSheet(this)">
                  <label for="spriteSheetFile" class="btn btn-outline btn-sm">Upload Sprite Sheet</label>
                </div>
                <div id="spriteSheetsList" style="margin-top:10px;"></div>
                <button class="btn btn-primary" onclick="saveBookMeta()">💾 Save Cover, TOC &amp; Sprite Settings</button>
              </div>

              <div class="list-section">
                <h2>📖 All Readers</h2>
                <div class="list-toolbar">
                  <input class="search-box" id="searchInput" placeholder="🔍 Search..." oninput="window.searchQuery=this.value;renderEditList()">
                  <span class="count" id="listCount">0/0</span>
                  <button class="btn btn-success btn-sm" onclick="exportJSON()">📤 Export JSON</button>
                  <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">📥 Import</button>
                  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
                </div>
                <div class="lesson-list" id="lessonList"></div>
              </div>
            </div>
          </div>
          <div class="tab-panel" id="viewPanel">
            <div class="view-toolbar"><span class="info" id="viewInfo">0 lessons</span><button class="btn btn-success" onclick="exportAllPages()">⬇ Export All</button></div>
            <div class="view-container" id="viewContainer"></div>
          </div>`;

        // Initialize UI after DOM insertion
        populateSpriteSheetSelect();
        toggleSpriteFields();
        renderSpriteSheetsList();
        document.getElementById('sightWordsToggle').checked = bookMeta.sightWords.enabled;
        document.getElementById('sightWordsTitle').value = bookMeta.sightWords.title;
        document.getElementById('sightColumns').value = bookMeta.sightWords.columns;
        document.getElementById('sightWordsText').value = bookMeta.sightWords.rawText;
        toggleSightWordsFields();
        if (document.getElementById('fShowAck')) {
          document.getElementById('fShowAck').checked = !!ackData.show;
          toggleAckFields();
        }

        resetForm();
        renderEditList();
        renderAllView();
        updateCounts();
        renderTocPreview();

        const list = document.getElementById('lessonList');
        list.addEventListener('dragstart', e => {
          const item = e.target.closest('.lesson-item');
          if (item) { item.classList.add('dragging'); e.dataTransfer.setData('text/plain', item.dataset.id); }
        });
        list.addEventListener('dragend', e => {
          const item = e.target.closest('.lesson-item');
          if (item) item.classList.remove('dragging');
          list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        });
        list.addEventListener('dragover', e => {
          e.preventDefault();
          const target = e.target.closest('.lesson-item');
          list.querySelectorAll('.drag-over').forEach(el => { if (el !== target) el.classList.remove('drag-over'); });
          if (target && !target.classList.contains('dragging')) target.classList.add('drag-over');
        });
        list.addEventListener('dragleave', e => {
          const target = e.target.closest('.lesson-item');
          if (target) target.classList.remove('drag-over');
        });
        list.addEventListener('drop', e => {
          e.preventDefault();
          list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
          const id = e.dataTransfer.getData('text/plain');
          const target = e.target.closest('.lesson-item');
          if (id && target && target.dataset.id !== id) {
            const fromIdx = lessons.findIndex(l => l.id === id);
            const toIdx = lessons.findIndex(l => l.id === target.dataset.id);
            if (fromIdx !== -1 && toIdx !== -1) {
              const [moved] = lessons.splice(fromIdx, 1);
              lessons.splice(toIdx, 0, moved);
              renumberByOrder(lessons);
              saveData(); refreshUI(); showToast('Order updated.', 'info');
            }
          }
        });

        renderThumbnail();
      }

      initApp();
    })();
  </script>
</body>
</html>
