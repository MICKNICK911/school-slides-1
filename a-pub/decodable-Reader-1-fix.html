<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📖 Decodable Readers Publisher with Cover, TOC & Sight Words</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --accent-soft: #fef3c7;
      --accent-ring: rgba(245, 158, 11, 0.25);
      --red: #dc2626;
      --red-hover: #b91c1c;
      --red-soft: #fef2f2;
      --green: #16a34a;
      --green-hover: #15803d;
      --green-soft: #f0fdf4;
      --orange: #ea580c;
      --orange-hover: #c2410c;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --scarlet: #b91c1c;
      --scarlet-light: #fff5f5;
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-2xl: 24px;
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-md: 0 10px 25px rgba(0,0,0,0.07), 0 4px 10px rgba(0,0,0,0.04);
      --shadow-lg: 0 20px 50px rgba(0,0,0,0.10), 0 8px 20px rgba(0,0,0,0.05);
      --shadow-xl: 0 30px 70px rgba(0,0,0,0.12), 0 12px 30px rgba(0,0,0,0.06);
      --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @page { size: 850px 1100px; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; line-height: 1.5; letter-spacing: -0.01em; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; border-radius: 20px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 20px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .app { max-width: 1400px; margin: 0 auto; background: var(--surface); border-radius: var(--radius-2xl); box-shadow: var(--shadow-lg); overflow: hidden; border: 1px solid var(--border); }
    .app-header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #1a1a2e 100%); color: #fff; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; position: relative; overflow: hidden; }
    .app-header::before { content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
    .app-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; }
    .app-header h1 .icon { font-size: 26px; }
    .app-header .badge { background: var(--accent); color: #0f172a; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.01em; position: relative; z-index: 1; box-shadow: 0 2px 8px rgba(245, 158, 11, 0.35); }

    .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface-alt); padding: 0 28px; gap: 2px; position: relative; }
    .tab-btn { padding: 14px 24px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: all var(--transition); font-family: var(--font); position: relative; letter-spacing: -0.01em; white-space: nowrap; border-radius: 8px 8px 0 0; margin-bottom: -1px; }
    .tab-btn:hover { color: var(--text); background: rgba(0,0,0,0.03); }
    .tab-btn.active { color: var(--text); font-weight: 700; background: var(--surface); border: 1px solid var(--border); border-bottom-color: var(--surface); box-shadow: 0 -2px 8px rgba(0,0,0,0.03); }
    .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 8px; right: 8px; height: 3px; background: var(--accent); border-radius: 3px 3px 0 0; }

    .tab-panel { display: none; padding: 24px 28px 28px; animation: fadeSlideIn 0.25s ease; }
    .tab-panel.active { display: block; }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: 420px; width: 100%; pointer-events: none; }
    .toast { padding: 13px 18px; border-radius: var(--radius); color: #fff; font-weight: 600; font-size: 13px; box-shadow: var(--shadow-lg); animation: toastSlideIn 0.35s cubic-bezier(0.22,0.61,0.36,1); display: flex; align-items: center; gap: 10px; pointer-events: auto; letter-spacing: -0.01em; backdrop-filter: blur(8px); }
    .toast.success { background: #059669; } .toast.error { background: #dc2626; } .toast.warning { background: #ea580c; } .toast.info { background: #2563eb; }
    .toast .close-toast { background: none; border: none; color: inherit; font-size: 16px; cursor: pointer; margin-left: auto; opacity: 0.7; padding: 2px; border-radius: 4px; transition: opacity var(--transition); }
    .toast .close-toast:hover { opacity: 1; background: rgba(255,255,255,0.15); }
    @keyframes toastSlideIn { from { opacity: 0; transform: translateX(40px) scale(0.95); } to { opacity: 1; transform: translateX(0) scale(1); } }

    .form-section { background: var(--surface-alt); border-radius: var(--radius-xl); padding: 22px 24px; border: 1px solid var(--border); max-width: 800px; margin: 0 auto; box-shadow: var(--shadow-xs); }
    .form-section h2 { font-size: 17px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
    .form-section h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 600; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; letter-spacing: 0.01em; text-transform: uppercase; }
    .form-group label .req { color: var(--red); font-weight: 700; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font); transition: all var(--transition); background: var(--surface); color: var(--text); letter-spacing: -0.01em; resize: vertical; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring); background: #fff; }
    .form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); }
    .form-group textarea { resize: vertical; min-height: 50px; line-height: 1.6; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    .form-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

    .btn { padding: 9px 18px; border: none; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; cursor: pointer; transition: all var(--transition); font-family: var(--font); display: inline-flex; align-items: center; gap: 6px; letter-spacing: -0.01em; white-space: nowrap; position: relative; overflow: hidden; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    .btn-primary { background: var(--accent); color: #0f172a; box-shadow: 0 2px 8px rgba(245,158,11,0.3); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 4px 14px rgba(245,158,11,0.4); transform: translateY(-1px); }
    .btn-success { background: var(--green); color: #fff; box-shadow: 0 2px 8px rgba(22,163,74,0.3); }
    .btn-success:hover:not(:disabled) { background: var(--green-hover); box-shadow: 0 4px 14px rgba(22,163,74,0.4); transform: translateY(-1px); }
    .btn-danger { background: var(--red); color: #fff; box-shadow: 0 2px 8px rgba(220,38,38,0.25); }
    .btn-danger:hover:not(:disabled) { background: var(--red-hover); box-shadow: 0 4px 14px rgba(220,38,38,0.35); transform: translateY(-1px); }
    .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-secondary); }
    .btn-outline:hover:not(:disabled) { background: var(--surface-alt); border-color: #cbd5e1; color: var(--text); }
    .btn-sm { padding: 7px 14px; font-size: 12px; border-radius: 6px; }
    .btn-xs { padding: 5px 10px; font-size: 11px; border-radius: 5px; gap: 3px; }
    .btn-warning { background: var(--orange); color: #fff; box-shadow: 0 2px 8px rgba(234,88,12,0.25); }
    .btn-warning:hover:not(:disabled) { background: var(--orange-hover); box-shadow: 0 4px 14px rgba(234,88,12,0.35); transform: translateY(-1px); }

    .list-section { min-height: 400px; }
    .list-section h2 { font-size: 17px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
    .list-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .search-box { flex: 1; min-width: 160px; padding: 9px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font); background: var(--surface-alt); transition: all var(--transition); letter-spacing: -0.01em; }
    .search-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring); background: #fff; }
    .list-toolbar .count { font-weight: 700; color: var(--text-secondary); font-size: 13px; white-space: nowrap; background: var(--surface-alt); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); }
    .lesson-list { display: flex; flex-direction: column; gap: 6px; }
    .lesson-list .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); background: var(--surface-alt); border-radius: var(--radius-lg); border: 2px dashed var(--border); }
    .lesson-list .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
    .lesson-list .empty-state h3 { color: var(--text); margin-bottom: 4px; font-size: 15px; }
    .lesson-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); transition: all var(--transition); cursor: grab; user-select: none; }
    .lesson-item:hover { border-color: #cbd5e1; box-shadow: var(--shadow-sm); background: #fafbfc; }
    .lesson-item.dragging { opacity: 0.35; border-color: var(--accent); background: var(--accent-soft); box-shadow: var(--shadow-md); }
    .lesson-item .drag-handle { color: #cbd5e1; font-size: 18px; cursor: grab; line-height: 1; flex-shrink: 0; padding: 2px; border-radius: 4px; transition: color var(--transition); }
    .lesson-item:hover .drag-handle { color: #94a3b8; }
    .lesson-item .drag-handle:active { cursor: grabbing; }
    .lesson-item .info { flex: 1; min-width: 0; }
    .lesson-item .info .title { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
    .lesson-item .info .sub { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
    .lesson-item .actions { display: flex; gap: 3px; flex-shrink: 0; }
    .lesson-item.drag-over { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-ring); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); display: flex; align-items: center; justify-content: center; z-index: 9998; animation: fadeIn 0.2s ease; backdrop-filter: blur(2px); }
    .modal-overlay .modal { background: #fff; border-radius: var(--radius-xl); padding: 28px; max-width: 420px; width: 90%; box-shadow: var(--shadow-xl); animation: modalPop 0.25s cubic-bezier(0.22,0.61,0.36,1); }
    @keyframes modalPop { from { opacity: 0; transform: scale(0.92) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal-overlay .modal h3 { margin-bottom: 6px; font-size: 18px; letter-spacing: -0.01em; }
    .modal-overlay .modal p { color: var(--text-secondary); margin-bottom: 20px; font-size: 14px; line-height: 1.5; }
    .modal-overlay .modal .actions { display: flex; gap: 10px; justify-content: flex-end; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ========== VIEW TAB – EXACT 850×1100 LAYOUT ========== */
    .view-container { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .lesson-spread { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; }

    .view-container .page { width: 850px; min-width: 850px; min-height: 1100px; height: 1100px; padding: 30px 35px; position: relative; margin: 0 auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); box-sizing: border-box; overflow: hidden; flex-shrink: 0; }
    .view-container .page:last-child { page-break-after: auto; }

    .view-container .card { border: 3px solid #f59e0b; border-radius: 26px; min-height: 1010px; height: 1010px; padding: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #fff; }

    .view-container .page .page-actions { text-align: right; padding: 8px 12px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; border-radius: 8px 8px 0 0; margin-bottom: 6px; }
    .view-container .export-btn, .view-container .edit-btn { background: #b91c1c; color: #fff; border: none; border-radius: 6px; padding: 7px 16px; font-weight: 600; font-size: 12px; font-family: var(--font); cursor: pointer; transition: all var(--transition); margin-left: 8px; }
    .view-container .edit-btn { background: #2563eb; }
    .view-container .export-btn:hover, .view-container .edit-btn:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    .inner-pad { flex: 1; padding: 20px 28px 0 28px; display: flex; flex-direction: column; }

    .page-footer-red { margin-top: auto; height: 26px; width: 100%; background: #b91c1c; border-radius: 0 0 23px 23px; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: 800; font-size: 17px; flex-shrink: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; letter-spacing: 0.02em; }

    .header-row { display: flex; align-items: stretch; gap: 0; margin-bottom: 14px; font-weight: 800; height: 44px; flex-shrink: 0; }
    .header-lesson { background: #f59e0b; color: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2px 18px; border-radius: 10px 0 0 10px; line-height: 1.1; font-size: 11px; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-weight: 800; }
    .header-lesson span { font-size: 19px; font-weight: 900; }
    .header-title { background: #b91c1c; color: #fff; flex: 1; display: flex; justify-content: center; align-items: center; font-size: 21px; letter-spacing: 0.04em; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-weight: 800; }
    .header-grade { background: #f59e0b; color: #0f172a; display: flex; justify-content: center; align-items: center; padding: 2px 18px; border-radius: 0 10px 10px 0; font-size: 15px; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-weight: 800; }

    /* Page 1 (original layout – with optional image box) */
    .title-image-row { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 18px; flex-shrink: 0; }
    .title-side { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; }
    .story-title { font-size: 28px; font-weight: 800; color: #b91c1c; margin: 0 0 8px 0; line-height: 1.15; letter-spacing: -0.01em; }
    .target-pill { display: inline-block; background: #fef9e7; border: 2px solid #f59e0b; border-radius: 26px; padding: 5px 16px; font-weight: 700; font-size: 16px; width: fit-content; align-self: flex-start; flex-shrink: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .story-img-container { flex: 0 0 420px; width: 420px; height: 160px; border-radius: 12px; overflow: hidden; background: #e2e8f0; position: relative; border: 1px solid #cbd5e1; -webkit-print-color-adjust: exact; print-color-adjust: exact; flex-shrink: 0; }
    .story-img-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .story-img-placeholder { width: 100%; height: 100%; background: linear-gradient(135deg, #1e3a5f 0%, #2a4a7f 100%); display: flex; align-items: center; justify-content: center; position: relative; }
    .story-img-placeholder svg { width: 100%; height: 100%; }
    .story-img-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.65); color: #fff; text-align: center; padding: 5px 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .title-block { margin-bottom: 18px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
    .title-block .story-title { text-align: center; }
    .title-block .target-pill { display: block; width: 100%; text-align: center; box-sizing: border-box; }

    .story-lines-area { flex: 0 0 auto; position: relative; padding-bottom: 8px; margin-bottom: 10px; }
    .story-line { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 0; font-size: 18px; font-weight: 600; line-height: 1.5; }
    .story-line .sentence { flex: 1; }
    .story-line .wc { font-weight: 700; color: #b91c1c; min-width: 30px; text-align: right; font-size: 16px; }

    .parent-corner { margin-top: 25px; margin-bottom: 12px; border: 3px solid #8B4513; border-radius: 12px; overflow: hidden; flex-shrink: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pc-header { background: #f59e0b; color: #0f172a; font-weight: 800; font-size: 15px; text-align: center; padding: 5px; letter-spacing: 0.08em; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pc-body { padding: 10px 14px; background: #fffdf7; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pc-body p { font-size: 12px; margin-bottom: 8px; line-height: 1.45; font-weight: 700; color: #b91c1c; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .parent-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12px; }
    .parent-table th, .parent-table td { padding: 7px 5px; text-align: center; border: 2px solid #8B4513; }
    .parent-table th:first-child { background: #fdfdfd; color: #0f172a; }
    .parent-table th { background: #b91c1c; color: #fff; font-weight: 800; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .parent-table td:first-child { font-weight: 700; text-align: left; background: #fdfdfd; }

    .comp-section { margin: 15px 0; flex-shrink: 0; }
    .comp-section.last-section { flex: 1; display: flex; flex-direction: column; }
    .comp-section.last-section .activity-blank-large { flex: 1; min-height: 120px; }
    .comp-header { background: #b91c1c; color: #fff; border-radius: 12px; padding: 7px 18px; font-size: 16px; font-weight: 700; display: inline-block; margin-bottom: 10px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .comp-q { margin-bottom: 18px; }
    .comp-q .qtext { font-weight: 700; font-size: 17px; margin-bottom: 5px; }
    .comp-q .opt { display: flex; align-items: center; gap: 12px; font-size: 16px; padding: 2px 0; }
    .comp-q .box-check { display: inline-block; width: 20px; height: 20px; border: 2px solid #b91c1c; border-radius: 4px; background: #fff; flex-shrink: 0; }
    .theory-answer { border-bottom: 2px solid #b91c1c; height: 30px; margin-top: 8px; }
    .activity-blank-large { flex: 0 0 auto; min-height: 120px; border: 3px solid #8B4513; border-radius: 16px; margin: 10px 0 18px 0; background: #fff; width: 100%; overflow: hidden; }
    .writing-line { border-bottom: 2px dashed #8B4513; height: 40px; margin: 10px 0 15px 0; width: 100%; display: flex; align-items: flex-end; }
    .writing-line .line-number { font-weight: 800; color: #8B4513; margin-right: 8px; font-size: 16px; }
    .comp-inst { font-size: 15px; color: #334155; margin-bottom: 5px; line-height: 1.55; }

    .image-only-page { display: flex; flex-direction: column; }
    .image-only-page .image-full-placeholder { flex: 1; border: 3px solid #f59e0b; border-radius: 16px; background: #f8fafc; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .image-only-page .image-full-placeholder img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-only-page .image-full-placeholder .placeholder-text { font-size: 24px; font-weight: 700; color: #94a3b8; }
    .image-only-page .image-full-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.65); color: #fff; text-align: center; padding: 8px 10px; font-size: 16px; font-weight: 700; letter-spacing: 0.03em; -webkit-print-color-adjust: exact; print-color-adjust: exact; z-index: 1; }
    .image-only-page .page-footer-red { margin-top: auto; }

    /* NEW: Image page square/rect container */
    .image-square-frame {
      width: var(--image-page-width, 600px);
      height: var(--image-page-height, 600px);
      border: 6px solid #b91c1c;
      outline: 4px solid #b91c1c;
      outline-offset: 4px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .image-square-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;

<body>
  <div id="app"></div>
  <div class="toast-container" id="toastContainer"></div>

  <script>
    (function() {
      // ---------- Storage Configuration ----------
      const IDB_NAME = 'DecodableReadersDB';
      const IDB_STORE = 'appData';
      const LEGACY_LOCAL_STORAGE_KEYS = ['decodable_readers_v7', 'decodable_readers_v6', 'decodable_readers_v5', 'decodable_readers_v4', 'decodable_readers_v3'];
      const MAX_IMAGE_SIZE = 2 * 1024 * 1024;
      const MAX_TOC_PER_PAGE = 20;
      const DEFAULT_IMAGE_LABEL = "Let's read together!";
      const DEFAULT_IMAGE_PAGE_LABEL = "Picture Page";
      const DEFAULT_IMAGE_PATH = "./read.png";
      const MAX_OPTIONS = 5;
      const DEFAULT_SIGHT_WORDS_TITLE = 'Sight Words';
      const DEFAULT_SIGHT_COLUMNS = 4;
      const MIN_SIGHT_COLUMNS = 2;
      const MAX_SIGHT_COLUMNS = 6;
      const DEFAULT_IMAGE_PAGE_WIDTH = 600;
      const DEFAULT_IMAGE_PAGE_HEIGHT = 600;

      // ---------- IndexedDB Utility ----------
      let dbPromise = null;
      function getDB() {
        if (!dbPromise) {
          dbPromise = new Promise((resolve, reject) => {
            const request = indexedDB.open(IDB_NAME, 1);
            request.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(IDB_STORE)) {
                db.createObjectStore(IDB_STORE);
              }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
        }
        return dbPromise;
      }

      async function idbSet(data) {
        try {
          const db = await getDB();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            const store = tx.objectStore(IDB_STORE);
            store.put(data, 'appData');
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        } catch (e) {
          localStorage.setItem(LEGACY_LOCAL_STORAGE_KEYS[0], JSON.stringify(data));
        }
      }

      async function idbGet() {
        try {
          const db = await getDB();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, 'readonly');
            const store = tx.objectStore(IDB_STORE);
            const request = store.get('appData');
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
        } catch (e) {
          return null;
        }
      }

      // ---------- Helper Functions ----------
      function escapeHtml(str) { return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
      function showToast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        const icons = {success:'✓',error:'✕',warning:'⚠',info:'ℹ'};
        t.innerHTML = `<span style="font-weight:700;font-size:15px;">${icons[type]||icons.info}</span> ${escapeHtml(msg)}<button class="close-toast" onclick="this.parentElement.remove()">×</button>`;
        c.appendChild(t);
        setTimeout(() => { if (t.parentElement) t.remove(); }, 4000);
      }
      function confirmDialog(msg, cb) {
        const ov = document.createElement('div');
        ov.className = 'modal-overlay';
        ov.innerHTML = `<div class="modal"><h3>⚠️ Confirm</h3><p>${msg}</p><div class="actions"><button class="btn btn-outline cancel">Cancel</button><button class="btn btn-danger confirm">Yes, Proceed</button></div></div>`;
        document.body.appendChild(ov);
        ov.querySelector('.cancel').onclick = () => ov.remove();
        ov.querySelector('.confirm').onclick = () => { ov.remove(); cb(); };
        ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });
      }
      function countWords(sentence) { return sentence.trim().split(/\s+/).filter(w => w).length; }
      function generateQuestionId() { return 'q' + Math.random().toString(36).substring(2, 9); }

      // ---------- Sprite Sheet Utility ----------
      function cropSpriteSheet(spriteDataUrl, crop, callback) {
        const img = new Image();
        img.onload = function() {
          try {
            // Validate crop rectangle
            const naturalW = img.naturalWidth;
            const naturalH = img.naturalHeight;
            const x = Math.max(0, Math.min(crop.x || 0, naturalW));
            const y = Math.max(0, Math.min(crop.y || 0, naturalH));
            const width = Math.min(Math.max(0, crop.width || 0), naturalW - x);
            const height = Math.min(Math.max(0, crop.height || 0), naturalH - y);
            if (width <= 0 || height <= 0) {
              callback(null);
              return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, x, y, width, height, 0, 0, width, height);
            callback(canvas.toDataURL('image/png'));
          } catch (e) {
            callback(null);
          }
        };
        img.onerror = function() {
          callback(null);
        };
        img.src = spriteDataUrl;
      }

      function cropSpriteSheetPromise(spriteDataUrl, crop) {
        return new Promise((resolve) => {
          if (!spriteDataUrl || !crop) {
            resolve(null);
            return;
          }
          cropSpriteSheet(spriteDataUrl, crop, (result) => resolve(result || null));
        });
      }

      /**
       * Resolve the best image source for a lesson.
       * Priority: live sprite crop (when useSprite) → existing imageUrl → null (caller uses default).
       * Also caches the cropped data URL onto lesson.imageUrl when successful.
       */
      async function resolveLessonImageSrc(lesson) {
        if (!lesson) return null;
        try {
          if (lesson.useSprite && lesson.spriteSheetId) {
            const sheets = (bookMeta && bookMeta.spriteSheets) ? bookMeta.spriteSheets : [];
            const sheet = sheets.find(s => s.id === lesson.spriteSheetId);
            const crop = lesson.spriteCrop || {};
            if (sheet && sheet.dataUrl && (crop.width > 0) && (crop.height > 0)) {
              const cropped = await cropSpriteSheetPromise(sheet.dataUrl, crop);
              if (cropped) {
                lesson.imageUrl = cropped; // cache for print/export and future renders
                return cropped;
              }
            }
          }
          if (lesson.imageUrl && String(lesson.imageUrl).trim()) {
            return String(lesson.imageUrl).trim();
          }
        } catch (e) {
          console.warn('resolveLessonImageSrc failed', e);
        }
        return null;
      }

      /** Fill imageUrl for any lesson that uses a sprite but has no usable imageUrl yet. */
      async function ensureLessonSpriteImage(lesson) {
        if (!lesson || !lesson.useSprite || !lesson.spriteSheetId) return false;
        const existing = lesson.imageUrl && String(lesson.imageUrl).trim();
        // If already has a data-URL crop, keep it (fast path). Still allow re-crop if crop coords matter on force.
        if (existing && existing.indexOf('data:image') === 0) return false;
        const src = await resolveLessonImageSrc(lesson);
        return !!(src && src.indexOf('data:image') === 0);
      }

      /** Batch-resolve sprites for all lessons. Returns count of newly filled images. */
      async function ensureAllSpriteImages() {
        let filled = 0;
        for (const lesson of lessons) {
          const changed = await ensureLessonSpriteImage(lesson);
          if (changed) filled++;
        }
        return filled;
      }

      /** Attach resolved src to an <img>, with placeholder fallback. Non-blocking. */
      function bindLessonImage(imgEl, lesson, fallbackSrc) {
        const fallback = fallbackSrc || DEFAULT_IMAGE_PATH;
        const hasUrl = lesson && lesson.imageUrl && String(lesson.imageUrl).trim();
        imgEl.src = hasUrl ? String(lesson.imageUrl).trim() : fallback;
        imgEl.onerror = function() {
          if (imgEl.dataset.fallbackApplied) return;
          imgEl.dataset.fallbackApplied = '1';
          imgEl.src = fallback;
        };
        // Always try live sprite resolve when flagged — updates src when ready and caches
        if (lesson && lesson.useSprite && lesson.spriteSheetId) {
          resolveLessonImageSrc(lesson).then((src) => {
            if (src) {
              imgEl.src = src;
              imgEl.dataset.fallbackApplied = '';
            }
          }).catch(() => {});
        }
      }

      // ---------- Default Page2 & Migration ----------
      function getDefaultPage2() {
        return {
          comprehension: {
            enabled: true,
            questions: [
              { id: generateQuestionId(), type: 'objective', question: '', options: ['', '', ''] }
            ]
          },
          findSound: {
            enabled: true,
            instruction: 'Find and list all the words in the story with the target sound.'
          },
          sentenceWriting: {
            enabled: true,
            instruction: 'Write any one sentence from the story.',
            numberOfLines: 1
          }
        };
      }

      function migrateLesson(l) {
        if (!l.page2) {
          const oldComprehension = Array.isArray(l.comprehension) ? l.comprehension : [];
          const questions = oldComprehension.map(q => ({
            id: generateQuestionId(),
            type: 'objective',
            question: q.question || '',
            options: q.options && q.options.length ? q.options.slice(0, MAX_OPTIONS) : ['', '', '']
          }));
          if (questions.length === 0) {
            questions.push({ id: generateQuestionId(), type: 'objective', question: '', options: ['', '', ''] });
          }
          l.page2 = {
            comprehension: { enabled: true, questions },
            findSound: { enabled: true, instruction: 'Find and list all the words in the story with the target sound.' },
            sentenceWriting: { enabled: true, instruction: 'Write any one sentence from the story.', numberOfLines: 1 }
          };
          delete l.comprehension;
        } else {
          if (!l.page2.comprehension) l.page2.comprehension = { enabled: true, questions: [] };
          if (!l.page2.comprehension.questions) l.page2.comprehension.questions = [];
          if (!l.page2.findSound) l.page2.findSound = { enabled: true, instruction: 'Find and list all the words in the story with the target sound.' };
          if (!l.page2.sentenceWriting) l.page2.sentenceWriting = { enabled: true, instruction: 'Write any one sentence from the story.', numberOfLines: 1 };
        }
        l.page2.comprehension.questions.forEach(q => {
          if (!q.id) q.id = generateQuestionId();
          if (q.type !== 'objective' && q.type !== 'theory') q.type = 'objective';
          if (q.type === 'objective') {
            if (!Array.isArray(q.options)) q.options = ['', '', ''];
            if (q.options.length < 2) while (q.options.length < 2) q.options.push('');
            if (q.options.length > MAX_OPTIONS) q.options = q.options.slice(0, MAX_OPTIONS);
          } else {
            delete q.options;
          }
        });
        l.page2.sentenceWriting.numberOfLines = parseInt(l.page2.sentenceWriting.numberOfLines) || 1;
        if (typeof l.showImagePage !== 'boolean') l.showImagePage = false;
        if (typeof l.imagePageLabel !== 'string') l.imagePageLabel = DEFAULT_IMAGE_PAGE_LABEL;
        if (typeof l.showReadingImageBox !== 'boolean') l.showReadingImageBox = false;
        if (typeof l.imagePageWidth !== 'number' || isNaN(l.imagePageWidth) || l.imagePageWidth <= 0) l.imagePageWidth = DEFAULT_IMAGE_PAGE_WIDTH;

      // ---------- Data Loading / Saving ----------
      async function loadData() {
        let data = null;
        try { data = await idbGet(); } catch (e) { data = null; }
        if (!data || !data.lessons) {
          for (const key of LEGACY_LOCAL_STORAGE_KEYS) {
            try {
              const raw = localStorage.getItem(key);
              if (raw) {
                const parsed = JSON.parse(raw);
                if (parsed.lessons) { data = parsed; break; }
              }
            } catch (e) {}
          }
        }

        if (data && data.lessons) {
          lessons = data.lessons.map(l => migrateLesson({
            id: String(l.id || ''),
            lessonNumber: typeof l.lessonNumber === 'number' ? l.lessonNumber : 0,
            imageUrl: String(l.imageUrl || ''),
            title: String(l.title || 'Untitled'),
            targetSound: String(l.targetSound || ''),
            imageLabel: String(l.imageLabel ?? DEFAULT_IMAGE_LABEL),
            imagePageLabel: String(l.imagePageLabel ?? DEFAULT_IMAGE_PAGE_LABEL),
            showReadingImageBox: typeof l.showReadingImageBox === 'boolean' ? l.showReadingImageBox : false,
            imagePageWidth: typeof l.imagePageWidth === 'number' ? l.imagePageWidth : DEFAULT_IMAGE_PAGE_WIDTH,
            imagePageHeight: typeof l.imagePageHeight === 'number' ? l.imagePageHeight : DEFAULT_IMAGE_PAGE_HEIGHT,
            useSprite: typeof l.useSprite === 'boolean' ? l.useSprite : false,
            spriteSheetId: String(l.spriteSheetId || ''),
            spriteCrop: l.spriteCrop || { x: 0, y: 0, width: 0, height: 0 },
            originalImageUrl: String(l.originalImageUrl || ''),
            storyLines: (Array.isArray(l.storyLines) ? l.storyLines : []).map(sl => ({ sentence: String(sl.sentence || '') })).filter(sl => sl.sentence.trim() !== ''),
            comprehension: Array.isArray(l.comprehension) ? l.comprehension : [],
            showImagePage: typeof l.showImagePage === 'boolean' ? l.showImagePage : false,
            page2: l.page2
          })).filter(l => l.id);
          bookMeta = data.bookMeta || { 
            title: 'Decodable Readers', 
            subtitle: 'Grade 1', 
            grade: '1', 
            showToc: true, 
            readingImageDefaultOffApplied: false, 
            sightWords: { enabled: false, title: DEFAULT_SIGHT_WORDS_TITLE, columns: DEFAULT_SIGHT_COLUMNS, rawText: '' },
            spriteSheets: []
          };
          if (!bookMeta.sightWords) {
            bookMeta.sightWords = { enabled: false, title: DEFAULT_SIGHT_WORDS_TITLE, columns: DEFAULT_SIGHT_COLUMNS, rawText: '' };
          } else {
            bookMeta.sightWords.enabled = (typeof bookMeta.sightWords.enabled === 'boolean') ? bookMeta.sightWords.enabled : false;
            bookMeta.sightWords.title = String(bookMeta.sightWords.title || DEFAULT_SIGHT_WORDS_TITLE);
            bookMeta.sightWords.columns = parseInt(bookMeta.sightWords.columns) || DEFAULT_SIGHT_COLUMNS;
            bookMeta.sightWords.columns = Math.min(Math.max(bookMeta.sightWords.columns, MIN_SIGHT_COLUMNS), MAX_SIGHT_COLUMNS);
            bookMeta.sightWords.rawText = String(bookMeta.sightWords.rawText || '');
          }
          if (!Array.isArray(bookMeta.spriteSheets)) bookMeta.spriteSheets = [];

          if (!bookMeta.readingImageDefaultOffApplied) {
            lessons.forEach(l => l.showReadingImageBox = false);
            bookMeta.readingImageDefaultOffApplied = true;
          }
        } else {
          lessons = JSON.parse(JSON.stringify(DEFAULT_LESSONS)).map(l => migrateLesson(l));
          bookMeta = { 
            title: 'Decodable Readers', 
            subtitle: 'Grade 1', 
            grade: '1', 
            showToc: true,
            readingImageDefaultOffApplied: true,
            sightWords: { enabled: false, title: DEFAULT_SIGHT_WORDS_TITLE, columns: DEFAULT_SIGHT_COLUMNS, rawText: '' },
            spriteSheets: []
          };
        }
        bookMeta.grade = String(bookMeta.grade || '1');
        bookMeta.showToc = (typeof bookMeta.showToc === 'boolean') ? bookMeta.showToc : true;
        if (data && data.ackData) {
          ackData = Object.assign({}, DEFAULT_ACK, data.ackData);
        } else {
          ackData = { ...DEFAULT_ACK };
        }
        renumberByOrder(lessons);
        nextId = Math.max(...lessons.map(l => parseInt(l.id.replace('r','')) || 0), 0) + 1;
        // Fill missing cropped imageUrls from sprite sheets (robust for imports where imageUrl is empty)
        try {
          const filled = await ensureAllSpriteImages();
          if (filled > 0) {
            // Persist cached crops so print/export and reloads are instant
            await saveData();
          } else {
            await saveData();
          }
        } catch (e) {
          console.warn('ensureAllSpriteImages on load failed', e);
          await saveData();
        }
      }

      async function saveData() {
        const payload = { lessons, bookMeta, ackData };
        await idbSet(payload);
      }

      function generateId() { return 'r' + (nextId++); }

      // ---------- Sight Words Parsing ----------
      function parseSightWords(rawText) {
        if (!rawText || !rawText.trim()) return [];
        const lines = rawText.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
        if (lines.length === 0) return [];
        let pages = [];
        if (lines.length === 1) {
          const words = lines[0].split(',').map(w => w.trim()).filter(w => w.length > 0);
          if (words.length === 0) return [];
          const pagesCount = 3;
          const perPage = Math.ceil(words.length / pagesCount);
          for (let i = 0; i < pagesCount; i++) {
            pages.push(words.slice(i * perPage, (i + 1) * perPage));
          }
        } else {
          pages = lines.map(line => line.split(',').map(w => w.trim()).filter(w => w.length > 0));
          pages = pages.filter(page => page.length > 0);
        }
        return pages;
      }

      function countSightWordPages() {
        if (!bookMeta.sightWords.enabled) return 0;
        return parseSightWords(bookMeta.sightWords.rawText).length;

      function buildSightWordPage(words, pageNum, columns) {
        const page = document.createElement('div'); page.className = 'page sight-word-page';
        page.innerHTML = `<div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div>`;
        const card = document.createElement('div'); card.className = 'card';
        card.style.borderColor = 'var(--scarlet)';
        const header = document.createElement('div');
        header.className = 'sight-word-header';
        header.textContent = bookMeta.sightWords.title || DEFAULT_SIGHT_WORDS_TITLE;
        card.appendChild(header);
        const grid = document.createElement('div');
        grid.className = 'sight-word-grid';
        // Set inline styles for precision
        grid.style.display = 'grid';
        grid.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
        grid.style.gap = '20px';
        grid.style.padding = '30px';
        grid.style.flex = '1';
        grid.style.alignItems = 'center';
        // Compute available content width inside the card:
        // Page width = 850, page padding left/right = 35 each => 780px card width.
        // Grid padding left/right = 30 each => 780 - 60 = 720px for columns.
        // Subtract gaps: (columns - 1) * 20.
        const contentWidth = 720;
        const totalGap = (columns - 1) * 20;
        const columnWidthApprox = Math.floor((contentWidth - totalGap) / columns);
        const baseFontSize = 28;
        words.forEach(word => {
          const item = document.createElement('div');
          item.className = 'sight-word-item';
          const lengthFactor = Math.max(1, word.length);
          const fontSize = Math.max(14, Math.min(baseFontSize, Math.floor(columnWidthApprox / (lengthFactor * 0.6))));
          item.style.fontSize = fontSize + 'px';
          item.textContent = word;
          grid.appendChild(item);
        });
        card.appendChild(grid);
        const footer = document.createElement('div');
        footer.className = 'page-footer-red sight-word-footer';
        footer.textContent = pageNum;
        card.appendChild(footer);
        page.appendChild(card);
        return page;
      }

      function renderAllView() {
        const container = document.getElementById('viewContainer');
        if (!container) return;
        container.innerHTML = '';
        container.appendChild(buildCoverPage());
        if (ackData.show) {
          container.appendChild(buildAckPage());
        }
        if (!lessons.length) {
          if (bookMeta.sightWords.enabled) {
            const sightPages = parseSightWords(bookMeta.sightWords.rawText);
            let pageNum = 2;
            sightPages.forEach(chunk => {
              container.appendChild(buildSightWordPage(chunk, pageNum, bookMeta.sightWords.columns));
              pageNum++;
            });
          }
          return;
        }
        const activeLessons = lessons.filter(l => l.title.trim());
        const sightWordPages = bookMeta.sightWords.enabled ? parseSightWords(bookMeta.sightWords.rawText) : [];
        const sightPageCount = sightWordPages.length;
        const tocPageCount = (bookMeta.showToc && activeLessons.length) ? Math.ceil(activeLessons.length / MAX_TOC_PER_PAGE) : 0;

        let pageNum = 1;
        if (sightPageCount > 0) {
          sightWordPages.forEach((chunk, idx) => {
            container.appendChild(buildSightWordPage(chunk, pageNum + idx + 1, bookMeta.sightWords.columns));
          });
        }
        pageNum += sightPageCount + 1;
        const firstLessonPage = pageNum + tocPageCount;

        const effectiveLessons = activeLessons.map(l => {
          if (previewLessonOverride && previewLessonOverride.id === l.id) {
            return { ...l, ...previewLessonOverride };
          }
          return l;
        });

        const tocEntries = [];
        let runningPage = firstLessonPage;
        effectiveLessons.forEach(l => {
          tocEntries.push({ lessonNumber: l.lessonNumber, title: l.title, firstPage: runningPage });
          runningPage += l.showImagePage ? 3 : 2;
        });

        if (bookMeta.showToc && tocPageCount > 0) {
          for (let p = 0; p < tocPageCount; p++) {
            const slice = tocEntries.slice(p * MAX_TOC_PER_PAGE, (p + 1) * MAX_TOC_PER_PAGE);
            container.appendChild(buildTocPage(pageNum + p, slice));
          }
        }

        let currentPage = firstLessonPage;
        effectiveLessons.forEach(l => {
          const spread = document.createElement('div');
          spread.className = 'lesson-spread';
          spread.setAttribute('data-lesson-id', l.id);
          if (l.showImagePage) spread.appendChild(buildImagePage(l, currentPage++));
          spread.appendChild(buildPageOne(l, currentPage++));
          spread.appendChild(buildPageTwo(l, currentPage++));
          container.appendChild(spread);
        });

        // Background: ensure any missing sprite crops are filled & persisted (non-blocking)
        ensureAllSpriteImages().then((filled) => {
          if (filled > 0) saveData().catch(() => {});
        }).catch(() => {});
      }

      window.exportSinglePage = function(pageEl) {
        const clone = pageEl.cloneNode(true);
        const actions = clone.querySelector('.page-actions');

        const win = window.open('', '_blank');
        const styles = document.querySelector('style').outerHTML;
        win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Export Page</title>${styles}</head><body style="padding:0;background:#fff;margin:0;display:flex;justify-content:center;"><div class="view-container" style="overflow:visible;display:flex;flex-direction:column;align-items:center;">${clone.outerHTML}</div></body></html>`);
        win.document.close(); win.focus(); setTimeout(() => win.print(), 500);
      };
      window.exportAllPages = async function() {
        if (!lessons.length && !bookMeta.sightWords.enabled) return showToast('No lessons to export.', 'warning');
        showToast('Preparing pages (resolving sprites)…', 'info');
        try {
          await ensureAllSpriteImages();
        } catch (e) { /* continue with whatever we have */ }
        renderAllView();
        // Give the browser a moment to paint async-bound images
        await new Promise(r => setTimeout(r, 400));
        const container = document.querySelector('.view-container').cloneNode(true);
        const actions = container.querySelectorAll('.page-actions');
        actions.forEach(el => el.remove());
        const win = window.open('', '_blank');
        const styles = document.querySelector('style').outerHTML;
        win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>All Pages</title>${styles}</head><body style="padding:0;background:#fff;margin:0;">${container.outerHTML}</body></html>`);
        win.document.close(); win.focus(); setTimeout(() => win.print(), 600);
      };

      function renderThumbnail() {
        const container = document.getElementById('thumbnailContainer');
        if (!container) return;
        container.innerHTML = '';
        const tempLesson = getFormData();
        tempLesson.id = editingId || 'preview';

        const builders = [];
        if (tempLesson.showImagePage) {
          builders.push({ label: 'Image Page', builder: () => buildImagePage(tempLesson, 1) });
        }
        builders.push({ label: 'Page 1', builder: () => buildPageOne(tempLesson, 2) });
        builders.push({ label: 'Page 2', builder: () => buildPageTwo(tempLesson, 3) });

        builders.forEach(item => {
          const wrapper = document.createElement('div');
          wrapper.className = 'thumb-page-wrapper';
          const label = document.createElement('div');
          label.className = 'thumb-label-small';
          label.textContent = item.label;
          const pageEl = item.builder();
          const actions = pageEl.querySelector('.page-actions');
          if (actions) actions.remove();
          pageEl.style.transform = 'scale(0.25)';
          pageEl.style.transformOrigin = 'top left';
          pageEl.style.position = 'absolute';
          pageEl.style.top = '0';
          pageEl.style.left = '0';
          pageEl.style.width = '850px';
          pageEl.style.minWidth = '850px';
          pageEl.style.minHeight = '1100px';
          pageEl.style.height = '1100px';
          pageEl.style.padding = '30px 35px';
          pageEl.style.margin = '0';
          pageEl.style.borderRadius = '0';
          pageEl.style.boxShadow = 'none';
          pageEl.style.pageBreakAfter = 'auto';
          wrapper.appendChild(pageEl);
          wrapper.appendChild(label);
          container.appendChild(wrapper);
        });
      }

      function renderQuestionList() {
        const container = document.getElementById('compQuestionsContainer');
        if (!container) return;
        if (!tempPage2 || !tempPage2.comprehension) return;
        const questions = tempPage2.comprehension.questions;
        let html = '';
        questions.forEach((q, idx) => {
          html += `<div class="question-card" data-index="${idx}">
            <div class="q-header">
              <span class="q-title">Question ${idx+1}</span>
              <div class="q-controls">
                <button class="btn btn-outline btn-xs" onclick="moveQuestion(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} title="Move up">▲</button>
                <button class="btn btn-outline btn-xs" onclick="moveQuestion(${idx}, 1)" ${idx === questions.length-1 ? 'disabled' : ''} title="Move down">▼</button>
                <button class="btn btn-danger btn-xs" onclick="deleteQuestion(${idx})" title="Delete">🗑️</button>
              </div>
            </div>
            <div class="form-group">
              <label>Type</label>
              <select onchange="changeQuestionType(${idx}, this.value)">
                <option value="objective" ${q.type === 'objective' ? 'selected' : ''}>Objective (Multiple Choice)</option>
                <option value="theory" ${q.type === 'theory' ? 'selected' : ''}>Theory (Open Ended)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Question Text</label>
              <input type="text" value="${escapeHtml(q.question)}" onchange="updateQuestionText(${idx}, this.value)">
            </div>`;
          if (q.type === 'objective') {
            html += `<div class="form-group">
              <label>Options (2-5)</label>`;
            q.options.forEach((opt, optIdx) => {
              html += `<div class="option-row">
                <input type="text" value="${escapeHtml(opt)}" placeholder="Option ${optIdx+1}" onchange="updateOption(${idx}, ${optIdx}, this.value)">
                <button class="btn btn-danger btn-xs" onclick="deleteOption(${idx}, ${optIdx})" ${q.options.length <= 2 ? 'disabled' : ''}>✕</button>
              </div>`;
            });
            html += `<button class="btn btn-outline btn-xs add-option-btn" onclick="addOption(${idx})" ${q.options.length >= MAX_OPTIONS ? 'disabled' : ''}>+ Add Option</button>
            </div>`;
          }
          html += `</div>`;
        });
        if (questions.length === 0) {
          html = '<p style="color:#94a3b8; text-align:center; padding:12px;">No questions yet. Click "Add Question" to create.</p>';
        }
        container.innerHTML = html;
      }

      // Question CRUD
      window.addQuestion = function() {
        if (!tempPage2) return;
        tempPage2.comprehension.questions.push({ id: generateQuestionId(), type: 'objective', question: '', options: ['', '', ''] });
        renderQuestionList();
        renderThumbnail();
      };
      window.deleteQuestion = function(idx) {
        if (!tempPage2) return;
        tempPage2.comprehension.questions.splice(idx, 1);
        renderQuestionList();
        renderThumbnail();
      };
      window.moveQuestion = function(idx, dir) {
        if (!tempPage2) return;
        const arr = tempPage2.comprehension.questions;
        const newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= arr.length) return;
        const temp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = temp;
        renderQuestionList();
        renderThumbnail();
      };
      window.changeQuestionType = function(idx, type) {
        if (!tempPage2) return;
        const q = tempPage2.comprehension.questions[idx];
        if (!q) return;
        q.type = type;
        if (type === 'objective' && !q.options) q.options = ['', '', ''];
        else if (type === 'theory') delete q.options;
        renderQuestionList();
        renderThumbnail();
      };
      window.updateQuestionText = function(idx, value) {
        if (!tempPage2) return;
        const q = tempPage2.comprehension.questions[idx];
        if (q) q.question = value.trim();
        renderThumbnail();
      };
      window.updateOption = function(qIdx, optIdx, value) {
        if (!tempPage2) return;
        const q = tempPage2.comprehension.questions[qIdx];
        if (q && q.options) q.options[optIdx] = value.trim();
        renderThumbnail();
      };
      window.addOption = function(qIdx) {
        if (!tempPage2) return;
        const q = tempPage2.comprehension.questions[qIdx];
        if (q && q.options && q.options.length < MAX_OPTIONS) {
          q.options.push('');
          renderQuestionList();
          renderThumbnail();
        }
      };
      window.deleteOption = function(qIdx, optIdx) {
        if (!tempPage2) return;
        const q = tempPage2.comprehension.questions[qIdx];
        if (q && q.options && q.options.length > 2) {
          q.options.splice(optIdx, 1);
          renderQuestionList();
          renderThumbnail();
        }
      };

      // Section toggles
      window.toggleSection = function(section, checked) {
        if (!tempPage2) return;
        if (section === 'comp') tempPage2.comprehension.enabled = checked;
        else if (section === 'findSound') tempPage2.findSound.enabled = checked;
        else if (section === 'sentence') tempPage2.sentenceWriting.enabled = checked;
        renderQuestionList();
        renderThumbnail();
      };
      window.updateFindSoundInstruction = function(value) {
        if (tempPage2) tempPage2.findSound.instruction = value;
        renderThumbnail();
      };
      window.updateSentenceInstruction = function(value) {
        if (tempPage2) tempPage2.sentenceWriting.instruction = value;
        renderThumbnail();
      };
      window.updateSentenceLines = function(value) {
        if (tempPage2) tempPage2.sentenceWriting.numberOfLines = parseInt(value) || 1;
        renderThumbnail();
      };
      window.toggleImagePage = function(checked) {
        tempShowImagePage = checked;

      };
      window.toggleReadingImage = function(checked) {
        tempShowReadingImageBox = checked;
        renderThumbnail();
      };

        tempImagePageWidth = parseInt(value) || DEFAULT_IMAGE_PAGE_WIDTH;

      };
      window.updateImagePageHeight = function(value) {
        tempImagePageHeight = parseInt(value) || DEFAULT_IMAGE_PAGE_HEIGHT;
        renderThumbnail();
      };

        tempUseSprite = checked;

        renderThumbnail();

      window.updateSpriteCropY = function(value) {
        tempSpriteCrop.y = parseInt(value) || 0;
        renderThumbnail();

      window.updateSpriteCropWidth = function(value) {
        tempSpriteCrop.width = parseInt(value) || 0;

      window.updateSpriteCropHeight = function(value) {

      function toggleSpriteFields() {
        const spriteSection = document.getElementById('spriteFields');
        if (spriteSection) spriteSection.style.display = tempUseSprite ? 'block' : 'none';
      }

      // ---------- Save / Edit / Delete / Import / Export ----------
      window.handleImageUpload = function(event) {
        const file = event.target.files[0];
        if (!file) return;
        if (file.size > MAX_IMAGE_SIZE) { showToast('Image must be less than 2 MB.', 'error'); event.target.value = ''; return; }
        if (!file.type.startsWith('image/')) { showToast('Please select a valid image file.', 'error'); event.target.value = ''; return; }
        const reader = new FileReader();
        reader.onload = e => {
          const dataUrl = e.target.result;
          document.getElementById('fImageUrl').value = dataUrl;
          tempOriginalImageUrl = dataUrl;
          updateImagePreview(dataUrl);
          renderThumbnail();
          showToast('Image uploaded and embedded!', 'success');
        };
        reader.readAsDataURL(file);
      };

      window.editLesson = function(id) {
        const lesson = lessons.find(l => l.id === id);
        if (!lesson) return showToast('Lesson not found.', 'error');
        editingId = id;
        document.getElementById('formTitle').innerHTML = '<span class="dot" style="background:#2563eb;"></span> Edit Reader';
        fillForm(lesson);
        document.getElementById('saveBtn').textContent = '💾 Update Lesson';
        document.getElementById('cancelBtn').style.display = 'inline-flex';
        document.getElementById('viewLessonBtn').style.display = 'inline-flex';
        document.querySelector('.form-section').scrollIntoView({behavior:'smooth'});
        switchTab('edit');
      };
      window.cancelEdit = function() { resetForm(); showToast('Edit cancelled.', 'info'); };
      window.saveLesson = async function() {
        const data = getFormData();
        if (!data.title || !data.targetSound || data.storyLines.length < 1) {
          return showToast('Please fill all required fields (title, target sound, at least 1 story line).', 'error');
        }
        if (data.page2.comprehension.enabled) {
          if (data.page2.comprehension.questions.length === 0) {
            return showToast('Please add at least one comprehension question or disable the section.', 'error');
          }
          for (const q of data.page2.comprehension.questions) {
            if (q.type === 'objective') {
              const validOptions = q.options.filter(o => o.trim() !== '');
              if (validOptions.length < 2) {
                return showToast('Each objective question must have at least 2 non-empty options.', 'error');
              }
            }
          }
        }

        // Validate sprite mode
        if (data.useSprite) {
          if (!data.spriteSheetId) {
            return showToast('Please select a sprite sheet when sprite mode is enabled.', 'error');
          }
          if (data.spriteCrop.width <= 0 || data.spriteCrop.height <= 0) {
            return showToast('Crop width and height must be greater than zero.', 'error');
          }
        }

        try {
          if (data.useSprite) {
            const sprite = bookMeta.spriteSheets.find(s => s.id === data.spriteSheetId);
            if (!sprite) {
              return showToast('Selected sprite sheet not found.', 'error');
            }
            const croppedUrl = await new Promise((resolve, reject) => {
              cropSpriteSheet(sprite.dataUrl, data.spriteCrop, (cropped) => {
                if (cropped) resolve(cropped);
                else reject('Failed to crop sprite sheet. Check crop coordinates and image bounds.');
              });
            });
            data.imageUrl = croppedUrl;
          } else {
            data.imageUrl = document.getElementById('fImageUrl').value.trim();
          }
        } catch (err) {
          showToast(err, 'error');
          return;
        }

        data.originalImageUrl = tempOriginalImageUrl;

        if (editingId) {
          const idx = lessons.findIndex(l => l.id === editingId);
          if (idx === -1) return showToast('Not found.', 'error');
          data.lessonNumber = idx + 1;
          lessons[idx] = { ...lessons[idx], ...data, id: editingId };
        } else {
          data.lessonNumber = lessons.length + 1;
          lessons.push({ ...data, id: generateId() });
        }
        previewLessonOverride = null;
        saveData(); resetForm(); refreshUI(); showToast('Lesson saved!', 'success');
        switchTab('edit');
      };
      window.deleteLesson = function(id) {
        const l = lessons.find(l => l.id === id);
        if (!l) return;
        confirmDialog(`Delete "<strong>${escapeHtml(l.title)}</strong>"?`, () => {
          lessons = lessons.filter(l => l.id !== id);
          if (editingId === id) resetForm();
          renumberByOrder(lessons);
          previewLessonOverride = null;
          saveData(); refreshUI();
        });
      };
      window.duplicateLesson = function(id) {
        const l = lessons.find(l => l.id === id);
        if (!l) return;
        const copy = JSON.parse(JSON.stringify(l));
        delete copy.id; copy.id = generateId();
        lessons.push(copy);
        renumberByOrder(lessons);
        previewLessonOverride = null;
        saveData(); refreshUI(); showToast('Duplicated.', 'success');
      };
      window.exportJSON = function() {
        const payload = { lessons, bookMeta, ackData };
        const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'readers.json'; a.click();
      };
      window.importJSON = function(input) {
        const file = input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
          try {
            const data = JSON.parse(e.target.result);
            if (!data || typeof data !== 'object') throw new Error('Invalid');
            const importedLessons = Array.isArray(data.lessons) ? data.lessons : [];
            const validated = importedLessons.map(l => migrateLesson({
              id: String(l.id || ''),
              lessonNumber: typeof l.lessonNumber === 'number' ? l.lessonNumber : 0,
              imageUrl: String(l.imageUrl || ''),
              title: String(l.title || 'Untitled'),
              targetSound: String(l.targetSound || ''),
              imageLabel: String(l.imageLabel ?? DEFAULT_IMAGE_LABEL),
              imagePageLabel: String(l.imagePageLabel ?? DEFAULT_IMAGE_PAGE_LABEL),
              showReadingImageBox: typeof l.showReadingImageBox === 'boolean' ? l.showReadingImageBox : false,
              imagePageWidth: typeof l.imagePageWidth === 'number' ? l.imagePageWidth : DEFAULT_IMAGE_PAGE_WIDTH,
              imagePageHeight: typeof l.imagePageHeight === 'number' ? l.imagePageHeight : DEFAULT_IMAGE_PAGE_HEIGHT,
              useSprite: typeof l.useSprite === 'boolean' ? l.useSprite : false,
              spriteSheetId: String(l.spriteSheetId || ''),
              spriteCrop: l.spriteCrop || { x: 0, y: 0, width: 0, height: 0 },
              originalImageUrl: String(l.originalImageUrl || ''),
              storyLines: (Array.isArray(l.storyLines) ? l.storyLines : []).map(sl => ({ sentence: String(sl.sentence || '') })).filter(sl => sl.sentence.trim() !== ''),
              comprehension: Array.isArray(l.comprehension) ? l.comprehension : [],
              showImagePage: typeof l.showImagePage === 'boolean' ? l.showImagePage : false,
              page2: l.page2
            })).filter(l => l.id);
            if (validated.length === 0) throw new Error('No valid lessons');
            confirmDialog('Replace all lessons with imported data?', async () => {
              lessons = validated;
              bookMeta = data.bookMeta || { title: 'Decodable Readers', subtitle: 'Grade 1', grade: '1', showToc: true, readingImageDefaultOffApplied: true, sightWords: { enabled: false, title: DEFAULT_SIGHT_WORDS_TITLE, columns: DEFAULT_SIGHT_COLUMNS, rawText: '' }, spriteSheets: [] };
              if (!bookMeta.sightWords) bookMeta.sightWords = { enabled: false, title: DEFAULT_SIGHT_WORDS_TITLE, columns: DEFAULT_SIGHT_COLUMNS, rawText: '' };
              if (!Array.isArray(bookMeta.spriteSheets)) bookMeta.spriteSheets = [];
              bookMeta.grade = String(bookMeta.grade || '1');
              bookMeta.showToc = (typeof bookMeta.showToc === 'boolean') ? bookMeta.showToc : true;
              ackData = Object.assign({}, DEFAULT_ACK, data.ackData || {});
              renumberByOrder(lessons);
              nextId = Math.max(...lessons.map(l => parseInt(l.id.replace('r','')) || 0), 0) + 1;
              previewLessonOverride = null;
              showToast('Importing… resolving sprite images…', 'info');
              try {
                const filled = await ensureAllSpriteImages();
                await saveData();
                resetForm();
                refreshUI();
                showToast(filled > 0 ? `Imported successfully. Resolved ${filled} sprite image(s).` : 'Imported successfully.', 'success');
              } catch (err) {
                await saveData();
                resetForm();
                refreshUI();
                showToast('Imported (some sprites may still resolve in preview).', 'warning');
              }
              switchTab('book');
            });
          } catch(err) { showToast('Invalid JSON file.', 'error'); }
        };
        reader.readAsText(file);
        input.value = '';
      };

      // ---------- Sprite Sheet Management (Book Setup) ----------
      window.addSpriteSheet = function(fileInput) {
        const file = fileInput.files[0];
        if (!file) return;
        if (file.size > MAX_IMAGE_SIZE) { showToast('Sprite sheet must be less than 2 MB.', 'error'); fileInput.value = ''; return; }
        if (!file.type.startsWith('image/')) { showToast('Please select a valid image file.', 'error'); fileInput.value = ''; return; }
        const reader = new FileReader();
        reader.onload = e => {
          const dataUrl = e.target.result;
          const name = prompt('Enter a name for this sprite sheet:', 'Sprite Sheet ' + (bookMeta.spriteSheets.length + 1));
          fileInput.value = ''; // clear input regardless
          if (!name) return;
          const newSheet = { id: generateSpriteSheetId(), name: name.trim() || 'Unnamed', dataUrl };
          bookMeta.spriteSheets.push(newSheet);
          saveData();
          renderSpriteSheetsList();
          showToast('Sprite sheet added!', 'success');
        };
        reader.readAsDataURL(file);
      };

      window.deleteSpriteSheet = function(id) {
        const sheet = bookMeta.spriteSheets.find(s => s.id === id);
        if (!sheet) return;
        confirmDialog(`Delete sprite sheet "<strong>${escapeHtml(sheet.name)}</strong>"? Lessons using it may lose their cropped image.`, () => {
          bookMeta.spriteSheets = bookMeta.spriteSheets.filter(s => s.id !== id);
          lessons.forEach(l => {
            if (l.spriteSheetId === id) {
              l.useSprite = false;
              l.spriteSheetId = '';
              l.spriteCrop = { x: 0, y: 0, width: 0, height: 0 };
            }
          });
          saveData();
          renderSpriteSheetsList();
          renderEditList();
          showToast('Sprite sheet deleted.', 'info');
        });

        };
