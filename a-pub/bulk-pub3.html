<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 Phonics Lesson Publisher</title>
    <style>
        /* ----- Page & print base ----- */
        @page {
            size: 850px 1120px;
            margin: 0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
            background: #f5f7fa;
            color: #1a1a1a;
            padding: 20px;
        }
        .app {
            max-width: 1400px;
            margin: 0 auto;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .app-header {
            background: #1a1a2e;
            color: #fff;
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 800;
        }
        .app-header .badge {
            background: #F5A623;
            color: #1a1a1a;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid #e9ecef;
            background: #fafbfc;
            padding: 0 32px;
            gap: 4px;
        }
        .tab-btn {
            padding: 16px 28px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 700;
            color: #6c757d;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tab-btn:hover {
            color: #1a1a2e;
        }
        .tab-btn.active {
            color: #1a1a2e;
            border-bottom-color: #F5A623;
        }
        .tab-panel {
            display: none;
            padding: 24px 32px 32px;
        }
        .tab-panel.active {
            display: block;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 420px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            padding: 14px 20px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }
        .toast.success { background: #2d7d46; }
        .toast.error { background: #dc3545; }
        .toast.warning { background: #e67e22; }
        .toast.info { background: #2c7be5; }
        .toast .close-toast {
            background: none;
            border: none;
            color: inherit;
            font-size: 18px;
            cursor: pointer;
            margin-left: auto;
            opacity: 0.7;
        }
        .toast .close-toast:hover { opacity: 1; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .edit-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
        }
        @media (max-width: 1100px) {
            .edit-layout { grid-template-columns: 1fr; }
        }
        .form-section {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 24px;
            border: 2px solid #e9ecef;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        .form-section h2 {
            font-size: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-section h2 .edit-id {
            color: #6c757d;
            font-weight: 400;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 13px;
            color: #495057;
            margin-bottom: 4px;
        }
        .form-group label .req { color: #dc3545; }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: border 0.2s;

        .form-group input:focus,

        .form-row {

            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }
        .form-actions {

            margin-top: 16px;
            flex-wrap: wrap;
        }
        .btn {

            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;

        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #F5A623; color: #1a1a1a; }
        .btn-primary:hover:not(:disabled) { background: #e0950f; transform: translateY(-1px); }
        .btn-success { background: #2d7d46; color: #fff; }
        .btn-success:hover:not(:disabled) { background: #1f5f34; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #b02a37; }
        .btn-outline { background: transparent; border: 2px solid #dee2e6; color: #495057; }
        .btn-outline:hover:not(:disabled) { background: #f1f3f5; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn-xs { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
        .btn-warning { background: #e67e22; color: #fff; }
        .btn-warning:hover:not(:disabled) { background: #cf6d17; }
        .list-section { min-height: 400px; }
        .list-toolbar {

        .lesson-item {

            background: #f8f9fa;
            border-radius: 12px;

        .lesson-item:hover { border-color: #F5A623; background: #fff; }
        .lesson-item.dragging { opacity: 0.4; border-color: #F5A623; background: #fff8e7; }
        .lesson-item .drag-handle {
            color: #adb5bd;
            font-size: 20px;
            cursor: grab;

            flex-shrink: 0;
        }
        .lesson-item .drag-handle:active { cursor: grabbing; }
        .lesson-item .info { flex: 1; min-width: 0; }
        .lesson-item .info .title { font-weight: 700; font-size: 15px; }
        .lesson-item .info .sub {
            font-size: 13px;

        .modal-overlay {

<body>
    <div id="app"></div>
    <div class="toast-container" id="toastContainer"></div>
    <script>
        (function() {
            const STORAGE_KEY = 'phonics_lessons_v2';
            const MAX_TOC_PER_PAGE = 18;

            // Polyfill for flat() – safe flattening of one level
            function flattenWords(arr) {
                if (!Array.isArray(arr)) return [];
                let result = [];
                for (let row of arr) {
                    if (Array.isArray(row)) result = result.concat(row);
                }
                return result;
            }

            // HTML escaping to prevent XSS
            function escapeHtml(str) {
                if (typeof str !== 'string') return '';
                return str.replace(/[&<>"']/g, function(m) {
                    switch (m) {
                        case '&': return '&amp;';
                        case '<': return '&lt;';
                        case '>': return '&gt;';
                        case '"': return '&quot;';
                        case "'": return '&#39;';
                    }
                });
            }

            // Toast notification system
            function showToast(msg, type = 'info', dur = 3500) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
                toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${escapeHtml(msg)} <button class="close-toast">&times;</button>`;
                container.appendChild(toast);
                toast.querySelector('.close-toast').addEventListener('click', () => toast.remove());
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, dur);
            }

            // Custom confirm modal (consistent everywhere)
            function confirmDialog(msg, onConfirm) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                    <div class="modal">
                        <h3>⚠️ Confirm</h3>
                        <p>${escapeHtml(msg)}</p>
                        <div class="actions">
                            <button class="btn btn-outline btn-cancel">Cancel</button>
                            <button class="btn btn-danger btn-confirm">Yes</button>
                        </div>
                    </div>`;
                document.body.appendChild(overlay);
                overlay.querySelector('.btn-cancel').addEventListener('click', () => overlay.remove());
                overlay.querySelector('.btn-confirm').addEventListener('click', () => { overlay.remove(); onConfirm(); });
                overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
            }

            // ---------- DATA LAYER ----------
            const DEFAULT_LESSONS = [{
                id: 'l1',
                mainTitle: 'SHORT VOWEL CVC WORDS',
                lessonNumber: 1,
                letterTile: 'Short a',
                introText: 'Say each picture word out loud. Listen for the sound of "Short a".',
                words: [
                    ['bag', 'cat', 'mat', 'hat'],
                    ['rat', 'bat', 'sat', 'pat'],
                    ['fat', 'man']
                ],
                sentences: ['I can say the word bag and the word cat.', 'Look at the mat. Now look at the hat.'],
                fillBlanks: ['b_g', 'c_t', 'm_t', 'h_t', 'r_t']
            }];

            let lessons = [];
            let editingId = null;
            let nextId = 1;

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            lessons = parsed;
                            let maxId = 0;
                            lessons.forEach(l => {
                                if (!l.id) l.id = 'l' + Date.now() + Math.random().toString(36).slice(2, 6);
                                if (!l.mainTitle) l.mainTitle = 'SHORT VOWEL CVC WORDS';
                                // Fix old data that might have flat words array
                                if (l.words && l.words.length > 0 && !Array.isArray(l.words[0])) {
                                    const flat = l.words;
                                    const chunked = [];
                                    for (let i = 0; i < flat.length; i += 4) chunked.push(flat.slice(i, i + 4));
                                    l.words = chunked;
                                }
                                const num = parseInt(l.id.replace('l', '')) || 0;
                                if (num > maxId) maxId = num;
                            });
                            nextId = maxId + 1;
                            return;
                        }
                    }
                } catch (e) {
                    console.error('Failed to load data', e);
                }
                // Fallback to defaults
                lessons = JSON.parse(JSON.stringify(DEFAULT_LESSONS));
                lessons.forEach(l => { if (!l.id) l.id = 'l' + Date.now() + Math.random().toString(36).slice(2, 6); });
                nextId = lessons.length + 1;
                saveData();
            }

            function renderAllView() {
                const container = document.getElementById('viewContainer');
                if (!container) return;
                container.innerHTML = '';
                if (lessons.length === 0) {
                    container.innerHTML = '<div style="text-align:center;padding:80px 20px;color:#6c757d;"><div style="font-size:64px;">📖</div><h3>No lessons yet</h3><p>Switch to Edit tab to create your first lesson.</p></div>';
                    updateAllCounts();
                    return;
                }
                const totalTocPages = Math.ceil(lessons.length / MAX_TOC_PER_PAGE);
                const lessonStartPage = totalTocPages + 1;
                const tocEntries = lessons.map((lesson, idx) => ({
                    lessonNumber: lesson.lessonNumber,
                    mainTitle: lesson.mainTitle,
                    firstPage: lessonStartPage + idx * 2
                }));
                for (let p = 0; p < totalTocPages; p++) {
                    const slice = tocEntries.slice(p * MAX_TOC_PER_PAGE, (p + 1) * MAX_TOC_PER_PAGE);
                    container.appendChild(buildTocPage(p + 1, slice));
                }
                let pageNum = lessonStartPage;
                lessons.forEach(lesson => {
                    container.appendChild(buildPageOne(lesson, pageNum++));
                    container.appendChild(buildPageTwo(lesson, pageNum++));
                });
                updateAllCounts();
            }

                printWindow.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Lesson Export</title>');
                printWindow.document.write(styleEl.outerHTML);
                printWindow.document.write('</head><body style="padding:0;background:#fff;margin:0;">');
                printWindow.document.write('<div class="view-container" style="overflow:visible;">');
                printWindow.document.write(clone.outerHTML);
                printWindow.document.write('</div></body></html>');
                printWindow.document.close();
                printWindow.focus();
                setTimeout(() => printWindow.print(), 400);

                    const tocPages = lessons.length ? Math.ceil(lessons.length / MAX_TOC_PER_PAGE) : 0;

            // ---------- EDIT TAB LOGIC ----------
            function getFormData() {
                const mainTitle = document.getElementById('fMainTitle').value.trim();
                const lessonNumber = parseInt(document.getElementById('fLessonNumber').value, 10);
                const letterTile = document.getElementById('fLetterTile').value.trim();
                const introText = document.getElementById('fIntroText').value.trim();
                const wordsRaw = document.getElementById('fWords').value.split(',').map(s => s.trim()).filter(Boolean);
                const wordsChunked = [];
                for (let i = 0; i < wordsRaw.length; i += 4) wordsChunked.push(wordsRaw.slice(i, i + 4));
                if (wordsChunked.length === 0) wordsChunked.push([]);
                const sentences = document.getElementById('fSentences').value.split(',').map(s => s.trim()).filter(Boolean);
                const fillBlanks = document.getElementById('fFillBlanks').value.split(',').map(s => s.trim()).filter(Boolean);
                return { mainTitle, lessonNumber, letterTile, introText, words: wordsChunked, sentences, fillBlanks };
            }

            function fillForm(data) {
                document.getElementById('fMainTitle').value = data.mainTitle || 'SHORT VOWEL CVC WORDS';
                document.getElementById('fLessonNumber').value = data.lessonNumber || '';
                document.getElementById('fLetterTile').value = data.letterTile || '';
                document.getElementById('fIntroText').value = data.introText || '';
                document.getElementById('fWords').value = flattenWords(data.words || []).join(', ');
                document.getElementById('fSentences').value = (data.sentences || []).join(', ');
                document.getElementById('fFillBlanks').value = (data.fillBlanks || []).join(', ');
            }

            function resetForm() {
                editingId = null;
                document.getElementById('formTitle').textContent = '➕ Add New Lesson';
                document.getElementById('formId').textContent = '';
                document.getElementById('fMainTitle').value = '';
                document.getElementById('fLessonNumber').value = lessons.length + 1;
                document.getElementById('fLetterTile').value = '';
                document.getElementById('fIntroText').value = '';
                document.getElementById('fWords').value = '';
                document.getElementById('fSentences').value = '';
                document.getElementById('fFillBlanks').value = '';
                document.getElementById('saveBtn').textContent = '💾 Save Lesson';
                document.getElementById('cancelBtn').style.display = 'none';
            }

            function editLesson(id) {
                const lesson = lessons.find(l => l.id === id);
                if (!lesson) { showToast('Lesson not found.', 'error'); return; }
                editingId = id;
                document.getElementById('formTitle').textContent = '✏️ Edit Lesson';
                document.getElementById('formId').textContent = '#' + id;
                fillForm(lesson);
                document.getElementById('saveBtn').textContent = '💾 Update Lesson';
                document.getElementById('cancelBtn').style.display = 'inline-block';
                document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
            }

            function cancelEdit() {
                resetForm();
                showToast('Edit cancelled.', 'info');
            }

            function saveLesson() {
                const data = getFormData();
                if (!data.mainTitle) { showToast('Main Title is required.', 'error'); return; }
                if (!data.lessonNumber || data.lessonNumber <= 0) { showToast('Lesson Number must be positive.', 'error'); return; }
                if (!data.letterTile) { showToast('Letter Tile is required.', 'error'); return; }
                if (!data.introText) { showToast('Intro Text is required.', 'error'); return; }
                if (flattenWords(data.words).length < 6) { showToast('Add at least 6 words.', 'error'); return; }
                if (data.sentences.length < 2) { showToast('Add at least 2 sentences.', 'error'); return; }
                if (data.fillBlanks.length < 4) { showToast('Add at least 4 fill-in blanks.', 'error'); return; }

                const duplicate = lessons.find(l => l.lessonNumber === data.lessonNumber && l.id !== editingId);
                if (duplicate) {
                    confirmDialog('Lesson ' + data.lessonNumber + ' already exists. Continue anyway?', () => performSave(data));
                } else {
                    performSave(data);
                }
            }

            function performSave(data) {
                if (editingId) {
                    const idx = lessons.findIndex(l => l.id === editingId);
                    if (idx === -1) { showToast('Lesson not found.', 'error'); return; }
                    lessons[idx] = { ...lessons[idx], ...data, id: editingId };
                    showToast('Lesson ' + data.lessonNumber + ' updated.', 'success');
                } else {
                    const newLesson = { ...data, id: generateId() };
                    lessons.push(newLesson);
                    showToast('Lesson ' + data.lessonNumber + ' created.', 'success');
                }
                saveData();
                resetForm();
                refreshUI();
            }

            function deleteLesson(id) {
                const lesson = lessons.find(l => l.id === id);
                if (!lesson) return;
                confirmDialog(`Delete Lesson ${lesson.lessonNumber} "${lesson.letterTile}"?`, () => {
                    lessons = lessons.filter(l => l.id !== id);
                    saveData();
                    if (editingId === id) resetForm();
                    refreshUI();
                    showToast('Lesson deleted.', 'success');
                });
            }

            function duplicateLesson(id) {
                const lesson = lessons.find(l => l.id === id);
                if (!lesson) { showToast('Lesson not found.', 'error'); return; }
                const copy = JSON.parse(JSON.stringify(lesson));
                delete copy.id;
                copy.lessonNumber = lessons.reduce((max, l) => Math.max(max, l.lessonNumber), 0) + 1;
                copy.id = generateId();
                lessons.push(copy);
                saveData();
                refreshUI();
                showToast('Lesson duplicated.', 'success');
            }

            function exportJSON() {
                if (lessons.length === 0) { showToast('No lessons to export.', 'warning'); return; }
                const json = JSON.stringify(lessons, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'phonics_lessons_' + new Date().toISOString().slice(0, 10) + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('JSON exported.', 'success');
            }

            function importJSON(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!Array.isArray(data) || data.length === 0) { showToast('Invalid JSON file.', 'error'); return; }
                        const first = data[0];
                        if (!first.mainTitle && !first.lessonNumber && !first.letterTile) {
                            showToast('JSON does not contain valid lesson data.', 'error');
                            return;
                        }
                        confirmDialog(`Import ${data.length} lessons? This will replace all current lessons.`, () => {
                            let maxId = 0;
                            data.forEach(l => {
                                if (!l.id) l.id = 'l' + Date.now() + Math.random().toString(36).slice(2, 6);
                                if (!l.mainTitle) l.mainTitle = 'SHORT VOWEL CVC WORDS';
                                if (l.words && l.words.length > 0 && !Array.isArray(l.words[0])) {
                                    const flat = l.words;
                                    const chunked = [];
                                    for (let i = 0; i < flat.length; i += 4) chunked.push(flat.slice(i, i + 4));
                                    l.words = chunked;
                                }
                                const num = parseInt(l.id.replace('l', '')) || 0;
                                if (num > maxId) maxId = num;
                            });
                            lessons = data;
                            nextId = maxId + 1;
                            saveData();
                            resetForm();
                            refreshUI();
                            showToast('Imported ' + lessons.length + ' lessons.', 'success');
                        });
                    } catch (err) {
                        showToast('Failed to parse JSON: ' + err.message, 'error');
                    }
                };
                reader.onerror = () => showToast('Failed to read file.', 'error');
                reader.readAsText(file);
                event.target.value = '';
            }

            function refreshUI() {
                renderEditList();
                renderAllView();
                updateAllCounts();
            }

            // ----- Edit list rendering (search persists) -----
            let searchQuery = '';

            function renderEditList() {
                try {
                    const listContainer = document.getElementById('lessonList');
                    if (!listContainer) return;
                    const q = searchQuery.toLowerCase();
                    const filtered = lessons.filter(l => {
                        if (!q) return true;
                        return (String(l.lessonNumber).includes(q)) ||
                            (l.mainTitle || '').toLowerCase().includes(q) ||
                            (l.letterTile || '').toLowerCase().includes(q) ||
                            (l.introText || '').toLowerCase().includes(q) ||
                            flattenWords(l.words || []).join(' ').toLowerCase().includes(q) ||
                            (l.sentences || []).join(' ').toLowerCase().includes(q) ||
                            (l.fillBlanks || []).join(' ').toLowerCase().includes(q);
                    });

                    const countSpan = document.getElementById('listCount');
                    if (countSpan) countSpan.textContent = filtered.length + ' / ' + lessons.length;

                    if (filtered.length === 0) {
                        listContainer.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>No lessons found</h3><p>${q ? 'Try adjusting your search.' : 'Click "Add New Lesson" to get started.'}</p></div>`;
                    } else {
                        let html = '';
                        filtered.forEach(l => {
                            const actualIdx = lessons.indexOf(l);
                            html += `
                                <div class="lesson-item" draggable="true" data-index="${actualIdx}" data-id="${l.id}">
                                    <span class="drag-handle">⠿</span>
                                    <div class="info">
                                        <div class="title">Lesson ${escapeHtml(String(l.lessonNumber))} — ${escapeHtml(l.mainTitle || 'CVC')}</div>
                                        <div class="sub">${escapeHtml((l.introText || '').slice(0, 80))}${(l.introText || '').length > 80 ? '…' : ''}</div>
                                    </div>
                                    <div class="actions">
                                        <button class="btn btn-primary btn-xs" data-action="edit" data-id="${l.id}">✏️</button>
                                        <button class="btn btn-warning btn-xs" data-action="duplicate" data-id="${l.id}">📋</button>
                                        <button class="btn btn-danger btn-xs" data-action="delete" data-id="${l.id}">🗑️</button>
                                    </div>
                                </div>`;
                        });
                        listContainer.innerHTML = html;
                    }
                    attachDragDrop();
                } catch (err) {
                    console.error('renderEditList failed:', err);
                }
            }

            function attachDragDrop() {
                const items = document.querySelectorAll('.lesson-item');
                let dragIndex = null;
                items.forEach(item => {
                    item.addEventListener('dragstart', function(e) {
                        dragIndex = parseInt(item.dataset.index);
                        item.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', String(dragIndex));
                    });
                    item.addEventListener('dragend', function() {
                        item.classList.remove('dragging');
                        document.querySelectorAll('.lesson-item.drag-over').forEach(el => el.classList.remove('drag-over'));
                    });
                    item.addEventListener('dragover', function(e) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        const targetIndex = parseInt(item.dataset.index);
                        if (targetIndex !== dragIndex) {
                            document.querySelectorAll('.lesson-item.drag-over').forEach(el => el.classList.remove('drag-over'));
                            item.classList.add('drag-over');
                        }
                    });
                    item.addEventListener('dragleave', function() { item.classList.remove('drag-over'); });
                    item.addEventListener('drop', function(e) {
                        e.preventDefault();
                        item.classList.remove('drag-over');
                        const from = parseInt(e.dataTransfer.getData('text/plain'));
                        const to = parseInt(item.dataset.index);
                        if (!isNaN(from) && !isNaN(to) && from !== to) {
                            const moved = lessons.splice(from, 1)[0];
                            lessons.splice(to, 0, moved);
                            saveData();
                            refreshUI();
                            showToast('Lesson reordered.', 'success');
                        }
                    });
                });
            }

            // Event delegation for list buttons (single listener on the list)
            function handleListClick(e) {
                const btn = e.target.closest('button');
                if (!btn) return;
                const action = btn.dataset.action;
                const id = btn.dataset.id;
                if (!action || !id) return;
                e.stopPropagation();
                switch (action) {
                    case 'edit': editLesson(id); break;
                    case 'duplicate': duplicateLesson(id); break;
                    case 'delete': deleteLesson(id); break;
                }
            }

            // ----- Tab switching & init -----
            function switchTab(tab) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === tab + 'Panel'));
                if (tab === 'edit') renderEditList();   // ensure list is always fresh
                if (tab === 'view') renderAllView();
                updateAllCounts();
            }

            function init() {
                loadData();
                resetForm();
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.value = searchQuery;
                    searchInput.addEventListener('input', function(e) {
                        searchQuery = e.target.value;
                        renderEditList();
                    });
                }
                // Attach event delegation once
                const list = document.getElementById('lessonList');
                if (list) list.addEventListener('click', handleListClick);
                renderEditList();
                renderAllView();
                updateAllCounts();
                switchTab('edit');  // start on edit tab
            }

            // Expose functions for inline onclick
            window.switchTab = switchTab;
            window.saveLesson = saveLesson;
            window.editLesson = editLesson;
            window.deleteLesson = deleteLesson;
            window.duplicateLesson = duplicateLesson;

            window.exportJSON = exportJSON;
            window.importJSON = importJSON;
            window.exportAllPages = exportAllPages;

            document.addEventListener('DOMContentLoaded', function() {
