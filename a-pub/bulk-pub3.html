<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 Phonics Lesson Publisher</title>
    <style>
        /* (all styles from previous answer – omitted for brevity, they are unchanged) */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; background: #f5f7fa; color: #1a1a1a; padding: 20px; }
        /* ... keep all the CSS from the previous answer ... */
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            // ---------- UTILS ----------
            const STORAGE_KEY = 'phonics_lessons_v2';
            const MAX_TOC_PER_PAGE = 18;

            function flattenWords(arr) {
                if (!Array.isArray(arr)) return [];
                let result = [];
                for (let row of arr) {
                    if (Array.isArray(row)) result = result.concat(row);
                }
                return result;
            }

            function escapeHtml(str) {
                if (typeof str !== 'string') return '';
                return str.replace(/[&<>"']/g, function(m) {
                    switch (m) {
                        case '&': return '&amp;';
                        case '<': return '&lt;';
                        case '>': return '&gt;';
                        case '"': return '&quot;';
                        case "'": return '&#39;';
                    }
                });
            }

            function showToast(msg, type = 'info', dur = 3500) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
                toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${escapeHtml(msg)} <button class="close-toast">&times;</button>`;
                container.appendChild(toast);
                toast.querySelector('.close-toast').addEventListener('click', () => toast.remove());
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, dur);
            }

            function confirmDialog(msg, onConfirm) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                    <div class="modal">
                        <h3>⚠️ Confirm</h3>
                        <p>${escapeHtml(msg)}</p>
                        <div class="actions">
                            <button class="btn btn-outline btn-cancel">Cancel</button>
                            <button class="btn btn-danger btn-confirm">Yes</button>
                        </div>
                    </div>`;
                document.body.appendChild(overlay);
                overlay.querySelector('.btn-cancel').addEventListener('click', () => overlay.remove());
                overlay.querySelector('.btn-confirm').addEventListener('click', () => { overlay.remove(); onConfirm(); });
                overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
            }

            // ---------- DATA LAYER ----------
            const DEFAULT_LESSONS = [{
                id: 'l1',
                mainTitle: 'SHORT VOWEL CVC WORDS',
                lessonNumber: 1,
                letterTile: 'Short a',
                introText: 'Say each picture word out loud. Listen for the sound of "Short a".',
                words: [
                    ['bag', 'cat', 'mat', 'hat'],
                    ['rat', 'bat', 'sat', 'pat'],
                    ['fat', 'man']
                ],
                sentences: ['I can say the word bag and the word cat.', 'Look at the mat. Now look at the hat.'],
                fillBlanks: ['b_g', 'c_t', 'm_t', 'h_t', 'r_t']
            }];

            let lessons = [];
            let editingId = null;
            let nextId = 1;

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            lessons = parsed;
                            let maxId = 0;
                            lessons.forEach(l => {
                                if (!l.id) l.id = 'l' + Date.now() + Math.random().toString(36).slice(2, 6);
                                if (!l.mainTitle) l.mainTitle = 'SHORT VOWEL CVC WORDS';
                                if (l.words && l.words.length > 0 && !Array.isArray(l.words[0])) {
                                    const flat = l.words;
                                    const chunked = [];
                                    for (let i = 0; i < flat.length; i += 4) chunked.push(flat.slice(i, i + 4));
                                    l.words = chunked;
                                }
                                const num = parseInt(l.id.replace('l', '')) || 0;
                                if (num > maxId) maxId = num;
                            });
                            nextId = maxId + 1;
                            return;
                        }
                    }
                } catch (e) {
                    console.error('Failed to load data', e);
                }
                // fallback to defaults
                lessons = JSON.parse(JSON.stringify(DEFAULT_LESSONS));
                lessons.forEach(l => { if (!l.id) l.id = 'l' + Date.now() + Math.random().toString(36).slice(2, 6); });
                nextId = lessons.length + 1;
                saveData();
            }

            function saveData() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(lessons));
                } catch (e) {
                    showToast('Could not save: storage full. Please delete some lessons or clear browser data.', 'error', 6000);
                }
            }

            function generateId() { return 'l' + (nextId++); }

            // ---------- VIEW RENDERING (unchanged) ----------
            function createWordGrid(words, extraClass) {
                const grid = document.createElement('div');
                grid.className = 'word-grid' + (extraClass ? ' ' + extraClass : '');
                words.forEach(w => {
                    const pill = document.createElement('div');
                    pill.className = 'pill';
                    pill.textContent = w;
                    grid.appendChild(pill);
                });
                return grid;
            }

            function buildPageOne(lesson, pageNumber) {
                const page = document.createElement('div');
                page.className = 'page';
                const actions = document.createElement('div');
                actions.className = 'page-actions no-print';
                const btn = document.createElement('button');
                btn.className = 'export-btn';
                btn.textContent = '📄 Export this page to PDF';
                btn.onclick = () => exportSinglePage(page);
                actions.appendChild(btn);
                page.appendChild(actions);
                const card = document.createElement('div');
                card.className = 'card';
                page.appendChild(card);
                const titleEl = document.createElement('div');
                titleEl.className = 'title';
                titleEl.textContent = lesson.mainTitle || 'SHORT VOWEL CVC WORDS';
                card.appendChild(titleEl);
                const headerRow = document.createElement('div');
                headerRow.className = 'header-row';
                const badge = document.createElement('div');
                badge.className = 'lesson-badge';
                badge.innerHTML = '<div class="arrow"></div>';
                const labelDiv = document.createElement('div');
                labelDiv.className = 'label';
                labelDiv.textContent = 'Lesson';
                badge.appendChild(labelDiv);
                const numDiv = document.createElement('div');
                numDiv.className = 'num';
                numDiv.textContent = lesson.lessonNumber;
                badge.appendChild(numDiv);
                headerRow.appendChild(badge);
                const introBox = document.createElement('div');
                introBox.className = 'intro-box';
                const introP = document.createElement('p');
                introP.textContent = lesson.introText || '';
                introBox.appendChild(introP);
                headerRow.appendChild(introBox);
                card.appendChild(headerRow);
                const heroTile = document.createElement('div');
                heroTile.className = 'hero-tile';
                heroTile.innerHTML = `
                    <div class="sound-label">Today's Sound</div>
                    <div class="letter-display">${escapeHtml(lesson.letterTile || '')}</div>
                    <div class="decoration">✦ ✦ ✦</div>`;
                card.appendChild(heroTile);
                const sec1 = document.createElement('div');
                sec1.className = 'section-header';
                sec1.innerHTML = '<div class="circle">1</div><div class="label-box">Look and say aloud</div>';
                card.appendChild(sec1);
                const allWords = flattenWords(lesson.words || []);
                card.appendChild(createWordGrid(allWords));
                const pageNum = document.createElement('div');
                pageNum.className = 'page-number';
                pageNum.textContent = pageNumber;
                card.appendChild(pageNum);
                return page;
            }

            function buildPageTwo(lesson, pageNumber) {
                const page = document.createElement('div');
                page.className = 'page';
                const actions = document.createElement('div');
                actions.className = 'page-actions no-print';
                const btn = document.createElement('button');
                btn.className = 'export-btn';
                btn.textContent = '📄 Export this page to PDF';
                btn.onclick = () => exportSinglePage(page);
                actions.appendChild(btn);
                page.appendChild(actions);
                const card = document.createElement('div');
                card.className = 'card';
                page.appendChild(card);
                const sec2 = document.createElement('div');
                sec2.className = 'section-header';
                sec2.innerHTML = '<div class="circle">2</div><div class="label-box">Decodable Reading</div>';
                card.appendChild(sec2);
                const instr = document.createElement('div');
                instr.className = 'instructions';
                instr.textContent = 'Read ALOUD and circle all words with the short vowel sound';
                card.appendChild(instr);
                const readingBox = document.createElement('div');
                readingBox.className = 'reading-box';
                if (lesson.sentences) {
                    lesson.sentences.forEach((s, idx) => {
                        const p = document.createElement('p');
                        p.textContent = (idx + 1) + '. ' + s;
                        readingBox.appendChild(p);
                    });
                }
                card.appendChild(readingBox);
                const sec3 = document.createElement('div');
                sec3.className = 'section-header';
                sec3.innerHTML = '<div class="circle">3</div><div class="label-box">Activities</div>';
                card.appendChild(sec3);
                const actA = document.createElement('div');
                actA.className = 'activity-label';
                actA.textContent = 'A. Fill in the missing letters and say word';
                card.appendChild(actA);
                card.appendChild(createWordGrid(lesson.fillBlanks || [], 'blanks'));
                const actB = document.createElement('div');
                actB.className = 'activity-label';
                actB.textContent = 'B. Copy each word from above';
                card.appendChild(actB);
                const emptySlots = (lesson.fillBlanks || []).map(() => '\u00A0');
                card.appendChild(createWordGrid(emptySlots, 'empty'));
                const actC = document.createElement('div');
                actC.className = 'activity-label';
                actC.textContent = 'C. Choose any word from above and form 2 sentences';
                card.appendChild(actC);
                const line1 = document.createElement('div');
                line1.className = 'sentence-line';
                line1.textContent = '1.';
                card.appendChild(line1);
                const line2 = document.createElement('div');
                line2.className = 'sentence-line';
                line2.textContent = '2.';
                card.appendChild(line2);
                const pageNum = document.createElement('div');
                pageNum.className = 'page-number';
                pageNum.textContent = pageNumber;
                card.appendChild(pageNum);
                return page;
            }

            function buildTocPage(pageNumber, entries) {
                const page = document.createElement('div');
                page.className = 'page';
                const actions = document.createElement('div');
                actions.className = 'page-actions no-print';
                const btn = document.createElement('button');
                btn.className = 'export-btn';
                btn.textContent = '📄 Export this page to PDF';
                btn.onclick = () => exportSinglePage(page);
                actions.appendChild(btn);
                page.appendChild(actions);
                const card = document.createElement('div');
                card.className = 'toc-card';
                page.appendChild(card);
                const title = document.createElement('div');
                title.className = 'toc-title';
                title.textContent = 'Table of Contents';
                card.appendChild(title);
                const list = document.createElement('ul');
                list.className = 'toc-list';
                entries.forEach(entry => {
                    const item = document.createElement('li');
                    item.className = 'toc-item';
                    const desc = document.createElement('span');
                    desc.className = 'toc-lesson-title';
                    desc.textContent = 'Lesson ' + entry.lessonNumber + ': ' + entry.mainTitle;
                    item.appendChild(desc);
                    const pageSpan = document.createElement('span');
                    pageSpan.className = 'toc-page-num';
                    pageSpan.textContent = 'Page ' + entry.firstPage;
                    item.appendChild(pageSpan);
                    list.appendChild(item);
                });
                card.appendChild(list);
                const pageNum = document.createElement('div');
                pageNum.className = 'page-number';
                pageNum.textContent = pageNumber;
                card.appendChild(pageNum);
                return page;
            }

            function renderAllView() {
                const container = document.getElementById('viewContainer');
                if (!container) return;
                container.innerHTML = '';
                if (lessons.length === 0) {
                    container.innerHTML = '<div style="text-align:center;padding:80px 20px;color:#6c757d;"><div style="font-size:64px;">📖</div><h3>No lessons yet</h3><p>Switch to Edit tab to create your first lesson.</p></div>';
                    updateAllCounts();
                    return;
                }
                const totalTocPages = Math.ceil(lessons.length / MAX_TOC_PER_PAGE);
                const lessonStartPage = totalTocPages + 1;
                const tocEntries = lessons.map((lesson, idx) => ({
                    lessonNumber: lesson.lessonNumber,
                    mainTitle: lesson.mainTitle,
                    firstPage: lessonStartPage + idx * 2
                }));
                for (let p = 0; p < totalTocPages; p++) {
                    const slice = tocEntries.slice(p * MAX_TOC_PER_PAGE, (p + 1) * MAX_TOC_PER_PAGE);
                    container.appendChild(buildTocPage(p + 1, slice));
                }
                let pageNum = lessonStartPage;
                lessons.forEach(lesson => {
                    container.appendChild(buildPageOne(lesson, pageNum++));
                    container.appendChild(buildPageTwo(lesson, pageNum++));
                });
                updateAllCounts();
            }

            function exportSinglePage(pageElement) {
                const clone = pageElement.cloneNode(true);
                const actions = clone.querySelector('.page-actions');
                if (actions) actions.remove();
                const printWindow = window.open('', '_blank');
                if (!printWindow) { showToast('Allow popups for PDF export.', 'warning'); return; }
                const styleEl = document.querySelector('style').cloneNode(true);
                printWindow.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Lesson Export</title>');
                printWindow.document.write(styleEl.outerHTML);
                printWindow.document.write('</head><body style="padding:0;background:#fff;margin:0;">');
                printWindow.document.write('<div class="view-container" style="overflow:visible;">');
                printWindow.document.write(clone.outerHTML);
                printWindow.document.write('</div></body></html>');
                printWindow.document.close();
                printWindow.focus();
                setTimeout(() => printWindow.print(), 400);
            }

            function exportAllPages() {
                if (lessons.length === 0) { showToast('No lessons to export.', 'warning'); return; }
                const printWindow = window.open('', '_blank');
                if (!printWindow) { showToast('Allow popups for PDF export.', 'warning'); return; }
                const styleEl = document.querySelector('style').cloneNode(true);
                const viewContainer = document.querySelector('.view-container');
                const clone = viewContainer.cloneNode(true);
                clone.querySelectorAll('.page-actions').forEach(el => el.remove());
                clone.style.overflow = 'visible';
                printWindow.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>All Lessons</title>');
                printWindow.document.write(styleEl.outerHTML);
                printWindow.document.write('</head><body style="padding:0;background:#fff;margin:0;">');
                printWindow.document.write(clone.outerHTML);
                printWindow.document.write('</body></html>');
                printWindow.document.close();
                printWindow.focus();
                setTimeout(() => printWindow.print(), 400);
            }

            function updateAllCounts() {
                const badge = document.getElementById('lessonCount');
                if (badge) badge.textContent = lessons.length + ' lessons';
                const info = document.getElementById('viewInfo');
                if (info) {
                    const tocPages = lessons.length ? Math.ceil(lessons.length / MAX_TOC_PER_PAGE) : 0;
                    const totalPages = tocPages + lessons.length * 2;
                    info.textContent = '📄 ' + lessons.length + ' lessons · ' + totalPages + ' pages (incl. TOC)';
                }
            }

            // ---------- EDIT TAB LOGIC ----------
            function getFormData() {
                const mainTitle = document.getElementById('fMainTitle').value.trim();
                const lessonNumber = parseInt(document.getElementById('fLessonNumber').value, 10);
                const letterTile = document.getElementById('fLetterTile').value.trim();
                const introText = document.getElementById('fIntroText').value.trim();
                const wordsRaw = document.getElementById('fWords').value.split(',').map(s => s.trim()).filter(Boolean);
                const wordsChunked = [];
                for (let i = 0; i < wordsRaw.length; i += 4) wordsChunked.push(wordsRaw.slice(i, i + 4));
                if (wordsChunked.length === 0) wordsChunked.push([]);
                const sentences = document.getElementById('fSentences').value.split(',').map(s => s.trim()).filter(Boolean);
                const fillBlanks = document.getElementById('fFillBlanks').value.split(',').map(s => s.trim()).filter(Boolean);
                return { mainTitle, lessonNumber, letterTile, introText, words: wordsChunked, sentences, fillBlanks };
            }

            function fillForm(data) {
                document.getElementById('fMainTitle').value = data.mainTitle || 'SHORT VOWEL CVC WORDS';
                document.getElementById('fLessonNumber').value = data.lessonNumber || '';
                document.getElementById('fLetterTile').value = data.letterTile || '';
                document.getElementById('fIntroText').value = data.introText || '';
                document.getElementById('fWords').value = flattenWords(data.words || []).join(', ');
                document.getElementById('fSentences').value = (data.sentences || []).join(', ');
                document.getElementById('fFillBlanks').value = (data.fillBlanks || []).join(', ');
            }

            function resetForm() {
                editingId = null;
                document.getElementById('formTitle').textContent = '➕ Add New Lesson';
                document.getElementById('formId').textContent = '';
                document.getElementById('fMainTitle').value = '';
                document.getElementById('fLessonNumber').value = lessons.length + 1;
                document.getElementById('fLetterTile').value = '';
                document.getElementById('fIntroText').value = '';
                document.getElementById('fWords').value = '';
                document.getElementById('fSentences').value = '';
                document.getElementById('fFillBlanks').value = '';
                document.getElementById('saveBtn').textContent = '💾 Save Lesson';
                document.getElementById('cancelBtn').style.display = 'none';
            }

            function editLesson(id) {
                const lesson = lessons.find(l => l.id === id);
                if (!lesson) { showToast('Lesson not found.', 'error'); return; }
                editingId = id;
                document.getElementById('formTitle').textContent = '✏️ Edit Lesson';
                document.getElementById('formId').textContent = '#' + id;
                fillForm(lesson);
                document.getElementById('saveBtn').textContent = '💾 Update Lesson';
                document.getElementById('cancelBtn').style.display = 'inline-block';
                document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
            }

            function cancelEdit() {
                resetForm();
                showToast('Edit cancelled.', 'info');
            }

            function saveLesson() {
                const data = getFormData();
                if (!data.mainTitle) { showToast('Main Title is required.', 'error'); return; }
                if (!data.lessonNumber || data.lessonNumber <= 0) { showToast('Lesson Number must be positive.', 'error'); return; }
                if (!data.letterTile) { showToast('Letter Tile is required.', 'error'); return; }
                if (!data.introText) { showToast('Intro Text is required.', 'error'); return; }
                if (flattenWords(data.words).length < 6) { showToast('Add at least 6 words.', 'error'); return; }
                if (data.sentences.length < 2) { showToast('Add at least 2 sentences.', 'error'); return; }
                if (data.fillBlanks.length < 4) { showToast('Add at least 4 fill-in blanks.', 'error'); return; }
                const duplicate = lessons.find(l => l.lessonNumber === data.lessonNumber && l.id !== editingId);
                if (duplicate) {
                    confirmDialog('Lesson ' + data.lessonNumber + ' already exists. Continue?', () => performSave(data));
                } else {
                    performSave(data);
                }
            }

            function performSave(data) {
                if (editingId) {
                    const idx = lessons.findIndex(l => l.id === editingId);
                    if (idx === -1) { showToast('Lesson not found.', 'error'); return; }
                    lessons[idx] = { ...lessons[idx], ...data, id: editingId };
                    showToast('Lesson ' + data.lessonNumber + ' updated.', 'success');
                } else {
                    const newLesson = { ...data, id: generateId() };
                    lessons.push(newLesson);
                    showToast('Lesson ' + data.lessonNumber + ' created.', 'success');
                }
                saveData();
                resetForm();
                refreshUI();
            }

            function deleteLesson(id) {
                const lesson = lessons.find(l => l.id === id);
                if (!lesson) return;
                confirmDialog(`Delete Lesson ${lesson.lessonNumber} "${lesson.letterTile}"?`, () => {
                    lessons = lessons.filter(l => l.id !== id);
                    saveData();
                    if (editingId === id) resetForm();
                    refreshUI();
                    showToast('Lesson deleted.', 'success');
                });
            }

            function duplicateLesson(id) {
                const lesson = lessons.find(l => l.id === id);
                if (!lesson) { showToast('Lesson not found.', 'error'); return; }
                const copy = JSON.parse(JSON.stringify(lesson));
                delete copy.id;
                copy.lessonNumber = lessons.reduce((max, l) => Math.max(max, l.lessonNumber), 0) + 1;
                copy.id = generateId();
                lessons.push(copy);
                saveData();
                refreshUI();
                showToast('Lesson duplicated.', 'success');
            }

            function exportJSON() {
                if (lessons.length === 0) { showToast('No lessons to export.', 'warning'); return; }
                const json = JSON.stringify(lessons, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'phonics_lessons_' + new Date().toISOString().slice(0, 10) + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('JSON exported.', 'success');
            }

            function importJSON(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!Array.isArray(data) || data.length === 0) { showToast('Invalid JSON file.', 'error'); return; }
                        const first = data[0];
                        if (!first.mainTitle && !first.lessonNumber && !first.letterTile) {
                            showToast('JSON does not contain valid lesson data.', 'error');
                            return;
                        }
                        confirmDialog(`Import ${data.length} lessons? This will replace all current lessons.`, () => {
                            let maxId = 0;
                            data.forEach(l => {
                                if (!l.id) l.id = 'l' + Date.now() + Math.random().toString(36).slice(2, 6);
                                if (!l.mainTitle) l.mainTitle = 'SHORT VOWEL CVC WORDS';
                                if (l.words && l.words.length > 0 && !Array.isArray(l.words[0])) {
                                    const flat = l.words;
                                    const chunked = [];
                                    for (let i = 0; i < flat.length; i += 4) chunked.push(flat.slice(i, i + 4));
                                    l.words = chunked;
                                }
                                const num = parseInt(l.id.replace('l', '')) || 0;
                                if (num > maxId) maxId = num;
                            });
                            lessons = data;
                            nextId = maxId + 1;
                            saveData();
                            resetForm();
                            refreshUI();
                            showToast('Imported ' + lessons.length + ' lessons.', 'success');
                        });
                    } catch (err) {
                        showToast('Failed to parse JSON: ' + err.message, 'error');
                    }
                };
                reader.onerror = () => showToast('Failed to read file.', 'error');
                reader.readAsText(file);
                event.target.value = '';
            }

            function refreshUI() {
                renderEditList();
                renderAllView();
                updateAllCounts();
            }

            // ----- Render edit list (with safe fallback) -----
            let searchQuery = '';

            function renderEditList() {
                try {
                    const listContainer = document.getElementById('lessonList');
                    if (!listContainer) {
                        console.error('lessonList element not found');
                        return;
                    }
                    const q = searchQuery.toLowerCase();
                    const filtered = lessons.filter(l => {
                        if (!q) return true;
                        return (String(l.lessonNumber).includes(q)) ||
                            (l.mainTitle || '').toLowerCase().includes(q) ||
                            (l.letterTile || '').toLowerCase().includes(q) ||
                            (l.introText || '').toLowerCase().includes(q) ||
                            flattenWords(l.words || []).join(' ').toLowerCase().includes(q) ||
                            (l.sentences || []).join(' ').toLowerCase().includes(q) ||
                            (l.fillBlanks || []).join(' ').toLowerCase().includes(q);
                    });

                    const countSpan = document.getElementById('listCount');
                    if (countSpan) countSpan.textContent = filtered.length + ' / ' + lessons.length;

                    if (filtered.length === 0) {
                        listContainer.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>No lessons found</h3><p>${q ? 'Try adjusting your search.' : 'Click "Add New Lesson" to get started.'}</p></div>`;
                    } else {
                        let html = '';
                        filtered.forEach(l => {
                            const actualIdx = lessons.indexOf(l);
                            html += `
                                <div class="lesson-item" draggable="true" data-index="${actualIdx}" data-id="${l.id}">
                                    <span class="drag-handle">⠿</span>
                                    <div class="info">
                                        <div class="title">Lesson ${escapeHtml(String(l.lessonNumber))} — ${escapeHtml(l.mainTitle || 'CVC')}</div>
                                        <div class="sub">${escapeHtml((l.introText || '').slice(0, 80))}${(l.introText || '').length > 80 ? '…' : ''}</div>
                                    </div>
                                    <div class="actions">
                                        <button class="btn btn-primary btn-xs" data-action="edit" data-id="${l.id}">✏️</button>
                                        <button class="btn btn-warning btn-xs" data-action="duplicate" data-id="${l.id}">📋</button>
                                        <button class="btn btn-danger btn-xs" data-action="delete" data-id="${l.id}">🗑️</button>
                                    </div>
                                </div>`;
                        });
                        listContainer.innerHTML = html;
                    }

                    attachDragDrop();
                } catch (err) {
                    console.error('renderEditList failed:', err);
                    const listContainer = document.getElementById('lessonList');
                    if (listContainer) listContainer.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><h3>Error rendering list</h3><p>Check the console for details.</p></div>';
                }
            }

            function attachDragDrop() {
                const items = document.querySelectorAll('.lesson-item');
                let dragIndex = null;
                items.forEach(item => {
                    item.addEventListener('dragstart', function(e) {
                        dragIndex = parseInt(item.dataset.index);
                        item.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', String(dragIndex));
                    });
                    item.addEventListener('dragend', function() {
                        item.classList.remove('dragging');
                        document.querySelectorAll('.lesson-item.drag-over').forEach(el => el.classList.remove('drag-over'));
                    });
                    item.addEventListener('dragover', function(e) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        const targetIndex = parseInt(item.dataset.index);
                        if (targetIndex !== dragIndex) {
                            document.querySelectorAll('.lesson-item.drag-over').forEach(el => el.classList.remove('drag-over'));
                            item.classList.add('drag-over');
                        }
                    });
                    item.addEventListener('dragleave', function() { item.classList.remove('drag-over'); });
                    item.addEventListener('drop', function(e) {
                        e.preventDefault();
                        item.classList.remove('drag-over');
                        const from = parseInt(e.dataTransfer.getData('text/plain'));
                        const to = parseInt(item.dataset.index);
                        if (!isNaN(from) && !isNaN(to) && from !== to) {
                            const moved = lessons.splice(from, 1)[0];
                            lessons.splice(to, 0, moved);
                            saveData();
                            refreshUI();
                            showToast('Lesson reordered.', 'success');
                        }
                    });
                });
            }

            // Event delegation on the list container
            const listClickHandler = function(e) {
                const btn = e.target.closest('button');
                if (!btn) return;
                const action = btn.dataset.action;
                const id = btn.dataset.id;
                if (!action || !id) return;
                e.stopPropagation();
                switch (action) {
                    case 'edit': editLesson(id); break;
                    case 'duplicate': duplicateLesson(id); break;
                    case 'delete': deleteLesson(id); break;
                }
            };

            function attachListClickDelegation() {
                const list = document.getElementById('lessonList');
                if (!list) return;
                // Remove any previous listener to avoid duplicates
                list.removeEventListener('click', listClickHandler);
                list.addEventListener('click', listClickHandler);
            }

            // ----- Tab switching & init -----
            function switchTab(tab) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === tab + 'Panel'));
                if (tab === 'edit') renderEditList();   // <-- FIX: refresh list on edit tab
                if (tab === 'view') renderAllView();
                updateAllCounts();
            }

            function init() {
                loadData();
                resetForm();
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.value = searchQuery;
                    searchInput.addEventListener('input', function(e) {
                        searchQuery = e.target.value;
                        renderEditList();
                    });
                }
                renderEditList();   // initial list render
                attachListClickDelegation();
                renderAllView();
                updateAllCounts();
                switchTab('edit');  // ensure edit tab is visible
            }

            // ----- Build the app HTML -----
            document.addEventListener('DOMContentLoaded', function() {
                const app = document.getElementById('app');
                app.innerHTML = `
                    <div class="app">
                        <div class="app-header">
                            <h1>📚 Phonics Lesson Publisher</h1>
                            <span class="badge" id="lessonCount">0 lessons</span>
                        </div>
                        <div class="tabs">
                            <button class="tab-btn active" data-tab="edit" onclick="switchTab('edit')">✏️ Edit</button>
                            <button class="tab-btn" data-tab="view" onclick="switchTab('view')">👁️ View</button>
                        </div>
                        <div class="tab-panel active" id="editPanel">
                            <div class="edit-layout">
                                <div class="form-section">
                                    <h2 id="formTitle">➕ Add New Lesson <span class="edit-id" id="formId"></span></h2>
                                    <div class="form-group">
                                        <label>Main Title <span class="req">*</span></label>
                                        <input type="text" id="fMainTitle" placeholder="e.g. SHORT VOWEL CVC WORDS" />
                                    </div>
                                    <div class="form-group">
                                        <label>Lesson Number <span class="req">*</span></label>
                                        <input type="number" id="fLessonNumber" min="1" step="1" />
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>Letter Tile <span class="req">*</span></label>
                                            <input type="text" id="fLetterTile" placeholder="e.g. Aa" />
                                        </div>
                                        <div class="form-group" style="visibility:hidden;pointer-events:none;">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label>Intro Text <span class="req">*</span></label>
                                        <textarea id="fIntroText" rows="2" placeholder="Custom introduction for this lesson..."></textarea>
                                    </div>
                                    <div class="form-group">
                                        <label>Words (comma separated) <span class="req">*</span></label>
                                        <textarea id="fWords" rows="2" placeholder="cat, bat, hat, mat, dad, fat..."></textarea>
                                    </div>
                                    <div class="form-group">
                                        <label>Sentences (comma separated) <span class="req">*</span></label>
                                        <textarea id="fSentences" rows="2" placeholder="The cat sat on a mat., A rat had a hat."></textarea>
                                    </div>
                                    <div class="form-group">
                                        <label>Fill Blanks (comma separated) <span class="req">*</span></label>
                                        <textarea id="fFillBlanks" rows="2" placeholder="c__t, b__t, h__t, m__t..."></textarea>
                                    </div>
                                    <div class="form-actions">
                                        <button class="btn btn-primary" id="saveBtn" onclick="saveLesson()">💾 Save Lesson</button>
                                        <button class="btn btn-outline" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
                                    </div>
                                </div>
                                <div class="list-section">
                                    <h2 style="font-size:18px;margin-bottom:12px;">📖 All Lessons</h2>
                                    <div class="list-toolbar">
                                        <input class="search-box" type="text" placeholder="🔍 Search lessons..." id="searchInput" />
                                        <span class="count" id="listCount">0 / 0</span>
                                        <button class="btn btn-success btn-sm" onclick="exportJSON()">📤 Export JSON</button>
                                        <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFileInput').click()">📥 Import JSON</button>
                                        <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importJSON(event)" />
                                    </div>
                                    <div class="lesson-list" id="lessonList"></div>
                                </div>
                            </div>
                        </div>
                        <div class="tab-panel" id="viewPanel">
                            <div class="view-toolbar">
                                <span class="info" id="viewInfo">📄 0 lessons · 0 pages</span>
                                <button class="btn btn-success" id="exportAllBtn" onclick="exportAllPages()">⬇ Export ALL pages as PDF</button>
                                <button class="btn btn-outline" onclick="switchTab('edit')">✏️ Back to Edit</button>
                            </div>
                            <div class="view-container" id="viewContainer"></div>
                        </div>
                    </div>`;

                // Expose necessary functions to global scope
                window.switchTab = switchTab;
                window.saveLesson = saveLesson;
                window.editLesson = editLesson;
                window.deleteLesson = deleteLesson;
                window.duplicateLesson = duplicateLesson;
                window.cancelEdit = cancelEdit;
                window.exportJSON = exportJSON;
                window.importJSON = importJSON;
                window.exportAllPages = exportAllPages;

                init();
            });
        })();
    </script>
</body>
</html>
