<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 Phonics Lesson Publisher</title>
    <style>
        /* ----- Page & print base (same as standalone) ----- */
        @page {
            size: 850px 1100px;
            margin: 0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
            background: #f5f7fa;
            color: #1a1a1a;
            padding: 20px;
        }

        /* ----- App layout ----- */
        .app {
            max-width: 1400px;
            margin: 0 auto;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .app-header {
            background: #1a1a2e;
            color: #fff;
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .app-header h1 {
            font-size: 24px;
            font-weight: 800;
        }

        .app-header .badge {
            background: #F5A623;
            color: #1a1a1a;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 2px solid #e9ecef;
            background: #fafbfc;
            padding: 0 32px;
            gap: 4px;
        }

        .tab-btn {
            padding: 16px 28px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 700;
            color: #6c757d;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            font-family: inherit;
        }

        .tab-btn:hover {
            color: #1a1a2e;
        }

        .tab-btn.active {
            color: #1a1a2e;
            border-bottom-color: #F5A623;
        }

        .tab-panel {
            display: none;
            padding: 24px 32px 32px;
        }

        .tab-panel.active {
            display: block;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 420px;
            width: 100%;
            pointer-events: none;
        }

        .toast {
            padding: 14px 20px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        .toast.success {
            background: #2d7d46;
        }

        .toast.error {
            background: #dc3545;
        }

        .toast.warning {
            background: #e67e22;
        }

        .toast.info {
            background: #2c7be5;
        }

        .toast .close-toast {
            background: none;
            border: none;
            color: inherit;
            font-size: 18px;
            cursor: pointer;
            margin-left: auto;
            opacity: 0.7;
        }

        .toast .close-toast:hover {
            opacity: 1;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Edit Tab – Form & List */
        .edit-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
        }

        @media (max-width: 1100px) {
            .edit-layout {
                grid-template-columns: 1fr;
            }
        }

        .form-section {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 24px;
            border: 2px solid #e9ecef;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .form-section h2 {
            font-size: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-section h2 .edit-id {
            color: #6c757d;
            font-weight: 400;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 13px;
            color: #495057;
            margin-bottom: 4px;
        }

        .form-group label .req {
            color: #dc3545;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: border 0.2s;
            background: #fff;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #F5A623;
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 50px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #F5A623;
            color: #1a1a1a;
        }

        .btn-primary:hover:not(:disabled) {
            background: #e0950f;
            transform: translateY(-1px);
        }

        .btn-success {
            background: #2d7d46;
            color: #fff;
        }

        .btn-success:hover:not(:disabled) {
            background: #1f5f34;
        }

        .btn-danger {
            background: #dc3545;
            color: #fff;
        }

        .btn-danger:hover:not(:disabled) {
            background: #b02a37;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #dee2e6;
            color: #495057;
        }

        .btn-outline:hover:not(:disabled) {
            background: #f1f3f5;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }

        .btn-xs {
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 6px;
        }

        .btn-warning {
            background: #e67e22;
            color: #fff;
        }

        .btn-warning:hover:not(:disabled) {
            background: #cf6d17;
        }

        /* Image upload */
        .image-upload-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .image-upload-wrap .preview {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid #dee2e6;
            background: #f1f3f5;
        }

        .image-upload-wrap .preview-placeholder {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            border: 2px dashed #dee2e6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #adb5bd;
            background: #f8f9fa;
        }

        .image-upload-wrap input[type="file"] {
            flex: 1;
        }

        /* Lesson list */
        .list-section {
            min-height: 400px;
        }

        .list-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e9ecef;
        }

        .list-toolbar .search-box {
            flex: 1;
            min-width: 180px;
            padding: 10px 16px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
        }

        .list-toolbar .search-box:focus {
            outline: none;
            border-color: #F5A623;
        }

        .list-toolbar .count {
            font-weight: 700;
            color: #6c757d;
            font-size: 14px;
            white-space: nowrap;
        }

        .lesson-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .lesson-list .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .lesson-list .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .lesson-list .empty-state h3 {
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.2s;
            cursor: grab;
            user-select: none;
        }

        .lesson-item:hover {
            border-color: #F5A623;
            background: #fff;
        }

        .lesson-item.dragging {
            opacity: 0.4;
            border-color: #F5A623;
            background: #fff8e7;
        }

        .lesson-item .drag-handle {
            color: #adb5bd;
            font-size: 20px;
            cursor: grab;
            line-height: 1;
            flex-shrink: 0;
        }

        .lesson-item .drag-handle:active {
            cursor: grabbing;
        }

        .lesson-item .thumb {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            background: #e9ecef;
            border: 1px solid #dee2e6;
            flex-shrink: 0;
        }

        .lesson-item .thumb.placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .lesson-item .info {
            flex: 1;
            min-width: 0;
        }

        .lesson-item .info .title {
            font-weight: 700;
            font-size: 15px;
        }

        .lesson-item .info .sub {
            font-size: 13px;
            color: #6c757d;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lesson-item .actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .lesson-item.drag-over {
            border-color: #F5A623;
            background: #fff8e7;
        }

        /* Confirm dialog */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay .modal {
            background: #fff;
            border-radius: 20px;
            padding: 32px;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
        }

        .modal-overlay .modal h3 {
            margin-bottom: 8px;
        }

        .modal-overlay .modal p {
            color: #6c757d;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .modal-overlay .modal .actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ----- VIEW TAB – EXACT SAME AS STANDALONE APP ----- */
        .view-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 8px;
        }

        .view-container .page {
            width: 850px;
            min-width: 850px;
            min-height: 1080px;
            padding: 30px 40px;
            position: relative;
            page-break-after: always;
            margin: 0 auto 30px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .view-container .page:last-child {
            margin-bottom: 0;
        }

        .view-container .card {
            border: 3px solid #F5A623;
            border-radius: 28px;
            min-height: 1000px;
            padding: 24px 32px;
            position: relative;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .view-container .title {
            font-size: 30px;
            font-weight: 800;
            color: #1a1a1a;
            letter-spacing: 0.5px;
            margin: 4px 0 18px 0;
        }

        .view-container .header-row {
            display: flex;
            align-items: stretch;
            gap: 0;
            margin-bottom: 22px;
        }

        .view-container .lesson-badge {
            background: #F5A623;
            border-radius: 16px;
            color: #fff;
            width: 130px;
            min-width: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 6px;
            position: relative;
            margin-right: 18px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .view-container .lesson-badge .arrow {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-bottom: 26px solid #F5A623;
        }

        .view-container .lesson-badge .label {
            font-size: 13px;
            font-weight: 600;
            opacity: 0.95;
        }

        .view-container .lesson-badge .num {
            font-size: 34px;
            font-weight: 800;
            line-height: 1.1;
        }

        .view-container .intro-box {
            flex: 1;
            border: 3px dashed #E2571C;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 14px 20px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .view-container .intro-box p {
            margin: 0;
            color: #E2571C;
            font-weight: 700;
            font-size: 14px;
            line-height: 1.5;
        }

        .view-container .hero-row {
            display: flex;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #F5A623;
            height: 280px;
            margin-bottom: 22px;
        }

        .view-container .hero-image {
            flex: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .view-container .hero-image img {
            max-height: 200px;
            max-width: 80%;
            object-fit: contain;
        }

        .view-container .hero-image .placeholder {
            width: 200px;
            height: 100px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
        }

        .view-container .hero-image .caption {
            font-weight: 800;
            font-size: 18px;
            color: #1a1a1a;
        }

        .view-container .hero-letter {
            flex: 1;
            background: #F5A623;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 90px;
            font-weight: 800;
            font-style: italic;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .view-container .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            margin-top: 12px;
        }

        .view-container .section-header .circle {
            background: #F5A623;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            margin-right: 14px;
            flex-shrink: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .view-container .section-header .label-box {
            flex: 1;
            border: 3px dashed #E2571C;
            border-radius: 14px;
            padding: 8px 18px;
            font-weight: 800;
            font-size: 19px;
            color: #1a1a1a;
        }

        .view-container .word-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .view-container .word-grid .pill {
            background: #E2571C;
            color: #fff;
            border-radius: 14px;
            text-align: center;
            padding: 8px 6px;
            font-weight: 600;
            font-size: 28px;
            min-height: 60px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .view-container .word-grid.blanks .pill {
            background: #fff;
            color: #E2571C;
            border: 2px solid #F5A623;
            min-height: 60px;
        }

        .view-container .word-grid.empty .pill {
            background: #fff;
            border: 2px solid #F5A623;
            min-height: 60px;
        }

        .view-container .instructions {
            font-weight: 700;
            font-size: 13px;
            margin: 8px 0 10px 0;
            color: #1a1a1a;
        }

        .view-container .reading-box {
            border: 2px solid #F5A623;
            border-radius: 16px;
            padding: 12px 22px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .view-container .reading-box p {
            margin: 0 0 5px 0;
            color: #E2571C;
            font-weight: 700;
            font-size: 25px;
        }

        .view-container .reading-box p:last-child {
            margin-bottom: 0;
        }

        .view-container .activity-label {
            font-weight: 700;
            font-size: 13px;
            margin: 10px 0 6px 0;
        }

        .view-container .sentence-line {
            border-bottom: 1px solid #999;
            padding: 15px 0 25px 0;
            font-size: 16px;
            color: #E2571C;
            font-weight: 800;
        }

        .view-container .card .page-number {
            position: absolute;
            bottom: 20px;
            right: 30px;
            margin: 0;
            font-weight: 800;
            font-size: 16px;
            color: #1a1a1a;
        }

        .view-container .page-actions {
            text-align: right;
            margin-bottom: 8px;
        }

        .view-container .export-btn {
            background: #E2571C;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
        }

        .view-container .export-btn:hover {
            background: #c8481a;
        }

        /* Table of Contents specific styles */
        .toc-card {
            border: 3px solid #F5A623;
            border-radius: 28px;
            min-height: 1000px;
            padding: 40px 48px;
            position: relative;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .toc-title {
            font-size: 36px;
            font-weight: 800;
            color: #1a1a2e;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 4px solid #F5A623;
            padding-bottom: 16px;
        }

        .toc-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .toc-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 12px 8px;
            border-bottom: 1px dashed #dee2e6;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .toc-item .toc-lesson-title {
            flex: 1;
            text-align: left;
            padding-right: 20px;
        }

        .toc-item .toc-page-num {
            font-weight: 800;
            color: #E2571C;
            min-width: 80px;
            text-align: right;
        }

        /* Preserve colors for print */
        .view-container .card,
        .view-container .lesson-badge,
        .view-container .hero-letter,
        .view-container .word-grid .pill,
        .view-container .intro-box,
        .view-container .section-header .circle,
        .view-container .reading-box,
        .view-container .lesson-badge .arrow,
        .toc-card {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* View toolbar */
        .view-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e9ecef;
        }

        .view-toolbar .info {
            font-weight: 700;
            color: #6c757d;
            font-size: 14px;
            margin-right: auto;
        }

        /* Mobile: keep pages fixed width, scroll horizontally */
        @media (max-width: 900px) {
            .view-container .page {
                width: 850px;
                min-width: 850px;
                padding: 30px 40px;
                min-height: 1080px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
                border-radius: 8px;
                margin: 0 auto 30px;
            }
            .view-container .card {
                min-height: 1000px;
                padding: 24px 32px;
            }
            .view-container .hero-row {
                height: 280px;
                flex-direction: row;
            }
            .view-container .hero-letter {
                font-size: 90px;
                padding: 0;
            }
            .view-container .word-grid .pill {
                font-size: 28px;
                min-height: 60px;
            }
            .view-container .reading-box p {
                font-size: 25px;
            }
            .view-container .title {
                font-size: 30px;
            }
            .view-container .header-row {
                flex-direction: row;
                gap: 0;
            }
            .view-container .lesson-badge {
                width: 130px;
                min-width: 130px;
                flex-direction: column;
                gap: 0;
                padding: 10px 6px;
            }
            .view-container .lesson-badge .arrow {
                display: block;
            }
            .view-container .lesson-badge .num {
                font-size: 34px;
            }
            .edit-layout {
                grid-template-columns: 1fr;
            }
            .form-section {
                position: static;
                max-height: none;
            }
            .app-header h1 {
                font-size: 20px;
            }
            .tabs {
                padding: 0 16px;
            }
            .tab-btn {
                padding: 12px 18px;
                font-size: 13px;
            }
            .tab-panel {
                padding: 16px;
            }
        }

        /* Print overrides */
        @media print {
            body {
                padding: 0;
                background: #fff;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .app,
            .app-header,
            .tabs,
            .tab-panel,
            .view-toolbar,
            .no-print {
                display: none !important;
            }
            .view-container {
                overflow-x: visible !important;
            }
            .view-container .page {
                box-shadow: none !important;
                border-radius: 0 !important;
                margin: 0 auto !important;
                padding: 30px 40px !important;
                width: 850px !important;
                min-width: 850px !important;
                min-height: 1080px !important;
                page-break-after: always;
                background: #fff !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .view-container .page .page-actions {
                display: none !important;
            }
            .view-container .page:last-child {
                page-break-after: auto;
            }
            .view-container .card,
            .view-container .lesson-badge,
            .view-container .hero-letter,
            .view-container .word-grid .pill,
            .view-container .intro-box,
            .view-container .section-header .circle,
            .view-container .reading-box,
            .view-container .lesson-badge .arrow,
            .toc-card {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        //  DATA LAYER
        // ============================================================
        const STORAGE_KEY = 'phonics_lessons_data';
        const MAX_TOC_ENTRIES_PER_PAGE = 18; // Safe number of lessons per Table of Contents page

        const DEFAULT_LESSONS = [{
            id: 'l1',
            mainTitle: 'SHORT VOWEL CVC WORDS',
            lessonNumber: 1,
            letterTile: 'Short a',
            imageCaption: 'bag',
            imagePath: '',
            introText: 'Say each picture word out loud. Listen for the sound of "Short a".',
            words: [
                ['bag', 'cat', 'mat', 'hat'],
                ['rat', 'bat', 'sat', 'pat'],
                ['fat', 'man']
            ],
            sentences: ['I can say the word bag and the word cat.', 'Look at the mat. Now look at the hat.'],
            fillBlanks: ['b_g', 'c_t', 'm_t', 'h_t', 'r_t']
        }];

        let lessons = [];
        let editingId = null;
        let searchQuery = '';
        let nextId = 1;

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        lessons = parsed;
                        let maxId = 0;
                        lessons.forEach(l => {
                            if (!l.id) l.id = 'l' + Date.now() + Math.random().toString(36).slice(2, 6);
                            if (!l.mainTitle) l.mainTitle = 'SHORT VOWEL CVC WORDS';
                            if (l.words && l.words.length > 0 && !Array.isArray(l.words[0])) {
                                const flat = l.words;
                                const chunked = [];
                                for (let i = 0; i < flat.length; i += 4) chunked.push(flat.slice(i, i + 4));
                                l.words = chunked;
                            }
                            const num = parseInt(l.id.replace('l', '')) || 0;
                            if (num > maxId) maxId = num;
                        });
                        nextId = maxId + 1;
                        return;
                    }
                }
            } catch (e) {}
            lessons = JSON.parse(JSON.stringify(DEFAULT_LESSONS));
            lessons.forEach(l => { if (!l.id) l.id = 'l' + Date.now() + Math.random().toString(36).slice(2, 6); });
            nextId = lessons.length + 1;
            saveData();
        }

        function saveData() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(lessons)); } catch (e) { showToast('Storage full.', 'error'); }
        }

        function generateId() { return 'l' + (nextId++); }

        function updateAllCounts() {
            const badge = document.getElementById('lessonCount');
            if (badge) badge.textContent = lessons.length + ' lessons';
            const info = document.getElementById('viewInfo');
            if (info) {
                const tocPages = lessons.length ? Math.ceil(lessons.length / MAX_TOC_ENTRIES_PER_PAGE) : 0;
                const totalPages = tocPages + lessons.length * 2;
                info.textContent = '📄 ' + lessons.length + ' lessons · ' + totalPages + ' pages (incl. TOC)';
            }
        }

        // ============================================================
        //  TOAST & CONFIRM
        // ============================================================
        function showToast(msg, type = 'info', dur = 3500) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${msg} <button class="close-toast">&times;</button>`;
            container.appendChild(toast);
            toast.querySelector('.close-toast').addEventListener('click', () => toast.remove());
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, dur);
        }

        function confirmDialog(msg, onConfirm) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal">
                    <h3>⚠️ Confirm</h3>
                    <p>${msg}</p>
                    <div class="actions">
                        <button class="btn btn-outline btn-cancel">Cancel</button>
                        <button class="btn btn-danger btn-confirm">Yes</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            overlay.querySelector('.btn-cancel').addEventListener('click', () => overlay.remove());
            overlay.querySelector('.btn-confirm').addEventListener('click', () => { overlay.remove(); onConfirm(); });
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
        }

        // ============================================================
        //  VIEW RENDER ENGINE
        // ============================================================
        function el(tag, cls, html) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (typeof html !== 'undefined') e.innerHTML = html;
            return e;
        }

        function wordGrid(words, extraClass) {
            var grid = el('div', 'word-grid ' + (extraClass || ''));
            for (var i = 0; i < words.length; i++) {
                grid.appendChild(el('div', 'pill', words[i]));
            }
            return grid;
        }

        function buildPageOne(lesson, pageNumber) {
            var page = el('div', 'page');
            var actions = el('div', 'page-actions no-print');
            var btn = el('button', 'export-btn', '📄 Export this page to PDF');
            btn.type = 'button';
            btn.onclick = function() { exportSinglePage(page); };
            actions.appendChild(btn);
            page.appendChild(actions);

            var card = el('div', 'card');
            page.appendChild(card);

            var titleText = lesson.mainTitle || 'SHORT VOWEL CVC WORDS';
            card.appendChild(el('div', 'title', titleText));

            var headerRow = el('div', 'header-row');
            var badge = el('div', 'lesson-badge');
            badge.appendChild(el('div', 'arrow'));
            badge.appendChild(el('div', 'label', 'Lesson'));
            badge.appendChild(el('div', 'num', lesson.lessonNumber));
            headerRow.appendChild(badge);

            var introBox = el('div', 'intro-box');
            introBox.appendChild(el('p', null, lesson.introText || ''));
            headerRow.appendChild(introBox);
            card.appendChild(headerRow);

            var heroRow = el('div', 'hero-row');
            var heroImage = el('div', 'hero-image');
            if (lesson.imagePath) {
                var img = el('img');
                img.src = lesson.imagePath;
                img.alt = lesson.imageCaption || '';
                heroImage.appendChild(img);
            } else {
                heroImage.appendChild(el('div', 'placeholder', '🖼️'));
            }
            heroImage.appendChild(el('div', 'caption', lesson.imageCaption || ''));
            heroRow.appendChild(heroImage);
            heroRow.appendChild(el('div', 'hero-letter', lesson.letterTile || ''));
            card.appendChild(heroRow);

            var sec1 = el('div', 'section-header');
            sec1.appendChild(el('div', 'circle', '1'));
            sec1.appendChild(el('div', 'label-box', 'Look and say aloud'));
            card.appendChild(sec1);
            var allWords = lesson.words ? lesson.words.flat() : [];
            card.appendChild(wordGrid(allWords));

            card.appendChild(el('div', 'page-number', pageNumber));
            return page;
        }

        function buildPageTwo(lesson, pageNumber) {
            var page = el('div', 'page');
            var actions = el('div', 'page-actions no-print');
            var btn = el('button', 'export-btn', '📄 Export this page to PDF');
            btn.type = 'button';
            btn.onclick = function() { exportSinglePage(page); };
            actions.appendChild(btn);
            page.appendChild(actions);

            var card = el('div', 'card');
            page.appendChild(card);

            var sec2 = el('div', 'section-header');
            sec2.appendChild(el('div', 'circle', '2'));
            sec2.appendChild(el('div', 'label-box', 'Decodable Reading'));
            card.appendChild(sec2);
            card.appendChild(el('div', 'instructions', 'Read ALOUD and circle all words with the short vowel sound'));
            var readingBox = el('div', 'reading-box');
            if (lesson.sentences) {
                lesson.sentences.forEach(function(s, idx) {
                    readingBox.appendChild(el('p', null, (idx + 1) + '. ' + s));
                });
            }
            card.appendChild(readingBox);

            var sec3 = el('div', 'section-header');
            sec3.appendChild(el('div', 'circle', '3'));
            sec3.appendChild(el('div', 'label-box', 'Activities'));
            card.appendChild(sec3);
            card.appendChild(el('div', 'activity-label', 'A. Fill in the missing letters and say word'));
            card.appendChild(wordGrid(lesson.fillBlanks || [], 'blanks'));

            var emptySlots = (lesson.fillBlanks || []).map(function() { return '&nbsp;'; });
            card.appendChild(el('div', 'activity-label', 'B. Copy each word from above'));
            card.appendChild(wordGrid(emptySlots, 'empty'));

            card.appendChild(el('div', 'activity-label', 'C. Choose any word from above and form 2 sentences'));
            card.appendChild(el('div', 'sentence-line', '1.'));
            card.appendChild(el('div', 'sentence-line', '2.'));

            card.appendChild(el('div', 'page-number', pageNumber));
            return page;
        }

        // Build a single Table of Contents page
        function buildTocPage(pageNumber, entries) {
            var page = el('div', 'page');
            var actions = el('div', 'page-actions no-print');
            var btn = el('button', 'export-btn', '📄 Export this page to PDF');
            btn.type = 'button';
            btn.onclick = function() { exportSinglePage(page); };
            actions.appendChild(btn);
            page.appendChild(actions);

            var card = el('div', 'toc-card');
            page.appendChild(card);

            var title = el('div', 'toc-title', 'Table of Contents');
            card.appendChild(title);

            var list = el('ul', 'toc-list');
            entries.forEach(function(entry) {
                var item = el('li', 'toc-item');
                var lessonDesc = el('span', 'toc-lesson-title');
                lessonDesc.textContent = 'Lesson ' + entry.lessonNumber + ': ' + entry.mainTitle +
                    (entry.imageCaption ? ' — ' + entry.imageCaption : '');
                item.appendChild(lessonDesc);
                var pageNum = el('span', 'toc-page-num', 'Page ' + entry.firstPage);
                item.appendChild(pageNum);
                list.appendChild(item);
            });
            card.appendChild(list);

            card.appendChild(el('div', 'page-number', pageNumber));
            return page;
        }

        function renderAllView() {
            var container = document.getElementById('viewContainer');
            if (!container) return;
            container.innerHTML = '';

            if (lessons.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:80px 20px;color:#6c757d;"><div style="font-size:64px;">📖</div><h3>No lessons yet</h3><p>Switch to Edit tab to create your first lesson.</p></div>';
                updateAllCounts();
                return;
            }

            // Calculate Table of Contents pages
            const totalTocPages = Math.ceil(lessons.length / MAX_TOC_ENTRIES_PER_PAGE);
            const lessonStartPage = totalTocPages + 1; // Page number of first lesson page

            // Build TOC entries: for each lesson, compute the starting page number
            const tocEntries = lessons.map((lesson, index) => {
                const firstPage = lessonStartPage + index * 2;
                return {
                    lessonNumber: lesson.lessonNumber,
                    mainTitle: lesson.mainTitle,
                    imageCaption: lesson.imageCaption,
                    firstPage: firstPage
                };
            });

            // Create TOC pages
            for (let p = 0; p < totalTocPages; p++) {
                const start = p * MAX_TOC_ENTRIES_PER_PAGE;
                const end = start + MAX_TOC_ENTRIES_PER_PAGE;
                const pageEntries = tocEntries.slice(start, end);
                container.appendChild(buildTocPage(p + 1, pageEntries));
            }

            // Build lesson pages
            let pageNum = lessonStartPage;
            for (var i = 0; i < lessons.length; i++) {
                var lesson = lessons[i];
                container.appendChild(buildPageOne(lesson, pageNum++));
                container.appendChild(buildPageTwo(lesson, pageNum++));
            }

            updateAllCounts();

            // Bulk export button
            var allBtn = document.getElementById('exportAllBtn');
            if (allBtn) {
                allBtn.onclick = function() {
                    if (lessons.length === 0) { showToast('No lessons to export.', 'warning'); return; }
                    exportAllPages();
                };
            }
        }

        function exportSinglePage(pageElement) {
            var clone = pageElement.cloneNode(true);
            var actions = clone.querySelector('.page-actions');
            if (actions) actions.remove();

            var printWindow = window.open('', '_blank');
            if (!printWindow) { showToast('Allow popups for PDF export.', 'warning'); return; }

            var styleEl = document.querySelector('style').cloneNode(true);
            printWindow.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Lesson Export</title>');
            printWindow.document.write(styleEl.outerHTML);
            printWindow.document.write('</head><body style="padding:0;background:#fff;margin:0;">');
            printWindow.document.write('<div class="view-container" style="overflow:visible;">');
            printWindow.document.write(clone.outerHTML);
            printWindow.document.write('</div>');
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.focus();
            setTimeout(function() { printWindow.print(); }, 400);
        }

        function exportAllPages() {
            var printWindow = window.open('', '_blank');
            if (!printWindow) { showToast('Allow popups for PDF export.', 'warning'); return; }

            var styleEl = document.querySelector('style').cloneNode(true);
            var viewContainer = document.querySelector('.view-container');
            var clone = viewContainer.cloneNode(true);
            clone.querySelectorAll('.page-actions').forEach(function(el) { el.remove(); });
            clone.style.overflow = 'visible';

            printWindow.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>All Lessons</title>');
            printWindow.document.write(styleEl.outerHTML);
            printWindow.document.write('</head><body style="padding:0;background:#fff;margin:0;">');
            printWindow.document.write(clone.outerHTML);
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.focus();
            setTimeout(function() { printWindow.print(); }, 400);
        }

        // ============================================================
        //  EDIT TAB – CRUD, LIST, DRAG, SEARCH, IMPORT/EXPORT
        // ============================================================
        function getFormData() {
            var wordsRaw = document.getElementById('fWords').value;
            var words = wordsRaw.split(',').map(s => s.trim()).filter(Boolean);
            var wordsChunked = [];
            for (var i = 0; i < words.length; i += 4) {
                wordsChunked.push(words.slice(i, i + 4));
            }
            while (wordsChunked.length < 3) wordsChunked.push([]);
            var sentences = document.getElementById('fSentences').value.split(',').map(s => s.trim()).filter(Boolean);
            var fillBlanks = document.getElementById('fFillBlanks').value.split(',').map(s => s.trim()).filter(Boolean);
            return {
                mainTitle: document.getElementById('fMainTitle').value.trim() || 'SHORT VOWEL CVC WORDS',
                lessonNumber: parseInt(document.getElementById('fLessonNumber').value) || 0,
                letterTile: document.getElementById('fLetterTile').value.trim(),
                imageCaption: document.getElementById('fImageCaption').value.trim(),
                imagePath: document.getElementById('fImagePath').value || '',
                introText: document.getElementById('fIntroText').value,
                words: wordsChunked,
                sentences: sentences,
                fillBlanks: fillBlanks
            };
        }

        function fillForm(data) {
            document.getElementById('fMainTitle').value = data.mainTitle || 'SHORT VOWEL CVC WORDS';
            document.getElementById('fLessonNumber').value = data.lessonNumber || '';
            document.getElementById('fLetterTile').value = data.letterTile || '';
            document.getElementById('fImageCaption').value = data.imageCaption || '';
            document.getElementById('fImagePath').value = data.imagePath || '';
            document.getElementById('fIntroText').value = data.introText || '';
            document.getElementById('fWords').value = (data.words || []).flat().join(', ');
            document.getElementById('fSentences').value = (data.sentences || []).join(', ');
            document.getElementById('fFillBlanks').value = (data.fillBlanks || []).join(', ');
            var img = document.getElementById('imagePreview');
            var placeholder = document.getElementById('imagePreviewPlaceholder');
            if (data.imagePath) {
                img.src = data.imagePath;
                img.style.display = 'block';
                placeholder.style.display = 'none';
            } else {
                img.src = '';
                img.style.display = 'none';
                placeholder.style.display = 'flex';
            }
        }

        function resetForm() {
            editingId = null;
            document.getElementById('formTitle').textContent = '➕ Add New Lesson';
            document.getElementById('formId').textContent = '';
            document.getElementById('fMainTitle').value = '';
            document.getElementById('fLessonNumber').value = lessons.length + 1;
            document.getElementById('fLetterTile').value = '';
            document.getElementById('fImageCaption').value = '';
            document.getElementById('fImagePath').value = '';
            document.getElementById('fIntroText').value = '';
            document.getElementById('fWords').value = '';
            document.getElementById('fSentences').value = '';
            document.getElementById('fFillBlanks').value = '';
            var img = document.getElementById('imagePreview');
            var placeholder = document.getElementById('imagePreviewPlaceholder');
            img.src = '';
            img.style.display = 'none';
            placeholder.style.display = 'flex';
            document.getElementById('saveBtn').textContent = '💾 Save Lesson';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('fImageFile').value = '';
            renderEditTab();
        }

        function editLesson(id) {
            var lesson = lessons.find(l => l.id === id);
            if (!lesson) { showToast('Lesson not found.', 'error'); return; }
            editingId = id;
            document.getElementById('formTitle').textContent = '✏️ Edit Lesson';
            document.getElementById('formId').textContent = '#' + id;
            fillForm(lesson);
            document.getElementById('saveBtn').textContent = '💾 Update Lesson';
            document.getElementById('cancelBtn').style.display = 'inline-block';
            document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEdit() {
            resetForm();
            showToast('Edit cancelled.', 'info');
        }

        function saveLesson() {
            var data = getFormData();
            if (!data.mainTitle) { showToast('Main Title is required.', 'error'); document.getElementById('fMainTitle').focus(); return; }
            if (!data.lessonNumber || data.lessonNumber <= 0) { showToast('Lesson Number must be positive.', 'error'); document.getElementById('fLessonNumber').focus(); return; }
            if (!data.letterTile) { showToast('Letter Tile is required.', 'error'); document.getElementById('fLetterTile').focus(); return; }
            if (!data.imageCaption) { showToast('Image Caption is required.', 'error'); document.getElementById('fImageCaption').focus(); return; }
            if (!data.introText) { showToast('Intro Text is required.', 'error'); document.getElementById('fIntroText').focus(); return; }
            if (data.words.flat().length < 6) { showToast('Add at least 6 words.', 'error'); document.getElementById('fWords').focus(); return; }
            if (data.sentences.length < 2) { showToast('Add at least 2 sentences.', 'error'); document.getElementById('fSentences').focus(); return; }
            if (data.fillBlanks.length < 4) { showToast('Add at least 4 fill-in blanks.', 'error'); document.getElementById('fFillBlanks').focus(); return; }

            var duplicate = lessons.find(l => l.lessonNumber === data.lessonNumber && l.id !== editingId);
            if (duplicate && !confirm('Lesson ' + data.lessonNumber + ' already exists. Continue?')) { return; }

            if (editingId) {
                var idx = lessons.findIndex(l => l.id === editingId);
                if (idx === -1) { showToast('Lesson not found.', 'error'); return; }
                lessons[idx] = { ...lessons[idx], ...data, id: editingId };
                showToast('Lesson ' + data.lessonNumber + ' updated.', 'success');
            } else {
                var newLesson = { ...data, id: generateId() };
                lessons.push(newLesson);
                showToast('Lesson ' + data.lessonNumber + ' created.', 'success');
            }
            saveData();
            resetForm();
            renderEditTab();
            renderAllView();
            updateAllCounts();
        }

        function deleteLesson(id) {
            var lesson = lessons.find(l => l.id === id);
            if (!lesson) return;
            confirmDialog('Delete Lesson ' + lesson.lessonNumber + ' "' + lesson.imageCaption + '"?', function() {
                lessons = lessons.filter(l => l.id !== id);
                saveData();
                renderEditTab();
                renderAllView();
                updateAllCounts();
                if (editingId === id) resetForm();
                showToast('Lesson deleted.', 'success');
            });
        }

        function duplicateLesson(id) {
            var lesson = lessons.find(l => l.id === id);
            if (!lesson) { showToast('Lesson not found.', 'error'); return; }
            var copy = JSON.parse(JSON.stringify(lesson));
            delete copy.id;
            copy.lessonNumber = lessons.reduce(function(max, l) { return Math.max(max, l.lessonNumber); }, 0) + 1;
            copy.imageCaption = copy.imageCaption + ' (copy)';
            copy.id = generateId();
            lessons.push(copy);
            saveData();
            renderEditTab();
            renderAllView();
            updateAllCounts();
            showToast('Lesson duplicated.', 'success');
        }

        function handleImageUpload(event) {
            var file = event.target.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) { showToast('Image must be <2MB.', 'error'); event.target.value = ''; return; }
            if (!file.type.startsWith('image/')) { showToast('Please select an image.', 'error'); event.target.value = ''; return; }
            var reader = new FileReader();
            reader.onload = function(e) {
                var dataUrl = e.target.result;
                document.getElementById('fImagePath').value = dataUrl;
                var img = document.getElementById('imagePreview');
                var placeholder = document.getElementById('imagePreviewPlaceholder');
                img.src = dataUrl;
                img.style.display = 'block';
                placeholder.style.display = 'none';
                showToast('Image uploaded.', 'success');
            };
            reader.onerror = function() { showToast('Failed to read file.', 'error'); };
            reader.readAsDataURL(file);
        }

        function exportJSON() {
            if (lessons.length === 0) { showToast('No lessons to export.', 'warning'); return; }
            var json = JSON.stringify(lessons, null, 2);
            var blob = new Blob([json], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'phonics_lessons_' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('JSON exported.', 'success');
        }

        function importJSON(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = JSON.parse(e.target.result);
                    if (!Array.isArray(data) || data.length === 0) { showToast('Invalid JSON.', 'error'); return; }
                    var first = data[0];
                    if (!first.lessonNumber && !first.letterTile) { showToast('Invalid lesson data.', 'error'); return; }
                    confirmDialog('Import ' + data.length + ' lessons? (Replaces all)', function() {
                        var maxId = 0;
                        data.forEach(function(l) {
                            if (!l.id) l.id = 'l' + Date.now() + Math.random().toString(36).slice(2, 6);
                            if (!l.mainTitle) l.mainTitle = 'SHORT VOWEL CVC WORDS';
                            if (l.words && l.words.length > 0 && !Array.isArray(l.words[0])) {
                                const flat = l.words;
                                const chunked = [];
                                for (let i = 0; i < flat.length; i += 4) chunked.push(flat.slice(i, i + 4));
                                l.words = chunked;
                            }
                            var num = parseInt(l.id.replace('l', '')) || 0;
                            if (num > maxId) maxId = num;
                        });
                        lessons = data;
                        nextId = maxId + 1;
                        saveData();
                        resetForm();
                        renderEditTab();
                        renderAllView();
                        updateAllCounts();
                        showToast('Imported ' + lessons.length + ' lessons.', 'success');
                    });
                } catch (err) {
                    showToast('Failed to parse JSON: ' + err.message, 'error');
                }
            };
            reader.onerror = function() { showToast('Failed to read file.', 'error'); };
            reader.readAsText(file);
            event.target.value = '';
        }

        function attachDragDrop() {
            var items = document.querySelectorAll('.lesson-item');
            var dragIndex = null;
            items.forEach(function(item) {
                item.addEventListener('dragstart', function(e) {
                    dragIndex = parseInt(item.dataset.index);
                    item.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', String(dragIndex));
                });
                item.addEventListener('dragend', function() {
                    item.classList.remove('dragging');
                    document.querySelectorAll('.lesson-item.drag-over').forEach(function(el) { el.classList.remove('drag-over'); });
                });
                item.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    var targetIndex = parseInt(item.dataset.index);
                    if (targetIndex !== dragIndex) {
                        document.querySelectorAll('.lesson-item.drag-over').forEach(function(el) { el.classList.remove('drag-over'); });
                        item.classList.add('drag-over');
                    }
                });
                item.addEventListener('dragleave', function() { item.classList.remove('drag-over'); });
                item.addEventListener('drop', function(e) {
                    e.preventDefault();
                    item.classList.remove('drag-over');
                    var from = parseInt(e.dataTransfer.getData('text/plain'));
                    var to = parseInt(item.dataset.index);
                    if (from !== to && !isNaN(from) && !isNaN(to)) {
                        var removed = lessons.splice(from, 1)[0];
                        lessons.splice(to, 0, removed);
                        saveData();
                        renderEditTab();
                        renderAllView();
                        updateAllCounts();
                        showToast('Lesson reordered.', 'success');
                    }
                });
            });
        }

        function renderEditTab() {
            var container = document.getElementById('editContainer');
            if (!container) return;
            var filtered = lessons.filter(function(l) {
                if (!searchQuery) return true;
                var q = searchQuery.toLowerCase();
                var words = (l.words || []).flat().join(' ');
                var sentences = (l.sentences || []).join(' ');
                var blanks = (l.fillBlanks || []).join(' ');
                return (l.lessonNumber + '').includes(q) ||
                    (l.mainTitle || '').toLowerCase().includes(q) ||
                    (l.letterTile || '').toLowerCase().includes(q) ||
                    (l.imageCaption || '').toLowerCase().includes(q) ||
                    (l.introText || '').toLowerCase().includes(q) ||
                    words.toLowerCase().includes(q) ||
                    sentences.toLowerCase().includes(q) ||
                    blanks.toLowerCase().includes(q);
            });

            var listHtml = `
                <div class="list-toolbar">
                    <input class="search-box" type="text" placeholder="🔍 Search lessons..." id="searchInput" value="${searchQuery}" />
                    <span class="count">${filtered.length} / ${lessons.length}</span>
                    <button class="btn btn-success btn-sm" onclick="exportJSON()">📤 Export JSON</button>
                    <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFileInput').click()">📥 Import JSON</button>
                    <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importJSON(event)" />
                </div>
                <div class="lesson-list" id="lessonList">`;
            if (filtered.length === 0) {
                listHtml += `<div class="empty-state"><div class="icon">🔍</div><h3>No lessons found</h3><p>${searchQuery ? 'Try adjusting your search.' : 'Click "Add New Lesson" to get started.'}</p></div>`;
            } else {
                filtered.forEach(function(l, idx) {
                    var actualIdx = lessons.indexOf(l);
                    var thumb = l.imagePath ? '<img class="thumb" src="' + l.imagePath + '" alt="" />' : '<div class="thumb placeholder">📄</div>';
                    listHtml += `
                        <div class="lesson-item" draggable="true" data-index="${actualIdx}" data-id="${l.id}">
                            <span class="drag-handle">⠿</span>
                            ${thumb}
                            <div class="info">
                                <div class="title">Lesson ${l.lessonNumber} — ${l.mainTitle || 'CVC'} ${l.imageCaption ? '· ' + l.imageCaption : ''}</div>
                                <div class="sub">${(l.introText || '').replace(/<[^>]*>/g,'').slice(0,80)}${(l.introText || '').length > 80 ? '…' : ''}</div>
                            </div>
                            <div class="actions">
                                <button class="btn btn-primary btn-xs" onclick="editLesson('${l.id}')">✏️</button>
                                <button class="btn btn-warning btn-xs" onclick="duplicateLesson('${l.id}')">📋</button>
                                <button class="btn btn-danger btn-xs" onclick="deleteLesson('${l.id}')">🗑️</button>
                            </div>
                        </div>`;
                });
            }
            listHtml += '</div>';
            container.innerHTML = listHtml;
            attachDragDrop();
            var searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                    searchQuery = e.target.value;
                    renderEditTab();
                });
            }
            updateAllCounts();
        }

        // ============================================================
        //  TAB SWITCHING
        // ============================================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(function(b) {
                b.classList.toggle('active', b.dataset.tab === tab);
            });
            document.querySelectorAll('.tab-panel').forEach(function(p) {
                p.classList.toggle('active', p.id === tab + 'Panel');
            });
            if (tab === 'view') renderAllView();
            if (tab === 'edit') renderEditTab();
            updateAllCounts();
        }

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            loadData();
            document.getElementById('fLessonNumber').value = lessons.length + 1;
            resetForm();
            renderEditTab();
            renderAllView();
            updateAllCounts();
            switchTab('edit');
        }

        // Expose globals
        window.switchTab = switchTab;
        window.saveLesson = saveLesson;
        window.editLesson = editLesson;
        window.deleteLesson = deleteLesson;
        window.duplicateLesson = duplicateLesson;
        window.cancelEdit = cancelEdit;
        window.exportJSON = exportJSON;
        window.importJSON = importJSON;
        window.handleImageUpload = handleImageUpload;

        // ============================================================
        //  BUILD APP DOM
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            var app = document.getElementById('app');
            app.innerHTML = `
                <div class="app">
                    <div class="app-header">
                        <h1>📚 Phonics Lesson Publisher</h1>
                        <span class="badge" id="lessonCount">0 lessons</span>
                    </div>
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="edit" onclick="switchTab('edit')">✏️ Edit</button>
                        <button class="tab-btn" data-tab="view" onclick="switchTab('view')">👁️ View</button>
                    </div>
                    <div class="tab-panel active" id="editPanel">
                        <div class="edit-layout">
                            <div class="form-section">
                                <h2 id="formTitle">➕ Add New Lesson <span class="edit-id" id="formId"></span></h2>
                                <div class="form-group">
                                    <label>Main Title <span class="req">*</span></label>
                                    <input type="text" id="fMainTitle" placeholder="e.g. SHORT VOWEL CVC WORDS" />
                                </div>
                                <div class="form-group">
                                    <label>Lesson Number <span class="req">*</span></label>
                                    <input type="number" id="fLessonNumber" min="1" step="1" />
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Letter Tile <span class="req">*</span></label>
                                        <input type="text" id="fLetterTile" placeholder="e.g. Aa" />
                                    </div>
                                    <div class="form-group">
                                        <label>Image Caption <span class="req">*</span></label>
                                        <input type="text" id="fImageCaption" placeholder="e.g. Apple" />
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Image (upload from device)</label>
                                    <div class="image-upload-wrap">
                                        <img id="imagePreview" class="preview" src="" alt="Preview" style="display:none;" />
                                        <div id="imagePreviewPlaceholder" class="preview-placeholder">🖼️</div>
                                        <input type="file" id="fImageFile" accept="image/*" onchange="handleImageUpload(event)" />
                                        <input type="hidden" id="fImagePath" />
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Intro Text <span class="req">*</span></label>
                                    <textarea id="fIntroText" rows="2" placeholder="Custom introduction for this lesson..."></textarea>
                                </div>
                                <div class="form-group">
                                    <label>Words (comma separated) <span class="req">*</span></label>
                                    <textarea id="fWords" rows="2" placeholder="cat, bat, hat, mat, dad, fat..."></textarea>
                                </div>
                                <div class="form-group">
                                    <label>Sentences (comma separated) <span class="req">*</span></label>
                                    <textarea id="fSentences" rows="2" placeholder="The cat sat on a mat., A rat had a hat."></textarea>
                                </div>
                                <div class="form-group">
                                    <label>Fill Blanks (comma separated) <span class="req">*</span></label>
                                    <textarea id="fFillBlanks" rows="2" placeholder="c__t, b__t, h__t, m__t..."></textarea>
                                </div>
                                <div class="form-actions">
                                    <button class="btn btn-primary" id="saveBtn" onclick="saveLesson()">💾 Save Lesson</button>
                                    <button class="btn btn-outline" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
                                </div>
                            </div>
                            <div class="list-section">
                                <h2 style="font-size:18px;margin-bottom:12px;">📖 All Lessons</h2>
                                <div id="editContainer"></div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-panel" id="viewPanel">
                        <div class="view-toolbar">
                            <span class="info" id="viewInfo">📄 0 lessons · 0 pages</span>
                            <button class="btn btn-success" id="exportAllBtn">⬇ Export ALL pages as PDF</button>
                            <button class="btn btn-outline" onclick="switchTab('edit')">✏️ Back to Edit</button>
                        </div>
                        <div class="view-container" id="viewContainer"></div>
                    </div>
                </div>`;
            init();
        });
    </script>
</body>
</html>
