<body>
    <div id="app"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            const IDB_NAME = 'phonics_lessons_db_v13';
            const IDB_STORE = 'app_data';
            const LEGACY_STORAGE_KEY = 'phonics_lessons_v13';
            const LEGACY_V12_KEY = 'phonics_lessons_v12';
            const MAX_TOC_PER_PAGE = 20;
            const MAX_SIGHT_WORDS_PER_PAGE = 50;
            const MAX_GRID_WORDS = 24;
            const MAX_FILL_ITEMS = 18;
            const MAX_PAGES = 200;
            const MAX_SECTIONS = 20;
            const MAX_FILE_SIZE = 10 * 1024 * 1024;
            let dbPromise = null;

            function getDB() {
                if (!dbPromise) {
                    dbPromise = new Promise((resolve, reject) => {
                        const request = indexedDB.open(IDB_NAME, 1);
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(IDB_STORE)) {
                                db.createObjectStore(IDB_STORE);
                            }
                        };
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => reject(request.error);
                    });
                }
                return dbPromise;
            }

            async function idbSet(data) {
                try {
                    const db = await getDB();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(IDB_STORE, 'readwrite');
                        const store = tx.objectStore(IDB_STORE);
                        store.put(data, 'appData');
                        tx.oncomplete = () => resolve();
                        tx.onerror = () => reject(tx.error);
                    });
                } catch (e) {
                    throw e;
                }
            }

            async function idbGet() {
                try {
                    const db = await getDB();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(IDB_STORE, 'readonly');
                        const store = tx.objectStore(IDB_STORE);
                        const request = store.get('appData');
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => reject(request.error);
                    });
                } catch (e) {
                    return null;
                }
            }

            function escapeHtml(str) {
                return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
            }

            function showToast(msg, type = 'info') {
                const t = document.createElement('div');
                t.className = 'toast ' + type;
                t.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️'}</span> ${escapeHtml(msg)}`;
                document.getElementById('toastContainer').appendChild(t);
                setTimeout(() => t.remove(), 3500);
            }

            function confirmDialog(msg, cb) {
                const o = document.createElement('div');
                o.className = 'modal-overlay';
                o.innerHTML = `<div class="modal"><h3>⚠️ Confirm</h3><p>${msg}</p><div class="actions"><button class="btn btn-outline cancel">Cancel</button><button class="btn btn-danger confirm">Yes</button></div></div>`;
                document.body.appendChild(o);
                o.querySelector('.cancel').onclick = () => o.remove();
                o.querySelector('.confirm').onclick = () => { o.remove(); cb(); };
            }

            const SECTION_TYPES = {
                tile: { label: 'Letter/Image Tile', defaultWidth: 'full', fields: ['tileMode','letterTile','letterFontSize','imagePath','imageCaption'] },
                introText: { label: 'Intro Text', defaultWidth: 'full', fields: ['text'] },
                instruction: { label: 'Instruction', defaultWidth: 'full', fields: ['text'] },
                wordGrid: { label: 'Word Grid', defaultWidth: 'full', fields: ['words','columns','rows'] },
                decodable: { label: 'Decodable Reading', defaultWidth: 'full', fields: ['instruction','sentences'] },
                fillBlanks: { label: 'Fill-in-Blanks', defaultWidth: 'full', fields: ['title','items'] },
                sentenceWriting: { label: 'Sentence Writing', defaultWidth: 'full', fields: ['title','lines'] },
                customText: { label: 'Custom Text', defaultWidth: 'full', fields: ['text'] },
                writingLines: { label: 'Writing Lines (expandable)', defaultWidth: 'full', fields: ['fillRemaining'] }
            };

            function generateSectionId() { return 'sec' + Date.now() + Math.random().toString(36).slice(2, 7); }
            function createDefaultSection(type) {
                const id = generateSectionId();
                const base = { id, type, width: SECTION_TYPES[type].defaultWidth };
                switch (type) {
                    case 'tile': return { ...base, tileMode: 'letter', letterTile: 'Aa', letterFontSize: 56, imagePath: '', imageCaption: "TODAY'S SOUND" };
                    case 'introText': case 'instruction': case 'customText': return { ...base, text: '' };
                    case 'wordGrid': return { ...base, words: [], columns: 4, rows: 3 };
                    case 'decodable': return { ...base, instruction: 'Read ALOUD and circle all words with the target sound', sentences: [] };
                    case 'fillBlanks': return { ...base, title: 'A. Fill in the missing letters and say the word', items: [] };
                    case 'sentenceWriting': return { ...base, title: 'C. Choose any word and form 2 sentences', lines: 2 };
                    case 'writingLines': return { ...base, fillRemaining: true };
                    default: return { ...base };
                }
            }

            function generatePageId() { return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

            function createDefaultStructuredPage() {
                return {
                    id: generatePageId(),
                    type: 'structured',
                    name: 'Lesson Page',
                    mainTitle: 'SHORT VOWEL CVC WORDS',
                    subtitle: 'SHORT VOWEL',
                    sections: [
                        { id: generateSectionId(), type: 'tile', width: 'full', tileMode: 'letter', letterTile: 'Aa', letterFontSize: 56, imagePath: '', imageCaption: "TODAY'S SOUND" },
                        { id: generateSectionId(), type: 'introText', width: 'full', text: 'Short a says /a/ like in <b>apple</b> — when a single vowel is boxed in between two consonants, it usually keeps this quick, clipped sound.' },
                        { id: generateSectionId(), type: 'instruction', width: 'full', text: 'Say each picture word out loud and listen for this pattern.' },
                        { id: generateSectionId(), type: 'wordGrid', width: 'full', words: ['bag','cat','mat','hat','rat','bat','sat','pat','fat','man','van','map'], columns: 4, rows: 3 },
                        { id: generateSectionId(), type: 'decodable', width: 'full', instruction: 'Read ALOUD and circle all words with the target sound', sentences: ['I see a bag.','Look at the cat and the mat.','Is this a hat?','I like my rat.','We have a bat.'] },
                        { id: generateSectionId(), type: 'fillBlanks', width: 'full', title: 'A. Fill in the missing letters and say the word', items: ['b_g','c_t','m_t','h_t','r_t','b_t','s_t','p_t','f_t'] },
                        { id: generateSectionId(), type: 'sentenceWriting', width: 'full', title: 'C. Choose any word and form 2 sentences', lines: 2 },
                        { id: generateSectionId(), type: 'writingLines', width: 'full', fillRemaining: true }
                    ]
                };
            }

            function createDefaultCodePage() {
                return {
                    id: generatePageId(),
                    type: 'code',
                    name: 'Code Page',
                    html: '<div class="content"><h1>Your Page</h1><p>Write HTML and CSS directly here.</p></div>',
                    css: '.content{padding:48px;font-family:Arial,sans-serif}h1{margin:0 0 18px}p{font-size:18px}',
                    width: 850,
                    height: 1100,
                    border: '1px solid #000',
                    background: '#fff'
                };
            }

            // Global state
            let pages = [];
            let sightWords = [];
            let coverData = { title: 'Crystal Phonics', subtitle: 'Grade 1' };
            let editingPageId = null;
            let tempSections = [];
            let tempPageType = 'structured';
            window.searchQuery = '';

            // History
            const HISTORY_LIMIT = 60;
            let undoStack = [], redoStack = [], historyBusy = false, saveBusy = Promise.resolve();
            const cloneState = state => JSON.parse(JSON.stringify(state));
            function currentState() { return { pages: cloneState(pages), sightWords: cloneState(sightWords), coverData: cloneState(coverData) }; }
            function stateKey(state) { try { return JSON.stringify(state); } catch(e) { return ''; } }
            function updateHistoryUI() {
                const u=document.getElementById('undoBtn'), r=document.getElementById('redoBtn');
                if(u) u.disabled = historyBusy || undoStack.length===0;
                if(r) r.disabled = historyBusy || redoStack.length===0;
                const el=document.getElementById('historyStatus');
                if(el) el.textContent = `${undoStack.length ? undoStack.length+' undo' : 'No undo'} · ${redoStack.length ? redoStack.length+' redo' : 'No redo'}`;
            }
            function recordHistory(before, after) {
                if (historyBusy || stateKey(before) === stateKey(after)) return;
                undoStack.push(cloneState(before));
                if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
                redoStack = [];
                updateHistoryUI();
            }
            async function persistState() {
                const snapshot=currentState();
                saveBusy = saveBusy.then(async()=>{
                    await saveData(snapshot);
                }).catch(err=>{
                    console.error(err);
                    showToast('Could not save changes. Your data remains in memory; export JSON as a backup.', 'error');
                });
                return saveBusy;
            }
            async function restoreState(state) {
                const normalized = normalizeImportedState(cloneState(state));
                pages = normalized.pages; sightWords = normalized.sightWords; coverData = normalized.coverData;
                resetForm(); refreshUI();
                await persistState();
            }
            window.undoLast = async function() {
                if(historyBusy || !undoStack.length) return;
                historyBusy=true; updateHistoryUI();
                try {
                    const current=currentState(), previous=undoStack.pop();
                    redoStack.push(current); if(redoStack.length>HISTORY_LIMIT) redoStack.shift();
                    await restoreState(previous); showToast('Undid last change.','success');
                } finally { historyBusy=false; updateHistoryUI(); }
            };
            window.redoLast = async function() {
                if(historyBusy || !redoStack.length) return;
                historyBusy=true; updateHistoryUI();
                try {
                    const current=currentState(), next=redoStack.pop();
                    undoStack.push(current); if(undoStack.length>HISTORY_LIMIT) undoStack.shift();
                    await restoreState(next); showToast('Redid last change.','success');
                } finally { historyBusy=false; updateHistoryUI(); }
            };
            window.addEventListener('keydown', e=>{
                const mod=e.ctrlKey||e.metaKey;
                if(!mod || e.altKey) return;
                const tag=(e.target?.tagName||'').toLowerCase();
                if((tag==='input'||tag==='textarea'||tag==='select') && !e.shiftKey) return;
                if(e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey ? redoLast() : undoLast(); }
                else if(e.key.toLowerCase()==='y'){ e.preventDefault(); redoLast(); }
            });

            function normalizeImportedState(data) {
                const rawPages = Array.isArray(data?.pages) ? data.pages : [];
                const seenPageIds = new Set();
                const seenSectionIds = new Set();
                const safePages = rawPages.map((p, idx) => {
                    let newId = p.id;
                    if (!newId || seenPageIds.has(newId)) newId = generatePageId();
                    seenPageIds.add(newId);
                    if (p.type === 'code') {
                        return {
                            ...createDefaultCodePage(),
                            ...p,
                            id: newId,
                            width: Math.min(850, Math.max(100, Number(p.width) || 850)),
                            height: Math.min(1100, Math.max(100, Number(p.height) || 1100)),
                            html: String(p.html || ''),
                            css: String(p.css || ''),
                            border: String(p.border || '1px solid #000'),
                            background: String(p.background || '#fff')
                        };
                    } else {
                        let sections = Array.isArray(p.sections) ? p.sections : [];
                        const rebuiltSections = [];
                        for (const sec of sections) {
                            if (!sec || !SECTION_TYPES[sec.type]) continue;
                            let secId = sec.id;
                            if (!secId || seenSectionIds.has(secId)) secId = generateSectionId();
                            seenSectionIds.add(secId);
                            rebuiltSections.push({ ...sec, id: secId });
                        }
                        sections = rebuiltSections.slice(0, MAX_SECTIONS);
                        return {
                            ...createDefaultStructuredPage(),
                            ...p,
                            id: newId,
                            mainTitle: String(p.mainTitle || 'Untitled'),
                            subtitle: String(p.subtitle || 'SHORT VOWEL'),
                            sections: sections
                        };
                    }
                }).slice(0, MAX_PAGES);
                const sw = Array.isArray(data?.sightWords) ? data.sightWords : [];
                const cd = data?.coverData || { title: 'Crystal Phonics', subtitle: 'Grade 1' };
                return { pages: safePages, sightWords: sw, coverData: { title: cd.title || 'Crystal Phonics', subtitle: cd.subtitle || 'Grade 1' } };
            }

            function migrateFromV12() {
                try {
                    const raw = localStorage.getItem(LEGACY_V12_KEY);
                    if (!raw) return null;
                    const old = JSON.parse(raw);
                    if (!old || !Array.isArray(old.lessons)) return null;
                    const migratedPages = old.lessons.map(l => ({
                        id: l.id || generatePageId(),
                        type: 'structured',
                        name: l.mainTitle || 'Lesson Page',
                        mainTitle: l.mainTitle,
                        subtitle: l.subtitle,
                        sections: l.sections || []
                    }));
                    try {
                        const codeData = JSON.parse(localStorage.getItem('phonics_html_css_pages_v1'));
                        if (codeData && Array.isArray(codeData.pages)) {
                            codeData.pages.forEach(p => {
                                migratedPages.push({
                                    id: p.id || generatePageId(),
                                    type: 'code',
                                    name: p.name || 'Code Page',
                                    html: p.html || '',
                                    css: p.css || '',
                                    width: p.width || 850,
                                    height: p.height || 1100,
                                    border: p.border || '1px solid #000',
                                    background: p.background || '#fff'
                                });
                            });
                        }
                    } catch(e) {}
                    return { pages: migratedPages.slice(0, MAX_PAGES), sightWords: old.sightWords || [], coverData: old.coverData || { title: 'Crystal Phonics', subtitle: 'Grade 1' } };
                } catch(e) { return null; }
            }

            async function loadData() {
                let data = null;
                try { data = await idbGet(); } catch(e) { data = null; }
                let loadedFromLegacy = false;
                if (!data || !data.pages) {
                    try {
                        const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
                        if (raw) { data = JSON.parse(raw); loadedFromLegacy = true; }
                    } catch(e) {}
                }
                if (!data || !data.pages) {
                    data = migrateFromV12();
                    if (data && data.pages) loadedFromLegacy = true;
                }
                if (data && data.pages) {
                    const normalized = normalizeImportedState(data);
                    pages = normalized.pages;
                    sightWords = normalized.sightWords;
                    coverData = normalized.coverData;
                    if (loadedFromLegacy || !data.version) {
                        await persistState();
                    }
                } else {
                    pages = [createDefaultStructuredPage()];
                    sightWords = ['the','of','and','a','to','in','is','you'];
                    coverData = { title: 'Crystal Phonics', subtitle: 'Grade 1' };
                }
            }

            async function saveData(dataOverride) {
                const payload = dataOverride ? cloneState(dataOverride) : currentState();
                payload.version = 2;
                try {
                    await idbSet(payload);
                } catch (e) {
                    try {
                        localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(payload));
                    } catch (err) {
                        throw new Error('Persistent storage unavailable');
                    }
                    return;
                }
                try { localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(payload)); } catch(e) {}
            }

            function renderSectionsBuilder() {
                const container = document.getElementById('sectionsContainer');
                if (!container) return;
                if (!tempSections.length) {
                    container.innerHTML = '<div style="color:#6c757d;font-size:12px;padding:8px 0;">No sections added.</div>';
                    return;
                }
                let html = '';
                tempSections.forEach((section, idx) => {
                    const typeInfo = SECTION_TYPES[section.type];
                    html += `<div class="section-builder-item" data-id="${section.id}">
                        <div class="sb-header">
                            <span class="sb-title">${typeInfo.label}</span>
                            <select onchange="updateSectionWidth('${section.id}', this.value)">
                                <option value="full" ${section.width === 'full' ? 'selected' : ''}>Full width</option>
                                <option value="half" ${section.width === 'half' ? 'selected' : ''}>Half width</option>
                                <option value="quarter" ${section.width === 'quarter' ? 'selected' : ''}>Quarter width</option>
                                <option value="threequarter" ${section.width === 'threequarter' ? 'selected' : ''}>Three-quarter width</option>
                            </select>
                            <div class="sb-actions">
                                <button class="btn btn-outline btn-xs" onclick="moveSection('${section.id}', -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
                                <button class="btn btn-outline btn-xs" onclick="moveSection('${section.id}', 1)" ${idx === tempSections.length-1 ? 'disabled' : ''}>▼</button>
                                <button class="btn btn-danger btn-xs" onclick="deleteSection('${section.id}')">🗑️</button>
                            </div>
                        </div>
                        <div class="sb-body">${renderSectionFields(section)}</div>
                    </div>`;
                });
                container.innerHTML = html;
            }

            function renderSectionFields(section) {
                let html = '';
                switch (section.type) {
                    case 'tile':
                        html = `
                            <select onchange="updateSectionData('${section.id}', 'tileMode', this.value)">
                                <option value="letter" ${section.tileMode === 'letter' ? 'selected' : ''}>Letter</option>
                                <option value="image" ${section.tileMode === 'image' ? 'selected' : ''}>Image</option>
                            </select>
                            <div class="form-group"><label>Letter Tile</label><input value="${escapeHtml(section.letterTile || '')}" onchange="updateSectionData('${section.id}', 'letterTile', this.value)"></div>
                            <div class="form-group"><label>Font size (px)</label><input type="number" value="${section.letterFontSize || 56}" min="24" max="96" onchange="updateSectionData('${section.id}', 'letterFontSize', this.value)"></div>
                            <div class="form-group"><label>Caption (for image mode)</label><input value="${escapeHtml(section.imageCaption || "TODAY'S SOUND")}" onchange="updateSectionData('${section.id}', 'imageCaption', this.value)"></div>
                            <div class="form-group"><label>Image Path</label><input value="${escapeHtml(section.imagePath || '')}" onchange="updateSectionData('${section.id}', 'imagePath', this.value)"></div>
                            <div class="form-group"><label>Upload Image</label><input type="file" accept="image/*" onchange="handleTileImageUpload(this, '${section.id}')"></div>`;
                        break;
                    case 'introText': case 'instruction': case 'customText':
                        html = `<textarea rows="3" oninput="updateSectionData('${section.id}', 'text', this.value)">${escapeHtml(section.text || '')}</textarea>`;
                        break;
                    case 'wordGrid':
                        html = `
                            <div style="display:flex; gap:10px;">
                                <div class="form-group" style="flex:1;"><label>Columns</label><input type="number" value="${section.columns || 4}" min="1" max="8" onchange="updateSectionData('${section.id}', 'columns', parseInt(this.value))"></div>
                                <div class="form-group" style="flex:1;"><label>Rows</label><input type="number" value="${section.rows || 3}" min="1" max="12" onchange="updateSectionData('${section.id}', 'rows', parseInt(this.value))"></div>
                            </div>
                            <textarea rows="3" placeholder="Comma separated words" oninput="updateSectionData('${section.id}', 'words', this.value.split(',').map(s=>s.trim()).filter(Boolean))">${(section.words || []).join(', ')}</textarea>`;
                        break;
                    case 'decodable':
                        html = `<input value="${escapeHtml(section.instruction || '')}" onchange="updateSectionData('${section.id}', 'instruction', this.value)"><textarea rows="3" placeholder="Sentences, comma separated" oninput="updateSectionData('${section.id}', 'sentences', this.value.split(',').map(s=>s.trim()).filter(Boolean))">${(section.sentences || []).join(', ')}</textarea>`;
                        break;
                    case 'fillBlanks':
                        html = `<input value="${escapeHtml(section.title || '')}" onchange="updateSectionData('${section.id}', 'title', this.value)"><textarea rows="3" placeholder="Items, comma separated (use _ for blank)" oninput="updateSectionData('${section.id}', 'items', this.value.split(',').map(s=>s.trim()).filter(Boolean))">${(section.items || []).join(', ')}</textarea>`;
                        break;
                    case 'sentenceWriting':
                        html = `<input value="${escapeHtml(section.title || '')}" onchange="updateSectionData('${section.id}', 'title', this.value)"><input type="number" value="${section.lines || 2}" min="1" max="8" onchange="updateSectionData('${section.id}', 'lines', parseInt(this.value))">`;
                        break;
                    case 'writingLines':
                        html = `<label><input type="checkbox" ${section.fillRemaining ? 'checked' : ''} onchange="updateSectionData('${section.id}', 'fillRemaining', this.checked)"> Fill remaining height</label>`;
                        break;
                    default: html = '';
                }
                return html;
            }

            window.handleTileImageUpload = function(input, sectionId) {
                const file = input.files?.[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    showToast('Please select an image file.', 'error');
                    return;
                }
                if (file.size > 2 * 1024 * 1024) {
                    showToast('Image must be < 2MB.', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = ev => {
                    const dataUrl = ev.target.result;
                    const section = tempSections.find(s => s.id === sectionId);
                    if (section) {
                        section.tileMode = 'image';
                        section.imagePath = dataUrl;
                        renderSectionsBuilder();
                        renderThumbnail();
                        showToast('Image uploaded.', 'success');
                    }
                };
                reader.readAsDataURL(file);
                input.value = '';
            };

            window.addSection = function(type) {
                if (tempSections.length >= MAX_SECTIONS) {
                    showToast(`Maximum ${MAX_SECTIONS} sections per page reached.`, 'warning');
                    return;
                }
                tempSections.push(createDefaultSection(type));
                renderSectionsBuilder();
                renderThumbnail();
            };
            window.deleteSection = function(id) {
                tempSections = tempSections.filter(s => s.id !== id);
                renderSectionsBuilder();
                renderThumbnail();
            };
            window.moveSection = function(id, dir) {
                const idx = tempSections.findIndex(s => s.id === id);
                if (idx === -1) return;
                const newIdx = idx + dir;
                if (newIdx < 0 || newIdx >= tempSections.length) return;
                const temp = tempSections[idx];
                tempSections[idx] = tempSections[newIdx];
                tempSections[newIdx] = temp;
                renderSectionsBuilder();
                renderThumbnail();
            };
            window.updateSectionWidth = function(id, width) {
                const section = tempSections.find(s => s.id === id);
                if (section) section.width = width;
                renderThumbnail();
            };
            window.updateSectionData = function(id, field, value) {
                const section = tempSections.find(s => s.id === id);
                if (!section) return;
                section[field] = value;
                if (field === 'lines') section.lines = parseInt(value) || 2;
                if (field === 'columns') section.columns = parseInt(value) || 4;
                if (field === 'rows') section.rows = parseInt(value) || 3;
                renderThumbnail();
            };

            function renderThumbnail() {
                const container = document.getElementById('thumbnailContainer');
                if (!container) return;
                const pageType = document.getElementById('pageTypeSelect')?.value || 'structured';
                let pageEl;
                if (pageType === 'structured') {
                    const tempPage = {
                        type: 'structured',
                        mainTitle: document.getElementById('fMainTitle')?.value || 'Untitled',
                        subtitle: document.getElementById('fSubtitle')?.value || 'SHORT VOWEL',
                        sections: JSON.parse(JSON.stringify(tempSections))
                    };
                    pageEl = buildStructuredPage(tempPage, 1);
                } else {
                    const tempPage = {
                        type: 'code',
                        html: document.getElementById('codeHTML')?.value || '',
                        css: document.getElementById('codeCSS')?.value || '',
                        width: Math.min(850, parseInt(document.getElementById('codeWidth')?.value) || 850),
                        height: Math.min(1100, parseInt(document.getElementById('codeHeight')?.value) || 1100),
                        border: document.getElementById('codeBorder')?.value || '1px solid #000',
                        background: document.getElementById('codeBackground')?.value || '#fff'
                    };
                    pageEl = buildCodePage(tempPage, 1);
                }
                pageEl.querySelector('.page-actions')?.remove();
                pageEl.style.transform = 'scale(0.3)';
                pageEl.style.transformOrigin = 'top left';
                pageEl.style.position = 'absolute';
                pageEl.style.top = '0';
                pageEl.style.left = '0';
                pageEl.style.width = '850px';
                pageEl.style.minWidth = '850px';
                pageEl.style.minHeight = '1080px';
                pageEl.style.padding = '24px 32px';
                pageEl.style.margin = '0';
                pageEl.style.borderRadius = '0';
                pageEl.style.boxShadow = 'none';
                pageEl.style.pageBreakAfter = 'auto';
                container.innerHTML = '';
                container.appendChild(pageEl);
                container.style.height = '324px';
            }

            function buildStructuredPage(page, pageNum) {
                const div = document.createElement('div');
                div.className = 'page';
                div.innerHTML = `<div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div>`;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="cvc-header">
                        <div class="cvc-header-left">
                            <h1 class="cvc-main-title">${escapeHtml(page.mainTitle || 'CVC WORDS')}</h1>
                            <div class="cvc-subtitle">${escapeHtml(page.subtitle || 'SHORT VOWEL')}</div>
                        </div>
                        <div class="cvc-header-right">
                            <span class="lesson-label">LESSON</span>
                            <span class="lesson-num">${pageNum}</span>
                        </div>
                    </div>`;
                const sectionsContainer = document.createElement('div');
                sectionsContainer.className = 'lesson-sections-container';
                (page.sections || []).forEach(section => {
                    const sectionEl = document.createElement('div');
                    sectionEl.className = `section-item w-${section.width}`;
                    sectionEl.innerHTML = renderSectionContent(section);
                    sectionsContainer.appendChild(sectionEl);
                });
                card.appendChild(sectionsContainer);
                div.appendChild(card);
                const pn = document.createElement('div');
                pn.className = 'cvc-page-number';
                pn.textContent = pageNum;
                card.appendChild(pn);
                return div;
            }

            function renderSectionContent(section) {
                switch (section.type) {
                    case 'tile': {
                        const tileMode = section.tileMode || 'letter';
                        if (tileMode === 'letter') {
                            return `<div class="todays-sound-card">
                                <div class="todays-sound-header">TODAY'S SOUND</div>
                                <div class="todays-sound-body">
                                    <div class="todays-sound-stars">★ ★ ★</div>
                                    <div class="todays-sound-letter" style="font-size:${section.letterFontSize || 56}px">${escapeHtml(section.letterTile || 'Aa')}</div>
                                </div>
                            </div>`;
                        } else {
                            const img = section.imagePath ? `<img class="todays-sound-img" src="${escapeHtml(section.imagePath)}" />` : `<div style="font-size:32px;opacity:0.4">🖼️</div>`;
                            return `<div class="todays-sound-card"><div class="todays-sound-header">${escapeHtml(section.imageCaption || "TODAY'S SOUND")}</div><div class="todays-sound-body">${img}</div></div>`;
                        }
                    }
                    case 'introText': return `<div class="cvc-intro-box"><p>${formatTextWithHighlight(section.text || '')}</p></div>`;
                    case 'instruction': return `<div class="cvc-instruction-box"><p>${escapeHtml(section.text || '')}</p></div>`;
                    case 'customText': return `<div class="custom-text-box"><p>${formatTextWithHighlight(section.text || '')}</p></div>`;
                    case 'wordGrid': {
                        const columns = Math.max(1, Math.min(8, Number(section.columns) || 4));
                        const rows = Math.max(1, Math.min(8, Number(section.rows) || 3));
                        const words = (Array.isArray(section.words) ? section.words : []).slice(0, Math.min(MAX_GRID_WORDS, columns * rows));
                        const totalCells = Math.min(MAX_GRID_WORDS, columns * rows);
                        let cellsHtml = '';
                        for (let i = 0; i < totalCells; i++) {
                            const word = words[i] || '';
                            const isLastCol = (i % columns) === columns - 1;
                            const isLastRow = i >= totalCells - columns;
                            let cellStyle = '';
                            if (!isLastCol) cellStyle += 'border-right:1px solid #f0c9a8;';
                            else cellStyle += 'border-right:none;';
                            if (!isLastRow) cellStyle += 'border-bottom:1px solid #f0c9a8;';
                            else cellStyle += 'border-bottom:none;';
                            cellsHtml += `<div class="word-cell${word ? '' : ' empty'}" style="${cellStyle}">${escapeHtml(word || '')}</div>`;
                        }
                        return `<div class="word-grid" style="grid-template-columns:repeat(${columns},1fr);">${cellsHtml}</div>`;
                    }
                    case 'decodable': {
                        const sents = (section.sentences || []).filter(Boolean);
                        if (!sents.length) return '';
                        const lines = sents.map((s, i) => `<div class="sentence">${i + 1}. ${escapeHtml(s)}</div>`).join('');
                        return `<div class="act-box"><div class="act-title">${escapeHtml(section.instruction || '')}</div>${lines}</div>`;
                    }
                    case 'fillBlanks': {
                        const items = (section.items || []).filter(Boolean).slice(0, MAX_FILL_ITEMS);
                        if (!items.length) return '';
                        const cells = items.map(item => {
                            let html = '';
                            for (const ch of String(item)) {
                                if (ch === '_') html += '<span class="blank-sq"></span>';
                                else html += `<span>${escapeHtml(ch)}</span>`;
                            }
                            return `<div class="fill-item">${html}</div>`;
                        }).join('');
                        return `<div class="act-box"><div class="act-title">${escapeHtml(section.title || '')}</div><div class="fill-grid">${cells}</div></div>`;
                    }
                    case 'sentenceWriting': {
                        const n = Math.max(1, Math.min(8, section.lines || 2));
                        let lines = '';
                        for (let i = 0; i < n; i++) lines += `<div class="sent-line">${i + 1}.</div>`;
                        return `<div class="act-box"><div class="act-title">${escapeHtml(section.title || '')}</div><div class="sent-lines">${lines}</div></div>`;
                    }
                    case 'writingLines': {
                        let lines = '';
                        for (let i = 0; i < 3; i++) {
                            lines += `<div class="writing-set"><div class="line l1"></div><div class="line l2"></div><div class="line l3"></div><div class="line l4"></div></div>`;
                        }
                        return `<div class="writing-lines-area">${lines}</div>`;
                    }
                    default: return '';
                }
            }

            function sanitizeHTML(html) {
                let d = new DOMParser().parseFromString(String(html||''), 'text/html');
                d.querySelectorAll('script,iframe,object,embed,link,meta,base,form').forEach(n => n.remove());
                d.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => {
                    if (/^on/i.test(a.name) || a.name === 'srcdoc') n.removeAttribute(a.name);
                }));
                d.querySelectorAll('[href],[src]').forEach(n => ['href','src'].forEach(k => {
                    let v = n.getAttribute(k) || '';
                    if (/^\s*(javascript:|vbscript:|data:text\/html)/i.test(v)) n.removeAttribute(k);
                }));
                return d.body.innerHTML;
            }

            function sanitizeCSS(css) {
                return String(css||'').replace(/@import\s+[^;]+;?/gi, '').replace(/expression\s*\([^)]*\)/gi, '').replace(/url\s*\(\s*['"]?\s*javascript:[^)]*\)/gi, '');
            }

            function buildCodePage(page, pageNum) {
                const div = document.createElement('div');
                div.className = 'page';
                div.innerHTML = `<div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div>`;
                const card = document.createElement('div');
                card.className = 'card code-card';
                card.style.width = (page.width || 850) + 'px';
                card.style.height = (page.height || 1100) + 'px';
                card.style.border = page.border || '1px solid #000';
                card.style.background = page.background || '#fff';
                card.style.minHeight = 'auto';
                card.style.display = 'block';
                card.style.overflow = 'hidden';
                card.style.position = 'relative';
                card.style.borderRadius = '0';
                const scopeClass = 'scope-' + page.id.replace(/[^a-zA-Z0-9]/g, '');
                card.classList.add(scopeClass);
                const scopedCSS = sanitizeCSS(page.css).split('}').map(rule => {
                    if (rule.trim()) {
                        const parts = rule.split('{');
                        if (parts.length === 2) {
                            const selectors = parts[0].split(',').map(s => `.${scopeClass} ${s.trim()}`).join(', ');
                            return `${selectors} {${parts[1]}}`;
                        }
                    }
                    return rule;
                }).join('}');
                const style = document.createElement('style');
                style.textContent = scopedCSS;
                const content = document.createElement('div');
                content.style.padding = '20px';
                content.innerHTML = sanitizeHTML(page.html);
                card.append(style, content);
                div.appendChild(card);
                const pn = document.createElement('div');
                pn.className = 'cvc-page-number';
                pn.textContent = pageNum;
                card.appendChild(pn);
                return div;
            }

            function buildCoverPage() {
                const page = document.createElement('div'); page.className = 'page';
                page.innerHTML = `<div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div>`;
                const card = document.createElement('div'); card.className = 'card cover-card';
                card.innerHTML = `<div class="cover-text-block"><div class="cover-line"></div><div class="cover-title">${escapeHtml(coverData.title)}</div><div class="cover-subtitle">${escapeHtml(coverData.subtitle)}</div><div class="cover-line"></div></div>`;
                page.appendChild(card); return page;
            }

            function buildTocPage(pageNum, entries) {
                const page = document.createElement('div'); page.className = 'page';
                page.innerHTML = `<div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div>`;
                const card = document.createElement('div'); card.className = 'toc-card';

            function buildSightWordsPage(pageNum, words) {
                const page = document.createElement('div'); page.className = 'page';
                page.innerHTML = `<div class="page-actions no-print"><button class="export-btn" onclick="exportSinglePage(this.closest('.page'))">📄 Export</button></div>`;

            window.exportSinglePage = function(pageEl) {
                const clone = pageEl.cloneNode(true);

            function renderAllView() {
                const container = document.getElementById('viewContainer');
                container.innerHTML = '';
                container.appendChild(buildCoverPage());
                if (!pages.length && !sightWords.length) return;
                const swPages = Math.ceil(sightWords.length / MAX_SIGHT_WORDS_PER_PAGE) || 0;
                const tocPages = pages.length ? Math.ceil(pages.length / MAX_TOC_PER_PAGE) : 0;
                const lessonStart = tocPages + swPages + 2;
                let running = lessonStart;
                const tocEntries = pages.map(p => {
                    const e = { order: pages.indexOf(p)+1, name: p.name || (p.type==='structured' ? p.mainTitle : 'Code Page'), firstPage: running };
                    running += 1; return e;
                });
                for (let p = 0; p < tocPages; p++) container.appendChild(buildTocPage(p + 1, tocEntries.slice(p * MAX_TOC_PER_PAGE, (p + 1) * MAX_TOC_PER_PAGE)));
                let pageNum = tocPages + 2;
                for (let p = 0; p < swPages; p++) {
                    container.appendChild(buildSightWordsPage(pageNum++, sightWords.slice(p * MAX_SIGHT_WORDS_PER_PAGE, (p + 1) * MAX_SIGHT_WORDS_PER_PAGE)));
                }
                pageNum = lessonStart;
                pages.forEach(p => {
                    if (p.type === 'structured') container.appendChild(buildStructuredPage(p, pageNum));
                    else container.appendChild(buildCodePage(p, pageNum));
                    pageNum++;
                });
            }

            // Unsaved changes warning

            window.addEventListener('beforeunload', (e) => {
                if (formDirty) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });
            document.addEventListener('input', e => {
                if (e.target.closest('#editPanel')) markDirty();

            window.editPage = function(id) {
                if (formDirty) {
                    if (!confirm('You have unsaved changes. Discard them?')) return;
                }
                const page = pages.find(p => p.id === id);
                if (!page) return showToast('Page not found.', 'error');

                document.getElementById('formTitle').textContent = '✏️ Edit Page';
                fillForm(page);
                document.getElementById('saveBtn').textContent = '💾 Update Page';

                switchTab('edit');
                updateHistoryUI();
            };
            window.cancelEdit = function() {
                if (formDirty) {
                    if (!confirm('Discard unsaved changes?')) return;
                }
                resetForm();
                clearDirty();
                switchTab('view');
                showToast('Edit cancelled.', 'info');
            };
            window.savePage = function() {
                if (pages.length >= MAX_PAGES && !editingPageId) {
                    showToast(`Maximum ${MAX_PAGES} pages reached.`, 'error');
                    return;
                }
                const pageType = document.getElementById('pageTypeSelect').value;
                const name = document.getElementById('fPageName')?.value.trim() || 'Page';
                let newPage;
                if (pageType === 'structured') {
                    newPage = {
                        id: editingPageId || generatePageId(),
                        type: 'structured',
                        name: name,
                        mainTitle: document.getElementById('fMainTitle').value.trim() || 'Untitled',
                        subtitle: document.getElementById('fSubtitle').value.trim() || 'SHORT VOWEL',
                        sections: JSON.parse(JSON.stringify(tempSections))
                    };
                } else {
                    newPage = {
                        id: editingPageId || generatePageId(),
                        type: 'code',
                        name: name,
                        html: document.getElementById('codeHTML').value,
                        css: document.getElementById('codeCSS').value,
                        width: Math.min(850, parseInt(document.getElementById('codeWidth').value) || 850),
                        height: Math.min(1100, parseInt(document.getElementById('codeHeight').value) || 1100),
                        border: document.getElementById('codeBorder').value || '1px solid #000',
                        background: document.getElementById('codeBackground').value || '#fff'
                    };
                }
                if (editingPageId) {
                    const idx = pages.findIndex(p => p.id === editingPageId);
                    if (idx !== -1) pages[idx] = newPage;
                } else {
                    pages.push(newPage);
                }
                persistState();
                clearDirty();
                resetForm();
                refreshUI();
                switchTab('view');
                showToast('Page saved.', 'success');
            };

            window.deletePage = function(id) {
                const page = pages.find(p => p.id === id);
                if (!page) return;
                confirmDialog(`Delete page "${page.name}"?`, () => {
                    pages = pages.filter(p => p.id !== id);
                    if (editingPageId === id) resetForm();
                    persistState();
                    refreshUI();
                });
            };
            window.duplicatePage = function(id) {
                if (pages.length >= MAX_PAGES) {
                    showToast(`Maximum ${MAX_PAGES} pages reached.`, 'error');
                    return;
                }
                const page = pages.find(p => p.id === id);
                if (!page) return;
                const copy = JSON.parse(JSON.stringify(page));
                copy.id = generatePageId();
                copy.name = (copy.name || 'Page') + ' (copy)';
                if (copy.type === 'structured') {
                    copy.sections = copy.sections.map(s => ({ ...s, id: generateSectionId() }));
                }
                pages.push(copy);
                persistState();
                refreshUI();
                showToast('Page duplicated.', 'success');
            };

            window.movePage = function(id, dir) {
                const idx = pages.findIndex(p => p.id === id);
                if (idx === -1) return;
                const newIdx = idx + dir;
                if (newIdx < 0 || newIdx >= pages.length) return;
                const temp = pages[idx];
                pages[idx] = pages[newIdx];
                pages[newIdx] = temp;
                persistState();
                refreshUI();
            };

            window.exportJSON = function() {
                const payload = { version: 2, pages, sightWords, coverData };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pages_v13.json'; a.click();
            };
            window.importJSON = function(input) {
                const file = input?.files?.[0];
                if (!file) return;
                if (file.size > MAX_FILE_SIZE) {
                    showToast('File is too large (max 10MB).', 'error');
                    input.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onerror = () => showToast('Could not read the JSON file.', 'error');
                reader.onload = e => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data || typeof data !== 'object' || !Array.isArray(data.pages)) throw new Error('Invalid structure');
                        const normalized = normalizeImportedState(data);
                        confirmDialog(`Replace all data with ${normalized.pages.length} page(s)?`, async () => {
                            const before = currentState();
                            pages = normalized.pages;
                            sightWords = normalized.sightWords;
                            coverData = normalized.coverData;
                            await persistState();
                            recordHistory(before, currentState());
                            resetForm();
                            refreshUI();
                            showToast('Data imported and validated.', 'success');
                        });
                    } catch (err) { console.error(err); showToast('Invalid or unsupported JSON file.', 'error'); }
                };
                reader.readAsText(file);
                input.value = '';
            };

            function wrapMutator(name) {
                const original = window[name];
                if (typeof original !== 'function') return;
                window[name] = async function(...args) {
                    const before = currentState();
                    const result = await original.apply(this, args);
                    const after = currentState();
                    recordHistory(before, after);
                    return result;
                };
            }
            ['savePage','deletePage','duplicatePage','movePage','saveSightWords','saveCover'].forEach(wrapMutator);

            function formatTextWithHighlight(text) {
                const formatted = sanitizeRichText(text);
                return formatted.replace(/\b(apple|egg|igloo|octopus|umbrella)\b/gi, m => `<span class="highlight">${m}</span>`);
            }
            function sanitizeRichText(text) {
                if (!text) return '';
                let esc = escapeHtml(text);
                esc = esc.replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>')
                    .replace(/&lt;i&gt;/g, '<i>').replace(/&lt;\/i&gt;/g, '</i>')
                    .replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>')
                    .replace(/&lt;strong&gt;/g, '<strong>').replace(/&lt;\/strong&gt;/g, '</strong>')
                    .replace(/&lt;em&gt;/g, '<em>').replace(/&lt;\/em&gt;/g, '</em>')
                    .replace(/&lt;span class=&quot;highlight&quot;&gt;/g, '<span class="highlight">')
                    .replace(/&lt;span class="highlight"&gt;/g, '<span class="highlight">')
                    .replace(/&lt;\/span&gt;/g, '</span>');
                return esc;
            }

                        <button class="btn btn-outline" id="redoBtn" onclick="redoLast()" title="Redo">↷ Redo</button><span class="history-status" id="historyStatus">No undo · No redo</span>
                        <button class="tab-btn" data-tab="pages" onclick="switchTab('pages')">📖 Pages</button>
                        <button class="tab-btn" data-tab="view" onclick="switchTab('view')">👁️ View</button>
                    </div>
                    <div class="tab-panel active" id="editPanel">
                        <div class="form-section">
                            <h2 id="formTitle">➕ Add New Page</h2>
                            <div class="form-group">
                                <label>Page Type</label>
                                <select id="pageTypeSelect" onchange="setPageType(this.value)">
                                    <option value="structured">Structured (Sections)</option>
                                    <option value="code">HTML / CSS Code</option>
                                </select>
                            </div>
                            <div class="form-group"><label>Page Name</label><input id="fPageName" value=""></div>
                            <div id="structuredFields">
                                <div class="form-group"><label>Main Title</label><input id="fMainTitle" value="SHORT VOWEL CVC WORDS" oninput="renderThumbnail()"></div>
                                <div class="form-group"><label>Subtitle</label><input id="fSubtitle" value="SHORT VOWEL" oninput="renderThumbnail()"></div>
                                <div class="section-card">
                                    <h4>Page Sections</h4>
                                    <p style="font-size:12px;color:#6c757d;margin-bottom:8px;">Add sections and choose their width.</p>
                                    <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
                                        ${Object.keys(SECTION_TYPES).map(type => `<button class="btn btn-outline btn-sm" onclick="addSection('${type}')">+ ${SECTION_TYPES[type].label}</button>`).join('')}
                                    </div>
                                    <div id="sectionsContainer"></div>
                                </div>
                            </div>
                            <div id="codeFields" style="display:none;">
                                <div class="form-group"><label>HTML</label><textarea id="codeHTML" rows="8" oninput="renderThumbnail()"></textarea></div>
                                <div class="form-group"><label>CSS</label><textarea id="codeCSS" rows="4" oninput="renderThumbnail()"></textarea></div>
                                <div style="display:flex; gap:10px;">
                                    <div class="form-group" style="flex:1;"><label>Width (px, max 850)</label><input id="codeWidth" type="number" value="850" min="100" max="850" oninput="renderThumbnail()"></div>
                                    <div class="form-group" style="flex:1;"><label>Height (px, max 1100)</label><input id="codeHeight" type="number" value="1100" min="100" max="1100" oninput="renderThumbnail()"></div>
                                </div>
                                <div class="form-group"><label>Border</label><input id="codeBorder" value="1px solid #000" oninput="renderThumbnail()"></div>
                                <div class="form-group"><label>Background</label><input id="codeBackground" value="#fff" oninput="renderThumbnail()"></div>
                            </div>
                            <div class="thumbnail-wrapper">
                                <div class="thumb-label">📄 Live Page Preview</div>
                                <div class="thumbnail-container" id="thumbnailContainer"></div>
                            </div>
                            <div class="form-actions">
                                <button class="btn btn-primary" id="saveBtn" onclick="savePage()">💾 Save Page</button>
                                <button class="btn btn-outline" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
                            </div>
                        </div>
                    </div>
                    <div class="tab-panel" id="pagesPanel">
                        <div class="list-section">
                            <div style="margin-bottom:20px;border-bottom:2px solid #e9ecef;padding-bottom:20px;">
                                <h3>📘 Cover Page</h3>
                                <div class="form-group"><label>Cover Title</label><input id="coverTitleInput" value="${escapeHtml(coverData.title)}"></div>
                                <div class="form-group"><label>Cover Subtitle</label><input id="coverSubtitleInput" value="${escapeHtml(coverData.subtitle)}"></div>
                                <button class="btn btn-success btn-sm" onclick="saveCover()">💾 Save Cover</button>
                            </div>
                            <h2>📖 All Pages</h2>
                            <div class="list-toolbar">
                                <input class="search-box" placeholder="🔍 Search..." oninput="window.searchQuery=this.value;window.renderPageList()">
                                <span class="count" id="listCount">0/0</span>
                                <button class="btn btn-success btn-sm" onclick="exportJSON()">📤 Export</button>
                                <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">📥 Import</button>
                                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
                            </div>
                            <div class="lesson-list" id="pageList"></div>
                            <div style="margin-top:28px;border-top:2px solid #e9ecef;padding-top:20px;">
                                <h3>📝 Sight Words</h3>
                                <div class="form-group"><textarea id="fSightWords" rows="3"></textarea></div>
                                <button class="btn btn-success btn-sm" onclick="saveSightWords()">💾 Save Sight Words</button>
                                <div style="margin-top:10px;"><strong>Preview:</strong><div id="sightWordsPreview" style="margin-top:6px;"></div></div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-panel" id="viewPanel">
                        <div class="view-toolbar">
                            <span class="info" id="viewInfo">0 pages · 0 total pages</span>
                            <button class="btn btn-success" onclick="exportAllPages()">⬇ Export All</button>
                        </div>
                        <div class="view-container" id="viewContainer"></div>
                    </div>`;
                document.getElementById('fSightWords').value = sightWords.join(', ');
                resetForm();
                renderPageList();
                renderAllView();
                updateCounts();
                window.renderPageList = renderPageList;
                switchTab('edit');
            }

            initApp();
        })();
    </script>
</body>
</html>
