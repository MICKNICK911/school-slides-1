        container.innerHTML = html;
      }

      // ---------- Present Mode ----------
      const PRESENT_COLORS = ['red', 'orange', 'yellow', 'green', 'blue', 'indigo', 'violet', 'black', 'white', 'transparent'];
      let presentWordColors = {}; // key: "lineIdx-wordIdx" -> color name
      let presentSegmentMode = false;
      let presentSelectedLessonId = null;

      function populatePresentLessonSelect() {
        const sel = document.getElementById('presentLessonSelect');
        if (!sel) return;
        const prev = presentSelectedLessonId || sel.value;
        sel.innerHTML = '';
        const active = lessons.filter(l => l.title.trim());
        if (!active.length) {
          sel.innerHTML = '<option value="">No lessons</option>';
          presentSelectedLessonId = null;
          return;
        }
        active.forEach(l => {
          const opt = document.createElement('option');
          opt.value = l.id;
          opt.textContent = `Lesson ${l.lessonNumber}: ${l.title}`;
          sel.appendChild(opt);
        });
        if (prev && active.some(l => l.id === prev)) {
          sel.value = prev;
          presentSelectedLessonId = prev;
        } else {
          sel.value = active[0].id;
          presentSelectedLessonId = active[0].id;
        }
      }

      window.onPresentLessonChange = function() {
        const sel = document.getElementById('presentLessonSelect');
        presentSelectedLessonId = sel ? sel.value : null;
        presentWordColors = {}; // reset colors when changing lesson
        if (typeof closePresentQuiz === 'function') closePresentQuiz();
        renderPresentView();
      };

      window.onPresentSegmentToggle = function() {
        const cb = document.getElementById('presentSegmentToggle');
        presentSegmentMode = !!(cb && cb.checked);
      };

      window.clearPresentColors = function() {
        presentWordColors = {};
        renderPresentView();
        showToast('Word colors cleared.', 'info');
      };

      function cycleColor(current) {
        if (!current) return PRESENT_COLORS[0];
        const idx = PRESENT_COLORS.indexOf(current);
        if (idx === -1) return PRESENT_COLORS[0];
        return PRESENT_COLORS[(idx + 1) % PRESENT_COLORS.length];
      }

      function colorClass(name) {
        return name ? ('pw-' + name) : '';
      }

      function tokenizeSentence(sentence) {
        // Split into words keeping punctuation attached to the word for display
        return String(sentence || '').trim().split(/\s+/).filter(Boolean);
      }

      function renderPresentView() {
        const stage = document.getElementById('presentStage');
        if (!stage) return;
        const lesson = lessons.find(l => l.id === presentSelectedLessonId);
        if (!lesson) {
          stage.innerHTML = '<div class="present-empty">Select a lesson to present.</div>';
          return;
        }
        let runningTotal = 0;
        let linesHtml = '';
        lesson.storyLines.forEach((line, lineIdx) => {
          const words = tokenizeSentence(line.sentence);
          const wc = words.length;
          runningTotal += wc;
          const wordsHtml = words.map((w, wordIdx) => {
            const key = lineIdx + '-' + wordIdx;
            const col = presentWordColors[key] || '';
            return `<span class="present-word ${colorClass(col)}" data-line="${lineIdx}" data-word="${wordIdx}" data-text="${escapeHtml(w)}">${escapeHtml(w)}</span>`;
          }).join(' ');
          linesHtml += `<div class="present-line"><div class="present-sentence">${wordsHtml}</div><span class="present-wc">${runningTotal}</span></div>`;
        });
        stage.innerHTML = `
          <div class="present-header">
            <div class="present-title">Lesson ${escapeHtml(lesson.lessonNumber)} — ${escapeHtml(lesson.title)}</div>
            <div class="present-meta">Target: ${escapeHtml(lesson.targetSound)} · Grade ${escapeHtml(bookMeta.grade)}</div>
          </div>
          <div class="present-lines">${linesHtml}</div>
        `;
        // Bind taps
        stage.querySelectorAll('.present-word').forEach(el => {
          el.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const lineIdx = parseInt(el.dataset.line, 10);
            const wordIdx = parseInt(el.dataset.word, 10);
            const text = el.dataset.text || el.textContent;
            const key = lineIdx + '-' + wordIdx;
            if (presentSegmentMode) {
              openSegmentOverlay(text, key);
            } else {
              const next = cycleColor(presentWordColors[key]);
              presentWordColors[key] = next;
              // update class without full re-render to keep scroll position
              el.className = 'present-word ' + colorClass(next);
            }
          });
        });
      }

      function openSegmentOverlay(wordText, wordKey) {
        // Remove existing if any
        const existing = document.querySelector('.present-overlay');
        if (existing) existing.remove();

        const overlay = document.createElement('div');
        overlay.className = 'present-overlay';
        // Letter color state local to this open (start neutral; optional: seed from word color)
        const letterColors = {};

        const letters = Array.from(String(wordText));
        const lettersHtml = letters.map((ch, i) => {
          const display = ch === ' ' ? '\u00A0' : ch;
          return `<span class="present-overlay-letter" data-idx="${i}">${escapeHtml(display)}</span>`;
        }).join('');

        overlay.innerHTML = `
          <div class="present-overlay-inner">
            <div class="present-overlay-word">${lettersHtml}</div>
            <div class="present-overlay-hint">Tap a letter to cycle color · Tap outside the word to close</div>
          </div>
        `;
        document.body.appendChild(overlay);

        const wordEl = overlay.querySelector('.present-overlay-word');
        wordEl.addEventListener('click', (e) => e.stopPropagation());

        overlay.querySelectorAll('.present-overlay-letter').forEach(letterEl => {
          letterEl.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const idx = letterEl.dataset.idx;
            const next = cycleColor(letterColors[idx]);
            letterColors[idx] = next;
            letterEl.className = 'present-overlay-letter ' + colorClass(next);
          });
        });

        // Dismiss on background tap
        overlay.addEventListener('click', () => {
          overlay.remove();
        });
        // Escape key
        const onKey = (ev) => {
          if (ev.key === 'Escape') {
            overlay.remove();
            document.removeEventListener('keydown', onKey);
          }
        };
        document.addEventListener('keydown', onKey);
      }

      // ---------- Present Quiz (split-pane) ----------
      let quizState = { questions: [], index: 0, lessonId: null, open: false };

      function shuffleArray(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }

      function getQuizQuestions(lesson) {
        if (!lesson || !lesson.page2 || !lesson.page2.comprehension) return [];
        if (!lesson.page2.comprehension.enabled) return [];
        return (lesson.page2.comprehension.questions || []).filter(q =>
          q.type === 'objective' &&
          q.question && q.question.trim() &&
          Array.isArray(q.options) &&
          q.options.filter(o => o && String(o).trim()).length >= 2
        );
      }

      function prepareShuffledQuizQuestions(rawQuestions) {
        return rawQuestions.map(q => {
          const opts = (q.options || []).map(o => String(o).trim()).filter(Boolean);
          const storedCorrect = (typeof q.correctIndex === 'number' && q.correctIndex >= 0 && q.correctIndex < opts.length)
            ? q.correctIndex
            : 0;
          const correctText = opts[storedCorrect];
          const shuffled = shuffleArray(opts);
          const newCorrectIndex = Math.max(0, shuffled.indexOf(correctText));
          return {
            question: q.question,
            options: shuffled,
            correctIndex: newCorrectIndex
          };
        });
      }

      function setQuizOpen(open) {
        quizState.open = !!open;
        const workspace = document.getElementById('presentWorkspace');
        const btn = document.getElementById('presentQuizBtn');
        if (workspace) workspace.classList.toggle('quiz-open', quizState.open);
        if (btn) {
          btn.classList.toggle('btn-warning', quizState.open);
          btn.classList.toggle('btn-primary', !quizState.open);
          btn.textContent = quizState.open ? '✕ Hide Quiz' : '❓ Quiz';
          btn.title = quizState.open ? 'Hide quiz side panel' : 'Show quiz side panel';
        }
      }

      window.startPresentQuiz = function() {
        if (quizState.open) {
          closePresentQuiz();
          return;
        }
        const lesson = lessons.find(l => l.id === presentSelectedLessonId);
        if (!lesson) return showToast('Select a lesson first.', 'warning');
        const raw = getQuizQuestions(lesson);
        if (!raw.length) {
          return showToast('No multiple-choice questions for this lesson. Add some in Edit Readers and mark the correct answer.', 'warning');
        }
        const questions = prepareShuffledQuizQuestions(raw);
        const existingSeg = document.querySelector('.present-overlay');
        if (existingSeg) existingSeg.remove();
        quizState = { questions, index: 0, lessonId: lesson.id, open: true };
        setQuizOpen(true);
        renderQuizPanel();
      };

      function closePresentQuiz() {
        removeQuizDomOnly();
        quizState = { questions: [], index: 0, lessonId: null, open: false };
        setQuizOpen(false);
      }

      function removeQuizDomOnly() {
        const pane = document.getElementById('presentQuizPane');
        if (pane) pane.innerHTML = '';
        document.querySelectorAll('body > .present-quiz-panel, body > .present-quiz-feedback').forEach(el => el.remove());
      }

      function renderQuizPanel() {
        const pane = document.getElementById('presentQuizPane');
        if (!pane) return;
        pane.innerHTML = '';
        const q = quizState.questions[quizState.index];
        if (!q) return;

        const opts = (q.options || []).map(o => String(o).trim()).filter(Boolean);
        const correctIndex = (typeof q.correctIndex === 'number' && q.correctIndex >= 0 && q.correctIndex < opts.length)
          ? q.correctIndex
          : 0;

        const card = document.createElement('div');
        card.className = 'present-quiz-card';
        card.innerHTML = `
          <div class="present-quiz-progress">Question ${quizState.index + 1} of ${quizState.questions.length}</div>
          <div class="present-quiz-question">${escapeHtml(q.question)}</div>
          <div class="present-quiz-options">
            ${opts.map((opt, i) =>
              `<button type="button" class="present-quiz-opt" data-opt="${i}">${escapeHtml(opt)}</button>`
            ).join('')}
          </div>
          <div class="present-quiz-actions">
            <button type="button" class="btn btn-outline btn-sm" id="quizCloseBtn">Hide Quiz</button>
            <span class="hint">Tap an answer</span>
          </div>
        `;
        pane.appendChild(card);

        const closeBtn = card.querySelector('#quizCloseBtn');
        if (closeBtn) closeBtn.onclick = () => closePresentQuiz();

        card.querySelectorAll('.present-quiz-opt').forEach(btn => {
          btn.addEventListener('click', () => {
            const chosen = parseInt(btn.dataset.opt, 10);
            const isCorrect = chosen === correctIndex;
            card.querySelectorAll('.present-quiz-opt').forEach(b => { b.disabled = true; });
            showQuizFeedback(isCorrect, () => {
              if (!quizState.open) return;
              if (quizState.index < quizState.questions.length - 1) {
                quizState.index += 1;
                renderQuizPanel();
              } else {
                closePresentQuiz();
                showToast('Quiz complete!', 'success');
              }
            });
          });
        });
      }

      function showQuizFeedback(isCorrect, onDone) {
        const pane = document.getElementById('presentQuizPane');
        if (!pane) {
          if (typeof onDone === 'function') onDone();
          return;
        }
        const existing = pane.querySelector('.present-quiz-feedback');
        if (existing) existing.remove();
        const fb = document.createElement('div');
        fb.className = 'present-quiz-feedback ' + (isCorrect ? 'correct' : 'wrong');
        fb.innerHTML = `<div class="present-quiz-feedback-text">${isCorrect ? '✓ Correct!' : '✗ Wrong'}</div>`;
        pane.appendChild(fb);
        setTimeout(() => {
          fb.remove();
          if (typeof onDone === 'function') onDone();
        }, 2000);
      }

            window.switchTab = function(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === tab+'Panel'));
        if (tab === 'edit') { renderEditList(); renderThumbnail(); populateSpriteSheetSelect(); }
        if (tab === 'view') renderAllView();
        if (tab === 'book') {
          document.getElementById('coverTitleInput').value = bookMeta.title;
          document.getElementById('coverSubtitleInput').value = bookMeta.subtitle;
          document.getElementById('globalGradeInput').value = bookMeta.grade;
          document.getElementById('tocToggle').checked = bookMeta.showToc;
          document.getElementById('sightWordsToggle').checked = bookMeta.sightWords.enabled;
          document.getElementById('sightWordsTitle').value = bookMeta.sightWords.title;
          document.getElementById('sightColumns').value = bookMeta.sightWords.columns;
          document.getElementById('sightWordsText').value = bookMeta.sightWords.rawText;
          toggleSightWordsFields();
          renderSpriteSheetsList();
          renderEditList();
          renderTocPreview();
        }
        if (tab === 'present') {
          populatePresentLessonSelect();
          renderPresentView();
        } else {
          if (typeof closePresentQuiz === 'function') closePresentQuiz();
        }
        if (tab !== 'view') previewLessonOverride = null;
        updateCounts();
      };

        document.getElementById('sightWordsFields').style.display = enabled ? 'block' : 'none';

        resetForm();
        renderEditList();
        renderAllView();
        updateCounts();
        renderTocPreview();

        const list = document.getElementById('lessonList');
        list.addEventListener('dragstart', e => {
          const item = e.target.closest('.lesson-item');
          if (item) { item.classList.add('dragging'); e.dataTransfer.setData('text/plain', item.dataset.id); }
        });
        list.addEventListener('dragend', e => {
          const item = e.target.closest('.lesson-item');
          if (item) item.classList.remove('dragging');
          list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        });
        list.addEventListener('dragover', e => {
          e.preventDefault();
          const target = e.target.closest('.lesson-item');
          list.querySelectorAll('.drag-over').forEach(el => { if (el !== target) el.classList.remove('drag-over'); });
          if (target && !target.classList.contains('dragging')) target.classList.add('drag-over');
        });
        list.addEventListener('dragleave', e => {
          const target = e.target.closest('.lesson-item');
          if (target) target.classList.remove('drag-over');
        });
        list.addEventListener('drop', e => {
          e.preventDefault();
          list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
          const id = e.dataTransfer.getData('text/plain');
          const target = e.target.closest('.lesson-item');
          if (id && target && target.dataset.id !== id) {
            const fromIdx = lessons.findIndex(l => l.id === id);
            const toIdx = lessons.findIndex(l => l.id === target.dataset.id);
            if (fromIdx !== -1 && toIdx !== -1) {
              const [moved] = lessons.splice(fromIdx, 1);
              lessons.splice(toIdx, 0, moved);
              renumberByOrder(lessons);
              saveData(); refreshUI(); showToast('Order updated.', 'info');
            }
          }
        });

        renderThumbnail();
      }

      initApp();
    })();
  </script>
