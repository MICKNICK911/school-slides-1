<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLM</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --drawer-bg: #2c3e50;
            --drawer-text: white;
            --drawer-hover: #34495e;
            --drawer-active-bg: #3498db;
            --drawer-active-border: #1abc9c;
            --table-bg: white;
            --table-border: #ddd;
            --th-bg: #f2f2f2;
            --th-color: #2c3e50;
            --td-bg: white;
            --phonogram-header-bg: #e8e8e8;
            --text: #333;
            --heading-color: #2c3e50;
            --muted: #666;
            --border-color: #ddd;
            --overlay-bg: rgba(0,0,0,0.5);
            --table-shadow: 0 0 10px rgba(0,0,0,0.1);
            --topic-title-border: #eee;
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --drawer-bg: #1e1e1e;
            --drawer-text: #ddd;
            --drawer-hover: #2a2a2a;
            --drawer-active-bg: #2563eb;
            --drawer-active-border: #34d399;
            --table-bg: #2c2c2c;
            --table-border: #444;
            --th-bg: #3a3a3a;
            --th-color: #ddd;
            --td-bg: #2c2c2c;
            --phonogram-header-bg: #444;
            --text: #ddd;
            --heading-color: #ddd;
            --muted: #aaa;
            --border-color: #444;
            --overlay-bg: rgba(0,0,0,0.7);
            --table-shadow: 0 0 10px rgba(0,0,0,0.3);
            --topic-title-border: #444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }
        
        /* Drawer */
        .drawer {
            width: 250px;
            background-color: var(--drawer-bg);
            color: var(--drawer-text);
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 100;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        
        .drawer h2 {
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--drawer-hover);
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        
        .topic-list {
            list-style: none;
        }
        
        .topic-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: background-color 0.2s;
            border-left: 4px solid transparent;
        }
        
        .topic-item:hover {
            background-color: var(--drawer-hover);
        }
        
        .topic-item.active {
            background-color: var(--drawer-active-bg);
            border-left-color: var(--drawer-active-border);
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 20px;
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }
        
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text);
        }
        
        h1 {
            color: var(--heading-color);
            font-size: 1.8rem;
        }

        /* Theme toggle */
        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            color: var(--text);
        }
        .theme-toggle:hover {
            background-color: var(--th-bg);
        }
        
        /* Tables */
        .topic-container {
            margin-bottom: 40px;
        }
        
        .table-container {
            background-color: var(--table-bg);
            padding: 30px;
            border-radius: 5px;
            box-shadow: var(--table-shadow);
            margin: 0 auto 20px auto;   /* centred */
            max-width: 900px;
        }
        
        .topic-title {
            text-align: center;
            margin-bottom: 25px;
            color: var(--heading-color);
            font-size: 1.5rem;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--topic-title-border);
        }
        
        /* Explanation key */
        .explanation-key {
            background-color: var(--th-bg);
            border-radius: 5px;
            padding: 15px 20px;
            margin: 0 auto 25px auto;
            max-width: 600px;
            font-size: 0.95rem;
            text-align: center;
        }
        .explanation-key strong {
            color: var(--heading-color);
        }
        
        table {
            margin: 0 auto;            /* centre the table itself */
            width: auto;
            max-width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            border: 1px solid var(--table-border);
            padding: 12px;
            text-align: center;
            font-size: 16px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        th {
            background-color: var(--th-bg);
            font-weight: bold;
            color: var(--th-color);
            min-width: 80px;
        }
        
        td {
            background-color: var(--td-bg);
            min-height: 50px;
        }
        
        .phonogram-header {
            font-weight: bold;
            background-color: var(--phonogram-header-bg);
        }
        
        .empty-cell {
            color: #999;
            font-style: italic;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .drawer {
                transform: translateX(-100%);
                width: 280px;
            }
            .drawer.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 15px;
            }
            .menu-toggle {
                display: block;
            }
            .table-container {
                padding: 15px;
                max-width: 100%;
            }
            th, td {
                padding: 8px;
                font-size: 14px;
            }
            .overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: var(--overlay-bg);
                z-index: 99;
            }
            .overlay.active {
                display: block;
            }
        }
        
        @media (max-width: 480px) {
            h1 { font-size: 1.3rem; }
            .topic-title { font-size: 1.2rem; }
            th, td { padding: 6px; font-size: 13px; }
            table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>
    <nav class="drawer" id="drawer">
        <h2>Word Patterns</h2>
        <ul class="topic-list" id="topic-list"></ul>
    </nav>
    
    <div class="overlay" id="overlay"></div>
    
    <main class="main-content">
        <header class="header">
            <button class="menu-toggle" id="menu-toggle">☰</button>
            <h1></h1>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
        </header>
        <div id="content-container"></div>
    </main>

    <script>
        // Word bank with the new structure: topic name + data + exp
        const wordTables = [
    {
        "Multiplication Tables 2-12": {
            "2×": ["2×1=2", "2×2=4", "2×3=6", "2×4=8", "2×5=10", "2×6=12", "2×7=14", "2×8=16", "2×9=18", "2×10=20", "2×11=22", "2×12=24"],
            "3×": ["3×1=3", "3×2=6", "3×3=9", "3×4=12", "3×5=15", "3×6=18", "3×7=21", "3×8=24", "3×9=27", "3×10=30", "3×11=33", "3×12=36"],
            "4×": ["4×1=4", "4×2=8", "4×3=12", "4×4=16", "4×5=20", "4×6=24", "4×7=28", "4×8=32", "4×9=36", "4×10=40", "4×11=44", "4×12=48"],
            "5×": ["5×1=5", "5×2=10", "5×3=15", "5×4=20", "5×5=25", "5×6=30", "5×7=35", "5×8=40", "5×9=45", "5×10=50", "5×11=55", "5×12=60"],
            "6×": ["6×1=6", "6×2=12", "6×3=18", "6×4=24", "6×5=30", "6×6=36", "6×7=42", "6×8=48", "6×9=54", "6×10=60", "6×11=66", "6×12=72"],
            "7×": ["7×1=7", "7×2=14", "7×3=21", "7×4=28", "7×5=35", "7×6=42", "7×7=49", "7×8=56", "7×9=63", "7×10=70", "7×11=77", "7×12=84"],
            "8×": ["8×1=8", "8×2=16", "8×3=24", "8×4=32", "8×5=40", "8×6=48", "8×7=56", "8×8=64", "8×9=72", "8×10=80", "8×11=88", "8×12=96"],
            "9×": ["9×1=9", "9×2=18", "9×3=27", "9×4=36", "9×5=45", "9×6=54", "9×7=63", "9×8=72", "9×9=81", "9×10=90", "9×11=99", "9×12=108"],
            "10×": ["10×1=10", "10×2=20", "10×3=30", "10×4=40", "10×5=50", "10×6=60", "10×7=70", "10×8=80", "10×9=90", "10×10=100", "10×11=110", "10×12=120"],
            "11×": ["11×1=11", "11×2=22", "11×3=33", "11×4=44", "11×5=55", "11×6=66", "11×7=77", "11×8=88", "11×9=99", "11×10=110", "11×11=121", "11×12=132"],
            "12×": ["12×1=12", "12×2=24", "12×3=36", "12×4=48", "12×5=60", "12×6=72", "12×7=84", "12×8=96", "12×9=108", "12×10=120", "12×11=132", "12×12=144"]
        },
        exp: "Complete multiplication tables from 2 to 12, with each column showing the full set of equations (×1 through ×12)."
    },
    {
        "Number Words": {
            "1–10": ["1 – one", "2 – two", "3 – three", "4 – four", "5 – five", "6 – six", "7 – seven", "8 – eight", "9 – nine", "10 – ten"],
            "11–20": ["11 – eleven", "12 – twelve", "13 – thirteen", "14 – fourteen", "15 – fifteen", "16 – sixteen", "17 – seventeen", "18 – eighteen", "19 – nineteen", "20 – twenty"],
            "Tens (30–100)": ["30 – thirty", "40 – forty", "50 – fifty", "60 – sixty", "70 – seventy", "80 – eighty", "90 – ninety", "100 – one hundred"]
        },
        exp: "Number words for counting: 1–10, 11–20, and tens from 30 up to 100."
    },
    {
        "Ordinal Numbers": {
            "1st–10th": ["1st – first", "2nd – second", "3rd – third", "4th – fourth", "5th – fifth", "6th – sixth", "7th – seventh", "8th – eighth", "9th – ninth", "10th – tenth"],
            "11th–20th": ["11th – eleventh", "12th – twelfth", "13th – thirteenth", "14th – fourteenth", "15th – fifteenth", "16th – sixteenth", "17th – seventeenth", "18th – eighteenth", "19th – nineteenth", "20th – twentieth"],
            "31st–40th": ["31st – thirty-first", "32nd – thirty-second", "33rd – thirty-third", "34th – thirty-fourth", "35th – thirty-fifth", "36th – thirty-sixth", "37th – thirty-seventh", "38th – thirty-eighth", "39th – thirty-ninth", "40th – fortieth"],
            "Tens (30th–100th)": ["30th – thirtieth", "40th – fortieth", "50th – fiftieth", "60th – sixtieth", "70th – seventieth", "80th – eightieth", "90th – ninetieth", "100th – one hundredth"]
        },
        exp: "Ordinal numbers (position words): 1st–10th, 11th–20th, 31st–40th, and tens from 30th to 100th."
    }
];

        // ---- Helper: get topic name and data from the new shape ----
        function getTopicInfo(tableObj) {
            const topicName = Object.keys(tableObj).find(key => key !== 'exp');
            const tableData = tableObj[topicName];
            return { topicName, tableData };
        }

        // ---- Dark / Light Theme ----
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        applyTheme(savedTheme);
        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

        // ---- Drawer & Content ----
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('overlay');
        const menuToggle = document.getElementById('menu-toggle');
        const topicListEl = document.getElementById('topic-list');
        const contentContainer = document.getElementById('content-container');
        let activeTopicIndex = 0;

        function populateTopicList() {
            wordTables.forEach((tableObj, index) => {
                const { topicName } = getTopicInfo(tableObj);
                const li = document.createElement('li');
                li.className = `topic-item ${index === activeTopicIndex ? 'active' : ''}`;
                li.textContent = topicName;
                li.dataset.index = index;
                
                li.addEventListener('click', () => {
                    activeTopicIndex = index;
                    document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
                    li.classList.add('active');
                    generateTable(tableObj);
                    if (window.innerWidth <= 768) {
                        drawer.classList.remove('open');
                        overlay.classList.remove('active');
                    }
                });
                
                topicListEl.appendChild(li);
            });
        }

        function chunkArray(array) {
            const maxColumns = window.innerWidth <= 768 ? 4 : 10;
            const chunks = [];
            for (let i = 0; i < array.length; i += maxColumns) {
                chunks.push(array.slice(i, i + maxColumns));
            }
            return chunks;
        }

        function createSingleTable(columnData, columnKeys) {
            const container = document.createElement('div');
            container.className = 'table-container';
            
            const table = document.createElement('table');
            
            // Header
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            columnKeys.forEach(key => {
                const th = document.createElement('th');
                th.className = 'phonogram-header';
                th.textContent = key;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);
            
            // Body
            const tbody = document.createElement('tbody');
            const maxRows = Math.max(...columnKeys.map(key => columnData[key].length));
            for (let r = 0; r < maxRows; r++) {
                const row = document.createElement('tr');
                columnKeys.forEach(key => {
                    const td = document.createElement('td');
                    const val = columnData[key][r];
                    if (val !== undefined && val !== null && val !== '') {
                        td.textContent = val;
                    } else {
                        td.textContent = '-';
                        td.classList.add('empty-cell');
                    }
                    row.appendChild(td);
                });
                tbody.appendChild(row);
            }
            table.appendChild(tbody);
            container.appendChild(table);
            return container;
        }

        function buildExplanationKey(explanationText) {
            const keyDiv = document.createElement('div');
            keyDiv.className = 'explanation-key';
            keyDiv.innerHTML = `<strong>🔤 Explanation:</strong> ${explanationText}`;
            return keyDiv;
        }

        function generateTable(tableObj) {
            const { topicName, tableData } = getTopicInfo(tableObj);
            const allColumnKeys = Object.keys(tableData);
            const explanation = tableObj.exp || '';
            
            contentContainer.innerHTML = '';
            const topicContainer = document.createElement('div');
            topicContainer.className = 'topic-container';
            
            // Title
            const title = document.createElement('h2');
            title.className = 'topic-title';
            title.textContent = topicName;
            topicContainer.appendChild(title);
            
            // Explanation key
            if (explanation) {
                topicContainer.appendChild(buildExplanationKey(explanation));
            }
            
            // Group columns into tables
            const columnGroups = chunkArray(allColumnKeys);
            columnGroups.forEach(group => {
                const groupData = {};
                group.forEach(key => { groupData[key] = tableData[key]; });
                topicContainer.appendChild(createSingleTable(groupData, group));
            });
            
            contentContainer.appendChild(topicContainer);
            
            // Update header
            document.querySelector('.header h1').textContent = `${topicName} (${allColumnKeys.length} columns)`;
        }

        function toggleDrawer() {
            drawer.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        menuToggle.addEventListener('click', toggleDrawer);
        overlay.addEventListener('click', toggleDrawer);

        function initApp() {
            populateTopicList();
            if (wordTables.length > 0) {
                generateTable(wordTables[0]);
            }
            if (window.innerWidth <= 768) {
                drawer.classList.remove('open');
                overlay.classList.remove('active');
            }
        }

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                drawer.classList.remove('open');
                overlay.classList.remove('active');
            }
        });

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
